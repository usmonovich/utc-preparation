<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Ленточная передача: у шкивов одинаковая линейная скорость υ₁ = υ₂, а меньший шкив вращается быстрее, ω₁ &gt; ω₂</title><path class="s-ink" d="M80,74L248,42A58,58 0 0 1 248,158L80,126A26,26 0 0 1 80,74Z" stroke-width="3" fill="none"/><path class="s-red" d="M80,74L248,42A58,58 0 0 1 248,158L80,126A26,26 0 0 1 80,74Z" stroke-width="3" stroke-dasharray="6 14" fill="none"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.66s" repeatCount="indefinite"/></path><circle class="f-soft s-acc" cx="80" cy="100" r="26" stroke-width="2"/><g><animateTransform attributeName="transform" type="rotate" values="0 80 100;360 80 100" dur="5.38s" repeatCount="indefinite"/><line class="s-ink" x1="80" y1="100" x2="102" y2="100" stroke-width="2"/><line class="s-ink" x1="80" y1="100" x2="69" y2="119.05" stroke-width="2"/><line class="s-ink" x1="80" y1="100" x2="69" y2="80.95" stroke-width="2"/></g><circle class="f-ink" cx="80" cy="100" r="4"/><text class="t" x="80" y="148" text-anchor="middle">R₁</text><circle class="f-soft s-acc" cx="248" cy="100" r="58" stroke-width="2"/><g><animateTransform attributeName="transform" type="rotate" values="0 248 100;360 248 100" dur="12s" repeatCount="indefinite"/><line class="s-ink" x1="248" y1="100" x2="302" y2="100" stroke-width="2"/><line class="s-ink" x1="248" y1="100" x2="221" y2="146.77" stroke-width="2"/><line class="s-ink" x1="248" y1="100" x2="221" y2="53.23" stroke-width="2"/></g><circle class="f-ink" cx="248" cy="100" r="4"/><text class="t" x="248" y="180" text-anchor="middle">R₂</text><text class="t-s" x="180" y="198" text-anchor="middle">υ₁ = υ₂, R₁ &lt; R₂ ⇒ ω₁ &gt; ω₂</text></svg>
