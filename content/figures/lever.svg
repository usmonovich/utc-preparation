<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Правило моментов: груз F₂ = 10 Н двигают вдоль рычага; рычаг встаёт горизонтально, когда F₁d₁ = F₂d₂ (30 Н · 0,2 м = 10 Н · 0,6 м)</title><path class="f-mute" d="M136,152L150,120L164,152Z"/><path class="s-mute" d="M60,152H300" stroke-width="2"/><g><animateTransform attributeName="transform" type="rotate" values="-12 150 120;-9 150 120;0 150 120;0 150 120;9 150 120;0 150 120;0 150 120;-12 150 120" keyTimes="0;0.18;0.34;0.5;0.66;0.8;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-ink" x="82.0" y="116" width="260.0" height="8" rx="3"/><rect class="f-red" x="88.0" y="88" width="28" height="28" rx="3"/><text class="t-w" x="102" y="107" text-anchor="middle">F<tspan baseline-shift="sub" font-size="0.72em">1</tspan></text><g><animateTransform attributeName="transform" type="translate" values="72 0;108 0;144 0;144 0;180 0;144 0;144 0;72 0" keyTimes="0;0.18;0.34;0.5;0.66;0.8;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-acc" x="139" y="94" width="22" height="22" rx="3"/><text class="t-ws" x="150" y="110" text-anchor="middle">F<tspan baseline-shift="sub" font-size="0.72em">2</tspan></text></g></g><text class="t-s" x="102" y="150" text-anchor="middle">d₁ = 0,2 м</text><text class="t-red" x="60" y="30" text-anchor="start">F₁ = 30 Н</text><text class="t-acc" x="60" y="50" text-anchor="start">F₂ = 10 Н</text><g opacity="0"><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.34;0.66;0.8;0.95" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-grn" x="250" y="30" text-anchor="middle">равновесие: d₂ = 0,6 м</text><text class="t-grn" x="250" y="50" text-anchor="middle">F₁d₁ = F₂d₂</text></g><text class="t-s" x="180" y="196" text-anchor="middle">M = F·d; рычаг в равновесии, когда моменты равны</text></svg>
