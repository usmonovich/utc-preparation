<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Изотопы водорода: у ¹H, ²H и ³H по одному протону, а нейтронов 0, 1 и 2; затем изотоны ³H и ⁴He — у обоих по два нейтрона</title><g><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;0.98" dur="8s" repeatCount="indefinite" calcMode="discrete"/><g><g><circle class="f-red" cx="70" cy="90" r="9"/><text class="t-ws" x="70" y="93" text-anchor="middle">p</text></g></g><text class="t" x="70" y="148" text-anchor="middle">¹H: 1p + 0n</text><g><g><circle class="f-red" cx="180" cy="90" r="9"/><text class="t-ws" x="180" y="93" text-anchor="middle">p</text></g><g><circle class="f-mute" cx="193.26" cy="95.61" r="9"/><text class="t-ws" x="193.26" y="98.61" text-anchor="middle">n</text></g></g><text class="t" x="180" y="148" text-anchor="middle">²H: 1p + 1n</text><g><g><circle class="f-red" cx="290" cy="90" r="9"/><text class="t-ws" x="290" y="93" text-anchor="middle">p</text></g><g><circle class="f-mute" cx="303.26" cy="95.61" r="9"/><text class="t-ws" x="303.26" y="98.61" text-anchor="middle">n</text></g><g><circle class="f-mute" cx="291.78" cy="104.29" r="9"/><text class="t-ws" x="291.78" y="107.29" text-anchor="middle">n</text></g></g><text class="t" x="290" y="148" text-anchor="middle">³H: 1p + 2n</text><text class="t-s" x="180" y="184" text-anchor="middle">изотопы: протонов поровну (Z = 1), нейтронов разное число</text><text class="t-red" x="180" y="30" text-anchor="middle">изотопы водорода</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.98" dur="8s" repeatCount="indefinite" calcMode="discrete"/><g><g><circle class="f-red" cx="110" cy="90" r="9"/><text class="t-ws" x="110" y="93" text-anchor="middle">p</text></g><g><circle class="f-mute" cx="123.26" cy="95.61" r="9"/><text class="t-ws" x="123.26" y="98.61" text-anchor="middle">n</text></g><g><circle class="f-mute" cx="111.78" cy="104.29" r="9"/><text class="t-ws" x="111.78" y="107.29" text-anchor="middle">n</text></g></g><text class="t" x="110" y="148" text-anchor="middle">³H: 1p + 2n</text><g><g><circle class="f-red" cx="250" cy="90" r="9"/><text class="t-ws" x="250" y="93" text-anchor="middle">p</text></g><g><circle class="f-mute" cx="263.26" cy="95.61" r="9"/><text class="t-ws" x="263.26" y="98.61" text-anchor="middle">n</text></g><g><circle class="f-red" cx="251.78" cy="104.29" r="9"/><text class="t-ws" x="251.78" y="107.29" text-anchor="middle">p</text></g><g><circle class="f-mute" cx="238.51" cy="98.68" r="9"/><text class="t-ws" x="238.51" y="101.68" text-anchor="middle">n</text></g></g><text class="t" x="250" y="148" text-anchor="middle">⁴He: 2p + 2n</text><text class="t-s" x="180" y="184" text-anchor="middle">изотоны: нейтронов поровну (по 2)</text><text class="t-acc" x="180" y="30" text-anchor="middle">изотоны</text></g></svg>
