<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="inherit"><title>Золотое правило механики: по наклонной плоскости груз втаскивают силой F = mg·h/l, меньшей веса, но проходят путь l, больший высоты h; работа F·l равна работе mg·h при подъёме по вертикали — выигрыша в работе нет</title><path class="f-soft" d="M24,170L214,170L214,95Z"/><path class="s-ink" d="M24,170L214,95V170H24" stroke-width="2" fill="none"/><path class="s-ink" d="M58,170A34,34 0 0 0 55.63,157.52" stroke-width="1.4" fill="none"/><text class="t" x="70" y="165" text-anchor="middle">α</text><text class="t-red" x="224" y="136.5" text-anchor="start">h</text><text class="t-acc" x="109.86" y="105.48" text-anchor="middle">l</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;152.79 -60.31;152.79 -60.31;0 0" keyTimes="0;0.12;0.62;0.78;1" dur="5s" repeatCount="indefinite"/><g transform="translate(29.58 167.8) rotate(-21.54)"><rect class="f-red" x="0" y="-22" width="22" height="22" rx="3"/><line class="s-acc" x1="22" y1="-11" x2="39.83" y2="-11" stroke-width="2.6"/><path class="f-acc" d="M44.03,-11L37.03,-14.85L37.03,-7.15Z"/><text class="t-acc" x="35.01" y="-16" text-anchor="middle">F</text></g></g><path class="s-mute" d="M266,170H326M318,170V95" stroke-width="1.6" stroke-dasharray="4 3"/><text class="t-red" x="324" y="136.5" text-anchor="start">h</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -75;0 -75;0 0" keyTimes="0;0.12;0.62;0.78;1" dur="5s" repeatCount="indefinite"/><rect class="f-red" x="285" y="148" width="22" height="22" rx="3"/><line class="s-red" x1="296" y1="148" x2="296" y2="92.2" stroke-width="2.6"/><path class="f-red" d="M296,88L292.15,95L299.85,95Z"/><text class="t-red" x="288" y="100" text-anchor="end">mg</text></g><text class="t-acc" x="118" y="192" text-anchor="middle">F = mg·h/l, путь l</text><text class="t-red" x="296" y="192" text-anchor="middle">F = mg, путь h</text><text class="t-s" x="1