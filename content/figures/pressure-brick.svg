<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Давление бруска: на узкой грани площадь меньше и давление больше — брусок глубже вдавливается в песок; p ~ 1/S</title><rect class="f-mute" x="25" y="150" width="150" height="34" opacity="0.35"/><path class="s-ink" d="M25,150H175" stroke-width="1.6"/><rect class="f-paper" x="80.0" y="150" width="40" height="0"><animate attributeName="height" values="0;0;22;22;0" keyTimes="0;0.3;0.55;0.9;1" dur="4s" repeatCount="indefinite"/></rect><g><animateTransform attributeName="transform" type="translate" values="0 -50;0 0;0 22;0 22;0 -50" keyTimes="0;0.3;0.55;0.9;1" dur="4s" repeatCount="indefinite"/><rect class="f-red" x="80.0" y="60" width="40" height="90" rx="2"/></g><text class="t-s" x="100" y="198" text-anchor="middle">p₁ — больше</text><rect class="f-mute" x="175" y="150" width="150" height="34" opacity="0.35"/><path class="s-ink" d="M175,150H325" stroke-width="1.6"/><rect class="f-paper" x="195.0" y="150" width="110" height="0"><animate attributeName="height" values="0;0;7;7;0" keyTimes="0;0.3;0.55;0.9;1" dur="4s" repeatCount="indefinite"/></rect><g><animateTransform attributeName="transform" type="translate" values="0 -50;0 0;0 7;0 7;0 -50" keyTimes="0;0.3;0.55;0.9;1" dur="4s" repeatCount="indefinite"/><rect class="f-red" x="195.0" y="116" width="110" height="34" rx="2"/></g><text class="t-s" x="250" y="198" text-anchor="middle">p₂ — меньше</text><text class="t-s" x="180" y="24" text-anchor="middle">F₁ = F₂ = mg, но S₁ &lt; S₂</text></svg>
