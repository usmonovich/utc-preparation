<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Контакт заряженных шаров: после соединения проводом потенциалы выравниваются, а заряд делится пропорционально радиусам (1 см и 3 см: 8 нКл → 2 и 6 нКл)</title><path class="s-ink" d="M102,120Q165,170 194,134" stroke-width="2" fill="none" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.92" dur="8s" repeatCount="indefinite" calcMode="discrete"/></path><path class="s-red" d="M102,120Q165,170 194,134" stroke-width="3" fill="none" stroke-dasharray="5 10" opacity="0"><animate attributeName="stroke-dashoffset" values="15;0" dur="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.6" dur="8s" repeatCount="indefinite" calcMode="discrete"/></path><circle class="f-soft s-ink" cx="80" cy="110" r="22" stroke-width="2"/><circle class="f-soft s-ink" cx="250" cy="110" r="60" stroke-width="2"/><g><text class="t-red" x="96" y="114" text-anchor="middle">+</text></g><g><text class="t-red" x="91.31" y="125.31" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.34;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="80" y="130" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.34;0.38;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="68.69" y="125.31" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.38;0.42;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="64" y="114" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.46;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="68.69" y="102.69" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.46;0.5;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="80" y="98" text-anchor="middle">+</text></g><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.54;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="91.31" y="102.69" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.3;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="297.9" y="134.25" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.35;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="256.41" y="165.6" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.4;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="208.52" y="145.35" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.45;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="202.1" y="93.75" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.5;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="243.59" y="62.4" text-anchor="middle">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.51;0.55;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t-red" x="291.48" y="82.65" text-anchor="middle">+</text></g><text class="t-s" x="80" y="152" text-anchor="middle">R₁ = 1 см</text><text class="t-s" x="250" y="190" text-anchor="middle">R₂ = 3 см</text><g><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.6;0.92" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="180" y="26" text-anchor="middle">до контакта: q₁ = 8 нКл, q₂ = 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.92" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="180" y="26" text-anchor="middle">после: q₁' = 2 нКл, q₂' = 6 нКл</text><text class="t-s" x="180" y="44" text-anchor="middle">φ₁ = φ₂</text></g></svg>
