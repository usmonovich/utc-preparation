<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Дисперсия в треугольной призме: белый свет раскладывается в спектр; с ростом частоты показатель преломления растёт, поэтому фиолетовые лучи отклоняются сильнее красных</title><path class="f-soft s-ink" d="M170,30L100,170L240,170Z" stroke-width="2"/><path class="s-ink" d="M10,140L128,113" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.15;0.92;1" dur="6s" repeatCount="indefinite"/></path><text class="t-s" x="16" y="160" text-anchor="start">белый свет</text><path class="s-sp-r" d="M128,113L205,100L350,116" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><path class="s-sp-o" d="M128,113L207.25,104.5L350,133" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><path class="s-sp-y" d="M128,113L209.5,109L350,150" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><path class="s-sp-g" d="M128,113L211.75,113.5L350,167" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><path class="s-sp-b" d="M128,113L214,118L350,184" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><path class="s-sp-v" d="M128,113L216.25,122.5L350,201" stroke-width="2.4" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.15;0.45;0.92;1" dur="6s" repeatCount="indefinite"/></path><text class="t-s" x="352" y="106" text-anchor="end">красный</text><text class="t-s" x="352" y="216" text-anchor="end">фиолетовый</text><text class="t-s" x="170" y="200" text-anchor="middle">ν↑ ⇒ n↑ ⇒ отклонение больше</text></svg>
