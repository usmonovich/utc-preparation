<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Температура смеси: смешали равные массы одной жидкости при 20 °C и 80 °C — температура смеси равна среднему арифметическому, 50 °C</title><rect class="f-acc" x="32" width="76" opacity="0.75"><animate attributeName="y" values="40;40;100;100;40" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="60;60;0;0;60" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/></rect><path class="s-ink" d="M30,20V100H110V20" stroke-width="2.4" fill="none"/><path class="s-ink" d="M110,90H150" stroke-width="5"/><text class="t-s" x="70" y="16" text-anchor="middle">m, 20 °C</text><rect class="f-red" x="252" width="76" opacity="0.75"><animate attributeName="y" values="40;40;100;100;40" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="60;60;0;0;60" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/></rect><path class="s-ink" d="M250,20V100H330V20" stroke-width="2.4" fill="none"/><path class="s-ink" d="M250,90H210" stroke-width="5"/><text class="t-s" x="290" y="16" text-anchor="middle">m, 80 °C</text><rect class="f-acc" x="148" y="92" width="4" height="66" opacity="0"><animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.1;0.6;0.601;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></rect><rect class="f-red" x="208" y="92" width="4" height="66" opacity="0"><animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.1;0.6;0.601;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></rect><rect class="f-acc" x="122" width="116" opacity="0.6"><animate attributeName="y" values="216;216;156;156;216" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;60;60;0" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/></rect><rect class="f-red" x="122" width="116" opacity="0.45"><animate attributeName="y" values="216;216;156;156;216" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;60;60;0" keyTimes="0;0.1;0.6;0.92;1" dur="8s" repeatCount="indefinite"/></rect><path class="s-ink" d="M120,130V218H240V130" stroke-width="2.4" fill="none"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.65;0.92;1" dur="8s" repeatCount="indefinite"/><text class="t" x="300" y="170" text-anchor="middle">2m, θ = 50 °C</text><text class="t-s" x="300" y="192" text-anchor="middle">θ = (t₁ + t₂)/2</text></g></svg>
