<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Путь и перемещение: точка движется по кривой траектории — путь L равен её длине, перемещение S соединяет начало и конец</title><defs><marker id="path-disp-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker></defs><path id="path-disp-tr" class="s-mute" d="M40,170C90,40 170,210 230,110S300,40 322,70" stroke-width="1.4" stroke-dasharray="3 5"/><path class="s-acc" d="M40,170C90,40 170,210 230,110S300,40 322,70" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.7;1" dur="6s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.7;1" dur="6s" repeatCount="indefinite"/><line class="s-red" x1="40" y1="170" x2="318" y2="72" stroke-width="2.6" marker-end="url(#path-disp-m-red)"></line><text class="t-red" x="170" y="140" text-anchor="middle">S</text></g><circle class="f-ink" cx="40" cy="170" r="4"/><text class="t-s" x="30" y="190" text-anchor="middle">начало</text><text class="t-s" x="330" y="92" text-anchor="middle">конец</text><circle class="f-ink" r="7"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"><mpath href="#path-disp-tr"/></animateMotion></circle><text class="t-acc" x="16" y="24" text-anchor="start">L — путь (длина траектории)</text><text class="t-red" x="16" y="44" text-anchor="start">S — перемещение (прямая)</text></svg>
