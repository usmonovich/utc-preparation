<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Ток в схеме с диодом: при прямом включении ток идёт по обеим ветвям, при обратном — только через 2R</title><g transform="translate(4,18)"><text class="t-s" x="85" y="0" text-anchor="middle">диод открыт</text><path class="s-ink" d="M8,80H20V35H150V80H162M20,80V125H150" stroke-width="2"/><path class="s-acc" d="M8,80H20V35H150V80H162" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.8s" repeatCount="indefinite"/></path><path class="s-acc" d="M20,80V125H150V80" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.8s" repeatCount="indefinite"/></path><path class="f-paper" d="M42,26h28v18h-28z"/><path class="f-ink" d="M46,27L62,35L46,43Z"/><path class="s-ink" d="M63,27V43" stroke-width="2.4"/><rect class="f-paper s-ink" x="88" y="28" width="38" height="14" stroke-width="2"/><text class="t-s" x="107" y="40" text-anchor="middle">R</text><rect class="f-paper s-ink" x="66" y="118" width="40" height="14" stroke-width="2"/><text class="t-s" x="86" y="130" text-anchor="middle">2R</text><text class="t" x="4" y="85" text-anchor="middle">+</text><text class="t" x="167" y="85" text-anchor="middle">−</text><text class="t" x="85" y="158" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">об</tspan> = 2R/3</text></g><g transform="translate(186,18)"><text class="t-s" x="85" y="0" text-anchor="middle">диод закрыт</text><path class="s-ink" d="M8,80H20V35H150V80H162M20,80V125H150" stroke-width="2"/><path class="s-acc" d="M162,80H150V125H20V80H8" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.8s" repeatCount="indefinite"/></path><path class="f-paper" d="M42,26h28v18h-28z"/><path class="f-ink" d="M46,27L62,35L46,43Z"/><path class="s-ink" d="M63,27V43" stroke-width="2.4"/><rect class="f-paper s-ink" x="88" y="28" width="38" height="14" stroke-width="2"/><text class="t-s" x="107" y="40" text-anchor="middle">R</text><rect class="f-paper s-ink" x="66" y="118" width="40" height="14" stroke-width="2"/><text class="t-s" x="86" y="130" text-anchor="middle">2R</text><text class="t" x="4" y="85" text-anchor="middle">−</text><text class="t" x="167" y="85" text-anchor="middle">+</text><path class="s-red" d="M38,22L132,48M132,22L38,48" stroke-width="2"/><text class="t-s" x="85" y="64" text-anchor="middle">ток не проходит</text><text class="t" x="85" y="158" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">об</tspan> = 2R</text></g></svg>
