<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" font-family="inherit"><title>Смачивание: смачивающая жидкость растекается по поверхности, несмачивающая собирается в шарик; в капиллярной трубке смачивающая жидкость поднимается на высоту h, тем большую, чем уже трубка</title><rect class="f-soft" x="22" y="150" width="176" height="56"/><path class="s-ink" d="M20,110V208H200V110" stroke-width="2.4" fill="none"/><path class="s-acc" d="M22,150H198" stroke-width="2"/><rect class="f-soft" x="62.0" width="16"><animate attributeName="y" values="150;150;110;110;150" keyTimes="0;0.1;0.55;0.92;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.4 1;0 0 1 1;0 0 1 1"/><animate attributeName="height" values="30;30;70;70;30" keyTimes="0;0.1;0.55;0.92;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.4 1;0 0 1 1;0 0 1 1"/></rect><path class="s-ink" d="M61.0,40V180M79.0,40V180" stroke-width="2"/><text class="t-s" x="70" y="34" text-anchor="middle">R₁</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="6s" repeatCount="indefinite"/><path class="s-red" d="M86.0,150V110M82.0,150H90.0M82.0,110H90.0" stroke-width="1.4"/><text class="t-red" x="94" y="134" text-anchor="start">h₁</text></g><rect class="f-soft" x="136.0" width="8"><animate attributeName="y" values="150;150;70;70;150" keyTimes="0;0.1;0.55;0.92;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.4 1;0 0 1 1;0 0 1 1"/><animate attributeName="height" values="30;30;110;110;30" keyTimes="0;0.1;0.55;0.92;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.4 1;0 0 1 1;0 0 1 1"/></rect><path class="s-ink" d="M135.0,40V180M145.0,40V180" stroke-width="2"/><text class="t-s" x="140" y="34" text-anchor="middle">R₂</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="6s" repeatCount="indefinite"/><path class="s-red" d="M152.0,150V70M148.0,150H156.0M148.0,70H156.0" stroke-width="1.4"/><text class="t-red" x="160" y="114" text-anchor="start">h₂</text></g><text class="t-s" x="110" y="228" text-anchor="middle">h = 2σ/(ρgR): R₁ &gt; R₂ ⇒ h₁ &lt; h₂</text><path class="s-ink" d="M224,110H350" stroke-width="2.4"/><path class="s-ink" d="M224,190H350" stroke-width="2.4"/><path class="f-acc" d="M247,110C247,98 266,90 287,90S327,98 327,110Z" opacity="0.85"><animate attributeName="d" values="M267,110C267,86 276,78 287,78S307,86 307,110Z;M267,110C267,86 276,78 287,78S307,86 307,110Z;M235,110C238,102 262,98 287,98S336,102 339,110Z;M235,110C238,102 262,98 287,98S336,102 339,110Z;M267,110C267,86 276,78 287,78S307,86 307,110Z" keyTimes="0;0.15;0.55;0.92;1" dur="6s" repeatCount="indefinite"/></path><text class="t-s" x="287" y="132" text-anchor="middle">смачивает — растекается</text><circle class="f-ink" cx="287" cy="171" r="18" opacity="0.8"/><text class="t-s" x="287" y="212" text-anchor="middle">не смачивает — шарик</text></svg>
