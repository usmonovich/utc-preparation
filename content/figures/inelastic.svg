<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" font-family="inherit"><title>Неупругое столкновение: тележки сцепляются и едут вместе с меньшей скоростью u, часть энергии переходит в теплоту Q</title><defs><marker id="inelastic-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="inelastic-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker></defs><path class="s-ink" d="M10,120H350" stroke-width="2"/><path class="s-mute" d="M18,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M30,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M42,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M54,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M66,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M78,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M90,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M102,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M114,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M126,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M138,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M150,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M162,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M174,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M186,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M198,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M210,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M222,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M234,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M246,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M258,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M270,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M282,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M294,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M306,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M318,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M330,120l-7,8" stroke-width="1.1"/><path class="s-mute" d="M342,120l-7,8" stroke-width="1.1"/><g><animateTransform attributeName="transform" type="translate" values="0 0;116 0;196 0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/><rect class="f-acc" x="20" y="80" width="50" height="34" rx="3"/><text class="t-w" x="45" y="102" text-anchor="middle">m₁</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;80 0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/><rect class="f-red" x="186" y="80" width="50" height="34" rx="3"/><text class="t-w" x="211" y="102" text-anchor="middle">m₂</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.4;0.45;0.6;1" dur="5s" repeatCount="indefinite"/><circle class="f-red-soft" cx="186" cy="97" r="26"/><text class="t-red" x="186" y="62" text-anchor="middle">Q</text></g><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.401;1" dur="5s" repeatCount="indefinite"/><text class="t-acc" x="90" y="50" text-anchor="middle">υ₁ →</text><text class="t-s" x="260" y="50" text-anchor="middle">υ₂ = 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.46;1" dur="5s" repeatCount="indefinite"/><text class="t-acc" x="250" y="50" text-anchor="middle">вместе со скоростью u →</text></g><text class="t-s" x="180" y="156" text-anchor="middle">m₁υ₁ = (m₁ + m₂)u</text></svg>
