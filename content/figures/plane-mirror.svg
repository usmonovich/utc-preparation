<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Плоское зеркало: изображение мнимое, прямое, равное и симметричное предмету; при движении предмета к зеркалу со скоростью υ изображение движется со скоростью υ, при движении зеркала — со скоростью 2υ</title><defs><marker id="plane-mirror-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker><marker id="plane-mirror-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker></defs><path class="s-ink" d="M10,150H350" stroke-width="1.4"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;0 0;-40 0;0 0" keyTimes="0;0.05;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/><rect class="f-mute" x="200" y="30" width="8" height="120" opacity="0.5"/><path class="s-ink" d="M200,30V150" stroke-width="3"/><text class="t-s" x="204" y="24" text-anchor="middle">зеркало</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;80 0;80 0;80 0;0 0" keyTimes="0;0.05;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/><path class="s-red" d="M40,150V90" stroke-width="6" stroke-linecap="round"/><path class="f-red" d="M33,88L40,70L47,88Z"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-80 0;-80 0;-160 0;0 0" keyTimes="0;0.05;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/><path class="s-red" d="M360,150V90" stroke-width="6" stroke-linecap="round" opacity="0.45" stroke-dasharray="4 3"/><path class="f-red" d="M353,88L360,70L367,88Z" opacity="0.45" stroke-dasharray="4 3"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.45;0.46;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="180" y="186" text-anchor="middle">① предмет → υ, изображение ← υ</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.95" dur="10s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="180" y="186" text-anchor="middle">② зеркало ← υ, изображение ← 2υ</text></g><text class="t-s" x="180" y="204" text-anchor="middle">предмет и изображение — на одинаковом расстоянии a</text></svg>
