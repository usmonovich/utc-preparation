<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Сопротивление проводника R = ρl/S: при удлинении провода сопротивление растёт, при утолщении (большей площади сечения) — уменьшается</title><rect class="f-mute" x="30" rx="4"><animate attributeName="width" values="140;140;280;280;280;280;140" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="16;16;16;16;32;32;16" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="62;62;62;62;54;54;62" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/></rect><line class="s-ink" x1="30" y1="104" y2="104" stroke-width="1.2"><animate attributeName="x2" values="170;170;310;310;310;310;170" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/></line><text class="t" x="40" y="120" text-anchor="start">l</text><text class="t" x="20" y="74" text-anchor="end">S</text><rect class="s-mute" x="314" y="60" width="30" height="120" stroke-width="1" stroke-dasharray="3 3"/><rect class="f-red" x="314" width="30"><animate attributeName="height" values="52.5;52.5;105;105;52.5;52.5;52.5" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y" values="127.5;127.5;75;75;127.5;127.5;127.5" keyTimes="0;0.1;0.35;0.5;0.6;0.85;1" dur="10s" repeatCount="indefinite"/></rect><text class="t" x="329" y="196" text-anchor="middle">R</text><text class="t-s" x="20" y="170" text-anchor="start">l × 2 → R × 2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;0.5" dur="10s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-s" x="20" y="170" text-anchor="start" opacity="0">S × 2 → R : 2<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.85" dur="10s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t" x="160" y="150" text-anchor="middle">R = ρl / S</text></svg>
