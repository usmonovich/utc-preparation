<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Первый закон термодинамики: переданная газу теплота Q идёт на изменение внутренней энергии ΔU и на работу газа A (пример конспекта: 1000 = 600 + 400)</title><defs><marker id="first-law-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker><marker id="first-law-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="first-law-m-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-grn" d="M0,0L10,5L0,10Z"/></marker></defs><rect class="f-soft" x="122" y="62" height="76"><animate attributeName="width" values="68;68;114;114;68" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/></rect><rect class="f-red-soft" x="122" y="62" height="76" opacity="0"><animate attributeName="width" values="68;68;114;114;68" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/></rect><path class="s-ink" d="M290,60H120V140H290" stroke-width="3" fill="none"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;46 0;46 0;0 0" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/><rect class="f-ink" x="190" y="62" width="9" height="76"/><path class="s-ink" d="M199,100.0H230" stroke-width="4"/><line class="s-grn" x1="234" y1="100" x2="264" y2="100" stroke-width="2.6" marker-end="url(#first-law-m-grn)"></line><text class="t-grn" x="250" y="90" text-anchor="middle">A</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.6;0.65;1" dur="7s" repeatCount="indefinite"/><line class="s-red" x1="140" y1="180" x2="140" y2="148" stroke-width="2.6" marker-end="url(#first-law-m-red)" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="11;0" dur="0.5s" repeatCount="indefinite"/></line><line class="s-red" x1="165" y1="180" x2="165" y2="148" stroke-width="2.6" marker-end="url(#first-law-m-red)" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="11;0" dur="0.5s" repeatCount="indefinite"/></line><line class="s-red" x1="190" y1="180" x2="190" y2="148" stroke-width="2.6" marker-end="url(#first-law-m-red)" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="11;0" dur="0.5s" repeatCount="indefinite"/></line><text class="t-red" x="214" y="174" text-anchor="start">Q</text></g><rect class="f-paper s-ink" x="55" y="70" width="10" height="100" rx="5" stroke-width="1.6"/><circle class="f-red" cx="60" cy="176" r="8"/><rect class="f-red" x="57.5" width="5"><animate attributeName="height" values="25;25;75;75;25" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="145;145;95;95;145" keyTimes="0;0.15;0.6;0.9;1" dur="7s" repeatCount="indefinite"/></rect><text class="t-acc" x="60" y="40" text-anchor="middle">ΔU</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.6;0.92;1" dur="7s" repeatCount="indefinite"/><text class="t" x="250" y="22" text-anchor="middle">Q = ΔU + A: 1000 = 600 + 400</text></g></svg>
