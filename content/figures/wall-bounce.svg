<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Удар о стенку: при упругом ударе мяч отскакивает с той же скоростью (Δp = 2mυ), при неупругом останавливается (Δp = mυ)</title><defs><marker id="wall-bounce-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="wall-bounce-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker></defs><rect class="f-mute" x="300" y="14" width="16" height="176" opacity="0.6"/><path class="s-ink" d="M300,14V190" stroke-width="2.4"/><text class="t-s" x="20" y="24" text-anchor="start">упругий: отскок с той же υ — Δp = 2mυ</text><circle class="f-acc" cy="74" r="16"><animate attributeName="cx" values="70;284;70" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/></circle><line class="s-acc" y1="46" y2="46" stroke-width="2.6" marker-end="url(#wall-bounce-m-acc)"><animate attributeName="x1" values="55;269;299;85" keyTimes="0;0.5;0.5001;1" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="85;299;269;55" keyTimes="0;0.5;0.5001;1" dur="4s" repeatCount="indefinite"/></line><text class="t-s" x="20" y="114" text-anchor="start">неупругий: остановка — Δp = mυ</text><circle class="f-red" cy="164" r="16"><animate attributeName="cx" values="70;284;284" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/></circle><line class="s-red" y1="136" y2="136" stroke-width="2.6" marker-end="url(#wall-bounce-m-red)"><animate attributeName="x1" values="55;269" keyTimes="0;1" dur="2s" repeatCount="indefinite"/><animate attributeName="x2" values="85;299" keyTimes="0;1" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="4s" repeatCount="indefinite" calcMode="discrete"/></line></svg>
