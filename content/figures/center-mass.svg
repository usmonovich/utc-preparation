<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="inherit"><title>Центр масс двух грузов: опору двигают вдоль лёгкого стержня с грузами 2 кг и 6 кг; стержень уравновешен, только когда опора под центром масс — в 0,6 м от лёгкого груза, ближе к тяжёлому (l₁/l₂ = m₂/m₁ = 3)</title><path class="s-mute" d="M16,138H344" stroke-width="2"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;55 0;100 0;100 0;150 0;100 0;100 0;0 0" keyTimes="0;0.08;0.25;0.38;0.55;0.68;0.8;0.94;1" dur="8s" repeatCount="indefinite"/><path class="f-mute" d="M138,138L150,108L162,138Z"/></g><g><animateTransform attributeName="transform" type="rotate" values="9 150 104;9 150 104;6 205 104;0 250 104;0 250 104;-6.67 300 104;0 250 104;0 250 104;9 150 104" keyTimes="0;0.08;0.25;0.38;0.55;0.68;0.8;0.94;1" dur="8s" repeatCount="indefinite"/><rect class="f-ink" x="32" y="100" width="296" height="8" rx="3"/><rect class="f-acc" x="27" y="74" width="26" height="26" rx="3"/><text class="t-ws" x="40" y="92" text-anchor="middle">2 кг</text><rect class="f-red" x="300" y="60" width="40" height="40" rx="3"/><text class="t-w" x="320" y="85" text-anchor="middle">6 кг</text><circle class="f-paper" cx="250" cy="104" r="6"/><circle class="s-grn" cx="250" cy="104" r="6" stroke-width="2" fill="none"/><path class="f-grn" d="M250,104V98A6,6 0 0 1 256,104ZM250,104V110A6,6 0 0 1 244,104Z"/></g><path class="s-mute" d="M40,154H250M250,154H320M40,148V160M250,148V160M320,148V160" stroke-width="1.4"/><text class="t-s" x="145" y="150" text-anchor="middle">l₁ = 0,6 м</text><text class="t-s" x="285" y="150" text-anchor="middle">l₂ = 0,2 м</text><text class="t-grn" x="250" y="176" text-anchor="middle">центр масс</text><g opacity="0"><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.38;0.55;0.8;0.94" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-grn" x="180" y="24" text-anchor="middle">равновесие: опора под центром масс</text></g><text class="t-s" x="180" y="204" text-anchor="middle">x<tspan baseline-shift="sub" font-size="0.72em">c</tspan> = (m₁x₁ + m₂x₂) / (m₁ + m₂) = (2·0 + 6·0,8) / 8 = 0,6 м</text></svg>
