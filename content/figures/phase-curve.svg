<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>График T(U): лёд нагревается до 0 °C, плавится при постоянной температуре, вода нагревается до 100 °C, кипит при постоянной температуре, затем нагревается пар; при охлаждении — обратные процессы</title><line class="s-ink" x1="40" y1="196" x2="348.4" y2="196" stroke-width="1.4"/><path class="f-ink" d="M352,196L346,192.7L346,199.3Z"/><line class="s-ink" x1="40" y1="196" x2="40" y2="17.6" stroke-width="1.4"/><path class="f-ink" d="M40,14L36.7,20L43.3,20Z"/><text class="t" x="50" y="24" text-anchor="start">T</text><text class="t" x="350" y="214" text-anchor="end">U</text><path class="s-mute" d="M40,166H350" stroke-width="1" stroke-dasharray="3 4"/><text class="t-s" x="36" y="170" text-anchor="end">0 °C</text><path class="s-mute" d="M40,41H350" stroke-width="1" stroke-dasharray="3 4"/><text class="t-s" x="36" y="45" text-anchor="end">100 °C</text><path class="s-acc" d="M44,191L78,166L128,166L196,41L296,41L334,16" stroke-width="2.6" fill="none"/><text class="t-s" x="79" y="182.5" text-anchor="start">лёд</text><text class="t-s" x="180" y="107.5" text-anchor="start">вода</text><text class="t-s" x="333" y="27.5" text-anchor="start">пар</text><circle class="f-red" r="6"><animate attributeName="cx" values="44;78;128;196;296;334;334;296;196;128;78;44" keyTimes="0;0.06;0.16;0.26;0.42;0.48;0.52;0.58;0.74;0.84;0.94;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="191;166;166;41;41;16;16;41;41;166;166;191" keyTimes="0;0.06;0.16;0.26;0.42;0.48;0.52;0.58;0.74;0.84;0.94;1" dur="12s" repeatCount="indefinite"/></circle><text class="t-red" x="124" y="154" text-anchor="middle" opacity="0">плавление (таяние)<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.06;0.16" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-red" x="246" y="29" text-anchor="middle" opacity="0">кипение (испарение)<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.26;0.42" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-red" x="246" y="29" text-anchor="middle" opacity="0">конденсация<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.58;0.74" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-red" x="124" y="154" text-anchor="middle" opacity="0">затвердевание<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.84;0.94" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-s" x="48" y="214" text-anchor="start">нагревание →<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-s" x="48" y="214" text-anchor="start" opacity="0">← охлаждение<animate attributeName="opacity" values="0;1" keyTimes="0;0.5" dur="12s" repeatCount="indefinite" calcMode="discrete"/></text></svg>
