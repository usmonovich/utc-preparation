<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Движение по окружности: радиус поворачивается на угол φ, угловая скорость ω — угол за единицу времени, линейная скорость υ — по касательной</title><defs><marker id="circle-motion-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker></defs><circle class="s-mute" cx="150" cy="110" r="80" stroke-width="1.6" stroke-dasharray="4 5"/><path class="s-red" d="M180,110A30,30 0 1 0 120,110A30,30 0 1 0 180,110" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0" dur="6s" repeatCount="indefinite"/></path><line class="s-mute" x1="150" y1="110" x2="230" y2="110" stroke-width="1.2"/><g><animateTransform attributeName="transform" type="rotate" values="0 150 110;-360 150 110" dur="6s" repeatCount="indefinite"/><line class="s-ink" x1="150" y1="110" x2="230" y2="110" stroke-width="2"/><line class="s-acc" x1="230" y1="110" x2="230" y2="62" stroke-width="2.6" marker-end="url(#circle-motion-m-acc)"></line><circle class="f-ink" cx="230" cy="110" r="7"/></g><circle class="f-ink" cx="150" cy="110" r="3"/><text class="t-red" x="190" y="102" text-anchor="start">φ</text><text class="t" x="250" y="60" text-anchor="start">ω = φ / t</text><text class="t-acc" x="250" y="86" text-anchor="start">υ — по</text><text class="t-acc" x="250" y="104" text-anchor="start">касательной</text><text class="t-s" x="250" y="130" text-anchor="start">T — один оборот</text></svg>
