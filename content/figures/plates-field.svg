<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Поле конденсатора: поля двух разноимённых пластин складываются — между пластинами E = σ/εε₀, а снаружи они компенсируют друг друга (E = 0)</title><defs><marker id="plates-field-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker><marker id="plates-field-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="plates-field-m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-ink" d="M0,0L10,5L0,10Z"/></marker></defs><rect class="f-red" x="136" y="30" width="8" height="150" rx="2"/><rect class="f-acc" x="216" y="30" width="8" height="150" rx="2"/><text class="t-red" x="140" y="22" text-anchor="middle">+σ</text><text class="t-acc" x="220" y="22" text-anchor="middle">−σ</text><g><animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.3;0.6;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><line class="s-red" x1="87" y1="70" x2="53" y2="70" stroke-width="2.4" marker-end="url(#plates-field-m-red)"></line><line class="s-red" x1="163" y1="70" x2="197" y2="70" stroke-width="2.4" marker-end="url(#plates-field-m-red)"></line><line class="s-red" x1="273" y1="70" x2="307" y2="70" stroke-width="2.4" marker-end="url(#plates-field-m-red)"></line></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.6;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><line class="s-acc" x1="53" y1="100" x2="87" y2="100" stroke-width="2.4" marker-end="url(#plates-field-m-acc)"></line><line class="s-acc" x1="163" y1="100" x2="197" y2="100" stroke-width="2.4" marker-end="url(#plates-field-m-acc)"></line><line class="s-acc" x1="307" y1="100" x2="273" y2="100" stroke-width="2.4" marker-end="url(#plates-field-m-acc)"></line></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="70" y="145" text-anchor="middle">E = 0</text><line class="s-ink" x1="146" y1="140" x2="214" y2="140" stroke-width="3" marker-end="url(#plates-field-m-ink)"></line><text class="t" x="290" y="145" text-anchor="middle">E = 0</text></g><text class="t-s" x="180" y="204" text-anchor="middle">поле пластины +σ: E = σ/2εε₀ по обе стороны<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-s" x="180" y="204" text-anchor="middle" opacity="0">добавили поле пластины −σ<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.6" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t" x="180" y="204" text-anchor="middle" opacity="0">внутри E = σ/εε₀, снаружи E = 0<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/></text></svg>
