<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Виды равновесия: шар в ямке после толчка возвращается (устойчивое), с вершины горки скатывается (неустойчивое), на плоскости остаётся там, где его оставили (безразличное)</title><path class="s-ink" d="M10,80Q60,170 110,80" stroke-width="2.4" fill="none"/><circle class="f-red" r="9"><animate attributeName="cx" values="60;60;40;76;50;66;57;60;60" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88;1" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="107;107;109;108.28;107.5;107.18;107.05;107;107" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88;1" dur="6s" repeatCount="indefinite"/></circle><text class="t-red" x="60" y="180" text-anchor="middle">устойчивое</text><path class="s-ink" d="M130,150Q180,40 230,150" stroke-width="2.4" fill="none"/><circle class="f-acc" r="9"><animate attributeName="cx" values="180;180;186;200;222;230;230" keyTimes="0;0.25;0.35;0.5;0.62;0.7;1" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="86;86;86.79;94.8;124.81;141;141" keyTimes="0;0.25;0.35;0.5;0.62;0.7;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.72;0.98" dur="6s" repeatCount="indefinite" calcMode="discrete"/></circle><text class="t-acc" x="180" y="180" text-anchor="middle">неустойчивое</text><path class="s-ink" d="M250,130H350" stroke-width="2.4"/><circle class="f-grn" cy="121" r="9"><animate attributeName="cx" values="280;280;320;320;280" keyTimes="0;0.3;0.5;0.8;1" dur="6s" repeatCount="indefinite"/></circle><text class="t-grn" x="300" y="180" text-anchor="middle">безразличное</text></svg>
