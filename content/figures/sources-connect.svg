<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Последовательное соединение источников: при одинаковой полярности ЭДС складываются (3 × 1,5 = 4,5 В); если один источник перевернуть, его ЭДС вычитается (1,5 В), а внутренние сопротивления всё равно складываются</title><path class="s-ink" d="M40,80H320V150H40V80" stroke-width="2" fill="none"/><rect class="f-paper" x="94" y="68" width="12" height="24"/><path class="s-ink" d="M96,68V92" stroke-width="2.4"/><path class="s-ink" d="M104,74V86" stroke-width="4"/><text class="t-s" x="100" y="64" text-anchor="middle">1,5 В</text><rect class="f-paper" x="174" y="68" width="12" height="24"/><path class="s-ink" d="M176,68V92" stroke-width="2.4"/><path class="s-ink" d="M184,74V86" stroke-width="4"/><text class="t-s" x="180" y="64" text-anchor="middle">1,5 В</text><g><animateTransform attributeName="transform" type="rotate" values="0 260 80;0 260 80;180 260 80;180 260 80;0 260 80" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/><rect class="f-paper" x="254" y="68" width="12" height="24"/><path class="s-ink" d="M256,68V92" stroke-width="2.4"/><path class="s-ink" d="M264,74V86" stroke-width="4"/></g><text class="t-s" x="260" y="64" text-anchor="middle">1,5 В</text><rect class="f-acc" x="150" height="16" y="160"><animate attributeName="width" values="135;135;45;45;135" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></rect><text class="t" x="180" y="30" text-anchor="middle">ε<tspan baseline-shift="sub" font-size="0.72em">об</tspan> = 1,5 + 1,5 + 1,5 = 4,5 В<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.45;0.95" dur="8s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-red" x="180" y="30" text-anchor="middle" opacity="0">один наоборот: 1,5 + 1,5 − 1,5 = 1,5 В<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;0.95" dur="8s" repeatCount="indefinite" calcMode="discrete"/></text><text class="t-s" x="140" y="173" text-anchor="end">ε<tspan baseline-shift="sub" font-size="0.72em">об</tspan></text><text class="t-s" x="180" y="196" text-anchor="middle">r<tspan baseline-shift="sub" font-size="0.72em">об</tspan> = r₁ + r₂ + r₃ — в обоих случаях</text></svg>
