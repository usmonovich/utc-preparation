<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Заряд при меняющейся силе тока равен площади под графиком I(t); при линейном изменении q = Ī·Δt, где Ī = (I₁ + I₂)/2</title><clipPath id="charge-area-clip"><rect x="90" y="0" height="210" width="0"><animate attributeName="width" values="0;0;210;210" keyTimes="0;0.05;0.5;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><path class="f-soft" d="M90,186V136L300,46V186Z" clip-path="url(#charge-area-clip)"/><line class="s-ink" x1="50" y1="186" x2="346.4" y2="186" stroke-width="1.4"/><path class="f-ink" d="M350,186L344,182.7L344,189.3Z"/><line class="s-ink" x1="50" y1="186" x2="50" y2="23.6" stroke-width="1.4"/><path class="f-ink" d="M50,20L46.7,26L53.3,26Z"/><text class="t" x="60" y="30" text-anchor="start">I</text><text class="t" x="346" y="202" text-anchor="end">t</text><path class="s-acc" d="M70,145L320,37" stroke-width="2.6"/><path class="s-mute" d="M90,186V36" stroke-width="1" stroke-dasharray="3 4"/><text class="t-s" x="90" y="202" text-anchor="middle">t₁</text><path class="s-mute" d="M300,186V36" stroke-width="1" stroke-dasharray="3 4"/><text class="t-s" x="300" y="202" text-anchor="middle">t₂</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.55;0.97" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect class="s-red" x="90" y="91.0" width="210" height="95.0" fill="none" stroke-width="2" stroke-dasharray="6 4"/><text class="t-red" x="306" y="95" text-anchor="start">Ī</text><text class="t-red" x="195" y="156" text-anchor="middle">q = Ī·Δt</text></g><g><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.55;0.97" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="195" y="156" text-anchor="middle">S = q</text></g></svg>
