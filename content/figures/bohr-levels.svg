<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Постулаты Бора: атом водорода переходит с уровня 3 на уровень 2 и излучает фотон hν = E₃ − E₂ ≈ 1,89 эВ; поглотив фотон 10,2 эВ, он переходит с уровня 1 на уровень 2</title><path class="s-ink" d="M110,194H300" stroke-width="2.6"/><text class="t-s" x="104" y="198" text-anchor="end">n = 1</text><text class="t-s" x="306" y="198" text-anchor="start">−13,6 эВ</text><path class="s-ink" d="M110,74H300" stroke-width="1.8"/><text class="t-s" x="104" y="78" text-anchor="end">n = 2</text><text class="t-s" x="306" y="78" text-anchor="start">−3,4 эВ</text><path class="s-ink" d="M110,51.78H300" stroke-width="1.8"/><text class="t-s" x="104" y="55.78" text-anchor="end">n = 3</text><text class="t-s" x="306" y="55.78" text-anchor="start">−1,51 эВ</text><path class="s-mute" d="M110,34H300" stroke-width="1" stroke-dasharray="4 4"/><text class="t-s" x="306" y="38" text-anchor="start">0 (n → ∞)</text><circle class="f-acc" cx="160" r="6"><animate attributeName="cy" values="51.78;51.78;74;74;51.78" keyTimes="0;0.12;0.2;0.46;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.47;0.98" dur="8s" repeatCount="indefinite" calcMode="discrete"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.46" dur="8s" repeatCount="indefinite" calcMode="discrete"/><path class="s-red" d="M0,0L1.5,-3L3,-5.2L4.5,-6L6,-5.2L7.5,-3L9,0L10.5,3L12,5.2L13.5,6L15,5.2L16.5,3L18,0L19.5,-3L21,-5.2L22.5,-6L24,-5.2L25.5,-3L27,0L28.5,3L30,5.2L31.5,6L33,5.2L34.5,3L36,0L37.5,-3L39,-5.2L40.5,-6L42,-5.2L43.5,-3L45,0L46.5,3L48,5.2L49.5,6L51,5.2L52.5,3L54,0L55.5,-3L57,-5.2L58.5,-6L60,-5.2L61.5,-3L63,0L64.5,3L66,5.2L67.5,6L69,5.2L70.5,3L72,0L73.5,-3L75,-5.2L76.5,-6L78,-5.2L79.5,-3L81,0L82.5,3L84,5.2L85.5,6L87,5.2L88.5,3L90,0" stroke-width="2.4"><animateTransform attributeName="transform" type="translate" values="168 62.89;240 62.89" keyTimes="0;1" dur="2.0