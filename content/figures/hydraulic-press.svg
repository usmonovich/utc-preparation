<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Гидравлический пресс: малый поршень опускается на h₁ под силой F₁, большой поднимается на h₂ с большей силой F₂</title><defs><marker id="hydraulic-press-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker></defs><path class="s-ink" d="M50,40V190H330V40M80,40V160H200V40" stroke-width="2.4" fill="none"/><rect class="f-soft" x="52" y="160" width="276" height="28"/><rect class="f-soft" x="52" width="26"><animate attributeName="y" values="70;130;130;70" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="90;30;30;90" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/></rect><rect class="f-soft" x="202" width="126"><animate attributeName="y" values="120;105.0;105.0;120" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="40;55.0;55.0;40" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/></rect><g><animateTransform attributeName="transform" type="translate" values="0 0;0 60;0 60;0 0" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/><rect class="f-ink" x="52" y="62" width="26" height="8"/><line class="s-red" x1="65" y1="20" x2="65" y2="58" stroke-width="2.6" marker-end="url(#hydraulic-press-m-red)"></line><text class="t-red" x="80" y="34" text-anchor="start">F₁</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -15.0;0 -15.0;0 0" keyTimes="0;0.45;0.55;1" dur="4s" repeatCount="indefinite"/><rect class="f-ink" x="202" y="112" width="126" height="8"/><line class="s-red" x1="265" y1="108" x2="265" y2="56" stroke-width="4" marker-end="url(#hydraulic-press-m-red)"></line><text class="t-red" x="282" y="76" text-anchor="start">F₂</text></g><text class="t-s" x="65" y="210" text-anchor="middle">S₁</text><text class="t-s" x="265" y="210" text-anchor="middle">S₂</text><text class="t-s" x="180" y="18" text-anchor="middle">выигрыш в силе: F₂ &gt; F₁</text></svg>
