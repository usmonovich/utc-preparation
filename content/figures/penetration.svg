<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Проникающая способность: α-частицы задерживает лист бумаги, β-частицы — несколько миллиметров алюминия, γ-излучение ослабляет только толстый слой свинца</title><rect class="f-soft" x="8" y="50" width="30" height="110" rx="4"/><text class="t" x="23" y="110" text-anchor="middle">☢</text><rect class="f-mute" x="110" y="34" width="4" height="136" rx="2" opacity="0.75"/><text class="t-s" x="112" y="188" text-anchor="middle">бумага</text><rect class="f-acc" x="190" y="34" width="12" height="136" rx="2" opacity="0.75"/><text class="t-s" x="196" y="188" text-anchor="middle">алюминий</text><rect class="f-ink" x="270" y="34" width="34" height="136" rx="2" opacity="0.75"/><text class="t-s" x="287" y="188" text-anchor="middle">свинец</text><path class="s-red" d="M38,70H110" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;14" dur="1.2s" repeatCount="indefinite"/></path><text class="t-red" x="52" y="62" text-anchor="middle">α</text><path class="s-acc" d="M38,105H190" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;14" dur="1.2s" repeatCount="indefinite"/></path><text class="t-acc" x="52" y="97" text-anchor="middle">β</text><path class="s-grn" d="M38,140H270" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;14" dur="1.2s" repeatCount="indefinite"/></path><path class="s-grn" d="M304,140H352" stroke-width="3" stroke-dasharray="8 6" opacity="0.35"><animate attributeName="stroke-dashoffset" values="0;14" dur="1.2s" repeatCount="indefinite"/></path><text class="t-grn" x="52" y="132" text-anchor="middle">γ</text><text class="t-s" x="352" y="128" text-anchor="end">слабее</text></svg>
