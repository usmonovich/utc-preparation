<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Интенсивность волн от точечного источника: та же энергия на расстоянии 2R проходит через площадь в 4 раза больше, поэтому I ~ 1/R²</title><rect class="f-soft" x="161" y="88" width="18" height="44" transform="skewY(-12)" transform-origin="170 110"/><rect class="s-acc" x="161" y="88" width="18" height="44" stroke-width="1.4" fill="none" transform="skewY(-12)" transform-origin="170 110"/><text class="t" x="170" y="162" text-anchor="middle">R</text><rect class="f-soft" x="298" y="66" width="24" height="88" transform="skewY(-12)" transform-origin="310 110"/><rect class="s-acc" x="298" y="66" width="12" height="44" stroke-width="1.4" fill="none" transform="skewY(-12)" transform-origin="310 110"/><rect class="s-acc" x="310" y="66" width="12" height="44" stroke-width="1.4" fill="none" transform="skewY(-12)" transform-origin="310 110"/><rect class="s-acc" x="298" y="110" width="12" height="44" stroke-width="1.4" fill="none" transform="skewY(-12)" transform-origin="310 110"/><rect class="s-acc" x="310" y="110" width="12" height="44" stroke-width="1.4" fill="none" transform="skewY(-12)" transform-origin="310 110"/><text class="t" x="310" y="184" text-anchor="middle">2R</text><path class="s-red" d="M30,110L310,66" stroke-width="1.4" stroke-dasharray="4 4"/><path class="s-red" d="M30,110L310,154" stroke-width="1.4" stroke-dasharray="4 4"/><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="110;70.4" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;86.24" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="110;102.08" dur="3s" begin="1s" repeatCount="indefinite"/></circle><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;117.92" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="110;133.76" dur="3s" begin="2s" repeatCount="indefinite"/></circle><circle class="f-red" r="3.5" cx="30" cy="110"><animate attributeName="cx" values="30;310" dur="3s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;149.6" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle><circle class="f-ink" cx="30" cy="110" r="6"/><text class="t-s" x="180" y="24" text-anchor="middle">площадь × 4 ⇒ I : 4</text><text class="t" x="352" y="212" text-anchor="end">I ~ 1/R²</text></svg>
