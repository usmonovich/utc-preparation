<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Соединение проводников: последовательно ток один и тот же через оба резистора, а напряжения складываются; параллельно ток разделяется — через меньшее сопротивление идёт больший ток</title><text class="t" x="90" y="20" text-anchor="middle">последовательно</text><text class="t" x="270" y="20" text-anchor="middle">параллельно</text><path class="s-ink" d="M20,60H160V170H20Z" stroke-width="2" fill="none"/><rect class="f-paper s-ink" x="40" y="53" width="36" height="14" rx="2" stroke-width="2"/><text class="t-s" x="58" y="48" text-anchor="middle">R₁</text><rect class="f-paper s-ink" x="104" y="53" width="36" height="14" rx="2" stroke-width="2"/><text class="t-s" x="122" y="48" text-anchor="middle">R₂</text><rect class="f-paper" x="8" y="109" width="24" height="12"/><path class="s-ink" d="M8,111H32" stroke-width="2.4"/><path class="s-ink" d="M14,119H26" stroke-width="4"/><path id="resistors-connect-s" d="M20,60H160V170H20Z" fill="none"/><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-0s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-1s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="6s" begin="-5s" repeatCount="indefinite"><mpath href="#resistors-connect-s"/></animateMotion></circle><text class="t-s" x="90" y="196" text-anchor="middle">I одинаков, U = U₁ + U₂</text><path class="s-ink" d="M200,170V60H340V170Z M220,60V140H320V60" stroke-width="2" fill="none"/><rect class="f-paper s-ink" x="250" y="53" width="40" height="14" rx="2" stroke-width="2"/><text class="t-s" x="270" y="48" text-anchor="middle">R₁ (малое)</text><rect class="f-paper s-ink" x="250" y="133" width="40" height="14" rx="2" stroke-width="2"/><text class="t-s" x="270" y="128" text-anchor="middle">R₂ (большое)</text><rect class="f-paper" x="188" y="109" width="24" height="12"/><path class="s-ink" d="M188,111H212" stroke-width="2.4"/><path class="s-ink" d="M194,119H206" stroke-width="4"/><path id="resistors-connect-a" d="M200,170V60H340V170H200" fill="none"/><path id="resistors-connect-b" d="M200,170V60H220V140H320V60H340V170H200" fill="none"/><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-0s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-1s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-red" r="3.5"><animateMotion dur="6s" begin="-5s" repeatCount="indefinite"><mpath href="#resistors-connect-a"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="7.199999999999999s" begin="-0s" repeatCount="indefinite"><mpath href="#resistors-connect-b"/></animateMotion></circle><circle class="f-acc" r="3.5"><animateMotion dur="7.199999999999999s" begin="-3.6s" repeatCount="indefinite"><mpath href="#resistors-connect-b"/></animateMotion></circle><text class="t-s" x="270" y="196" text-anchor="middle">U одинаково, I = I₁ + I₂</text></svg>
