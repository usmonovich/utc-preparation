topics:
  # ───────────────────────────── 1.6.1 ─────────────────────────────
  - id: ma-1-6-1
    num: '1.6.1'
    title: Системы линейных уравнений
    pages: [b059, b060, b061]
    book:
      place: 'Ч. 1, 1.6 «Системы уравнений», пункт 1.6.1'
      summary: 'Задания на решение систем двух линейных уравнений с двумя неизвестными и на вычисление выражений от решения ($x + y$, $x - y$, $xy$).'
    stage: verified
    stageNote: 'Решения подставлены в оба уравнения каждой системы.'
    sourcesChecked: '2026-10-25'
    web: [*os-51, *os-53, *os-5k]
    theory:
      - kind: definition
        title: Система и её решение
        body: |
          **Решение системы** $\begin{cases} a_1x + b_1y = c_1 \\ a_2x + b_2y = c_2 \end{cases}$ — пара чисел $(x; y)$, которая обращает **каждое** уравнение в верное равенство.
          Геометрически каждое уравнение — прямая, решение — их общая точка. Возможны три случая:
          - прямые пересекаются — **одно** решение;
          - параллельны — решений **нет**;
          - совпадают — решений **бесконечно много**.
        src: b059
        fig: lines-intersection
      - kind: rule
        title: Способы решения
        body: |
          - **Подстановка**: из одного уравнения выразить неизвестное ($x = 7 - 2y$) и подставить в другое.
          - **Сложение**: умножить уравнения на такие числа, чтобы при сложении одно неизвестное исчезло.
          - Если нужно найти только $x + y$ или $x - y$, иногда достаточно сложить или вычесть уравнения целиком.
        src: b059
      - kind: law
        title: Признак числа решений
        body: |
          Пусть $\Delta = a_1b_2 - a_2b_1$.
          - $\Delta \ne 0$ ($\frac{a_1}{a_2} \ne \frac{b_1}{b_2}$) — единственное решение;
          - $\frac{a_1}{a_2} = \frac{b_1}{b_2} \ne \frac{c_1}{c_2}$ — решений нет;
          - $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$ — бесконечно много.
          (Запись через отношения — при ненулевых знаменателях; через $\Delta$ — всегда.)
        src: b060
    formulas:
      - title: Решение через определители
        tex: 'x = \frac{c_1b_2 - c_2b_1}{a_1b_2 - a_2b_1},\qquad y = \frac{a_1c_2 - a_2c_1}{a_1b_2 - a_2b_1}'
        meaning: 'Коэффициенты системы $a_ix + b_iy = c_i$; знаменатель $\Delta = a_1b_2 - a_2b_1$.'
        use: 'Проверка ответа и исследование систем с параметром.'
        limits: 'Только при $\Delta \ne 0$.'
        src: b060
      - title: Число решений по коэффициентам
        tex: '\frac{a_1}{a_2} \ne \frac{b_1}{b_2}:\ \text{одно};\quad \frac{a_1}{a_2} = \frac{b_1}{b_2} \ne \frac{c_1}{c_2}:\ \text{нет};\quad \frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}:\ \infty'
        meaning: 'Сравнение отношений коэффициентов при $x$, $y$ и свободных членов.'
        use: 'Определить число решений, не решая систему.'
        limits: 'Знаменатели $a_2$, $b_2$, $c_2$ должны быть ненулевыми; иначе используйте $\Delta$.'
        src: b060
    examples:
      - title: Способ подстановки
        given: 'Решите систему $\begin{cases} x + 2y = 7 \\ 3x - y = 7 \end{cases}$.'
        find: '$(x; y)$.'
        method: 'Выразить $x$ из первого уравнения.'
        steps:
          - '$x = 7 - 2y$.'
          - '$3(7 - 2y) - y = 7$, $21 - 7y = 7$, $y = 2$.'
          - '$x = 7 - 4 = 3$.'
        check: '$3 + 4 = 7$; $9 - 2 = 7$ ✓.'
        answer: '$(3; 2)$'
        src: b059
      - title: Способ сложения
        given: 'Решите систему $\begin{cases} 3x + 4y = 10 \\ 5x - 4y = 6 \end{cases}$.'
        find: '$(x; y)$.'
        method: 'Сложить уравнения: $y$ сократится.'
        steps:
          - '$8x = 16$, $x = 2$.'
          - '$6 + 4y = 10$, $y = 1$.'
        check: '$6 + 4 = 10$; $10 - 4 = 6$ ✓.'
        answer: '$(2; 1)$'
        src: b059
      - title: Число решений без решения
        given: 'Сколько решений у системы $\begin{cases} 2x - 3y = 5 \\ 4x - 6y = 7 \end{cases}$?'
        find: 'число решений.'
        method: 'Сравнить отношения коэффициентов.'
        steps:
          - '$\frac24 = \frac{-3}{-6} = \frac12$, а $\frac57 \ne \frac12$.'
          - 'Прямые параллельны — решений нет.'
        check: 'Умножим первое на 2: $4x - 6y = 10$, а второе даёт $4x - 6y = 7$ — противоречие ✓.'
        answer: 'решений нет'
        src: b060
    questions:
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x + y = 10 \\ x - y = 4 \end{cases}$ и найдите $xy$.'
        num: { value: 21, unit: '', check: '7*3' }
        hint: 'Сложите уравнения.'
        explain: '$2x = 14$, $x = 7$, $y = 3$; $xy = 21$.'
        sol: { method: 'Сложение и вычитание уравнений.', steps: ['$2x = 14 \Rightarrow x = 7$.', '$2y = 6 \Rightarrow y = 3$.', '$xy = 21$.'], answer: '21' }
        src: b059
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} 2x + 3y = 12 \\ x - y = 1 \end{cases}$ и найдите $x + y$.'
        num: { value: 5, unit: '', check: '3+2' }
        hint: '$x = 1 + y$.'
        explain: '$2 + 5y = 12$, $y = 2$, $x = 3$; $x + y = 5$.'
        sol: { method: 'Подстановка.', steps: ['$x = 1 + y$.', '$2(1 + y) + 3y = 12 \Rightarrow y = 2$.', '$x = 3$, $x + y = 5$.'], check: '$6 + 6 = 12$, $3 - 2 = 1$.', answer: '5' }
        src: b059
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} 4x - 3y = 2 \\ 2x + 3y = 10 \end{cases}$ и найдите $x^2 + y^2$.'
        num: { value: 8, unit: '', check: '4+4' }
        hint: 'Сложите уравнения.'
        explain: '$6x = 12$, $x = 2$, $y = 2$; $4 + 4 = 8$.'
        sol: { method: 'Сложение.', steps: ['$6x = 12 \Rightarrow x = 2$.', '$4 + 3y = 10 \Rightarrow y = 2$.', '$x^2 + y^2 = 8$.'], check: '$8 - 6 = 2$.', answer: '8' }
        src: b059
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} 3x + y = 11 \\ x - 2y = -1 \end{cases}$ и найдите $x - y$.'
        num: { value: 1, unit: '', check: '3-2' }
        hint: '$y = 11 - 3x$.'
        explain: '$x - 22 + 6x = -1$, $x = 3$, $y = 2$; $x - y = 1$.'
        f: [1]
        sol: { method: 'Подстановка.', steps: ['$y = 11 - 3x$.', '$x - 2(11 - 3x) = -1 \Rightarrow 7x = 21 \Rightarrow x = 3$.', '$y = 2$, $x - y = 1$.'], check: '$9 + 2 = 11$; $3 - 4 = -1$.', answer: '1' }
        src: b059
      - type: numeric
        cat: problem
        q: 'Сумма двух чисел равна 50, разность — 12. Найдите большее число.'
        num: { value: 31, unit: '', check: '(50+12)/2' }
        hint: 'Сложите уравнения $x + y = 50$ и $x - y = 12$.'
        explain: '$2x = 62$, $x = 31$ (второе число 19).'
        sol: { method: 'Система по условию.', steps: ['$x + y = 50$, $x - y = 12$.', '$2x = 62 \Rightarrow x = 31$.'], check: '$31 + 19 = 50$, $31 - 19 = 12$.', answer: '31' }
        src: b059
      - type: single
        cat: theory
        q: 'Сколько решений у системы $\begin{cases} x + 2y = 3 \\ 2x + 4y = 6 \end{cases}$?'
        opts: ['бесконечно много', 'одно', 'ни одного', 'два']
        ans: a
        hint: 'Сравните второе уравнение с удвоенным первым.'
        explain: 'Второе уравнение — первое, умноженное на 2: прямые совпадают.'
        f: [2]
        src: b060
      - type: single
        cat: theory
        q: 'Сколько решений у системы $\begin{cases} y = 2x + 1 \\ y = 2x - 3 \end{cases}$?'
        opts: ['ни одного', 'одно', 'бесконечно много', 'два']
        ans: a
        hint: 'Сравните угловые коэффициенты.'
        explain: 'Одинаковый наклон 2, разные свободные члены — прямые параллельны.'
        f: [2]
        src: b060
      - type: single
        cat: theory
        q: 'Что означает геометрически, что система двух линейных уравнений имеет единственное решение?'
        opts: ['прямые пересекаются в одной точке', 'прямые параллельны', 'прямые совпадают', 'прямые перпендикулярны']
        ans: a
        hint: 'Решение — общая точка прямых.'
        explain: 'Единственная общая точка — пересечение. Перпендикулярность — частный случай пересечения, но не условие.'
        src: b059

  # ───────────────────────────── 1.6.2 ─────────────────────────────
  - id: ma-1-6-2
    num: '1.6.2'
    title: Системы уравнений первого и второго порядков
    pages: [b061, b062, b063]
    book:
      place: 'Ч. 1, 1.6 «Системы уравнений», пункт 1.6.2'
      summary: 'Задания на системы, где одно уравнение линейное, а другое — второй степени, и на симметрические системы с суммой и произведением неизвестных; число решений таких систем.'
    stage: verified
    stageNote: 'Решения подставлены в обе части систем.'
    sourcesChecked: '2026-10-25'
    web: [*os-115, *rs-quad, *rs-fsu]
    theory:
      - kind: rule
        title: Одно уравнение линейное
        body: |
          Из линейного уравнения выражают одно неизвестное и подставляют во второе — получается квадратное уравнение с одним неизвестным. Каждому его корню соответствует **одно** решение системы.
          Геометрически: прямая и парабола (или окружность) имеют 0, 1 или 2 общие точки.
        src: b061
        fig: circle-line
      - kind: rule
        title: Симметрические системы
        body: |
          Если система не меняется при замене $x \leftrightarrow y$, вводят $s = x + y$, $p = xy$:
          - $x^2 + y^2 = s^2 - 2p$; $\ x^2y + xy^2 = ps$; $\ \frac1x + \frac1y = \frac sp$.
          Найдя $s$ и $p$, получают $x$ и $y$ как корни уравнения $t^2 - st + p = 0$ (обратная теорема Виета). Решения идут парами: $(x; y)$ и $(y; x)$.
        src: b062
    formulas:
      - title: Неизвестные по сумме и произведению
        tex: 'x + y = s,\ xy = p \ \Rightarrow\ x, y \ \text{— корни}\ t^2 - st + p = 0'
        meaning: 'Действительные решения есть при $s^2 - 4p \ge 0$.'
        use: 'Симметрические системы.'
        src: b062
      - title: Сумма квадратов через s и p
        tex: 'x^2 + y^2 = (x + y)^2 - 2xy'
        meaning: '$s = x + y$, $p = xy$.'
        use: 'Переход от $x^2 + y^2$ к $s$ и $p$.'
        src: b062
    examples:
      - title: Сумма и произведение
        given: 'Решите систему $\begin{cases} x + y = 5 \\ xy = 6 \end{cases}$.'
        find: 'все решения.'
        method: 'Обратная теорема Виета.'
        steps:
          - '$x$, $y$ — корни $t^2 - 5t + 6 = 0$: $t = 2$, $t = 3$.'
          - 'Решения $(2; 3)$ и $(3; 2)$.'
        check: '$2 + 3 = 5$, $2 \cdot 3 = 6$ ✓.'
        answer: '$(2; 3)$, $(3; 2)$'
        src: b062
      - title: Подстановка в окружность
        given: 'Решите систему $\begin{cases} x - y = 1 \\ x^2 + y^2 = 13 \end{cases}$.'
        find: 'все решения.'
        method: 'Выразить $x = y + 1$.'
        steps:
          - '$(y + 1)^2 + y^2 = 13 \Rightarrow 2y^2 + 2y - 12 = 0 \Rightarrow y^2 + y - 6 = 0$.'
          - '$y = 2$ или $y = -3$; $x = 3$ или $x = -2$.'
        check: '$9 + 4 = 13$; $4 + 9 = 13$; разности $1$ ✓.'
        answer: '$(3; 2)$, $(-2; -3)$'
        src: b061
      - title: Прямая и парабола
        given: 'Найдите точки пересечения $y = x^2$ и $y = 2x + 3$.'
        find: 'решения системы.'
        method: 'Приравнять правые части.'
        steps:
          - '$x^2 = 2x + 3 \Rightarrow x^2 - 2x - 3 = 0$: $x = 3$, $x = -1$.'
          - '$y = 9$ и $y = 1$.'
        check: '$2 \cdot 3 + 3 = 9$; $2 \cdot (-1) + 3 = 1$ ✓.'
        answer: '$(3; 9)$, $(-1; 1)$'
        src: b061
    questions:
      - type: numeric
        cat: problem
        q: 'Известно, что $x + y = 7$, $xy = 12$. Найдите $x^2 + y^2$.'
        num: { value: 25, unit: '', check: '49-24' }
        hint: '$s^2 - 2p$.'
        explain: '$49 - 24 = 25$ (решения $(3; 4)$ и $(4; 3)$).'
        f: [2]
        sol: { method: 'Сумма квадратов через $s$, $p$.', steps: ['$x^2 + y^2 = 7^2 - 2 \cdot 12 = 25$.'], check: '$9 + 16 = 25$.', answer: '25' }
        src: b062
      - type: numeric
        cat: problem
        q: 'Известно, что $x + y = 6$, $x^2 + y^2 = 20$. Найдите $xy$.'
        num: { value: 8, unit: '', check: '(36-20)/2' }
        hint: '$x^2 + y^2 = s^2 - 2p$.'
        explain: '$20 = 36 - 2p$, $p = 8$.'
        f: [2]
        sol: { method: 'Выразить $p$.', steps: ['$36 - 2p = 20$.', '$p = 8$.'], check: 'Решения $(2; 4)$, $(4; 2)$: $4 + 16 = 20$.', answer: '8' }
        src: b062
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x - y = 2 \\ xy = 15 \end{cases}$ и найдите сумму значений $x$ всех решений.'
        num: { value: 2, unit: '', check: '5+(-3)' }
        hint: '$x = y + 2$.'
        explain: '$y^2 + 2y - 15 = 0$: $y = 3$ или $-5$; решения $(5; 3)$, $(-3; -5)$; $5 - 3 = 2$.'
        sol: { method: 'Подстановка.', steps: ['$(y + 2)y = 15 \Rightarrow y^2 + 2y - 15 = 0$.', '$y = 3 \Rightarrow x = 5$; $y = -5 \Rightarrow x = -3$.', 'Сумма $x$: $2$.'], answer: '2' }
        src: b061
      - type: numeric
        cat: problem
        q: 'Сколько решений у системы $\begin{cases} y = x^2 \\ y = x + 2 \end{cases}$?'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Число корней уравнения $x^2 = x + 2$.'
        explain: '$x^2 - x - 2 = 0$: $D = 9 > 0$ — два решения $(2; 4)$ и $(-1; 1)$.'
        sol: { method: 'Свести к квадратному уравнению.', steps: ['$x^2 - x - 2 = 0$, $D = 9$.', 'Два корня $x = 2$, $x = -1$ — два решения.'], answer: '2' }
        src: b061
      - type: numeric
        cat: problem
        q: 'Сколько решений у системы $\begin{cases} y = x^2 + 1 \\ y = 2x \end{cases}$?'
        num: { value: 1, unit: '', check: '1' }
        hint: 'Дискриминант уравнения $x^2 + 1 = 2x$.'
        explain: '$(x - 1)^2 = 0$ — одно решение $(1; 2)$: прямая касается параболы.'
        sol: { method: 'Свести к квадратному уравнению.', steps: ['$x^2 - 2x + 1 = 0$, $D = 0$.', '$x = 1$, $y = 2$ — одно решение.'], answer: '1' }
        src: b061
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x^2 + y^2 = 25 \\ x + y = 7 \end{cases}$ и найдите $|x - y|$.'
        num: { value: 1, unit: '', check: 'Math.abs(4-3)' }
        hint: 'Найдите $xy$ через $s$, затем $(x - y)^2 = s^2 - 4p$.'
        explain: '$xy = \frac{49 - 25}{2} = 12$; $(x - y)^2 = 49 - 48 = 1$.'
        f: [2]
        sol: { method: 'Симметрическая система.', steps: ['$2xy = 49 - 25 \Rightarrow xy = 12$.', '$(x - y)^2 = 49 - 48 = 1$.', '$|x - y| = 1$; решения $(3; 4)$, $(4; 3)$.'], answer: '1' }
        src: b062
      - type: single
        cat: theory
        q: 'Если $x + y = s$ и $xy = p$, то $x$ и $y$ — корни уравнения…'
        opts: ['$t^2 - st + p = 0$', '$t^2 + st + p = 0$', '$t^2 - pt + s = 0$', '$t^2 + pt - s = 0$']
        ans: a
        hint: 'Обратная теорема Виета.'
        explain: 'У приведённого уравнения $t^2 + bt + c$ сумма корней $-b$, произведение $c$; значит, $b = -s$, $c = p$.'
        f: [1]
        src: b062
      - type: single
        cat: theory
        q: 'Сколько общих точек могут иметь прямая и окружность?'
        opts: ['0, 1 или 2', 'только 2', '0 или 2', 'любое число']
        ans: a
        hint: 'После подстановки получается квадратное уравнение.'
        explain: 'Квадратное уравнение имеет 0, 1 или 2 корня; одна точка — касание.'
        src: b061

  # ───────────────────────────── 1.6.3 ─────────────────────────────
  - id: ma-1-6-3
    num: '1.6.3'
    title: Системы уравнений высокого порядка
    pages: [b063, b064, b065]
    book:
      place: 'Ч. 1, 1.6 «Системы уравнений», пункт 1.6.3'
      summary: 'Задания на системы с уравнениями третьей и более высоких степеней: суммы и разности кубов, однородные уравнения, перемножение и деление уравнений системы.'
    stage: verified
    stageNote: 'Решения подставлены в исходные уравнения.'
    sourcesChecked: '2026-10-25'
    web: [*rs-fsu, *rs-quad, *os-115]
    theory:
      - kind: rule
        title: Приёмы для систем высокой степени
        body: |
          - **Формулы сокращённого умножения**: $x^3 + y^3 = (x + y)(x^2 - xy + y^2) = s^3 - 3ps$, $x^3 - y^3 = (x - y)(x^2 + xy + y^2)$ — сводят систему к $s$ и $p$.
          - **Однородное уравнение** $ax^2 + bxy + cy^2 = 0$ раскладывают на множители (или делят на $y^2$, сделав замену $t = \frac xy$, проверив отдельно $y = 0$).
          - **Перемножение и деление уравнений**: $\begin{cases} x^2y = 12 \\ xy^2 = 18 \end{cases}$ — произведение даёт $(xy)^3 = 216$, частное $\frac xy = \frac23$.
        src: b063
      - kind: rule
        title: Осторожно с делением
        body: |
          Делить одно уравнение на другое можно, только если делитель не равен нулю. Решения, при которых он равен нулю, проверяют отдельно — иначе их можно потерять.
        src: b063
    formulas:
      - title: Сумма кубов через s и p
        tex: 'x^3 + y^3 = (x + y)^3 - 3xy(x + y) = s^3 - 3ps'
        meaning: '$s = x + y$, $p = xy$.'
        use: 'Симметрические системы с кубами.'
        src: b063
      - title: Разность кубов
        tex: 'x^3 - y^3 = (x - y)(x^2 + xy + y^2)'
        meaning: 'Формула сокращённого умножения.'
        use: 'Деление на известную разность $x - y$.'
        src: b063
      - title: Однородное уравнение второй степени
        tex: 'x^2 - 3xy + 2y^2 = (x - y)(x - 2y)'
        meaning: 'Пример разложения; в общем случае $ax^2 + bxy + cy^2 = a(x - t_1y)(x - t_2y)$, $t_{1,2}$ — корни $at^2 + bt + c = 0$.'
        use: 'Получить линейные связи $x = ty$.'
        src: b064
    examples:
      - title: Сумма кубов
        given: 'Решите систему $\begin{cases} x^3 + y^3 = 9 \\ x + y = 3 \end{cases}$.'
        find: 'все решения.'
        method: '$s^3 - 3ps = 9$ при $s = 3$.'
        steps:
          - '$27 - 9p = 9 \Rightarrow p = 2$.'
          - '$t^2 - 3t + 2 = 0$: $t = 1$, $t = 2$.'
        check: '$1 + 8 = 9$, $1 + 2 = 3$ ✓.'
        answer: '$(1; 2)$, $(2; 1)$'
        src: b063
      - title: Однородное уравнение
        given: 'Решите систему $\begin{cases} x^2 - 3xy + 2y^2 = 0 \\ x + y = 6 \end{cases}$.'
        find: 'все решения.'
        method: 'Разложить первое уравнение.'
        steps:
          - '$(x - y)(x - 2y) = 0$: $x = y$ или $x = 2y$.'
          - '$x = y$: $2y = 6$, $(3; 3)$.'
          - '$x = 2y$: $3y = 6$, $(4; 2)$.'
        check: '$9 - 27 + 18 = 0$; $16 - 24 + 8 = 0$ ✓.'
        answer: '$(3; 3)$, $(4; 2)$'
        src: b064
      - title: Перемножение и деление уравнений
        given: 'Решите систему $\begin{cases} x^2y = 12 \\ xy^2 = 18 \end{cases}$.'
        find: 'все решения.'
        method: 'Перемножить уравнения, затем разделить.'
        steps:
          - '$x, y \ne 0$ (иначе левые части равны нулю).'
          - '$(xy)^3 = 216 \Rightarrow xy = 6$.'
          - '$x^2y = x \cdot xy = 6x = 12 \Rightarrow x = 2$, $y = 3$.'
        check: '$4 \cdot 3 = 12$; $2 \cdot 9 = 18$ ✓.'
        answer: '$(2; 3)$'
        src: b064
    questions:
      - type: numeric
        cat: problem
        q: 'Известно, что $x^3 - y^3 = 26$, $x - y = 2$. Найдите $xy$.'
        num: { value: 3, unit: '', check: '(26/2-4)/3' }
        hint: '$x^2 + xy + y^2 = 13$, а $(x - y)^2 = x^2 - 2xy + y^2 = 4$.'
        explain: 'Вычитаем: $3xy = 9$, $xy = 3$. Решения $(3; 1)$, $(-1; -3)$.'
        f: [2]
        sol: { method: 'Разность кубов.', steps: ['$x^2 + xy + y^2 = \frac{26}{2} = 13$.', '$x^2 - 2xy + y^2 = 4$.', '$3xy = 9$, $xy = 3$.'], check: '$27 - 1 = 26$.', answer: '3' }
        src: b063
      - type: numeric
        cat: problem
        q: 'Известно, что $x + y = 4$, $x^3 + y^3 = 28$. Найдите $x^2 + y^2$.'
        num: { value: 10, unit: '', check: '16-2*3' }
        hint: 'Сначала $p$ из $s^3 - 3ps = 28$.'
        explain: '$64 - 12p = 28$, $p = 3$; $x^2 + y^2 = 16 - 6 = 10$.'
        f: [1]
        sol: { method: 'Переход к $s$ и $p$.', steps: ['$64 - 12p = 28 \Rightarrow p = 3$.', '$x^2 + y^2 = s^2 - 2p = 10$.'], check: 'Решения $(1; 3)$, $(3; 1)$: $1 + 27 = 28$.', answer: '10' }
        src: b063
      - type: numeric
        cat: problem
        q: 'Известно, что $xy = 6$, $x^2y + xy^2 = 30$. Найдите $x + y$.'
        num: { value: 5, unit: '', check: '30/6' }
        hint: '$x^2y + xy^2 = xy(x + y)$.'
        explain: '$6(x + y) = 30$, $x + y = 5$.'
        sol: { method: 'Вынесение общего множителя.', steps: ['$xy(x + y) = 30$.', '$x + y = \frac{30}{6} = 5$.'], answer: '5' }
        src: b063
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x^2 - 5xy + 6y^2 = 0 \\ x + y = 12 \end{cases}$ и найдите сумму значений $x$ всех решений.'
        num: { value: 17, unit: '', check: '8+9' }
        hint: '$x^2 - 5xy + 6y^2 = (x - 2y)(x - 3y)$.'
        explain: '$x = 2y$: $(8; 4)$; $x = 3y$: $(9; 3)$. Сумма $17$.'
        f: [3]
        sol: { method: 'Однородное уравнение.', steps: ['$(x - 2y)(x - 3y) = 0$.', '$x = 2y$: $3y = 12$, $(8; 4)$.', '$x = 3y$: $4y = 12$, $(9; 3)$.', '$8 + 9 = 17$.'], answer: '17' }
        src: b064
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x^2y = 20 \\ xy^2 = 50 \end{cases}$ и найдите $y$.'
        num: { value: 5, unit: '', check: '1000**(1/3)/2' }
        hint: 'Перемножьте уравнения.'
        explain: '$(xy)^3 = 1000$, $xy = 10$; $x = 2$, $y = 5$.'
        sol: { method: 'Перемножение уравнений.', steps: ['$(xy)^3 = 1000 \Rightarrow xy = 10$.', '$x \cdot xy = 20 \Rightarrow x = 2$.', '$y = 5$.'], check: '$4 \cdot 5 = 20$; $2 \cdot 25 = 50$.', answer: '5' }
        src: b064
      - type: numeric
        cat: problem
        q: 'Сколько решений у системы $\begin{cases} x^4 - y^4 = 15 \\ x^2 - y^2 = 3 \end{cases}$?'
        num: { value: 4, unit: '', check: '4' }
        hint: '$x^4 - y^4 = (x^2 - y^2)(x^2 + y^2)$.'
        explain: '$x^2 + y^2 = 5$, $x^2 = 4$, $y^2 = 1$ — четыре пары $(\pm2; \pm1)$.'
        sol: { method: 'Разность квадратов.', steps: ['$x^2 + y^2 = 15 : 3 = 5$.', '$x^2 = 4$, $y^2 = 1$.', '$x = \pm2$, $y = \pm1$ — 4 решения.'], answer: '4' }
        src: b063
      - type: single
        cat: theory
        q: 'Как удобнее решать уравнение $x^2 - 3xy + 2y^2 = 0$ в системе?'
        opts: ['разложить: $(x - y)(x - 2y) = 0$', 'выразить $x$ через корень', 'возвести в квадрат', 'сложить с другим уравнением']
        ans: a
        hint: 'Уравнение однородное.'
        explain: 'Однородное уравнение распадается на линейные связи $x = y$ и $x = 2y$.'
        f: [3]
        src: b064
      - type: single
        cat: theory
        q: 'Почему перед делением уравнений системы друг на друга проверяют делитель?'
        opts: ['на ноль делить нельзя, решения с нулевым делителем можно потерять', 'чтобы не появились иррациональные числа', 'деление всегда даёт посторонние корни', 'проверять не нужно']
        ans: a
        hint: 'Что будет, если левая часть делителя равна нулю?'
        explain: 'Деление допустимо только на ненулевое выражение; случай нуля разбирают отдельно.'
        src: b063

  # ───────────────────────────── 1.6.4 ─────────────────────────────
  - id: ma-1-6-4
    num: '1.6.4'
    title: Системы параметрических уравнений
    pages: [b065, b066]
    book:
      place: 'Ч. 1, 1.6 «Системы уравнений», пункт 1.6.4'
      summary: 'Книга напоминает условия, при которых линейная система $a_1x + b_1y = c_1$, $a_2x + b_2y = c_2$ имеет единственное решение, не имеет решений или имеет бесконечно много решений; задания — найти значение параметра.'
    stage: verified
    stageNote: 'Каждое значение параметра проверено подстановкой в систему.'
    sourcesChecked: '2026-10-25'
    web: [*os-51, *kfu-par]
    theory:
      - kind: law
        title: Линейная система с параметром
        body: |
          Для $\begin{cases} a_1x + b_1y = c_1 \\ a_2x + b_2y = c_2 \end{cases}$, где коэффициенты зависят от параметра:
          - **единственное** решение $\iff a_1b_2 - a_2b_1 \ne 0$;
          - **нет** решений $\iff \frac{a_1}{a_2} = \frac{b_1}{b_2} \ne \frac{c_1}{c_2}$;
          - **бесконечно много** $\iff \frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$.
          План: найти значения параметра, при которых $\Delta = 0$, и для каждого из них подставить и проверить свободные члены.
        src: b065
      - kind: rule
        title: Нелинейные системы с параметром
        body: |
          Если после подстановки получается квадратное уравнение, число решений системы определяется его дискриминантом (и, если старший коэффициент зависит от параметра, — отдельным разбором его нуля).
          Пример: прямая $y = x + a$ касается окружности $x^2 + y^2 = 2$, когда уравнение $2x^2 + 2ax + a^2 - 2 = 0$ имеет один корень: $\frac D4 = 4 - a^2 = 0$, $a = \pm2$.
        src: b065
    formulas:
      - title: Условия для линейной системы
        tex: '\Delta = a_1b_2 - a_2b_1 \ne 0 \iff \text{единственное решение}'
        meaning: '$\Delta$ — определитель системы.'
        use: 'Найти «опасные» значения параметра ($\Delta = 0$).'
        limits: 'При $\Delta = 0$ решений либо нет, либо бесконечно много — нужна проверка.'
        src: b065
      - title: Отношения коэффициентов
        tex: '\frac{a_1}{a_2} = \frac{b_1}{b_2} \ne \frac{c_1}{c_2} \ \Rightarrow\ \varnothing,\qquad \frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2} \ \Rightarrow\ \infty'
        meaning: 'Знаменатели не равны нулю.'
        use: 'Быстрое определение значения параметра.'
        src: b065
    examples:
      - title: Бесконечно много решений
        given: 'При каких $a$ система $\begin{cases} ax + 3y = 6 \\ 2x + y = 2 \end{cases}$ имеет бесконечно много решений? Может ли она не иметь решений?'
        find: '$a$.'
        method: '$\Delta = a \cdot 1 - 2 \cdot 3 = a - 6$.'
        steps:
          - '$a \ne 6$ — единственное решение.'
          - '$a = 6$: первое уравнение $6x + 3y = 6$ — это второе, умноженное на 3: бесконечно много.'
          - 'Значит, ни при каком $a$ система не может быть несовместной.'
        check: '$\frac62 = \frac31 = \frac62 = 3$ ✓.'
        answer: '$a = 6$; решений нет — ни при каком $a$'
        src: b065
      - title: Нет решений
        given: 'При каких $a$ система $\begin{cases} x + ay = 1 \\ ax + y = 2 \end{cases}$ не имеет решений?'
        find: '$a$.'
        method: '$\Delta = 1 - a^2$.'
        steps:
          - '$\Delta = 0$ при $a = \pm1$.'
          - '$a = 1$: $x + y = 1$ и $x + y = 2$ — противоречие.'
          - '$a = -1$: $x - y = 1$ и $-x + y = 2$, то есть $x - y = -2$ — противоречие.'
        check: 'При $a = 0$: $x = 1$, $y = 2$ — решение есть ✓.'
        answer: '$a = \pm1$'
        src: b065
      - title: Касание прямой и окружности
        given: 'При каких $a$ система $\begin{cases} x^2 + y^2 = 2 \\ y = x + a \end{cases}$ имеет единственное решение?'
        find: '$a$.'
        method: 'Подстановка и условие $D = 0$.'
        steps:
          - '$x^2 + (x + a)^2 = 2 \Rightarrow 2x^2 + 2ax + a^2 - 2 = 0$.'
          - '$\frac D4 = a^2 - 2(a^2 - 2) = 4 - a^2 = 0 \Rightarrow a = \pm2$.'
        check: '$a = 2$: $2x^2 + 4x + 2 = 0$, $x = -1$, $y = 1$; $1 + 1 = 2$ ✓.'
        answer: '$a = \pm2$'
        src: b065
    questions:
      - type: numeric
        cat: problem
        q: 'При каком $a$ система $\begin{cases} 2x + ay = 4 \\ x + 3y = 2 \end{cases}$ имеет бесконечно много решений?'
        num: { value: 6, unit: '', check: '3*2' }
        hint: '$\frac21 = \frac a3 = \frac42$.'
        explain: '$\frac a3 = 2 \Rightarrow a = 6$, и свободные члены в том же отношении.'
        f: [2]
        sol: { method: 'Отношения коэффициентов.', steps: ['$\frac21 = 2$, $\frac42 = 2$.', '$\frac a3 = 2 \Rightarrow a = 6$.'], answer: '6' }
        src: b065
      - type: numeric
        cat: problem
        q: 'При каком $a$ система $\begin{cases} 3x - 2y = 5 \\ ax + 4y = 1 \end{cases}$ не имеет решений?'
        num: { value: -6, unit: '', check: '3*4/(-2)' }
        hint: '$\frac3a = \frac{-2}{4}$.'
        explain: '$a = -6$; тогда $\frac51 \ne -\frac12$ — решений нет.'
        f: [2]
        sol: { method: 'Условие несовместности.', steps: ['$\Delta = 3 \cdot 4 - (-2)a = 12 + 2a = 0 \Rightarrow a = -6$.', 'Второе уравнение: $-6x + 4y = 1$, то есть $3x - 2y = -\frac12 \ne 5$.'], answer: '−6' }
        src: b065
      - type: numeric
        cat: problem
        q: 'При каком $a$ решение системы $\begin{cases} x + y = a \\ x - y = 4 \end{cases}$ имеет $x = 5$?'
        num: { value: 6, unit: '', check: '2*5-4' }
        hint: 'Сложите уравнения.'
        explain: '$2x = a + 4 = 10$, $a = 6$.'
        sol: { method: 'Выразить $x$ через $a$.', steps: ['$x = \frac{a + 4}{2}$.', '$\frac{a + 4}{2} = 5 \Rightarrow a = 6$.'], answer: '6' }
        src: b065
      - type: numeric
        cat: problem
        q: 'При каком положительном $a$ система $\begin{cases} x^2 + y^2 = 8 \\ x + y = a \end{cases}$ имеет единственное решение?'
        num: { value: 4, unit: '', check: 'Math.sqrt(16)' }
        hint: 'Подставьте $y = a - x$ и приравняйте дискриминант к нулю.'
        explain: '$2x^2 - 2ax + a^2 - 8 = 0$, $\frac D4 = 16 - a^2 = 0$, $a = 4$.'
        sol: { method: 'Касание.', steps: ['$x^2 + (a - x)^2 = 8 \Rightarrow 2x^2 - 2ax + a^2 - 8 = 0$.', '$\frac D4 = a^2 - 2(a^2 - 8) = 16 - a^2 = 0$.', '$a = 4$ (положительное).'], check: '$a = 4$: $x = y = 2$, $4 + 4 = 8$.', answer: '4' }
        src: b065
      - type: numeric
        cat: problem
        q: 'При каком $a$ система $\begin{cases} ax + y = 3 \\ 4x + ay = 6 \end{cases}$ не имеет решений?'
        num: { value: -2, unit: '', check: '-2' }
        hint: '$\Delta = a^2 - 4$; проверьте оба значения.'
        explain: '$a = 2$: уравнения совпадают (бесконечно много); $a = -2$: $-2x + y = 3$ и $-2x + y = -3$ — нет решений.'
        f: [1]
        sol: { method: 'Разбор $\Delta = 0$.', steps: ['$a^2 - 4 = 0$: $a = \pm2$.', '$a = 2$: $2x + y = 3$ и $4x + 2y = 6$ — одно и то же.', '$a = -2$: второе уравнение $4x - 2y = 6 \iff -2x + y = -3 \ne 3$.'], answer: '−2' }
        src: b065
      - type: numeric
        cat: problem
        q: 'Сколько существует значений $a$, при которых система $\begin{cases} x + ay = 1 \\ ax + y = 2 \end{cases}$ не имеет решений?'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Разберите $\Delta = 1 - a^2 = 0$.'
        explain: 'Оба значения $a = 1$ и $a = -1$ дают противоречие — два значения.'
        f: [1]
        sol: { method: 'Разбор $\Delta = 0$.', steps: ['$a = \pm1$.', 'В обоих случаях получаем противоречивые уравнения.'], answer: '2' }
        src: b065
      - type: single
        cat: theory
        q: 'Линейная система $\begin{cases} a_1x + b_1y = c_1 \\ a_2x + b_2y = c_2 \end{cases}$ имеет единственное решение тогда и только тогда, когда…'
        opts: ['$a_1b_2 - a_2b_1 \ne 0$', '$a_1b_2 - a_2b_1 = 0$', '$c_1 = c_2$', '$a_1 = a_2$']
        ans: a
        hint: 'Определитель системы.'
        explain: 'При $\Delta \ne 0$ прямые не параллельны и пересекаются в одной точке.'
        f: [1]
        src: b065
      - type: single
        cat: theory
        q: 'Если $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$, то система…'
        opts: ['имеет бесконечно много решений', 'не имеет решений', 'имеет одно решение', 'имеет два решения']
        ans: a
        hint: 'Уравнения пропорциональны.'
        explain: 'Одно уравнение получается из другого умножением на число — прямые совпадают.'
        f: [2]
        src: b065
