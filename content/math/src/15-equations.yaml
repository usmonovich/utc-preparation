  # ───────────────────────────── 1.5.3 ─────────────────────────────
  - id: ma-1-5-3
    num: '1.5.3'
    title: Теорема Виета
    pages: [b048, b049]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.3'
      summary: 'Задания на вычисление выражений от корней (суммы квадратов, кубов, обратных величин) без нахождения самих корней, на подбор корней и составление уравнения по корням.'
    stage: verified
    stageNote: 'Значения симметрических выражений проверены по явным корням.'
    sourcesChecked: '2026-10-25'
    web: [*rs-quad, *kfu-par]
    theory:
      - kind: law
        title: Теорема Виета и обратная теорема
        body: |
          Если $x_1, x_2$ — корни $ax^2 + bx + c = 0$ (при $D \ge 0$), то
          $$x_1 + x_2 = -\frac ba,\qquad x_1 x_2 = \frac ca.$$
          Для приведённого $x^2 + px + q = 0$: $x_1 + x_2 = -p$, $x_1 x_2 = q$.
          **Обратная теорема**: если $u + v = -p$ и $uv = q$, то $u$ и $v$ — корни уравнения $x^2 + px + q = 0$. Так удобно подбирать целые корни: у $x^2 - 7x + 10 = 0$ это $2$ и $5$.
          Важно: при $D < 0$ действительных корней нет, и формулы Виета «для действительных корней» неприменимы.
        src: b048
      - kind: rule
        title: Симметрические выражения от корней
        body: |
          Пусть $s = x_1 + x_2$, $p = x_1 x_2$. Тогда
          - $x_1^2 + x_2^2 = s^2 - 2p$;
          - $\frac1{x_1} + \frac1{x_2} = \frac sp$ ($p \ne 0$);
          - $x_1^3 + x_2^3 = s^3 - 3ps$;
          - $(x_1 - x_2)^2 = s^2 - 4p$, $|x_1 - x_2| = \frac{\sqrt D}{|a|}$.
        src: b048
      - kind: rule
        title: Знаки корней
        body: |
          При $D \ge 0$:
          - $p > 0$, $s > 0$ — оба корня положительны; $p > 0$, $s < 0$ — оба отрицательны;
          - $p < 0$ — корни разных знаков (тогда $D > 0$ автоматически, так как $ac < 0$).
        src: b049
    formulas:
      - title: Формулы Виета
        tex: 'x_1 + x_2 = -\frac ba,\qquad x_1 x_2 = \frac ca'
        meaning: '$x_1, x_2$ — корни $ax^2 + bx + c = 0$, $a \ne 0$, $D \ge 0$.'
        use: 'Выражения от корней без их нахождения; подбор корней; проверка.'
        limits: 'Сначала убедитесь, что $D \ge 0$.'
        src: b048
      - title: Сумма квадратов и кубов корней
        tex: 'x_1^2 + x_2^2 = s^2 - 2p,\qquad x_1^3 + x_2^3 = s^3 - 3ps'
        meaning: '$s = x_1 + x_2$, $p = x_1 x_2$.'
        use: 'Вычисление выражений по формулам Виета.'
        src: b048
      - title: Уравнение по корням
        tex: 'x^2 - (x_1 + x_2)x + x_1 x_2 = 0'
        meaning: 'Приведённое уравнение с заданными корнями $x_1, x_2$.'
        use: 'Составить уравнение: корни $2 \pm \sqrt3$ — уравнение $x^2 - 4x + 1 = 0$.'
        src: b048
    examples:
      - title: Подбор корней
        given: 'Решите уравнение $x^2 - 7x + 10 = 0$ подбором.'
        find: 'корни.'
        method: 'Обратная теорема Виета: ищем два числа с суммой 7 и произведением 10.'
        steps:
          - 'Делители 10: $1 \cdot 10$, $2 \cdot 5$; сумма 7 только у $2$ и $5$.'
          - 'Корни: $2$ и $5$.'
        check: '$4 - 14 + 10 = 0$; $25 - 35 + 10 = 0$ ✓.'
        answer: '$2$; $5$'
        src: b048
      - title: Выражения от корней
        given: '$x_1, x_2$ — корни уравнения $x^2 - 3x - 5 = 0$. Найдите $x_1^2 + x_2^2$ и $\frac1{x_1} + \frac1{x_2}$.'
        find: 'значения выражений.'
        method: 'Формулы Виета и симметрические выражения.'
        steps:
          - '$D = 9 + 20 = 29 > 0$ — корни есть.'
          - '$s = 3$, $p = -5$.'
          - '$x_1^2 + x_2^2 = 9 + 10 = 19$; $\frac1{x_1} + \frac1{x_2} = \frac{3}{-5} = -0{,}6$.'
        check: 'Корни $\frac{3 \pm \sqrt{29}}{2} \approx 4{,}193$ и $-1{,}193$: $17{,}58 + 1{,}42 = 19{,}0$ ✓.'
        answer: '$19$ и $-0{,}6$'
        src: b048
      - title: Второй корень и коэффициент
        given: 'Один из корней уравнения $x^2 + px - 12 = 0$ равен $3$. Найдите второй корень и $p$.'
        find: '$x_2$, $p$.'
        method: 'Произведение корней равно $-12$, сумма — $-p$.'
        steps:
          - '$3 \cdot x_2 = -12 \Rightarrow x_2 = -4$.'
          - '$3 + (-4) = -1 = -p \Rightarrow p = 1$.'
        check: '$9 + 3 - 12 = 0$; $16 - 4 - 12 = 0$ ✓.'
        answer: '$x_2 = -4$, $p = 1$'
        src: b048
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите сумму корней уравнения $2x^2 - 9x + 4 = 0$.'
        num: { value: 4.5, unit: '', check: '9/2' }
        hint: '$x_1 + x_2 = -\frac ba$; проверьте $D$.'
        explain: '$D = 81 - 32 > 0$; сумма $\frac92 = 4{,}5$.'
        f: [1]
        sol: { method: 'Теорема Виета.', steps: ['$D = 49 > 0$.', '$x_1 + x_2 = \frac92 = 4{,}5$.'], check: 'Корни $4$ и $\frac12$.', answer: '4,5' }
        src: b048
      - type: numeric
        cat: problem
        q: 'Найдите произведение корней уравнения $3x^2 + 5x - 12 = 0$.'
        num: { value: -4, unit: '', check: '-12/3' }
        hint: '$x_1 x_2 = \frac ca$.'
        explain: '$-\frac{12}{3} = -4$; корни есть, так как $ac < 0$.'
        f: [1]
        sol: { method: 'Теорема Виета.', steps: ['$ac < 0$, значит, $D > 0$.', '$x_1 x_2 = \frac{-12}{3} = -4$.'], answer: '−4' }
        src: b048
      - type: numeric
        cat: problem
        q: '$x_1, x_2$ — корни уравнения $x^2 - 4x + 1 = 0$. Найдите $x_1^2 + x_2^2$.'
        num: { value: 14, unit: '', check: '(2+Math.sqrt(3))**2+(2-Math.sqrt(3))**2' }
        hint: '$s^2 - 2p$.'
        explain: '$16 - 2 = 14$.'
        f: [2]
        sol: { method: 'Симметрическое выражение.', steps: ['$s = 4$, $p = 1$.', '$x_1^2 + x_2^2 = 16 - 2 = 14$.'], answer: '14' }
        src: b048
      - type: numeric
        cat: problem
        q: '$x_1, x_2$ — корни уравнения $x^2 - 3x + 1 = 0$. Найдите $x_1^3 + x_2^3$.'
        num: { value: 18, unit: '', check: '((3+Math.sqrt(5))/2)**3+((3-Math.sqrt(5))/2)**3' }
        hint: '$s^3 - 3ps$.'
        explain: '$27 - 9 = 18$.'
        f: [2]
        sol: { method: 'Сумма кубов через $s$ и $p$.', steps: ['$s = 3$, $p = 1$, $D = 5 > 0$.', '$x_1^3 + x_2^3 = 27 - 3 \cdot 1 \cdot 3 = 18$.'], answer: '18' }
        src: b048
      - type: numeric
        cat: problem
        q: '$x_1, x_2$ — корни уравнения $x^2 + 5x + 3 = 0$. Найдите $(x_1 - x_2)^2$.'
        num: { value: 13, unit: '', check: '25-12' }
        hint: '$(x_1 - x_2)^2 = s^2 - 4p$.'
        explain: '$25 - 12 = 13$ — это и есть дискриминант.'
        sol: { method: 'Квадрат разности через $s$, $p$.', steps: ['$s = -5$, $p = 3$.', '$s^2 - 4p = 25 - 12 = 13$.'], answer: '13' }
        src: b048
      - type: numeric
        cat: problem
        q: 'Один из корней уравнения $x^2 - 8x + q = 0$ равен $3$. Найдите $q$.'
        num: { value: 15, unit: '', check: '3*(8-3)' }
        hint: 'Сумма корней равна 8.'
        explain: 'Второй корень $5$, $q = 3 \cdot 5 = 15$.'
        f: [1]
        sol: { method: 'Теорема Виета.', steps: ['$x_2 = 8 - 3 = 5$.', '$q = x_1 x_2 = 15$.'], check: '$9 - 24 + 15 = 0$.', answer: '15' }
        src: b048
      - type: single
        cat: theory
        q: 'Каковы знаки корней уравнения $x^2 + 7x + 10 = 0$?'
        opts: ['оба отрицательные', 'оба положительные', 'разные', 'корней нет']
        ans: a
        hint: 'Произведение $10 > 0$, сумма $-7 < 0$.'
        explain: '$D = 9 > 0$; корни одного знака (произведение положительно), сумма отрицательна — оба отрицательные ($-2$ и $-5$).'
        src: b049
      - type: single
        cat: theory
        q: 'Чему равна сумма действительных корней уравнения $x^2 + x + 5 = 0$?'
        opts: ['действительных корней нет', '$-1$', '$1$', '$5$']
        ans: a
        hint: 'Перед применением теоремы Виета проверьте дискриминант.'
        explain: '$D = 1 - 20 < 0$. Формальный ответ «$-1$» неверен.'
        f: [1]
        src: b048

  # ───────────────────────────── 1.5.4 ─────────────────────────────
  - id: ma-1-5-4
    num: '1.5.4'
    title: Рациональные уравнения
    pages: [b049, b050, b051, b052]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.4'
      summary: 'Задания на уравнения с неизвестным в знаменателе, биквадратные уравнения и уравнения, решаемые заменой переменной.'
    stage: verified
    stageNote: 'Корни подставлены в исходные уравнения; посторонние корни отброшены.'
    sourcesChecked: '2026-10-25'
    web: [*os-86, *rs-alg]
    theory:
      - kind: rule
        title: Дробь равна нулю
        body: |
          $\frac{P(x)}{Q(x)} = 0 \iff P(x) = 0$ **и** $Q(x) \ne 0$.
          Общий план для уравнений с дробями:
          1. найти значения, при которых знаменатели обращаются в ноль (они запрещены);
          2. перенести всё в одну часть и привести к общему знаменателю (или умножить обе части на общий знаменатель);
          3. решить полученное уравнение и **отбросить** запрещённые значения — **посторонние корни**.
        src: b049
      - kind: rule
        title: Замена переменной
        body: |
          - **Биквадратное** уравнение $ax^4 + bx^2 + c = 0$: $t = x^2$, $t \ge 0$; каждый положительный корень $t$ даёт два корня $x = \pm\sqrt t$, $t = 0$ — один, отрицательный — ни одного.
          - Повторяющееся выражение: в $(x^2 + x)^2 - 8(x^2 + x) + 12 = 0$ берут $t = x^2 + x$.
          - Взаимно обратные: $t = x + \frac1x$, тогда $x^2 + \frac1{x^2} = t^2 - 2$.
        src: b050
    formulas:
      - title: Условие равенства дроби нулю
        tex: '\frac{P(x)}{Q(x)} = 0 \iff \begin{cases} P(x) = 0, \\ Q(x) \ne 0 \end{cases}'
        meaning: '$P$, $Q$ — многочлены.'
        use: 'Любое дробно-рациональное уравнение после переноса всех слагаемых в одну часть.'
        limits: 'Без проверки $Q(x) \ne 0$ появляются посторонние корни.'
        src: b049
      - title: Биквадратное уравнение
        tex: 'ax^4 + bx^2 + c = 0,\quad t = x^2 \ge 0:\quad at^2 + bt + c = 0'
        meaning: '$t$ — новая переменная; возвращаемся к $x = \pm\sqrt t$.'
        use: 'Уравнения, где неизвестное входит только в чётных степенях 4 и 2.'
        limits: 'Отрицательные корни $t$ отбрасываются.'
        src: b050
      - title: Взаимно обратные слагаемые
        tex: 't = x + \frac1x \ \Rightarrow\ x^2 + \frac1{x^2} = t^2 - 2'
        meaning: '$x \ne 0$; $|t| \ge 2$ для действительных $x$.'
        use: 'Уравнения вида $x^2 + \frac{1}{x^2} + k\left(x + \frac1x\right) + m = 0$.'
        src: b050
    examples:
      - title: Посторонний корень
        given: 'Решите уравнение $\dfrac{x^2}{x - 2} = \dfrac{4}{x - 2}$.'
        find: 'корни.'
        method: 'Умножить на $x - 2$ и проверить запрещённое значение.'
        steps:
          - 'Запрещено $x = 2$.'
          - '$x^2 = 4 \Rightarrow x = \pm 2$.'
          - '$x = 2$ — посторонний корень; остаётся $x = -2$.'
        check: '$\frac{4}{-4} = -1 = \frac{4}{-4}$ ✓.'
        answer: '$x = -2$'
        src: b049
      - title: Общий знаменатель
        given: 'Решите уравнение $\dfrac{3}{x - 1} + \dfrac{1}{x + 1} = \dfrac{4}{x^2 - 1}$.'
        find: 'корни.'
        method: 'Общий знаменатель $x^2 - 1 = (x - 1)(x + 1)$.'
        steps:
          - 'Запрещено $x = \pm1$.'
          - '$3(x + 1) + (x - 1) = 4$.'
          - '$4x + 2 = 4$, $x = \frac12$ — допустимо.'
        check: '$\frac{3}{-0{,}5} + \frac{1}{1{,}5} = -6 + \frac23 = -\frac{16}{3}$; $\frac{4}{-0{,}75} = -\frac{16}{3}$ ✓.'
        answer: '$x = \frac12$'
        src: b049
      - title: Биквадратное уравнение
        given: 'Решите уравнение $x^4 - 5x^2 + 4 = 0$.'
        find: 'корни.'
        method: 'Замена $t = x^2$.'
        steps:
          - '$t^2 - 5t + 4 = 0$: $t = 1$ или $t = 4$ (оба положительны).'
          - '$x^2 = 1 \Rightarrow x = \pm1$; $x^2 = 4 \Rightarrow x = \pm2$.'
        check: '$1 - 5 + 4 = 0$; $16 - 20 + 4 = 0$ ✓.'
        answer: '$\pm1$; $\pm2$'
        src: b050
    questions:
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\dfrac{x^2 - 4x}{x - 4} = 0$.'
        num: { value: 0, unit: '', tolAbs: 0.001, check: '0' }
        hint: 'Числитель $x(x - 4)$; знаменатель не равен нулю.'
        explain: '$x = 0$ или $x = 4$, но $x = 4$ запрещено. Ответ $0$.'
        f: [1]
        sol: { method: 'Дробь равна нулю.', steps: ['$x(x - 4) = 0$: $x = 0$ или $x = 4$.', '$x \ne 4$ (знаменатель).', 'Ответ: $x = 0$.'], answer: '0' }
        src: b049
      - type: numeric
        cat: problem
        q: 'Найдите произведение корней уравнения $\dfrac6x = x - 1$.'
        num: { value: -6, unit: '', check: '3*(-2)' }
        hint: 'Умножьте на $x \ne 0$.'
        explain: '$x^2 - x - 6 = 0$, корни $3$ и $-2$, оба допустимы; произведение $-6$.'
        sol: { method: 'Свести к квадратному уравнению.', steps: ['$6 = x^2 - x$, $x \ne 0$.', '$x^2 - x - 6 = 0$: $x = 3$, $x = -2$.', 'Произведение $-6$.'], check: '$\frac63 = 2 = 3 - 1$; $\frac{6}{-2} = -3 = -2 - 1$.', answer: '−6' }
        src: b049
      - type: numeric
        cat: problem
        q: 'Найдите сумму положительных корней уравнения $x^4 - 13x^2 + 36 = 0$.'
        num: { value: 5, unit: '', check: '2+3' }
        hint: '$t = x^2$: $t^2 - 13t + 36 = 0$.'
        explain: '$t = 4$ или $9$; $x = \pm2$, $\pm3$; положительные $2 + 3 = 5$.'
        f: [2]
        sol: { method: 'Биквадратное уравнение.', steps: ['$t^2 - 13t + 36 = 0$: $t = 4$, $t = 9$.', '$x = \pm2$, $x = \pm3$.', '$2 + 3 = 5$.'], answer: '5' }
        src: b050
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\dfrac{x + 1}{x - 3} = 3$.'
        num: { value: 5, unit: '', check: '(9+1)/(3-1)' }
        hint: 'Умножьте на $x - 3 \ne 0$.'
        explain: '$x + 1 = 3x - 9$, $x = 5$.'
        sol: { method: 'Пропорция с проверкой знаменателя.', steps: ['$x + 1 = 3(x - 3)$, $x \ne 3$.', '$2x = 10$, $x = 5$.'], check: '$\frac62 = 3$.', answer: '5' }
        src: b049
      - type: numeric
        cat: problem
        q: 'Сколько действительных корней у уравнения $x^4 + 3x^2 - 4 = 0$?'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Отрицательные значения $t = x^2$ не дают корней.'
        explain: '$t = 1$ или $t = -4$ (отбрасываем); $x = \pm1$ — два корня.'
        f: [2]
        sol: { method: 'Биквадратное уравнение.', steps: ['$t^2 + 3t - 4 = 0$: $t = 1$, $t = -4$.', '$t = -4 < 0$ не подходит.', '$x^2 = 1$: $x = \pm1$.'], answer: '2' }
        src: b050
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\dfrac{x^2 - 1}{x + 1} = 5$.'
        num: { value: 6, unit: '', check: '5+1' }
        hint: 'Сократите дробь, помня про $x \ne -1$.'
        explain: '$x - 1 = 5$, $x = 6$.'
        sol: { method: 'Сокращение с учётом запрета.', steps: ['$\frac{(x - 1)(x + 1)}{x + 1} = x - 1$ при $x \ne -1$.', '$x - 1 = 5$, $x = 6$.'], answer: '6' }
        src: b049
      - type: numeric
        cat: problem
        q: 'Найдите сумму всех корней уравнения $(x^2 + x)^2 - 8(x^2 + x) + 12 = 0$.'
        num: { value: -2, unit: '', check: '1-2+2-3' }
        hint: 'Замена $t = x^2 + x$.'
        explain: '$t = 2$: $x = 1$, $-2$; $t = 6$: $x = 2$, $-3$. Сумма $-2$.'
        f: [1]
        sol: { method: 'Замена переменной.', steps: ['$t^2 - 8t + 12 = 0$: $t = 2$, $t = 6$.', '$x^2 + x - 2 = 0$: $1$, $-2$.', '$x^2 + x - 6 = 0$: $2$, $-3$.', 'Сумма: $1 - 2 + 2 - 3 = -2$.'], answer: '−2' }
        src: b050
      - type: single
        cat: theory
        q: 'Почему $x = 2$ не является корнем уравнения $\dfrac{x^2}{x - 2} = \dfrac{4}{x - 2}$?'
        opts: ['при $x = 2$ знаменатель равен нулю', 'при $x = 2$ не выполняется $x^2 = 4$', 'у уравнения нет корней', '$x = 2$ — корень']
        ans: a
        hint: 'Подставьте $x = 2$ в исходное уравнение.'
        explain: 'Обе дроби при $x = 2$ не определены; это посторонний корень, появившийся после умножения на $x - 2$.'
        f: [1]
        src: b049

  # ───────────────────────────── 1.5.5 ─────────────────────────────
  - id: ma-1-5-5
    num: '1.5.5'
    title: Параметрические линейные уравнения
    pages: [b052, b053]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.5'
      summary: 'Задания на исследование линейного уравнения с параметром: при каких значениях параметра уравнение имеет один корень, бесконечно много корней или не имеет корней; условия на корень.'
    stage: verified
    stageNote: 'Каждый случай проверен подстановкой значения параметра.'
    sourcesChecked: '2026-10-25'
    web: [*kfu-par, *os-23]
    theory:
      - kind: rule
        title: Исследование уравнения A(a)·x = B(a)
        body: |
          1. Раскрыть скобки и привести уравнение к виду $A(a)\,x = B(a)$, где $A$ и $B$ зависят от параметра $a$.
          2. Найти «контрольные» значения $a$, при которых $A(a) = 0$.
          3. При $A(a) \ne 0$ — единственный корень $x = \frac{B(a)}{A(a)}$.
          4. При каждом контрольном $a$ подставить его: $0 \cdot x = 0$ — корней бесконечно много; $0 \cdot x = B \ne 0$ — корней нет.
        src: b052
      - kind: rule
        title: Условия на корень
        body: |
          Если требуется, чтобы корень удовлетворял условию (был положительным, больше 3, целым…), записывают корень через параметр и решают получившееся неравенство — **только** при тех $a$, где корень единственный.
          Пример: $2x - a = 4 \Rightarrow x = \frac{4 + a}{2}$; $x > 3 \iff a > 2$.
        src: b052
    formulas:
      - title: Решения линейного уравнения с параметром
        tex: 'A x = B:\quad \begin{cases} A \ne 0: & x = \frac BA\ \text{(один корень)}, \\ A = 0,\ B = 0: & x \in \mathbb R, \\ A = 0,\ B \ne 0: & \text{корней нет} \end{cases}'
        meaning: '$A = A(a)$, $B = B(a)$ — выражения с параметром.'
        use: 'Любое уравнение, линейное относительно $x$.'
        limits: 'Сокращать на выражение с параметром можно только после отдельного разбора, когда оно равно нулю.'
        src: b052
    examples:
      - title: Полное исследование
        given: 'Решите уравнение $(a^2 - 1)x = a + 1$ при всех значениях $a$.'
        find: 'корни в зависимости от $a$.'
        method: 'Контрольные значения $a^2 - 1 = 0$: $a = \pm1$.'
        steps:
          - '$a \ne \pm1$: $x = \frac{a + 1}{(a - 1)(a + 1)} = \frac{1}{a - 1}$.'
          - '$a = 1$: $0 \cdot x = 2$ — корней нет.'
          - '$a = -1$: $0 \cdot x = 0$ — $x$ любое.'
        check: '$a = 3$: $8x = 4$, $x = \frac12 = \frac{1}{3 - 1}$ ✓.'
        answer: '$a \ne \pm1$: $x = \frac{1}{a - 1}$; $a = 1$: нет корней; $a = -1$: $x$ — любое'
        src: b052
      - title: Когда нет корней
        given: 'При каком $a$ уравнение $a(x - 2) = 3x + 1$ не имеет корней?'
        find: '$a$.'
        method: 'Привести к виду $A x = B$.'
        steps:
          - '$ax - 2a = 3x + 1 \Rightarrow (a - 3)x = 2a + 1$.'
          - '$A = 0$ при $a = 3$; тогда $B = 7 \ne 0$ — корней нет.'
        check: '$a = 3$: $3x - 6 = 3x + 1$, $-6 = 1$ — противоречие ✓.'
        answer: '$a = 3$'
        src: b052
      - title: Условие на корень
        given: 'При каких $a$ корень уравнения $2x - a = 4$ больше $3$?'
        find: 'значения $a$.'
        method: 'Выразить корень через $a$.'
        steps:
          - '$x = \frac{4 + a}{2}$ (единственный при любом $a$).'
          - '$\frac{4 + a}{2} > 3 \iff 4 + a > 6 \iff a > 2$.'
        check: '$a = 4$: $x = 4 > 3$; $a = 0$: $x = 2 < 3$ ✓.'
        answer: '$a > 2$'
        src: b052
    questions:
      - type: numeric
        cat: problem
        q: 'При каком $a$ уравнение $(a - 5)x = a^2 - 25$ имеет бесконечно много решений?'
        num: { value: 5, unit: '', check: '5' }
        hint: 'Нужно $A = 0$ и $B = 0$ одновременно.'
        explain: '$a - 5 = 0 \Rightarrow a = 5$; тогда $a^2 - 25 = 0$ — $0 \cdot x = 0$.'
        f: [1]
        sol: { method: 'Случай $A = 0$, $B = 0$.', steps: ['$A = a - 5 = 0 \Rightarrow a = 5$.', '$B = 25 - 25 = 0$ — любое $x$.'], answer: '5' }
        src: b052
      - type: numeric
        cat: problem
        q: 'При каком $a$ уравнение $(a + 2)x = 3$ не имеет корней?'
        num: { value: -2, unit: '', check: '-2' }
        hint: 'Коэффициент при $x$ равен нулю, правая часть — нет.'
        explain: '$a = -2$: $0 \cdot x = 3$.'
        f: [1]
        sol: { method: 'Случай $A = 0$, $B \ne 0$.', steps: ['$a + 2 = 0 \Rightarrow a = -2$.', '$0 \cdot x = 3$ — корней нет.'], answer: '−2' }
        src: b052
      - type: numeric
        cat: problem
        q: 'При каком $a$ корень уравнения $ax = 12$ равен $4$?'
        num: { value: 3, unit: '', check: '12/4' }
        hint: 'Подставьте $x = 4$.'
        explain: '$4a = 12$, $a = 3$.'
        sol: { method: 'Подстановка корня.', steps: ['$a \cdot 4 = 12$.', '$a = 3$.'], answer: '3' }
        src: b052
      - type: numeric
        cat: problem
        q: 'При каком $a$ уравнения $3x - 6 = 0$ и $ax + 4 = 0$ имеют один и тот же корень?'
        num: { value: -2, unit: '', check: '-4/2' }
        hint: 'Корень первого уравнения подставьте во второе.'
        explain: '$x = 2$; $2a + 4 = 0$, $a = -2$.'
        sol: { method: 'Общий корень.', steps: ['$3x - 6 = 0 \Rightarrow x = 2$.', '$2a + 4 = 0 \Rightarrow a = -2$.'], answer: '−2' }
        src: b052
      - type: numeric
        cat: problem
        q: 'При каком $a$ уравнение $(a^2 - 4)x = a - 2$ имеет бесконечно много решений?'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Проверьте оба значения $a = \pm2$.'
        explain: '$a = 2$: $0 \cdot x = 0$; $a = -2$: $0 \cdot x = -4$ — нет корней.'
        f: [1]
        sol: { method: 'Перебор контрольных значений.', steps: ['$a^2 - 4 = 0$: $a = \pm2$.', '$a = 2$: $B = 0$ — бесконечно много.', '$a = -2$: $B = -4$ — корней нет.'], answer: '2' }
        src: b052
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое $a$, при котором корень уравнения $x - a = 2x - 5$ положителен.'
        num: { value: 4, unit: '', check: '4' }
        hint: 'Выразите $x$ через $a$.'
        explain: '$x = 5 - a > 0 \iff a < 5$; наибольшее целое — $4$.'
        sol: { method: 'Условие на корень.', steps: ['$x - 2x = a - 5 \Rightarrow x = 5 - a$.', '$5 - a > 0 \iff a < 5$.', 'Наибольшее целое $a = 4$.'], check: '$a = 4$: $x = 1 > 0$; $a = 5$: $x = 0$.', answer: '4' }
        src: b052
      - type: single
        cat: theory
        q: 'Уравнение $0 \cdot x = a$ имеет решения…'
        opts: ['только при $a = 0$ (тогда любое $x$)', 'при любом $a$', 'ни при каком $a$', 'только при $a \ne 0$']
        ans: a
        hint: 'Левая часть всегда равна нулю.'
        explain: '$0 = a$ верно только при $a = 0$, и тогда подходит любое $x$.'
        f: [1]
        src: b052
      - type: single
        cat: theory
        q: 'Можно ли в уравнении $(a - 1)x = a - 1$ сразу разделить обе части на $a - 1$ и написать $x = 1$?'
        opts: ['нет: при $a = 1$ корень — любое число', 'да, при любом $a$', 'нет: при $a = 1$ корней нет', 'да, но только при $a > 1$']
        ans: a
        hint: 'Делить на ноль нельзя.'
        explain: 'При $a \ne 1$ действительно $x = 1$, но при $a = 1$ получается $0 \cdot x = 0$ — любое $x$.'
        f: [1]
        src: b052

  # ───────────────────────────── 1.5.6 ─────────────────────────────
  - id: ma-1-5-6
    num: '1.5.6'
    title: Параметрические квадратные уравнения
    pages: [b053, b054, b055, b056, b057, b058, b059]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.6'
      summary: 'Задания на квадратные уравнения с параметром: число корней, совпадающие корни, корни заданных знаков, значение параметра по известному корню или выражению от корней.'
    stage: verified
    stageNote: 'Найденные значения параметра проверены подстановкой и пересчётом дискриминанта.'
    sourcesChecked: '2026-10-25'
    web: [*kfu-par, *rs-quad]
    theory:
      - kind: rule
        title: Сначала — старший коэффициент
        body: |
          В уравнении $A(a)x^2 + B(a)x + C(a) = 0$ сначала разбирают случай $A(a) = 0$: уравнение становится **линейным** и может иметь один корень, хотя «дискриминант» к нему неприменим.
          При $A(a) \ne 0$ число корней определяет $D(a)$: два — при $D > 0$, один — при $D = 0$, нет — при $D < 0$.
          Пример: $(a - 1)x^2 + 2x + 1 = 0$ имеет ровно один корень при $a = 1$ (линейное) и при $a = 2$ ($D = 0$).
        src: b053
      - kind: rule
        title: Знаки корней и положение относительно числа
        body: |
          Через теорему Виета ($s = x_1 + x_2$, $p = x_1x_2$):
          - корни **разных знаков** $\iff p = \frac CA < 0$ (дискриминант тогда положителен сам);
          - **оба положительны** $\iff D \ge 0$, $s > 0$, $p > 0$;
          - **оба отрицательны** $\iff D \ge 0$, $s < 0$, $p > 0$.
          Число $M$ лежит **между** корнями $\iff A \cdot f(M) < 0$, где $f(x) = Ax^2 + Bx + C$.
        src: b054
    formulas:
      - title: Число корней квадратного уравнения с параметром
        tex: 'A \ne 0:\quad D = B^2 - 4AC \begin{cases} > 0 & \text{два корня}, \\ = 0 & \text{один корень}, \\ < 0 & \text{нет корней} \end{cases}'
        meaning: '$A$, $B$, $C$ зависят от параметра.'
        use: 'Задачи «при каких $a$ уравнение имеет … корней».'
        limits: 'Случай $A = 0$ разбирается отдельно.'
        src: b053
      - title: Корни разных знаков
        tex: 'x_1 x_2 < 0 \iff \frac CA < 0'
        meaning: 'Произведение корней по теореме Виета.'
        use: 'Проверять $D$ не нужно: при $AC < 0$ $D = B^2 - 4AC > 0$.'
        src: b054
      - title: Число между корнями
        tex: 'x_1 < M < x_2 \iff A \cdot f(M) < 0'
        meaning: '$f(x) = Ax^2 + Bx + C$, $A \ne 0$, $M$ — данное число.'
        use: 'Задачи на расположение корней относительно точки.'
        src: b055
    examples:
      - title: Ровно один корень
        given: 'При каких $a$ уравнение $(a - 1)x^2 + 2x + 1 = 0$ имеет ровно один корень?'
        find: 'значения $a$.'
        method: 'Отдельно $a = 1$, затем $D = 0$.'
        steps:
          - '$a = 1$: $2x + 1 = 0$, один корень $x = -\frac12$.'
          - '$a \ne 1$: $\frac D4 = 1 - (a - 1) = 2 - a = 0 \Rightarrow a = 2$; уравнение $x^2 + 2x + 1 = 0$, $x = -1$.'
        check: 'При $a = 0$: $-x^2 + 2x + 1 = 0$, $\frac D4 = 2 > 0$ — два корня, так что $a = 0$ не подходит ✓.'
        answer: '$a = 1$ или $a = 2$'
        src: b053
      - title: Два различных корня
        given: 'При каких $m$ уравнение $x^2 - 2mx + m + 2 = 0$ имеет два различных корня?'
        find: 'значения $m$.'
        method: 'Условие $D > 0$.'
        steps:
          - '$\frac D4 = m^2 - m - 2 = (m - 2)(m + 1) > 0$.'
          - '$m < -1$ или $m > 2$.'
        check: '$m = 3$: $x^2 - 6x + 5 = 0$, корни $1$ и $5$; $m = 0$: $x^2 + 2 = 0$ — корней нет ✓.'
        answer: '$m < -1$ или $m > 2$'
        src: b053
      - title: Два положительных корня
        given: 'При каких $k$ уравнение $x^2 - 2x + k = 0$ имеет два различных положительных корня?'
        find: 'значения $k$.'
        method: '$D > 0$, $s > 0$, $p > 0$.'
        steps:
          - '$\frac D4 = 1 - k > 0 \Rightarrow k < 1$.'
          - '$s = 2 > 0$ — всегда; $p = k > 0$.'
          - 'Итого $0 < k < 1$.'
        check: '$k = 0{,}75$: корни $0{,}5$ и $1{,}5$; $k = 0$: корни $0$ и $2$ — не оба положительны ✓.'
        answer: '$0 < k < 1$'
        src: b054
    questions:
      - type: numeric
        cat: problem
        q: 'При каком положительном $a$ уравнение $x^2 + ax + 9 = 0$ имеет единственный корень?'
        num: { value: 6, unit: '', check: 'Math.sqrt(36)' }
        hint: '$D = a^2 - 36 = 0$.'
        explain: '$a = \pm6$, положительное — $6$; тогда $(x + 3)^2 = 0$.'
        f: [1]
        sol: { method: 'Условие $D = 0$.', steps: ['$a^2 - 36 = 0$, $a = \pm6$.', 'Положительное значение $a = 6$.'], answer: '6' }
        src: b053
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое $k$, при котором уравнение $x^2 - 6x + k = 0$ имеет два различных корня.'
        num: { value: 8, unit: '', check: '8' }
        hint: '$D > 0$.'
        explain: '$36 - 4k > 0 \iff k < 9$; наибольшее целое — $8$.'
        f: [1]
        sol: { method: 'Условие $D > 0$.', steps: ['$36 - 4k > 0$.', '$k < 9$, наибольшее целое $k = 8$.'], check: '$k = 8$: корни $2$ и $4$.', answer: '8' }
        src: b053
      - type: numeric
        cat: problem
        q: 'При каком $a$ один из корней уравнения $x^2 - ax + 6 = 0$ равен $2$?'
        num: { value: 5, unit: '', check: '(4+6)/2' }
        hint: 'Подставьте $x = 2$.'
        explain: '$4 - 2a + 6 = 0$, $a = 5$; второй корень $3$.'
        sol: { method: 'Подстановка корня.', steps: ['$4 - 2a + 6 = 0$.', '$a = 5$.'], check: '$x^2 - 5x + 6 = 0$: корни $2$ и $3$.', answer: '5' }
        src: b053
      - type: numeric
        cat: problem
        q: 'Найдите сумму всех значений $a$, при которых уравнение $(a - 2)x^2 + 4x + 2 = 0$ имеет ровно один корень.'
        num: { value: 6, unit: '', check: '2+4' }
        hint: 'Не забудьте случай $a = 2$.'
        explain: '$a = 2$: $4x + 2 = 0$ — один корень; $a \ne 2$: $\frac D4 = 4 - 2(a - 2) = 8 - 2a = 0$, $a = 4$. Сумма $6$.'
        f: [1]
        sol: { method: 'Линейный случай и $D = 0$.', steps: ['$a = 2$: уравнение $4x + 2 = 0$, корень $-\frac12$.', '$a \ne 2$: $\frac D4 = 8 - 2a = 0 \Rightarrow a = 4$.', 'Сумма $2 + 4 = 6$.'], check: '$a = 4$: $2x^2 + 4x + 2 = 2(x + 1)^2$.', answer: '6' }
        src: b053
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое $a$, при котором корни уравнения $x^2 - 4x + a - 5 = 0$ имеют разные знаки.'
        num: { value: 4, unit: '', check: '4' }
        hint: 'Произведение корней отрицательно.'
        explain: '$a - 5 < 0 \iff a < 5$; наибольшее целое $4$.'
        f: [2]
        sol: { method: 'Теорема Виета.', steps: ['$x_1 x_2 = a - 5 < 0$.', '$a < 5$, наибольшее целое — $4$.'], check: '$a = 4$: $x^2 - 4x - 1 = 0$, корни $2 \pm \sqrt5$ — разных знаков.', answer: '4' }
        src: b054
      - type: numeric
        cat: problem
        q: 'При каком $m$ сумма квадратов корней уравнения $x^2 - mx + m - 1 = 0$ наименьшая?'
        num: { value: 1, unit: '', check: '1' }
        hint: '$x_1^2 + x_2^2 = s^2 - 2p$; проверьте, что корни существуют.'
        explain: '$m^2 - 2(m - 1) = (m - 1)^2 + 1$ — минимум при $m = 1$; $D = (m - 2)^2 \ge 0$ — корни есть всегда.'
        sol: { method: 'Виета и выделение полного квадрата.', steps: ['$s = m$, $p = m - 1$; $D = m^2 - 4m + 4 = (m - 2)^2 \ge 0$.', '$x_1^2 + x_2^2 = m^2 - 2m + 2 = (m - 1)^2 + 1$.', 'Наименьшее значение при $m = 1$.'], check: '$m = 1$: $x^2 - x = 0$, корни $0$ и $1$, сумма квадратов $1$.', answer: '1' }
        src: b054
      - type: single
        cat: theory
        q: 'В уравнении $ax^2 + bx + c = 0$ известно, что $ac < 0$. Что можно сказать о корнях?'
        opts: ['два корня разных знаков', 'корней нет', 'два положительных корня', 'один корень']
        ans: a
        hint: '$D = b^2 - 4ac$, произведение корней $\frac ca$.'
        explain: '$-4ac > 0$, значит, $D > 0$; $\frac ca < 0$ — корни разных знаков.'
        f: [2]
        src: b054
      - type: single
        cat: theory
        q: 'Сколько корней у уравнения $ax^2 + 2x - 1 = 0$ при $a = 0$?'
        opts: ['один: $x = \frac12$', 'два', 'ни одного', 'бесконечно много']
        ans: a
        hint: 'При $a = 0$ уравнение не квадратное.'
        explain: '$2x - 1 = 0$, $x = \frac12$. Формулу дискриминанта здесь применять нельзя.'
        f: [1]
        src: b053
