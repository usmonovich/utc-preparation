topics:
  # ───────────────────────────── 1.5.1 ─────────────────────────────
  - id: ma-1-5-1
    num: '1.5.1'
    title: Линейные уравнения. Пропорции
    pages: [b044, b045, b046, b047]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.1'
      summary: 'Задания на решение линейных уравнений (в том числе с дробными коэффициентами), пропорций и текстовых задач, сводящихся к линейному уравнению.'
    stage: verified
    stageNote: 'Все корни подставлены обратно в уравнения.'
    sourcesChecked: '2026-10-25'
    web: [*os-23, *os-87, *kfu-par]
    theory:
      - kind: definition
        title: Линейное уравнение
        body: |
          Уравнение, которое равносильными преобразованиями приводится к виду $ax = b$, называют **линейным**. Число решений зависит от коэффициентов:
          - $a \ne 0$ — ровно один корень $x = \frac{b}{a}$;
          - $a = 0$, $b = 0$ — $0 \cdot x = 0$, корень — любое число;
          - $a = 0$, $b \ne 0$ — $0 \cdot x = b$, корней нет.
        src: b044
      - kind: rule
        title: Равносильные преобразования
        body: |
          Корни уравнения не меняются, если:
          - перенести слагаемое из одной части в другую с противоположным знаком;
          - умножить или разделить обе части на одно и то же **ненулевое** число.
          Уравнение с дробными коэффициентами удобно сначала умножить на наименьший общий знаменатель: $\frac{x - 1}{3} - \frac{x + 2}{4} = 1 \ \big|\cdot 12$.
        src: b044
      - kind: law
        title: Пропорция
        body: |
          **Пропорция** — равенство двух отношений $\frac ab = \frac cd$ ($b, d \ne 0$). Основное свойство: произведение крайних членов равно произведению средних, $ad = bc$. Отсюда неизвестный член: $x = \frac{bc}{d}$ в $\frac xb = \frac cd$.
          Проценты: $p\%$ от числа $A$ равны $\frac{p}{100} A$; увеличение на $p\%$ — умножение на $1 + \frac{p}{100}$.
        src: b045
    formulas:
      - title: Корень линейного уравнения
        tex: 'ax = b,\ a \ne 0 \ \Rightarrow\ x = \frac{b}{a}'
        meaning: '$a$ — коэффициент при неизвестном, $b$ — свободный член.'
        use: 'После раскрытия скобок и переноса слагаемых.'
        limits: 'При $a = 0$ формула неприменима: решений нет ($b \ne 0$) или бесконечно много ($b = 0$).'
        src: b044
      - title: Основное свойство пропорции
        tex: '\frac ab = \frac cd \iff ad = bc\qquad (b \ne 0,\ d \ne 0)'
        meaning: '$a, d$ — крайние члены, $b, c$ — средние.'
        use: 'Решение уравнений вида «дробь = дробь»: «перекрёстное умножение».'
        limits: 'Если в знаменателе стоит неизвестное, после перемножения проверяют, что знаменатель не обращается в ноль.'
        src: b045
      - title: Производная пропорция
        tex: '\frac ab = \frac cd \ \Rightarrow\ \frac{a + b}{b} = \frac{c + d}{d},\quad \frac{a - b}{b} = \frac{c - d}{d}'
        meaning: 'Получается прибавлением (вычитанием) единицы к обеим частям.'
        use: 'Задачи на отношения: если $a : b = 3 : 2$, то $(a + b) : b = 5 : 2$.'
        src: b045
    examples:
      - title: Уравнение с дробными коэффициентами
        given: 'Решите уравнение $\dfrac{x - 1}{3} - \dfrac{x + 2}{4} = 1$.'
        find: '$x$.'
        method: 'Умножить обе части на НОК знаменателей $12$.'
        steps:
          - '$4(x - 1) - 3(x + 2) = 12$.'
          - '$4x - 4 - 3x - 6 = 12$, $x - 10 = 12$.'
          - '$x = 22$.'
        check: '$\frac{21}{3} - \frac{24}{4} = 7 - 6 = 1$ ✓.'
        answer: '$x = 22$'
        src: b044
      - title: Пропорция с неизвестным
        given: 'Решите пропорцию $\dfrac{2x + 1}{5} = \dfrac{x + 4}{3}$.'
        find: '$x$.'
        method: 'Основное свойство пропорции.'
        steps:
          - '$3(2x + 1) = 5(x + 4)$.'
          - '$6x + 3 = 5x + 20$.'
          - '$x = 17$.'
        check: '$\frac{35}{5} = 7$, $\frac{21}{3} = 7$ ✓.'
        answer: '$x = 17$'
        src: b045
      - title: Когда корней бесконечно много или нет
        given: 'Решите уравнения: а) $2(x + 3) - 5 = 2x + 1$; б) $3(x - 1) = 3x + 2$.'
        find: 'множество корней каждого уравнения.'
        method: 'Привести к виду $ax = b$ и разобрать случай $a = 0$.'
        steps:
          - 'а) $2x + 1 = 2x + 1$, то есть $0 \cdot x = 0$ — верно при любом $x$.'
          - 'б) $3x - 3 = 3x + 2$, то есть $0 \cdot x = 5$ — неверно ни при каком $x$.'
        check: 'а) при $x = 0$ и $x = 10$: $1 = 1$, $21 = 21$; б) левая часть всегда на 5 меньше правой.'
        answer: 'а) $x$ — любое число; б) корней нет'
        src: b044
    questions:
      - type: numeric
        cat: problem
        q: 'Решите уравнение $5x - 7 = 2x + 8$.'
        num: { value: 5, unit: '', check: '(8+7)/(5-2)' }
        hint: 'Неизвестные — в левую часть, числа — в правую.'
        explain: '$3x = 15$, $x = 5$.'
        f: [1]
        sol: { method: 'Перенос слагаемых.', steps: ['$5x - 2x = 8 + 7$.', '$3x = 15$, $x = 5$.'], check: '$25 - 7 = 18 = 10 + 8$.', answer: '5' }
        src: b044
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\dfrac x2 + \dfrac x3 = 10$.'
        num: { value: 12, unit: '', check: '10/(1/2+1/3)' }
        hint: 'Умножьте на 6.'
        explain: '$3x + 2x = 60$, $x = 12$.'
        sol: { method: 'Умножение на общий знаменатель.', steps: ['$3x + 2x = 60$.', '$5x = 60$, $x = 12$.'], check: '$6 + 4 = 10$.', answer: '12' }
        src: b044
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\dfrac{3x - 1}{4} = \dfrac{x + 3}{2}$.'
        num: { value: 7, unit: '', check: '(2+12)/(6-4)' }
        hint: 'Перекрёстное умножение.'
        explain: '$2(3x - 1) = 4(x + 3)$, $6x - 2 = 4x + 12$, $x = 7$.'
        f: [2]
        sol: { method: 'Основное свойство пропорции.', steps: ['$2(3x - 1) = 4(x + 3)$.', '$6x - 2 = 4x + 12$.', '$2x = 14$, $x = 7$.'], check: '$\frac{20}{4} = 5 = \frac{10}{2}$.', answer: '7' }
        src: b045
      - type: numeric
        cat: problem
        q: 'Найдите $x$ из пропорции $x : 12 = 5 : 3$.'
        num: { value: 20, unit: '', check: '12*5/3' }
        hint: 'Неизвестный крайний член равен произведению средних, делённому на известный крайний.'
        explain: '$3x = 60$, $x = 20$.'
        f: [2]
        sol: { method: 'Основное свойство пропорции.', steps: ['$3x = 12 \cdot 5 = 60$.', '$x = 20$.'], answer: '20' }
        src: b045
      - type: numeric
        cat: problem
        q: 'Число увеличили на 20 %, а результат уменьшили на 20 % и получили 96. Найдите исходное число.'
        num: { value: 100, unit: '', check: '96/(1.2*0.8)' }
        hint: 'Увеличение на 20 % — умножение на 1,2, уменьшение — на 0,8.'
        explain: '$1{,}2 \cdot 0{,}8 \cdot x = 0{,}96x = 96$, $x = 100$.'
        sol: { method: 'Составить линейное уравнение.', steps: ['После изменений: $x \cdot 1{,}2 \cdot 0{,}8 = 0{,}96x$.', '$0{,}96x = 96$, $x = 100$.'], check: '$100 \to 120 \to 96$.', answer: '100' }
        src: b045
      - type: numeric
        cat: problem
        q: 'Решите уравнение $0{,}2(x - 5) = 0{,}5x + 2$.'
        num: { value: -10, unit: '', check: '(-1-2)/(0.5-0.2)' }
        hint: 'Умножьте обе части на 10.'
        explain: '$2x - 10 = 5x + 20$, $-3x = 30$, $x = -10$.'
        sol: { method: 'Избавиться от десятичных дробей.', steps: ['$2(x - 5) = 5x + 20$.', '$2x - 10 = 5x + 20$.', '$-3x = 30$, $x = -10$.'], check: '$0{,}2 \cdot (-15) = -3$, $0{,}5 \cdot (-10) + 2 = -3$.', answer: '−10' }
        src: b044
      - type: single
        cat: theory
        q: 'Сколько корней у уравнения $4(x - 1) = 4x - 4$?'
        opts: ['бесконечно много', 'один', 'ни одного', 'два']
        ans: a
        hint: 'Раскройте скобки.'
        explain: 'Получается $0 \cdot x = 0$ — равенство верно при любом $x$.'
        f: [1]
        src: b044
      - type: single
        cat: theory
        q: 'Сколько корней у уравнения $2x + 7 = 2(x + 3)$?'
        opts: ['ни одного', 'один', 'бесконечно много', 'два']
        ans: a
        hint: 'Приведите к виду $ax = b$.'
        explain: '$2x + 7 = 2x + 6$, $0 \cdot x = -1$ — неверно ни при каком $x$.'
        f: [1]
        src: b044

  # ───────────────────────────── 1.5.2 ─────────────────────────────
  - id: ma-1-5-2
    num: '1.5.2'
    title: Квадратные уравнения
    pages: [b047, b048]
    book:
      place: 'Ч. 1, 1.5 «Уравнения», пункт 1.5.2'
      summary: 'Задания на решение квадратных уравнений (полных и неполных), нахождение корней, их числа и выражений от корней.'
    stage: verified
    stageNote: 'Корни подставлены в уравнения; дискриминанты пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*rs-quad, *rs-sq, *os-10k]
    theory:
      - kind: definition
        title: Квадратное уравнение и дискриминант
        body: |
          **Квадратное уравнение** — $ax^2 + bx + c = 0$, где $a \ne 0$. Число $D = b^2 - 4ac$ — **дискриминант**:
          - $D > 0$ — два различных корня $x_{1,2} = \frac{-b \pm \sqrt D}{2a}$;
          - $D = 0$ — один корень (два совпавших) $x = -\frac{b}{2a}$;
          - $D < 0$ — действительных корней нет.
          Формула получается **выделением полного квадрата**: $ax^2 + bx + c = a\left(x + \frac{b}{2a}\right)^2 - \frac{D}{4a}$.
        src: b047
        fig: parabola-discriminant
      - kind: rule
        title: Неполные уравнения и частные случаи
        body: |
          - $c = 0$: $x(ax + b) = 0$, корни $0$ и $-\frac ba$.
          - $b = 0$: $x^2 = -\frac ca$; корни $\pm\sqrt{-\frac ca}$, если $-\frac ca \ge 0$.
          - **Чётный** второй коэффициент $b = 2k$: $D_1 = k^2 - ac$, $x_{1,2} = \frac{-k \pm \sqrt{D_1}}{a}$ — меньше вычислений.
          - $a + b + c = 0$: корни $1$ и $\frac ca$; $\ a - b + c = 0$: корни $-1$ и $-\frac ca$.
        src: b047
      - kind: law
        title: Разложение на множители
        body: |
          Если $x_1, x_2$ — корни $ax^2 + bx + c$, то $ax^2 + bx + c = a(x - x_1)(x - x_2)$. При $D < 0$ квадратный трёхчлен на линейные множители не раскладывается и сохраняет знак числа $a$.
        src: b048
    formulas:
      - title: Формула корней
        tex: 'x_{1,2} = \frac{-b \pm \sqrt{D}}{2a},\qquad D = b^2 - 4ac'
        meaning: '$a \ne 0$, $b$, $c$ — коэффициенты; $D$ — дискриминант.'
        use: 'Любое полное квадратное уравнение; при $D < 0$ действительных корней нет.'
        variants: 'Приведённое $x^2 + px + q = 0$: $x_{1,2} = -\frac p2 \pm \sqrt{\frac{p^2}{4} - q}$.'
        src: b047
      - title: Чётный второй коэффициент
        tex: 'b = 2k:\quad x_{1,2} = \frac{-k \pm \sqrt{k^2 - ac}}{a}'
        meaning: '$k = \frac b2$; $D_1 = k^2 - ac = \frac D4$.'
        use: 'Когда $b$ чётное: $3x^2 + 14x - 5 = 0$, $k = 7$.'
        src: b047
      - title: Разложение квадратного трёхчлена
        tex: 'ax^2 + bx + c = a(x - x_1)(x - x_2)'
        meaning: '$x_1, x_2$ — корни (при $D \ge 0$).'
        use: 'Сокращение дробей, метод интервалов.'
        src: b048
      - title: Сумма коэффициентов равна нулю
        tex: 'a + b + c = 0 \Rightarrow x_1 = 1,\ x_2 = \frac ca;\qquad a - b + c = 0 \Rightarrow x_1 = -1,\ x_2 = -\frac ca'
        meaning: 'Проверка: при $x = 1$ трёхчлен равен $a + b + c$, при $x = -1$ — $a - b + c$.'
        use: 'Быстрое решение: $5x^2 - 3x - 2 = 0$ — корни $1$ и $-\frac25$.'
        src: b047
    examples:
      - title: Полное квадратное уравнение
        given: 'Решите уравнение $2x^2 - 7x + 3 = 0$.'
        find: 'корни.'
        method: 'Формула корней через дискриминант.'
        steps:
          - '$D = 49 - 4 \cdot 2 \cdot 3 = 25$, $\sqrt D = 5$.'
          - '$x_{1,2} = \frac{7 \pm 5}{4}$: $x_1 = 3$, $x_2 = \frac12$.'
        check: '$2 \cdot 9 - 21 + 3 = 0$; $2 \cdot \frac14 - \frac72 + 3 = 0$ ✓.'
        answer: '$3$; $\frac12$'
        src: b047
      - title: Чётный второй коэффициент
        given: 'Решите уравнение $3x^2 + 14x - 5 = 0$.'
        find: 'корни.'
        method: '$b = 14 = 2 \cdot 7$, формула с $D_1$.'
        steps:
          - '$k = 7$, $D_1 = 49 + 15 = 64$, $\sqrt{D_1} = 8$.'
          - '$x_{1,2} = \frac{-7 \pm 8}{3}$: $x_1 = \frac13$, $x_2 = -5$.'
        check: '$3 \cdot 25 - 70 - 5 = 0$; $\frac13 + \frac{14}{3} - 5 = 0$ ✓.'
        answer: '$\frac13$; $-5$'
        src: b047
      - title: Число корней по дискриминанту
        given: 'Сколько корней у уравнений а) $x^2 - 6x + 9 = 0$; б) $x^2 + 2x + 5 = 0$?'
        find: 'число корней.'
        method: 'Знак дискриминанта.'
        steps:
          - 'а) $D = 36 - 36 = 0$ — один корень $x = 3$ (это $(x - 3)^2 = 0$).'
          - 'б) $D = 4 - 20 = -16 < 0$ — корней нет; $x^2 + 2x + 5 = (x + 1)^2 + 4 \ge 4$.'
        check: 'Выделение полного квадрата подтверждает оба ответа.'
        answer: 'а) один; б) ни одного'
        src: b047
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите больший корень уравнения $x^2 - 5x - 14 = 0$.'
        num: { value: 7, unit: '', check: '(5+Math.sqrt(25+56))/2' }
        hint: '$D = 25 + 56$.'
        explain: '$D = 81$, $x = \frac{5 \pm 9}{2}$: $7$ и $-2$.'
        f: [1]
        sol: { method: 'Формула корней.', steps: ['$D = 25 + 56 = 81$.', '$x_{1,2} = \frac{5 \pm 9}{2}$: $7$ и $-2$.', 'Больший — $7$.'], check: '$49 - 35 - 14 = 0$.', answer: '7' }
        src: b047
      - type: numeric
        cat: problem
        q: 'Найдите положительный корень уравнения $4x^2 - 9 = 0$.'
        num: { value: 1.5, unit: '', check: 'Math.sqrt(9/4)' }
        hint: 'Неполное уравнение: $x^2 = \frac94$.'
        explain: '$x = \pm\frac32$; положительный — $1{,}5$.'
        sol: { method: 'Неполное уравнение ($b = 0$).', steps: ['$x^2 = \frac94$.', '$x = \pm\frac32$, положительный $1{,}5$.'], answer: '1,5' }
        src: b047
      - type: numeric
        cat: problem
        q: 'Найдите меньший корень уравнения $2x^2 + 3x - 5 = 0$.'
        num: { value: -2.5, unit: '', check: '(-3-Math.sqrt(9+40))/4' }
        hint: 'Сумма коэффициентов $2 + 3 - 5 = 0$.'
        explain: 'Корни $1$ и $\frac ca = -\frac52$.'
        f: [4]
        sol: { method: 'Частный случай $a + b + c = 0$.', steps: ['$2 + 3 - 5 = 0$, значит, $x_1 = 1$.', '$x_2 = \frac{c}{a} = -\frac52 = -2{,}5$.'], check: '$2 \cdot 6{,}25 - 7{,}5 - 5 = 0$.', answer: '−2,5' }
        src: b047
      - type: numeric
        cat: problem
        q: 'Найдите дискриминант уравнения $3x^2 - 4x + 2 = 0$.'
        num: { value: -8, unit: '', check: '16-4*3*2' }
        hint: '$D = b^2 - 4ac$.'
        explain: '$16 - 24 = -8$; корней нет.'
        f: [1]
        sol: { method: 'Определение дискриминанта.', steps: ['$D = (-4)^2 - 4 \cdot 3 \cdot 2 = 16 - 24 = -8$.'], answer: '−8' }
        src: b047
      - type: numeric
        cat: problem
        q: 'Решите уравнение $x^2 + 8x + 16 = 0$.'
        num: { value: -4, unit: '', check: '-8/2' }
        hint: 'Левая часть — полный квадрат.'
        explain: '$(x + 4)^2 = 0$, $x = -4$ ($D = 0$).'
        sol: { method: 'Свернуть в квадрат.', steps: ['$x^2 + 8x + 16 = (x + 4)^2$.', '$(x + 4)^2 = 0 \Rightarrow x = -4$.'], answer: '−4' }
        src: b047
      - type: numeric
