  # ───────────────────────────── 1.16.5 ─────────────────────────────
  - id: ma-1-16-5
    num: '1.16.5'
    title: Промежутки возрастания и убывания функции
    pages: [b206, b207, b208]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.5'
      summary: 'Задания на нахождение промежутков возрастания и убывания функций с помощью производной, длины таких промежутков.'
    stage: verified
    stageNote: 'Промежутки проверены по знаку производной на сетке точек.'
    sourcesChecked: '2026-10-25'
    web: [*c45]
    theory:
      - kind: law
        title: Признак монотонности
        body: |
          Если $f'(x) > 0$ на промежутке, $f$ на нём **возрастает**; если $f'(x) < 0$ — **убывает**.
          Алгоритм:
          1. Найти $f'(x)$ и критические точки ($f' = 0$ или не существует).
          2. Определить знак $f'$ на промежутках между ними (метод интервалов).
          3. Записать промежутки; концы, где функция определена и непрерывна, включают.
          Отдельные точки с $f' = 0$ не мешают монотонности: $y = x^3$ возрастает на всей прямой, хотя $f'(0) = 0$.
        src: b206
    formulas:
      - title: Знак производной и монотонность
        tex: 'f''(x) > 0 \Rightarrow f\nearrow,\qquad f''(x) < 0 \Rightarrow f\searrow'
        meaning: 'На промежутке, где выполнено неравенство.'
        use: 'Нахождение промежутков монотонности.'
        src: b206
    examples:
      - title: Кубическая функция
        given: 'Найдите промежутки монотонности $f(x) = x^3 - 3x^2$.'
        find: 'промежутки.'
        method: 'Знак $f''(x) = 3x(x - 2)$.'
        steps:
          - 'Критические точки $0$ и $2$; знаки: «+», «−», «+».'
          - 'Возрастает на $(-\infty; 0]$ и $[2; +\infty)$, убывает на $[0; 2]$.'
        check: '$f(0) = 0 > f(1) = -2 > f(2) = -4$, $f(3) = 0$ ✓.'
        answer: '↗ $(-\infty; 0]$, $[2; +\infty)$; ↘ $[0; 2]$'
        src: b206
      - title: Нечётная кубическая
        given: 'Найдите промежутки монотонности $f(x) = x^3 - 12x$.'
        find: 'промежутки.'
        method: '$f''(x) = 3(x - 2)(x + 2)$.'
        steps:
          - 'Знаки: «+» при $x < -2$, «−» на $(-2; 2)$, «+» при $x > 2$.'
          - 'Возрастает на $(-\infty; -2]$ и $[2; +\infty)$, убывает на $[-2; 2]$.'
        check: '$f(-2) = 16$, $f(0) = 0$, $f(2) = -16$ ✓.'
        answer: '↗ $(-\infty; -2]$, $[2; +\infty)$; ↘ $[-2; 2]$'
        src: b207
      - title: Четвёртая степень
        given: 'Найдите промежутки монотонности $f(x) = x^4 - 2x^2$.'
        find: 'промежутки.'
        method: '$f''(x) = 4x(x - 1)(x + 1)$.'
        steps:
          - 'Знаки справа налево: «+» ($x > 1$), «−» ($0 < x < 1$), «+» ($-1 < x < 0$), «−» ($x < -1$).'
          - 'Убывает на $(-\infty; -1]$ и $[0; 1]$, возрастает на $[-1; 0]$ и $[1; +\infty)$.'
        check: '$f(-1) = -1$, $f(0) = 0$, $f(1) = -1$ ✓.'
        answer: '↘ $(-\infty; -1]$, $[0; 1]$; ↗ $[-1; 0]$, $[1; +\infty)$'
        src: b207
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите длину промежутка убывания функции $f(x) = x^3 - 3x^2$.'
        num: { value: 2, unit: '', check: '2-0' }
        hint: '$f''(x) = 3x(x - 2) \le 0$.'
        explain: '$[0; 2]$ — длина 2.'
        f: [1]
        sol: { method: 'Знак производной.', steps: ['$3x(x - 2) \le 0 \iff 0 \le x \le 2$.', 'Длина $2$.'], answer: '2' }
        src: b206
      - type: numeric
        cat: problem
        q: 'Сколько целых чисел лежит на промежутке убывания функции $f(x) = x^3 - 12x$?'
        num: { value: 5, unit: '', check: '5' }
        hint: 'Промежуток убывания $[-2; 2]$.'
        explain: '$-2, -1, 0, 1, 2$.'
        f: [1]
        sol: { method: 'Знак производной.', steps: ['$3x^2 - 12 \le 0 \iff -2 \le x \le 2$.', 'Пять целых.'], answer: '5' }
        src: b207
      - type: numeric
        cat: problem
        q: 'Функция $f(x) = x^2 - 8x + 3$ возрастает на $[m; +\infty)$. Найдите $m$.'
        num: { value: 4, unit: '', check: '8/2' }
        hint: '$f''(x) = 2x - 8 \ge 0$.'
        explain: '$x \ge 4$.'
        f: [1]
        sol: { method: 'Знак производной.', steps: ['$2x - 8 \ge 0 \iff x \ge 4$.'], answer: '4' }
        src: b206
      - type: numeric
        cat: problem
        q: 'Найдите длину промежутка убывания функции $f(x) = 2x^3 - 9x^2 + 12x$.'
        num: { value: 1, unit: '', check: '2-1' }
        hint: '$f''(x) = 6(x - 1)(x - 2)$.'
        explain: 'Убывает на $[1; 2]$.'
        f: [1]
        sol: { method: 'Знак производной.', steps: ['$6(x - 1)(x - 2) \le 0 \iff 1 \le x \le 2$.', 'Длина $1$.'], answer: '1' }
        src: b207
      - type: numeric
        cat: problem
        q: 'Функция $f(x) = x - \ln x$ возрастает на $[m; +\infty)$. Найдите $m$.'
        num: { value: 1, unit: '', check: '1' }
        hint: '$f''(x) = 1 - \frac1x$, $x > 0$.'
        explain: '$1 - \frac1x \ge 0 \iff x \ge 1$.'
        f: [1]
        sol: { method: 'Знак производной с учётом $x > 0$.', steps: ['$f''(x) = \frac{x - 1}{x}$.', 'При $x > 0$: $f'' \ge 0 \iff x \ge 1$.'], answer: '1' }
        src: b207
      - type: numeric
        cat: problem
        q: 'Найдите длину промежутка возрастания функции $f(x) = -x^3 + 3x$.'
        num: { value: 2, unit: '', check: '1-(-1)' }
        hint: '$f''(x) = 3 - 3x^2 \ge 0$.'
        explain: '$[-1; 1]$ — длина 2.'
        f: [1]
        sol: { method: 'Знак производной.', steps: ['$3 - 3x^2 \ge 0 \iff -1 \le x \le 1$.', 'Длина $2$.'], answer: '2' }
        src: b207
      - type: single
        cat: theory
        q: 'Если $f''(x) > 0$ на интервале, то $f$ на нём…'
        opts: ['возрастает', 'убывает', 'постоянна', 'имеет максимум']
        ans: a
        hint: 'Касательные «смотрят» вверх.'
