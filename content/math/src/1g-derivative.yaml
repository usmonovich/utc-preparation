      - type: single
        cat: theory
        q: 'Функция $y = x^3$ на всей прямой…'
        opts: ['возрастает, хотя $y''(0) = 0$', 'убывает', 'имеет максимум в нуле', 'возрастает только при $x > 0$']
        ans: a
        hint: '$y'' = 3x^2 \ge 0$, ноль — в одной точке.'
        explain: 'Производная обращается в ноль лишь в изолированной точке и знак не меняет.'
        f: [1]
