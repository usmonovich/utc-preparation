  # ───────────────────────────── 1.16.7 ─────────────────────────────
  - id: ma-1-16-7
    num: '1.16.7'
    title: Наибольшее и наименьшее значения функции на промежутке
    pages: [b210, b211]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.7'
      summary: 'Задания на наибольшее и наименьшее значения функции на отрезке и на промежутке.'
    stage: verified
    stageNote: 'Ответы проверены перебором значений функции по сетке на отрезке.'
    sourcesChecked: '2026-10-25'
    web: [*c43]
    theory:
      - kind: rule
        title: Алгоритм для отрезка
        body: |
          Непрерывная на отрезке $[a; b]$ функция достигает наибольшего и наименьшего значений — в критических точках внутри отрезка или на концах.
          1. Найти $f'(x)$ и критические точки, **лежащие внутри** $[a; b]$.
          2. Вычислить $f$ в этих точках и в $a$, $b$.
          3. Выбрать наибольшее и наименьшее из полученных чисел.
          На интервале или луче (без концов) значения на концах не берут — наибольшего или наименьшего может не быть.
        src: b210
    formulas:
      - title: Наибольшее и наименьшее на отрезке
        tex: '\max_{[a;b]} f = \max\{f(a),\ f(b),\ f(x_k)\},\qquad f''(x_k) = 0,\ x_k \in (a; b)'
        meaning: 'То же для наименьшего значения.'
        use: 'Любые задачи «найдите наибольшее/наименьшее значение на отрезке».'
        src: b210
    examples:
      - title: Кубическая на отрезке
        given: 'Найдите наибольшее и наименьшее значения $f(x) = x^3 - 3x$ на $[0; 2]$.'
        find: '$\max$, $\min$.'
        method: 'Значения в критических точках и на концах.'
        steps:
          - '$f''(x) = 3x^2 - 3 = 0$: $x = 1$ (точка $-1$ вне отрезка).'
          - '$f(0) = 0$, $f(1) = -2$, $f(2) = 2$.'
        check: 'Перебор по сетке даёт те же значения ✓.'
        answer: '$\max = 2$, $\min = -2$'
        src: b210
      - title: Дробь
        given: 'Найдите наибольшее и наименьшее значения $f(x) = x + \frac4x$ на $[1; 4]$.'
        find: '$\max$, $\min$.'
        method: 'Критическая точка $x = 2$.'
        steps:
          - '$f(1) = 5$, $f(2) = 4$, $f(4) = 5$.'
          - '$\max = 5$, $\min = 4$.'
        check: '$f(3) = 4{,}33$ — между ними ✓.'
        answer: '$\max = 5$, $\min = 4$'
        src: b210
      - title: Две критические точки
        given: 'Найдите наибольшее и наименьшее значения $f(x) = 2x^3 - 3x^2 - 12x + 1$ на $[-2; 3]$.'
        find: '$\max$, $\min$.'
        method: '$f''(x) = 6(x - 2)(x + 1)$.'
        steps:
          - 'Критические точки $-1$ и $2$ — обе внутри.'
          - '$f(-2) = -3$, $f(-1) = 8$, $f(2) = -19$, $f(3) = -8$.'
        check: 'Перебор по сетке: максимум 8, минимум −19 ✓.'
        answer: '$\max = 8$, $\min = -19$'
        src: b211
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение функции $f(x) = x^3 - 3x$ на отрезке $[-2; 0]$.'
        num: { value: 2, unit: '', check: 'Math.max(-8+6,-1+3,0)' }
        hint: 'Критическая точка $x = -1$.'
        explain: '$f(-2) = -2$, $f(-1) = 2$, $f(0) = 0$.'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['$f(-2) = -2$, $f(-1) = 2$, $f(0) = 0$.', 'Наибольшее $2$.'], answer: '2' }
        src: b210
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее значение функции $f(x) = x^2 - 4x + 5$ на отрезке $[0; 3]$.'
        num: { value: 1, unit: '', check: '4-8+5' }
        hint: 'Вершина $x = 2$ внутри отрезка.'
        explain: '$f(2) = 1$; $f(0) = 5$, $f(3) = 2$.'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['$f''(x) = 2x - 4 = 0 \Rightarrow x = 2$.', '$f(0) = 5$, $f(2) = 1$, $f(3) = 2$.'], answer: '1' }
        src: b210
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение функции $f(x) = x^4 - 2x^2$ на отрезке $[-2; 1]$.'
        num: { value: 8, unit: '', check: '16-8' }
        hint: 'Не забудьте конец $x = -2$.'
        explain: '$f(-2) = 8$ — больше значений в критических точках ($-1$, $0$, $-1$).'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['Критические точки $-1, 0, 1$.', '$f(-2) = 8$, $f(-1) = -1$, $f(0) = 0$, $f(1) = -1$.', 'Наибольшее $8$ — на конце.'], answer: '8' }
        src: b211
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее значение функции $f(x) = e^x - x$ на отрезке $[-1; 1]$.'
        num: { value: 1, unit: '', check: 'Math.exp(0)-0' }
        hint: '$f''(x) = e^x - 1$.'
        explain: '$f(0) = 1$; на концах $\approx 1{,}37$ и $\approx 1{,}72$.'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['$e^x - 1 = 0 \Rightarrow x = 0$.', '$f(-1) = e^{-1} + 1 \approx 1{,}37$, $f(0) = 1$, $f(1) = e - 1 \approx 1{,}72$.'], answer: '1' }
        src: b211
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение функции $f(x) = \sin x + \cos x$ на отрезке $\left[0; \frac\pi2\right]$ (с точностью до 0,001).'
        num: { value: 1.4142, unit: '', tolAbs: 0.001, check: 'Math.SQRT2' }
        hint: '$f''(x) = \cos x - \sin x = 0$ при $x = \frac\pi4$.'
        explain: '$f\left(\frac\pi4\right) = \sqrt2$; на концах $1$.'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['Критическая точка $\frac\pi4$.', '$f(0) = 1$, $f\left(\frac\pi4\right) = \sqrt2$, $f\left(\frac\pi2\right) = 1$.'], answer: '√2 ≈ 1,414' }
        src: b211
      - type: numeric
        cat: problem
        q: 'Найдите произведение наибольшего и наименьшего значений функции $f(x) = x^3 - 3x$ на отрезке $[0; 2]$.'
        num: { value: -4, unit: '', check: '2*(-2)' }
        hint: 'См. пример: $\max = 2$, $\min = -2$.'
        explain: '$2 \cdot (-2) = -4$.'
        f: [1]
        sol: { method: 'Сравнение значений.', steps: ['$f(0) = 0$, $f(1) = -2$, $f(2) = 2$.', '$2 \cdot (-2) = -4$.'], answer: '−4' }
        src: b210
      - type: single
        cat: theory
        q: 'Где непрерывная функция может принимать наибольшее значение на отрезке?'
        opts: ['в критической точке внутри отрезка или на конце', 'только в критической точке', 'только на концах', 'только там, где $f''(x) > 0$']
        ans: a
        hint: 'Вспомните $x^4 - 2x^2$ на $[-2; 1]$.'
        explain: 'Наибольшее может оказаться на конце, даже если внутри есть экстремумы.'
        f: [1]
        src: b210
      - type: single
        cat: theory
        q: 'Нужно ли учитывать критические точки, лежащие вне отрезка?'
        opts: ['нет', 'да, всегда', 'да, если они ближе к концам', 'только для многочленов']
        ans: a
        hint: 'Значения вне отрезка не рассматриваются.'
        explain: 'Сравнивают только значения в точках отрезка.'
        f: [1]
        src: b210

  # ───────────────────────────── 1.16.8 ─────────────────────────────
  - id: ma-1-16-8
    num: '1.16.8'
    title: Угловой коэффициент касательной
    pages: [b211, b212, b213]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.8'
      summary: 'Задания на геометрический смысл производной: угловой коэффициент и угол наклона касательной, точки с заданным наклоном касательной.'
    stage: verified
    stageNote: 'Угловые коэффициенты проверены численно.'
    sourcesChecked: '2026-10-25'
    web: [*c31]
    theory:
      - kind: law
        title: Геометрический смысл производной
        body: |
          Угловой коэффициент касательной к графику $y = f(x)$ в точке $x_0$ равен производной:
          $$k = f'(x_0) = \operatorname{tg}\alpha,$$
          где $\alpha$ — угол наклона касательной к оси $Ox$. Касательная — предельное положение секущей $PQ$, когда точка $Q$ приближается к $P$.
          - Касательная **параллельна** прямой $y = mx + b$, если $f'(x_0) = m$.
          - Касательная **горизонтальна**, если $f'(x_0) = 0$.
        src: b211
        fig: tangent-slope
    formulas:
      - title: Угловой коэффициент касательной
        tex: 'k = f''(x_0) = \operatorname{tg}\alpha'
        meaning: '$x_0$ — абсцисса точки касания, $\alpha$ — угол наклона.'
        use: 'Угол наклона касательной, точки с заданным наклоном.'
        src: b211
    examples:
      - title: Коэффициент в точке
        given: 'Найдите угловой коэффициент касательной к $y = x^2$ в точке $x_0 = 1$.'
        find: '$k$.'
        method: '$k = f''(x_0)$.'
        steps:
          - '$f''(x) = 2x$.'
          - '$k = 2$.'
        check: 'Секущая через $x = 1$ и $x = 1{,}001$: $\frac{1{,}002001 - 1}{0{,}001} = 2{,}001$ ✓.'
        answer: '$2$'
        src: b211
      - title: Угол наклона
        given: 'Под каким углом к оси $Ox$ наклонена касательная к $y = \frac{x^3}3$ в точке $x_0 = 1$?'
        find: '$\alpha$.'
        method: '$\operatorname{tg}\alpha = f''(1)$.'
        steps:
          - '$f''(x) = x^2$, $f''(1) = 1$.'
          - '$\operatorname{tg}\alpha = 1 \Rightarrow \alpha = 45^\circ$.'
        check: '$\operatorname{arctg} 1 = 45^\circ$ ✓.'
        answer: '$45^\circ$'
        src: b212
      - title: Горизонтальная касательная
        given: 'В какой точке касательная к $y = x^2 - 4x$ горизонтальна?'
        find: '$x_0$.'
        method: '$f''(x_0) = 0$.'
        steps:
          - '$2x - 4 = 0$.'
          - '$x_0 = 2$ (вершина параболы).'
        check: '$x_0 = -\frac{b}{2a} = 2$ ✓.'
        answer: '$x_0 = 2$'
        src: b212
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите угловой коэффициент касательной к $y = x^3 - 2x$ в точке $x_0 = 1$.'
        num: { value: 1, unit: '', check: '3-2' }
        hint: '$y'' = 3x^2 - 2$.'
        explain: '$3 - 2 = 1$.'
        f: [1]
        sol: { method: 'Производная в точке.', steps: ['$y'' = 3x^2 - 2$.', '$k = 1$.'], answer: '1' }
        src: b211
      - type: numeric
        cat: problem
        q: 'Найдите угол (в градусах) наклона касательной к $y = \sqrt3\ln x$ в точке $x_0 = 1$.'
        num: { value: 60, unit: '°', check: 'Math.atan(Math.sqrt(3))*180/Math.PI' }
        hint: '$k = \frac{\sqrt3}{x_0}$.'
        explain: '$\operatorname{tg}\alpha = \sqrt3 \Rightarrow \alpha = 60^\circ$.'
        f: [1]
        sol: { method: 'Угол наклона.', steps: ['$y'' = \frac{\sqrt3}{x}$, $k = \sqrt3$.', '$\alpha = 60^\circ$.'], answer: '60°' }
        src: b212
      - type: numeric
        cat: problem
        q: 'В какой точке касательная к $y = x^2 - 6x + 1$ параллельна прямой $y = 2x + 5$? Укажите абсциссу.'
        num: { value: 4, unit: '', check: '(2+6)/2' }
        hint: '$2x - 6 = 2$.'
        explain: '$x_0 = 4$.'
        f: [1]
        sol: { method: 'Параллельность — равные угловые коэффициенты.', steps: ['$y'' = 2x - 6 = 2$.', '$x_0 = 4$.'], answer: '4' }
        src: b212
      - type: numeric
        cat: problem
        q: 'Найдите угловой коэффициент касательной к $y = \sin x$ в точке $x_0 = 0$.'
        num: { value: 1, unit: '', check: 'Math.cos(0)' }
        hint: '$(\sin x)'' = \cos x$.'
        explain: '$\cos 0 = 1$.'
        f: [1]
        sol: { method: 'Производная в точке.', steps: ['$k = \cos 0 = 1$.'], answer: '1' }
        src: b211
      - type: numeric
        cat: problem
        q: 'Сколько точек графика $y = x^3 - 3x$ имеют горизонтальную касательную?'
        num: { value: 2, unit: '', check: '2' }
        hint: '$3x^2 - 3 = 0$.'
        explain: '$x = \pm1$.'
        sol: { method: 'Условие $f''(x_0) = 0$.', steps: ['$3x^2 - 3 = 0 \Rightarrow x = \pm1$.', 'Две точки.'], answer: '2' }
        src: b212
      - type: numeric
        cat: problem
        q: 'Найдите угловой коэффициент касательной к $y = \ln x$ в точке $x_0 = 0{,}5$.'
        num: { value: 2, unit: '', check: '1/0.5' }
        hint: '$(\ln x)'' = \frac1x$.'
        explain: '$\frac{1}{0{,}5} = 2$.'
        f: [1]
        sol: { method: 'Производная в точке.', steps: ['$k = \frac{1}{0{,}5} = 2$.'], answer: '2' }
        src: b211
      - type: single
        cat: theory
        q: 'Что равно производной $f''(x_0)$ геометрически?'
        opts: ['угловому коэффициенту касательной в точке $x_0$', 'значению функции в точке $x_0$', 'площади под графиком', 'длине касательной']
        ans: a
        hint: 'Предел наклона секущих.'
        explain: '$f''(x_0) = \operatorname{tg}\alpha$.'
        f: [1]
        src: b211
      - type: single
        cat: theory
        q: 'Касательная к графику параллельна оси $Ox$. Чему равна производная в точке касания?'
        opts: ['нулю', 'единице', 'бесконечности', 'значению функции']
        ans: a
        hint: 'Угол наклона $0^\circ$.'
        explain: '$\operatorname{tg} 0^\circ = 0$.'
        f: [1]
        src: b212

  # ───────────────────────────── 1.16.9 ─────────────────────────────
  - id: ma-1-16-9
    num: '1.16.9'
    title: Уравнение касательной
    pages: [b213, b214]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.9'
      summary: 'Задания на уравнение касательной к графику функции в заданной точке и касательной с заданным наклоном.'
    stage: verified
    stageNote: 'Уравнения касательных проверены: точка касания лежит на прямой, наклон совпадает с производной.'
    sourcesChecked: '2026-10-25'
    web: [*c31]
    theory:
      - kind: law
        title: Уравнение касательной
        body: |
          Касательная к графику $y = f(x)$ в точке $x_0$:
          $$y = f(x_0) + f'(x_0)(x - x_0).$$
          Алгоритм: 1) $f(x_0)$; 2) $f'(x)$ и $f'(x_0)$; 3) подставить и привести к виду $y = kx + b$.
          Если задан наклон $k$, точку касания находят из уравнения $f'(x_0) = k$.
        src: b213
    formulas:
      - title: Уравнение касательной
        tex: 'y = f(x_0) + f''(x_0)(x - x_0)'
        meaning: '$x_0$ — абсцисса точки касания.'
        use: 'Составление уравнения касательной.'
        src: b213
    examples:
      - title: Касательная к параболе
        given: 'Составьте уравнение касательной к $y = x^2$ в точке $x_0 = 1$.'
        find: 'уравнение.'
        method: 'Формула касательной.'
        steps:
          - '$f(1) = 1$, $f''(1) = 2$.'
          - '$y = 1 + 2(x - 1) = 2x - 1$.'
        check: '$x^2 - (2x - 1) = (x - 1)^2 \ge 0$ — прямая касается параболы в одной точке ✓.'
        answer: '$y = 2x - 1$'
        src: b213
      - title: Касательная к кубической параболе
        given: 'Составьте уравнение касательной к $y = x^3$ в точке $x_0 = -1$.'
        find: 'уравнение.'
        method: 'Формула касательной.'
        steps:
          - '$f(-1) = -1$, $f''(-1) = 3$.'
          - '$y = -1 + 3(x + 1) = 3x + 2$.'
