  # ───────────────────────────── 1.16.4 ─────────────────────────────
  - id: ma-1-16-4
    num: '1.16.4'
    title: Производная сложной функции
    pages: [b203, b204, b205, b206]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.4'
      summary: 'Задания на производную сложной функции: степени, корни, тригонометрические, показательные и логарифмические функции от выражений.'
    stage: verified
    stageNote: 'Производные проверены численно разностным отношением.'
    sourcesChecked: '2026-10-25'
    web: [*c36, *c39]
    theory:
      - kind: law
        title: Правило цепочки
        body: |
          Если $y = f(g(x))$, то
          $$y' = f'\big(g(x)\big) \cdot g'(x)$$
          — производная «внешней» функции от «внутренней», умноженная на производную «внутренней».
          Частые случаи: $\big((kx + b)^n\big)' = nk(kx + b)^{n-1}$; $(\sin kx)' = k\cos kx$; $(e^{g})' = e^{g}g'$; $(\ln g)' = \frac{g'}{g}$; $(\sqrt g)' = \frac{g'}{2\sqrt g}$.
        src: b203
    formulas:
      - title: Производная сложной функции
        tex: '\big(f(g(x))\big)'' = f''\big(g(x)\big)\cdot g''(x)'
        meaning: '$g$ — внутренняя функция, $f$ — внешняя.'
        use: 'Любые функции от выражений.'
        src: b203
      - title: Частные случаи
        tex: '\big(e^{g}\big)'' = e^{g}g'',\qquad (\ln g)'' = \frac{g''}{g},\qquad \big(\sqrt g\big)'' = \frac{g''}{2\sqrt g}'
        meaning: '$g = g(x)$, для логарифма $g > 0$, для корня $g > 0$.'
        use: 'Показательные, логарифмические и иррациональные функции.'
        src: b204
    examples:
      - title: Степень линейной функции
        given: 'Найдите производную $y = (2x + 1)^5$.'
        find: '$y''$.'
        method: 'Внешняя — $t^5$, внутренняя — $2x + 1$.'
        steps:
          - '$5(2x + 1)^4 \cdot 2$.'
          - '$= 10(2x + 1)^4$.'
        check: '$x = 0$: $10$; разностное отношение $\approx 10{,}0$ ✓.'
        answer: '$10(2x + 1)^4$'
        src: b203
      - title: Синус от kx
        given: 'Найдите производную $y = \sin 3x$.'
        find: '$y''$.'
        method: 'Правило цепочки.'
        steps:
          - '$\cos 3x \cdot (3x)''$.'
          - '$= 3\cos 3x$.'
        check: '$x = 0$: $3$ ✓.'
        answer: '$3\cos 3x$'
        src: b204
      - title: Корень из выражения
        given: '$f(x) = \sqrt{x^2 + 9}$. Найдите $f''(4)$.'
        find: '$f''(4)$.'
        method: '$\frac{g''}{2\sqrt g}$.'
        steps:
          - '$f''(x) = \frac{2x}{2\sqrt{x^2 + 9}} = \frac{x}{\sqrt{x^2 + 9}}$.'
          - '$f''(4) = \frac{4}{5} = 0{,}8$.'
        check: 'Численно $\approx 0{,}800$ ✓.'
        answer: '$0{,}8$'
        src: b205
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = (3x - 1)^4$. Найдите $f''(1)$.'
        num: { value: 96, unit: '', check: '4*2**3*3' }
        hint: '$4(3x - 1)^3 \cdot 3$.'
        explain: '$12 \cdot 8 = 96$.'
        f: [1]
        sol: { method: 'Правило цепочки.', steps: ['$f''(x) = 12(3x - 1)^3$.', '$f''(1) = 12 \cdot 8 = 96$.'], answer: '96' }
        src: b203
      - type: numeric
        cat: problem
        q: '$f(x) = e^{2x}$. Найдите $f''(0)$.'
        num: { value: 2, unit: '', check: '2*Math.exp(0)' }
        hint: '$(e^{2x})'' = 2e^{2x}$.'
        explain: '$2$.'
        f: [2]
        sol: { method: 'Правило цепочки.', steps: ['$f''(x) = 2e^{2x}$.', '$f''(0) = 2$.'], answer: '2' }
        src: b204
      - type: numeric
        cat: problem
        q: '$f(x) = \ln(x^2 + 1)$. Найдите $f''(1)$.'
        num: { value: 1, unit: '', check: '2/2' }
        hint: '$\frac{2x}{x^2 + 1}$.'
        explain: '$\frac22 = 1$.'
        f: [2]
        sol: { method: 'Логарифм сложной функции.', steps: ['$f''(x) = \frac{2x}{x^2 + 1}$.', '$f''(1) = 1$.'], answer: '1' }
        src: b204
      - type: numeric
        cat: problem
        q: '$f(x) = \cos 2x$. Найдите $f''\left(\frac\pi4\right)$.'
        num: { value: -2, unit: '', check: '-2*Math.sin(Math.PI/2)' }
        hint: '$-2\sin 2x$.'
        explain: '$-2\sin\frac\pi2 = -2$.'
        f: [1]
        sol: { method: 'Правило цепочки.', steps: ['$f''(x) = -2\sin 2x$.', '$f''\left(\frac\pi4\right) = -2$.'], answer: '−2' }
        src: b204
      - type: numeric
        cat: problem
        q: '$f(x) = \sqrt{2x + 1}$. Найдите $f''(4)$ (с точностью до 0,001).'
        num: { value: 0.3333, unit: '', tolAbs: 0.001, check: '2/(2*Math.sqrt(9))' }
        hint: '$\frac{2}{2\sqrt{2x + 1}}$.'
        explain: '$\frac{1}{\sqrt9} = \frac13$.'
        f: [2]
        sol: { method: 'Корень сложной функции.', steps: ['$f''(x) = \frac{1}{\sqrt{2x + 1}}$.', '$f''(4) = \frac13$.'], answer: '1/3' }
        src: b205
      - type: numeric
        cat: problem
        q: '$f(x) = \sin^2x$. Найдите $f''\left(\frac\pi4\right)$.'
        num: { value: 1, unit: '', check: 'Math.sin(Math.PI/2)' }
        hint: '$2\sin x\cos x = \sin 2x$.'
        explain: '$\sin\frac\pi2 = 1$.'
        f: [1]
        sol: { method: 'Степень сложной функции.', steps: ['$f''(x) = 2\sin x \cdot \cos x = \sin 2x$.', '$f''\left(\frac\pi4\right) = 1$.'], answer: '1' }
        src: b205
      - type: single
        cat: theory
        q: 'Чему равна $(e^{x^2})''$?'
        opts: ['$2xe^{x^2}$', '$e^{x^2}$', '$x^2e^{x^2 - 1}$', '$e^{2x}$']
        ans: a
        hint: 'Умножьте на производную показателя.'
        explain: '$(e^{g})'' = e^{g} g''$, $g'' = 2x$.'
        f: [2]
        src: b204
      - type: single
        cat: theory
        q: 'Чему равна $(\ln(3x))''$?'
        opts: ['$\frac1x$', '$\frac3x$', '$\frac{1}{3x}$', '$3\ln x$']
        ans: a
