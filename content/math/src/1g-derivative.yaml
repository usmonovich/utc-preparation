        explain: '$t = 2$.'
        f: [1]
        sol: { method: '$a = s''''$.', steps: ['$v = 3t^2 - 12t$, $a = 6t - 12$.', '$a = 0 \Rightarrow t = 2$.'], answer: '2' }
