topics:
  # ───────────────────────────── 1.16.1 ─────────────────────────────
  - id: ma-1-16-1
    num: '1.16.1'
    title: Производная суммы и разности
    pages: [b201, b202]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.1'
      summary: 'Задания на нахождение производных многочленов и сумм элементарных функций и на значение производной в точке.'
    stage: verified
    stageNote: 'Производные проверены численно разностным отношением.'
    sourcesChecked: '2026-10-25'
    web: [*c31, *c33, *c35, *c39]
    theory:
      - kind: definition
        title: Производная
        body: |
          **Производная** функции $f$ в точке $x$ — предел отношения приращения функции к приращению аргумента:
          $$f'(x) = \lim_{\Delta x \to 0}\frac{f(x + \Delta x) - f(x)}{\Delta x}.$$
          Геометрически — угловой коэффициент касательной, физически — мгновенная скорость изменения.
        src: b201
      - kind: rule
        title: Таблица производных
        body: |
          | $f(x)$ | $f'(x)$ | $f(x)$ | $f'(x)$ |
          | --- | --- | --- | --- |
          | $C$ | $0$ | $\sin x$ | $\cos x$ |
          | $x^n$ | $nx^{n-1}$ | $\cos x$ | $-\sin x$ |
          | $\sqrt x$ | $\frac{1}{2\sqrt x}$ | $\operatorname{tg} x$ | $\frac{1}{\cos^2x}$ |
          | $\frac1x$ | $-\frac1{x^2}$ | $\operatorname{ctg} x$ | $-\frac{1}{\sin^2x}$ |
          | $e^x$ | $e^x$ | $\ln x$ | $\frac1x$ |
          | $a^x$ | $a^x\ln a$ | $\log_a x$ | $\frac{1}{x\ln a}$ |
          **Правила**: $(u \pm v)' = u' \pm v'$, $(Cu)' = Cu'$.
        src: b201
    formulas:
      - title: Производная степени
        tex: '(x^n)'' = n x^{n-1}'
        meaning: '$n$ — любое действительное число (при допустимых $x$).'
        use: '$(\sqrt x)'' = (x^{1/2})'' = \frac{1}{2\sqrt x}$, $\left(\frac1x\right)'' = -\frac{1}{x^2}$.'
        src: b201
      - title: Производная суммы и постоянного множителя
        tex: '(u \pm v)'' = u'' \pm v'',\qquad (Cu)'' = C u'''
        meaning: '$u$, $v$ — дифференцируемые функции, $C$ — число.'
        use: 'Дифференцирование многочленов почленно.'
        src: b201
      - title: Производные основных функций
        tex: '(\sin x)'' = \cos x,\quad (\cos x)'' = -\sin x,\quad (e^x)'' = e^x,\quad (\ln x)'' = \frac1x'
        meaning: 'Таблица производных.'
        use: 'Вместе с правилами — любые суммы.'
        src: b201
    examples:
      - title: Многочлен
        given: '$f(x) = x^3 - 4x^2 + 5$. Найдите $f''(2)$.'
        find: '$f''(2)$.'
        method: 'Почленное дифференцирование.'
        steps:
          - '$f''(x) = 3x^2 - 8x$.'
          - '$f''(2) = 12 - 16 = -4$.'
        check: 'Разностное отношение: $\frac{f(2{,}001) - f(1{,}999)}{0{,}002} \approx -4$ ✓.'
        answer: '$-4$'
        src: b201
      - title: Корень и дробь
        given: '$f(x) = 2\sqrt x + \frac3x$. Найдите $f''(1)$.'
        find: '$f''(1)$.'
        method: 'Степени с дробным и отрицательным показателем.'
        steps:
          - '$f''(x) = \frac{1}{\sqrt x} - \frac{3}{x^2}$.'
          - '$f''(1) = 1 - 3 = -2$.'
        check: 'Численно $\approx -2{,}000$ ✓.'
        answer: '$-2$'
        src: b202
      - title: Сумма разных функций
        given: '$f(x) = 3\sin x - 2\cos x + e^x$. Найдите $f''(0)$.'
        find: '$f''(0)$.'
        method: 'Таблица производных.'
        steps:
          - '$f''(x) = 3\cos x + 2\sin x + e^x$.'
          - '$f''(0) = 3 + 0 + 1 = 4$.'
        check: 'Численно $\approx 4{,}000$ ✓.'
        answer: '$4$'
        src: b202
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = x^4 - 2x$. Найдите $f''(1)$.'
        num: { value: 2, unit: '', check: '4-2' }
        hint: '$(x^4)'' = 4x^3$.'
        explain: '$f''(x) = 4x^3 - 2$, $f''(1) = 2$.'
        f: [1, 2]
        sol: { method: 'Почленно.', steps: ['$f''(x) = 4x^3 - 2$.', '$f''(1) = 2$.'], answer: '2' }
        src: b201
      - type: numeric
        cat: problem
        q: '$f(x) = 5x^3 + x$. Найдите $f''(-1)$.'
        num: { value: 16, unit: '', check: '15+1' }
        hint: '$f''(x) = 15x^2 + 1$.'
        explain: '$15 + 1 = 16$.'
        f: [1, 2]
        sol: { method: 'Почленно.', steps: ['$f''(x) = 15x^2 + 1$.', '$f''(-1) = 16$.'], answer: '16' }
        src: b201
      - type: numeric
        cat: problem
        q: '$f(x) = \sqrt x$. Найдите $f''(4)$.'
        num: { value: 0.25, unit: '', check: '1/(2*Math.sqrt(4))' }
        hint: '$(\sqrt x)'' = \frac{1}{2\sqrt x}$.'
        explain: '$\frac{1}{2 \cdot 2} = 0{,}25$.'
        f: [1]
        sol: { method: 'Таблица производных.', steps: ['$f''(4) = \frac{1}{2\sqrt4} = \frac14$.'], answer: '0,25' }
        src: b201
      - type: numeric
        cat: problem
        q: '$f(x) = \sin x + \cos x$. Найдите $f''(0)$.'
        num: { value: 1, unit: '', check: 'Math.cos(0)-Math.sin(0)' }
        hint: '$f''(x) = \cos x - \sin x$.'
        explain: '$1 - 0 = 1$.'
        f: [3]
        sol: { method: 'Таблица производных.', steps: ['$f''(x) = \cos x - \sin x$.', '$f''(0) = 1$.'], answer: '1' }
        src: b201
      - type: numeric
        cat: problem
        q: '$f(x) = \ln x + x^2$. Найдите $f''(1)$.'
        num: { value: 3, unit: '', check: '1/1+2' }
        hint: '$(\ln x)'' = \frac1x$.'
        explain: '$1 + 2 = 3$.'
        f: [3]
        sol: { method: 'Таблица производных.', steps: ['$f''(x) = \frac1x + 2x$.', '$f''(1) = 3$.'], answer: '3' }
        src: b201
      - type: numeric
        cat: problem
        q: '$f(x) = e^x - 3x$. Найдите $f''(0)$.'
        num: { value: -2, unit: '', check: 'Math.exp(0)-3' }
        hint: '$(e^x)'' = e^x$.'
        explain: '$1 - 3 = -2$.'
        f: [3]
        sol: { method: 'Таблица производных.', steps: ['$f''(x) = e^x - 3$.', '$f''(0) = -2$.'], answer: '−2' }
        src: b201
      - type: single
        cat: theory
        q: 'Производная постоянной функции $y = 7$:'
        opts: ['$0$', '$7$', '$7x$', '$1$']
        ans: a
        hint: 'Постоянная не меняется.'
        explain: 'Скорость изменения постоянной равна нулю.'
        src: b201
      - type: single
        cat: theory
        q: 'Чему равна $(x^n)''$?'
        opts: ['$nx^{n-1}$', '$x^{n-1}$', '$nx^n$', '$\frac{x^{n+1}}{n+1}$']
        ans: a
        hint: 'Проверьте на $x^2$.'
        explain: '$(x^2)'' = 2x$. Последний вариант — первообразная.'
        f: [1]
        src: b201

  # ───────────────────────────── 1.16.2 ─────────────────────────────
  - id: ma-1-16-2
    num: '1.16.2'
    title: Производная произведения
    pages: [b202, b203]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.2'
      summary: 'Задания на производную произведения функций и её значение в точке.'
    stage: verified
    stageNote: 'Производные проверены численно разностным отношением.'
    sourcesChecked: '2026-10-25'
    web: [*c33]
    theory:
      - kind: law
        title: Правило произведения
        body: |
          $$(uv)' = u'v + uv'.$$
          Для трёх множителей: $(uvw)' = u'vw + uv'w + uvw'$.
          **Ошибка**: $(uv)' \ne u'v'$ — например, $(x \cdot x)' = 2x$, а $1 \cdot 1 = 1$.
          Иногда проще сначала раскрыть скобки: $(2x - 1)(x + 3) = 2x^2 + 5x - 3$.
        src: b202
    formulas:
      - title: Производная произведения
        tex: '(uv)'' = u''v + uv'''
        meaning: '$u$, $v$ — дифференцируемые функции.'
        use: '$(x^2\sin x)'' = 2x\sin x + x^2\cos x$.'
        src: b202
    examples:
      - title: Многочлен на синус
        given: 'Найдите производную $y = x^2\sin x$.'
        find: '$y''$.'
        method: 'Правило произведения.'
        steps:
          - '$u = x^2$, $v = \sin x$; $u'' = 2x$, $v'' = \cos x$.'
          - '$y'' = 2x\sin x + x^2\cos x$.'
        check: '$x = 1$: $2 \cdot 0{,}8415 + 0{,}5403 = 2{,}2232$; разностное отношение $\approx 2{,}2232$ ✓.'
        answer: '$2x\sin x + x^2\cos x$'
        src: b202
      - title: Произведение многочленов
        given: '$f(x) = (x + 1)(x^2 - 3)$. Найдите $f''(1)$.'
        find: '$f''(1)$.'
        method: 'Правило произведения.'
        steps:
          - '$f''(x) = 1 \cdot (x^2 - 3) + (x + 1) \cdot 2x = 3x^2 + 2x - 3$.'
          - '$f''(1) = 3 + 2 - 3 = 2$.'
        check: 'Раскрыв скобки: $f = x^3 + x^2 - 3x - 3$, $f'' = 3x^2 + 2x - 3$ ✓.'
        answer: '$2$'
        src: b202
      - title: Экспонента
        given: '$f(x) = xe^x$. Найдите $f''(0)$.'
        find: '$f''(0)$.'
        method: 'Правило произведения.'
        steps:
          - '$f''(x) = e^x + xe^x = e^x(1 + x)$.'
          - '$f''(0) = 1$.'
        check: 'Численно $\approx 1{,}000$ ✓.'
        answer: '$1$'
        src: b203
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = x\ln x$. Найдите $f''(1)$.'
        num: { value: 1, unit: '', check: 'Math.log(1)+1' }
        hint: '$(x\ln x)'' = \ln x + 1$.'
        explain: '$0 + 1 = 1$.'
        f: [1]
        sol: { method: 'Правило произведения.', steps: ['$f''(x) = 1 \cdot \ln x + x \cdot \frac1x = \ln x + 1$.', '$f''(1) = 1$.'], answer: '1' }
        src: b202
      - type: numeric
        cat: problem
        q: '$f(x) = (2x - 1)(x + 3)$. Найдите $f''(0)$.'
        num: { value: 5, unit: '', check: '2*3+(-1)*1' }
        hint: '$u''v + uv''$ при $x = 0$.'
        explain: '$2 \cdot 3 + (-1) \cdot 1 = 5$.'
        f: [1]
        sol: { method: 'Правило произведения.', steps: ['$f''(x) = 2(x + 3) + (2x - 1)$.', '$f''(0) = 6 - 1 = 5$.'], answer: '5' }
        src: b202
      - type: numeric
        cat: problem
        q: '$f(x) = x^2e^x$. Найдите $f''(1)$ (с точностью до 0,01).'
        num: { value: 8.1548, unit: '', tolAbs: 0.01, check: '3*Math.E' }
        hint: '$f''(x) = e^x(2x + x^2)$.'
        explain: '$3e \approx 8{,}15$.'
        f: [1]
        sol: { method: 'Правило произведения.', steps: ['$f''(x) = 2xe^x + x^2e^x$.', '$f''(1) = 3e \approx 8{,}15$.'], answer: '3e ≈ 8,15' }
        src: b203
      - type: numeric
        cat: problem
        q: '$f(x) = x\sin x$. Найдите $f''\left(\frac\pi2\right)$.'
        num: { value: 1, unit: '', check: 'Math.sin(Math.PI/2)+Math.PI/2*Math.cos(Math.PI/2)' }
        hint: '$\sin x + x\cos x$.'
        explain: '$1 + \frac\pi2 \cdot 0 = 1$.'
        f: [1]
        sol: { method: 'Правило произведения.', steps: ['$f''(x) = \sin x + x\cos x$.', '$f''\left(\frac\pi2\right) = 1$.'], answer: '1' }
        src: b202
      - type: numeric
        cat: problem
        q: '$f(x) = x\sqrt x$. Найдите $f''(4)$.'
        num: { value: 3, unit: '', check: '1.5*Math.sqrt(4)' }
        hint: '$x\sqrt x = x^{3/2}$.'
        explain: '$\frac32\sqrt4 = 3$.'
        f: [1]
        sol: { method: 'Степень (или произведение).', steps: ['$f(x) = x^{3/2}$, $f''(x) = \frac32 x^{1/2}$.', '$f''(4) = 3$.'], answer: '3' }
        src: b202
      - type: numeric
        cat: problem
        q: '$f(x) = (x^2 + 1)(x - 1)$. Найдите $f''(2)$.'
        num: { value: 9, unit: '', check: '2*2*(2-1)+(4+1)' }
        hint: '$2x(x - 1) + (x^2 + 1)$.'
        explain: '$4 + 5 = 9$.'
        f: [1]
        sol: { method: 'Правило произведения.', steps: ['$f''(x) = 2x(x - 1) + x^2 + 1$.', '$f''(2) = 4 + 5 = 9$.'], answer: '9' }
        src: b202
      - type: single
        cat: theory
        q: 'Какое равенство верно?'
        opts: ['$(uv)'' = u''v + uv''$', '$(uv)'' = u''v''$', '$(uv)'' = u''v - uv''$', '$(uv)'' = u'' + v''$']
        ans: a
        hint: 'Проверьте на $x \cdot x$.'
        explain: '$(x \cdot x)'' = 1 \cdot x + x \cdot 1 = 2x$ ✓.'
        f: [1]
        src: b202
      - type: single
        cat: theory
        q: 'Чему равна $(x\cos x)''$?'
        opts: ['$\cos x - x\sin x$', '$-\sin x$', '$\cos x + x\sin x$', '$-x\sin x$']
        ans: a
        hint: '$(\cos x)'' = -\sin x$.'
        explain: '$1 \cdot \cos x + x \cdot (-\sin x)$.'
        f: [1]
        src: b202

  # ───────────────────────────── 1.16.3 ─────────────────────────────
  - id: ma-1-16-3
    num: '1.16.3'
    title: Производная частного
    pages: [b203]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.3'
      summary: 'Задания на производную дроби и её значение в точке.'
    stage: verified
    stageNote: 'Производные проверены численно разностным отношением.'
    sourcesChecked: '2026-10-25'
    web: [*c33, *c35]
    theory:
      - kind: law
        title: Правило частного
        body: |
          $$\left(\frac uv\right)' = \frac{u'v - uv'}{v^2}\qquad (v \ne 0).$$
          Порядок в числителе важен: сначала производная **числителя**. Частный случай: $\left(\frac1v\right)' = -\frac{v'}{v^2}$.
          Так получается $(\operatorname{tg} x)' = \left(\frac{\sin x}{\cos x}\right)' = \frac{\cos^2x + \sin^2x}{\cos^2x} = \frac{1}{\cos^2x}$.
        src: b203
    formulas:
      - title: Производная частного
        tex: '\left(\frac uv\right)'' = \frac{u''v - uv''}{v^2}'
        meaning: '$v \ne 0$.'
        use: 'Производные дробей.'
        src: b203
      - title: Производная обратной величины
        tex: '\left(\frac1v\right)'' = -\frac{v''}{v^2}'
        meaning: 'Частный случай при $u = 1$.'
        use: '$\left(\frac{1}{x^2 + 1}\right)'' = -\frac{2x}{(x^2 + 1)^2}$.'
        src: b203
    examples:
      - title: Дробно-линейная функция
        given: '$f(x) = \dfrac{x + 1}{x - 1}$. Найдите $f''(2)$.'
        find: '$f''(2)$.'
        method: 'Правило частного.'
        steps:
          - '$f''(x) = \frac{(x - 1) - (x + 1)}{(x - 1)^2} = -\frac{2}{(x - 1)^2}$.'
          - '$f''(2) = -2$.'
        check: 'Численно $\approx -2{,}000$ ✓.'
        answer: '$-2$'
        src: b203
      - title: Тангенс
        given: 'Выведите $(\operatorname{tg} x)''$.'
        find: '$(\operatorname{tg} x)''$.'
        method: '$\operatorname{tg} x = \frac{\sin x}{\cos x}$.'
        steps:
          - '$\frac{\cos x \cdot \cos x - \sin x \cdot (-\sin x)}{\cos^2x}$.'
          - '$= \frac{1}{\cos^2x}$.'
        check: '$x = 0{,}5$: $\frac{1}{0{,}7702} = 1{,}298$; разностное отношение $\approx 1{,}298$ ✓.'
        answer: '$\frac{1}{\cos^2x}$'
        src: b203
      - title: Многочлен в числителе
        given: '$f(x) = \dfrac{x^2}{x + 1}$. Найдите $f''(1)$.'
        find: '$f''(1)$.'
        method: 'Правило частного.'
        steps:
          - '$f''(x) = \frac{2x(x + 1) - x^2}{(x + 1)^2} = \frac{x^2 + 2x}{(x + 1)^2}$.'
          - '$f''(1) = \frac34$.'
        check: 'Численно $\approx 0{,}750$ ✓.'
        answer: '$0{,}75$'
        src: b203
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{1}{x^2 + 1}$. Найдите $f''(1)$.'
        num: { value: -0.5, unit: '', check: '-2/4' }
        hint: '$-\frac{v''}{v^2}$.'
        explain: '$-\frac{2}{4} = -0{,}5$.'
        f: [2]
        sol: { method: 'Производная обратной величины.', steps: ['$f''(x) = -\frac{2x}{(x^2 + 1)^2}$.', '$f''(1) = -\frac24 = -0{,}5$.'], answer: '−0,5' }
        src: b203
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{2x + 3}{x}$. Найдите $f''(1)$.'
        num: { value: -3, unit: '', check: '-3/1' }
        hint: '$\frac{2x + 3}{x} = 2 + \frac3x$.'
        explain: '$f''(x) = -\frac{3}{x^2}$, $f''(1) = -3$.'
        f: [1]
        sol: { method: 'Упростить, затем дифференцировать.', steps: ['$f(x) = 2 + \frac3x$.', '$f''(x) = -\frac3{x^2}$, $f''(1) = -3$.'], answer: '−3' }
        src: b203
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{x}{x + 2}$. Найдите $f''(0)$.'
        num: { value: 0.5, unit: '', check: '2/4' }
        hint: '$\frac{(x + 2) - x}{(x + 2)^2}$.'
        explain: '$\frac{2}{4} = 0{,}5$.'
        f: [1]
        sol: { method: 'Правило частного.', steps: ['$f''(x) = \frac{2}{(x + 2)^2}$.', '$f''(0) = 0{,}5$.'], answer: '0,5' }
        src: b203
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{\sin x}{x}$. Найдите $f''(\pi)$ (с точностью до 0,001).'
