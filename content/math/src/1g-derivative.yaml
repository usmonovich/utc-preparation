      - type: single
        cat: theory
        q: 'Когда точка, движущаяся по прямой, меняет направление движения?'
        opts: ['когда скорость меняет знак (проходя через 0)', 'когда ускорение равно 0', 'когда $s(t) = 0$', 'никогда']
        ans: a
