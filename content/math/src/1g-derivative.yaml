  # ───────────────────────────── 1.16.10 ─────────────────────────────
  - id: ma-1-16-10
    num: '1.16.10'
    title: Механический смысл производной
    pages: [b214, b215]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.10'
      summary: 'Задания на скорость и ускорение точки, движущейся по заданному закону $s(t)$: значение в момент времени, момент остановки, скорость при нулевом ускорении.'
    stage: verified
    stageNote: 'Скорости и ускорения пересчитаны дифференцированием и численно.'
    sourcesChecked: '2026-10-25'
    web: [*c34]
    theory:
      - kind: law
        title: Скорость и ускорение
        body: |
          Если точка движется по прямой по закону $s = s(t)$, то
          $$v(t) = s'(t),\qquad a(t) = v'(t) = s''(t).$$
          - Точка **останавливается** (меняет направление), когда $v(t) = 0$.
          - $v > 0$ — движение в положительном направлении, $v < 0$ — в отрицательном.
          - Это та же связь, что в физике: скорость — производная координаты, ускорение — производная скорости.
        src: b214
    formulas:
      - title: Скорость и ускорение
        tex: 'v(t) = s''(t),\qquad a(t) = v''(t) = s''''(t)'
        meaning: '$s(t)$ — координата, $t$ — время.'
        use: 'Задачи о движении по заданному закону.'
        src: b214
    examples:
      - title: Скорость и ускорение в момент
        given: '$s(t) = t^3 - 2t^2 + 3$. Найдите скорость и ускорение при $t = 2$.'
        find: '$v(2)$, $a(2)$.'
        method: 'Дифференцирование.'
        steps:
          - '$v(t) = 3t^2 - 4t$, $v(2) = 4$.'
          - '$a(t) = 6t - 4$, $a(2) = 8$.'
        check: 'Численно $\frac{s(2{,}001) - s(1{,}999)}{0{,}002} \approx 4$ ✓.'
        answer: '$v = 4$, $a = 8$'
        src: b214
      - title: Остановка
        given: '$s(t) = 6t - t^2$. В какой момент точка остановится?'
        find: '$t$.'
        method: '$v(t) = 0$.'
        steps:
          - '$v(t) = 6 - 2t$.'
          - '$6 - 2t = 0 \Rightarrow t = 3$.'
        check: '$v(2{,}9) > 0$, $v(3{,}1) < 0$ — направление меняется ✓.'
        answer: '$t = 3$'
        src: b214
      - title: Колебание
        given: '$s(t) = 2\sin t$. Найдите скорость при $t = 0$.'
        find: '$v(0)$.'
        method: 'Производная синуса.'
        steps:
          - '$v(t) = 2\cos t$.'
          - '$v(0) = 2$.'
        check: '$\frac{2\sin 0{,}001}{0{,}001} \approx 2$ ✓.'
        answer: '$2$'
        src: b215
    questions:
      - type: numeric
        cat: problem
        q: '$s(t) = t^2 + 3t$. Найдите скорость при $t = 2$.'
        num: { value: 7, unit: '', check: '2*2+3' }
        hint: '$v = 2t + 3$.'
        explain: '$4 + 3 = 7$.'
        f: [1]
        sol: { method: '$v = s''$.', steps: ['$v(t) = 2t + 3$.', '$v(2) = 7$.'], answer: '7' }
        src: b214
      - type: numeric
        cat: problem
        q: '$s(t) = t^3 - 6t^2 + 9t$. В какой момент точка впервые останавливается?'
        num: { value: 1, unit: '', check: '1' }
        hint: '$v = 3(t - 1)(t - 3)$.'
        explain: 'Первый ноль скорости — $t = 1$.'
        f: [1]
        sol: { method: '$v(t) = 0$.', steps: ['$v(t) = 3t^2 - 12t + 9 = 3(t - 1)(t - 3)$.', 'Первая остановка $t = 1$.'], answer: '1' }
        src: b214
      - type: numeric
        cat: problem
        q: '$s(t) = t^3$. Найдите ускорение при $t = 2$.'
        num: { value: 12, unit: '', check: '6*2' }
        hint: '$a = 6t$.'
        explain: '$12$.'
        f: [1]
        sol: { method: '$a = s''''$.', steps: ['$v = 3t^2$, $a = 6t$.', '$a(2) = 12$.'], answer: '12' }
        src: b214
      - type: numeric
        cat: problem
        q: '$s(t) = 4t - \dfrac{t^2}2$. Найдите скорость при $t = 2$.'
        num: { value: 2, unit: '', check: '4-2' }
        hint: '$v = 4 - t$.'
        explain: '$4 - 2 = 2$.'
        f: [1]
        sol: { method: '$v = s''$.', steps: ['$v(t) = 4 - t$.', '$v(2) = 2$.'], answer: '2' }
        src: b214
      - type: numeric
        cat: problem
        q: '$s(t) = t^3 - 6t^2$. В какой момент ускорение равно нулю?'
        num: { value: 2, unit: '', check: '12/6' }
