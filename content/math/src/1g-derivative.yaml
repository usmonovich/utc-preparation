  # ───────────────────────────── 1.16.6 ─────────────────────────────
  - id: ma-1-16-6
    num: '1.16.6'
    title: Экстремумы функции
    pages: [b208, b209, b210]
    book:
      place: 'Ч. 2, 1.16 «Производная», пункт 1.16.6'
      summary: 'Задания на точки максимума и минимума функций и значения функции в этих точках.'
    stage: verified
    stageNote: 'Точки экстремума проверены сменой знака производной и сравнением значений рядом.'
    sourcesChecked: '2026-10-25'
    web: [*c43, *c45]
    theory:
      - kind: law
        title: Необходимое и достаточное условия
        body: |
          - **Необходимое**: в точке экстремума дифференцируемой функции $f'(x_0) = 0$ (точка **критическая**).
          - **Достаточное**: если при переходе через $x_0$ производная меняет знак с «+» на «−», то $x_0$ — точка **максимума**; с «−» на «+» — **минимума**; если знак не меняется — экстремума нет.
          Пример: у $f(x) = x^4 - 4x^3$ производная $4x^2(x - 3)$ обращается в ноль при $x = 0$, но знак там не меняется — экстремум только в $x = 3$.
        src: b208
        fig: extremum-sign
    formulas:
      - title: Признак экстремума
        tex: 'f''(x_0) = 0,\quad f''\colon + \to - \Rightarrow \max,\qquad f''\colon - \to + \Rightarrow \min'
        meaning: 'Смена знака производной при переходе через $x_0$ слева направо.'
        use: 'Нахождение точек экстремума.'
        limits: 'Равенство $f''(x_0) = 0$ без смены знака экстремума не даёт.'
        src: b208
    examples:
      - title: Максимум и минимум
        given: 'Найдите экстремумы $f(x) = x^3 - 3x$.'
        find: 'точки и значения.'
        method: '$f''(x) = 3(x - 1)(x + 1)$.'
        steps:
          - 'Знаки: «+», «−», «+» — максимум в $x = -1$, минимум в $x = 1$.'
          - '$f(-1) = 2$, $f(1) = -2$.'
        check: '$f(-1{,}1) = 1{,}969 < 2$, $f(-0{,}9) = 1{,}971 < 2$ ✓.'
        answer: '$x_{\max} = -1$, $f_{\max} = 2$; $x_{\min} = 1$, $f_{\min} = -2$'
        src: b208
      - title: Критическая точка без экстремума
        given: 'Найдите экстремумы $f(x) = x^4 - 4x^3$.'
        find: 'точки экстремума.'
        method: '$f''(x) = 4x^2(x - 3)$.'
        steps:
          - 'Критические точки $0$ и $3$; при $x = 0$ знак не меняется («−» с обеих сторон).'
          - 'Минимум в $x = 3$: $f(3) = 81 - 108 = -27$.'
        check: '$f(-0{,}1) = 0{,}0041 > 0 = f(0) > f(0{,}1) = -0{,}0039$ — монотонно ✓.'
        answer: 'минимум $-27$ в $x = 3$; в $x = 0$ экстремума нет'
        src: b209
      - title: С экспонентой
        given: 'Найдите экстремум $f(x) = xe^{-x}$.'
        find: 'точку и значение.'
        method: '$f''(x) = e^{-x}(1 - x)$.'
        steps:
          - '$e^{-x} > 0$; знак $1 - x$: «+» до 1, «−» после — максимум в $x = 1$.'
          - '$f(1) = \frac1e \approx 0{,}368$.'
        check: '$f(0{,}9) = 0{,}366$, $f(1{,}1) = 0{,}366$ ✓.'
        answer: 'максимум $\frac1e$ в $x = 1$'
        src: b209
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите точку максимума функции $f(x) = x^3 - 3x^2$.'
        num: { value: 0, unit: '', tolAbs: 0.001, check: '0' }
        hint: '$f''(x) = 3x(x - 2)$.'
        explain: 'Знак меняется с «+» на «−» в нуле.'
        f: [1]
