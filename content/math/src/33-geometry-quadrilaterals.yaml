  # ───────────────────────────── 3.4.4 ─────────────────────────────
  - id: ma-3-4-4
    num: '3.4.4'
    title: Трапеция
    pages: [b259, b260, b261, b262, b263]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.4 «Четырёхугольники», пункт 3.4.4'
      summary: 'Задания на трапецию: средняя линия, площадь, равнобедренная трапеция, высота, диагонали.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-106, *lyc]
    theory:
      - kind: law
        title: Свойства трапеции
        body: |
          - **Средняя линия** параллельна основаниям и равна их полусумме: $m = \frac{a + b}{2}$.
          - Площадь $S = \frac{a + b}{2}h = mh$.
          - Сумма углов, прилежащих к боковой стороне, $180^\circ$.
          - **Равнобедренная** трапеция: боковые стороны и диагонали равны, углы при основании равны; высота из вершины меньшего основания отсекает на большем отрезок $\frac{a - b}{2}$.
          - Если диагонали равнобедренной трапеции перпендикулярны, высота равна средней линии.
          - Диагональ делит среднюю линию на отрезки $\frac b2$ и $\frac a2$.
        src: b259
    formulas:
      - title: Средняя линия и площадь трапеции
        tex: 'm = \frac{a + b}{2},\qquad S = \frac{a + b}{2}\,h'
        meaning: '$a$, $b$ — основания, $h$ — высота.'
        use: 'Площадь трапеции.'
        src: b260
      - title: Проекция боковой стороны (равнобедренная)
        tex: 'x = \frac{a - b}{2},\qquad h = \sqrt{c^2 - x^2}'
        meaning: '$c$ — боковая сторона, $a > b$.'
        use: 'Высота равнобедренной трапеции.'
        src: b261
    examples:
      - title: Площадь
        given: 'Основания трапеции 6 и 10, высота 4. Найдите площадь.'
        find: '$S$.'
        method: 'Полусумма оснований на высоту.'
        steps:
          - '$m = 8$.'
          - '$S = 32$.'
        check: 'Прямоугольник $6 \times 4$ и два треугольника общей площадью $\frac12 \cdot 4 \cdot 4 = 8$: $24 + 8 = 32$ ✓.'
        answer: '$32$'
        src: b260
      - title: Равнобедренная трапеция
        given: 'Основания 4 и 10, боковая сторона 5. Найдите площадь.'
        find: '$S$.'
        method: 'Высота через проекцию.'
        steps:
          - '$x = 3$, $h = \sqrt{25 - 9} = 4$.'
          - '$S = 7 \cdot 4 = 28$.'
        check: '$3^2 + 4^2 = 5^2$ ✓.'
        answer: '$28$'
        src: b261
      - title: Средняя линия и высота
        given: 'Средняя линия 7, высота 6. Найдите площадь.'
        find: '$S$.'
        method: '$S = mh$.'
        steps:
          - '$S = 7 \cdot 6$.'
          - '$= 42$.'
        check: 'Сумма оснований $14$, $\frac{14}{2} \cdot 6 = 42$ ✓.'
        answer: '$42$'
        src: b260
    questions:
      - type: numeric
        cat: problem
        q: 'Основания трапеции 5 и 11. Найдите среднюю линию.'
        num: { value: 8, unit: '', check: '(5+11)/2' }
        hint: 'Полусумма.'
        explain: '$8$.'
        f: [1]
        sol: { method: 'Средняя линия.', steps: ['$\frac{5 + 11}{2} = 8$.'], answer: '8' }
        src: b260
      - type: numeric
        cat: problem
        q: 'Основания трапеции 3 и 9, высота 5. Найдите площадь.'
        num: { value: 30, unit: '', check: '(3+9)/2*5' }
        hint: '$\frac{a + b}{2}h$.'
        explain: '$6 \cdot 5 = 30$.'
        f: [1]
        sol: { method: 'Площадь трапеции.', steps: ['$\frac{12}{2} \cdot 5 = 30$.'], answer: '30' }
        src: b260
      - type: numeric
        cat: problem
        q: 'Основания равнобедренной трапеции 6 и 14, угол при большем основании $45^\circ$. Найдите площадь.'
        num: { value: 40, unit: '', check: '(6+14)/2*4' }
        hint: 'Проекция боковой стороны 4, при $45^\circ$ высота тоже 4.'
        explain: '$10 \cdot 4 = 40$.'
        f: [1, 2]
        sol: { method: 'Высота через проекцию.', steps: ['$x = \frac{14 - 6}{2} = 4$, $h = x\operatorname{tg} 45^\circ = 4$.', '$S = 10 \cdot 4 = 40$.'], answer: '40' }
        src: b261
      - type: numeric
        cat: problem
        q: 'Основания равнобедренной трапеции 8 и 20, боковая сторона 10. Найдите площадь.'
        num: { value: 112, unit: '', check: '(8+20)/2*Math.sqrt(100-36)' }
        hint: 'Проекция $6$, высота $8$.'
        explain: '$14 \cdot 8 = 112$.'
        f: [1, 2]
        sol: { method: 'Высота через проекцию.', steps: ['$x = 6$, $h = 8$.', '$S = 14 \cdot 8 = 112$.'], answer: '112' }
        src: b261
      - type: numeric
        cat: problem
        q: 'Основания трапеции 4 и 10. Диагональ делит среднюю линию на два отрезка. Найдите больший.'
        num: { value: 5, unit: '', check: '10/2' }
        hint: 'Отрезки — средние линии треугольников: $\frac b2$ и $\frac a2$.'
        explain: '$\frac{10}{2} = 5$.'
        sol: { method: 'Средние линии треугольников.', steps: ['Отрезки $\frac42 = 2$ и $\frac{10}{2} = 5$.'], answer: '5' }
        src: b262
      - type: numeric
        cat: problem
        q: 'Диагонали равнобедренной трапеции перпендикулярны, основания 6 и 10. Найдите площадь.'
        num: { value: 64, unit: '', check: '8*8' }
        hint: 'Высота равна средней линии.'
        explain: '$m = h = 8$, $S = 64$.'
        f: [1]
        sol: { method: 'Свойство перпендикулярных диагоналей.', steps: ['$h = m = \frac{6 + 10}{2} = 8$.', '$S = 8 \cdot 8 = 64$.'], answer: '64' }
        src: b262
      - type: single
        cat: theory
        q: 'Средняя линия трапеции равна…'
        opts: ['полусумме оснований', 'полуразности оснований', 'большему основанию', 'высоте']
        ans: a
        hint: 'Как у треугольника, но с двумя основаниями.'
        explain: '$m = \frac{a + b}{2}$.'
        f: [1]
        src: b260
      - type: single
        cat: theory
        q: 'Какое свойство есть у равнобедренной трапеции?'
        opts: ['диагонали равны', 'диагонали перпендикулярны', 'основания равны', 'все углы равны']
        ans: a
        hint: 'Симметрия относительно оси.'
        explain: 'Равнобедренная трапеция симметрична, её диагонали равны.'
        src: b261

  # ───────────────────────────── 3.5 ─────────────────────────────
  - id: ma-3-5
    subsection: ma-3-5
    num: '3.5'
    title: Многоугольники
    pages: [b263, b264, b265, b266]
    book:
      place: 'Ч. 2, раздел «Геометрия», пункт 3.5'
      summary: 'Задания на сумму углов многоугольника, внешние углы, правильные многоугольники и число диагоналей.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-104, *lyc]
    theory:
      - kind: law
        title: Углы и диагонали многоугольника
        body: |
          - Сумма внутренних углов выпуклого $n$-угольника: $180^\circ(n - 2)$.
          - Сумма внешних углов (по одному при вершине): $360^\circ$.
          - Число диагоналей: $\frac{n(n - 3)}{2}$.
          - **Правильный** многоугольник: все стороны и углы равны; угол $\frac{180^\circ(n - 2)}{n}$, внешний угол $\frac{360^\circ}{n}$.
          - Правильный шестиугольник состоит из 6 равносторонних треугольников: сторона равна радиусу описанной окружности, $S = \frac{3\sqrt3}{2}a^2$.
        src: b263
    formulas:
      - title: Сумма углов многоугольника
        tex: 'S_n = 180^\circ(n - 2)'
        meaning: '$n$ — число сторон.'
        use: 'Нахождение числа сторон или угла.'
        src: b263
      - title: Угол правильного многоугольника и число диагоналей
        tex: '\alpha_n = \frac{180^\circ(n - 2)}{n},\qquad \beta_n = \frac{360^\circ}{n},\qquad D_n = \frac{n(n - 3)}{2}'
        meaning: '$\alpha_n$ — внутренний угол, $\beta_n$ — внешний.'
        use: 'Правильные многоугольники.'
        src: b264
      - title: Площадь правильного шестиугольника
        tex: 'S = \frac{3\sqrt3}{2}a^2'
        meaning: '$a$ — сторона.'
        use: 'Шесть равносторонних треугольников.'
        src: b265
    examples:
      - title: Шестиугольник
        given: 'Найдите сумму углов шестиугольника и угол правильного шестиугольника.'
        find: 'сумму и угол.'
        method: 'Формула суммы углов.'
        steps:
          - '$180^\circ \cdot 4 = 720^\circ$.'
          - '$720^\circ : 6 = 120^\circ$.'
        check: 'Внешний угол $60^\circ = \frac{360^\circ}{6}$ ✓.'
        answer: '$720^\circ$; $120^\circ$'
        src: b263
      - title: Диагонали десятиугольника
        given: 'Сколько диагоналей у десятиугольника?'
        find: 'число.'
        method: '$\frac{n(n - 3)}{2}$.'
        steps:
          - '$\frac{10 \cdot 7}{2}$.'
          - '$= 35$.'
        check: 'Из каждой вершины 7 диагоналей, каждая посчитана дважды ✓.'
        answer: '$35$'
        src: b264
      - title: Число сторон по углу
        given: 'Угол правильного многоугольника $140^\circ$. Сколько у него сторон?'
        find: '$n$.'
        method: 'Через внешний угол.'
        steps:
          - 'Внешний угол $40^\circ$.'
          - '$n = \frac{360^\circ}{40^\circ} = 9$.'
        check: '$\frac{180 \cdot 7}{9} = 140$ ✓.'
        answer: '$9$'
        src: b264
