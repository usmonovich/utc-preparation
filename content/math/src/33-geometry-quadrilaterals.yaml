topics:
  # ───────────────────────────── 3.4.1 ─────────────────────────────
  - id: ma-3-4-1
    num: '3.4.1'
    title: Четырёхугольник, прямоугольник и квадрат
    pages: [b252, b253, b254, b255]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.4 «Четырёхугольники», пункт 3.4.1'
      summary: 'Задания на сумму углов четырёхугольника, свойства прямоугольника и квадрата: диагонали, периметр, площадь.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-104, *cm-106, *lyc]
    theory:
      - kind: law
        title: Четырёхугольник, прямоугольник, квадрат
        body: |
          - Сумма углов выпуклого четырёхугольника $360^\circ$.
          - **Прямоугольник**: все углы прямые; диагонали равны и точкой пересечения делятся пополам; $d^2 = a^2 + b^2$; $S = ab$.
          - **Квадрат** — прямоугольник с равными сторонами (и ромб с прямыми углами): $d = a\sqrt2$, $S = a^2 = \frac{d^2}{2}$; диагонали перпендикулярны.
        src: b252
    formulas:
      - title: Диагональ и площадь прямоугольника
        tex: 'd = \sqrt{a^2 + b^2},\qquad S = ab,\qquad P = 2(a + b)'
        meaning: '$a$, $b$ — стороны.'
        use: 'Задачи на прямоугольник.'
        src: b253
      - title: Квадрат
        tex: 'd = a\sqrt2,\qquad S = a^2 = \frac{d^2}{2}'
        meaning: '$a$ — сторона, $d$ — диагональ.'
        use: 'Площадь квадрата по диагонали.'
        src: b253
    examples:
      - title: Диагональ прямоугольника
        given: 'Стороны прямоугольника 6 и 8. Найдите диагональ.'
        find: '$d$.'
        method: 'Теорема Пифагора.'
        steps:
          - '$d^2 = 36 + 64 = 100$.'
          - '$d = 10$.'
        check: '$6 : 8 : 10 = 3 : 4 : 5$ ✓.'
        answer: '$10$'
        src: b253
      - title: Площадь квадрата по диагонали
        given: 'Диагональ квадрата 10. Найдите площадь.'
        find: '$S$.'
        method: '$S = \frac{d^2}{2}$.'
        steps:
          - '$S = \frac{100}{2}$.'
          - '$S = 50$.'
        check: 'Сторона $\frac{10}{\sqrt2} = 5\sqrt2$, $S = 50$ ✓.'
        answer: '$50$'
        src: b253
      - title: Стороны по периметру и площади
        given: 'Периметр прямоугольника 28, площадь 48. Найдите стороны.'
        find: '$a$, $b$.'
        method: 'Теорема Виета.'
        steps:
          - '$a + b = 14$, $ab = 48$.'
          - '$t^2 - 14t + 48 = 0$: $6$ и $8$.'
        check: '$2(6 + 8) = 28$, $6 \cdot 8 = 48$ ✓.'
        answer: '$6$ и $8$'
        src: b254
    questions:
      - type: numeric
        cat: problem
        q: 'Сторона квадрата 7. Найдите его диагональ (с точностью до 0,01).'
        num: { value: 9.8995, unit: '', tolAbs: 0.01, check: '7*Math.SQRT2' }
        hint: '$a\sqrt2$.'
        explain: '$7\sqrt2 \approx 9{,}90$.'
        f: [2]
        sol: { method: 'Диагональ квадрата.', steps: ['$d = 7\sqrt2 \approx 9{,}90$.'], answer: '7√2 ≈ 9,90' }
        src: b253
      - type: numeric
        cat: problem
        q: 'Диагональ квадрата 6. Найдите площадь.'
        num: { value: 18, unit: '', check: '36/2' }
        hint: '$\frac{d^2}{2}$.'
        explain: '$18$.'
        f: [2]
        sol: { method: 'Площадь по диагонали.', steps: ['$\frac{36}{2} = 18$.'], answer: '18' }
        src: b253
      - type: numeric
        cat: problem
        q: 'Площадь прямоугольника 60, одна сторона 12. Найдите периметр.'
        num: { value: 34, unit: '', check: '2*(12+5)' }
        hint: 'Вторая сторона $60 : 12$.'
        explain: '$2(12 + 5) = 34$.'
        f: [1]
        sol: { method: 'Площадь и периметр.', steps: ['$b = 5$.', '$P = 34$.'], answer: '34' }
        src: b253
      - type: numeric
        cat: problem
        q: 'Стороны прямоугольника $1$ и $\sqrt3$. Найдите острый угол между диагоналями (в градусах).'
        num: { value: 60, unit: '°', check: '2*Math.atan(1/Math.sqrt(3))*180/Math.PI' }
        hint: 'Диагональ образует со стороной $\sqrt3$ угол $30^\circ$.'
        explain: 'Треугольник из половин диагоналей и короткой стороны — равносторонний: $60^\circ$.'
        sol: { method: 'Угол диагонали со стороной.', steps: ['$\operatorname{tg}\varphi = \frac{1}{\sqrt3}$, $\varphi = 30^\circ$.', 'Угол между диагоналями $2\varphi = 60^\circ$.'], answer: '60°' }
        src: b254
      - type: numeric
        cat: problem
        q: 'Углы четырёхугольника относятся как $1 : 2 : 3 : 4$. Найдите наибольший угол.'
        num: { value: 144, unit: '°', check: '360/10*4' }
        hint: 'Сумма $360^\circ$.'
        explain: '$x = 36^\circ$, наибольший $144^\circ$.'
        sol: { method: 'Сумма углов четырёхугольника.', steps: ['$10x = 360^\circ$, $x = 36^\circ$.', '$4x = 144^\circ$.'], answer: '144°' }
        src: b252
      - type: numeric
        cat: problem
        q: 'Периметр квадрата 24. Найдите его площадь.'
        num: { value: 36, unit: '', check: '(24/4)**2' }
        hint: 'Сторона $6$.'
        explain: '$36$.'
        f: [2]
        sol: { method: 'Квадрат.', steps: ['$a = 6$, $S = 36$.'], answer: '36' }
        src: b253
      - type: single
        cat: theory
        q: 'Какое свойство есть у любого прямоугольника?'
        opts: ['диагонали равны', 'диагонали перпендикулярны', 'все стороны равны', 'диагонали — биссектрисы углов']
        ans: a
        hint: 'Перпендикулярность — у квадрата и ромба.'
        explain: 'Равенство диагоналей — характерное свойство прямоугольника.'
        src: b253
      - type: single
        cat: theory
        q: 'Сумма углов выпуклого четырёхугольника:'
        opts: ['$360^\circ$', '$180^\circ$', '$540^\circ$', '$720^\circ$']
        ans: a
        hint: 'Диагональ делит его на два треугольника.'
        explain: '$2 \cdot 180^\circ = 360^\circ$.'
        src: b252

  # ───────────────────────────── 3.4.2 ─────────────────────────────
  - id: ma-3-4-2
    num: '3.4.2'
    title: Ромб
    pages: [b255, b256, b257]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.4 «Четырёхугольники», пункт 3.4.2'
      summary: 'Задания на свойства ромба: диагонали, сторона, углы, площадь и высота.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-106, *lyc]
    theory:
      - kind: law
        title: Свойства ромба
        body: |
          **Ромб** — параллелограмм с равными сторонами. Его диагонали **перпендикулярны**, делятся точкой пересечения пополам и являются **биссектрисами** углов.
          - Сторона: $a^2 = \left(\frac{d_1}{2}\right)^2 + \left(\frac{d_2}{2}\right)^2$.
          - Площадь: $S = \frac{d_1d_2}{2} = a^2\sin\alpha = ah$.
        src: b255
    formulas:
      - title: Площадь ромба
        tex: 'S = \frac{d_1 d_2}{2} = a^2\sin\alpha = ah'
        meaning: '$d_1$, $d_2$ — диагонали, $a$ — сторона, $\alpha$ — угол, $h$ — высота.'
        use: 'Площадь и высота ромба.'
        src: b256
      - title: Сторона через диагонали
        tex: 'a = \frac12\sqrt{d_1^2 + d_2^2}'
        meaning: 'Половины диагоналей — катеты.'
        use: 'Сторона и периметр ромба.'
        src: b255
    examples:
      - title: Сторона и площадь
        given: 'Диагонали ромба 6 и 8. Найдите сторону и площадь.'
        find: '$a$, $S$.'
        method: 'Половины диагоналей — катеты.'
        steps:
          - '$a = \sqrt{9 + 16} = 5$.'
          - '$S = \frac{6 \cdot 8}{2} = 24$.'
        check: 'Высота $\frac{24}{5} = 4{,}8$; $5 \cdot 4{,}8 = 24$ ✓.'
        answer: '$a = 5$, $S = 24$'
        src: b255
      - title: Площадь по стороне и углу
        given: 'Сторона ромба 10, острый угол $30^\circ$. Найдите площадь.'
        find: '$S$.'
        method: '$a^2\sin\alpha$.'
        steps:
          - '$100 \cdot \frac12$.'
          - '$= 50$.'
        check: 'Высота $10\sin 30^\circ = 5$, $10 \cdot 5 = 50$ ✓.'
        answer: '$50$'
        src: b256
      - title: Вторая диагональ
        given: 'Сторона ромба 13, одна диагональ 10. Найдите другую диагональ и площадь.'
        find: '$d_2$, $S$.'
        method: 'Прямоугольный треугольник из половин диагоналей.'
        steps:
          - '$\frac{d_2}{2} = \sqrt{169 - 25} = 12$, $d_2 = 24$.'
          - '$S = \frac{10 \cdot 24}{2} = 120$.'
        check: '$5^2 + 12^2 = 13^2$ ✓.'
        answer: '$d_2 = 24$, $S = 120$'
        src: b256
    questions:
      - type: numeric
        cat: problem
        q: 'Диагонали ромба 10 и 24. Найдите сторону.'
        num: { value: 13, unit: '', check: '0.5*Math.sqrt(100+576)' }
        hint: 'Катеты 5 и 12.'
        explain: '$13$.'
        f: [2]
        sol: { method: 'Сторона через диагонали.', steps: ['$\sqrt{25 + 144} = 13$.'], answer: '13' }
        src: b255
      - type: numeric
        cat: problem
        q: 'Диагонали ромба 12 и 16. Найдите площадь.'
        num: { value: 96, unit: '', check: '12*16/2' }
        hint: '$\frac{d_1d_2}{2}$.'
        explain: '$96$.'
        f: [1]
        sol: { method: 'Площадь через диагонали.', steps: ['$\frac{12 \cdot 16}{2} = 96$.'], answer: '96' }
        src: b256
      - type: numeric
        cat: problem
        q: 'Диагонали ромба 12 и 16. Найдите периметр.'
        num: { value: 40, unit: '', check: '4*10' }
        hint: 'Сторона $\sqrt{36 + 64}$.'
        explain: '$a = 10$, $P = 40$.'
        f: [2]
        sol: { method: 'Сторона через диагонали.', steps: ['$a = 10$.', '$P = 40$.'], answer: '40' }
        src: b255
      - type: numeric
        cat: problem
        q: 'Диагонали ромба 6 и 8. Найдите высоту ромба.'
        num: { value: 4.8, unit: '', check: '24/5' }
        hint: '$h = \frac Sa$.'
        explain: '$S = 24$, $a = 5$, $h = 4{,}8$.'
        f: [1]
        sol: { method: 'Площадь двумя способами.', steps: ['$S = 24$, $a = 5$.', '$h = 4{,}8$.'], answer: '4,8' }
        src: b256
      - type: numeric
        cat: problem
        q: 'Сторона ромба 4, острый угол $60^\circ$. Найдите меньшую диагональ.'
        num: { value: 4, unit: '', check: '2*4*Math.sin(Math.PI/6)' }
        hint: 'Меньшая диагональ отсекает равносторонний треугольник.'
        explain: '$4$.'
        sol: { method: 'Равносторонний треугольник.', steps: ['Треугольник из двух сторон и меньшей диагонали — равносторонний.', 'Диагональ $4$.'], answer: '4' }
        src: b256
      - type: numeric
        cat: problem
        q: 'Одна из диагоналей ромба равна его стороне. Найдите тупой угол ромба (в градусах).'
        num: { value: 120, unit: '°', check: '180-60' }
        hint: 'Диагональ делит ромб на два равносторонних треугольника.'
        explain: 'Острый угол $60^\circ$, тупой $120^\circ$.'
        sol: { method: 'Равносторонние треугольники.', steps: ['Острый угол $60^\circ$.', 'Тупой $180^\circ - 60^\circ = 120^\circ$.'], answer: '120°' }
        src: b256
      - type: single
        cat: theory
        q: 'Какое свойство есть у любого ромба?'
        opts: ['диагонали перпендикулярны', 'диагонали равны', 'все углы прямые', 'диагонали равны сторонам']
        ans: a
        hint: 'Равны диагонали только у квадрата.'
        explain: 'Диагонали ромба перпендикулярны и делят углы пополам.'
        src: b255
      - type: single
        cat: theory
        q: 'Площадь ромба через диагонали:'
        opts: ['$\frac{d_1d_2}{2}$', '$d_1d_2$', '$\frac{d_1 + d_2}{2}$', '$\frac{d_1^2 + d_2^2}{2}$']
        ans: a
        hint: 'Четыре прямоугольных треугольника.'
        explain: '$4 \cdot \frac12 \cdot \frac{d_1}{2} \cdot \frac{d_2}{2} = \frac{d_1d_2}{2}$.'
        f: [1]
        src: b256

  # ───────────────────────────── 3.4.3 ─────────────────────────────
  - id: ma-3-4-3
    num: '3.4.3'
    title: Параллелограмм
    pages: [b257, b258, b259]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.4 «Четырёхугольники», пункт 3.4.3'
      summary: 'Задания на свойства параллелограмма: углы, стороны, диагонали, площадь, биссектриса угла.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-106, *lyc]
    theory:
      - kind: law
        title: Свойства параллелограмма
        body: |
          - Противоположные стороны и углы равны; соседние углы в сумме $180^\circ$.
          - Диагонали точкой пересечения делятся пополам.
          - Сумма квадратов диагоналей равна сумме квадратов всех сторон: $d_1^2 + d_2^2 = 2(a^2 + b^2)$.
          - Площадь: $S = ah_a = ab\sin\alpha$.
          - Биссектриса угла отсекает от параллелограмма **равнобедренный** треугольник.
        src: b257
    formulas:
      - title: Площадь параллелограмма
        tex: 'S = a h_a = ab\sin\alpha'
        meaning: '$h_a$ — высота к стороне $a$, $\alpha$ — угол между сторонами.'
        use: 'Площадь параллелограмма.'
        src: b258
      - title: Диагонали
        tex: 'd_1^2 + d_2^2 = 2(a^2 + b^2)'
        meaning: '$d_1$, $d_2$ — диагонали, $a$, $b$ — стороны.'
        use: 'Вторая диагональ по сторонам и первой диагонали.'
        src: b258
    examples:
      - title: Площадь по сторонам и углу
        given: 'Стороны 5 и 8, угол $30^\circ$. Найдите площадь.'
        find: '$S$.'
        method: '$ab\sin\alpha$.'
        steps:
          - '$5 \cdot 8 \cdot \frac12$.'
          - '$= 20$.'
        check: 'Высота к стороне 8: $5\sin 30^\circ = 2{,}5$; $8 \cdot 2{,}5 = 20$ ✓.'
        answer: '$20$'
        src: b258
      - title: Вторая диагональ
        given: 'Стороны 6 и 8, одна диагональ 10. Найдите другую.'
        find: '$d_2$.'
        method: 'Сумма квадратов диагоналей.'
        steps:
          - '$d_2^2 = 2(36 + 64) - 100 = 100$.'
          - '$d_2 = 10$ — параллелограмм оказался прямоугольником.'
        check: '$6^2 + 8^2 = 10^2$ ✓.'
        answer: '$10$'
        src: b258
      - title: Биссектриса угла
        given: 'В параллелограмме $ABCD$ $AB = 5$, $AD = 7$. Биссектриса угла $A$ пересекает $BC$ в точке $K$. Найдите $BK$ и $KC$.'
        find: '$BK$, $KC$.'
        method: 'Отсекается равнобедренный треугольник $ABK$.'
        steps:
          - '$\angle BKA = \angle KAD = \angle BAK$, значит, $BK = AB = 5$.'
          - '$KC = 7 - 5 = 2$.'
        check: '$BK + KC = BC = 7$ ✓.'
        answer: '$5$ и $2$'
        src: b259
    questions:
      - type: numeric
        cat: problem
        q: 'Один угол параллелограмма в 3 раза больше другого. Найдите больший угол.'
        num: { value: 135, unit: '°', check: '180/4*3' }
        hint: 'Соседние углы в сумме $180^\circ$.'
        explain: '$x + 3x = 180^\circ$, $x = 45^\circ$; больший $135^\circ$.'
        sol: { method: 'Соседние углы.', steps: ['$4x = 180^\circ$.', '$3x = 135^\circ$.'], answer: '135°' }
        src: b257
      - type: numeric
        cat: problem
        q: 'Основание параллелограмма 12, высота к нему 5. Найдите площадь.'
        num: { value: 60, unit: '', check: '12*5' }
        hint: '$ah$.'
        explain: '$60$.'
        f: [1]
        sol: { method: 'Площадь.', steps: ['$12 \cdot 5 = 60$.'], answer: '60' }
        src: b258
      - type: numeric
        cat: problem
        q: 'Стороны параллелограмма 4 и 6, угол $150^\circ$. Найдите площадь.'
        num: { value: 12, unit: '', check: '24*Math.sin(5*Math.PI/6)' }
        hint: '$\sin 150^\circ = \frac12$.'
        explain: '$24 \cdot \frac12 = 12$.'
        f: [1]
        sol: { method: 'Площадь через синус.', steps: ['$4 \cdot 6 \cdot \frac12 = 12$.'], answer: '12' }
        src: b258
      - type: numeric
        cat: problem
        q: 'Стороны параллелограмма 3 и 5. Найдите сумму квадратов его диагоналей.'
        num: { value: 68, unit: '', check: '2*(9+25)' }
        hint: '$2(a^2 + b^2)$.'
        explain: '$2 \cdot 34 = 68$.'
        f: [2]
        sol: { method: 'Свойство диагоналей.', steps: ['$2(9 + 25) = 68$.'], answer: '68' }
        src: b258
      - type: numeric
        cat: problem
        q: 'Периметр параллелограмма 30, одна сторона 6. Найдите другую.'
        num: { value: 9, unit: '', check: '30/2-6' }
        hint: 'Полупериметр 15.'
        explain: '$15 - 6 = 9$.'
        sol: { method: 'Периметр.', steps: ['$a + b = 15$.', '$b = 9$.'], answer: '9' }
        src: b257
      - type: numeric
        cat: problem
        q: 'В параллелограмме $ABCD$ $AB = 6$, $AD = 10$. Биссектриса угла $A$ пересекает $BC$ в точке $K$. Найдите $KC$.'
        num: { value: 4, unit: '', check: '10-6' }
        hint: '$BK = AB$.'
        explain: '$KC = 10 - 6 = 4$.'
        sol: { method: 'Равнобедренный треугольник $ABK$.', steps: ['$BK = AB = 6$.', '$KC = 10 - 6 = 4$.'], answer: '4' }
        src: b259
      - type: single
        cat: theory
        q: 'Диагонали параллелограмма…'
