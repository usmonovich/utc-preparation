topics:
  # ───────────────────────────── 3.13.1 ─────────────────────────────
  - id: ma-3-13-1
    num: '3.13.1'
    title: Призма и шар
    pages: [b310, b311]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.13 «Комбинации тел», пункт 3.13.1'
      summary: 'Задания на шар, вписанный в призму (куб), и шар, описанный около призмы (прямоугольного параллелепипеда).'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*chu]
    theory:
      - kind: law
        title: Когда шар вписан и когда описан
        body: |
          **Вписанный шар** касается всех граней. В прямую призму можно вписать шар, если в её основание можно вписать окружность и высота равна её диаметру: $h = 2r$; радиус шара равен $r$.
          **Описанный шар** проходит через все вершины. Около прямой призмы его можно описать, если около основания можно описать окружность (радиуса $\rho$); тогда $R^2 = \rho^2 + \left(\frac h2\right)^2$.
          Частные случаи:
          - куб с ребром $a$: $r = \frac a2$, $R = \frac{a\sqrt3}{2}$;
          - прямоугольный параллелепипед: $R = \frac D2$, центр — точка пересечения диагоналей.
        src: b310
    formulas:
      - title: Шар, описанный около прямой призмы
        tex: 'R^2 = \rho^2 + \left(\tfrac h2\right)^2'
        meaning: '$\rho$ — радиус окружности, описанной около основания.'
        use: 'Радиус описанного шара.'
        src: b311
      - title: Куб
        tex: 'r = \tfrac a2,\qquad R = \tfrac{a\sqrt3}{2}'
        meaning: '$r$ — вписанный, $R$ — описанный шар.'
        use: 'Куб и шар.'
        src: b310
      - title: Прямоугольный параллелепипед
        tex: 'R = \tfrac12\sqrt{a^2 + b^2 + c^2}'
        meaning: 'Половина диагонали.'
        use: 'Описанный шар.'
        src: b311
    examples:
      - title: Куб
        given: 'Ребро куба 4. Найдите радиусы вписанного и описанного шаров.'
        find: '$r$, $R$.'
        method: 'Половина ребра и половина диагонали.'
        steps:
          - '$r = 2$.'
          - '$R = \frac{4\sqrt3}{2} = 2\sqrt3$.'
        check: 'Диагональ $4\sqrt3$ ✓.'
        answer: '$2$; $2\sqrt3$'
        src: b310
      - title: Параллелепипед
        given: 'Измерения прямоугольного параллелепипеда 2, 3, 6. Найдите радиус описанного шара.'
        find: '$R$.'
        method: 'Половина диагонали.'
        steps:
          - '$D = \sqrt{4 + 9 + 36} = 7$.'
          - '$R = 3{,}5$.'
        check: '$R^2 = \rho^2 + (h/2)^2$: $\rho^2 = \frac{13}{4}$, $\frac{13}{4} + 9 = 12{,}25$ ✓.'
        answer: '$3{,}5$'
        src: b311
      - title: Правильная треугольная призма
        given: 'В правильную треугольную призму со стороной основания 6 вписан шар. Найдите высоту призмы.'
        find: '$h$.'
        method: '$h = 2r$, $r = \frac{a}{2\sqrt3}$.'
        steps:
          - '$r = \frac{6}{2\sqrt3} = \sqrt3$.'
          - '$h = 2\sqrt3 \approx 3{,}46$.'
        check: '$r = \frac{S}{p} = \frac{9\sqrt3}{9} = \sqrt3$ ✓.'
        answer: '$2\sqrt3$'
        src: b311
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите радиус шара, вписанного в куб с ребром 10.'
        num: { value: 5, unit: '', check: '10/2' }
