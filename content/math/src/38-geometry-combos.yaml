        q: 'Правильная четырёхугольная пирамида: сторона основания 12, высота 8. Найдите радиус вписанного шара.'
        num: { value: 3, unit: '', check: '3*(144*8/3)/(0.5*48*10+144)' }
        hint: 'Апофема 10.'
