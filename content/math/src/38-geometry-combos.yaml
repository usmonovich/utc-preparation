  # ───────────────────────────── 3.13.5 ─────────────────────────────
  - id: ma-3-13-5
    num: '3.13.5'
    title: Разные задачи
    pages: [b314, b315]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.13 «Комбинации тел», пункт 3.13.5'
      summary: 'Разные задачи на комбинации тел (куб и цилиндр, цилиндр и конус, призма и цилиндр). Новой теории в книге нет — ниже собран общий подход.'
    stage: verified
    stageNote: 'Ответы пересчитаны. Теоретический блок — сводка способов решения, а не новая тема.'
    sourcesChecked: '2026-10-25'
    web: [*pa-c, *chu]
    theory:
      - kind: method
        title: Как решать задачи на комбинации тел
        body: |
          1. Нарисуйте **сечение**, в котором видны оба тела: для тел вращения — осевое, для куба и шара — диагональное.
          2. Найдите, какие элементы **совпадают**: общее основание, общая высота, диагональ куба = диаметр шара, диагональ основания призмы = диаметр цилиндра.
          3. Выразите всё через один параметр и подставьте в формулы объёма или площади.
          Полезно помнить: если вершины многогранника лежат на сфере — шар **описан**; если грани касаются сферы — **вписан**.
        src: b314
    formulas:
      - title: Объём многогранника через вписанный шар
        tex: 'V = \tfrac13 S_{\text{полн}}\, r'
        meaning: '$r$ — радиус вписанного шара.'
        use: 'Связь объёма и поверхности.'
        src: b314
      - title: Куб и шар
        tex: 'D_{\text{шара}} = a\sqrt3\ \text{(описан)},\qquad D_{\text{шара}} = a\ \text{(вписан)}'
        meaning: '$a$ — ребро куба.'
        use: 'Куб в шаре и шар в кубе.'
        src: b315
    examples:
      - title: Цилиндр в кубе
        given: 'Цилиндр вписан в куб с ребром 4. Найдите объём цилиндра.'
        find: '$V$.'
        method: '$R = \frac a2$, $h = a$.'
        steps:
          - '$R = 2$, $h = 4$.'
          - '$V = 16\pi$.'
        check: 'Меньше объёма куба $64$: $16\pi \approx 50{,}3$ ✓.'
        answer: '$16\pi$'
        src: b314
      - title: Куб в шаре
        given: 'Куб вписан в шар радиуса $\sqrt3$. Найдите объём куба.'
        find: '$V$.'
        method: 'Диагональ куба = диаметр.'
        steps:
          - '$a\sqrt3 = 2\sqrt3$, $a = 2$.'
          - '$V = 8$.'
        check: '$R = \frac{2\sqrt3}{2}$ ✓.'
        answer: '$8$'
        src: b315
      - title: Конус в шаре
        given: 'Конус вписан в шар радиуса 3, его осевое сечение — прямоугольный треугольник. Найдите объём конуса.'
        find: '$V$.'
        method: 'Гипотенуза осевого сечения — диаметр шара.'
        steps:
