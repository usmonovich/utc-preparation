        explain: '$\frac{169}{24} \approx 7{,}04$.'
        f: [2]
        sol: { method: 'Описанный шар.', steps: ['$R_{\text{ш}} = \frac{169}{24} \approx 7{,}04$.'], answer: '7,04' }
        src: b313
      - type: numeric
        cat: problem
        q: 'Шар радиуса 5 описан около конуса высотой 8. Найдите радиус основания конуса.'
        num: { value: 4, unit: '', check: 'Math.sqrt(2*5*8-64)' }
