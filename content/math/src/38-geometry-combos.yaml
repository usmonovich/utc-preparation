          - '$V = \frac13 \pi \cdot 9 \cdot 3 = 9\pi$.'
        check: '$l = 3\sqrt2$, $\frac{l^2}{2h} = \frac{18}{6} = 3$ ✓.'
        answer: '$9\pi$'
        src: b315
