        explain: '$2\pi \cdot 4 \cdot 12 = 96\pi$.'
        sol: { method: 'Цилиндр с квадратным осевым сечением.', steps: ['$R = 4$, $h = 8$.', '$S = 2\pi \cdot 4 \cdot (4 + 8) = 96\pi$.'], answer: '96' }
        src: b312
      - type: numeric
