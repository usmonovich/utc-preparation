        opts: ['площадь полной поверхности', 'площадь основания', 'площадь боковой поверхности', 'площадь осевого сечения']
        ans: a
        hint: 'Шар касается всех граней.'
        explain: 'Многогранник разбивается на пирамиды над всеми гранями.'
        f: [2]
        src: b311

  # ───────────────────────────── 3.13.3 ─────────────────────────────
  - id: ma-3-13-3
    num: '3.13.3'
    title: Цилиндр и шар
    pages: [b312]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.13 «Комбинации тел», пункт 3.13.3'
      summary: 'Задания на шар, вписанный в цилиндр и описанный около него.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*pa-c, *chu]
    theory:
      - kind: law
        title: Шар и цилиндр
        body: |
          **Шар вписан в цилиндр**, если осевое сечение цилиндра — квадрат: радиус шара равен $R$, высота цилиндра $h = 2R$.
          Тогда (Архимед):
          - $V_{\text{шара}} = \frac23 V_{\text{цил}}$;
          - $S_{\text{сферы}} = S_{\text{бок. цил}} = 4\pi R^2$.
          Конус с тем же основанием и высотой: объёмы конуса, шара и цилиндра относятся как $1 : 2 : 3$.
          **Шар описан около цилиндра** радиуса $r$ и высоты $h$: $R^2 = r^2 + \left(\frac h2\right)^2$.
        src: b312
        fig: archimedes
    formulas:
      - title: Отношение Архимеда
        tex: 'V_{\text{кон}} : V_{\text{шара}} : V_{\text{цил}} = 1 : 2 : 3'
        meaning: 'Радиус $R$, высоты конуса и цилиндра $2R$.'
        use: 'Шар, вписанный в цилиндр.'
        src: b312
      - title: Шар, описанный около цилиндра
        tex: 'R^2 = r^2 + \left(\tfrac h2\right)^2'
        meaning: '$r$, $h$ — радиус и высота цилиндра.'
        use: 'Радиус описанного шара.'
        src: b312
    examples:
      - title: Вписанный шар
        given: 'Шар радиуса 3 вписан в цилиндр. Найдите объёмы цилиндра и шара.'
        find: '$V_{\text{цил}}$, $V_{\text{шара}}$.'
        method: '$h = 2R$.'
        steps:
          - '$V_{\text{цил}} = \pi \cdot 9 \cdot 6 = 54\pi$.'
          - '$V_{\text{шара}} = \frac43 \pi \cdot 27 = 36\pi$.'
        check: '$\frac{36}{54} = \frac23$ ✓.'
        answer: '$54\pi$; $36\pi$'
        src: b312
      - title: Описанный шар
        given: 'Цилиндр: $r = 3$, $h = 8$. Найдите радиус описанного шара.'
        find: '$R$.'
        method: '$R^2 = r^2 + (h/2)^2$.'
        steps:
          - '$R^2 = 9 + 16 = 25$.'
          - '$R = 5$.'
        check: 'Тройка 3, 4, 5 ✓.'
        answer: '$5$'
        src: b312
      - title: Равенство площадей
        given: 'Шар радиуса 2 вписан в цилиндр. Сравните площадь сферы и боковую поверхность цилиндра.'
        find: '$S_{\text{сферы}}$, $S_{\text{бок}}$.'
        method: '$h = 2R = 4$.'
        steps:
          - '$S_{\text{сферы}} = 4\pi \cdot 4 = 16\pi$.'
          - '$S_{\text{бок}} = 2\pi \cdot 2 \cdot 4 = 16\pi$.'
        check: 'В общем виде $2\pi R \cdot 2R = 4\pi R^2$ ✓.'
        answer: 'равны, по $16\pi$'
        src: b312
    questions:
      - type: numeric
        cat: problem
        q: 'Шар вписан в цилиндр, объём цилиндра 30. Найдите объём шара.'
        num: { value: 20, unit: '', check: '30*2/3' }
        hint: '$\frac23$ объёма цилиндра.'
        explain: '$20$.'
        f: [1]
        sol: { method: 'Отношение Архимеда.', steps: ['$V_{\text{шара}} = \frac23 \cdot 30 = 20$.'], answer: '20' }
        src: b312
      - type: numeric
