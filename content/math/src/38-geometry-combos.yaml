        sol: { method: 'Ребро по радиусу.', steps: ['$a = 6$.', '$V = 216$.'], answer: '216' }
        src: b310
      - type: numeric
        cat: problem
        q: 'Шар описан около куба с ребром 2. Найдите $\frac{S}{\pi}$ — площадь сферы, делённую на $\pi$.'
        num: { value: 12, unit: '', check: '4*3' }
        hint: '$R = \sqrt3$.'
        explain: '$4\pi \cdot 3 = 12\pi$.'
        f: [2]
        sol: { method: 'Описанный шар куба.', steps: ['$R = \frac{2\sqrt3}{2} = \sqrt3$.', '$S = 4\pi \cdot 3 = 12\pi$.'], answer: '12' }
        src: b310
      - type: numeric
        cat: problem
        q: 'В прямую призму, основание которой — прямоугольный треугольник с катетами 6 и 8, вписан шар. Найдите высоту призмы.'
        num: { value: 4, unit: '', check: '2*(6+8-10)/2' }
        hint: 'Радиус вписанной окружности $\frac{a + b - c}{2}$.'
        explain: '$r = 2$, $h = 4$.'
        sol: { method: 'Вписанный шар призмы.', steps: ['$r = \frac{6 + 8 - 10}{2} = 2$.', '$h = 2r = 4$.'], answer: '4' }
        src: b311
      - type: numeric
        cat: problem
        q: 'Около прямой призмы высотой 24, основание которой — прямоугольный треугольник с катетами 6 и 8, описан шар. Найдите его радиус.'
        num: { value: 13, unit: '', check: 'Math.hypot(5,12)' }
        hint: '$\rho$ — половина гипотенузы.'
        explain: '$\sqrt{25 + 144} = 13$.'
        f: [1]
        sol: { method: 'Описанный шар призмы.', steps: ['$\rho = 5$, $\frac h2 = 12$.', '$R = \sqrt{25 + 144} = 13$.'], answer: '13' }
        src: b311
      - type: single
        cat: theory
        q: 'В прямую призму можно вписать шар, если…'
        opts: ['в основание можно вписать окружность и высота равна её диаметру', 'около основания можно описать окружность', 'призма правильная', 'все рёбра равны']
        ans: a
        hint: 'Шар касается и оснований, и боковых граней.'
        explain: 'Иначе шар не коснётся одновременно оснований и боковых граней.'
        src: b310
      - type: single
        cat: theory
        q: 'Центр шара, описанного около прямоугольного параллелепипеда, — это…'
        opts: ['точка пересечения его диагоналей', 'центр нижнего основания', 'середина бокового ребра', 'любая вершина']
        ans: a
        hint: 'Равноудалена от всех вершин.'
        explain: 'Диагонали равны и делятся пополам в этой точке.'
        f: [3]
        src: b311

  # ───────────────────────────── 3.13.2 ─────────────────────────────
  - id: ma-3-13-2
    num: '3.13.2'
    title: Пирамида и шар
    pages: [b311, b312]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.13 «Комбинации тел», пункт 3.13.2'
      summary: 'Задания на шары, вписанные в пирамиду и описанные около неё, прежде всего правильную.'
    stage: verified
    stageNote: 'Ответы пересчитаны; радиус вписанного шара проверен двумя способами (3V/S и через половину двугранного угла).'
    sourcesChecked: '2026-10-25'
    web: [*chu]
    theory:
      - kind: law
        title: Шары и правильная пирамида
        body: |
          Около любой треугольной пирамиды и любой правильной пирамиды можно описать шар; в них же можно вписать шар. У правильной пирамиды центры обоих шаров лежат на высоте.
          **Описанный шар.** Если $h$ — высота, $\rho$ — радиус окружности, описанной около основания, то из $(h - R)^2 + \rho^2 = R^2$:
          $$R = \frac{h^2 + \rho^2}{2h}.$$
          **Вписанный шар.** Разбив многогранник на пирамиды с вершиной в центре шара, получим $V = \frac13 S_{\text{полн}}\, r$, откуда
          $$r = \frac{3V}{S_{\text{полн}}}.$$
        src: b311
    formulas:
      - title: Описанный шар правильной пирамиды
        tex: 'R = \frac{h^2 + \rho^2}{2h}'
        meaning: '$\rho$ — радиус описанной окружности основания.'
        use: 'Радиус описанного шара.'
        src: b312
      - title: Вписанный шар многогранника
        tex: 'r = \frac{3V}{S_{\text{полн}}}'
        meaning: '$S_{\text{полн}}$ — площадь полной поверхности.'
        use: 'Радиус вписанного шара.'
        src: b311
    examples:
      - title: Вписанный шар
        given: 'Правильная четырёхугольная пирамида: сторона основания 6, высота 4. Найдите радиус вписанного шара.'
        find: '$r$.'
        method: '$r = \frac{3V}{S}$.'
        steps:
          - 'Апофема $5$; $V = 48$, $S = 60 + 36 = 96$.'
          - '$r = \frac{144}{96} = 1{,}5$.'
        check: 'Через угол: $\operatorname{tg}\varphi = \frac43$, $\operatorname{tg}\frac\varphi2 = \frac12$, $r = 3 \cdot \frac12 = 1{,}5$ ✓.'
        answer: '$1{,}5$'
        src: b311
      - title: Описанный шар
        given: 'Правильная четырёхугольная пирамида: сторона основания $6\sqrt2$, высота 8. Найдите радиус описанного шара.'
        find: '$R$.'
        method: '$R = \frac{h^2 + \rho^2}{2h}$.'
        steps:
          - '$\rho = 6$ (половина диагонали).'
          - '$R = \frac{64 + 36}{16} = 6{,}25$.'
        check: '$(8 - 6{,}25)^2 + 36 = 3{,}0625 + 36 = 39{,}0625 = 6{,}25^2$ ✓.'
        answer: '$6{,}25$'
        src: b312
      - title: Проверка формулы на кубе
        given: 'Проверьте формулу $r = \frac{3V}{S}$ на кубе с ребром 2.'
        find: '$r$.'
        method: 'Подстановка.'
        steps:
          - '$V = 8$, $S = 6 \cdot 4 = 24$.'
          - '$r = \frac{24}{24} = 1$.'
        check: 'Вписанный в куб шар: $r = \frac a2 = 1$ ✓.'
        answer: '$1$'
        src: b311
    questions:
      - type: numeric
        cat: problem
        q: 'Объём многогранника 20, площадь полной поверхности 30. Найдите радиус вписанного шара.'
        num: { value: 2, unit: '', check: '3*20/30' }
