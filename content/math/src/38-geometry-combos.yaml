        f: [2]
        sol: { method: 'Формула $3V/S$.', steps: ['$m = \sqrt{64 + 36} = 10$.', '$V = 384$, $S = 384$, $r = \frac{3 \cdot 384}{384} = 3$.'], answer: '3' }
        src: b311
      - type: numeric
        cat: problem
        q: 'Правильная четырёхугольная пирамида: сторона основания $4\sqrt2$, высота 8. Найдите радиус описанного шара.'
        num: { value: 5, unit: '', check: '(64+16)/16' }
