  # ───────────────────────────── 3.13.4 ─────────────────────────────
  - id: ma-3-13-4
    num: '3.13.4'
    title: Конус и шар
    pages: [b312, b313, b314]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.13 «Комбинации тел», пункт 3.13.4'
      summary: 'Задания на шар, вписанный в конус и описанный около конуса, через осевое сечение.'
    stage: verified
    stageNote: 'Ответы пересчитаны; формулы выведены из r = S/p и R = abc/(4S) для осевого сечения.'
    sourcesChecked: '2026-10-25'
    web: [*pa-c, *chu]
    theory:
      - kind: law
        title: Сводим к осевому сечению
        body: |
          В любой конус можно вписать шар и около любого конуса — описать. Осевое сечение — равнобедренный треугольник с основанием $2R$, боковыми сторонами $l$ и высотой $h$; его площадь $Rh$, полупериметр $R + l$.
          - Радиус **вписанного** шара — радиус окружности, вписанной в осевое сечение: $r = \frac{S}{p} = \frac{Rh}{R + l}$.
          - Радиус **описанного** шара — радиус окружности, описанной около осевого сечения: $R_{\text{ш}} = \frac{l \cdot l \cdot 2R}{4Rh} = \frac{l^2}{2h}$.
        src: b312
    formulas:
      - title: Вписанный шар
        tex: 'r = \frac{Rh}{R + l}'
        meaning: '$R$, $h$, $l$ — радиус, высота, образующая конуса.'
        use: 'Шар в конусе.'
        src: b313
      - title: Описанный шар
        tex: 'R_{\text{ш}} = \frac{l^2}{2h}'
        meaning: 'Радиус окружности, описанной около осевого сечения.'
        use: 'Шар около конуса.'
        src: b313
    examples:
      - title: Конус 3–4–5
        given: 'Конус: $R = 3$, $h = 4$. Найдите радиусы вписанного и описанного шаров.'
        find: '$r$, $R_{\text{ш}}$.'
        method: 'Формулы через осевое сечение.'
        steps:
          - '$l = 5$, $r = \frac{12}{8} = 1{,}5$.'
          - '$R_{\text{ш}} = \frac{25}{8} = 3{,}125$.'
        check: '$(4 - 3{,}125)^2 + 9 = 0{,}765625 + 9 = 9{,}765625 = 3{,}125^2$ ✓.'
        answer: '$1{,}5$; $3{,}125$'
        src: b313
      - title: Равносторонний конус
        given: 'Осевое сечение конуса — равносторонний треугольник со стороной 6. Найдите $r$ и $R_{\text{ш}}$.'
        find: '$r$, $R_{\text{ш}}$.'
        method: 'Центры совпадают с центром треугольника.'
        steps:
          - '$R = 3$, $l = 6$, $h = 3\sqrt3$; $r = \frac{9\sqrt3}{9} = \sqrt3$.'
          - '$R_{\text{ш}} = \frac{36}{6\sqrt3} = 2\sqrt3$.'
        check: 'В равностороннем треугольнике $R_{\text{ш}} = 2r$ ✓.'
        answer: '$\sqrt3$; $2\sqrt3$'
        src: b314
      - title: Два конуса в одном шаре
        given: 'Шар радиуса 5 описан около конуса с радиусом основания 3. Найдите высоту конуса.'
        find: '$h$.'
        method: 'Центр шара на оси: $(h - 5)^2 + 3^2 = 5^2$.'
        steps:
          - '$(h - 5)^2 = 16$, $h - 5 = \pm 4$.'
          - '$h = 9$ или $h = 1$ — центр шара внутри или вне конуса.'
        check: '$\frac{l^2}{2h}$: $\frac{90}{18} = 5$ и $\frac{10}{2} = 5$ ✓.'
        answer: '$9$ или $1$'
        src: b314
    questions:
      - type: numeric
        cat: problem
        q: 'Конус: $R = 6$, $h = 8$. Найдите радиус вписанного шара.'
        num: { value: 3, unit: '', check: '6*8/(6+10)' }
        hint: '$l = 10$.'
        explain: '$\frac{48}{16} = 3$.'
        f: [1]
        sol: { method: 'Вписанный шар.', steps: ['$l = 10$.', '$r = \frac{48}{16} = 3$.'], answer: '3' }
        src: b313
      - type: numeric
        cat: problem
        q: 'Конус: $R = 6$, $h = 8$. Найдите радиус описанного шара.'
        num: { value: 6.25, unit: '', check: '100/16' }
        hint: '$\frac{l^2}{2h}$.'
        explain: '$\frac{100}{16} = 6{,}25$.'
        f: [2]
        sol: { method: 'Описанный шар.', steps: ['$R_{\text{ш}} = \frac{100}{16} = 6{,}25$.'], answer: '6,25' }
        src: b313
      - type: numeric
        cat: problem
        q: 'Конус: $R = 5$, $h = 12$. Найдите радиус вписанного шара (округлите до сотых).'
        num: { value: 3.33, unit: '', tolAbs: 0.01, check: '5*12/(5+13)' }
        hint: '$l = 13$.'
        explain: '$\frac{60}{18} = \frac{10}{3}$.'
        f: [1]
        sol: { method: 'Вписанный шар.', steps: ['$l = 13$.', '$r = \frac{60}{18} = \frac{10}{3} \approx 3{,}33$.'], answer: '3,33' }
        src: b313
      - type: numeric
