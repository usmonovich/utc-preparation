        src: b314
      - type: numeric
        cat: problem
        q: 'Конус: $R = 9$, $h = 12$. Найдите радиус вписанного шара.'
        num: { value: 4.5, unit: '', check: '9*12/(9+15)' }
        hint: '$l = 15$.'
        explain: '$\frac{108}{24} = 4{,}5$.'
        f: [1]
        sol: { method: 'Вписанный шар.', steps: ['$l = 15$.', '$r = \frac{108}{24} = 4{,}5$.'], answer: '4,5' }
        src: b313
      - type: single
        cat: theory
        q: 'Радиус шара, вписанного в конус, равен…'
        opts: ['радиусу окружности, вписанной в осевое сечение', 'радиусу основания конуса', 'половине высоты', 'половине образующей']
        ans: a
