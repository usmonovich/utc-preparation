        explain: '$\frac{80}{16} = 5$.'
        f: [1]
        sol: { method: 'Описанный шар.', steps: ['$\rho = 4$.', '$R = \frac{64 + 16}{16} = 5$.'], answer: '5' }
        src: b312
      - type: numeric
        cat: problem
        q: 'Правильная четырёхугольная пирамида: сторона основания $3\sqrt2$, высота 3. Найдите радиус описанного шара.'
        num: { value: 3, unit: '', check: '(9+9)/6' }
        hint: '$\rho = h$.'
        explain: 'Центр шара — центр основания.'
        f: [1]
        sol: { method: 'Описанный шар.', steps: ['$\rho = 3$.', '$R = \frac{9 + 9}{6} = 3$.'], answer: '3' }
        src: b312
      - type: numeric
        cat: problem
        q: 'Шар радиуса 5 описан около правильной пирамиды высотой 8. Найдите радиус окружности, описанной около основания пирамиды.'
        num: { value: 4, unit: '', check: 'Math.sqrt(2*8*5-64)' }
        hint: '$\rho^2 = 2hR - h^2$.'
        explain: '$\sqrt{80 - 64} = 4$.'
        f: [1]
        sol: { method: 'Из формулы описанного шара.', steps: ['$\rho^2 = 2 \cdot 8 \cdot 5 - 64 = 16$.', '$\rho = 4$.'], answer: '4' }
        src: b312
      - type: numeric
        cat: problem
        q: 'Объём многогранника 36, площадь его полной поверхности 54, в него вписан шар. Найдите радиус шара.'
        num: { value: 2, unit: '', check: '3*36/54' }
        hint: '$\frac{3V}{S}$.'
        explain: '$\frac{108}{54} = 2$.'
        f: [2]
        sol: { method: 'Формула $3V/S$.', steps: ['$r = \frac{108}{54} = 2$.'], answer: '2' }
        src: b311
      - type: single
        cat: theory
        q: 'Где лежит центр шара, описанного около правильной пирамиды?'
        opts: ['на прямой, содержащей высоту пирамиды', 'в вершине пирамиды', 'на боковом ребре', 'в середине апофемы']
        ans: a
        hint: 'Симметрия.'
        explain: 'Точки высоты равноудалены от вершин основания.'
        f: [1]
