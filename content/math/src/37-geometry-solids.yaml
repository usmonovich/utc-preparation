  # ───────────────────────────── 3.12.3 ─────────────────────────────
  - id: ma-3-12-3
    subsection: ma-3-12
    num: '3.12.3'
    title: Шар и сфера
    pages: [b309, b310]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.12 «Тела вращения», пункт 3.12.3'
      summary: 'Задания на площадь сферы, объём шара и сечения шара плоскостью.'
    stage: verified
    stageNote: 'Ответы пересчитаны; где ответ содержит π, спрашивается коэффициент при π.'
    sourcesChecked: '2026-10-25'
    web: [*pa-c]
    theory:
      - kind: definition
        title: Шар, сфера и сечения
        body: |
          **Сфера** — множество точек пространства на расстоянии $R$ от центра; **шар** — сфера вместе с внутренней частью.
          Сечение шара плоскостью — **круг**. Если плоскость удалена от центра на $d < R$, радиус сечения $r = \sqrt{R^2 - d^2}$. При $d = 0$ — большой круг ($r = R$), при $d = R$ плоскость касается шара.
          $$S_{\text{сферы}} = 4\pi R^2,\qquad V_{\text{шара}} = \frac43 \pi R^3.$$
        src: b309
        fig: sphere-section
    formulas:
      - title: Площадь сферы и объём шара
        tex: 'S = 4\pi R^2,\qquad V = \tfrac43 \pi R^3'
        meaning: '$R$ — радиус.'
        use: 'Поверхность и объём.'
        src: b309
      - title: Радиус сечения
        tex: 'r^2 = R^2 - d^2'
        meaning: '$d$ — расстояние от центра до плоскости.'
        use: 'Сечения шара.'
        src: b310
    examples:
      - title: Объём и площадь
        given: 'Радиус шара 3. Найдите $V$ и $S$.'
        find: '$V$, $S$.'
        method: 'Формулы шара.'
        steps:
          - '$V = \frac43 \pi \cdot 27 = 36\pi$.'
          - '$S = 4\pi \cdot 9 = 36\pi$.'
        check: 'При $R = 3$ числа совпадают, так как $\frac{V}{S} = \frac R3 = 1$ ✓.'
        answer: '$36\pi$; $36\pi$'
        src: b309
      - title: Сечение
        given: 'Шар радиуса 5 пересечён плоскостью на расстоянии 3 от центра. Найдите площадь сечения.'
        find: '$S_{\text{сеч}}$.'
        method: '$r^2 = R^2 - d^2$.'
        steps:
          - '$r^2 = 25 - 9 = 16$, $r = 4$.'
          - '$S = 16\pi$.'
        check: 'Тройка 3, 4, 5 ✓.'
        answer: '$16\pi$'
        src: b310
      - title: Радиус по объёму
