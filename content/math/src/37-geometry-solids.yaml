        use: 'Объём.'
        src: b305
      - title: Поверхность цилиндра
        tex: 'S_{\text{бок}} = 2\pi R h,\qquad S_{\text{полн}} = 2\pi R(R + h)'
        meaning: 'Развёртка — прямоугольник $2\pi R \times h$.'
        use: 'Площадь поверхности.'
        src: b305
