  # ───────────────────────────── 3.11.2 ─────────────────────────────
  - id: ma-3-11-2
    subsection: ma-3-11
    num: '3.11.2'
    title: Пирамида
    pages: [b299, b300, b301, b302, b303, b304]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.11 «Многогранники», пункт 3.11.2'
      summary: 'Задания на высоту, апофему, боковые рёбра, площадь поверхности и объём пирамиды, прежде всего правильной.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*zem]
    theory:
      - kind: definition
        title: Правильная пирамида
        body: |
          **Пирамида** — многогранник, основание которого — многоугольник, а боковые грани — треугольники с общей вершиной.
          **Правильная** пирамида: в основании правильный многоугольник, высота проходит через его центр. Боковые грани — равные равнобедренные треугольники; их высота из вершины пирамиды — **апофема** $m$.
          В правильной четырёхугольной пирамиде со стороной $a$ и высотой $h$:
          - $m^2 = h^2 + \left(\frac a2\right)^2$;
          - боковое ребро: $b^2 = h^2 + \left(\frac{a\sqrt2}{2}\right)^2$.
        src: b299
      - kind: law
        title: Объём и площадь поверхности
        body: |
          $$V = \frac13 S_{\text{осн}}\, h,\qquad S_{\text{бок}} = \frac12 P m\ \text{(правильная пирамида)},\qquad S_{\text{полн}} = S_{\text{бок}} + S_{\text{осн}}.$$
          Объём пирамиды в 3 раза меньше объёма призмы с тем же основанием и той же высотой.
        src: b301
    formulas:
      - title: Объём пирамиды
        tex: 'V = \tfrac13 S_{\text{осн}}\, h'
        meaning: '$S_{\text{осн}}$ — площадь основания, $h$ — высота.'
        use: 'Объём любой пирамиды.'
        src: b301
      - title: Боковая поверхность правильной пирамиды
        tex: 'S_{\text{бок}} = \tfrac12 P m'
        meaning: '$P$ — периметр основания, $m$ — апофема.'
        use: 'Площадь поверхности.'
        src: b301
      - title: Апофема правильной четырёхугольной пирамиды
        tex: 'm^2 = h^2 + \left(\tfrac a2\right)^2'
        meaning: '$a$ — сторона основания.'
        use: 'Связь высоты и апофемы.'
        src: b300
    examples:
      - title: Поверхность и объём
        given: 'Правильная четырёхугольная пирамида: сторона основания 6, высота 4. Найдите $S_{\text{бок}}$ и $V$.'
        find: '$S_{\text{бок}}$, $V$.'
        method: 'Сначала апофема.'
        steps:
          - '$m = \sqrt{16 + 9} = 5$, $S_{\text{бок}} = \frac12 \cdot 24 \cdot 5 = 60$.'
          - '$V = \frac13 \cdot 36 \cdot 4 = 48$.'
        check: 'Четыре грани по $\frac12 \cdot 6 \cdot 5 = 15$ ✓.'
        answer: '$60$; $48$'
        src: b301
      - title: Высота по боковому ребру
        given: 'Правильная четырёхугольная пирамида: сторона основания $6\sqrt2$, боковое ребро 10. Найдите объём.'
        find: '$V$.'
