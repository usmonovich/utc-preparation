        src: b294
      - type: numeric
        cat: problem
        q: 'Отрезок длиной 10 не пересекает плоскость; его концы удалены от неё на 3 и 9. Найдите длину проекции отрезка на плоскость.'
        num: { value: 8, unit: '', check: 'Math.sqrt(100-36)' }
