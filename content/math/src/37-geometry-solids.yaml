  # ───────────────────────────── 3.11.1 ─────────────────────────────
  - id: ma-3-11-1
    subsection: ma-3-11
    num: '3.11.1'
    title: Призма
    pages: [b295, b296, b297, b298, b299]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.11 «Многогранники», пункт 3.11.1'
      summary: 'Задания на площадь поверхности и объём призмы, прямоугольного параллелепипеда и куба.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-107, *zem]
    theory:
      - kind: definition
        title: Призма и её виды
        body: |
          **Призма** — многогранник, у которого два основания — равные многоугольники в параллельных плоскостях, а боковые грани — параллелограммы.
          - **Прямая** призма: боковые рёбра перпендикулярны основаниям, боковые грани — прямоугольники, высота равна боковому ребру.
          - **Правильная** призма: прямая, в основании правильный многоугольник.
          - **Прямоугольный параллелепипед** — прямая призма с прямоугольником в основании; **куб** — все рёбра равны.
        src: b295
      - kind: law
        title: Площадь поверхности и объём
        body: |
          Для прямой призмы с периметром основания $P$, площадью основания $S$ и высотой $h$:
          $$S_{\text{бок}} = P h,\qquad S_{\text{полн}} = S_{\text{бок}} + 2S,\qquad V = S h.$$
          Для параллелепипеда $a \times b \times c$: $V = abc$, $S_{\text{полн}} = 2(ab + bc + ca)$. Для куба: $V = a^3$, $S = 6a^2$.
        src: b296
    formulas:
      - title: Объём призмы
        tex: 'V = S_{\text{осн}}\, h'
        meaning: '$S_{\text{осн}}$ — площадь основания, $h$ — высота.'
        use: 'Объём любой призмы.'
        src: b296
      - title: Боковая поверхность прямой призмы
        tex: 'S_{\text{бок}} = P h,\qquad S_{\text{полн}} = Ph + 2S_{\text{осн}}'
        meaning: '$P$ — периметр основания.'
        use: 'Площадь поверхности.'
        src: b296
      - title: Параллелепипед и куб
        tex: 'V = abc,\quad S = 2(ab + bc + ca);\qquad V = a^3,\quad S = 6a^2'
        meaning: '$a$, $b$, $c$ — измерения.'
        use: 'Прямоугольный параллелепипед и куб.'
        src: b297
    examples:
      - title: Параллелепипед
        given: 'Измерения прямоугольного параллелепипеда 2, 3, 4. Найдите объём и полную поверхность.'
        find: '$V$, $S$.'
        method: 'Формулы параллелепипеда.'
        steps:
          - '$V = 2 \cdot 3 \cdot 4 = 24$.'
          - '$S = 2(6 + 12 + 8) = 52$.'
        check: 'Грани $2 \times 3$, $3 \times 4$, $2 \times 4$ — по две ✓.'
        answer: '$V = 24$, $S = 52$'
        src: b297
      - title: Правильная треугольная призма
        given: 'Сторона основания правильной треугольной призмы 4, высота 5. Найдите $S_{\text{бок}}$ и $V$.'
        find: '$S_{\text{бок}}$, $V$.'
        method: 'Площадь правильного треугольника $\frac{\sqrt3}{4}a^2$.'
        steps:
          - '$S_{\text{бок}} = 12 \cdot 5 = 60$.'
          - '$S_{\text{осн}} = 4\sqrt3$, $V = 20\sqrt3 \approx 34{,}6$.'
        check: '$\frac{\sqrt3}{4} \cdot 16 = 4\sqrt3$ ✓.'
        answer: '$60$; $20\sqrt3$'
        src: b296
      - title: Куб по диагонали
        given: 'Диагональ куба $6\sqrt3$. Найдите объём.'
        find: '$V$.'
        method: '$D = a\sqrt3$.'
        steps:
          - '$a = 6$.'
          - '$V = 216$.'
        check: '$\sqrt{36 \cdot 3} = 6\sqrt3$ ✓.'
        answer: '$216$'
        src: b298
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите площадь полной поверхности куба с ребром 5.'
        num: { value: 150, unit: '', check: '6*25' }
        hint: '$6a^2$.'
        explain: '$150$.'
        f: [3]
        sol: { method: 'Поверхность куба.', steps: ['$6 \cdot 25 = 150$.'], answer: '150' }
        src: b297
      - type: numeric
        cat: problem
        q: 'Найдите объём прямоугольного параллелепипеда с измерениями 3, 4 и 5.'
        num: { value: 60, unit: '', check: '3*4*5' }
        hint: '$abc$.'
        explain: '$60$.'
        f: [3]
        sol: { method: 'Объём параллелепипеда.', steps: ['$3 \cdot 4 \cdot 5 = 60$.'], answer: '60' }
        src: b297
      - type: numeric
        cat: problem
        q: 'Сторона основания правильной четырёхугольной призмы 3, высота 7. Найдите площадь боковой поверхности.'
        num: { value: 84, unit: '', check: '4*3*7' }
        hint: '$Ph$.'
        explain: '$12 \cdot 7 = 84$.'
        f: [2]
        sol: { method: 'Боковая поверхность.', steps: ['$P = 12$.', '$12 \cdot 7 = 84$.'], answer: '84' }
