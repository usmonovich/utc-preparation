        f: [1]
        sol: { method: 'Теорема Пифагора.', steps: ['$l = \sqrt{100} = 10$.'], answer: '10' }
        src: b306
      - type: numeric
        cat: problem
        q: 'Конус: $R = 6$, $h = 8$. Найдите $\frac{V}{\pi}$.'
        num: { value: 96, unit: '', check: '36*8/3' }
        hint: '$\frac13 R^2 h$.'
        explain: '$V = 96\pi$.'
        f: [2]
        sol: { method: 'Объём конуса.', steps: ['$\frac13 \cdot 36 \cdot 8 = 96$.'], answer: '96' }
        src: b307
      - type: numeric
        cat: problem
        q: 'Конус: $R = 5$, $l = 13$. Найдите $\frac{S_{\text{бок}}}{\pi}$.'
        num: { value: 65, unit: '', check: '5*13' }
        hint: '$Rl$.'
        explain: '$65\pi$.'
