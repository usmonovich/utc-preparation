  # ───────────────────────────── 3.12.2 ─────────────────────────────
  - id: ma-3-12-2
    subsection: ma-3-12
    num: '3.12.2'
    title: Конус
    pages: [b306, b307, b308, b309]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.12 «Тела вращения», пункт 3.12.2'
      summary: 'Задания на образующую, осевое сечение, развёртку, площадь поверхности и объём конуса.'
    stage: verified
    stageNote: 'Ответы пересчитаны; где ответ содержит π, спрашивается коэффициент при π.'
    sourcesChecked: '2026-10-25'
    web: [*pa-c]
    theory:
      - kind: definition
        title: Конус
        body: |
          Конус получается вращением прямоугольного треугольника вокруг катета. $R$ — радиус основания, $h$ — высота, $l$ — образующая: $l^2 = R^2 + h^2$.
          **Осевое сечение** — равнобедренный треугольник с основанием $2R$ и боковыми сторонами $l$.
          Развёртка боковой поверхности — круговой сектор радиуса $l$ с дугой $2\pi R$; его угол $\alpha = 360^\circ \cdot \frac{R}{l}$.
        src: b306
      - kind: law
        title: Поверхность и объём конуса
        body: |
          $$S_{\text{бок}} = \pi R l,\qquad S_{\text{полн}} = \pi R(R + l),\qquad V = \frac13 \pi R^2 h.$$
          Объём конуса втрое меньше объёма цилиндра с теми же основанием и высотой.
        src: b307
    formulas:
      - title: Образующая
        tex: 'l^2 = R^2 + h^2'
        meaning: '$l$ — образующая.'
        use: 'Связь $R$, $h$, $l$.'
        src: b306
      - title: Объём конуса
        tex: 'V = \tfrac13 \pi R^2 h'
        meaning: 'Втрое меньше цилиндра.'
        use: 'Объём.'
        src: b307
      - title: Поверхность конуса
        tex: 'S_{\text{бок}} = \pi R l,\qquad S_{\text{полн}} = \pi R(R + l)'
        meaning: 'Развёртка — сектор радиуса $l$.'
        use: 'Площадь поверхности.'
        src: b307
    examples:
      - title: Все величины
        given: 'Конус: $R = 3$, $h = 4$. Найдите $l$, $V$, $S_{\text{полн}}$.'
        find: 'три величины.'
        method: 'Формулы конуса.'
        steps:
          - '$l = 5$, $V = \frac13 \cdot 9\pi \cdot 4 = 12\pi$.'
          - '$S_{\text{полн}} = \pi \cdot 3 \cdot (3 + 5) = 24\pi$.'
        check: '$S_{\text{бок}} = 15\pi$, $S_{\text{осн}} = 9\pi$ ✓.'
        answer: '$5$; $12\pi$; $24\pi$'
        src: b307
      - title: Осевое сечение — равносторонний треугольник
        given: 'Осевое сечение конуса — равносторонний треугольник со стороной 6. Найдите $S_{\text{полн}}$.'
        find: '$S_{\text{полн}}$.'
        method: '$2R = l = 6$.'
        steps:
          - '$R = 3$, $l = 6$.'
          - '$S = \pi \cdot 3 \cdot 9 = 27\pi$.'
        check: '$9\pi + 18\pi$ ✓.'
        answer: '$27\pi$'
        src: b308
      - title: Угол развёртки
        given: 'Конус: $R = 2$, $l = 6$. Найдите угол сектора развёртки.'
        find: '$\alpha$.'
        method: 'Дуга сектора равна $2\pi R$.'
        steps:
          - '$\alpha = 360^\circ \cdot \frac{2}{6}$.'
          - '$= 120^\circ$.'
        check: 'Длина дуги $\frac{120}{360} \cdot 2\pi \cdot 6 = 4\pi = 2\pi \cdot 2$ ✓.'
        answer: '$120^\circ$'
        src: b308
    questions:
      - type: numeric
        cat: problem
        q: 'Конус: $R = 6$, $h = 8$. Найдите образующую.'
        num: { value: 10, unit: '', check: 'Math.hypot(6,8)' }
