  # ───────────────────────────── 3.10 ─────────────────────────────
  - id: ma-3-10
    num: '3.10'
    title: Прямые и плоскости в пространстве
    pages: [b292, b293, b294, b295]
    book:
      place: 'Ч. 2, раздел «Геометрия», пункт 3.10'
      summary: 'Задания на взаимное расположение прямых и плоскостей, перпендикуляр и наклонную, угол между прямой и плоскостью, расстояния в пространстве.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-101, *zem]
    theory:
      - kind: definition
        title: Взаимное расположение прямых и плоскостей
        body: |
          Две прямые в пространстве могут **пересекаться**, быть **параллельными** (лежат в одной плоскости и не пересекаются) или **скрещиваться** (не лежат в одной плоскости).
          Прямая и плоскость: прямая лежит в плоскости, пересекает её в одной точке или параллельна ей. Две плоскости либо пересекаются по прямой, либо параллельны.
        src: b292
      - kind: law
        title: Перпендикуляр и наклонная
        body: |
          **Признак перпендикулярности:** прямая перпендикулярна плоскости, если она перпендикулярна двум пересекающимся прямым этой плоскости.
          Из точки $M$ вне плоскости проведены перпендикуляр $MH = d$ и наклонная $MA = l$; отрезок $HA = p$ — проекция наклонной. Треугольник $MHA$ прямоугольный: $l^2 = d^2 + p^2$.
          **Угол между наклонной и плоскостью** — угол между наклонной и её проекцией: $\sin\varphi = \frac{d}{l}$.
          **Теорема о трёх перпендикулярах:** прямая в плоскости перпендикулярна наклонной тогда и только тогда, когда она перпендикулярна её проекции.
        src: b293
    formulas:
      - title: Перпендикуляр, наклонная, проекция
        tex: 'l^2 = d^2 + p^2'
        meaning: '$d$ — расстояние до плоскости, $l$ — наклонная, $p$ — её проекция.'
        use: 'Длины наклонных и проекций.'
        src: b293
      - title: Угол между наклонной и плоскостью
        tex: '\sin\varphi = \frac{d}{l},\qquad \cos\varphi = \frac{p}{l}'
        meaning: '$\varphi$ — угол между наклонной и её проекцией.'
        use: 'Угол или расстояние.'
        src: b294
      - title: Диагональ прямоугольного параллелепипеда
        tex: 'D^2 = a^2 + b^2 + c^2'
        meaning: '$a$, $b$, $c$ — рёбра из одной вершины.'
        use: 'Расстояние между противоположными вершинами.'
        src: b294
    examples:
      - title: Проекция наклонной
        given: 'Точка удалена от плоскости на 6, наклонная равна 10. Найдите проекцию.'
        find: '$p$.'
        method: 'Теорема Пифагора.'
        steps:
          - '$p^2 = 10^2 - 6^2 = 64$.'
          - '$p = 8$.'
        check: 'Тройка 6, 8, 10 ✓.'
        answer: '$8$'
        src: b293
      - title: Расстояние по углу
        given: 'Наклонная длиной 8 образует с плоскостью угол $30^\circ$. Найдите расстояние от её конца до плоскости.'
        find: '$d$.'
        method: '$d = l\sin\varphi$.'
        steps:
          - '$d = 8 \cdot \sin 30^\circ$.'
          - '$= 4$.'
        check: 'Катет против угла $30^\circ$ — половина гипотенузы ✓.'
        answer: '$4$'
        src: b294
      - title: Диагональ куба
        given: 'Найдите диагональ куба с ребром 2.'
        find: '$D$.'
        method: '$D^2 = a^2 + a^2 + a^2$.'
        steps:
          - '$D^2 = 12$.'
          - '$D = 2\sqrt3 \approx 3{,}46$.'
        check: 'Диагональ грани $2\sqrt2$, затем $\sqrt{8 + 4} = \sqrt{12}$ ✓.'
        answer: '$2\sqrt3$'
        src: b294
    questions:
      - type: numeric
