        explain: '$24 \cdot 10 = 240$.'
        f: [1]
        sol: { method: 'Объём призмы.', steps: ['$S_{\text{осн}} = \frac{6 \cdot 8}{2} = 24$.', '$V = 240$.'], answer: '240' }
        src: b296
      - type: numeric
        cat: problem
        q: 'Для той же призмы (катеты 6 и 8, высота 10) найдите площадь полной поверхности.'
        num: { value: 288, unit: '', check: '(6+8+10)*10+2*24' }
        hint: 'Гипотенуза 10.'
        explain: '$24 \cdot 10 + 2 \cdot 24 = 288$.'
        f: [2]
        sol: { method: 'Полная поверхность.', steps: ['$P = 6 + 8 + 10 = 24$, $S_{\text{бок}} = 240$.', '$S = 240 + 48 = 288$.'], answer: '288' }
