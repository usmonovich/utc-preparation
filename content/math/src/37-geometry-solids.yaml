        explain: '$6 \cdot 9 = 54$.'
        f: [3]
        sol: { method: 'Ребро по объёму.', steps: ['$a = \sqrt[3]{27} = 3$.', '$S = 54$.'], answer: '54' }
        src: b298
      - type: single
        cat: theory
        q: 'Объём призмы равен…'
        opts: ['площади основания, умноженной на высоту', 'трети произведения площади основания на высоту', 'периметру основания, умноженному на высоту', 'половине произведения площади основания на высоту']
        ans: a
        hint: 'Без коэффициента.'
        explain: '$V = S_{\text{осн}}h$; треть — у пирамиды.'
