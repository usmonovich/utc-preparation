        src: b118
      - type: single
        cat: theory
        q: 'С какой скоростью сокращается расстояние между объектами, движущимися навстречу со скоростями $v_1$ и $v_2$?'
        opts: ['$v_1 + v_2$', '$|v_1 - v_2|$', '$\frac{v_1 + v_2}{2}$', '$v_1 v_2$']
