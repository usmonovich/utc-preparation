    questions:
      - type: numeric
        cat: problem
        q: 'Велосипедист едет со скоростью 12 км/ч и догоняет пешехода, идущего в ту же сторону со скоростью 4 км/ч. Сейчас между ними 16 км. Через сколько часов велосипедист догонит пешехода?'
        num: { value: 2, unit: 'ч', check: '16/(12-4)' }
