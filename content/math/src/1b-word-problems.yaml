        sol: { method: 'Определение средней скорости.', steps: ['Путь $120 + 90 = 210$ км.', 'Время $3$ ч.', '$v_{\text{ср}} = 70$ км/ч.'], answer: '70 км/ч' }
        src: b118
      - type: numeric
        cat: problem
        q: 'Со скоростью 75 км/ч путь проезжают за 4 ч. За сколько часов его проедут со скоростью 100 км/ч?'
        num: { value: 3, unit: 'ч', check: '75*4/100' }
        hint: 'Путь не меняется.'
        explain: '$s = 300$ км, $t = 3$ ч.'
        f: [1]
        sol: { method: 'Обратная пропорциональность.', steps: ['$s = 75 \cdot 4 = 300$ км.', '$t = 300 : 100 = 3$ ч.'], answer: '3 ч' }
        src: b117
      - type: numeric
        cat: problem
        q: 'Расстояние 6 км один пешеход проходит на 30 мин быстрее другого, так как идёт на 1 км/ч быстрее. Найдите скорость более медленного пешехода (км/ч).'
        num: { value: 3, unit: 'км/ч', check: '(-1+Math.sqrt(1+48))/2' }
        hint: '$\frac6v - \frac{6}{v + 1} = \frac12$.'
        explain: '$v^2 + v - 12 = 0$, $v = 3$.'
        sol: { method: 'Уравнение по времени.', steps: ['$\frac6v - \frac6{v + 1} = \frac12$.', '$12(v + 1) - 12v = v(v + 1) \Rightarrow v^2 + v - 12 = 0$.', '$v = 3$ (корень $-4$ не подходит).'], check: '$6 : 3 = 2$ ч, $6 : 4 = 1{,}5$ ч — разница 30 мин.', answer: '3 км/ч' }
        src: b118
      - type: single
        cat: theory
        q: 'Половину пути проехали со скоростью $v_1$, половину — со скоростью $v_2$. Средняя скорость равна…'
