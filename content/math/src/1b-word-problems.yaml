        ans: a
        hint: 'Всё время $\frac{s}{2v_1} + \frac{s}{2v_2}$.'
        explain: '$v_{\text{ср}} = \frac{s}{\frac{s}{2v_1} + \frac{s}{2v_2}} = \frac{2v_1v_2}{v_1 + v_2}$.'
