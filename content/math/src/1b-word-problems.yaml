topics:
  # ───────────────────────────── 1.11.1 ─────────────────────────────
  - id: ma-1-11-1
    num: '1.11.1'
    title: Задачи на числа
    pages: [b103, b104, b105, b106, b107, b108, b109, b110, b111, b112, b113]
    book:
      place: 'Ч. 1, 1.11 «Текстовые задачи», пункт 1.11.1'
      summary: 'Большой набор задач на составление уравнений: цифры числа, последовательные числа, отношения и части, средние значения, суммы и произведения неизвестных чисел.'
    stage: verified
    stageNote: 'Ответы проверены подстановкой в условие.'
    sourcesChecked: '2026-10-25'
    web: [*os-31]
    theory:
      - kind: rule
        title: Как составить уравнение
        body: |
          1. Обозначить неизвестное буквой (обычно меньшее из чисел или то, что спрашивают).
          2. Выразить через него остальные величины из условия.
          3. Записать равенство, которое описывает условие, и решить.
          4. **Проверить** ответ по условию (натуральность, цифры от 0 до 9 и т. п.) и ответить именно на заданный вопрос.
        src: b103
      - kind: rule
        title: Числа и цифры
        body: |
          - Двузначное число с цифрами $a$ (десятки) и $b$ (единицы): $\overline{ab} = 10a + b$, $a \ne 0$; трёхзначное: $100a + 10b + c$.
          - Число, записанное теми же цифрами наоборот: $10b + a$; разность $\overline{ab} - \overline{ba} = 9(a - b)$ всегда делится на 9.
          - Приписать справа цифру $c$ к числу $x$: $10x + c$.
          - Последовательные целые: $n, n + 1, n + 2$; последовательные чётные: $2n, 2n + 2, \dots$
          - Отношение $a : b = 3 : 5$: $a = 3k$, $b = 5k$; среднее арифметическое $n$ чисел — сумма, делённая на $n$.
        src: b104
    formulas:
      - title: Запись числа через цифры
        tex: '\overline{ab} = 10a + b,\qquad \overline{abc} = 100a + 10b + c'
        meaning: '$a, b, c$ — цифры, $a \ne 0$.'
        use: 'Задачи о цифрах и перестановке цифр.'
        src: b104
      - title: Среднее арифметическое
        tex: '\bar x = \frac{x_1 + x_2 + \dots + x_n}{n}'
        meaning: '$n$ — количество чисел.'
        use: 'Если известно среднее, сумма равна $n\bar x$.'
        src: b104
    examples:
      - title: Перестановка цифр
        given: 'Сумма цифр двузначного числа равна 11. Если цифры переставить, число увеличится на 27. Найдите число.'
        find: 'число.'
        method: '$\overline{ab} = 10a + b$.'
        steps:
          - '$a + b = 11$; $(10b + a) - (10a + b) = 27 \Rightarrow 9(b - a) = 27 \Rightarrow b - a = 3$.'
          - '$a = 4$, $b = 7$.'
        check: '$74 - 47 = 27$, $4 + 7 = 11$ ✓.'
        answer: '$47$'
        src: b104
      - title: Последовательные чётные числа
        given: 'Сумма трёх последовательных чётных чисел равна 78. Найдите их.'
        find: 'числа.'
        method: 'Среднее число $2n$, соседи $2n \pm 2$.'
        steps:
          - '$(2n - 2) + 2n + (2n + 2) = 6n = 78 \Rightarrow n = 13$.'
          - 'Числа $24$, $26$, $28$.'
        check: '$24 + 26 + 28 = 78$ ✓.'
        answer: '$24, 26, 28$'
        src: b104
      - title: Отношение частей
        given: 'Два числа относятся как $3 : 5$, их сумма равна 64. Найдите числа.'
        find: 'числа.'
        method: 'Одна часть — $k$.'
        steps:
          - '$3k + 5k = 64 \Rightarrow k = 8$.'
          - 'Числа $24$ и $40$.'
        check: '$24 : 40 = 3 : 5$, $24 + 40 = 64$ ✓.'
        answer: '$24$ и $40$'
        src: b104
    questions:
      - type: numeric
        cat: problem
        q: 'Сумма двух чисел равна 45, одно из них в 4 раза больше другого. Найдите большее число.'
        num: { value: 36, unit: '', check: '45/5*4' }
        hint: '$x + 4x = 45$.'
        explain: '$x = 9$, большее $36$.'
        sol: { method: 'Линейное уравнение.', steps: ['$5x = 45$, $x = 9$.', 'Большее $4x = 36$.'], answer: '36' }
        src: b103
      - type: numeric
        cat: problem
        q: 'Среднее арифметическое пяти чисел равно 12. Когда к ним добавили шестое число, среднее стало равно 13. Найдите шестое число.'
        num: { value: 18, unit: '', check: '6*13-5*12' }
        hint: 'Перейдите к суммам.'
        explain: '$78 - 60 = 18$.'
        f: [2]
        sol: { method: 'Сумма через среднее.', steps: ['Сумма пяти чисел $60$.', 'Сумма шести чисел $78$.', 'Шестое число $18$.'], answer: '18' }
        src: b104
      - type: numeric
        cat: problem
        q: 'Двузначное число в 4 раза больше суммы своих цифр, а сумма цифр равна 9. Найдите число.'
        num: { value: 36, unit: '', check: '36' }
        hint: '$10a + b = 4(a + b)$.'
        explain: '$6a = 3b$, $b = 2a$; с $a + b = 9$: $a = 3$, $b = 6$.'
        f: [1]
        sol: { method: 'Запись через цифры.', steps: ['$10a + b = 4(a + b) \Rightarrow b = 2a$.', '$3a = 9 \Rightarrow a = 3$, $b = 6$.'], check: '$36 = 4 \cdot 9$.', answer: '36' }
        src: b104
      - type: numeric
        cat: problem
        q: 'Если к натуральному числу приписать справа цифру 5, оно увеличится на 293. Найдите число.'
        num: { value: 32, unit: '', check: '(293-5)/9' }
        hint: 'Новое число $10x + 5$.'
        explain: '$10x + 5 - x = 293 \Rightarrow 9x = 288 \Rightarrow x = 32$.'
        f: [1]
        sol: { method: 'Приписывание цифры.', steps: ['$10x + 5 = x + 293$.', '$9x = 288$, $x = 32$.'], check: '$325 - 32 = 293$.', answer: '32' }
        src: b105
      - type: numeric
        cat: problem
        q: 'Произведение двух последовательных натуральных чисел равно 156. Найдите меньшее из них.'
        num: { value: 12, unit: '', check: '(-1+Math.sqrt(1+4*156))/2' }
        hint: '$n(n + 1) = 156$.'
        explain: '$n^2 + n - 156 = 0$, $n = 12$.'
        sol: { method: 'Квадратное уравнение.', steps: ['$n^2 + n - 156 = 0$, $D = 625$.', '$n = \frac{-1 + 25}{2} = 12$.'], check: '$12 \cdot 13 = 156$.', answer: '12' }
        src: b105
      - type: numeric
        cat: problem
        q: 'Сумма трёх последовательных целых чисел равна 72. Найдите наибольшее.'
        num: { value: 25, unit: '', check: '72/3+1' }
        hint: 'Среднее число равно $72 : 3$.'
        explain: 'Числа $23, 24, 25$.'
        sol: { method: 'Последовательные числа.', steps: ['$(n - 1) + n + (n + 1) = 3n = 72$.', '$n = 24$, наибольшее $25$.'], answer: '25' }
        src: b104
      - type: single
        cat: theory
        q: 'Как записать двузначное число с цифрой десятков $a$ и цифрой единиц $b$?'
        opts: ['$10a + b$', '$ab$', '$a + b$', '$10b + a$']
        ans: a
        hint: 'Например, $47 = 4 \cdot 10 + 7$.'
        explain: '$a$ десятков дают $10a$, плюс $b$ единиц.'
        f: [1]
        src: b104
      - type: single
        cat: theory
        q: 'Разность двузначного числа и числа, записанного теми же цифрами в обратном порядке, всегда…'
        opts: ['делится на 9', 'делится на 11', 'чётна', 'равна сумме цифр']
        ans: a
        hint: '$(10a + b) - (10b + a)$.'
        explain: 'Разность равна $9(a - b)$.'
        f: [1]
        src: b104

  # ───────────────────────────── 1.11.2 ─────────────────────────────
  - id: ma-1-11-2
    num: '1.11.2'
    title: Задачи на проценты
    pages: [b113, b114, b115, b116, b117]
    book:
      place: 'Ч. 1, 1.11 «Текстовые задачи», пункт 1.11.2'
      summary: 'Задачи на нахождение процента от числа и числа по проценту, на последовательные повышения и понижения, ежегодный рост и сложные проценты.'
    stage: verified
    stageNote: 'Ответы пересчитаны через множители $1 \pm \frac{p}{100}$.'
    sourcesChecked: '2026-10-25'
    web: [*os-32]
    theory:
      - kind: rule
        title: Проценты как множители
        body: |
          - $p\%$ от $A$: $\frac{p}{100}A$; число, $p\%$ которого равны $B$: $\frac{100B}{p}$.
          - Увеличение на $p\%$ — умножение на $1 + \frac{p}{100}$; уменьшение — на $1 - \frac{p}{100}$.
          - Несколько изменений подряд — **перемножение** множителей: $+30\%$, затем $-30\%$: $1{,}3 \cdot 0{,}7 = 0{,}91$, то есть итог $-9\%$ (а не $0\%$).
          - Сложные проценты: $n$ раз по $p\%$ — $A\left(1 + \frac{p}{100}\right)^n$.
        src: b113
      - kind: rule
        title: Процент изменения и база сравнения
        body: |
          Изменение в процентах считают **от исходной величины**: $\frac{\text{новое} - \text{старое}}{\text{старое}} \cdot 100\%$.
          «$A$ на 25 % больше $B$» означает $A = 1{,}25B$; тогда $B = 0{,}8A$ — $B$ меньше $A$ на 20 %, а не на 25 %.
        src: b114
    formulas:
      - title: Сложные проценты
        tex: 'A_n = A_0\left(1 + \frac{p}{100}\right)^n'
        meaning: '$A_0$ — начальная величина, $p$ — процент за период, $n$ — число периодов.'
        use: 'Вклады, ежегодный рост; при уменьшении — знак «−».'
        src: b114
      - title: Процент изменения
        tex: '\Delta\% = \frac{A_{\text{нов}} - A_{\text{стар}}}{A_{\text{стар}}} \cdot 100\%'
        meaning: 'База — исходная величина.'
        use: '«На сколько процентов увеличилось / уменьшилось».'
        src: b114
    examples:
      - title: Два изменения подряд
        given: 'Цену 800 повысили на 15 %, затем понизили на 20 %. Найдите новую цену.'
        find: 'цену.'
        method: 'Перемножить множители.'
        steps:
          - '$800 \cdot 1{,}15 = 920$.'
          - '$920 \cdot 0{,}8 = 736$.'
        check: '$800 \cdot 0{,}92 = 736$ — итог $-8\%$ ✓.'
        answer: '$736$'
        src: b113
      - title: Рост два года подряд
        given: 'Производство растёт на 20 % в год. На сколько процентов оно вырастет за 2 года?'
        find: 'процент роста.'
        method: 'Сложные проценты.'
        steps:
          - '$1{,}2^2 = 1{,}44$.'
          - 'Рост на $44\%$ (а не на $40\%$).'
        check: '$100 \to 120 \to 144$ ✓.'
        answer: '$44\%$'
        src: b114
      - title: Смена базы
        given: '$A$ на 25 % больше $B$. На сколько процентов $B$ меньше $A$?'
        find: 'процент.'
        method: 'Выразить $B$ через $A$.'
        steps:
          - '$A = 1{,}25B \Rightarrow B = \frac{A}{1{,}25} = 0{,}8A$.'
          - '$B$ меньше $A$ на $20\%$.'
        check: '$B = 100$, $A = 125$: $\frac{25}{125} = 20\%$ ✓.'
        answer: '$20\%$'
        src: b114
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите 15 % от 240.'
        num: { value: 36, unit: '', check: '0.15*240' }
        hint: '$0{,}15 \cdot 240$.'
        explain: '$36$.'
        sol: { method: 'Процент от числа.', steps: ['$\frac{15}{100} \cdot 240 = 36$.'], answer: '36' }
        src: b113
      - type: numeric
        cat: problem
        q: '35 % числа равны 70. Найдите число.'
        num: { value: 200, unit: '', check: '70/0.35' }
        hint: 'Число по проценту: $\frac{100B}{p}$.'
        explain: '$\frac{70 \cdot 100}{35} = 200$.'
        sol: { method: 'Число по его проценту.', steps: ['$0{,}35x = 70$.', '$x = 200$.'], answer: '200' }
        src: b113
      - type: numeric
        cat: problem
        q: 'Вклад 5000 под 10 % годовых с ежегодным начислением процентов на накопленную сумму. Сколько будет через 2 года?'
        num: { value: 6050, unit: '', check: '5000*1.1**2' }
        hint: 'Сложные проценты.'
        explain: '$5000 \cdot 1{,}21 = 6050$.'
        f: [1]
        sol: { method: 'Сложные проценты.', steps: ['$5000 \cdot 1{,}1 = 5500$.', '$5500 \cdot 1{,}1 = 6050$.'], answer: '6050' }
        src: b114
      - type: numeric
        cat: problem
        q: 'Цену снизили на 30 %, а затем повысили на 30 %. На сколько процентов новая цена ниже исходной?'
        num: { value: 9, unit: '%', check: '(1-0.7*1.3)*100' }
        hint: '$0{,}7 \cdot 1{,}3$.'
        explain: '$0{,}91$ — ниже на $9\%$.'
        f: [2]
        sol: { method: 'Перемножение множителей.', steps: ['$0{,}7 \cdot 1{,}3 = 0{,}91$.', 'Цена ниже на $9\%$.'], answer: '9 %' }
        src: b113
      - type: numeric
        cat: problem
        q: 'Зарплата выросла с 1200 до 1500. На сколько процентов она выросла?'
        num: { value: 25, unit: '%', check: '(1500-1200)/1200*100' }
        hint: 'Делите на исходную величину.'
        explain: '$\frac{300}{1200} = 25\%$.'
        f: [2]
        sol: { method: 'Процент изменения.', steps: ['Рост $300$.', '$\frac{300}{1200} \cdot 100\% = 25\%$.'], answer: '25 %' }
        src: b114
      - type: numeric
        cat: problem
        q: 'Свежие грибы содержат 90 % воды, сушёные — 12 %. Сколько килограммов сушёных грибов получится из 22 кг свежих?'
        num: { value: 2.5, unit: 'кг', check: '22*0.1/0.88' }
        hint: 'Масса сухого вещества не меняется.'
        explain: 'Сухое вещество $2{,}2$ кг составляет 88 % сушёных: $\frac{2{,}2}{0{,}88} = 2{,}5$ кг.'
        sol: { method: 'Неизменная часть.', steps: ['Сухое вещество: $22 \cdot 0{,}1 = 2{,}2$ кг.', 'В сушёных оно составляет 88 %.', '$\frac{2{,}2}{0{,}88} = 2{,}5$ кг.'], answer: '2,5 кг' }
        src: b115
      - type: single
        cat: theory
        q: 'Число увеличили на 50 %, затем результат уменьшили на 50 %. Что получилось?'
        opts: ['75 % исходного числа', 'исходное число', '50 % исходного числа', '125 % исходного числа']
        ans: a
        hint: '$1{,}5 \cdot 0{,}5$.'
        explain: '$1{,}5 \cdot 0{,}5 = 0{,}75$.'
        src: b113
      - type: single
        cat: theory
        q: 'Что означает «$A$ на 20 % больше $B$»?'
        opts: ['$A = 1{,}2B$', '$B = 0{,}8A$', '$A = B + 20$', '$A = 0{,}2B$']
        ans: a
        hint: 'База — то, с чем сравнивают.'
        explain: 'К $B$ прибавили 20 % от $B$. Вариант $B = 0{,}8A$ неверен: из $A = 1{,}2B$ следует $B = \frac56 A$.'
        f: [2]
        src: b114

  # ───────────────────────────── 1.11.3 ─────────────────────────────
  - id: ma-1-11-3
    num: '1.11.3'
    title: Задачи на движение
    pages: [b117, b118, b119]
    book:
      place: 'Ч. 1, 1.11 «Текстовые задачи», пункт 1.11.3'
      summary: 'Задачи на движение навстречу, вдогонку, по реке и на среднюю скорость.'
    stage: verified
    stageNote: 'Ответы проверены подстановкой времени и расстояний.'
    sourcesChecked: '2026-10-25'
    web: [*os-35, *os-88]
    theory:
      - kind: rule
        title: Скорость сближения
        body: |
          Основная связь: $s = vt$.
          - **Навстречу**: расстояние сокращается со скоростью $v_1 + v_2$; время встречи $t = \frac{s}{v_1 + v_2}$.
          - **Вдогонку**: скорость сближения $v_1 - v_2$ ($v_1 > v_2$).
          - **По реке**: по течению $v + u$, против течения $v - u$ ($u$ — скорость течения); $u = \frac{v_{\text{по}} - v_{\text{против}}}{2}$.
        src: b117
        fig: meeting-motion
      - kind: rule
        title: Средняя скорость
        body: |
          $v_{\text{ср}} = \frac{\text{весь путь}}{\text{всё время}}$ — это **не** среднее арифметическое скоростей.
          Для двух **равных по длине** участков: $v_{\text{ср}} = \frac{2v_1v_2}{v_1 + v_2}$; для двух **равных по времени** — $\frac{v_1 + v_2}{2}$.
        src: b118
    formulas:
      - title: Путь, скорость, время
        tex: 's = vt,\qquad t_{\text{встр}} = \frac{s}{v_1 + v_2},\qquad t_{\text{догон}} = \frac{s}{v_1 - v_2}'
        meaning: '$s$ — начальное расстояние между объектами.'
        use: 'Движение навстречу и вдогонку.'
        src: b117
      - title: Средняя скорость на равных участках
        tex: 'v_{\text{ср}} = \frac{2v_1v_2}{v_1 + v_2}'
        meaning: 'Половина пути со скоростью $v_1$, половина — $v_2$.'
        use: '«Туда — со скоростью 60, обратно — 40».'
        limits: 'Для равных промежутков времени — среднее арифметическое.'
        src: b118
    examples:
      - title: Встречное движение
        given: 'Из двух городов, расстояние между которыми 360 км, навстречу выехали автомобили со скоростями 70 и 50 км/ч. Через сколько часов они встретятся?'
        find: '$t$.'
        method: 'Скорость сближения.'
        steps:
          - '$v_1 + v_2 = 120$ км/ч.'
          - '$t = \frac{360}{120} = 3$ ч.'
        check: '$70 \cdot 3 + 50 \cdot 3 = 210 + 150 = 360$ ✓.'
        answer: '$3$ ч'
        src: b117
      - title: Движение по реке
        given: 'Собственная скорость лодки 15 км/ч, скорость течения 3 км/ч. Сколько времени займёт путь 36 км по течению и обратно?'
        find: 'время.'
        method: 'Скорости $v \pm u$.'
        steps:
          - 'По течению: $\frac{36}{18} = 2$ ч.'
          - 'Против течения: $\frac{36}{12} = 3$ ч; всего $5$ ч.'
        check: '$18 \cdot 2 = 36$, $12 \cdot 3 = 36$ ✓.'
        answer: '$5$ ч'
        src: b118
      - title: Средняя скорость
        given: 'Туда автомобиль ехал со скоростью 60 км/ч, обратно — 40 км/ч. Найдите среднюю скорость.'
        find: '$v_{\text{ср}}$.'
        method: 'Весь путь на всё время.'
        steps:
          - 'Пусть путь в одну сторону $s$: время $\frac{s}{60} + \frac{s}{40} = \frac{s}{24}$.'
          - '$v_{\text{ср}} = \frac{2s}{s/24} = 48$ км/ч.'
        check: 'Формула $\frac{2 \cdot 60 \cdot 40}{100} = 48$ ✓.'
        answer: '$48$ км/ч'
