  # ───────────────────────────── 1.11.4 ─────────────────────────────
  - id: ma-1-11-4
    num: '1.11.4'
    title: Задачи на работу
    pages: [b119, b120, b121]
    book:
      place: 'Ч. 1, 1.11 «Текстовые задачи», пункт 1.11.4'
      summary: 'Задачи на совместную работу (рабочие, трубы, запасы, которых хватает на определённое число дней): найти время совместной или отдельной работы.'
    stage: verified
    stageNote: 'Производительности сложены и проверены обратным пересчётом.'
    sourcesChecked: '2026-10-25'
    web: [*os-88]
    theory:
      - kind: rule
        title: Производительность
        body: |
          Всю работу принимают за $1$. Если работу выполняют за время $t$, производительность (работа за единицу времени) равна $\frac1t$; работа $A = P \cdot t$.
          - При совместной работе производительности **складываются**: $\frac1t = \frac1{t_1} + \frac1{t_2}$, отсюда $t = \frac{t_1t_2}{t_1 + t_2}$.
          - Труба, которая опустошает бак, даёт производительность со знаком «−».
          - Совместное время всегда **меньше** меньшего из отдельных времён.
        src: b119
        fig: work-rates
    formulas:
      - title: Работа и производительность
        tex: 'A = P\,t,\qquad P = \frac{1}{t}'
        meaning: '$A$ — объём работы (часто $1$), $P$ — производительность, $t$ — время.'
        use: 'Любые задачи на работу.'
        src: b119
      - title: Время совместной работы
        tex: '\frac{1}{t} = \frac{1}{t_1} + \frac{1}{t_2}\ \Rightarrow\ t = \frac{t_1t_2}{t_1 + t_2}'
        meaning: '$t_1$, $t_2$ — время каждого в отдельности.'
        use: 'Две трубы, два рабочих.'
        variants: 'Наполнение и слив одновременно: $\frac1t = \frac1{t_1} - \frac1{t_2}$.'
        src: b119
    examples:
      - title: Две трубы
        given: 'Первая труба наполняет бак за 6 ч, вторая — за 3 ч. За сколько часов наполнят бак обе трубы?'
        find: '$t$.'
        method: 'Сложить производительности.'
        steps:
          - '$\frac16 + \frac13 = \frac12$ бака в час.'
          - '$t = 2$ ч.'
        check: '$\frac{6 \cdot 3}{6 + 3} = 2$ ✓.'
        answer: '$2$ ч'
        src: b119
      - title: Время второго рабочего
        given: 'Двое рабочих вместе выполняют работу за 12 дней, первый один — за 20 дней. За сколько дней выполнит работу второй?'
        find: '$t_2$.'
        method: 'Вычесть производительности.'
        steps:
          - '$\frac1{t_2} = \frac1{12} - \frac1{20} = \frac{5 - 3}{60} = \frac1{30}$.'
          - '$t_2 = 30$ дней.'
        check: '$\frac{20 \cdot 30}{50} = 12$ ✓.'
        answer: '$30$ дней'
        src: b120
      - title: Наполнение и слив
        given: 'Одна труба наполняет бассейн за 4 ч, другая сливает его за 6 ч. За сколько часов наполнится бассейн при обеих открытых трубах?'
        find: '$t$.'
        method: 'Производительность слива со знаком «−».'
        steps:
          - '$\frac14 - \frac16 = \frac1{12}$.'
          - '$t = 12$ ч.'
        check: 'За 12 ч: налито 3 бассейна, слито 2 ✓.'
        answer: '$12$ ч'
        src: b120
    questions:
      - type: numeric
        cat: problem
        q: 'Один рабочий выполняет работу за 10 ч, другой — за 15 ч. За сколько часов они выполнят её вместе?'
        num: { value: 6, unit: 'ч', check: '10*15/(10+15)' }
        hint: '$t = \frac{t_1t_2}{t_1 + t_2}$.'
        explain: '$\frac{150}{25} = 6$ ч.'
        f: [2]
        sol: { method: 'Совместная работа.', steps: ['$\frac1{10} + \frac1{15} = \frac16$.', '$t = 6$ ч.'], answer: '6 ч' }
        src: b119
      - type: numeric
        cat: problem
        q: 'Три трубы наполняют бак по отдельности за 2 ч, 3 ч и 6 ч. За сколько часов наполнят бак все три вместе?'
        num: { value: 1, unit: 'ч', check: '1/(1/2+1/3+1/6)' }
        hint: 'Сложите три производительности.'
        explain: '$\frac12 + \frac13 + \frac16 = 1$ — один бак в час.'
        f: [2]
        sol: { method: 'Сумма производительностей.', steps: ['$\frac36 + \frac26 + \frac16 = 1$.', '$t = 1$ ч.'], answer: '1 ч' }
        src: b119
      - type: numeric
        cat: problem
        q: 'Вместе две бригады выполняют заказ за 8 дней, первая одна — за 24 дня. За сколько дней выполнит заказ вторая бригада?'
        num: { value: 12, unit: 'дней', check: '1/(1/8-1/24)' }
        hint: '$\frac18 - \frac1{24}$.'
        explain: '$\frac{3 - 1}{24} = \frac1{12}$ — 12 дней.'
        f: [2]
        sol: { method: 'Разность производительностей.', steps: ['$\frac1{t_2} = \frac18 - \frac1{24} = \frac1{12}$.', '$t_2 = 12$ дней.'], answer: '12' }
        src: b120
      - type: numeric
        cat: problem
        q: 'Первый рабочий может выполнить работу за 8 ч, второй — за 4 ч. Первый проработал 2 ч, затем к нему присоединился второй. Сколько всего часов заняла работа?'
        num: { value: 4, unit: 'ч', check: '2+(1-2/8)/(1/8+1/4)' }
        hint: 'Сначала найдите, какая часть сделана за 2 ч.'
        explain: 'За 2 ч сделано $\frac14$; остаток $\frac34$ при производительности $\frac38$ — 2 ч; всего 4 ч.'
        f: [1]
        sol: { method: 'Работа по частям.', steps: ['Первый за 2 ч: $\frac28 = \frac14$.', 'Вместе: $\frac18 + \frac14 = \frac38$ в час.', 'Остаток $\frac34 : \frac38 = 2$ ч; всего $4$ ч.'], answer: '4 ч' }
        src: b120
      - type: numeric
        cat: problem
        q: 'Первый принтер печатает 30 страниц за 2 мин, второй — 30 страниц за 3 мин. За сколько минут они вместе напечатают 150 страниц?'
        num: { value: 6, unit: 'мин', check: '150/(15+10)' }
        hint: 'Производительности в страницах в минуту.'
        explain: '$15 + 10 = 25$ стр./мин; $150 : 25 = 6$ мин.'
        f: [1]
        sol: { method: 'Сумма производительностей.', steps: ['$15$ и $10$ страниц в минуту.', 'Вместе $25$ стр./мин.', '$150 : 25 = 6$ мин.'], answer: '6 мин' }
        src: b119
      - type: numeric
        cat: problem
        q: 'Одна труба наполняет бассейн за 3 ч, другая сливает его за 5 ч. За сколько часов наполнится бассейн при обеих открытых трубах?'
        num: { value: 7.5, unit: 'ч', check: '1/(1/3-1/5)' }
        hint: '$\frac13 - \frac15$.'
        explain: '$\frac2{15}$ бассейна в час — $7{,}5$ ч.'
        f: [2]
        sol: { method: 'Наполнение и слив.', steps: ['$\frac13 - \frac15 = \frac2{15}$.', '$t = \frac{15}{2} = 7{,}5$ ч.'], answer: '7,5 ч' }
        src: b120
      - type: single
        cat: theory
        q: 'Два насоса работают вместе. Время совместной работы…'
        opts: ['меньше меньшего из отдельных времён', 'равно среднему отдельных времён', 'больше меньшего из времён', 'равно сумме времён']
        ans: a
        hint: 'Вместе работают быстрее, чем самый быстрый в одиночку.'
        explain: '$\frac1t = \frac1{t_1} + \frac1{t_2} > \frac1{t_1}$, значит, $t < t_1$ (и $t < t_2$).'
        f: [2]
        src: b119
      - type: single
        cat: theory
        q: 'Чему равна производительность, если вся работа выполняется за 5 ч?'
        opts: ['$\frac15$ работы в час', '$5$ работ в час', '$\frac15$ ч', '$5$ ч']
        ans: a
        hint: '$P = \frac{A}{t}$, $A = 1$.'
        explain: 'За час выполняется пятая часть работы.'
        f: [1]
        src: b119

  # ───────────────────────────── 1.11.5 ─────────────────────────────
  - id: ma-1-11-5
    num: '1.11.5'
    title: Задачи на смеси
    pages: [b121]
    book:
      place: 'Ч. 1, 1.11 «Текстовые задачи», пункт 1.11.5'
      summary: 'Небольшой набор задач на растворы, смеси и сплавы: концентрация после смешивания, доливания или выпаривания.'
    stage: verified
    stageNote: 'Массы вещества пересчитаны до и после смешивания.'
    sourcesChecked: '2026-10-25'
    web: [*os-33]
    theory:
      - kind: rule
        title: Масса вещества сохраняется
        body: |
          **Концентрация** $c$ — доля вещества в смеси: масса вещества $= c \cdot m$ ($c = 15\% = 0{,}15$).
          - При смешивании массы вещества складываются: $c_1m_1 + c_2m_2 = c(m_1 + m_2)$.
          - При доливании воды или выпаривании меняется масса смеси, а масса вещества — **нет**.
          - Концентрация смеси лежит **между** концентрациями исходных растворов.
          Правило «креста»: $\frac{m_1}{m_2} = \frac{c_2 - c}{c - c_1}$.
        src: b121
    formulas:
      - title: Уравнение смешивания
        tex: 'c_1m_1 + c_2m_2 = c\,(m_1 + m_2)'
        meaning: '$c_i$ — концентрации (доли), $m_i$ — массы, $c$ — концентрация смеси.'
        use: 'Любые задачи на растворы и сплавы.'
        src: b121
      - title: Правило креста
        tex: '\frac{m_1}{m_2} = \frac{c_2 - c}{c - c_1}\qquad (c_1 < c < c_2)'
        meaning: 'Соотношение масс для получения концентрации $c$.'
        use: 'Быстро найти пропорцию смешивания.'
        src: b121
    examples:
      - title: Смешивание растворов
        given: 'Смешали 200 г 10-процентного и 300 г 20-процентного раствора соли. Найдите концентрацию смеси.'
        find: '$c$.'
        method: 'Сложить массы соли.'
        steps:
          - 'Соль: $20 + 60 = 80$ г; масса $500$ г.'
          - '$c = \frac{80}{500} = 16\%$.'
        check: '$16\%$ лежит между $10\%$ и $20\%$ ✓.'
        answer: '$16\%$'
        src: b121
      - title: Разбавление водой
        given: 'Сколько граммов воды нужно добавить к 300 г 15-процентного раствора, чтобы получить 10-процентный?'
        find: 'массу воды.'
        method: 'Масса соли не меняется.'
        steps:
          - 'Соль: $0{,}15 \cdot 300 = 45$ г.'
          - '$\frac{45}{300 + x} = 0{,}1 \Rightarrow x = 150$ г.'
        check: '$\frac{45}{450} = 10\%$ ✓.'
        answer: '$150$ г'
        src: b121
      - title: Нужная концентрация
        given: 'Сколько килограммов 30-процентного и 50-процентного сплава надо взять, чтобы получить 40 кг 45-процентного?'
        find: 'массы сплавов.'
        method: 'Система: масса и вещество.'
        steps:
          - '$x + y = 40$; $0{,}3x + 0{,}5y = 0{,}45 \cdot 40 = 18$.'
          - '$0{,}3x + 20 - 0{,}5x = 18 \Rightarrow x = 10$, $y = 30$.'
        check: 'Правило креста: $\frac{x}{y} = \frac{50 - 45}{45 - 30} = \frac13$ ✓.'
        answer: '$10$ кг и $30$ кг'
        src: b121
    questions:
      - type: numeric
        cat: problem
        q: 'Сколько граммов соли в 400 г 5-процентного раствора?'
        num: { value: 20, unit: 'г', check: '0.05*400' }
        hint: 'Масса вещества $= c \cdot m$.'
        explain: '$0{,}05 \cdot 400 = 20$ г.'
        sol: { method: 'Масса вещества.', steps: ['$0{,}05 \cdot 400 = 20$ г.'], answer: '20 г' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Сплавили 2 кг сплава с 40 % меди и 3 кг сплава с 10 % меди. Найдите процент меди в новом сплаве.'
        num: { value: 22, unit: '%', check: '(0.8+0.3)/5*100' }
        hint: 'Сложите массы меди.'
        explain: '$\frac{0{,}8 + 0{,}3}{5} = 22\%$.'
        f: [1]
        sol: { method: 'Уравнение смешивания.', steps: ['Медь: $0{,}8 + 0{,}3 = 1{,}1$ кг.', '$\frac{1{,}1}{5} = 22\%$.'], answer: '22 %' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Сколько граммов воды нужно выпарить из 500 г 4-процентного раствора, чтобы получить 10-процентный?'
        num: { value: 300, unit: 'г', check: '500-20/0.1' }
        hint: 'Соль: 20 г — это 10 % нового раствора.'
        explain: 'Новый раствор $200$ г, выпарить $300$ г.'
        sol: { method: 'Неизменная масса вещества.', steps: ['Соль $0{,}04 \cdot 500 = 20$ г.', 'Новая масса $20 : 0{,}1 = 200$ г.', 'Выпарить $500 - 200 = 300$ г.'], answer: '300 г' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Сколько литров 60-процентной кислоты надо добавить к 10 л 20-процентной, чтобы получить 40-процентную?'
        num: { value: 10, unit: 'л', check: '(0.4*10-2)/(0.6-0.4)' }
        hint: '$2 + 0{,}6x = 0{,}4(10 + x)$.'
        explain: '$0{,}2x = 2$, $x = 10$ л.'
        f: [1]
        sol: { method: 'Уравнение смешивания.', steps: ['$0{,}2 \cdot 10 + 0{,}6x = 0{,}4(10 + x)$.', '$2 + 0{,}6x = 4 + 0{,}4x$.', '$x = 10$ л.'], answer: '10 л' }
        src: b121
      - type: numeric
        cat: problem
        q: 'В каком отношении (по массе) нужно смешать 10-процентный и 25-процентный растворы, чтобы получить 15-процентный? Укажите $m_1 : m_2$.'
        num: { value: 2, unit: '', check: '(25-15)/(15-10)' }
        hint: 'Правило креста.'
        explain: '$\frac{25 - 15}{15 - 10} = 2$: на 2 части первого — 1 часть второго.'
        f: [2]
        sol: { method: 'Правило креста.', steps: ['$\frac{m_1}{m_2} = \frac{25 - 15}{15 - 10} = \frac{10}{5} = 2$.'], check: '$\frac{0{,}1 \cdot 2 + 0{,}25 \cdot 1}{3} = 0{,}15$.', answer: '2' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Сплав массой 6 кг содержит 45 % меди. Сколько килограммов меди нужно добавить, чтобы её стало 60 %?'
        num: { value: 2.25, unit: 'кг', check: '(0.6*6-2.7)/(1-0.6)' }
