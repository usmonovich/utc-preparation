        explain: '$\frac{16}{8} = 2$ ч.'
        f: [1]
        sol: { method: 'Движение вдогонку.', steps: ['$v_1 - v_2 = 8$ км/ч.', '$t = 16 : 8 = 2$ ч.'], answer: '2 ч' }
        src: b117
      - type: numeric
        cat: problem
        q: 'Два поезда вышли навстречу друг другу из городов, расстояние между которыми 450 км, и встретились через 3 ч. Скорость одного на 10 км/ч больше. Найдите большую скорость.'
        num: { value: 80, unit: 'км/ч', check: '(450/3+10)/2' }
        hint: '$v_1 + v_2 = 150$.'
        explain: '$v + v + 10 = 150$, $v = 70$; большая $80$.'
        f: [1]
        sol: { method: 'Скорость сближения.', steps: ['$v_1 + v_2 = 450 : 3 = 150$.', '$2v + 10 = 150 \Rightarrow v = 70$.', 'Большая скорость $80$ км/ч.'], answer: '80 км/ч' }
        src: b117
      - type: numeric
        cat: problem
        q: 'Скорость катера по течению 20 км/ч, против течения 14 км/ч. Найдите скорость течения.'
        num: { value: 3, unit: 'км/ч', check: '(20-14)/2' }
        hint: 'Разность скоростей — два раза скорость течения.'
        explain: '$\frac{20 - 14}{2} = 3$ км/ч.'
        sol: { method: 'Скорости по реке.', steps: ['$(v + u) - (v - u) = 2u = 6$.', '$u = 3$ км/ч.'], answer: '3 км/ч' }
        src: b118
      - type: numeric
        cat: problem
        q: 'Автомобиль ехал 2 ч со скоростью 60 км/ч и 1 ч со скоростью 90 км/ч. Найдите среднюю скорость.'
