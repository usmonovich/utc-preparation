        f: [1]
        src: b282

  # ───────────────────────────── 3.9.1 ─────────────────────────────
  - id: ma-3-9-1
    num: '3.9.1'
    title: Координаты вектора
    pages: [b284, b285]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.9 «Векторы», пункт 3.9.1'
      summary: 'Задания на координаты вектора, сложение векторов и умножение на число, коллинеарность.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*at-108]
    theory:
      - kind: definition
        title: Координаты вектора
        body: |
          Вектор $\overrightarrow{AB}$ с началом $A(x_1; y_1)$ и концом $B(x_2; y_2)$ имеет координаты $(x_2 - x_1;\ y_2 - y_1)$ — «конец минус начало».
          - Сумма: $\vec a + \vec b = (a_1 + b_1;\ a_2 + b_2)$ (правило треугольника или параллелограмма).
          - Умножение на число: $k\vec a = (ka_1;\ ka_2)$.
          - Векторы **коллинеарны**, если координаты пропорциональны: $\frac{a_1}{b_1} = \frac{a_2}{b_2}$ (то есть $a_1b_2 - a_2b_1 = 0$).
        src: b284
        fig: vector-sum
    formulas:
      - title: Координаты вектора по точкам
        tex: '\overrightarrow{AB} = (x_2 - x_1;\ y_2 - y_1)'
        meaning: '$A$ — начало, $B$ — конец.'
        use: 'Векторы по точкам.'
        src: b284
      - title: Действия с векторами
        tex: '\vec a + \vec b = (a_1 + b_1;\ a_2 + b_2),\qquad k\vec a = (ka_1;\ ka_2)'
        meaning: 'Покоординатно.'
        use: 'Сумма, разность, умножение на число.'
        src: b284
      - title: Коллинеарность
        tex: '\vec a \parallel \vec b \iff a_1b_2 - a_2b_1 = 0'
        meaning: 'Координаты пропорциональны.'
        use: 'Параллельность векторов.'
        src: b285
    examples:
      - title: Вектор по точкам
        given: '$A(1; 2)$, $B(4; -2)$. Найдите $\overrightarrow{AB}$.'
        find: 'координаты.'
        method: 'Конец минус начало.'
        steps:
          - '$x = 4 - 1 = 3$.'
          - '$y = -2 - 2 = -4$.'
        check: '$A + \overrightarrow{AB} = (1 + 3; 2 - 4) = B$ ✓.'
        answer: '$(3; -4)$'
        src: b284
      - title: Линейная комбинация
        given: '$\vec a = (2; -1)$, $\vec b = (1; 3)$. Найдите $2\vec a - \vec b$.'
        find: 'координаты.'
        method: 'Покоординатно.'
        steps:
          - '$2\vec a = (4; -2)$.'
          - '$2\vec a - \vec b = (3; -5)$.'
        check: '$4 - 1 = 3$, $-2 - 3 = -5$ ✓.'
        answer: '$(3; -5)$'
        src: b284
      - title: Коллинеарность
        given: 'При каком $k$ векторы $(2; k)$ и $(4; 6)$ коллинеарны?'
        find: '$k$.'
        method: 'Пропорциональность координат.'
        steps:
          - '$2 \cdot 6 - 4k = 0$.'
          - '$k = 3$.'
        check: '$(4; 6) = 2 \cdot (2; 3)$ ✓.'
        answer: '$3$'
        src: b285
    questions:
      - type: numeric
        cat: problem
        q: '$A(-1; 4)$, $B(3; 1)$. Найдите абсциссу вектора $\overrightarrow{AB}$.'
        num: { value: 4, unit: '', check: '3-(-1)' }
        hint: 'Конец минус начало.'
        explain: '$3 - (-1) = 4$.'
        f: [1]
        sol: { method: 'Координаты вектора.', steps: ['$x = 3 + 1 = 4$.'], answer: '4' }
        src: b284
      - type: numeric
        cat: problem
        q: '$\vec a = (3; 2)$, $\vec b = (-1; 5)$. Найдите ординату вектора $\vec a + \vec b$.'
        num: { value: 7, unit: '', check: '2+5' }
        hint: 'Сложите ординаты.'
        explain: '$7$.'
        f: [2]
        sol: { method: 'Сумма векторов.', steps: ['$2 + 5 = 7$.'], answer: '7' }
        src: b284
      - type: numeric
        cat: problem
        q: 'При каком $m$ векторы $(m; 6)$ и $(2; 3)$ коллинеарны?'
        num: { value: 4, unit: '', check: '2*6/3' }
        hint: '$3m - 12 = 0$.'
        explain: '$m = 4$.'
        f: [3]
        sol: { method: 'Коллинеарность.', steps: ['$m \cdot 3 - 6 \cdot 2 = 0$.', '$m = 4$.'], answer: '4' }
        src: b285
      - type: numeric
        cat: problem
        q: '$ABCD$ — параллелограмм, $A(0; 0)$, $B(3; 1)$, $C(5; 4)$. Найдите абсциссу $D$.'
        num: { value: 2, unit: '', check: '0+5-3' }
        hint: '$\overrightarrow{AD} = \overrightarrow{BC}$.'
        explain: '$D = A + C - B = (2; 3)$.'
        f: [1]
        sol: { method: 'Равные векторы.', steps: ['$\overrightarrow{BC} = (2; 3)$.', '$D = A + (2; 3) = (2; 3)$.'], answer: '2' }
        src: b285
      - type: numeric
        cat: problem
        q: '$\vec a = (-2; 4)$. Найдите абсциссу вектора $3\vec a$.'
        num: { value: -6, unit: '', check: '3*(-2)' }
        hint: 'Умножьте координаты на 3.'
        explain: '$-6$.'
        f: [2]
        sol: { method: 'Умножение на число.', steps: ['$3 \cdot (-2) = -6$.'], answer: '−6' }
        src: b284
      - type: numeric
        cat: problem
        q: 'При каком $k$ вектор $(k; 2)$ коллинеарен вектору $(-3; -6)$?'
        num: { value: 1, unit: '', check: '-3*2/(-6)' }
        hint: '$-6k + 6 = 0$.'
        explain: '$k = 1$.'
        f: [3]
        sol: { method: 'Коллинеарность.', steps: ['$k \cdot (-6) - 2 \cdot (-3) = 0$.', '$k = 1$.'], answer: '1' }
        src: b285
      - type: single
        cat: theory
        q: 'Координаты вектора $\overrightarrow{AB}$ равны…'
        opts: ['координатам $B$ минус координаты $A$', 'координатам $A$ минус координаты $B$', 'сумме координат $A$ и $B$', 'полусумме координат']
        ans: a
        hint: '«Конец минус начало».'
        explain: '$\overrightarrow{AB} = B - A$.'
        f: [1]
        src: b284
      - type: single
        cat: theory
        q: 'Сумма векторов по правилу параллелограмма — это…'
        opts: ['диагональ параллелограмма, построенного на векторах', 'сторона параллелограмма', 'меньшая диагональ', 'периметр']
        ans: a
        hint: 'Векторы откладывают от одной точки.'
        explain: 'Диагональ, выходящая из общего начала векторов.'
        f: [2]
        src: b284

  # ───────────────────────────── 3.9.2 ─────────────────────────────
  - id: ma-3-9-2
    num: '3.9.2'
    title: Длина вектора
    pages: [b285, b286, b287]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.9 «Векторы», пункт 3.9.2'
      summary: 'Задания на длину вектора на плоскости и в пространстве.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*at-108]
    theory:
      - kind: law
        title: Длина вектора
        body: |
          $$|\vec a| = \sqrt{a_1^2 + a_2^2}\quad \text{(на плоскости)},\qquad |\vec a| = \sqrt{a_1^2 + a_2^2 + a_3^2}\quad \text{(в пространстве)}.$$
          $|k\vec a| = |k| \cdot |\vec a|$. Длина суммы обычно не равна сумме длин: $|\vec a + \vec b| \le |\vec a| + |\vec b|$.
        src: b285
    formulas:
      - title: Длина вектора
        tex: '|\vec a| = \sqrt{a_1^2 + a_2^2 + a_3^2}'
        meaning: 'На плоскости $a_3 = 0$.'
        use: 'Длины векторов и отрезков.'
        src: b285
      - title: Длина произведения на число
        tex: '|k\vec a| = |k|\,|\vec a|'
        meaning: '$k$ — число.'
        use: 'Растяжение вектора.'
        src: b286
    examples:
      - title: На плоскости
        given: 'Найдите длину вектора $(3; -4)$.'
        find: '$|\vec a|$.'
        method: 'Формула длины.'
        steps:
          - '$\sqrt{9 + 16}$.'
          - '$= 5$.'
        check: 'Тройка 3, 4, 5 ✓.'
        answer: '$5$'
        src: b285
      - title: По точкам
        given: '$A(1; 1)$, $B(4; 5)$. Найдите $|\overrightarrow{AB}|$.'
        find: 'длину.'
        method: 'Сначала координаты.'
        steps:
          - '$\overrightarrow{AB} = (3; 4)$.'
          - '$|\overrightarrow{AB}| = 5$.'
        check: 'Совпадает с расстоянием $AB$ ✓.'
        answer: '$5$'
        src: b286
      - title: Длина суммы
        given: '$\vec a = (1; 2)$, $\vec b = (3; 1)$. Найдите $|\vec a + \vec b|$.'
        find: 'длину.'
        method: 'Сначала сумма.'
        steps:
          - '$\vec a + \vec b = (4; 3)$.'
          - '$|\vec a + \vec b| = 5$.'
        check: '$|\vec a| + |\vec b| = \sqrt5 + \sqrt{10} \approx 5{,}4 > 5$ ✓.'
        answer: '$5$'
        src: b286
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите длину вектора $(6; 8)$.'
        num: { value: 10, unit: '', check: 'Math.hypot(6,8)' }
        hint: '$\sqrt{36 + 64}$.'
        explain: '$10$.'
        f: [1]
        sol: { method: 'Длина вектора.', steps: ['$\sqrt{100} = 10$.'], answer: '10' }
        src: b285
      - type: numeric
        cat: problem
        q: 'Найдите длину вектора $(1; 2; 2)$.'
        num: { value: 3, unit: '', check: 'Math.hypot(1,2,2)' }
        hint: 'Три координаты.'
        explain: '$\sqrt{1 + 4 + 4} = 3$.'
        f: [1]
        sol: { method: 'Длина в пространстве.', steps: ['$\sqrt9 = 3$.'], answer: '3' }
        src: b285
      - type: numeric
        cat: problem
        q: 'При каком положительном $m$ длина вектора $(m; 12)$ равна 13?'
        num: { value: 5, unit: '', check: 'Math.sqrt(169-144)' }
        hint: '$m^2 + 144 = 169$.'
        explain: '$m = 5$.'
        f: [1]
        sol: { method: 'Уравнение для длины.', steps: ['$m^2 = 25$, $m = 5$.'], answer: '5' }
        src: b286
      - type: numeric
