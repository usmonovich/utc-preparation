        f: [1]
        src: b285

  # ───────────────────────────── 3.9.3 ─────────────────────────────
  - id: ma-3-9-3
    num: '3.9.3'
    title: Скалярное произведение векторов
    pages: [b287, b288, b289]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.9 «Векторы», пункт 3.9.3'
      summary: 'Задания на скалярное произведение в координатах и через длины и угол, перпендикулярность векторов.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*at-108]
    theory:
      - kind: law
        title: Скалярное произведение
        body: |
          $$\vec a \cdot \vec b = |\vec a|\,|\vec b|\cos\varphi = a_1b_1 + a_2b_2\ (+\,a_3b_3).$$
          - $\vec a \perp \vec b \iff \vec a \cdot \vec b = 0$.
          - $\vec a \cdot \vec a = |\vec a|^2$.
          - Знак: $> 0$ — угол острый, $< 0$ — тупой.
          - $(\vec a + \vec b) \cdot (\vec a - \vec b) = |\vec a|^2 - |\vec b|^2$.
        src: b287
    formulas:
      - title: Скалярное произведение
        tex: '\vec a \cdot \vec b = |\vec a|\,|\vec b|\cos\varphi = a_1b_1 + a_2b_2 + a_3b_3'
        meaning: '$\varphi$ — угол между векторами.'
        use: 'Перпендикулярность, углы, длины.'
        src: b287
      - title: Условие перпендикулярности
        tex: '\vec a \perp \vec b \iff a_1b_1 + a_2b_2 = 0'
        meaning: 'Ненулевые векторы.'
        use: 'Найти параметр, при котором векторы перпендикулярны.'
        src: b288
    examples:
      - title: В координатах
        given: 'Найдите $(2; 3) \cdot (4; -1)$.'
        find: 'произведение.'
        method: 'Сумма произведений координат.'
        steps:
          - '$2 \cdot 4 + 3 \cdot (-1)$.'
          - '$= 5$.'
        check: 'Положительно — угол острый ✓.'
        answer: '$5$'
        src: b287
      - title: Через угол
        given: '$|\vec a| = 2$, $|\vec b| = 3$, угол $60^\circ$. Найдите $\vec a \cdot \vec b$.'
        find: 'произведение.'
        method: '$|\vec a||\vec b|\cos\varphi$.'
        steps:
          - '$2 \cdot 3 \cdot \frac12$.'
          - '$= 3$.'
        check: '$\cos 60^\circ = 0{,}5$ ✓.'
        answer: '$3$'
        src: b287
      - title: Перпендикулярность
        given: 'При каком $k$ векторы $(k; 2)$ и $(3; -6)$ перпендикулярны?'
        find: '$k$.'
        method: 'Скалярное произведение равно 0.'
        steps:
          - '$3k - 12 = 0$.'
          - '$k = 4$.'
        check: '$(4; 2) \cdot (3; -6) = 12 - 12 = 0$ ✓.'
        answer: '$4$'
        src: b288
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите $(1; -2) \cdot (3; 4)$.'
        num: { value: -5, unit: '', check: '1*3+(-2)*4' }
        hint: '$3 - 8$.'
        explain: '$-5$.'
        f: [1]
        sol: { method: 'В координатах.', steps: ['$3 - 8 = -5$.'], answer: '−5' }
        src: b287
      - type: numeric
        cat: problem
        q: '$|\vec a| = 4$, $|\vec b| = 5$, угол $120^\circ$. Найдите $\vec a \cdot \vec b$.'
        num: { value: -10, unit: '', check: '20*Math.cos(2*Math.PI/3)' }
        hint: '$\cos 120^\circ = -\frac12$.'
        explain: '$-10$.'
        f: [1]
        sol: { method: 'Через угол.', steps: ['$20 \cdot (-0{,}5) = -10$.'], answer: '−10' }
        src: b287
      - type: numeric
        cat: problem
        q: 'При каком $m$ векторы $(m; 3)$ и $(2; -4)$ перпендикулярны?'
        num: { value: 6, unit: '', check: '12/2' }
        hint: '$2m - 12 = 0$.'
        explain: '$m = 6$.'
        f: [2]
        sol: { method: 'Перпендикулярность.', steps: ['$2m - 12 = 0$, $m = 6$.'], answer: '6' }
        src: b288
      - type: numeric
        cat: problem
        q: 'Найдите $\vec a \cdot \vec a$ для $\vec a = (3; 4)$.'
        num: { value: 25, unit: '', check: '9+16' }
        hint: 'Квадрат длины.'
        explain: '$25$.'
        f: [1]
        sol: { method: 'Скалярный квадрат.', steps: ['$9 + 16 = 25$.'], answer: '25' }
        src: b287
      - type: numeric
        cat: problem
        q: '$|\vec a| = 5$, $|\vec b| = 3$. Найдите $(\vec a + \vec b) \cdot (\vec a - \vec b)$.'
        num: { value: 16, unit: '', check: '25-9' }
        hint: '$|\vec a|^2 - |\vec b|^2$.'
        explain: '$16$.'
        sol: { method: 'Раскрытие скобок.', steps: ['$\vec a^2 - \vec b^2 = 25 - 9 = 16$.'], answer: '16' }
        src: b288
      - type: numeric
        cat: problem
        q: 'Найдите $(1; 2; 3) \cdot (4; 0; -1)$.'
        num: { value: 1, unit: '', check: '4+0-3' }
        hint: 'Три слагаемых.'
        explain: '$4 + 0 - 3 = 1$.'
        f: [1]
        sol: { method: 'В координатах.', steps: ['$4 + 0 - 3 = 1$.'], answer: '1' }
        src: b287
      - type: single
        cat: theory
        q: 'Скалярное произведение ненулевых векторов отрицательно. Угол между ними…'
        opts: ['тупой', 'острый', 'прямой', 'нулевой']
        ans: a
        hint: 'Знак косинуса.'
        explain: '$\cos\varphi < 0$ при $90^\circ < \varphi \le 180^\circ$.'
        f: [1]
        src: b287
      - type: single
        cat: theory
        q: 'Когда скалярное произведение ненулевых векторов равно нулю?'
        opts: ['когда векторы перпендикулярны', 'когда коллинеарны', 'когда равны', 'никогда']
        ans: a
        hint: '$\cos 90^\circ = 0$.'
        explain: 'Условие перпендикулярности.'
        f: [2]
        src: b288

  # ───────────────────────────── 3.9.4 ─────────────────────────────
  - id: ma-3-9-4
    num: '3.9.4'
    title: Угол между двумя векторами
    pages: [b289, b290, b291, b292]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.9 «Векторы», пункт 3.9.4'
      summary: 'Задания на угол между векторами на плоскости и в пространстве по их координатам.'
    stage: verified
    stageNote: 'Углы пересчитаны через Math.acos.'
    sourcesChecked: '2026-10-25'
    web: [*at-108]
    theory:
      - kind: law
        title: Косинус угла между векторами
        body: |
          $$\cos\varphi = \frac{\vec a \cdot \vec b}{|\vec a|\,|\vec b|} = \frac{a_1b_1 + a_2b_2 + a_3b_3}{\sqrt{a_1^2 + a_2^2 + a_3^2}\,\sqrt{b_1^2 + b_2^2 + b_3^2}}.$$
          Угол между векторами берётся от $0^\circ$ до $180^\circ$. Так же находят углы треугольника по координатам вершин: угол при $A$ — угол между $\overrightarrow{AB}$ и $\overrightarrow{AC}$.
        src: b289
    formulas:
      - title: Угол между векторами
        tex: '\cos\varphi = \frac{\vec a \cdot \vec b}{|\vec a|\,|\vec b|}'
        meaning: '$0^\circ \le \varphi \le 180^\circ$.'
        use: 'Углы по координатам.'
        src: b289
    examples:
      - title: Угол 45°
        given: 'Найдите угол между $(1; 0)$ и $(1; 1)$.'
        find: '$\varphi$.'
        method: 'Формула косинуса.'
        steps:
          - '$\cos\varphi = \frac{1}{1 \cdot \sqrt2}$.'
          - '$\varphi = 45^\circ$.'
        check: 'Вектор $(1; 1)$ — биссектриса первого угла ✓.'
        answer: '$45^\circ$'
        src: b289
      - title: Косинус угла
        given: 'Найдите косинус угла между $(3; 4)$ и $(4; 3)$.'
        find: '$\cos\varphi$.'
        method: 'Формула косинуса.'
        steps:
          - '$\frac{12 + 12}{5 \cdot 5}$.'
          - '$= 0{,}96$.'
        check: 'Угол $\approx 16{,}3^\circ$ — векторы почти сонаправлены ✓.'
        answer: '$0{,}96$'
        src: b290
      - title: Прямой угол
        given: 'Найдите угол между $(1; 2)$ и $(2; -1)$.'
        find: '$\varphi$.'
        method: 'Скалярное произведение.'
        steps:
          - '$2 - 2 = 0$.'
          - '$\varphi = 90^\circ$.'
        check: '$\cos\varphi = 0$ ✓.'
        answer: '$90^\circ$'
        src: b290
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите угол между векторами $(1; \sqrt3)$ и $(1; 0)$ (в градусах).'
        num: { value: 60, unit: '°', check: 'Math.acos(1/2)*180/Math.PI' }
        hint: '$\cos\varphi = \frac{1}{2 \cdot 1}$.'
        explain: '$60^\circ$.'
        f: [1]
        sol: { method: 'Формула косинуса.', steps: ['$|\vec a| = 2$, $\vec a \cdot \vec b = 1$.', '$\cos\varphi = \frac12$, $\varphi = 60^\circ$.'], answer: '60°' }
        src: b289
      - type: numeric
        cat: problem
        q: 'Найдите угол между векторами $(2; 2)$ и $(-1; 1)$ (в градусах).'
        num: { value: 90, unit: '°', check: 'Math.acos(0)*180/Math.PI' }
        hint: 'Скалярное произведение.'
        explain: '$-2 + 2 = 0$.'
        f: [1]
        sol: { method: 'Перпендикулярность.', steps: ['$\vec a \cdot \vec b = 0$.', '$90^\circ$.'], answer: '90°' }
        src: b290
      - type: numeric
        cat: problem
        q: 'Найдите угол между векторами $(1; 0)$ и $(-1; 1)$ (в градусах).'
        num: { value: 135, unit: '°', check: 'Math.acos(-1/Math.SQRT2)*180/Math.PI' }
        hint: '$\cos\varphi = -\frac{1}{\sqrt2}$.'
        explain: '$135^\circ$.'
        f: [1]
        sol: { method: 'Формула косинуса.', steps: ['$\cos\varphi = \frac{-1}{1 \cdot \sqrt2}$.', '$\varphi = 135^\circ$.'], answer: '135°' }
        src: b290
      - type: numeric
        cat: problem
        q: 'Найдите косинус угла между векторами $(3; 4)$ и $(0; 5)$.'
        num: { value: 0.8, unit: '', check: '20/25' }
        hint: '$\frac{20}{5 \cdot 5}$.'
        explain: '$0{,}8$.'
        f: [1]
        sol: { method: 'Формула косинуса.', steps: ['$\frac{0 + 20}{25} = 0{,}8$.'], answer: '0,8' }
        src: b290
      - type: numeric
        cat: problem
        q: 'Найдите угол между векторами $(1; 1; 0)$ и $(1; 0; 1)$ (в градусах).'
        num: { value: 60, unit: '°', check: 'Math.acos(1/2)*180/Math.PI' }
        hint: '$\cos\varphi = \frac{1}{\sqrt2\sqrt2}$.'
        explain: '$60^\circ$.'
        f: [1]
        sol: { method: 'Угол в пространстве.', steps: ['$\vec a \cdot \vec b = 1$, длины $\sqrt2$.', '$\cos\varphi = \frac12$, $60^\circ$.'], answer: '60°' }
        src: b291
      - type: numeric
        cat: problem
        q: 'Даны точки $A(0; 0)$, $B(3; 0)$, $C(3; 3)$. Найдите угол $BAC$ (в градусах).'
        num: { value: 45, unit: '°', check: 'Math.acos(9/(3*Math.sqrt(18)))*180/Math.PI' }
        hint: 'Угол между $\overrightarrow{AB}$ и $\overrightarrow{AC}$.'
        explain: '$\cos = \frac{9}{3 \cdot 3\sqrt2} = \frac{1}{\sqrt2}$.'
        f: [1]
        sol: { method: 'Угол треугольника по координатам.', steps: ['$\overrightarrow{AB} = (3; 0)$, $\overrightarrow{AC} = (3; 3)$.', '$\cos = \frac{9}{3 \cdot 3\sqrt2}$, $45^\circ$.'], answer: '45°' }
        src: b291
      - type: single
        cat: theory
        q: 'В каких пределах лежит угол между векторами?'
        opts: ['от $0^\circ$ до $180^\circ$', 'от $0^\circ$ до $90^\circ$', 'от $0^\circ$ до $360^\circ$', 'от $-90^\circ$ до $90^\circ$']
        ans: a
        hint: 'Арккосинус.'
        explain: 'Значения $\arccos$ лежат в $[0; \pi]$.'
        f: [1]
        src: b289
      - type: single
        cat: theory
        q: 'Векторы $(2; 4)$ и $(1; 2)$. Угол между ними…'
        opts: ['$0^\circ$', '$90^\circ$', '$180^\circ$', '$45^\circ$']
        ans: a
        hint: 'Они сонаправлены.'
        explain: '$(2; 4) = 2(1; 2)$, $\cos\varphi = 1$.'
        f: [1]
        src: b289
