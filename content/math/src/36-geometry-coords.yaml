  - id: ma-3-8
    subsection: ma-3-8
    num: '3.8'
    title: Система координат
    pages: [b282, b283, b284]
    book:
      place: 'Ч. 2, раздел «Геометрия», пункт 3.8'
      summary: 'Задания на расстояние между точками, координаты середины отрезка, уравнение окружности, периметры и площади фигур по координатам вершин.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*ca-21]
    theory:
      - kind: law
        title: Расстояние и середина отрезка
        body: |
          Для точек $A(x_1; y_1)$ и $B(x_2; y_2)$:
          - $AB = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$ (теорема Пифагора);
          - середина $M\left(\frac{x_1 + x_2}{2}; \frac{y_1 + y_2}{2}\right)$.
          В пространстве добавляется третья координата $z$.
        src: b282
      - kind: definition
        title: Уравнение окружности
        body: |
          Окружность с центром $(a; b)$ и радиусом $R$: $(x - a)^2 + (y - b)^2 = R^2$.
          Уравнение вида $x^2 + y^2 + px + qy + c = 0$ приводят к этому виду выделением полных квадратов.
        src: b283
    formulas:
      - title: Расстояние между точками
        tex: 'AB = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}'
        meaning: '$A(x_1; y_1)$, $B(x_2; y_2)$.'
        use: 'Длины отрезков, периметры.'
        src: b282
      - title: Середина отрезка
        tex: 'M = \left(\frac{x_1 + x_2}{2};\ \frac{y_1 + y_2}{2}\right)'
        meaning: '$M$ — середина $AB$.'
        use: 'Середины, медианы, центр симметрии.'
        src: b282
      - title: Уравнение окружности
        tex: '(x - a)^2 + (y - b)^2 = R^2'
        meaning: '$(a; b)$ — центр, $R$ — радиус.'
        use: 'Центр и радиус по уравнению.'
        src: b283
    examples:
      - title: Расстояние
        given: 'Найдите расстояние между $A(1; 2)$ и $B(4; 6)$.'
        find: '$AB$.'
        method: 'Формула расстояния.'
        steps:
          - '$\sqrt{3^2 + 4^2}$.'
          - '$= 5$.'
        check: 'Прямоугольный треугольник 3, 4, 5 ✓.'
        answer: '$5$'
        src: b282
      - title: Середина
        given: 'Найдите середину отрезка с концами $(-2; 3)$ и $(6; -1)$.'
        find: '$M$.'
        method: 'Полусуммы координат.'
        steps:
          - '$x = \frac{-2 + 6}{2} = 2$.'
          - '$y = \frac{3 - 1}{2} = 1$.'
        check: 'Расстояния от $M$ до концов равны $\sqrt{32}$ ✓.'
        answer: '$(2; 1)$'
        src: b282
      - title: Окружность
        given: 'Окружность с центром $(1; -2)$ проходит через $(4; 2)$. Найдите радиус и уравнение.'
        find: '$R$, уравнение.'
        method: 'Радиус — расстояние до центра.'
        steps:
          - '$R = \sqrt{9 + 16} = 5$.'
          - '$(x - 1)^2 + (y + 2)^2 = 25$.'
        check: '$(4 - 1)^2 + (2 + 2)^2 = 25$ ✓.'
        answer: '$R = 5$'
        src: b283
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите расстояние от начала координат до точки $(6; 8)$.'
        num: { value: 10, unit: '', check: 'Math.hypot(6,8)' }
        hint: '$\sqrt{36 + 64}$.'
        explain: '$10$.'
        f: [1]
        sol: { method: 'Формула расстояния.', steps: ['$\sqrt{36 + 64} = 10$.'], answer: '10' }
        src: b282
      - type: numeric
        cat: problem
        q: 'Найдите абсциссу середины отрезка с концами $(3; 7)$ и $(-5; 1)$.'
        num: { value: -1, unit: '', check: '(3-5)/2' }
        hint: 'Полусумма абсцисс.'
        explain: '$-1$.'
        f: [2]
        sol: { method: 'Середина отрезка.', steps: ['$\frac{3 - 5}{2} = -1$.'], answer: '−1' }
        src: b282
      - type: numeric
        cat: problem
        q: 'Найдите радиус окружности $x^2 + y^2 - 6x + 8y = 0$.'
        num: { value: 5, unit: '', check: 'Math.sqrt(9+16)' }
        hint: 'Выделите полные квадраты.'
        explain: '$(x - 3)^2 + (y + 4)^2 = 25$.'
        f: [3]
        sol: { method: 'Полные квадраты.', steps: ['$(x - 3)^2 - 9 + (y + 4)^2 - 16 = 0$.', '$R^2 = 25$, $R = 5$.'], answer: '5' }
        src: b283
      - type: numeric
        cat: problem
        q: '$M(4; 1)$ — середина отрезка $AB$, $A(2; 5)$. Найдите ординату точки $B$.'
        num: { value: -3, unit: '', check: '2*1-5' }
        hint: '$y_B = 2y_M - y_A$.'
        explain: '$2 - 5 = -3$.'
        f: [2]
        sol: { method: 'Середина отрезка.', steps: ['$y_B = 2 \cdot 1 - 5 = -3$.'], answer: '−3' }
        src: b282
      - type: numeric
        cat: problem
        q: 'Найдите периметр треугольника с вершинами $(0; 0)$, $(3; 0)$, $(0; 4)$.'
        num: { value: 12, unit: '', check: '3+4+5' }
        hint: 'Гипотенуза 5.'
        explain: '$3 + 4 + 5 = 12$.'
        f: [1]
        sol: { method: 'Длины сторон.', steps: ['$3$, $4$, $\sqrt{9 + 16} = 5$.', '$P = 12$.'], answer: '12' }
        src: b283
      - type: numeric
        cat: problem
        q: 'Найдите площадь треугольника с вершинами $(0; 0)$, $(4; 0)$, $(0; 6)$.'
        num: { value: 12, unit: '', check: '4*6/2' }
        hint: 'Прямоугольный треугольник.'
        explain: '$\frac{4 \cdot 6}{2} = 12$.'
        sol: { method: 'Площадь по катетам.', steps: ['$\frac12 \cdot 4 \cdot 6 = 12$.'], answer: '12' }
        src: b283
      - type: single
        cat: theory
        q: 'Центр окружности $(x + 2)^2 + (y - 3)^2 = 16$:'
        opts: ['$(-2; 3)$', '$(2; -3)$', '$(2; 3)$', '$(-2; -3)$']
        ans: a
        hint: '$(x - a)^2$ — центр $a$.'
        explain: '$x + 2 = x - (-2)$.'
