        hint: '$|k| \cdot |\vec a|$.'
        explain: '$6$.'
        f: [2]
        sol: { method: 'Длина произведения.', steps: ['$|-2| \cdot 3 = 6$.'], answer: '6' }
        src: b286
      - type: numeric
