        sol: { method: 'Порядок действий; перевод в дроби.', steps: ['$2\frac12 = \frac52$, $\left(\frac52\right)^2 = \frac{25}{4}$.', '$1\frac14 = \frac54$; $\frac{25 - 5}{4} = 5$.'], answer: '5' }
        src: b014
      - type: numeric
