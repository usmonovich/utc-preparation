  # ───────────────────────────── 1.2.3 ─────────────────────────────
  - id: ma-1-2-3
    num: '1.2.3'
    title: Десятичные дроби
    pages: [b016, b017, b018, b019, b020]
    book:
      place: 'Ч. 1, 1.2 «Дроби», пункт 1.2.3'
      summary: 'Задания на вычисления с десятичными дробями, выражения, где встречаются и десятичные, и обыкновенные дроби, сравнение чисел, запись числа в стандартном виде.'
    stage: verified
    stageNote: 'Ответы пересчитаны независимыми выражениями (с учётом погрешности двоичной арифметики).'
    sourcesChecked: '2026-10-24'
    web: [*os-52, *os-53, *lt-sci]
    theory:
      - kind: definition
        title: Десятичная дробь
        body: 'Десятичная дробь — дробь со знаменателем $10, 100, 1000, \dots$, записанная через запятую: $0{,}375 = \frac{375}{1000}$, $2{,}07 = 2\frac{7}{100}$. Цифры после запятой — десятые, сотые, тысячные и т. д. Нули в конце дробной части можно дописывать и отбрасывать: $1{,}5 = 1{,}50$.'
        src: b016
      - kind: rule
        title: Сложение, вычитание, умножение
        body: |
          - **Сложение и вычитание:** записать числа запятая под запятой (уравнять число знаков нулями) и действовать как с целыми.
          - **Умножение:** перемножить как целые числа, затем отделить запятой столько знаков, сколько их у обоих множителей вместе: $2{,}4 \cdot 0{,}35$: $24 \cdot 35 = 840$, знаков $1 + 2 = 3$ — получаем $0{,}840 = 0{,}84$.
          - **Умножение на $10^n$** — перенос запятой на $n$ знаков вправо; деление на $10^n$ (умножение на $0{,}1$, $0{,}01$, …) — влево.
        src: b016
      - kind: rule
        title: Деление
        body: |
          - На целое число — делим «уголком», ставя запятую в частном, когда закончилась целая часть делимого.
          - На десятичную дробь — переносим запятую в делителе и делимом **на одно и то же** число знаков вправо, чтобы делитель стал целым: $7{,}56 : 0{,}18 = 756 : 18 = 42$.
        src: b017
      - kind: text
        title: Смешанные выражения и стандартный вид числа
        body: |
          - Если в выражении есть и десятичные, и обыкновенные дроби, переводят всё в один вид: в десятичные — если знаменатели дробей дают конечные десятичные ($\frac38 = 0{,}375$), иначе — в обыкновенные ($0{,}25 = \frac14$).
          - **Стандартный вид** числа: $a \cdot 10^n$, где $1 \le a < 10$, $n$ — целое. Запятую ставят после первой значащей цифры, $n$ — на сколько знаков её перенесли (вправо — $n$ отрицательный, влево — положительный): $52\,300 = 5{,}23 \cdot 10^4$, $0{,}000452 = 4{,}52 \cdot 10^{-4}$.
        src: b018
    formulas:
      - title: Десятичная дробь как обыкновенная
        tex: '0{,}a_1a_2\ldots a_n = \frac{\overline{a_1a_2\ldots a_n}}{10^n}'
        meaning: '$a_1, \dots, a_n$ — цифры после запятой, $n$ — их количество.'
        use: 'Перевести десятичную дробь в обыкновенную (затем сократить): $0{,}375 = \frac{375}{1000} = \frac38$.'
        src: b016
      - title: Деление на десятичную дробь
        tex: 'a : b = (a \cdot 10^k) : (b \cdot 10^k)'
        meaning: '$k$ — число знаков после запятой у делителя $b$.'
        use: 'Сделать делитель целым, не меняя частного.'
        src: b017
      - title: Стандартный вид числа
        tex: 'x = a \cdot 10^n,\qquad 1 \le a < 10,\ n \in \mathbb{Z}'
        meaning: '$a$ — мантисса (одна ненулевая цифра до запятой), $n$ — порядок числа.'
        use: 'Запись очень больших и очень малых чисел, сравнение порядков, ответы в тестах «запишите в стандартном виде».'
        limits: 'Для отрицательных чисел: $-x = -a \cdot 10^n$; число $0$ в стандартном виде не записывается.'
        src: b018
    examples:
      - title: Выражение с десятичными дробями
        given: 'Вычислите $(0{,}48 \cdot 2{,}5 - 0{,}6) : 0{,}15$.'
        find: 'значение выражения.'
        method: 'Порядок действий: в скобках умножение, затем вычитание, затем деление (перенос запятой).'
        steps:
          - '$0{,}48 \cdot 2{,}5$: $48 \cdot 25 = 1200$, знаков $2 + 1 = 3$ — $1{,}200 = 1{,}2$.'
          - '$1{,}2 - 0{,}6 = 0{,}6$.'
          - '$0{,}6 : 0{,}15 = 60 : 15 = 4$.'
        check: '$4 \cdot 0{,}15 = 0{,}6$, и $0{,}6 + 0{,}6 = 1{,}2 = 0{,}48 \cdot 2{,}5$.'
        answer: '$4$'
        src: b016
      - title: Стандартный вид
        given: 'Запишите в стандартном виде числа $52\,300$ и $0{,}000452$.'
        find: 'запись $a \cdot 10^n$.'
        method: 'Ставим запятую после первой значащей цифры и считаем, на сколько знаков её перенесли.'
        steps:
          - '$52\,300 = 5{,}23 \cdot 10\,000$: запятая перенесена на 4 знака влево — $5{,}23 \cdot 10^4$.'
          - '$0{,}000452$: первая значащая цифра 4; запятая перенесена на 4 знака вправо — $4{,}52 \cdot 10^{-4}$.'
        check: '$5{,}23 \cdot 10^4 = 52\,300$; $4{,}52 \cdot 10^{-4} = 0{,}000452$.'
        answer: '$5{,}23 \cdot 10^4$; $4{,}52 \cdot 10^{-4}$'
        src: b018
      - title: Десятичные и обыкновенные дроби вместе
        given: 'Вычислите $0{,}125 + \frac38 \cdot 0{,}4$.'
        find: 'значение выражения.'
        method: 'Знаменатель 8 даёт конечную десятичную дробь — переводим всё в десятичные.'
        steps:
          - '$\frac38 = 0{,}375$.'
          - '$0{,}375 \cdot 0{,}4 = 0{,}15$.'
          - '$0{,}125 + 0{,}15 = 0{,}275$.'
        check: 'В обыкновенных дробях: $\frac18 + \frac38 \cdot \frac25 = \frac18 + \frac{3}{20} = \frac{5 + 6}{40} = \frac{11}{40} = 0{,}275$.'
        answer: '$0{,}275$'
        src: b016
    questions:
      - type: numeric
        cat: problem
        q: 'Вычислите $2{,}4 \cdot 0{,}35$.'
        num: { value: 0.84, unit: '', check: '24*35/1000' }
        hint: 'Перемножьте как целые и отделите три знака.'
        explain: '$24 \cdot 35 = 840$, три знака после запятой: $0{,}840 = 0{,}84$.'
        sol: { method: 'Умножение десятичных дробей.', steps: ['$24 \cdot 35 = 840$.', 'Знаков после запятой $1 + 2 = 3$: $0{,}840$.'], answer: '0,84' }
        src: b016
      - type: numeric
        cat: problem
        q: 'Вычислите $7{,}56 : 0{,}18$.'
        num: { value: 42, unit: '', check: '756/18' }
        hint: 'Перенесите запятую в обоих числах на два знака вправо.'
        explain: '$756 : 18 = 42$.'
        f: [2]
        sol: { method: 'Сделать делитель целым.', steps: ['$7{,}56 : 0{,}18 = 756 : 18$.', '$18 \cdot 42 = 756$.'], answer: '42' }
        src: b017
      - type: numeric
        cat: problem
        q: 'Вычислите $(3{,}2 - 1{,}75) \cdot 4$.'
        num: { value: 5.8, unit: '', check: '(320-175)*4/100' }
        hint: 'Уравняйте число знаков: $3{,}20 - 1{,}75$.'
        explain: '$1{,}45 \cdot 4 = 5{,}8$.'
        sol: { method: 'Порядок действий.', steps: ['$3{,}20 - 1{,}75 = 1{,}45$.', '$1{,}45 \cdot 4 = 5{,}80$.'], answer: '5,8' }
        src: b016
      - type: numeric
        cat: problem
        q: 'Вычислите $0{,}25 \cdot 0{,}4 + 1{,}2 : 0{,}3$.'
        num: { value: 4.1, unit: '', check: '25*4/1000+12/3' }
        hint: 'Сначала умножение и деление, затем сложение.'
        explain: '$0{,}1 + 4 = 4{,}1$.'
        sol: { method: 'Порядок действий.', steps: ['$0{,}25 \cdot 0{,}4 = 0{,}1$.', '$1{,}2 : 0{,}3 = 12 : 3 = 4$.', '$0{,}1 + 4 = 4{,}1$.'], answer: '4,1' }
        src: b016
      - type: numeric
        cat: problem
        q: 'Вычислите $1{,}5 : 0{,}03 - 0{,}7 \cdot 20$.'
        num: { value: 36, unit: '', check: '150/3-14' }
        hint: '$1{,}5 : 0{,}03 = 150 : 3$.'
        explain: '$50 - 14 = 36$.'
        sol: { method: 'Перенос запятой при делении.', steps: ['$1{,}5 : 0{,}03 = 150 : 3 = 50$.', '$0{,}7 \cdot 20 = 14$.', '$50 - 14 = 36$.'], answer: '36' }
        src: b017
      - type: single
        cat: problem
        q: 'Как записать число $0{,}0072$ в стандартном виде?'
        opts: ['$7{,}2 \cdot 10^{-3}$', '$72 \cdot 10^{-4}$', '$0{,}72 \cdot 10^{-2}$', '$7{,}2 \cdot 10^{3}$']
        ans: a
        hint: 'В стандартном виде $1 \le a < 10$.'
        explain: 'Запятая переносится на 3 знака вправо: $7{,}2 \cdot 10^{-3}$. Варианты $72 \cdot 10^{-4}$ и $0{,}72 \cdot 10^{-2}$ равны этому числу, но не в стандартном виде.'
        f: [3]
        sol: { method: 'Определение стандартного вида.', steps: ['Первая значащая цифра 7: $a = 7{,}2$.', 'Запятую перенесли на 3 знака вправо — $n = -3$.'], answer: '7,2·10⁻³' }
        src: b018
      - type: single
        cat: problem
        q: 'Какой обыкновенной дроби равно $0{,}375$?'
        opts: ['$\frac38$', '$\frac37$', '$\frac58$', '$\frac{375}{100}$']
        ans: a
        hint: '$0{,}375 = \frac{375}{1000}$ — сократите.'
        explain: '$\frac{375}{1000} = \frac{3 \cdot 125}{8 \cdot 125} = \frac38$.'
        f: [1]
        sol: { method: 'Перевод в обыкновенную дробь и сокращение.', steps: ['$0{,}375 = \frac{375}{1000}$.', '$\text{НОД}(375, 1000) = 125$: $\frac38$.'], answer: '3/8' }
        src: b016
      - type: single
        cat: theory
        q: 'Как изменится запись числа при умножении на $0{,}01$?'
        opts: ['запятая перенесётся на два знака влево', 'запятая перенесётся на два знака вправо', 'запятая перенесётся на один знак влево', 'запись не изменится']
        ans: a
        hint: '$0{,}01 = \frac{1}{100}$.'
        explain: 'Умножить на $0{,}01$ — значит разделить на 100: запятая переносится на два знака влево ($35{,}2 \cdot 0{,}01 = 0{,}352$).'
        src: b016

  # ───────────────────────────── 1.2.4 ─────────────────────────────
  - id: ma-1-2-4
    num: '1.2.4'
    title: Бесконечные периодические десятичные дроби
    pages: [b020, b021, b022]
    book:
      place: 'Ч. 1, 1.2 «Дроби», пункт 1.2.4'
      summary: 'Задания: какому числу равна периодическая дробь вида $0{,}(2)$, $0{,}(5)$; какие обыкновенные дроби нельзя записать конечной десятичной дробью; сравнение чисел, заданных периодическими дробями.'
    stage: verified
    stageNote: 'Признак конечности и формулы перевода проверены перебором всех дробей со знаменателем до 200; ответы пересчитаны.'
    sourcesChecked: '2026-10-24'
    web: [*mo, *duje, *os-53]
    theory:
      - kind: definition
        title: Периодическая дробь
        fig: periodic-division
        body: |
          При делении числителя на знаменатель остатки могут повторяться — тогда цифры частного повторяются бесконечно. Повторяющуюся группу цифр называют **периодом** и пишут в скобках:
          $\frac13 = 0{,}333\ldots = 0{,}(3)$, $\ \frac{1}{6} = 0{,}1666\ldots = 0{,}1(6)$, $\ \frac{3}{11} = 0{,}2727\ldots = 0{,}(27)$.
          Дробь **чисто периодическая**, если период начинается сразу после запятой, и **смешанная**, если перед периодом есть другие цифры (как у $0{,}1(6)$).
        src: b020
      - kind: law
        title: Когда дробь конечная, а когда периодическая
        body: |
          Любое рациональное число записывается конечной или бесконечной периодической десятичной дробью. Для **несократимой** дроби $\frac{p}{q}$:
          - запись **конечна** тогда и только тогда, когда в разложении $q$ нет простых множителей, кроме 2 и 5;
          - запись **чисто периодическая**, если $q$ не делится ни на 2, ни на 5;
          - иначе — смешанная периодическая.

          **Сначала сократите дробь!** $\frac{9}{75}$ выглядит «плохой» (75 делится на 3), но $\frac{9}{75} = \frac{3}{25}$ — конечная: $0{,}12$.
        src: b020
      - kind: rule
        title: Перевод периодической дроби в обыкновенную
        body: |
          - **Чистая:** период делится на число из стольких девяток, сколько цифр в периоде: $0{,}(27) = \frac{27}{99} = \frac{3}{11}$, $0{,}(5) = \frac59$.
          - **Смешанная:** из числа, записанного цифрами до конца первого периода, вычесть число, записанное цифрами до периода; в знаменателе — столько девяток, сколько цифр в периоде, и столько нулей, сколько цифр между запятой и периодом: $0{,}2(3) = \frac{23 - 2}{90} = \frac{21}{90} = \frac{7}{30}$.

          Почему это так: если $x = 0{,}(27)$, то $100x = 27{,}(27)$, и $100x - x = 27$, откуда $x = \frac{27}{99}$.
        src: b020
      - kind: note
        title: Частный случай 0,(9)
        body: '$0{,}(9) = \frac{9}{9} = 1$: это не «почти единица», а другая запись числа 1. Аналогично $0{,}4(9) = 0{,}5$.'
        src: b020
    formulas:
      - title: Чисто периодическая дробь
        tex: '0{,}(a_1 a_2 \ldots a_t) = \frac{\overline{a_1 a_2 \ldots a_t}}{\underbrace{99\ldots9}_{t}}'
        meaning: '$\overline{a_1 \ldots a_t}$ — число, записанное цифрами периода, $t$ — длина периода.'
        use: 'Перевести чисто периодическую дробь в обыкновенную.'
        src: b020
      - title: Смешанная периодическая дробь
        tex: '0{,}b_1\ldots b_s(a_1\ldots a_t) = \frac{\overline{b_1\ldots b_s a_1\ldots a_t} - \overline{b_1\ldots b_s}}{\underbrace{9\ldots9}_{t}\underbrace{0\ldots0}_{s}}'
        meaning: '$b_1, \dots, b_s$ — цифры до периода ($s$ штук), $a_1, \dots, a_t$ — цифры периода ($t$ штук).'
        use: 'Перевести смешанную периодическую дробь в обыкновенную; целую часть числа прибавить отдельно.'
        src: b020
      - title: Признак конечной десятичной дроби
        tex: 'q = 2^m \cdot 5^n,\quad m, n \ge 0'
        meaning: '$\frac{p}{q}$ — несократимая дробь; она записывается конечной десятичной дробью тогда и только тогда, когда знаменатель имеет такой вид ($m, n$ — целые показатели).'
        use: 'Определить, какие дроби нельзя записать конечной десятичной дробью (частое задание книги).'
        limits: 'Только для несократимой дроби — сократите её перед проверкой.'
        src: b020
    examples:
      - title: Чисто периодическая дробь
        given: 'Запишите $0{,}(27)$ в виде обыкновенной дроби.'
        find: 'обыкновенную дробь.'
        method: 'Формула чисто периодической дроби: период из двух цифр — делим на 99.'
        steps:
          - '$0{,}(27) = \frac{27}{99}$.'
          - '$\text{НОД}(27, 99) = 9$: $\frac{27}{99} = \frac{3}{11}$.'
        check: '$3 : 11 = 0{,}2727\ldots$'
        answer: '$\frac{3}{11}$'
        src: b020
      - title: Смешанная периодическая дробь с целой частью
        given: 'Запишите $1{,}2(3)$ в виде обыкновенной дроби.'
        find: 'обыкновенную дробь.'
        method: 'Целую часть отделяем; дробную переводим по формуле смешанной периодической дроби ($s = 1$, $t = 1$).'
        steps:
          - '$1{,}2(3) = 1 + 0{,}2(3)$.'
          - '$0{,}2(3) = \frac{23 - 2}{90} = \frac{21}{90} = \frac{7}{30}$.'
          - '$1 + \frac{7}{30} = \frac{37}{30}$.'
        check: '$37 : 30 = 1{,}2333\ldots$'
        answer: '$\frac{37}{30}$'
        src: b020
      - title: Какие дроби конечные
        given: 'Какие из дробей $\frac{7}{40}$, $\frac{5}{24}$, $\frac{9}{75}$, $\frac{11}{80}$ записываются конечной десятичной дробью?'
        find: 'конечные дроби.'
        method: 'Сократить дробь и разложить знаменатель на простые множители: допустимы только 2 и 5.'
        steps:
          - '$\frac{7}{40}$: $40 = 2^3 \cdot 5$ — конечная ($0{,}175$).'
          - '$\frac{5}{24}$: $24 = 2^3 \cdot 3$ — есть множитель 3, периодическая ($0{,}208(3)$).'
          - '$\frac{9}{75} = \frac{3}{25}$, $25 = 5^2$ — конечная ($0{,}12$).'
          - '$\frac{11}{80}$: $80 = 2^4 \cdot 5$ — конечная ($0{,}1375$).'
        check: 'Деление на калькуляторе: $0{,}175$; $0{,}208333\ldots$; $0{,}12$; $0{,}1375$.'
        answer: '$\frac{7}{40}$, $\frac{9}{75}$, $\frac{11}{80}$'
        src: b020
