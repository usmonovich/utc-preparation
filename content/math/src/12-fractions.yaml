        sol: { method: 'Умножение через неправильные дроби.', steps: ['$2\frac13 = \frac73$, $1\frac27 = \frac97$.', '$\frac{7 \cdot 9}{3 \cdot 7} = \frac93 = 3$.'], answer: '3' }
