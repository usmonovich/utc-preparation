topics:
  # ───────────────────────────── 1.2.1 ─────────────────────────────
  - id: ma-1-2-1
    num: '1.2.1'
    title: Обыкновенные дроби
    pages: [b010, b011, b012, b013, b014]
    book:
      place: 'Ч. 1, 1.2 «Дроби», пункт 1.2.1'
      summary: 'В начале пункта книга выписывает правила действий с дробями: смена знаков, разбиение дроби на сумму, сложение с одинаковыми и разными знаменателями, умножение и деление. Задания: вычисление «многоэтажных» выражений, суммы вида $\frac{2}{5 \cdot 7} + \frac{2}{7 \cdot 9} + \dots$, наименьшее число, делящееся нацело на несколько дробей.'
    stage: verified
    stageNote: 'Ответы пересчитаны точной арифметикой дробей; тождество разложения на разность дробей проверено перебором.'
    sourcesChecked: '2026-10-24'
    web: [*os-42, *os-45]
    theory:
      - kind: definition
        title: Дробь, основное свойство
        body: |
          - Запись $\frac{a}{b}$ ($b \ne 0$) — **обыкновенная дробь**: $a$ — числитель, $b$ — знаменатель; черта дроби означает деление $a : b$.
          - Дробь **правильная**, если $|a| < |b|$, и **неправильная** иначе.
          - **Основное свойство:** $\frac{a}{b} = \frac{am}{bm}$ при $m \ne 0$. Деление числителя и знаменателя на их общий делитель — **сокращение**; дробь **несократима**, если $\text{НОД}(a, b) = 1$.
        src: b010
      - kind: rule
        title: Сложение и вычитание
        fig: fraction-add
        body: |
          1. Найти **общий знаменатель** — удобнее всего НОК знаменателей.
          2. Домножить числитель и знаменатель каждой дроби на недостающий множитель.
          3. Сложить (вычесть) числители, знаменатель оставить.
          4. Сократить результат.

          Ошибка: $\frac{a}{b} + \frac{c}{d} \ne \frac{a + c}{b + d}$ — например, $\frac12 + \frac12 = 1$, а не $\frac24$.
        src: b010
      - kind: rule
        title: Умножение и деление
        body: |
          - Умножение: $\frac{a}{b} \cdot \frac{c}{d} = \frac{ac}{bd}$ (общий знаменатель не нужен; до перемножения выгодно сократить крест-накрест).
          - Деление — умножение на **обратную** дробь: $\frac{a}{b} : \frac{c}{d} = \frac{a}{b} \cdot \frac{d}{c} = \frac{ad}{bc}$ ($c \ne 0$).
          - Знаки: $\frac{-a}{-b} = \frac{a}{b}$, $\frac{-a}{b} = \frac{a}{-b} = -\frac{a}{b}$.
        src: b010
      - kind: text
        title: 'Суммы вида 1/(n(n+k)): разность дробей'
        body: |
          Дробь с произведением в знаменателе раскладывается на разность: $\frac{k}{n(n + k)} = \frac{1}{n} - \frac{1}{n + k}$. Тогда в длинной сумме почти все слагаемые сокращаются («телескопическая» сумма):
          $\frac{1}{1 \cdot 2} + \frac{1}{2 \cdot 3} + \dots + \frac{1}{99 \cdot 100} = \left(1 - \frac12\right) + \left(\frac12 - \frac13\right) + \dots + \left(\frac{1}{99} - \frac{1}{100}\right) = 1 - \frac{1}{100}$.
        src: b011
      - kind: note
        title: Деление числа на дробь «нацело»
        body: 'Число $x$ делится на несократимую дробь $\frac{p}{q}$ нацело, если $x : \frac{p}{q} = \frac{xq}{p}$ — целое. Так как $\text{НОД}(p, q) = 1$, это значит, что $x$ делится на $p$. Наименьшее натуральное $x$, делящееся нацело на несколько несократимых дробей, — НОК их числителей.'
        src: b011
    formulas:
      - title: Основное свойство дроби
        tex: '\frac{a}{b} = \frac{am}{bm},\qquad b \ne 0,\ m \ne 0'
        meaning: '$a$ — числитель, $b$ — знаменатель, $m$ — любой ненулевой множитель.'
        use: 'Сократить дробь (разделить на общий делитель) или привести к общему знаменателю (домножить).'
        src: b010
      - title: Сложение дробей
        tex: '\frac{a}{b} + \frac{c}{d} = \frac{ad + bc}{bd}'
        meaning: '$b, d \ne 0$ — знаменатели.'
        use: 'Общая формула; на практике знаменатель $bd$ заменяют на $\text{НОК}(b, d)$, чтобы числа были меньше.'
        variants: 'С одинаковыми знаменателями: $\frac{a}{c} + \frac{b}{c} = \frac{a + b}{c}$; разность: $\frac{a}{b} - \frac{c}{d} = \frac{ad - bc}{bd}$.'
        src: b010
      - title: Умножение и деление дробей
        tex: '\frac{a}{b} \cdot \frac{c}{d} = \frac{ac}{bd},\qquad \frac{a}{b} : \frac{c}{d} = \frac{ad}{bc}'
        meaning: '$b, d \ne 0$; при делении также $c \ne 0$.'
        use: 'Умножение — числитель на числитель, знаменатель на знаменатель; деление — умножить на перевёрнутую дробь.'
        variants: 'Целое число: $c \cdot \frac{a}{b} = \frac{ca}{b}$, $\ \frac{a}{b} : c = \frac{a}{bc}$.'
        src: b010
      - title: Разложение на разность дробей
        tex: '\frac{k}{n(n + k)} = \frac{1}{n} - \frac{1}{n + k}'
        meaning: '$n \ne 0$, $n + k \ne 0$, $k$ — разность множителей знаменателя.'
        use: 'Суммы дробей с произведениями соседних (или отстоящих на $k$) чисел в знаменателе: слагаемые попарно сокращаются.'
        variants: 'Если числитель не равен $k$: $\frac{1}{n(n + k)} = \frac{1}{k}\left(\frac{1}{n} - \frac{1}{n + k}\right)$.'
        src: b011
    examples:
      - title: Сумма дробей с разными знаменателями
        given: 'Вычислите $\frac{5}{12} + \frac{7}{18} - \frac{1}{4}$.'
        find: 'значение выражения.'
        method: 'Общий знаменатель — $\text{НОК}(12, 18, 4)$.'
        steps:
          - '$12 = 2^2 \cdot 3$, $18 = 2 \cdot 3^2$, $4 = 2^2$; $\text{НОК} = 2^2 \cdot 3^2 = 36$.'
          - '$\frac{5}{12} = \frac{15}{36}$, $\frac{7}{18} = \frac{14}{36}$, $\frac14 = \frac{9}{36}$.'
          - '$\frac{15 + 14 - 9}{36} = \frac{20}{36} = \frac{5}{9}$.'
        check: '$0{,}4166\ldots + 0{,}3888\ldots - 0{,}25 = 0{,}5555\ldots = \frac59$.'
        answer: '$\frac{5}{9}$'
        src: b010
      - title: Телескопическая сумма
        given: 'Вычислите $\frac{2}{3 \cdot 5} + \frac{2}{5 \cdot 7} + \frac{2}{7 \cdot 9} + \dots + \frac{2}{19 \cdot 21}$.'
        find: 'сумму.'
        method: 'В каждом знаменателе множители отличаются на 2 и числитель равен 2 — раскладываем $\frac{2}{n(n + 2)} = \frac1n - \frac{1}{n + 2}$.'
        steps:
          - '$\left(\frac13 - \frac15\right) + \left(\frac15 - \frac17\right) + \dots + \left(\frac{1}{19} - \frac{1}{21}\right)$.'
          - 'Все промежуточные дроби сокращаются, остаются первая и последняя: $\frac13 - \frac{1}{21}$.'
          - '$\frac{7}{21} - \frac{1}{21} = \frac{6}{21} = \frac27$.'
        check: 'Сложение девяти дробей на компьютере в точной арифметике даёт $\frac27$.'
        answer: '$\frac{2}{7}$'
        src: b011
      - title: Наименьшее число, делящееся нацело на дроби
        given: 'Найдите наименьшее натуральное число, при делении которого на каждую из дробей $\frac49$, $\frac67$, $\frac{10}{11}$ получается целое число.'
        find: 'наименьшее натуральное $x$.'
        method: 'Дроби несократимы, поэтому $x : \frac{p}{q} = \frac{xq}{p}$ — целое, когда $x$ делится на $p$. Нужно НОК числителей.'
        steps:
          - '$x$ должно делиться на 4, на 6 и на 10.'
          - '$\text{НОК}(4, 6, 10) = 2^2 \cdot 3 \cdot 5 = 60$.'
        check: '$60 : \frac49 = 135$, $60 : \frac67 = 70$, $60 : \frac{10}{11} = 66$ — все целые.'
        answer: '$60$'
        src: b011
    questions:
      - type: numeric
        cat: problem
        q: 'Вычислите $\frac34 + \frac56 - \frac{7}{12}$.'
        num: { value: 1, unit: '', check: '3/4+5/6-7/12' }
        hint: 'Общий знаменатель — 12.'
        explain: '$\frac{9}{12} + \frac{10}{12} - \frac{7}{12} = \frac{12}{12} = 1$.'
        sol: { method: 'Привести к общему знаменателю $\text{НОК}(4, 6, 12) = 12$.', steps: ['$\frac34 = \frac{9}{12}$, $\frac56 = \frac{10}{12}$.', '$\frac{9 + 10 - 7}{12} = \frac{12}{12} = 1$.'], answer: '1' }
        src: b010
      - type: numeric
        cat: problem
        q: 'Вычислите $\frac56 \cdot \frac{9}{10} : \frac38$.'
        num: { value: 2, unit: '', check: '5/6*9/10/(3/8)' }
        hint: 'Деление на $\frac38$ — умножение на $\frac83$. Действия слева направо.'
        explain: '$\frac56 \cdot \frac{9}{10} = \frac34$; $\frac34 \cdot \frac83 = 2$.'
        sol: { method: 'Умножение дробей с сокращением, деление через обратную дробь.', steps: ['$\frac{5 \cdot 9}{6 \cdot 10} = \frac{45}{60} = \frac34$.', '$\frac34 : \frac38 = \frac34 \cdot \frac83 = \frac{24}{12} = 2$.'], answer: '2' }
        src: b010
      - type: numeric
        cat: problem
        q: 'Вычислите $\frac{1}{1 \cdot 2} + \frac{1}{2 \cdot 3} + \frac{1}{3 \cdot 4} + \dots + \frac{1}{99 \cdot 100}$. Ответ запишите десятичной дробью.'
        num: { value: 0.99, unit: '', check: 'Array.from({length:99},(_,i)=>1/((i+1)*(i+2))).reduce((a,b)=>a+b)' }
        hint: '$\frac{1}{n(n + 1)} = \frac1n - \frac{1}{n + 1}$.'
        explain: 'Сумма равна $1 - \frac{1}{100} = 0{,}99$.'
        f: [4]
        sol: { method: 'Телескопическая сумма.', steps: ['$\left(1 - \frac12\right) + \left(\frac12 - \frac13\right) + \dots + \left(\frac{1}{99} - \frac{1}{100}\right)$.', 'Остаются $1 - \frac{1}{100} = \frac{99}{100} = 0{,}99$.'], answer: '0,99' }
        src: b011
      - type: numeric
        cat: problem
        q: 'Найдите $x$, если $x : \frac23 = \frac34$. Ответ запишите десятичной дробью.'
        num: { value: 0.5, unit: '', check: '3/4*2/3' }
        hint: 'Неизвестное делимое равно делителю, умноженному на частное.'
        explain: '$x = \frac34 \cdot \frac23 = \frac12 = 0{,}5$.'
        sol: { method: 'Делимое = делитель · частное.', steps: ['$x = \frac34 \cdot \frac23$.', '$\frac{3 \cdot 2}{4 \cdot 3} = \frac{6}{12} = \frac12$.'], check: '$\frac12 : \frac23 = \frac12 \cdot \frac32 = \frac34$.', answer: '0,5' }
        src: b010
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее натуральное число, которое делится нацело на каждую из дробей $\frac23$ и $\frac45$ (частные — целые числа).'
        num: { value: 4, unit: '', check: '[...Array(100).keys()].find(x=>x>0&&Number.isInteger(x*3/2)&&Number.isInteger(x*5/4))' }
        hint: 'Дроби несократимы — число должно делиться на их числители.'
        explain: '$\text{НОК}(2, 4) = 4$: $4 : \frac23 = 6$, $4 : \frac45 = 5$.'
        sol: { method: 'НОК числителей несократимых дробей.', steps: ['$x : \frac23 = \frac{3x}{2}$ — целое при чётном $x$.', '$x : \frac45 = \frac{5x}{4}$ — целое, когда $x$ кратно 4.', 'Наименьшее: $x = 4$.'], answer: '4' }
        src: b011
      - type: single
        cat: problem
        q: 'Сократите дробь $\frac{84}{126}$.'
        opts: ['$\frac23$', '$\frac34$', '$\frac47$', '$\frac79$']
        ans: a
        hint: 'Найдите $\text{НОД}(84, 126)$.'
        explain: '$\text{НОД}(84, 126) = 42$: $\frac{84 : 42}{126 : 42} = \frac23$.'
        sol: { method: 'Разделить числитель и знаменатель на НОД.', steps: ['$84 = 2^2 \cdot 3 \cdot 7$, $126 = 2 \cdot 3^2 \cdot 7$, $\text{НОД} = 2 \cdot 3 \cdot 7 = 42$.', '$84 : 42 = 2$, $126 : 42 = 3$.'], answer: '2/3' }
        src: b010
      - type: single
        cat: problem
        q: 'Какая из дробей наибольшая?'
        opts: ['$\frac{9}{14}$', '$\frac58$', '$\frac{7}{11}$', '$\frac35$']
        ans: a
        hint: 'Сравните, например, по десятичным приближениям или через перекрёстное умножение.'
        explain: '$\frac{9}{14} \approx 0{,}643$, $\frac{7}{11} \approx 0{,}636$, $\frac58 = 0{,}625$, $\frac35 = 0{,}6$.'
        sol: { method: 'Перекрёстное умножение: $\frac{a}{b} > \frac{c}{d} \iff ad > bc$ (при $b, d > 0$).', steps: ['$\frac{9}{14}$ и $\frac{7}{11}$: $9 \cdot 11 = 99 > 7 \cdot 14 = 98$.', '$\frac{7}{11}$ и $\frac58$: $56 > 55$; $\frac58 > \frac35$, так как $25 > 24$.'], answer: '9/14' }
        src: b010
      - type: single
        cat: theory
        q: 'Чему равно $\frac{a}{b} : \frac{c}{d}$ (все числа отличны от нуля)?'
        opts: ['$\frac{ad}{bc}$', '$\frac{ac}{bd}$', '$\frac{bc}{ad}$', '$\frac{a : c}{b + d}$']
        ans: a
        hint: 'Деление — умножение на обратную дробь.'
        explain: '$\frac{a}{b} : \frac{c}{d} = \frac{a}{b} \cdot \frac{d}{c} = \frac{ad}{bc}$.'
        f: [3]
        src: b010
      - type: multiple
        cat: theory
        q: 'Какие равенства верны при всех допустимых значениях букв? Выберите все.'
        opts: ['$\frac{-a}{-b} = \frac{a}{b}$', '$\frac{a}{b} \cdot c = \frac{ac}{b}$', '$\frac{a + c}{b + c} = \frac{a}{b}$', '$\frac{a}{b} + \frac{c}{d} = \frac{a + c}{b + d}$']
        ans: [a, b]
        hint: 'Проверьте сомнительные равенства на числах, например $a = 1$, $b = 2$, $c = d = 1$.'
        explain: 'Верны первые два. Третье: $\frac{1 + 1}{2 + 1} = \frac23 \ne \frac12$. Четвёртое: $\frac12 + \frac11 = \frac32 \ne \frac23$.'
        src: b010

  # ───────────────────────────── 1.2.2 ─────────────────────────────
  - id: ma-1-2-2
    num: '1.2.2'
    title: Смешанные дроби
    pages: [b014, b015, b016]
    book:
      place: 'Ч. 1, 1.2 «Дроби», пункт 1.2.2'
      summary: 'Задания на действия со смешанными числами: возведение в степень (в том числе отрицательных смешанных чисел), умножение и деление цепочек, выражения со скобками.'
    stage: verified
    stageNote: 'Ответы пересчитаны точной арифметикой дробей.'
    sourcesChecked: '2026-10-24'
    web: [*os-43, *os-45]
    theory:
      - kind: definition
        title: Смешанное число
        body: 'Смешанное число $a\frac{b}{c}$ — это сумма целой и дробной части: $a\frac{b}{c} = a + \frac{b}{c}$, где $\frac{b}{c}$ — правильная дробь. Например, $2\frac34 = 2 + \frac34 = \frac{11}{4}$.'
        src: b014
      - kind: rule
        title: Перевод в неправильную дробь и обратно
        body: |
          - $a\frac{b}{c} = \frac{ac + b}{c}$: целую часть умножить на знаменатель и прибавить числитель.
          - Обратно: разделить числитель на знаменатель с остатком. $\frac{47}{6}$: $47 = 6 \cdot 7 + 5$, значит, $\frac{47}{6} = 7\frac56$.
        src: b014
      - kind: rule
        title: Действия со смешанными числами
        body: |
          - **Сложение и вычитание** удобно выполнять отдельно для целых и дробных частей; если дробная часть уменьшаемого меньше, «занимают» единицу: $5\frac14 - 2\frac23 = 4\frac{15}{12} - 2\frac{8}{12} = 2\frac{7}{12}$.
          - **Умножение, деление, степень** — только после перевода в неправильные дроби: $2\frac13 \cdot 1\frac27 = \frac73 \cdot \frac97 = 3$. Перемножать целые и дробные части отдельно нельзя.
        src: b014
      - kind: note
        title: Отрицательные смешанные числа
        body: 'Минус относится ко всему числу: $-2\frac13 = -\left(2 + \frac13\right) = -\frac73$, а не $-2 + \frac13$. При возведении в степень сначала переводим в дробь: $\left(-1\frac12\right)^3 = \left(-\frac32\right)^3 = -\frac{27}{8}$.'
        src: b014
    formulas:
      - title: Смешанное число → неправильная дробь
        tex: 'a\frac{b}{c} = a + \frac{b}{c} = \frac{ac + b}{c}'
        meaning: '$a$ — целая часть, $\frac{b}{c}$ — правильная дробь ($0 \le b < c$).'
        use: 'Перед умножением, делением и возведением в степень.'
        variants: 'Обратно: если $p = cq + r$ ($0 \le r < c$), то $\frac{p}{c} = q\frac{r}{c}$.'
        src: b014
      - title: Отрицательное смешанное число
        tex: '-a\frac{b}{c} = -\left(a + \frac{b}{c}\right) = -\frac{ac + b}{c}'
        meaning: '$a\frac{b}{c}$ — положительное смешанное число.'
        use: 'Перевод отрицательного смешанного числа в дробь без ошибки в знаке.'
        limits: 'Неверно: $-2\frac13 = -2 + \frac13$.'
        src: b014
    examples:
      - title: Сложение смешанных чисел
        given: 'Вычислите $3\frac56 + 2\frac34$.'
        find: 'сумму.'
        method: 'Складываем целые части и дробные части отдельно.'
        steps:
          - 'Целые: $3 + 2 = 5$.'
          - 'Дробные: $\frac56 + \frac34 = \frac{10}{12} + \frac{9}{12} = \frac{19}{12} = 1\frac{7}{12}$.'
          - '$5 + 1\frac{7}{12} = 6\frac{7}{12}$.'
        check: '$3{,}8333\ldots + 2{,}75 = 6{,}5833\ldots$, и $\frac{7}{12} = 0{,}5833\ldots$'
        answer: '$6\frac{7}{12}$'
        src: b014
      - title: Вычитание с «займом»
        given: 'Вычислите $5\frac14 - 2\frac23$.'
        find: 'разность.'
        method: 'Дробная часть уменьшаемого ($\frac{3}{12}$) меньше дробной части вычитаемого ($\frac{8}{12}$) — занимаем единицу.'
        steps:
          - 'Общий знаменатель 12: $5\frac{3}{12} - 2\frac{8}{12}$.'
          - '$5\frac{3}{12} = 4\frac{15}{12}$.'
          - '$4\frac{15}{12} - 2\frac{8}{12} = 2\frac{7}{12}$.'
        check: '$5{,}25 - 2{,}6666\ldots = 2{,}5833\ldots = 2\frac{7}{12}$.'
        answer: '$2\frac{7}{12}$'
        src: b014
      - title: Степень отрицательного смешанного числа
        given: 'Вычислите $\left(-1\frac12\right)^3$.'
        find: 'значение степени.'
        method: 'Перевести в неправильную дробь, знак — по чётности показателя.'
        steps:
          - '$-1\frac12 = -\frac32$.'
          - '$\left(-\frac32\right)^3 = -\frac{27}{8}$ (показатель нечётный — знак минус).'
          - '$-\frac{27}{8} = -3\frac38$.'
        check: '$(-1{,}5)^3 = -3{,}375 = -3\frac38$.'
        answer: '$-3\frac38$'
        src: b014
    questions:
