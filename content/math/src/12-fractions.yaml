        explain: '$6\frac55 - 2\frac35 = 4\frac25 = 4{,}4$.'
        sol: { method: 'Вычитание смешанного числа из целого.', steps: ['$7 = 6\frac55$.', '$6\frac55 - 2\frac35 = 4\frac25$.', '$\frac25 = 0{,}4$.'], answer: '4,4' }
        src: b014
      - type: numeric
        cat: problem
        q: 'Вычислите $\left(2\frac12\right)^2 - 1\frac14$.'
