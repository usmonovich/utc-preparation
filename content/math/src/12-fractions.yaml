        explain: '$\frac92 : \frac98 = \frac92 \cdot \frac89 = 4$.'
        sol: { method: 'Перевести в неправильные дроби и делить.', steps: ['$4\frac12 = \frac92$, $1\frac18 = \frac98$.', '$\frac92 \cdot \frac89 = \frac{72}{18} = 4$.'], answer: '4' }
        src: b014
      - type: numeric
        cat: problem
        q: 'Вычислите $7 - 2\frac35$. Ответ запишите десятичной дробью.'
