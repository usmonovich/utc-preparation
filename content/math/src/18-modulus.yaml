topics:
  # ───────────────────────────── 1.8.1 ─────────────────────────────
  - id: ma-1-8-1
    num: '1.8.1'
    title: Выражения с модулем
    pages: [b080, b081]
    book:
      place: 'Ч. 1, 1.8 «Модуль», пункт 1.8.1'
      summary: 'Книга выписывает определение модуля и его свойства: $|a| \ge 0$, $|-a| = |a|$, $|ab| = |a||b|$, $|a|^2 = a^2$, $|a + b| \le |a| + |b|$, раскрытие $|a| < c$ и $|a| > c$. Задания — упростить выражения с модулями при известных знаках, изобразить $|a - b|$ на оси.'
    stage: verified
    stageNote: 'Свойства проверены численно; упрощения — подстановкой точек из каждого промежутка.'
    sourcesChecked: '2026-10-25'
    web: [*rs-mod, *os-i27]
    theory:
      - kind: definition
        title: Модуль числа
        body: |
          $$|a| = \begin{cases} a, & a \ge 0, \\ -a, & a < 0. \end{cases}$$
          Геометрически $|a|$ — расстояние от точки $a$ до нуля, а $|a - b|$ — **расстояние между точками** $a$ и $b$ на числовой оси: $|-4 - 1| = 5$.
          Чтобы раскрыть модуль, нужно знать **знак** выражения под ним: $|3 - \pi| = \pi - 3$, так как $3 - \pi < 0$.
        src: b080
      - kind: law
        title: Свойства модуля
        body: |
          - $|a| \ge 0$; $|-a| = |a|$; $|a|^2 = a^2$; $\sqrt{a^2} = |a|$;
          - $|ab| = |a| \cdot |b|$; $\left|\frac ab\right| = \frac{|a|}{|b|}$ ($b \ne 0$);
          - $|a + b| \le |a| + |b|$ (равенство при $ab \ge 0$); $\ \big||a| - |b|\big| \le |a - b|$;
          - $|a| = |b| \iff a = \pm b$.
        src: b080
      - kind: rule
        title: Сумма модулей на промежутках
        body: |
          Выражение $|x - a| + |x - b|$ ($a < b$) раскрывают на трёх промежутках, отделённых точками $a$ и $b$:
          - $x < a$: $(a - x) + (b - x) = a + b - 2x$;
          - $a \le x \le b$: $(x - a) + (b - x) = b - a$ — постоянная;
          - $x > b$: $2x - a - b$.
        src: b081
    formulas:
      - title: Определение модуля
        tex: '|a| = \begin{cases} a, & a \ge 0, \\ -a, & a < 0 \end{cases}'
        meaning: '$a$ — действительное число.'
        use: 'Раскрытие модуля по знаку выражения.'
        src: b080
      - title: Неравенство треугольника
        tex: '|a + b| \le |a| + |b|,\qquad \big||a| - |b|\big| \le |a - b|'
        meaning: 'Равенство в первом — когда $a$ и $b$ одного знака (или одно из них 0).'
        use: 'Оценки сумм; наибольшее и наименьшее значения.'
        src: b080
      - title: Расстояние между точками
        tex: 'd(a, b) = |a - b|'
        meaning: '$a$, $b$ — координаты точек на оси.'
        use: 'Геометрическое решение уравнений и неравенств: $|x - 2| = 3$ — точки на расстоянии 3 от 2.'
        src: b080
    examples:
      - title: Раскрытие по известным знакам
        given: 'Упростите $|a - b| - |b - c| + |c - a|$, если $a < b < c$.'
        find: 'выражение без модулей.'
        method: 'Определить знак каждого выражения под модулем.'
        steps:
          - '$a - b < 0$: $|a - b| = b - a$.'
          - '$b - c < 0$: $|b - c| = c - b$; $\ c - a > 0$: $|c - a| = c - a$.'
          - '$(b - a) - (c - b) + (c - a) = 2b - 2a$.'
        check: '$a = 1$, $b = 2$, $c = 5$: $1 - 3 + 4 = 2 = 2 \cdot 2 - 2 \cdot 1$ ✓.'
        answer: '$2b - 2a$'
        src: b080
      - title: Модули с иррациональными числами
        given: 'Вычислите $|3 - \pi| + |\pi - 4|$.'
        find: 'значение.'
        method: '$3 < \pi < 4$.'
        steps:
          - '$|3 - \pi| = \pi - 3$, $|\pi - 4| = 4 - \pi$.'
          - 'Сумма: $\pi - 3 + 4 - \pi = 1$.'
        check: '$0{,}1416 + 0{,}8584 = 1$ ✓.'
        answer: '$1$'
        src: b080
      - title: Сумма модулей на промежутках
        given: 'Упростите $|x - 1| + |x + 2|$ при $x < -2$ и при $-2 \le x \le 1$.'
        find: 'выражения.'
        method: 'Знаки $x - 1$ и $x + 2$ на каждом промежутке.'
        steps:
          - '$x < -2$: $(1 - x) + (-x - 2) = -2x - 1$.'
          - '$-2 \le x \le 1$: $(1 - x) + (x + 2) = 3$.'
        check: '$x = -3$: $4 + 1 = 5 = -2(-3) - 1$ ✓; $x = 0$: $1 + 2 = 3$ ✓.'
        answer: '$-2x - 1$; $3$'
        src: b081
    questions:
      - type: numeric
        cat: problem
        q: 'Вычислите $|-7| - |3 - 10| + |-2| \cdot |4|$.'
        num: { value: 8, unit: '', check: 'Math.abs(-7)-Math.abs(3-10)+Math.abs(-2)*Math.abs(4)' }
        hint: 'Сначала значения под модулями.'
        explain: '$7 - 7 + 8 = 8$.'
        f: [1]
        sol: { method: 'Определение модуля.', steps: ['$|-7| = 7$, $|3 - 10| = 7$.', '$|-2| \cdot |4| = 8$.', '$7 - 7 + 8 = 8$.'], answer: '8' }
        src: b080
      - type: numeric
        cat: problem
        q: 'Вычислите $|\sqrt5 - 3| + |\sqrt5 - 2|$.'
        num: { value: 1, unit: '', check: 'Math.abs(Math.sqrt(5)-3)+Math.abs(Math.sqrt(5)-2)' }
        hint: '$2 < \sqrt5 < 3$.'
        explain: '$(3 - \sqrt5) + (\sqrt5 - 2) = 1$.'
        f: [1]
        sol: { method: 'Знаки под модулями.', steps: ['$\sqrt5 - 3 < 0$, $\sqrt5 - 2 > 0$.', '$3 - \sqrt5 + \sqrt5 - 2 = 1$.'], answer: '1' }
        src: b080
      - type: numeric
        cat: problem
        q: 'Известно, что $|a| = 5$, $|b| = 3$. Найдите наибольшее возможное значение $|a - b|$.'
        num: { value: 8, unit: '', check: 'Math.abs(5-(-3))' }
        hint: '$|a - b| \le |a| + |b|$.'
        explain: 'Наибольшее $8$ при $a = 5$, $b = -3$ (или $a = -5$, $b = 3$).'
        f: [2]
        sol: { method: 'Неравенство треугольника.', steps: ['$|a - b| \le |a| + |-b| = 8$.', 'Достигается при $a = 5$, $b = -3$.'], answer: '8' }
        src: b080
      - type: numeric
        cat: problem
        q: 'Упростите $|x - 3| + |x - 7|$ при $3 \le x \le 7$. Ответ — число.'
        num: { value: 4, unit: '', check: 'Math.abs(5-3)+Math.abs(5-7)' }
        hint: 'Между точками сумма расстояний постоянна.'
        explain: '$(x - 3) + (7 - x) = 4$.'
        sol: { method: 'Раскрытие на промежутке.', steps: ['$x - 3 \ge 0$, $x - 7 \le 0$.', '$(x - 3) + (7 - x) = 4$.'], answer: '4' }
        src: b081
      - type: numeric
        cat: problem
        q: 'Найдите расстояние между точками $-4$ и $1$ на числовой оси.'
        num: { value: 5, unit: '', check: 'Math.abs(-4-1)' }
        hint: '$d = |a - b|$.'
        explain: '$|-4 - 1| = 5$.'
        f: [3]
        sol: { method: 'Расстояние как модуль разности.', steps: ['$|-4 - 1| = |-5| = 5$.'], answer: '5' }
        src: b080
      - type: numeric
        cat: problem
        q: 'Найдите значение $|2x - 1| - |x + 3|$ при $x = -5$.'
        num: { value: 9, unit: '', check: 'Math.abs(-11)-Math.abs(-2)' }
        hint: 'Подставьте и вычислите модули.'
        explain: '$|-11| - |-2| = 11 - 2 = 9$.'
        sol: { method: 'Подстановка.', steps: ['$2x - 1 = -11$, $x + 3 = -2$.', '$11 - 2 = 9$.'], answer: '9' }
        src: b080
      - type: single
        cat: theory
        q: 'При каких $a$ верно $|a| = -a$?'
        opts: ['$a \le 0$', '$a < 0$', '$a \ge 0$', 'ни при каких']
        ans: a
        hint: 'Вспомните определение и случай $a = 0$.'
        explain: 'При $a < 0$ по определению $|a| = -a$; при $a = 0$ обе части равны нулю.'
        f: [1]
        src: b080
      - type: single
        cat: theory
        q: 'Когда $|a + b| = |a| + |b|$?'
        opts: ['когда $ab \ge 0$', 'всегда', 'когда $a = b$', 'когда $ab < 0$']
        ans: a
        hint: 'Попробуйте $a = 2$, $b = -3$.'
        explain: 'Равенство в неравенстве треугольника — когда числа одного знака или одно из них равно нулю.'
        f: [2]
        src: b080

  # ───────────────────────────── 1.8.2 ─────────────────────────────
  - id: ma-1-8-2
    num: '1.8.2'
    title: Уравнения с модулем
    pages: [b081, b082, b083, b084]
    book:
      place: 'Ч. 1, 1.8 «Модуль», пункт 1.8.2'
      summary: 'Задания на уравнения вида $|f(x)| = a$, $|f(x)| = g(x)$, $|f| = |g|$, уравнения с несколькими модулями и квадратные уравнения относительно $|x|$.'
    stage: verified
    stageNote: 'Все корни подставлены в исходные уравнения.'
    sourcesChecked: '2026-10-25'
    web: [*rs-modeq, *os-i27]
    theory:
      - kind: rule
        title: Основные типы
        body: |
          - $|f(x)| = a$: при $a > 0$ — $f(x) = \pm a$; при $a = 0$ — $f(x) = 0$; при $a < 0$ — корней нет.
          - $|f(x)| = g(x)$: нужно $g(x) \ge 0$, и тогда $f(x) = \pm g(x)$. Корни, при которых $g(x) < 0$, — **посторонние**.
          - $|f(x)| = |g(x)| \iff f(x) = g(x)$ или $f(x) = -g(x)$.
        src: b081
      - kind: rule
        title: Несколько модулей и замена |x| = t
        body: |
          - **Метод промежутков**: нули выражений под модулями делят ось на промежутки; на каждом модули раскрываются однозначно. Найденный корень оставляют, только если он лежит в своём промежутке.
          - Если уравнение содержит только $|x|$ и $x^2 = |x|^2$, делают замену $t = |x| \ge 0$: $x^2 - 5|x| + 6 = 0 \Rightarrow t^2 - 5t + 6 = 0$.
        src: b082
    formulas:
      - title: Модуль равен числу
        tex: '|f(x)| = a,\ a > 0 \iff f(x) = a\ \text{или}\ f(x) = -a'
        meaning: '$a$ — число.'
        use: 'Простейшие уравнения с модулем.'
        limits: 'При $a < 0$ корней нет.'
        src: b081
      - title: Модуль равен выражению
        tex: '|f(x)| = g(x) \iff \begin{cases} g(x) \ge 0, \\ f(x) = \pm g(x) \end{cases}'
        meaning: '$f$, $g$ — выражения с неизвестным.'
        use: 'Уравнения с неизвестным в правой части.'
        src: b081
      - title: Равенство модулей
        tex: '|f| = |g| \iff f = g\ \text{или}\ f = -g'
        meaning: 'Можно также возвести в квадрат: $f^2 = g^2$.'
        use: 'Уравнения $|x - 4| = |x + 2|$.'
        src: b081
    examples:
      - title: Модуль равен числу
        given: 'Решите уравнение $|2x - 3| = 5$.'
        find: 'корни.'
        method: '$2x - 3 = \pm 5$.'
        steps:
          - '$2x - 3 = 5 \Rightarrow x = 4$.'
          - '$2x - 3 = -5 \Rightarrow x = -1$.'
        check: '$|5| = 5$, $|-5| = 5$ ✓.'
        answer: '$-1$; $4$'
        src: b081
      - title: Посторонний корень
        given: 'Решите уравнение $|x - 2| = 3x - 10$.'
        find: 'корни.'
        method: 'Условие $3x - 10 \ge 0$ и два случая.'
        steps:
          - 'Нужно $x \ge \frac{10}{3}$.'
          - '$x - 2 = 3x - 10 \Rightarrow x = 4$ — подходит.'
          - '$x - 2 = -(3x - 10) \Rightarrow x = 3$ — не подходит ($3 < \frac{10}{3}$).'
        check: '$x = 4$: $|2| = 2 = 12 - 10$ ✓; $x = 3$: $1 \ne -1$ ✓.'
        answer: '$x = 4$'
        src: b081
      - title: Два модуля
        given: 'Решите уравнение $|x - 1| + |x + 2| = 5$.'
        find: 'корни.'
        method: 'Метод промежутков: точки $-2$ и $1$.'
        steps:
          - '$x < -2$: $-2x - 1 = 5 \Rightarrow x = -3$ — в промежутке.'
          - '$-2 \le x \le 1$: $3 = 5$ — корней нет.'
          - '$x > 1$: $2x + 1 = 5 \Rightarrow x = 2$ — в промежутке.'
        check: '$x = -3$: $4 + 1 = 5$ ✓; $x = 2$: $1 + 4 = 5$ ✓.'
        answer: '$-3$; $2$'
        src: b082
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите сумму корней уравнения $|2x - 5| = 7$.'
        num: { value: 5, unit: '', check: '6+(-1)' }
        hint: '$2x - 5 = \pm7$.'
        explain: 'Корни $6$ и $-1$, сумма $5$.'
        f: [1]
        sol: { method: 'Модуль равен числу.', steps: ['$2x - 5 = 7 \Rightarrow x = 6$.', '$2x - 5 = -7 \Rightarrow x = -1$.', 'Сумма $5$.'], answer: '5' }
        src: b081
      - type: numeric
        cat: problem
        q: 'Сколько корней у уравнения $|x^2 - 5| = 4$?'
        num: { value: 4, unit: '', check: '4' }
        hint: '$x^2 - 5 = \pm4$.'
        explain: '$x^2 = 9$ или $x^2 = 1$: $\pm3$, $\pm1$.'
        f: [1]
        sol: { method: 'Модуль равен числу.', steps: ['$x^2 - 5 = 4 \Rightarrow x = \pm3$.', '$x^2 - 5 = -4 \Rightarrow x = \pm1$.', 'Четыре корня.'], answer: '4' }
        src: b081
      - type: numeric
        cat: problem
        q: 'Решите уравнение $|x - 4| = |x + 2|$.'
        num: { value: 1, unit: '', check: '(4-2)/2' }
        hint: 'Точка, равноудалённая от $4$ и $-2$.'
        explain: '$x - 4 = -(x + 2) \Rightarrow x = 1$; случай $x - 4 = x + 2$ невозможен.'
        f: [3]
        sol: { method: 'Равенство модулей.', steps: ['$x - 4 = x + 2$ — противоречие.', '$x - 4 = -x - 2 \Rightarrow x = 1$.'], check: '$|-3| = |3|$.', answer: '1' }
        src: b081
      - type: numeric
        cat: problem
        q: 'Решите уравнение $|x + 1| = 2x - 1$.'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Правая часть должна быть неотрицательной.'
        explain: '$x \ge \frac12$: $x + 1 = 2x - 1 \Rightarrow x = 2$; второй случай даёт $x = 0$ — посторонний.'
        f: [2]
        sol: { method: 'Модуль равен выражению.', steps: ['$2x - 1 \ge 0 \Rightarrow x \ge \frac12$.', '$x + 1 = 2x - 1 \Rightarrow x = 2$ ✓.', '$x + 1 = 1 - 2x \Rightarrow x = 0$ — не подходит.'], check: '$|3| = 3$.', answer: '2' }
        src: b081
      - type: numeric
        cat: problem
        q: 'Найдите сумму корней уравнения $|x| + |x - 4| = 6$.'
        num: { value: 4, unit: '', check: '-1+5' }
        hint: 'Промежутки с границами $0$ и $4$.'
        explain: '$x < 0$: $4 - 2x = 6$, $x = -1$; $0 \le x \le 4$: $4 \ne 6$; $x > 4$: $2x - 4 = 6$, $x = 5$. Сумма $4$.'
        sol: { method: 'Метод промежутков.', steps: ['$x < 0$: $-x + 4 - x = 6 \Rightarrow x = -1$.', '$0 \le x \le 4$: $x + 4 - x = 4 \ne 6$.', '$x > 4$: $2x - 4 = 6 \Rightarrow x = 5$.', 'Сумма $-1 + 5 = 4$.'], answer: '4' }
        src: b082
      - type: numeric
        cat: problem
        q: 'Найдите произведение всех корней уравнения $x^2 - 5|x| + 6 = 0$.'
        num: { value: 36, unit: '', check: '2*(-2)*3*(-3)' }
        hint: 'Замена $t = |x|$.'
        explain: '$t = 2$ или $3$; корни $\pm2$, $\pm3$; произведение $36$.'
        sol: { method: 'Замена $t = |x|$.', steps: ['$t^2 - 5t + 6 = 0$: $t = 2$, $t = 3$ (оба $\ge 0$).', '$x = \pm2$, $x = \pm3$.', '$2 \cdot (-2) \cdot 3 \cdot (-3) = 36$.'], answer: '36' }
        src: b082
      - type: single
        cat: theory
        q: 'Сколько корней у уравнения $|x - 2| = -3$?'
        opts: ['ни одного', 'один', 'два', 'бесконечно много']
        ans: a
        hint: 'Модуль не бывает отрицательным.'
        explain: '$|x - 2| \ge 0 > -3$.'
        f: [1]
        src: b081
      - type: single
        cat: theory
        q: 'Решения уравнения $|x| + |x - 4| = 4$:'
        opts: ['все $x$ из отрезка $[0; 4]$', 'только $0$ и $4$', 'только $2$', 'корней нет']
        ans: a
        hint: 'Сумма расстояний от $x$ до $0$ и до $4$.'
        explain: 'Для любой точки между $0$ и $4$ сумма расстояний равна $4$; вне отрезка она больше.'
        src: b082

  # ───────────────────────────── 1.8.3 ─────────────────────────────
  - id: ma-1-8-3
    num: '1.8.3'
    title: Неравенства с модулем
    pages: [b084, b085, b086, b087]
    book:
      place: 'Ч. 1, 1.8 «Модуль», пункт 1.8.3'
      summary: 'Задания на неравенства $|f(x)| < a$, $|f(x)| > a$, неравенства с двумя модулями и системы с модулем: найти решения, наименьшее натуральное решение, число и сумму целых решений.'
    stage: verified
    stageNote: 'Целые решения пересчитаны перебором; границы проверены подстановкой.'
    sourcesChecked: '2026-10-25'
    web: [*rs-modeq, *os-i27, *rs-mod]
    theory:
      - kind: rule
        title: Модуль меньше и больше числа
        body: |
          При $a > 0$:
          - $|f| < a \iff -a < f < a$ (точки **ближе** $a$ к нулю);
          - $|f| > a \iff f < -a$ или $f > a$ (точки **дальше** $a$).
          При $a \le 0$: $|f| < a$ решений не имеет; $|f| > a$ выполняется везде, где определено $f$ (при $a = 0$ — кроме нулей $f$).
          Геометрически $|x - c| \le r$ — отрезок $[c - r; c + r]$.
        src: b084
        fig: abs-distance
      - kind: rule
        title: Модуль и выражение, два модуля
        body: |
          - $|f| < g \iff -g < f < g$; $\ |f| > g \iff f > g$ или $f < -g$.
          - $|f| < |g| \iff f^2 < g^2 \iff (f - g)(f + g) < 0$ — обе части неотрицательны, поэтому возводить в квадрат можно.
          - Сложные случаи — методом промежутков, как в уравнениях.
        src: b085
    formulas:
      - title: Модуль меньше числа
        tex: '|f| < a \iff -a < f < a\qquad (a > 0)'
        meaning: '$f$ — выражение с неизвестным.'
        use: 'Двойное неравенство вместо модуля.'
        src: b084
      - title: Модуль больше числа
        tex: '|f| > a \iff f < -a\ \ \text{или}\ \ f > a\qquad (a > 0)'
        meaning: 'Объединение двух лучей.'
        use: 'Неравенства «дальше, чем».'
        src: b084
      - title: Сравнение модулей
        tex: '|f| < |g| \iff (f - g)(f + g) < 0'
        meaning: 'Следует из $f^2 < g^2$.'
        use: 'Неравенства $|x - 3| < |x + 1|$.'
        src: b085
    examples:
      - title: Модуль меньше числа
        given: 'Решите неравенство $|x - 2| \le 3$.'
        find: 'промежуток.'
        method: 'Двойное неравенство.'
        steps:
          - '$-3 \le x - 2 \le 3$.'
          - '$-1 \le x \le 5$.'
        check: '$x = -1$, $x = 5$: модуль равен 3 ✓; $x = 6$: $4 > 3$ ✓.'
        answer: '$[-1; 5]$'
        src: b084
      - title: Модуль больше числа
        given: 'Решите неравенство $|2x + 1| > 5$.'
        find: 'множество решений.'
        method: 'Два луча.'
        steps:
          - '$2x + 1 > 5 \Rightarrow x > 2$.'
          - '$2x + 1 < -5 \Rightarrow x < -3$.'
        check: '$x = 3$: $7 > 5$ ✓; $x = 0$: $1 < 5$ — не решение ✓.'
        answer: '$(-\infty; -3) \cup (2; +\infty)$'
        src: b084
      - title: Два модуля
        given: 'Решите неравенство $|x - 3| < |x + 1|$.'
        find: 'множество решений.'
        method: 'Возвести в квадрат (обе части неотрицательны).'
        steps:
          - '$(x - 3)^2 < (x + 1)^2 \Rightarrow -6x + 9 < 2x + 1$.'
          - '$8 < 8x$, $x > 1$.'
        check: 'Геометрически: точки ближе к $3$, чем к $-1$, — правее середины $1$ ✓.'
        answer: '$(1; +\infty)$'
        src: b085
