topics:
  # ───────────────────────────── 1.10.1 ─────────────────────────────
  - id: ma-1-10-1
    num: '1.10.1'
    title: Арифметическая прогрессия
    pages: [b094, b095, b096, b097, b098, b099]
    book:
      place: 'Ч. 1, 1.10 «Прогрессии», пункт 1.10.1'
      summary: 'Задания на формулы $n$-го члена и суммы арифметической прогрессии, на свойства её членов и на текстовые задачи о последовательностях чисел.'
    stage: verified
    stageNote: 'Ответы пересчитаны прямым суммированием членов.'
    sourcesChecked: '2026-10-25'
    web: [*rs-ap, *os-122]
    theory:
      - kind: definition
        title: Арифметическая прогрессия
        body: |
          Последовательность, в которой каждый член, начиная со второго, равен предыдущему плюс одно и то же число $d$ (**разность**): $a_{n+1} = a_n + d$.
          - $n$-й член: $a_n = a_1 + (n - 1)d$; разность по двум членам: $d = \frac{a_m - a_k}{m - k}$.
          - **Характеристическое свойство**: $a_n = \frac{a_{n-1} + a_{n+1}}{2}$ — каждый член равен среднему арифметическому соседей.
          - Если $m + n = p + q$, то $a_m + a_n = a_p + a_q$ (например, $a_1 + a_{10} = a_2 + a_9$).
        src: b094
      - kind: law
        title: Сумма первых n членов
        body: |
          $$S_n = \frac{(a_1 + a_n)\,n}{2} = \frac{\big(2a_1 + (n - 1)d\big)\,n}{2}.$$
          Идея (приписывается Гауссу): запишем сумму в прямом и обратном порядке и сложим — в каждой паре получится $a_1 + a_n$, пар $n$, значит, $2S_n = n(a_1 + a_n)$.
          Обратно: $a_n = S_n - S_{n-1}$.
        src: b095
        fig: gauss-sum
    formulas:
      - title: n-й член арифметической прогрессии
        tex: 'a_n = a_1 + (n - 1)d'
        meaning: '$a_1$ — первый член, $d$ — разность, $n$ — номер.'
        use: 'Найти любой член или число членов.'
        variants: '$d = \frac{a_m - a_k}{m - k}$; число членов от $a_1$ до $a_n$: $n = \frac{a_n - a_1}{d} + 1$.'
        src: b094
      - title: Сумма первых n членов
        tex: 'S_n = \frac{(a_1 + a_n)\,n}{2} = \frac{\big(2a_1 + (n - 1)d\big)\,n}{2}'
        meaning: '$S_n$ — сумма $a_1 + \dots + a_n$.'
        use: 'Суммы последовательных чисел, членов прогрессии.'
        src: b095
      - title: Характеристическое свойство
        tex: 'a_n = \frac{a_{n-1} + a_{n+1}}{2},\qquad a_m + a_n = a_p + a_q\ \ (m + n = p + q)'
        meaning: 'Средний член — среднее арифметическое соседей.'
        use: 'Проверка, что числа образуют прогрессию; задачи без нахождения $a_1$ и $d$.'
        src: b094
    examples:
      - title: Член и сумма
        given: '$a_1 = 3$, $d = 4$. Найдите $a_{10}$ и $S_{10}$.'
        find: '$a_{10}$, $S_{10}$.'
        method: 'Формулы $n$-го члена и суммы.'
        steps:
          - '$a_{10} = 3 + 9 \cdot 4 = 39$.'
          - '$S_{10} = \frac{(3 + 39) \cdot 10}{2} = 210$.'
        check: '$3 + 7 + 11 + \dots + 39$: десять чисел, среднее $21$, $21 \cdot 10 = 210$ ✓.'
        answer: '$a_{10} = 39$, $S_{10} = 210$'
        src: b094
      - title: По двум членам
        given: 'В арифметической прогрессии $a_3 = 7$, $a_8 = 22$. Найдите $S_{10}$.'
        find: '$S_{10}$.'
        method: 'Сначала $d$ и $a_1$.'
        steps:
          - '$d = \frac{22 - 7}{8 - 3} = 3$; $a_1 = 7 - 2 \cdot 3 = 1$.'
          - '$a_{10} = 1 + 27 = 28$; $S_{10} = \frac{(1 + 28) \cdot 10}{2} = 145$.'
        check: '$1, 4, 7, \dots, 28$: $a_3 = 7$, $a_8 = 22$ ✓.'
        answer: '$145$'
        src: b095
      - title: Сумма чисел, кратных 7
        given: 'Найдите сумму всех двузначных чисел, кратных 7.'
        find: 'сумму.'
        method: 'Прогрессия $14, 21, \dots, 98$ с $d = 7$.'
        steps:
          - '$n = \frac{98 - 14}{7} + 1 = 13$.'
          - '$S = \frac{(14 + 98) \cdot 13}{2} = 728$.'
        check: '$7 \cdot (2 + 3 + \dots + 14) = 7 \cdot 104 = 728$ ✓.'
        answer: '$728$'
        src: b095
    questions:
      - type: numeric
        cat: problem
        q: '$a_1 = -5$, $d = 2$. Найдите $a_{20}$.'
        num: { value: 33, unit: '', check: '-5+19*2' }
        hint: '$a_n = a_1 + (n - 1)d$.'
        explain: '$-5 + 38 = 33$.'
        f: [1]
        sol: { method: 'Формула $n$-го члена.', steps: ['$a_{20} = -5 + 19 \cdot 2 = 33$.'], answer: '33' }
        src: b094
      - type: numeric
        cat: problem
        q: 'Найдите сумму первых 50 натуральных чисел.'
        num: { value: 1275, unit: '', check: '50*51/2' }
        hint: '$a_1 = 1$, $a_{50} = 50$.'
        explain: '$\frac{(1 + 50) \cdot 50}{2} = 1275$.'
        f: [2]
        sol: { method: 'Сумма прогрессии.', steps: ['$S_{50} = \frac{51 \cdot 50}{2} = 1275$.'], answer: '1275' }
        src: b095
      - type: numeric
        cat: problem
        q: 'В арифметической прогрессии $a_2 + a_9 = 20$. Найдите $S_{10}$.'
        num: { value: 100, unit: '', check: '20*10/2' }
        hint: '$a_1 + a_{10} = a_2 + a_9$.'
        explain: '$S_{10} = \frac{(a_1 + a_{10}) \cdot 10}{2} = 20 \cdot 5 = 100$.'
        f: [3]
        sol: { method: 'Свойство сумм членов.', steps: ['$1 + 10 = 2 + 9$, значит, $a_1 + a_{10} = 20$.', '$S_{10} = 20 \cdot 5 = 100$.'], answer: '100' }
        src: b095
      - type: numeric
        cat: problem
        q: 'В арифметической прогрессии $a_5 = 10$, $a_{12} = 31$. Найдите разность $d$.'
        num: { value: 3, unit: '', check: '(31-10)/(12-5)' }
        hint: '$d = \frac{a_m - a_k}{m - k}$.'
        explain: '$\frac{21}{7} = 3$.'
        f: [1]
        sol: { method: 'Разность по двум членам.', steps: ['$a_{12} - a_5 = 7d = 21$.', '$d = 3$.'], answer: '3' }
        src: b094
      - type: numeric
        cat: problem
        q: 'Сколько членов в последовательности $2, 5, 8, \dots, 98$?'
        num: { value: 33, unit: '', check: '(98-2)/3+1' }
        hint: '$n = \frac{a_n - a_1}{d} + 1$.'
        explain: '$\frac{96}{3} + 1 = 33$.'
        f: [1]
        sol: { method: 'Число членов.', steps: ['$98 = 2 + (n - 1) \cdot 3$.', '$n - 1 = 32$, $n = 33$.'], answer: '33' }
        src: b094
      - type: numeric
        cat: problem
        q: 'При каком $x$ числа $x + 2$, $2x + 1$, $4x - 6$ — последовательные члены арифметической прогрессии?'
        num: { value: 6, unit: '', check: '6' }
        hint: 'Средний член — среднее арифметическое соседей.'
        explain: '$2(2x + 1) = (x + 2) + (4x - 6) \Rightarrow x = 6$: числа $8, 13, 18$.'
        f: [3]
        sol: { method: 'Характеристическое свойство.', steps: ['$2(2x + 1) = 5x - 4$.', '$4x + 2 = 5x - 4 \Rightarrow x = 6$.'], check: '$8, 13, 18$ — разность $5$.', answer: '6' }
        src: b094
      - type: numeric
        cat: problem
        q: 'Сумма первых $n$ членов арифметической прогрессии $S_n = n^2 + 2n$. Найдите $a_5$.'
        num: { value: 11, unit: '', check: '(25+10)-(16+8)' }
        hint: '$a_n = S_n - S_{n-1}$.'
        explain: '$S_5 - S_4 = 35 - 24 = 11$.'
        sol: { method: 'Член через суммы.', steps: ['$S_5 = 35$, $S_4 = 24$.', '$a_5 = 11$.'], check: '$a_n = 2n + 1$: $3, 5, 7, 9, 11$.', answer: '11' }
        src: b095
      - type: single
        cat: theory
        q: 'Какое равенство верно для любой арифметической прогрессии?'
        opts: ['$a_3 + a_7 = a_4 + a_6$', '$a_3 \cdot a_7 = a_5^2$', '$a_3 + a_7 = a_{10}$', '$a_7 - a_3 = a_4$']
        ans: a
        hint: 'Сравните суммы номеров.'
        explain: '$3 + 7 = 4 + 6$, поэтому суммы членов равны (обе равны $2a_5$).'
        f: [3]
        src: b094

  # ───────────────────────────── 1.10.2 ─────────────────────────────
  - id: ma-1-10-2
    num: '1.10.2'
    title: Геометрическая прогрессия
    pages: [b099, b100, b101, b102, b103]
    book:
      place: 'Ч. 1, 1.10 «Прогрессии», пункт 1.10.2'
      summary: 'Задания на формулы $n$-го члена и суммы геометрической прогрессии, сумму бесконечно убывающей прогрессии и характеристическое свойство.'
    stage: verified
    stageNote: 'Члены и суммы пересчитаны напрямую; бесконечные суммы — по частичным суммам.'
    sourcesChecked: '2026-10-25'
    web: [*rs-gp, *os-123]
    theory:
      - kind: definition
        title: Геометрическая прогрессия
        body: |
          Последовательность ненулевых чисел, в которой каждый член, начиная со второго, равен предыдущему, умноженному на одно и то же число $q \ne 0$ (**знаменатель**): $b_{n+1} = b_n q$.
          - $n$-й член: $b_n = b_1 q^{n-1}$; $\ q^{m-k} = \frac{b_m}{b_k}$.
          - **Характеристическое свойство**: $b_n^2 = b_{n-1}b_{n+1}$; для положительных членов $b_n = \sqrt{b_{n-1}b_{n+1}}$ — среднее геометрическое соседей.
          - Сумма: $S_n = \frac{b_1(q^n - 1)}{q - 1}$ при $q \ne 1$; при $q = 1$ $S_n = nb_1$.
        src: b099
      - kind: law
        title: Бесконечно убывающая прогрессия
        body: |
          Если $|q| < 1$, то $q^n \to 0$ и частичные суммы приближаются к числу
          $$S = \frac{b_1}{1 - q}.$$
          Например, $\frac12 + \frac14 + \frac18 + \dots = 1$; периодическая дробь $0{,}(3) = \frac{0{,}3}{1 - 0{,}1} = \frac13$. При $|q| \ge 1$ сумма бесконечной прогрессии не существует.
        src: b101
        fig: geo-series
    formulas:
      - title: n-й член геометрической прогрессии
        tex: 'b_n = b_1 q^{n-1}'
        meaning: '$b_1 \ne 0$ — первый член, $q \ne 0$ — знаменатель.'
        use: 'Любой член; знаменатель по двум членам: $q^{m-k} = \frac{b_m}{b_k}$.'
        src: b099
      - title: Сумма первых n членов
        tex: 'S_n = \frac{b_1(q^n - 1)}{q - 1}\quad (q \ne 1)'
        meaning: 'При $q = 1$: $S_n = nb_1$.'
        use: 'Суммы конечного числа членов.'
        src: b100
      - title: Сумма бесконечно убывающей прогрессии
        tex: 'S = \frac{b_1}{1 - q}\quad (|q| < 1)'
        meaning: 'Предел частичных сумм.'
        use: 'Бесконечные суммы, перевод периодических дробей.'
        limits: 'Только при $|q| < 1$.'
        src: b101
      - title: Характеристическое свойство
        tex: 'b_n^2 = b_{n-1}\,b_{n+1}'
        meaning: 'Для положительных членов — среднее геометрическое соседей.'
        use: 'Найти неизвестный член по соседям.'
        src: b099
    examples:
      - title: Член и сумма
        given: '$b_1 = 3$, $q = 2$. Найдите $b_6$ и $S_6$.'
        find: '$b_6$, $S_6$.'
        method: 'Формулы $n$-го члена и суммы.'
        steps:
          - '$b_6 = 3 \cdot 2^5 = 96$.'
          - '$S_6 = \frac{3(2^6 - 1)}{2 - 1} = 189$.'
        check: '$3 + 6 + 12 + 24 + 48 + 96 = 189$ ✓.'
        answer: '$b_6 = 96$, $S_6 = 189$'
        src: b099
      - title: По двум членам
        given: 'В геометрической прогрессии $b_2 = 6$, $b_5 = 48$. Найдите $S_5$.'
        find: '$S_5$.'
        method: '$q^3 = \frac{b_5}{b_2}$.'
        steps:
          - '$q^3 = 8 \Rightarrow q = 2$; $b_1 = 3$.'
          - '$S_5 = 3(2^5 - 1) = 93$.'
        check: '$3 + 6 + 12 + 24 + 48 = 93$ ✓.'
        answer: '$93$'
        src: b100
      - title: Бесконечная сумма
        given: 'Найдите сумму $12 + 4 + \frac43 + \dots$.'
        find: '$S$.'
        method: 'Бесконечно убывающая прогрессия.'
        steps:
          - '$q = \frac4{12} = \frac13$, $|q| < 1$.'
          - '$S = \frac{12}{1 - \frac13} = 18$.'
        check: 'Частичные суммы: $12$; $16$; $17{,}33$; $17{,}78$; … → $18$ ✓.'
        answer: '$18$'
        src: b101
    questions:
      - type: numeric
        cat: problem
        q: '$b_1 = 2$, $q = 3$. Найдите $b_5$.'
        num: { value: 162, unit: '', check: '2*3**4' }
        hint: '$b_n = b_1 q^{n-1}$.'
        explain: '$2 \cdot 81 = 162$.'
        f: [1]
        sol: { method: 'Формула $n$-го члена.', steps: ['$b_5 = 2 \cdot 3^4 = 162$.'], answer: '162' }
        src: b099
      - type: numeric
        cat: problem
        q: 'Найдите сумму первых пяти членов прогрессии $1, 2, 4, \dots$.'
        num: { value: 31, unit: '', check: '2**5-1' }
        hint: '$q = 2$.'
        explain: '$\frac{2^5 - 1}{2 - 1} = 31$.'
        f: [2]
        sol: { method: 'Сумма геометрической прогрессии.', steps: ['$S_5 = \frac{1 \cdot (32 - 1)}{1} = 31$.'], check: '$1 + 2 + 4 + 8 + 16 = 31$.', answer: '31' }
        src: b100
      - type: numeric
        cat: problem
        q: 'В геометрической прогрессии с положительным знаменателем $b_3 = 12$, $b_5 = 48$. Найдите $b_1$.'
        num: { value: 3, unit: '', check: '12/4' }
        hint: '$q^2 = \frac{b_5}{b_3}$.'
        explain: '$q^2 = 4$, $q = 2$; $b_1 = \frac{12}{4} = 3$.'
        f: [1]
        sol: { method: 'Знаменатель по двум членам.', steps: ['$q^2 = 4$, $q = 2$ ($q > 0$).', '$b_1 = \frac{b_3}{q^2} = 3$.'], answer: '3' }
        src: b099
      - type: numeric
        cat: problem
        q: 'Найдите сумму $9 - 3 + 1 - \dfrac13 + \dots$.'
        num: { value: 6.75, unit: '', check: '9/(1+1/3)' }
        hint: '$q = -\frac13$.'
        explain: '$\frac{9}{1 + \frac13} = \frac{27}{4} = 6{,}75$.'
        f: [3]
        sol: { method: 'Бесконечно убывающая прогрессия.', steps: ['$q = -\frac13$, $|q| < 1$.', '$S = \frac{9}{4/3} = 6{,}75$.'], answer: '6,75' }
        src: b101
      - type: numeric
        cat: problem
        q: 'Положительные числа $x$, $6$, $x + 5$ образуют геометрическую прогрессию. Найдите $x$.'
        num: { value: 4, unit: '', check: '(-5+Math.sqrt(25+144))/2' }
        hint: '$6^2 = x(x + 5)$.'
        explain: '$x^2 + 5x - 36 = 0$: $x = 4$ (корень $-9$ отрицателен).'
        f: [4]
        sol: { method: 'Характеристическое свойство.', steps: ['$36 = x(x + 5)$.', '$x^2 + 5x - 36 = 0$: $x = 4$ или $x = -9$.', 'Положительное: $x = 4$.'], check: '$4, 6, 9$: $q = 1{,}5$.', answer: '4' }
        src: b099
      - type: numeric
        cat: problem
        q: 'Сумма бесконечно убывающей геометрической прогрессии равна 12, первый член равен 9. Найдите знаменатель.'
        num: { value: 0.25, unit: '', check: '1-9/12' }
        hint: '$\frac{9}{1 - q} = 12$.'
        explain: '$1 - q = \frac34$, $q = 0{,}25$.'
        f: [3]
        sol: { method: 'Формула бесконечной суммы.', steps: ['$1 - q = \frac{9}{12} = 0{,}75$.', '$q = 0{,}25$.'], answer: '0,25' }
        src: b101
      - type: single
        cat: theory
        q: 'Какое равенство верно для любой геометрической прогрессии?'
        opts: ['$b_5^2 = b_4 b_6$', '$2b_5 = b_4 + b_6$', '$b_5 = b_4 + b_6$', '$b_5^2 = b_1 b_{10}$']
        ans: a
        hint: 'Характеристическое свойство.'
        explain: '$b_4 b_6 = b_1q^3 \cdot b_1q^5 = (b_1q^4)^2 = b_5^2$. Для $b_1b_{10}$ сумма номеров $11 \ne 10$.'
        f: [4]
        src: b099
      - type: single
        cat: theory
        q: 'Когда существует сумма бесконечной геометрической прогрессии $S = \dfrac{b_1}{1 - q}$?'
        opts: ['при $|q| < 1$', 'при любом $q \ne 1$', 'при $q > 0$', 'при $|q| > 1$']
        ans: a
        hint: 'Должно выполняться $q^n \to 0$.'
        explain: 'Только при $|q| < 1$ члены стремятся к нулю, а частичные суммы — к числу.'
        f: [3]
        src: b101
