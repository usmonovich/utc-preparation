    book:
      place: 'Ч. 2, 1.18 «Нестандартные задачи»'
      summary: 'Сборник задач повышенной трудности по разным темам части 1 без отдельной теории в книге: суммы неотрицательных выражений, оценки, монотонность, целочисленные решения, число корней. Для авиационного вступительного экзамена — дополнительный уровень; здесь собраны общие приёмы.'
    stage: verified
    stageNote: 'Ответы проверены перебором и численно.'
    sourcesChecked: '2026-10-25'
    web: [*rs-alg, *rs-mod, *mu-am]
    theory:
      - kind: rule
        title: Сумма неотрицательных слагаемых
        body: |
          Квадрат, модуль и арифметический корень неотрицательны. Если их сумма равна нулю, то **каждое** слагаемое равно нулю:
          $$A^2 + |B| + \sqrt{C} = 0 \iff A = 0,\ B = 0,\ C = 0.$$
          Так одно уравнение с несколькими неизвестными превращается в систему.
        src: b227
      - kind: rule
        title: Оценки и монотонность
        body: |
          - **Метод оценок**: если $f(x) \le M$ и $g(x) \ge M$, то $f(x) = g(x) \iff f(x) = M$ и $g(x) = M$. Пример: $\sin x = x^2 + 1$ — левая часть $\le 1$, правая $\ge 1$; равенство возможно лишь при $x = 0$, но $\sin 0 \ne 1$ — корней нет.
          - **Монотонность**: строго возрастающая функция принимает каждое значение не более одного раза, поэтому уравнение $f(x) = c$ имеет не больше одного корня. Найдя корень подбором, решение заканчивают: $x^3 + x = 10 \Rightarrow x = 2$.
        src: b228
      - kind: rule
        title: Целые числа
        body: |
          - **Разложение на множители**: $x^2 - y^2 = (x - y)(x + y)$; для натуральных $x$, $y$ оба множителя — натуральные делители правой части одной чётности.
          - **Проверка простоты**: если у $n$ нет простых делителей $p \le \sqrt n$, то $n$ простое. Для $1009$ достаточно проверить простые до $31$ ($31^2 = 961 < 1009 < 37^2$).
        src: b229
    formulas:
      - title: Сумма неотрицательных равна нулю
        tex: 'A^2 + |B| + \sqrt C = 0 \iff A = B = C = 0'
        meaning: 'Каждое слагаемое неотрицательно.'
        use: 'Уравнения с несколькими неизвестными.'
        src: b227
      - title: Метод оценок
        tex: 'f(x) \le M \le g(x):\quad f(x) = g(x) \iff \begin{cases} f(x) = M, \\ g(x) = M \end{cases}'
        meaning: '$M$ — общая граница двух частей.'
        use: 'Уравнения, где части имеют «противоположные» оценки.'
        src: b228
      - title: Граница проверки простоты
        tex: 'n\ \text{составное} \Rightarrow \exists\ p \mid n,\ p\ \text{простое},\ p \le \sqrt n'
        meaning: 'Наименьший простой делитель составного числа не превосходит его корня.'
        use: 'На каком простом можно остановить проверку.'
        src: b229
    examples:
      - title: Сумма неотрицательных
        given: 'Найдите $x + y$, если $(x - 2)^2 + |y + 1| = 0$.'
        find: '$x + y$.'
        method: 'Оба слагаемых равны нулю.'
        steps:
          - '$x - 2 = 0$, $y + 1 = 0$.'
          - '$x = 2$, $y = -1$, $x + y = 1$.'
        check: '$0 + 0 = 0$ ✓.'
        answer: '$1$'
        src: b227
      - title: Монотонность
        given: 'Решите уравнение $x^3 + x = 10$.'
        find: 'корни.'
        method: 'Левая часть строго возрастает.'
        steps:
          - '$f(x) = x^3 + x$ возрастает ($f''(x) = 3x^2 + 1 > 0$) — корень не больше одного.'
          - 'Подбор: $f(2) = 8 + 2 = 10$; $x = 2$ — единственный корень.'
        check: '$8 + 2 = 10$ ✓.'
        answer: '$x = 2$'
        src: b228
      - title: Разность квадратов в целых числах
        given: 'Найдите натуральные $x$, $y$, для которых $x^2 - y^2 = 13$.'
        find: '$(x; y)$.'
        method: '$(x - y)(x + y) = 13$, 13 — простое.'
        steps:
          - '$x - y = 1$, $x + y = 13$ (меньший множитель — $x - y$).'
          - '$x = 7$, $y = 6$.'
        check: '$49 - 36 = 13$ ✓.'
        answer: '$(7; 6)$'
        src: b229
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите $x + y$, если $\sqrt{x - 3} + (y - 4)^2 = 0$.'
        num: { value: 7, unit: '', check: '3+4' }
        hint: 'Оба слагаемых неотрицательны.'
        explain: '$x = 3$, $y = 4$.'
        f: [1]
        sol: { method: 'Сумма неотрицательных.', steps: ['$\sqrt{x - 3} = 0$, $(y - 4)^2 = 0$.', '$x = 3$, $y = 4$, сумма $7$.'], answer: '7' }
        src: b227
      - type: numeric
        cat: problem
        q: 'Решите уравнение $x^5 + x = 34$.'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Левая часть возрастает; попробуйте небольшие целые.'
        explain: '$32 + 2 = 34$; других корней нет из-за монотонности.'
        sol: { method: 'Монотонность.', steps: ['$f(x) = x^5 + x$ строго возрастает.', '$f(2) = 34$ — единственный корень.'], answer: '2' }
        src: b228
      - type: numeric
        cat: problem
        q: 'Сколько пар натуральных чисел $(x; y)$ удовлетворяют равенству $x^2 - y^2 = 15$?'
        num: { value: 2, unit: '', check: '2' }
        hint: '$(x - y)(x + y) = 15 = 1 \cdot 15 = 3 \cdot 5$.'
        explain: '$(8; 7)$ и $(4; 1)$.'
        sol: { method: 'Разложение на множители.', steps: ['$x - y = 1$, $x + y = 15$: $(8; 7)$.', '$x - y = 3$, $x + y = 5$: $(4; 1)$.'], check: '$64 - 49 = 15$, $16 - 1 = 15$.', answer: '2' }
        src: b229
      - type: numeric
        cat: problem
        q: 'Чтобы проверить, что 1009 — простое число, его делят на простые числа 2, 3, 5, 7, … На каком наибольшем простом числе можно остановиться?'
        num: { value: 31, unit: '', check: '31' }
        hint: '$\sqrt{1009} \approx 31{,}8$.'
        explain: 'Следующее простое $37 > \sqrt{1009}$; достаточно проверить до 31.'
        f: [3]
        sol: { method: 'Граница проверки простоты.', steps: ['$31^2 = 961 < 1009 < 1369 = 37^2$.', 'Последнее нужное простое — $31$.'], answer: '31' }
        src: b229
      - type: numeric
        cat: problem
        q: 'Сколько корней у уравнения $\cos x = x^2 + 1$?'
        num: { value: 1, unit: '', check: '1' }
        hint: '$\cos x \le 1 \le x^2 + 1$.'
        explain: 'Равенство только если обе части равны 1: $x = 0$, и $\cos 0 = 1$ ✓.'
        f: [2]
        sol: { method: 'Метод оценок.', steps: ['$\cos x \le 1$, $x^2 + 1 \ge 1$.', 'Нужно $x^2 + 1 = 1$ и $\cos x = 1$: $x = 0$.'], answer: '1' }
        src: b228
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\sqrt x + \sqrt{x + 5} = 5$.'
        num: { value: 4, unit: '', check: '4' }
        hint: 'Левая часть возрастает.'
        explain: '$\sqrt4 + \sqrt9 = 2 + 3 = 5$; корень единственный.'
        sol: { method: 'Монотонность.', steps: ['Сумма возрастающих функций возрастает.', 'Подбор: $x = 4$.'], answer: '4' }
        src: b228
      - type: single
        cat: theory
        q: 'Если $a^2 + b^2 = 0$ ($a$, $b$ — действительные числа), то…'
        opts: ['$a = 0$ и $b = 0$', '$a = -b$', '$a = b$', '$a = 0$ или $b = 0$']
        ans: a
        hint: 'Оба квадрата неотрицательны.'
        explain: 'Сумма неотрицательных равна нулю, только если каждое равно нулю.'
        f: [1]
        src: b227
      - type: single
        cat: theory
        q: 'Почему уравнение $x^3 + 2x + 1 = 0$ имеет не больше одного корня?'
        opts: ['левая часть строго возрастает', 'это кубическое уравнение', 'дискриминант отрицателен', 'у него нет целых корней']
        ans: a
        hint: 'Производная $3x^2 + 2 > 0$.'
        explain: 'Возрастающая функция принимает значение 0 не более одного раза. (Кубическое уравнение в общем случае может иметь три корня.)'
        src: b228
