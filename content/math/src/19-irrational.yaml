topics:
  # ───────────────────────────── 1.9.1 ─────────────────────────────
  - id: ma-1-9-1
    num: '1.9.1'
    title: Иррациональные уравнения
    pages: [b087, b088, b089, b090, b091]
    book:
      place: 'Ч. 1, 1.9 «Иррациональные уравнения и неравенства», пункт 1.9.1'
      summary: 'Книга приводит равносильные переходы: корень чётной степени $\sqrt[2n]{f} = g \iff g \ge 0,\ f = g^{2n}$; корень нечётной степени $\sqrt[2n+1]{f} = g \iff f = g^{2n+1}$. Задания — решить уравнения, найти сумму или произведение корней.'
    stage: verified
    stageNote: 'Все корни подставлены в исходные уравнения; посторонние отброшены.'
    sourcesChecked: '2026-10-25'
    web: [*sfu-irr, *os-r86, *rs-root]
    theory:
      - kind: rule
        title: Возведение в квадрат и проверка
        body: |
          - **ОДЗ**: под корнем чётной степени — неотрицательное выражение.
          - $\sqrt{f} = g \iff \begin{cases} g \ge 0, \\ f = g^2 \end{cases}$ — условие $f \ge 0$ тогда выполняется само.
          - При возведении в квадрат могут появиться **посторонние корни** (из $a = b$ следует $a^2 = b^2$, но не наоборот), поэтому корни проверяют подстановкой или по условию $g \ge 0$.
          - Корень **нечётной** степени: $\sqrt[3]{f} = g \iff f = g^3$ — без ограничений.
        src: b087
        fig: extraneous-root
      - kind: rule
        title: Приёмы
        body: |
          - **Уединение радикала**: оставить корень в одной части, остальное перенести в другую, затем возвести в квадрат. При двух корнях это делают дважды.
          - **Замена**: $x - 5\sqrt x + 6 = 0$, $t = \sqrt x \ge 0$: $t^2 - 5t + 6 = 0$.
          - **Произведение равно нулю**: $\sqrt{x - 2}\,(x - 5) = 0 \iff x = 2$ или ($x = 5$ и $x \ge 2$) — каждый множитель обращают в ноль **в пределах ОДЗ**.
          - Если ОДЗ пусто ($\sqrt{x - 4} + \sqrt{2 - x}$), корней нет.
        src: b088
    formulas:
      - title: Корень равен выражению
        tex: '\sqrt{f(x)} = g(x) \iff \begin{cases} g(x) \ge 0, \\ f(x) = g^2(x) \end{cases}'
        meaning: '$f$, $g$ — выражения с неизвестным.'
        use: 'Основной равносильный переход.'
        limits: 'Без условия $g \ge 0$ возможны посторонние корни.'
        src: b087
      - title: Равенство корней
        tex: '\sqrt{f} = \sqrt{g} \iff \begin{cases} f = g, \\ f \ge 0 \end{cases}'
        meaning: 'Достаточно проверить неотрицательность одного из выражений.'
        use: 'Уравнения $\sqrt{2x - 3} = \sqrt{x + 1}$.'
        src: b087
      - title: Корень нечётной степени
        tex: '\sqrt[2n+1]{f} = g \iff f = g^{2n+1}'
        meaning: '$n$ — натуральное; ограничений на знак нет.'
        use: '$\sqrt[3]{x - 3} = 2 \Rightarrow x - 3 = 8$.'
        src: b087
    examples:
      - title: Посторонний корень
        given: 'Решите уравнение $\sqrt{x + 2} = x$.'
        find: 'корни.'
        method: 'Условие $x \ge 0$ и возведение в квадрат.'
        steps:
          - '$x \ge 0$; $x + 2 = x^2 \Rightarrow x^2 - x - 2 = 0$.'
          - '$x = 2$ или $x = -1$; $x = -1 < 0$ — посторонний.'
        check: '$\sqrt4 = 2$ ✓; $\sqrt1 = 1 \ne -1$ ✓.'
        answer: '$x = 2$'
        src: b087
      - title: Замена переменной
        given: 'Решите уравнение $x - 5\sqrt x + 6 = 0$.'
        find: 'корни.'
        method: '$t = \sqrt x \ge 0$.'
        steps:
          - '$t^2 - 5t + 6 = 0$: $t = 2$ или $t = 3$.'
          - '$x = 4$ или $x = 9$.'
        check: '$4 - 10 + 6 = 0$; $9 - 15 + 6 = 0$ ✓.'
        answer: '$4$; $9$'
        src: b088
      - title: Два корня — дважды в квадрат
        given: 'Решите уравнение $\sqrt{x + 5} - \sqrt x = 1$.'
        find: 'корни.'
        method: 'Уединить один радикал и возвести в квадрат.'
        steps:
          - '$\sqrt{x + 5} = 1 + \sqrt x$, обе части $\ge 0$.'
          - '$x + 5 = 1 + 2\sqrt x + x \Rightarrow \sqrt x = 2 \Rightarrow x = 4$.'
        check: '$\sqrt9 - \sqrt4 = 3 - 2 = 1$ ✓.'
        answer: '$x = 4$'
        src: b088
    questions:
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\sqrt{3x + 1} = 4$.'
        num: { value: 5, unit: '', check: '(16-1)/3' }
        hint: 'Возведите в квадрат.'
        explain: '$3x + 1 = 16$, $x = 5$.'
        f: [1]
        sol: { method: 'Возведение в квадрат.', steps: ['$3x + 1 = 16$.', '$x = 5$.'], check: '$\sqrt{16} = 4$.', answer: '5' }
        src: b087
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\sqrt{x + 7} = x + 1$.'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Условие $x + 1 \ge 0$.'
        explain: '$x^2 + x - 6 = 0$: $2$ и $-3$; $-3$ посторонний ($x + 1 < 0$).'
        f: [1]
        sol: { method: 'Равносильная система.', steps: ['$x \ge -1$.', '$x + 7 = x^2 + 2x + 1 \Rightarrow x^2 + x - 6 = 0$.', '$x = 2$ подходит, $x = -3$ — нет.'], check: '$\sqrt9 = 3 = 2 + 1$.', answer: '2' }
        src: b087
      - type: numeric
        cat: problem
        q: 'Найдите произведение корней уравнения $\sqrt{x^2 - 9} = 4$.'
        num: { value: -25, unit: '', check: '5*(-5)' }
        hint: '$x^2 - 9 = 16$.'
        explain: '$x = \pm5$, произведение $-25$.'
        f: [1]
        sol: { method: 'Возведение в квадрат.', steps: ['$x^2 - 9 = 16 \Rightarrow x^2 = 25$.', '$x = \pm5$, оба подходят.', 'Произведение $-25$.'], answer: '−25' }
        src: b087
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\sqrt[3]{x - 3} = 2$.'
        num: { value: 11, unit: '', check: '8+3' }
        hint: 'Возведите в куб.'
        explain: '$x - 3 = 8$, $x = 11$.'
        f: [3]
        sol: { method: 'Корень нечётной степени.', steps: ['$x - 3 = 2^3 = 8$.', '$x = 11$.'], answer: '11' }
        src: b087
      - type: numeric
        cat: problem
        q: 'Решите уравнение $x + \sqrt x - 12 = 0$.'
        num: { value: 9, unit: '', check: '9' }
        hint: '$t = \sqrt x \ge 0$.'
        explain: '$t^2 + t - 12 = 0$: $t = 3$ (а $t = -4 < 0$ не подходит); $x = 9$.'
        sol: { method: 'Замена переменной.', steps: ['$t^2 + t - 12 = 0$: $t = 3$ или $t = -4$.', '$t \ge 0$, значит, $t = 3$, $x = 9$.'], check: '$9 + 3 - 12 = 0$.', answer: '9' }
        src: b088
      - type: numeric
        cat: problem
        q: 'Решите уравнение $\sqrt{2x - 3} = \sqrt{x + 1}$.'
        num: { value: 4, unit: '', check: '1+3' }
        hint: 'Приравняйте подкоренные выражения.'
        explain: '$2x - 3 = x + 1$, $x = 4$; $x + 1 = 5 \ge 0$.'
        f: [2]
        sol: { method: 'Равенство корней.', steps: ['$2x - 3 = x + 1 \Rightarrow x = 4$.', 'Проверка: $\sqrt5 = \sqrt5$.'], answer: '4' }
        src: b087
      - type: numeric
        cat: problem
        q: 'Найдите сумму корней уравнения $\sqrt{x - 2}\,(x - 5) = 0$.'
        num: { value: 7, unit: '', check: '2+5' }
        hint: 'Каждый множитель — ноль, но только при $x \ge 2$.'
        explain: '$x = 2$ или $x = 5$ (оба в ОДЗ); сумма $7$.'
        sol: { method: 'Произведение равно нулю в пределах ОДЗ.', steps: ['ОДЗ: $x \ge 2$.', '$\sqrt{x - 2} = 0 \Rightarrow x = 2$; $x - 5 = 0 \Rightarrow x = 5$.', 'Сумма $7$.'], answer: '7' }
        src: b088
      - type: single
        cat: theory
        q: 'Сколько корней у уравнения $\sqrt{x - 4} + \sqrt{2 - x} = 1$?'
        opts: ['ни одного', 'один', 'два', 'бесконечно много']
        ans: a
        hint: 'Найдите ОДЗ.'
        explain: 'Нужно $x \ge 4$ и $x \le 2$ одновременно — ОДЗ пусто.'
        src: b088

  # ───────────────────────────── 1.9.2 ─────────────────────────────
  - id: ma-1-9-2
    num: '1.9.2'
    title: Иррациональные неравенства
    pages: [b091, b092, b093, b094]
    book:
      place: 'Ч. 1, 1.9 «Иррациональные уравнения и неравенства», пункт 1.9.2'
      summary: 'Задания на неравенства с квадратными корнями: найти множество решений, число и сумму целых решений, наибольшее или наименьшее целое решение.'
    stage: verified
    stageNote: 'Решения проверены подстановкой пробных точек, включая граничные.'
    sourcesChecked: '2026-10-25'
    web: [*sfu-irr, *rs-root]
    theory:
      - kind: rule
        title: Корень меньше выражения
        body: |
          $$\sqrt f < g \iff \begin{cases} f \ge 0, \\ g > 0, \\ f < g^2. \end{cases}$$
          Возводить в квадрат можно, только когда обе части неотрицательны; отрицательной правой части корень меньше быть не может.
          Частный случай: $\sqrt f < a$, $a > 0$: $0 \le f < a^2$.
        src: b091
      - kind: rule
        title: Корень больше выражения
        body: |
          $\sqrt f > g$ распадается на два случая:
          - $g < 0$ и $f \ge 0$ — неравенство верно (корень неотрицателен);
          - $g \ge 0$ и $f > g^2$.
          Ответ — **объединение** решений обоих случаев. Для двух корней: $\sqrt f > \sqrt g \iff f > g \ge 0$.
        src: b092
    formulas:
      - title: Корень меньше выражения
        tex: '\sqrt{f} < g \iff \begin{cases} f \ge 0, \\ g > 0, \\ f < g^2 \end{cases}'
        meaning: 'Для нестрогого $\le$: $f \ge 0$, $g \ge 0$, $f \le g^2$.'
        use: 'Неравенства вида $\sqrt{x - 2} < 4 - x$.'
        src: b091
      - title: Корень больше выражения
        tex: '\sqrt{f} > g \iff \begin{cases} g < 0, \\ f \ge 0 \end{cases} \ \text{или}\ \begin{cases} g \ge 0, \\ f > g^2 \end{cases}'
        meaning: 'Совокупность двух систем.'
        use: 'Неравенства вида $\sqrt{x + 3} > x + 1$.'
        src: b092
      - title: Сравнение корней
        tex: '\sqrt{f} > \sqrt{g} \iff f > g \ge 0'
        meaning: 'Корень — возрастающая функция.'
        use: 'Неравенства с корнями в обеих частях.'
        src: b092
    examples:
      - title: Корень меньше числа
        given: 'Решите неравенство $\sqrt{x - 1} < 3$.'
        find: 'промежуток.'
        method: '$0 \le x - 1 < 9$.'
        steps:
          - '$x - 1 \ge 0 \Rightarrow x \ge 1$.'
          - '$x - 1 < 9 \Rightarrow x < 10$.'
        check: '$x = 1$: $0 < 3$ ✓; $x = 10$: $3 < 3$ — нет ✓.'
        answer: '$[1; 10)$'
        src: b091
      - title: Корень больше выражения
        given: 'Решите неравенство $\sqrt{x + 3} > x + 1$.'
        find: 'множество решений.'
        method: 'Два случая по знаку $x + 1$.'
        steps:
          - '$x + 1 < 0$ и $x \ge -3$: $[-3; -1)$.'
          - '$x \ge -1$: $x + 3 > x^2 + 2x + 1 \Rightarrow x^2 + x - 2 < 0 \Rightarrow -2 < x < 1$; с условием — $[-1; 1)$.'
          - 'Объединение: $[-3; 1)$.'
        check: '$x = 0$: $\sqrt3 > 1$ ✓; $x = 1$: $2 > 2$ — нет ✓; $x = -3$: $0 > -2$ ✓.'
        answer: '$[-3; 1)$'
        src: b092
      - title: Корень меньше выражения
        given: 'Решите неравенство $\sqrt{x + 2} < x$.'
        find: 'множество решений.'
        method: 'Система из трёх условий.'
        steps:
          - '$x + 2 \ge 0$, $x > 0$.'
          - '$x + 2 < x^2 \Rightarrow x^2 - x - 2 > 0 \Rightarrow x < -1$ или $x > 2$.'
          - 'С $x > 0$: $x > 2$.'
        check: '$x = 7$: $3 < 7$ ✓; $x = 1$: $\sqrt3 > 1$ — не решение ✓.'
        answer: '$(2; +\infty)$'
        src: b091
    questions:
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $\sqrt{x + 4} \le 3$?'
        num: { value: 10, unit: '', check: '5-(-4)+1' }
        hint: '$0 \le x + 4 \le 9$.'
        explain: '$-4 \le x \le 5$: десять целых.'
        f: [1]
        sol: { method: 'Корень меньше числа.', steps: ['$0 \le x + 4 \le 9$.', '$-4 \le x \le 5$.', 'Целых $10$.'], answer: '10' }
        src: b091
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее целое решение неравенства $\sqrt{2x - 1} > 3$.'
        num: { value: 6, unit: '', check: '6' }
        hint: '$2x - 1 > 9$.'
        explain: '$x > 5$; наименьшее целое $6$.'
        f: [2]
        sol: { method: 'Правая часть положительна — возводим в квадрат.', steps: ['$2x - 1 > 9 \Rightarrow x > 5$ (тогда и $2x - 1 \ge 0$).', 'Наименьшее целое $6$.'], answer: '6' }
        src: b092
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение неравенства $\sqrt{x - 2} < 4 - x$.'
        num: { value: 2, unit: '', check: '2' }
        hint: '$x \ge 2$, $x < 4$, $x - 2 < (4 - x)^2$.'
        explain: '$x^2 - 9x + 18 > 0 \Rightarrow x < 3$ или $x > 6$; с остальными условиями $[2; 3)$; ответ $2$.'
        f: [1]
        sol: { method: 'Система из трёх условий.', steps: ['$x \ge 2$ и $x < 4$.', '$x - 2 < 16 - 8x + x^2 \Rightarrow (x - 3)(x - 6) > 0$.', 'Пересечение: $[2; 3)$, наибольшее целое $2$.'], check: '$x = 2$: $0 < 2$ ✓; $x = 3$: $1 < 1$ — нет.', answer: '2' }
        src: b091
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $\sqrt{x + 1} > \sqrt{5 - x}$?'
        num: { value: 3, unit: '', check: '3' }
        hint: '$x + 1 > 5 - x \ge 0$.'
        explain: '$x > 2$ и $x \le 5$: целые $3, 4, 5$.'
        f: [3]
        sol: { method: 'Сравнение корней.', steps: ['$x + 1 > 5 - x \Rightarrow x > 2$.', '$5 - x \ge 0 \Rightarrow x \le 5$.', 'Целые $3, 4, 5$.'], answer: '3' }
        src: b092
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $(x - 3)\sqrt{x - 1} \le 0$?'
        num: { value: 3, unit: '', check: '3' }
        hint: 'Корень неотрицателен; рассмотрите $x = 1$ отдельно.'
        explain: 'ОДЗ $x \ge 1$; при $x = 1$ — ноль; при $x > 1$ нужно $x - 3 \le 0$. Решение $[1; 3]$: целые $1, 2, 3$.'
        sol: { method: 'Знак произведения с корнем.', steps: ['ОДЗ: $x \ge 1$.', '$x = 1$: $0 \le 0$ ✓.', '$x > 1$: $\sqrt{x - 1} > 0$, значит, $x \le 3$.', 'Целые $1, 2, 3$.'], answer: '3' }
        src: b093
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение неравенства $\sqrt{6 - x} > x$.'
        num: { value: 1, unit: '', check: '1' }
        hint: 'Два случая: $x < 0$ и $x \ge 0$.'
        explain: '$x < 0$ — подходит всё; $x \ge 0$: $x^2 + x - 6 < 0 \Rightarrow 0 \le x < 2$. Итого $x < 2$, наибольшее целое $1$.'
        f: [2]
        sol: { method: 'Корень больше выражения.', steps: ['$x < 0$ (и $x \le 6$): все такие $x$.', '$x \ge 0$: $6 - x > x^2 \Rightarrow -3 < x < 2$, то есть $[0; 2)$.', 'Объединение $(-\infty; 2)$, наибольшее целое $1$.'], check: '$x = 1$: $\sqrt5 > 1$ ✓; $x = 2$: $2 > 2$ — нет.', answer: '1' }
        src: b092
      - type: single
        cat: theory
        q: 'Решения неравенства $\sqrt{x - 3} < -1$:'
        opts: ['решений нет', '$x \ge 3$', '$x < 4$', '$3 \le x < 4$']
        ans: a
        hint: 'Корень неотрицателен.'
        explain: '$\sqrt{x - 3} \ge 0 > -1$ — неравенство невозможно.'
        f: [1]
        src: b091
      - type: single
        cat: theory
        q: 'Решения неравенства $\sqrt{x + 5} > -2$:'
        opts: ['$x \ge -5$', 'любое $x$', '$x > -1$', 'решений нет']
        ans: a
        hint: 'Неравенство верно везде, где корень определён.'
        explain: 'Корень неотрицателен и всегда больше $-2$; остаётся ОДЗ $x \ge -5$.'
        f: [2]
        src: b092
