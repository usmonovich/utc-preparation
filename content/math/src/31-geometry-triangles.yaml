        explain: '$53^\circ$.'
        f: [1]
        sol: { method: 'Сумма углов.', steps: ['$90^\circ - 37^\circ = 53^\circ$.'], answer: '53°' }
        src: b238
      - type: numeric
        cat: problem
        q: 'Внешний угол при вершине $C$ треугольника $ABC$ равен $130^\circ$, а угол $A$ на $20^\circ$ больше угла $B$. Найдите угол $A$.'
        num: { value: 75, unit: '°', check: '(130+20)/2' }
        hint: '$\angle A + \angle B = 130^\circ$.'
        explain: '$2\angle B + 20^\circ = 130^\circ$, $\angle B = 55^\circ$, $\angle A = 75^\circ$.'
        f: [2]
