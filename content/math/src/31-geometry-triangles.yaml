  # ───────────────────────────── 3.3.5 ─────────────────────────────
  - id: ma-3-3-5
    subsection: ma-3-3
    num: '3.3.5'
    title: Свойства высоты треугольника
    pages: [b243, b244]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.5'
      summary: 'Задания на высоты треугольника: через площадь, в прямоугольном, равнобедренном и равностороннем треугольниках, отношение высот.'
    stage: verified
    stageNote: 'Высоты пересчитаны через площадь (формула Герона).'
    sourcesChecked: '2026-10-25'
    web: [*lyc, *cm-103]
    theory:
      - kind: law
        title: Высота и площадь
        body: |
          $S = \frac12 a h_a = \frac12 b h_b = \frac12 c h_c$, поэтому $h_a = \frac{2S}{a}$: высоты **обратно пропорциональны** сторонам, к которым проведены ($a h_a = b h_b$). Наименьшая высота — к наибольшей стороне.
          - Прямоугольный треугольник: высота к гипотенузе $h = \frac{ab}{c}$.
          - Равносторонний треугольник со стороной $a$: $h = \frac{a\sqrt3}{2}$.
          - Три высоты (или их продолжения) пересекаются в одной точке — **ортоцентре**.
        src: b243
    formulas:
      - title: Высота через площадь
        tex: 'h_a = \frac{2S}{a},\qquad a h_a = b h_b = c h_c = 2S'
        meaning: '$S$ — площадь, $a$ — сторона, к которой проведена высота.'
        use: 'Нахождение высот и их отношений.'
        src: b243
      - title: Высота равностороннего треугольника
        tex: 'h = \frac{a\sqrt3}{2}'
        meaning: '$a$ — сторона.'
        use: 'Равносторонний треугольник.'
        src: b244
    examples:
      - title: Треугольник 13, 14, 15
        given: 'Стороны 13, 14, 15. Найдите высоту к стороне 14.'
        find: '$h$.'
        method: 'Площадь по формуле Герона.'
        steps:
          - '$p = 21$, $S = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = 84$.'
          - '$h = \frac{2 \cdot 84}{14} = 12$.'
        check: 'Высота 12 делит сторону 14 на 5 и 9: $5^2 + 12^2 = 13^2$, $9^2 + 12^2 = 15^2$ ✓.'
        answer: '$12$'
        src: b243
      - title: Прямоугольный треугольник
        given: 'Катеты 3 и 4. Найдите высоту к гипотенузе.'
        find: '$h$.'
        method: '$h = \frac{ab}{c}$.'
        steps:
          - '$c = 5$.'
          - '$h = \frac{12}{5} = 2{,}4$.'
        check: '$S = 6 = \frac12 \cdot 5 \cdot 2{,}4$ ✓.'
        answer: '$2{,}4$'
        src: b244
      - title: Равнобедренный треугольник
        given: 'Стороны 10, 10, 12. Найдите высоту к боковой стороне.'
        find: '$h$.'
        method: 'Сначала площадь через высоту к основанию.'
        steps:
          - 'Высота к основанию $\sqrt{100 - 36} = 8$, $S = \frac12 \cdot 12 \cdot 8 = 48$.'
          - '$h = \frac{2 \cdot 48}{10} = 9{,}6$.'
        check: '$12 \cdot 8 = 10 \cdot 9{,}6 = 96$ ✓.'
        answer: '$9{,}6$'
        src: b244
    questions:
      - type: numeric
        cat: problem
        q: 'Площадь треугольника 30, одна из сторон 12. Найдите высоту к этой стороне.'
        num: { value: 5, unit: '', check: '60/12' }
        hint: '$h = \frac{2S}{a}$.'
        explain: '$\frac{60}{12} = 5$.'
        f: [1]
        sol: { method: 'Высота через площадь.', steps: ['$h = \frac{2 \cdot 30}{12} = 5$.'], answer: '5' }
        src: b243
      - type: numeric
        cat: problem
        q: 'Стороны треугольника 6 и 9, высота к стороне 6 равна 12. Найдите высоту к стороне 9.'
        num: { value: 8, unit: '', check: '6*12/9' }
        hint: '$a h_a = b h_b$.'
        explain: '$\frac{72}{9} = 8$.'
        f: [1]
        sol: { method: 'Обратная пропорциональность.', steps: ['$6 \cdot 12 = 9 \cdot h$.', '$h = 8$.'], answer: '8' }
        src: b243
      - type: numeric
        cat: problem
        q: 'Катеты 5 и 12. Найдите высоту к гипотенузе (с точностью до 0,01).'
        num: { value: 4.6154, unit: '', tolAbs: 0.01, check: '60/13' }
