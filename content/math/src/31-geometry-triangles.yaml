        body: |
          $$c^2 = a^2 + b^2 - 2ab\cos C.$$
          Обобщает теорему Пифагора ($C = 90^\circ$). По знаку $a^2 + b^2 - c^2$ определяют вид угла $C$: $> 0$ — острый, $= 0$ — прямой, $< 0$ — тупой (против наибольшей стороны — наибольший угол).
        src: b242
      - kind: law
        title: Теорема синусов
        body: |
          $$\frac{a}{\sin A} = \frac{b}{\sin B} = \frac{c}{\sin C} = 2R,$$
          где $R$ — радиус описанной окружности. Против большей стороны лежит больший угол.
        src: b242
    formulas:
      - title: Теорема косинусов
        tex: 'c^2 = a^2 + b^2 - 2ab\cos C'
        meaning: '$C$ — угол между сторонами $a$ и $b$.'
        use: 'Сторона по двум сторонам и углу; угол по трём сторонам.'
        src: b242
      - title: Теорема синусов
        tex: '\frac{a}{\sin A} = \frac{b}{\sin B} = \frac{c}{\sin C} = 2R'
        meaning: '$R$ — радиус описанной окружности.'
        use: 'Сторона по стороне и двум углам; радиус описанной окружности.'
        src: b242
    examples:
      - title: Сторона по углу 60°
        given: '$a = 5$, $b = 8$, $\angle C = 60^\circ$. Найдите $c$.'
        find: '$c$.'
        method: 'Теорема косинусов.'
        steps:
          - '$c^2 = 25 + 64 - 2 \cdot 5 \cdot 8 \cdot \frac12 = 49$.'
          - '$c = 7$.'
        check: 'Численно $\sqrt{89 - 40} = 7$ ✓.'
        answer: '$7$'
        src: b242
      - title: Радиус описанной окружности
        given: 'В треугольнике сторона 10 лежит против угла $30^\circ$. Найдите $R$.'
        find: '$R$.'
        method: 'Теорема синусов.'
        steps:
          - '$2R = \frac{10}{\sin 30^\circ} = 20$.'
          - '$R = 10$.'
        check: '$\frac{10}{0{,}5} = 20$ ✓.'
        answer: '$10$'
        src: b242
      - title: Наибольший угол
        given: 'Стороны треугольника 7, 8, 13. Найдите наибольший угол.'
        find: 'угол.'
        method: 'Против стороны 13; теорема косинусов.'
        steps:
          - '$\cos C = \frac{49 + 64 - 169}{2 \cdot 7 \cdot 8} = \frac{-56}{112} = -\frac12$.'
          - '$C = 120^\circ$.'
        check: '$\arccos(-0{,}5) = 120^\circ$ ✓.'
        answer: '$120^\circ$'
        src: b243
    questions:
      - type: numeric
        cat: problem
        q: '$a = 3$, $b = 5$, $\angle C = 120^\circ$. Найдите $c$.'
        num: { value: 7, unit: '', check: 'Math.sqrt(9+25-2*3*5*Math.cos(2*Math.PI/3))' }
        hint: '$\cos 120^\circ = -\frac12$.'
        explain: '$c^2 = 9 + 25 + 15 = 49$.'
        f: [1]
        sol: { method: 'Теорема косинусов.', steps: ['$c^2 = 34 - 30 \cdot (-0{,}5) = 49$.', '$c = 7$.'], answer: '7' }
        src: b242
      - type: numeric
        cat: problem
        q: '$a = 6$, $\angle A = 30^\circ$, $\angle B = 45^\circ$. Найдите $b$ (с точностью до 0,01).'
        num: { value: 8.4853, unit: '', tolAbs: 0.01, check: '6*Math.sin(Math.PI/4)/Math.sin(Math.PI/6)' }
        hint: '$b = \frac{a\sin B}{\sin A}$.'
        explain: '$\frac{6 \cdot \frac{\sqrt2}2}{\frac12} = 6\sqrt2 \approx 8{,}49$.'
        f: [2]
        sol: { method: 'Теорема синусов.', steps: ['$b = \frac{6\sin 45^\circ}{\sin 30^\circ} = 6\sqrt2 \approx 8{,}49$.'], answer: '6√2 ≈ 8,49' }
        src: b242
      - type: numeric
        cat: problem
        q: 'Сторона 12 лежит против угла $150^\circ$. Найдите радиус описанной окружности.'
        num: { value: 12, unit: '', check: '12/(2*Math.sin(5*Math.PI/6))' }
        hint: '$\sin 150^\circ = \frac12$.'
        explain: '$2R = 24$, $R = 12$.'
        f: [2]
        sol: { method: 'Теорема синусов.', steps: ['$2R = \frac{12}{0{,}5} = 24$.', '$R = 12$.'], answer: '12' }
        src: b242
      - type: numeric
        cat: problem
        q: 'Стороны треугольника 3, 5, 7. Найдите наибольший угол (в градусах).'
        num: { value: 120, unit: '°', check: 'Math.acos((9+25-49)/30)*180/Math.PI' }
