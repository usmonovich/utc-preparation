        q: 'Катет, лежащий против угла $30^\circ$, равен 7. Найдите гипотенузу.'
        num: { value: 14, unit: '', check: '7/0.5' }
        hint: 'Катет — половина гипотенузы.'
        explain: '$14$.'
        f: [3]
        sol: { method: 'Катет против $30^\circ$.', steps: ['$c = 2 \cdot 7 = 14$.'], answer: '14' }
        src: b240
      - type: numeric
        cat: problem
        q: 'Катет 6, гипотенуза 9. Найдите проекцию этого катета на гипотенузу.'
