        sol: { method: 'Высота к гипотенузе.', steps: ['$c = 10$.', '$h = \frac{48}{10} = 4{,}8$.'], answer: '4,8' }
        src: b241
      - type: numeric
        cat: problem
        q: 'Гипотенуза 15, $\cos A = 0{,}6$. Найдите катет, прилежащий к углу $A$.'
        num: { value: 9, unit: '', check: '15*0.6' }
        hint: '$b = c\cos A$.'
        explain: '$15 \cdot 0{,}6 = 9$.'
        f: [3]
