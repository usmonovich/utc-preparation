        explain: '$c^2 = 16 + 16 - 16 = 16$.'
        f: [1]
        sol: { method: 'Теорема косинусов.', steps: ['$c^2 = 32 - 2 \cdot 16 \cdot \frac12 = 16$.', '$c = 4$.'], answer: '4' }
        src: b242
      - type: numeric
        cat: problem
        q: 'В треугольнике $a = 8$, $\angle A = 45^\circ$. Найдите радиус описанной окружности (с точностью до 0,01).'
        num: { value: 5.6569, unit: '', tolAbs: 0.01, check: '8/(2*Math.sin(Math.PI/4))' }
        hint: '$2R = \frac{a}{\sin A}$.'
