  # ───────────────────────────── 3.3.2 ─────────────────────────────
  - id: ma-3-3-2
    subsection: ma-3-3
    num: '3.3.2'
    title: Сумма углов треугольника
    pages: [b238, b239, b240]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.2'
      summary: 'Задания на сумму углов треугольника, внешний угол, углы равнобедренного треугольника и угол между биссектрисами.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-103, *lyc]
    theory:
      - kind: law
        title: Сумма углов и внешний угол
        body: |
          - Сумма углов треугольника $180^\circ$ (доказательство — через прямую, параллельную стороне, и накрест лежащие углы).
          - **Внешний угол** (смежный с углом треугольника) равен сумме двух углов, не смежных с ним.
          - Сумма внешних углов (по одному при каждой вершине) $360^\circ$.
          - В равнобедренном треугольнике углы при основании равны; в равностороннем все углы по $60^\circ$.
        src: b238
        fig: triangle-sum
      - kind: rule
        title: Угол между биссектрисами
        body: |
          Биссектрисы углов $A$ и $B$ треугольника пересекаются под углом
          $$\angle AIB = 180^\circ - \frac{\angle A + \angle B}{2} = 90^\circ + \frac{\angle C}{2}.$$
        src: b239
    formulas:
      - title: Сумма углов треугольника
        tex: '\angle A + \angle B + \angle C = 180^\circ'
        meaning: 'Для любого треугольника на плоскости.'
        use: 'Нахождение неизвестного угла.'
        src: b238
      - title: Внешний угол
        tex: '\angle_{\text{внеш}}(C) = \angle A + \angle B'
        meaning: 'Внешний угол при вершине $C$.'
        use: 'Задачи с внешними углами.'
        src: b238
      - title: Угол между биссектрисами двух углов
        tex: '\angle AIB = 90^\circ + \frac{\angle C}{2}'
        meaning: '$I$ — точка пересечения биссектрис углов $A$ и $B$.'
        use: 'Быстрое нахождение угла между биссектрисами.'
        src: b239
    examples:
      - title: Углы в отношении
        given: 'Углы треугольника относятся как $2 : 3 : 4$. Найдите их.'
        find: 'углы.'
        method: 'Сумма $180^\circ$.'
        steps:
          - '$9x = 180^\circ$, $x = 20^\circ$.'
          - '$40^\circ$, $60^\circ$, $80^\circ$.'
        check: '$40 + 60 + 80 = 180$ ✓.'
        answer: '$40^\circ, 60^\circ, 80^\circ$'
        src: b238
      - title: Внешний угол
        given: 'Внешний угол треугольника $120^\circ$, один из не смежных с ним углов $50^\circ$. Найдите другой.'
        find: 'угол.'
        method: 'Внешний угол равен сумме двух не смежных.'
        steps:
          - '$120^\circ = 50^\circ + x$.'
          - '$x = 70^\circ$.'
        check: 'Третий угол $60^\circ$: $50 + 70 + 60 = 180$ ✓.'
        answer: '$70^\circ$'
        src: b238
      - title: Равнобедренный треугольник
        given: 'Угол при вершине равнобедренного треугольника $40^\circ$. Найдите углы при основании.'
        find: 'углы.'
        method: 'Углы при основании равны.'
        steps:
          - '$2x + 40^\circ = 180^\circ$.'
          - '$x = 70^\circ$.'
        check: '$70 + 70 + 40 = 180$ ✓.'
        answer: '$70^\circ$ и $70^\circ$'
        src: b239
    questions:
      - type: numeric
        cat: problem
        q: 'Углы треугольника равны $x$, $2x$ и $3x$. Найдите наибольший.'
        num: { value: 90, unit: '°', check: '180/6*3' }
