  # ───────────────────────────── 3.3.3 ─────────────────────────────
  - id: ma-3-3-3
    subsection: ma-3-3
    num: '3.3.3'
    title: Прямоугольный треугольник
    pages: [b240, b241, b242]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.3'
      summary: 'Задания на теорему Пифагора, синус, косинус и тангенс острого угла, катет против угла 30°, высоту и медиану к гипотенузе.'
    stage: verified
    stageNote: 'Ответы пересчитаны; тройки сторон проверены теоремой Пифагора.'
    sourcesChecked: '2026-10-25'
    web: [*cm-103, *cm-108, *lyc]
    theory:
      - kind: law
        title: Теорема Пифагора и тригонометрия острого угла
        body: |
          В прямоугольном треугольнике с катетами $a$, $b$ и гипотенузой $c$: $c^2 = a^2 + b^2$.
          Для острого угла $\alpha$: $\sin\alpha = \frac{\text{противолежащий катет}}{c}$, $\cos\alpha = \frac{\text{прилежащий катет}}{c}$, $\operatorname{tg}\alpha = \frac{\text{противолежащий}}{\text{прилежащий}}$.
          Катет против угла $30^\circ$ равен половине гипотенузы.
        src: b240
      - kind: law
        title: Медиана и высота к гипотенузе
        body: |
          - Медиана к гипотенузе равна её половине (центр описанной окружности — середина гипотенузы).
          - Высота $h$ делит гипотенузу на проекции катетов $p$ и $q$: $h^2 = pq$, $a^2 = cp$, $b^2 = cq$; $h = \frac{ab}{c}$.
        src: b241
    formulas:
      - title: Теорема Пифагора
        tex: 'c^2 = a^2 + b^2'
        meaning: '$a$, $b$ — катеты, $c$ — гипотенуза.'
        use: 'Нахождение стороны прямоугольного треугольника.'
        src: b240
      - title: Высота к гипотенузе
        tex: 'h = \frac{ab}{c},\qquad h^2 = pq,\qquad a^2 = cp'
        meaning: '$p$, $q$ — проекции катетов $a$, $b$ на гипотенузу.'
        use: 'Задачи на высоту и проекции.'
        src: b241
      - title: Синус и косинус острого угла
        tex: '\sin\alpha = \frac{a}{c},\qquad \cos\alpha = \frac{b}{c},\qquad \operatorname{tg}\alpha = \frac ab'
        meaning: '$a$ — катет против $\alpha$, $b$ — прилежащий катет.'
        use: 'Стороны по углу и наоборот.'
        src: b240
    examples:
      - title: Египетский треугольник
        given: 'Катеты 6 и 8. Найдите гипотенузу.'
        find: '$c$.'
        method: 'Теорема Пифагора.'
        steps:
          - '$c^2 = 36 + 64 = 100$.'
          - '$c = 10$.'
        check: '$6 : 8 : 10 = 3 : 4 : 5$ ✓.'
        answer: '$10$'
        src: b240
      - title: Угол 30°
        given: 'Гипотенуза 10, один из углов $30^\circ$. Найдите катеты.'
        find: 'катеты.'
        method: 'Катет против $30^\circ$ — половина гипотенузы.'
        steps:
          - 'Катет против $30^\circ$: $5$.'
          - 'Второй: $\sqrt{100 - 25} = 5\sqrt3$.'
        check: '$\cos 30^\circ = \frac{5\sqrt3}{10} = \frac{\sqrt3}2$ ✓.'
        answer: '$5$ и $5\sqrt3$'
        src: b240
      - title: Высота по проекциям
        given: 'Высота к гипотенузе делит её на отрезки 4 и 9. Найдите высоту.'
        find: '$h$.'
        method: '$h^2 = pq$.'
        steps:
          - '$h^2 = 4 \cdot 9 = 36$.'
          - '$h = 6$.'
        check: 'Катеты $\sqrt{4 \cdot 13}$ и $\sqrt{9 \cdot 13}$, $h = \frac{ab}{c} = \frac{\sqrt{52 \cdot 117}}{13} = 6$ ✓.'
        answer: '$6$'
        src: b241
    questions:
      - type: numeric
        cat: problem
        q: 'Гипотенуза 13, один катет 5. Найдите другой катет.'
        num: { value: 12, unit: '', check: 'Math.sqrt(169-25)' }
        hint: '$\sqrt{169 - 25}$.'
        explain: '$12$.'
        f: [1]
        sol: { method: 'Теорема Пифагора.', steps: ['$\sqrt{169 - 25} = \sqrt{144} = 12$.'], answer: '12' }
        src: b240
      - type: numeric
        cat: problem
        q: 'Катеты 6 и 8. Найдите медиану, проведённую к гипотенузе.'
        num: { value: 5, unit: '', check: '10/2' }
        hint: 'Половина гипотенузы.'
        explain: 'Гипотенуза 10, медиана 5.'
        sol: { method: 'Свойство медианы к гипотенузе.', steps: ['$c = 10$.', '$m = 5$.'], answer: '5' }
        src: b241
      - type: numeric
