topics:
  # ───────────────────────────── 3.1 ─────────────────────────────
  - id: ma-3-1
    num: '3.1'
    title: Угол. Расстояние
    pages: [b235, b236]
    book:
      place: 'Ч. 2, раздел «Геометрия», пункт 3.1 (в книге напечатан как «1 Угол. Расстояние.»)'
      summary: 'Задания на смежные и вертикальные углы, биссектрису угла, углы между стрелками часов и расстояние от точки до прямой.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-102, *lyc]
    theory:
      - kind: definition
        title: Смежные и вертикальные углы
        body: |
          - **Смежные** углы имеют общую сторону, а две другие стороны образуют прямую: их сумма $180^\circ$.
          - **Вертикальные** углы образованы продолжениями сторон друг друга: они **равны**.
          - При пересечении двух прямых получаются две пары вертикальных углов $\alpha$ и $180^\circ - \alpha$.
          - **Биссектриса** делит угол пополам; биссектрисы смежных углов перпендикулярны.
        src: b235
      - kind: definition
        title: Расстояние
        body: |
          **Расстояние от точки до прямой** — длина перпендикуляра, опущенного из точки на прямую (это кратчайший из отрезков от точки до прямой). Расстояние между параллельными прямыми — расстояние от любой точки одной прямой до другой.
          Угол между часовой и минутной стрелками: минутная проходит $6^\circ$ в минуту, часовая — $30^\circ$ в час ($0{,}5^\circ$ в минуту).
        src: b236
    formulas:
      - title: Смежные и вертикальные углы
        tex: '\alpha + \beta = 180^\circ\ \text{(смежные)},\qquad \alpha = \alpha''\ \text{(вертикальные)}'
        meaning: '$\alpha$, $\beta$ — смежные углы, $\alpha''$ — вертикальный к $\alpha$.'
        use: 'Задачи на углы при пересечении прямых.'
        src: b235
      - title: Угол между биссектрисами смежных углов
        tex: '\frac{\alpha}{2} + \frac{180^\circ - \alpha}{2} = 90^\circ'
        meaning: '$\alpha$ — один из смежных углов.'
        use: 'Биссектрисы смежных углов всегда перпендикулярны.'
        src: b235
    examples:
      - title: Разность смежных углов
        given: 'Один из смежных углов на $40^\circ$ больше другого. Найдите углы.'
        find: 'углы.'
        method: 'Сумма смежных углов $180^\circ$.'
        steps:
          - '$x + (x + 40^\circ) = 180^\circ \Rightarrow x = 70^\circ$.'
          - 'Углы $70^\circ$ и $110^\circ$.'
        check: '$70 + 110 = 180$, $110 - 70 = 40$ ✓.'
        answer: '$70^\circ$ и $110^\circ$'
        src: b235
      - title: Вертикальные углы
        given: 'Сумма двух вертикальных углов $100^\circ$. Найдите все углы, образованные при пересечении прямых.'
        find: 'углы.'
        method: 'Вертикальные равны, смежные дают $180^\circ$.'
        steps:
          - 'Каждый вертикальный угол $50^\circ$.'
          - 'Смежные с ними — по $130^\circ$.'
        check: '$50 + 130 + 50 + 130 = 360$ ✓.'
        answer: '$50^\circ, 130^\circ, 50^\circ, 130^\circ$'
        src: b235
      - title: Часы
        given: 'Найдите угол между стрелками часов в 4:00.'
        find: 'угол.'
        method: 'Между соседними делениями часов $30^\circ$.'
        steps:
          - 'Часовая стрелка на 4, минутная на 12.'
          - '$4 \cdot 30^\circ = 120^\circ$.'
        check: 'Весь циферблат $12 \cdot 30^\circ = 360^\circ$ ✓.'
        answer: '$120^\circ$'
        src: b236
    questions:
      - type: numeric
        cat: problem
        q: 'Смежные углы относятся как $2 : 7$. Найдите больший угол (в градусах).'
        num: { value: 140, unit: '°', check: '180/9*7' }
        hint: '$2x + 7x = 180^\circ$.'
        explain: '$x = 20^\circ$, больший $140^\circ$.'
        f: [1]
        sol: { method: 'Сумма смежных углов.', steps: ['$9x = 180^\circ$, $x = 20^\circ$.', 'Больший угол $140^\circ$.'], answer: '140°' }
        src: b235
      - type: numeric
        cat: problem
        q: 'Сумма трёх углов, образованных при пересечении двух прямых, равна $260^\circ$. Найдите меньший из углов.'
        num: { value: 80, unit: '°', check: '180-(360-260)' }
        hint: 'Четвёртый угол $360^\circ - 260^\circ$.'
        explain: 'Четвёртый угол $100^\circ$, смежный с ним $80^\circ$.'
        f: [1]
        sol: { method: 'Вертикальные и смежные углы.', steps: ['Четвёртый угол $100^\circ$.', 'Углы: $100^\circ$, $80^\circ$, $100^\circ$, $80^\circ$; меньший $80^\circ$.'], answer: '80°' }
        src: b235
      - type: numeric
        cat: problem
        q: 'Один из смежных углов в 4 раза больше другого. Найдите меньший угол.'
        num: { value: 36, unit: '°', check: '180/5' }
        hint: '$x + 4x = 180^\circ$.'
        explain: '$36^\circ$.'
        f: [1]
        sol: { method: 'Сумма смежных углов.', steps: ['$5x = 180^\circ$, $x = 36^\circ$.'], answer: '36°' }
        src: b235
      - type: numeric
        cat: problem
        q: 'Найдите угол между биссектрисами двух смежных углов.'
        num: { value: 90, unit: '°', check: '180/2' }
        hint: 'Половина развёрнутого угла.'
        explain: '$\frac{180^\circ}{2} = 90^\circ$.'
        f: [2]
        sol: { method: 'Свойство биссектрис смежных углов.', steps: ['$\frac\alpha2 + \frac{180^\circ - \alpha}{2} = 90^\circ$.'], answer: '90°' }
        src: b235
      - type: numeric
        cat: problem
        q: 'Найдите угол (в градусах) между стрелками часов в 3:30.'
        num: { value: 75, unit: '°', check: '30*6-(3*30+30*0.5)' }
        hint: 'За 30 минут часовая стрелка сдвигается на $15^\circ$.'
        explain: 'Часовая: $90^\circ + 15^\circ = 105^\circ$, минутная: $180^\circ$; разность $75^\circ$.'
        sol: { method: 'Положения стрелок.', steps: ['Минутная: $30 \cdot 6^\circ = 180^\circ$.', 'Часовая: $3 \cdot 30^\circ + 30 \cdot 0{,}5^\circ = 105^\circ$.', '$180^\circ - 105^\circ = 75^\circ$.'], answer: '75°' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Найдите угол, дополняющий угол $35^\circ$ до прямого.'
        num: { value: 55, unit: '°', check: '90-35' }
        hint: 'Прямой угол $90^\circ$.'
        explain: '$90^\circ - 35^\circ = 55^\circ$.'
        sol: { method: 'Дополнительный угол.', steps: ['$90^\circ - 35^\circ = 55^\circ$.'], answer: '55°' }
        src: b235
      - type: single
        cat: theory
        q: 'Вертикальные углы…'
        opts: ['равны', 'в сумме дают $180^\circ$', 'в сумме дают $90^\circ$', 'всегда прямые']
        ans: a
        hint: 'Оба смежны с одним и тем же углом.'
        explain: 'Каждый равен $180^\circ$ минус общий смежный угол.'
        f: [1]
        src: b235
      - type: single
        cat: theory
        q: 'Что называют расстоянием от точки до прямой?'
        opts: ['длину перпендикуляра из точки на прямую', 'длину любого отрезка до прямой', 'длину наклонной', 'расстояние до ближайшей отмеченной точки']
        ans: a
        hint: 'Кратчайший отрезок.'
        explain: 'Перпендикуляр короче любой наклонной.'
        src: b236

  # ───────────────────────────── 3.2 ─────────────────────────────
  - id: ma-3-2
    subsection: ma-3-2
    num: '3.2'
    title: Параллельные прямые
    pages: [b236, b237]
    book:
      place: 'Ч. 2, раздел «Геометрия», пункт 3.2'
      summary: 'Задания на углы, образованные двумя параллельными прямыми и секущей.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-102, *lyc]
    theory:
      - kind: law
        title: Углы при параллельных прямых и секущей
        body: |
          Если две параллельные прямые пересечены секущей, то:
          - **накрест лежащие** углы равны;
          - **соответственные** углы равны;
          - **односторонние** углы в сумме дают $180^\circ$.
          Верно и обратное (признаки параллельности): если накрест лежащие углы равны (или соответственные равны, или односторонние в сумме $180^\circ$), прямые параллельны.
          Все восемь углов принимают только два значения: $\alpha$ и $180^\circ - \alpha$.
        src: b236
    formulas:
      - title: Углы при параллельных
        tex: '\angle_{\text{накр}} = \angle_{\text{накр}}'',\quad \angle_{\text{соотв}} = \angle_{\text{соотв}}'',\quad \angle_{\text{одност}} + \angle_{\text{одност}}'' = 180^\circ'
        meaning: 'Прямые параллельны, углы образованы секущей.'
        use: 'Нахождение углов; признаки параллельности.'
        src: b236
    examples:
      - title: Все углы по одному
        given: 'Параллельные прямые пересечены секущей, один из углов $65^\circ$. Найдите остальные.'
        find: 'углы.'
        method: 'Только два значения.'
        steps:
          - 'Четыре угла равны $65^\circ$.'
          - 'Четыре — $180^\circ - 65^\circ = 115^\circ$.'
        check: 'Односторонние: $65 + 115 = 180$ ✓.'
        answer: 'четыре угла по $65^\circ$ и четыре по $115^\circ$'
        src: b236
      - title: Односторонние углы
        given: 'Односторонние углы при параллельных прямых относятся как $4 : 5$. Найдите их.'
        find: 'углы.'
        method: 'Сумма $180^\circ$.'
        steps:
          - '$9x = 180^\circ \Rightarrow x = 20^\circ$.'
          - '$80^\circ$ и $100^\circ$.'
        check: '$80 + 100 = 180$ ✓.'
        answer: '$80^\circ$ и $100^\circ$'
        src: b236
      - title: Биссектрисы односторонних углов
        given: 'Найдите угол между биссектрисами односторонних углов при параллельных прямых.'
        find: 'угол.'
        method: 'Сумма углов треугольника, образованного биссектрисами и секущей.'
        steps:
          - 'Половины углов: $\frac\alpha2 + \frac{180^\circ - \alpha}{2} = 90^\circ$.'
          - 'Третий угол треугольника $180^\circ - 90^\circ = 90^\circ$.'
        check: 'Не зависит от $\alpha$ ✓.'
        answer: '$90^\circ$'
        src: b237
    questions:
      - type: numeric
        cat: problem
        q: 'Односторонние углы при параллельных прямых отличаются на $30^\circ$. Найдите больший.'
        num: { value: 105, unit: '°', check: '(180+30)/2' }
        hint: '$x + (x - 30^\circ) = 180^\circ$.'
        explain: '$105^\circ$ и $75^\circ$.'
        f: [1]
        sol: { method: 'Сумма односторонних углов.', steps: ['$2x - 30^\circ = 180^\circ$.', '$x = 105^\circ$.'], answer: '105°' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Сумма двух накрест лежащих углов при параллельных прямых равна $140^\circ$. Найдите каждый из них.'
        num: { value: 70, unit: '°', check: '140/2' }
        hint: 'Накрест лежащие углы равны.'
        explain: '$70^\circ$.'
        f: [1]
        sol: { method: 'Равенство накрест лежащих.', steps: ['$2x = 140^\circ$, $x = 70^\circ$.'], answer: '70°' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Соответственные углы при параллельных прямых равны $3x + 10^\circ$ и $5x - 30^\circ$. Найдите угол.'
        num: { value: 70, unit: '°', check: '3*20+10' }
        hint: 'Приравняйте.'
        explain: '$x = 20$, угол $70^\circ$.'
        f: [1]
        sol: { method: 'Равенство соответственных.', steps: ['$3x + 10 = 5x - 30 \Rightarrow x = 20$.', 'Угол $70^\circ$.'], answer: '70°' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Сколько различных значений принимают 8 углов, образованных двумя параллельными прямыми и секущей, не перпендикулярной им?'
        num: { value: 2, unit: '', check: '2' }
        hint: 'Острые равны между собой, тупые — тоже.'
        explain: 'Два значения: $\alpha$ и $180^\circ - \alpha$.'
        sol: { method: 'Свойства углов.', steps: ['Все острые углы равны, все тупые равны.', 'Два значения.'], answer: '2' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Найдите сумму всех восьми углов, образованных двумя параллельными прямыми и секущей.'
        num: { value: 720, unit: '°', check: '2*360' }
        hint: 'Две точки пересечения, около каждой — $360^\circ$.'
        explain: '$2 \cdot 360^\circ = 720^\circ$.'
        sol: { method: 'Полные углы.', steps: ['Вокруг каждой точки пересечения $360^\circ$.', 'Всего $720^\circ$.'], answer: '720°' }
        src: b236
      - type: numeric
        cat: problem
        q: 'Найдите угол между биссектрисами односторонних углов при параллельных прямых.'
        num: { value: 90, unit: '°', check: '180-90' }
        hint: 'Сумма половин односторонних углов $90^\circ$.'
        explain: 'Угол между биссектрисами $90^\circ$.'
        sol: { method: 'Сумма углов треугольника.', steps: ['$\frac{180^\circ}{2} = 90^\circ$ — сумма двух углов треугольника.', 'Третий угол $90^\circ$.'], answer: '90°' }
        src: b237
      - type: single
        cat: theory
        q: 'Какое утверждение — признак параллельности прямых?'
        opts: ['накрест лежащие углы равны', 'односторонние углы равны', 'соответственные углы в сумме $180^\circ$', 'вертикальные углы равны']
        ans: a
        hint: 'Односторонние в сумме $180^\circ$, а не равны.'
        explain: 'Равенство накрест лежащих углов гарантирует параллельность.'
        f: [1]
        src: b236
      - type: single
        cat: theory
        q: 'Односторонние углы при параллельных прямых и секущей…'
        opts: ['в сумме дают $180^\circ$', 'равны', 'в сумме дают $90^\circ$', 'равны $90^\circ$']
        ans: a
        hint: 'Один из них смежен с углом, равным другому.'
        explain: 'Это следует из равенства соответственных углов.'
        f: [1]
        src: b236

  # ───────────────────────────── 3.3.1 ─────────────────────────────
  - id: ma-3-3-1
    subsection: ma-3-3
    num: '3.3.1'
    title: Периметр, медиана, биссектриса и высота. Средняя линия треугольника
    pages: [b237, b238]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.1'
      summary: 'Задания на периметр треугольника, неравенство треугольника, среднюю линию и основные отрезки треугольника.'
    stage: verified
    stageNote: 'Ответы пересчитаны; существование треугольников проверено неравенством треугольника.'
    sourcesChecked: '2026-10-25'
    web: [*cm-103, *lyc]
    theory:
      - kind: definition
        title: Основные отрезки треугольника
        body: |
          - **Медиана** соединяет вершину с серединой противолежащей стороны.
          - **Биссектриса** делит угол треугольника пополам.
          - **Высота** — перпендикуляр из вершины на прямую, содержащую противолежащую сторону.
          - **Средняя линия** соединяет середины двух сторон; она **параллельна** третьей стороне и равна её **половине**.
          В равнобедренном треугольнике медиана, биссектриса и высота, проведённые к основанию, совпадают.
        src: b237
      - kind: law
        title: Неравенство треугольника
        body: |
          Каждая сторона меньше суммы двух других: $a < b + c$. Треугольник со сторонами $a \le b \le c$ существует, если $c < a + b$.
          Третья сторона при известных $a$ и $b$: $|a - b| < c < a + b$.
        src: b238
    formulas:
      - title: Средняя линия
        tex: 'm = \frac{a}{2},\qquad P_{\text{ср}} = \frac{P}{2}'
        meaning: '$a$ — сторона, параллельная средней линии; $P_{\text{ср}}$ — периметр треугольника из средних линий.'
        use: 'Задачи на средние линии.'
        src: b237
      - title: Неравенство треугольника
        tex: '|a - b| < c < a + b'
        meaning: '$a$, $b$, $c$ — стороны треугольника.'
        use: 'Проверка существования треугольника, оценка стороны.'
        src: b238
    examples:
      - title: Треугольник из средних линий
        given: 'Стороны треугольника 6, 8 и 10. Найдите периметр треугольника, образованного средними линиями.'
        find: 'периметр.'
        method: 'Каждая средняя линия — половина стороны.'
        steps:
          - 'Средние линии $3$, $4$, $5$.'
          - 'Периметр $12$.'
        check: '$\frac{24}{2} = 12$ ✓.'
        answer: '$12$'
        src: b237
      - title: Существование треугольника
        given: 'Существует ли треугольник со сторонами 3, 4 и 8?'
        find: 'ответ.'
        method: 'Неравенство треугольника.'
        steps:
          - 'Наибольшая сторона 8, сумма двух других $3 + 4 = 7$.'
          - '$8 > 7$ — не существует.'
