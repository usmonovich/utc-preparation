        src: b238
      - type: numeric
        cat: problem
        q: 'Угол при основании равнобедренного треугольника $35^\circ$. Найдите угол при вершине.'
        num: { value: 110, unit: '°', check: '180-70' }
        hint: 'Углы при основании равны.'
        explain: '$180^\circ - 70^\circ = 110^\circ$.'
        f: [1]
        sol: { method: 'Сумма углов.', steps: ['$180^\circ - 2 \cdot 35^\circ = 110^\circ$.'], answer: '110°' }
        src: b239
      - type: numeric
        cat: problem
        q: 'Один острый угол прямоугольного треугольника $37^\circ$. Найдите другой.'
        num: { value: 53, unit: '°', check: '90-37' }
