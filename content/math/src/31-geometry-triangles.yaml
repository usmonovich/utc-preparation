        hint: '$90^\circ + \frac{\angle C}{2}$.'
        explain: '$90^\circ + 35^\circ = 125^\circ$.'
        f: [3]
        sol: { method: 'Угол между биссектрисами.', steps: ['$\angle A + \angle B = 110^\circ$.', '$\angle AIB = 180^\circ - 55^\circ = 125^\circ$.'], answer: '125°' }
