  # ───────────────────────────── 1.15.13 ─────────────────────────────
  - id: ma-1-15-13
    num: '1.15.13'
    title: Тригонометрические функции и их свойства
    pages: [b192, b193, b194, b195, b196, b197, b198, b199, b200, b201]
    book:
      place: 'Ч. 2, 1.15 «Тригонометрия», пункт 1.15.13'
      summary: 'Задания на свойства функций $\sin x$, $\cos x$, $\operatorname{tg} x$: области определения и значений, период, чётность, нули, наибольшие и наименьшие значения.'
    stage: verified
    stageNote: 'Периоды и множества значений проверены численно.'
    sourcesChecked: '2026-10-25'
    web: [*at-81, *at-73]
    theory:
      - kind: definition
        title: Свойства основных функций
        body: |
          | | $\sin x$ | $\cos x$ | $\operatorname{tg} x$ |
          | --- | --- | --- | --- |
          | $D$ | $\mathbb R$ | $\mathbb R$ | $x \ne \frac\pi2 + \pi k$ |
          | $E$ | $[-1; 1]$ | $[-1; 1]$ | $\mathbb R$ |
          | период | $2\pi$ | $2\pi$ | $\pi$ |
          | чётность | нечётная | чётная | нечётная |
          | нули | $\pi k$ | $\frac\pi2 + \pi k$ | $\pi k$ |
        src: b192
      - kind: rule
        title: Период и множество значений сложных функций
        body: |
          - Период $A\sin(kx + b)$ и $A\cos(kx + b)$ равен $\frac{2\pi}{|k|}$; у $\operatorname{tg}(kx + b)$ — $\frac{\pi}{|k|}$.
          - Множество значений $A\sin(kx + b) + B$: $[B - |A|; B + |A|]$.
          - Произведение чётной и нечётной функций — нечётная функция; двух нечётных — чётная.
        src: b194
        fig: sine-period
    formulas:
      - title: Период
        tex: 'T\big(\sin(kx + b)\big) = T\big(\cos(kx + b)\big) = \frac{2\pi}{|k|},\qquad T\big(\operatorname{tg}(kx + b)\big) = \frac{\pi}{|k|}'
        meaning: '$k \ne 0$.'
        use: 'Найти наименьший положительный период.'
        src: b194
      - title: Множество значений
        tex: 'E\big(A\sin(kx + b) + B\big) = [B - |A|;\ B + |A|]'
        meaning: 'То же для косинуса.'
        use: 'Наибольшее и наименьшее значения.'
        src: b195
    examples:
      - title: Период и значения
        given: 'Найдите период и множество значений $y = 3\sin(2x - 1)$.'
        find: '$T$, $E$.'
        method: 'Формулы периода и множества значений.'
        steps:
          - '$T = \frac{2\pi}{2} = \pi$.'
          - '$E = [-3; 3]$.'
        check: '$y(x + \pi) = 3\sin(2x - 1 + 2\pi) = y(x)$ ✓.'
        answer: '$T = \pi$, $E = [-3; 3]$'
        src: b194
      - title: Множество значений
        given: 'Найдите множество значений $y = 2 - 3\cos x$.'
        find: '$E(y)$.'
        method: '$-1 \le \cos x \le 1$.'
        steps:
          - '$-3 \le -3\cos x \le 3$.'
          - '$-1 \le 2 - 3\cos x \le 5$.'
        check: '$x = 0$: $-1$; $x = \pi$: $5$ ✓.'
        answer: '$[-1; 5]$'
        src: b195
      - title: Чётность
        given: 'Исследуйте на чётность $y = x\sin x$ и $y = \sin x + \cos x$.'
        find: 'чётность.'
        method: 'Подставить $-x$.'
        steps:
          - '$(-x)\sin(-x) = x\sin x$ — чётная.'
          - '$\sin(-x) + \cos(-x) = -\sin x + \cos x$ — ни чётная, ни нечётная.'
        check: 'Вторая: $y\left(\frac\pi2\right) = 1$, $y\left(-\frac\pi2\right) = -1$ — не чётная; $y(0) = 1 \ne -y(0)$ — не нечётная ✓.'
        answer: 'первая — чётная, вторая — общего вида'
        src: b196
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите период функции $y = \cos 4x$ в градусах.'
        num: { value: 90, unit: '°', check: '360/4' }
        hint: '$T = \frac{360^\circ}{|k|}$.'
        explain: '$\frac{360^\circ}{4} = 90^\circ$.'
        f: [1]
        sol: { method: 'Формула периода.', steps: ['$T = \frac{2\pi}{4} = \frac\pi2 = 90^\circ$.'], answer: '90°' }
        src: b194
      - type: numeric
        cat: problem
        q: 'Найдите период функции $y = \operatorname{tg}\dfrac x3$ в градусах.'
        num: { value: 540, unit: '°', check: '180*3' }
        hint: 'Период тангенса $\frac{180^\circ}{|k|}$.'
        explain: '$\frac{180^\circ}{1/3} = 540^\circ$.'
        f: [1]
        sol: { method: 'Формула периода.', steps: ['$T = \frac{\pi}{1/3} = 3\pi = 540^\circ$.'], answer: '540°' }
        src: b194
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение $y = 5 - 2\sin x$.'
        num: { value: 7, unit: '', check: '5+2' }
        hint: 'Наибольшее при $\sin x = -1$.'
        explain: '$5 + 2 = 7$.'
        f: [2]
        sol: { method: 'Множество значений.', steps: ['$-2 \le -2\sin x \le 2$.', 'Наибольшее $5 + 2 = 7$.'], answer: '7' }
        src: b195
      - type: numeric
        cat: problem
        q: 'Сколько нулей у функции $y = \sin x$ на отрезке $[0; 3\pi]$?'
        num: { value: 4, unit: '', check: '4' }
        hint: 'Нули — $\pi k$.'
        explain: '$0, \pi, 2\pi, 3\pi$.'
        sol: { method: 'Нули синуса.', steps: ['$x = \pi k$.', 'На $[0; 3\pi]$: $k = 0, 1, 2, 3$.'], answer: '4' }
        src: b192
      - type: numeric
        cat: problem
        q: 'Найдите сумму наибольшего и наименьшего значений функции $y = 3\cos x + 1$.'
        num: { value: 2, unit: '', check: '4+(-2)' }
        hint: '$E = [-2; 4]$.'
        explain: '$4 + (-2) = 2$.'
        f: [2]
        sol: { method: 'Множество значений.', steps: ['$E = [1 - 3; 1 + 3] = [-2; 4]$.', 'Сумма $2$.'], answer: '2' }
        src: b195
      - type: numeric
        cat: problem
        q: 'Сколько целых чисел входит в множество значений функции $y = 4\sin x - 1$?'
        num: { value: 9, unit: '', check: '3-(-5)+1' }
        hint: '$E = [-5; 3]$.'
        explain: 'Целые от $-5$ до $3$ — девять.'
        f: [2]
        sol: { method: 'Множество значений.', steps: ['$E = [-1 - 4; -1 + 4] = [-5; 3]$.', 'Девять целых.'], answer: '9' }
        src: b195
      - type: single
        cat: theory
        q: 'Какая из функций нечётная?'
        opts: ['$y = \sin x\cos x$', '$y = \cos x$', '$y = x^2 + \cos x$', '$y = |\sin x|$']
        ans: a
        hint: 'Произведение нечётной и чётной функций.'
        explain: '$\sin(-x)\cos(-x) = -\sin x\cos x$.'
        src: b196
      - type: single
        cat: theory
        q: 'Область определения функции $y = \operatorname{tg} x$:'
        opts: ['$x \ne \frac\pi2 + \pi k$', '$x \ne \pi k$', 'все действительные числа', '$x \ne 2\pi k$']
        ans: a
        hint: '$\operatorname{tg} x = \frac{\sin x}{\cos x}$.'
        explain: 'Косинус равен нулю при $x = \frac\pi2 + \pi k$.'
        src: b192
