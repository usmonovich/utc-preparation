topics:
  # ───────────────────────────── 3.3.6 ─────────────────────────────
  - id: ma-3-3-6
    num: '3.3.6'
    title: Свойства биссектрисы треугольника
    pages: [b244, b245, b246]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.6'
      summary: 'Задания на свойство биссектрисы (делит противолежащую сторону пропорционально прилежащим сторонам) и длину биссектрисы.'
    stage: verified
    stageNote: 'Отрезки и длины пересчитаны, в том числе через координаты.'
    sourcesChecked: '2026-10-25'
    web: [*lyc, *cm-103]
    theory:
      - kind: law
        title: Свойство биссектрисы
        body: |
          Биссектриса $AD$ треугольника $ABC$ делит сторону $BC$ на отрезки, пропорциональные прилежащим сторонам:
          $$\frac{BD}{DC} = \frac{AB}{AC}.$$
          Отсюда $BD = \frac{a \cdot c}{b + c}$, $DC = \frac{a \cdot b}{b + c}$ (где $a = BC$, $b = AC$, $c = AB$).
          Три биссектрисы пересекаются в одной точке — центре **вписанной** окружности.
        src: b244
      - kind: rule
        title: Длина биссектрисы
        body: |
          $$l_a^2 = bc - mn,$$
          где $m = BD$, $n = DC$ — отрезки, на которые биссектриса делит сторону $a$. Другая форма: $l_a = \frac{2bc\cos\frac A2}{b + c}$.
        src: b245
    formulas:
      - title: Свойство биссектрисы
        tex: '\frac{BD}{DC} = \frac{AB}{AC}'
        meaning: '$AD$ — биссектриса угла $A$, $D \in BC$.'
        use: 'Нахождение отрезков стороны.'
        src: b244
      - title: Длина биссектрисы
        tex: 'l_a^2 = bc - mn = bc\left(1 - \frac{a^2}{(b + c)^2}\right)'
        meaning: '$b$, $c$ — стороны угла, $m$, $n$ — отрезки противолежащей стороны $a$.'
        use: 'Нахождение длины биссектрисы.'
        src: b245
    examples:
      - title: Отрезки стороны
        given: 'В треугольнике $AB = 6$, $AC = 9$, $BC = 10$. Биссектриса $AD$. Найдите $BD$ и $DC$.'
        find: '$BD$, $DC$.'
        method: 'Свойство биссектрисы.'
        steps:
          - '$\frac{BD}{DC} = \frac69 = \frac23$, $BD + DC = 10$.'
          - '$BD = 4$, $DC = 6$.'
        check: '$\frac46 = \frac69$ ✓.'
        answer: '$BD = 4$, $DC = 6$'
        src: b244
      - title: Длина биссектрисы
        given: 'В том же треугольнике найдите длину биссектрисы $AD$.'
        find: '$l$.'
        method: '$l^2 = bc - mn$.'
        steps:
          - '$l^2 = 6 \cdot 9 - 4 \cdot 6 = 30$.'
          - '$l = \sqrt{30} \approx 5{,}48$.'
        check: 'По координатам: $\approx 5{,}477$ ✓.'
        answer: '$\sqrt{30}$'
        src: b245
      - title: Биссектриса прямого угла
        given: 'Катеты 3 и 4. Биссектриса прямого угла делит гипотенузу на отрезки. Найдите их.'
        find: 'отрезки.'
        method: 'Свойство биссектрисы.'
        steps:
          - '$\frac{m}{n} = \frac34$, $m + n = 5$.'
          - '$m = \frac{15}{7}$, $n = \frac{20}{7}$.'
        check: '$\frac{15}{7} + \frac{20}{7} = 5$ ✓.'
        answer: '$\frac{15}7$ и $\frac{20}7$'
        src: b245
    questions:
      - type: numeric
        cat: problem
        q: 'В треугольнике $AB = 8$, $AC = 12$, $BC = 15$. Биссектриса угла $A$ пересекает $BC$ в точке $D$. Найдите $BD$.'
        num: { value: 6, unit: '', check: '15*8/20' }
        hint: '$BD = \frac{BC \cdot AB}{AB + AC}$.'
        explain: '$\frac{15 \cdot 8}{20} = 6$.'
        f: [1]
        sol: { method: 'Свойство биссектрисы.', steps: ['$BD : DC = 8 : 12$.', '$BD = 15 \cdot \frac{8}{20} = 6$.'], answer: '6' }
        src: b244
      - type: numeric
        cat: problem
        q: 'Две стороны треугольника 5 и 7, биссектриса угла между ними делит третью сторону, равную 9, на две части. Найдите меньшую.'
        num: { value: 3.75, unit: '', check: '9*5/12' }
        hint: 'Меньший отрезок прилежит к меньшей стороне.'
        explain: '$9 \cdot \frac{5}{12} = 3{,}75$.'
        f: [1]
        sol: { method: 'Свойство биссектрисы.', steps: ['Части в отношении $5 : 7$.', '$9 \cdot \frac5{12} = 3{,}75$.'], answer: '3,75' }
        src: b244
      - type: numeric
        cat: problem
        q: 'Стороны равнобедренного треугольника 10, 10 и 12. Найдите биссектрису угла при вершине.'
        num: { value: 8, unit: '', check: 'Math.sqrt(100-36)' }
        hint: 'Она же высота к основанию.'
        explain: '$\sqrt{100 - 36} = 8$.'
        sol: { method: 'Равнобедренный треугольник.', steps: ['Биссектриса к основанию — высота.', '$\sqrt{10^2 - 6^2} = 8$.'], answer: '8' }
        src: b245
      - type: numeric
        cat: problem
        q: 'Стороны треугольника $b = 4$, $c = 6$, $a = 5$. Найдите биссектрису угла $A$ (с точностью до 0,01).'
        num: { value: 4.2426, unit: '', tolAbs: 0.01, check: 'Math.sqrt(24-2*3)' }
        hint: 'Отрезки стороны $a$: $2$ и $3$.'
        explain: '$l^2 = 24 - 6 = 18$, $l = 3\sqrt2 \approx 4{,}24$.'
        f: [2]
        sol: { method: 'Длина биссектрисы.', steps: ['$m : n = 6 : 4$ на стороне 5 (к стороне $c$ прилежит $m$): $m = 3$, $n = 2$.', '$l^2 = 4 \cdot 6 - 3 \cdot 2 = 18$, $l = 3\sqrt2$.'], answer: '3√2 ≈ 4,24' }
        src: b245
      - type: numeric
        cat: problem
        q: 'Биссектриса угла $A$ делит сторону $BC = 14$ так, что $BD = 6$. Известно $AB = 9$. Найдите $AC$.'
        num: { value: 12, unit: '', check: '9*8/6' }
        hint: '$\frac{BD}{DC} = \frac{AB}{AC}$, $DC = 8$.'
        explain: '$AC = \frac{9 \cdot 8}{6} = 12$.'
        f: [1]
        sol: { method: 'Свойство биссектрисы.', steps: ['$DC = 14 - 6 = 8$.', '$AC = AB \cdot \frac{DC}{BD} = 12$.'], answer: '12' }
        src: b244
      - type: numeric
        cat: problem
        q: 'Катеты 3 и 4. Найдите меньший из отрезков, на которые биссектриса прямого угла делит гипотенузу (с точностью до 0,01).'
        num: { value: 2.1429, unit: '', tolAbs: 0.01, check: '15/7' }
        hint: 'Отношение $3 : 4$.'
        explain: '$\frac{15}{7} \approx 2{,}14$.'
        f: [1]
        sol: { method: 'Свойство биссектрисы.', steps: ['$5 \cdot \frac37 = \frac{15}{7} \approx 2{,}14$.'], answer: '15/7' }
        src: b245
      - type: single
        cat: theory
        q: 'Точка пересечения биссектрис треугольника — это…'
        opts: ['центр вписанной окружности', 'центр описанной окружности', 'центр тяжести', 'ортоцентр']
        ans: a
        hint: 'Равноудалена от сторон.'
        explain: 'Каждая точка биссектрисы равноудалена от сторон угла.'
        src: b244
      - type: single
        cat: theory
        q: 'Биссектриса делит противолежащую сторону в отношении…'
        opts: ['прилежащих сторон', 'противолежащих углов', '1 : 1', 'квадратов прилежащих сторон']
        ans: a
        hint: 'Свойство биссектрисы.'
        explain: '$\frac{BD}{DC} = \frac{AB}{AC}$. Пополам сторону делит медиана.'
        f: [1]
        src: b244

  # ───────────────────────────── 3.3.7 ─────────────────────────────
  - id: ma-3-3-7
    num: '3.3.7'
    title: Свойства медианы треугольника
    pages: [b246]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.7'
      summary: 'Задания на свойства медиан: точка пересечения делит их в отношении 2 : 1, длина медианы, деление площади.'
    stage: verified
    stageNote: 'Длины медиан проверены через координаты.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Свойства медиан
        body: |
          - Медианы пересекаются в одной точке — **центре тяжести** (центроиде), который делит каждую медиану в отношении $2 : 1$, считая от вершины.
          - Медиана делит треугольник на два равновеликих (одинаковой площади); три медианы — на шесть равновеликих треугольников.
          - Длина медианы к стороне $a$: $m_a = \frac12\sqrt{2b^2 + 2c^2 - a^2}$.
        src: b246
    formulas:
      - title: Длина медианы
        tex: 'm_a = \frac12\sqrt{2b^2 + 2c^2 - a^2}'
        meaning: '$a$ — сторона, к которой проведена медиана.'
        use: 'Медиана по трём сторонам.'
        src: b246
      - title: Деление медиан
        tex: 'AG : GM = 2 : 1'
        meaning: '$G$ — точка пересечения медиан, $M$ — середина стороны.'
        use: 'Отрезки медиан.'
        src: b246
    examples:
      - title: Медиана равнобедренного треугольника
        given: 'Стороны 5, 5, 6. Найдите медиану к стороне 6.'
        find: '$m$.'
        method: 'Формула медианы.'
        steps:
          - '$m = \frac12\sqrt{50 + 50 - 36} = \frac12\sqrt{64}$.'
          - '$m = 4$.'
        check: 'Это и высота: $\sqrt{25 - 9} = 4$ ✓.'
        answer: '$4$'
        src: b246
      - title: Медиана по трём сторонам
        given: 'Стороны 4, 6, 8. Найдите медиану к стороне 8.'
        find: '$m$.'
        method: 'Формула медианы.'
        steps:
          - '$m = \frac12\sqrt{2 \cdot 16 + 2 \cdot 36 - 64} = \frac12\sqrt{40}$.'
          - '$m = \sqrt{10} \approx 3{,}16$.'
        check: 'Через координаты: $\approx 3{,}162$ ✓.'
        answer: '$\sqrt{10}$'
        src: b246
      - title: Центроид
        given: 'Медиана равна 9. На какие части её делит точка пересечения медиан?'
        find: 'части.'
        method: 'Отношение $2 : 1$.'
        steps:
          - '$9 \cdot \frac23 = 6$ от вершины.'
          - '$9 \cdot \frac13 = 3$ до стороны.'
        check: '$6 + 3 = 9$, $6 : 3 = 2 : 1$ ✓.'
        answer: '$6$ и $3$'
        src: b246
    questions:
      - type: numeric
        cat: problem
        q: 'Медиана равна 12. Найдите расстояние от вершины до точки пересечения медиан.'
        num: { value: 8, unit: '', check: '12*2/3' }
        hint: '$\frac23$ медианы.'
        explain: '$8$.'
        f: [2]
        sol: { method: 'Деление медиан.', steps: ['$12 \cdot \frac23 = 8$.'], answer: '8' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Площадь треугольника 30. Найдите площадь каждого из треугольников, на которые его делит медиана.'
        num: { value: 15, unit: '', check: '30/2' }
        hint: 'Равные основания, общая высота.'
        explain: '$15$.'
        sol: { method: 'Медиана делит площадь пополам.', steps: ['$30 : 2 = 15$.'], answer: '15' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Стороны треугольника 6, 8, 10. Найдите медиану к стороне 10.'
        num: { value: 5, unit: '', check: '0.5*Math.sqrt(72+128-100)' }
        hint: 'Треугольник прямоугольный.'
        explain: 'Медиана к гипотенузе $= 5$.'
        f: [1]
        sol: { method: 'Формула медианы.', steps: ['$\frac12\sqrt{72 + 128 - 100} = \frac12 \cdot 10 = 5$.'], answer: '5' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Стороны треугольника 7, 7, 4. Найдите медиану к стороне 4 (с точностью до 0,01).'
        num: { value: 6.7082, unit: '', tolAbs: 0.01, check: '0.5*Math.sqrt(98+98-16)' }
        hint: '$\frac12\sqrt{2 \cdot 49 + 2 \cdot 49 - 16}$.'
        explain: '$\frac12\sqrt{180} = 3\sqrt5 \approx 6{,}71$.'
        f: [1]
        sol: { method: 'Формула медианы.', steps: ['$\frac12\sqrt{180} = 3\sqrt5 \approx 6{,}71$.'], answer: '3√5 ≈ 6,71' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Медиана равна 15. Найдите расстояние от точки пересечения медиан до середины стороны.'
        num: { value: 5, unit: '', check: '15/3' }
        hint: '$\frac13$ медианы.'
        explain: '$5$.'
        f: [2]
        sol: { method: 'Деление медиан.', steps: ['$15 : 3 = 5$.'], answer: '5' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Площадь треугольника 36. Три медианы делят его на 6 треугольников. Найдите площадь каждого.'
        num: { value: 6, unit: '', check: '36/6' }
        hint: 'Все шесть равновелики.'
        explain: '$6$.'
        sol: { method: 'Свойство медиан.', steps: ['$36 : 6 = 6$.'], answer: '6' }
        src: b246
      - type: single
        cat: theory
        q: 'В каком отношении точка пересечения медиан делит медиану, считая от вершины?'
        opts: ['$2 : 1$', '$1 : 1$', '$1 : 2$', '$3 : 1$']
        ans: a
        hint: 'Ближе к стороне.'
        explain: 'Центроид делит медиану $2 : 1$ от вершины.'
        f: [2]
        src: b246
      - type: single
        cat: theory
        q: 'Медиана делит треугольник на два треугольника…'
        opts: ['равной площади', 'равных', 'подобных', 'прямоугольных']
        ans: a
        hint: 'Основания равны, высота общая.'
        explain: 'Равновеликие, но в общем случае не равные.'
        src: b246

  # ───────────────────────────── 3.3.8 ─────────────────────────────
  - id: ma-3-3-8
    num: '3.3.8'
    title: Разные задачи
    pages: [b246, b247]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.8'
      summary: 'Разные задачи на треугольники без новой теории в книге. Здесь собран план выбора метода по известным данным (опирается на 3.3.1–3.3.7).'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc, *cm-103]
    theory:
      - kind: rule
        title: Какой метод выбрать
        body: |
          | что известно | что использовать |
          | --- | --- |
          | две стороны и угол между ними | теорема косинусов, $S = \frac12ab\sin C$ |
          | сторона и два угла | сумма углов, теорема синусов |
          | три стороны | теорема косинусов (углы), формула Герона (площадь) |
          | прямой угол | теорема Пифагора, синус/косинус острого угла |
          | биссектриса, медиана | свойство биссектрисы, деление медиан $2 : 1$ |
          Полезно сначала найти площадь: через неё выражаются высоты, радиусы $r = \frac Sp$ и $R = \frac{abc}{4S}$.
        src: b246
    formulas:
      - title: Площадь по двум сторонам и углу
        tex: 'S = \frac12ab\sin C'
        meaning: '$C$ — угол между сторонами $a$ и $b$.'
        use: 'Площадь и связанные величины.'
        src: b246
      - title: Радиусы через площадь
        tex: 'r = \frac{S}{p},\qquad R = \frac{abc}{4S}'
        meaning: '$p$ — полупериметр.'
        use: 'Радиусы вписанной и описанной окружностей.'
        src: b247
    examples:
      - title: Комбинация теорем
        given: 'В треугольнике $a = 7$, $b = 8$, $\angle C = 60^\circ$. Найдите $c$ и площадь.'
        find: '$c$, $S$.'
        method: 'Теорема косинусов и $S = \frac12ab\sin C$.'
        steps:
          - '$c^2 = 49 + 64 - 56 = 57$, $c = \sqrt{57}$.'
          - '$S = \frac12 \cdot 56 \cdot \frac{\sqrt3}{2} = 14\sqrt3$.'
        check: '$c \approx 7{,}55$, $S \approx 24{,}25$ ✓.'
        answer: '$c = \sqrt{57}$, $S = 14\sqrt3$'
        src: b246
      - title: Радиусы
        given: 'Стороны 13, 14, 15. Найдите $r$ и $R$.'
        find: '$r$, $R$.'
        method: 'Через площадь 84.'
        steps:
          - '$p = 21$, $r = \frac{84}{21} = 4$.'
          - '$R = \frac{13 \cdot 14 \cdot 15}{4 \cdot 84} = \frac{2730}{336} = 8{,}125$.'
        check: '$\frac{a}{\sin A} = 2R$: $\sin A = \frac{2S}{bc} = \frac{168}{210} = 0{,}8$, $\frac{13}{0{,}8} = 16{,}25 = 2R$ ✓.'
        answer: '$r = 4$, $R = 8{,}125$'
        src: b247
      - title: Угол по сторонам
        given: 'Стороны 5, 7, 8. Найдите угол против стороны 7.'
        find: 'угол.'
        method: 'Теорема косинусов.'
        steps:
          - '$\cos\varphi = \frac{25 + 64 - 49}{2 \cdot 5 \cdot 8} = \frac{40}{80} = \frac12$.'
          - '$\varphi = 60^\circ$.'
        check: '$49 = 25 + 64 - 40$ ✓.'
        answer: '$60^\circ$'
        src: b246
    questions:
      - type: numeric
        cat: problem
        q: 'Стороны треугольника 5, 7, 8. Найдите угол против стороны 7 (в градусах).'
        num: { value: 60, unit: '°', check: 'Math.acos((25+64-49)/80)*180/Math.PI' }
        hint: 'Теорема косинусов.'
        explain: '$\cos = \frac12$.'
        sol: { method: 'Теорема косинусов.', steps: ['$\cos\varphi = \frac{40}{80} = 0{,}5$.', '$60^\circ$.'], answer: '60°' }
        src: b246
      - type: numeric
        cat: problem
        q: 'Стороны 13, 14, 15. Найдите радиус вписанной окружности.'
        num: { value: 4, unit: '', check: '84/21' }
        hint: '$r = \frac Sp$, $S = 84$.'
        explain: '$\frac{84}{21} = 4$.'
        f: [2]
        sol: { method: 'Радиус через площадь.', steps: ['$p = 21$, $S = 84$.', '$r = 4$.'], answer: '4' }
        src: b247
      - type: numeric
        cat: problem
        q: 'Стороны 13, 14, 15. Найдите радиус описанной окружности.'
