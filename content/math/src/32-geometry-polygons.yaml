  # ───────────────────────────── 3.3.10 ─────────────────────────────
  - id: ma-3-3-10
    num: '3.3.10'
    title: Подобие треугольников
    pages: [b250, b251, b252]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.10'
      summary: 'Задания на признаки подобия, коэффициент подобия, отношение периметров и площадей, прямую, параллельную стороне.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-103, *lyc]
    theory:
      - kind: law
        title: Признаки подобия
        body: |
          Треугольники подобны, если:
          - два угла одного равны двум углам другого;
          - две стороны пропорциональны и углы между ними равны;
          - три стороны пропорциональны.
          При подобии с коэффициентом $k$ все линейные размеры (стороны, высоты, медианы, периметры) умножаются на $k$, а **площади — на $k^2$**.
        src: b250
      - kind: rule
        title: Прямая, параллельная стороне
        body: |
          Прямая $DE \parallel AC$ ($D \in AB$, $E \in BC$) отсекает треугольник $DBE$, подобный $ABC$: $\frac{DE}{AC} = \frac{BD}{BA} = \frac{BE}{BC}$.
          Средняя линия отсекает треугольник с $k = \frac12$ — его площадь $\frac14$ исходной.
        src: b251
    formulas:
      - title: Отношения при подобии
        tex: '\frac{a_1}{a} = \frac{P_1}{P} = k,\qquad \frac{S_1}{S} = k^2'
        meaning: '$k$ — коэффициент подобия.'
        use: 'Задачи на подобные фигуры.'
        src: b250
      - title: Отсечённый треугольник
        tex: 'DE \parallel AC \Rightarrow \frac{DE}{AC} = \frac{BD}{BA}'
        meaning: '$D \in AB$, $E \in BC$.'
        use: 'Отрезки, параллельные стороне.'
        src: b251
    examples:
      - title: Площади подобных треугольников
        given: 'Треугольники подобны с отношением сторон $2 : 3$, площадь меньшего 8. Найдите площадь большего.'
        find: '$S$.'
        method: 'Площади относятся как $k^2$.'
        steps:
          - '$\frac{8}{S} = \frac49$.'
          - '$S = 18$.'
        check: '$\frac{8}{18} = \frac49$ ✓.'
        answer: '$18$'
        src: b250
      - title: Параллельный отрезок
        given: '$DE \parallel AC$, $BD : DA = 2 : 1$, $AC = 12$. Найдите $DE$.'
        find: '$DE$.'
        method: '$\frac{DE}{AC} = \frac{BD}{BA} = \frac23$.'
        steps:
          - '$BA = BD + DA$, $\frac{BD}{BA} = \frac23$.'
          - '$DE = 12 \cdot \frac23 = 8$.'
        check: 'Подобие с $k = \frac23$ ✓.'
        answer: '$8$'
        src: b251
      - title: Тень
        given: 'Шест высотой 2 м отбрасывает тень 3 м, дерево в то же время — 15 м. Найдите высоту дерева.'
        find: 'высоту.'
        method: 'Подобные прямоугольные треугольники.'
        steps:
          - '$\frac{h}{15} = \frac23$.'
          - '$h = 10$ м.'
        check: 'Лучи солнца параллельны — углы равны ✓.'
        answer: '$10$ м'
        src: b251
    questions:
      - type: numeric
        cat: problem
        q: 'Площади подобных треугольников относятся как $9 : 25$, периметр меньшего 12. Найдите периметр большего.'
        num: { value: 20, unit: '', check: '12*5/3' }
        hint: '$k = \frac35$.'
        explain: '$12 \cdot \frac53 = 20$.'
        f: [1]
        sol: { method: 'Площади и периметры.', steps: ['$k^2 = \frac{9}{25} \Rightarrow k = \frac35$.', '$P = 12 : \frac35 = 20$.'], answer: '20' }
        src: b250
      - type: numeric
        cat: problem
        q: 'Столб высотой 2 м отбрасывает тень 3 м, дерево — 15 м. Найдите высоту дерева (м).'
        num: { value: 10, unit: 'м', check: '2*15/3' }
        hint: 'Подобие.'
        explain: '$10$ м.'
        sol: { method: 'Подобные треугольники.', steps: ['$\frac{h}{15} = \frac{2}{3}$, $h = 10$.'], answer: '10 м' }
        src: b251
      - type: numeric
