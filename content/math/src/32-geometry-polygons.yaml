        f: [3]
        sol: { method: 'Формула для равностороннего.', steps: ['$\frac{\sqrt3}{4} \cdot 12 = 3\sqrt3$.'], answer: '3√3 ≈ 5,20' }
        src: b248
      - type: numeric
        cat: problem
        q: 'Стороны 3, 4, 5. Найдите радиус вписанной окружности.'
        num: { value: 1, unit: '', check: '6/6' }
