        src: b249
      - type: single
        cat: theory
        q: 'Какая формула выражает площадь через стороны и радиус описанной окружности?'
        opts: ['$S = \frac{abc}{4R}$', '$S = pR$', '$S = \frac12 aR$', '$S = \pi R^2$']
