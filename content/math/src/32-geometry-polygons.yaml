      - type: single
        cat: theory
        q: 'Какого признака подобия треугольников не существует?'
        opts: ['по двум сторонам и углу, не лежащему между ними', 'по двум углам', 'по двум пропорциональным сторонам и углу между ними', 'по трём пропорциональным сторонам']
