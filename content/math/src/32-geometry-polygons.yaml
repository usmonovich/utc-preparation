        explain: '$24 \cdot 0{,}36 = 8{,}64$.'
        f: [1]
        sol: { method: 'Подобие в прямоугольном треугольнике.', steps: ['Исходная площадь $24$, гипотенуза $10$.', 'Меньший треугольник подобен с $k = \frac{6}{10}$: $24 \cdot 0{,}36 = 8{,}64$.'], answer: '8,64' }
