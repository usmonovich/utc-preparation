  # ───────────────────────────── 3.3.9 ─────────────────────────────
  - id: ma-3-3-9
    num: '3.3.9'
    title: Площадь треугольника
    pages: [b247, b248, b249, b250]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.3 «Треугольники», пункт 3.3.9'
      summary: 'Задания на площадь треугольника по разным формулам: через высоту, две стороны и угол, формулу Герона, радиусы окружностей.'
    stage: verified
    stageNote: 'Площади пересчитаны двумя способами (формула Герона и координаты).'
    sourcesChecked: '2026-10-25'
    web: [*cm-106, *lyc]
    theory:
      - kind: law
        title: Формулы площади
        body: |
          - $S = \frac12 a h_a$;
          - $S = \frac12 ab\sin C$;
          - **формула Герона**: $S = \sqrt{p(p - a)(p - b)(p - c)}$, $p = \frac{a + b + c}{2}$;
          - $S = pr$ ($r$ — радиус вписанной окружности), $S = \frac{abc}{4R}$ ($R$ — описанной);
          - прямоугольный: $S = \frac12ab$ (катеты); равносторонний: $S = \frac{\sqrt3}{4}a^2$.
        src: b247
    formulas:
      - title: Площадь через сторону и высоту
        tex: 'S = \frac12 a h_a = \frac12 ab\sin C'
        meaning: '$h_a$ — высота к стороне $a$; $C$ — угол между $a$ и $b$.'
        use: 'Основные формулы площади.'
        src: b247
      - title: Формула Герона
        tex: 'S = \sqrt{p(p - a)(p - b)(p - c)},\quad p = \frac{a + b + c}{2}'
        meaning: '$a$, $b$, $c$ — стороны.'
        use: 'Площадь по трём сторонам.'
        src: b248
      - title: Площадь равностороннего треугольника
        tex: 'S = \frac{\sqrt3}{4}a^2'
        meaning: '$a$ — сторона.'
        use: 'Равносторонние треугольники.'
        src: b248
    examples:
      - title: Формула Герона
        given: 'Стороны 13, 14, 15. Найдите площадь.'
        find: '$S$.'
        method: 'Формула Герона.'
        steps:
          - '$p = 21$, $S = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056}$.'
          - '$S = 84$.'
        check: 'Высота 12 к стороне 14: $\frac12 \cdot 14 \cdot 12 = 84$ ✓.'
        answer: '$84$'
        src: b248
      - title: Две стороны и угол
        given: '$a = 6$, $b = 8$, $\angle C = 30^\circ$. Найдите площадь.'
        find: '$S$.'
        method: '$\frac12ab\sin C$.'
        steps:
          - '$\frac12 \cdot 6 \cdot 8 \cdot \frac12$.'
          - '$= 12$.'
        check: 'Высота к $a$: $8\sin 30^\circ = 4$, $\frac12 \cdot 6 \cdot 4 = 12$ ✓.'
        answer: '$12$'
        src: b247
      - title: Равносторонний треугольник
        given: 'Сторона 4. Найдите площадь.'
        find: '$S$.'
        method: '$\frac{\sqrt3}4a^2$.'
        steps:
          - '$\frac{\sqrt3}{4} \cdot 16$.'
          - '$= 4\sqrt3 \approx 6{,}93$.'
        check: 'Высота $2\sqrt3$: $\frac12 \cdot 4 \cdot 2\sqrt3 = 4\sqrt3$ ✓.'
        answer: '$4\sqrt3$'
        src: b248
    questions:
      - type: numeric
        cat: problem
        q: 'Основание треугольника 10, высота к нему 7. Найдите площадь.'
        num: { value: 35, unit: '', check: '0.5*10*7' }
        hint: '$\frac12ah$.'
        explain: '$35$.'
        f: [1]
        sol: { method: 'Площадь через высоту.', steps: ['$\frac12 \cdot 10 \cdot 7 = 35$.'], answer: '35' }
        src: b247
      - type: numeric
        cat: problem
        q: 'Стороны 5, 12, 13. Найдите площадь.'
        num: { value: 30, unit: '', check: '0.5*5*12' }
        hint: 'Треугольник прямоугольный.'
        explain: '$\frac12 \cdot 5 \cdot 12 = 30$.'
        sol: { method: 'Прямоугольный треугольник.', steps: ['$25 + 144 = 169$ — прямоугольный.', '$S = 30$.'], answer: '30' }
        src: b247
      - type: numeric
        cat: problem
        q: 'Две стороны 10 и 12, угол между ними $150^\circ$. Найдите площадь.'
        num: { value: 30, unit: '', check: '0.5*120*Math.sin(5*Math.PI/6)' }
        hint: '$\sin 150^\circ = \frac12$.'
        explain: '$\frac12 \cdot 120 \cdot \frac12 = 30$.'
        f: [1]
        sol: { method: 'Площадь по двум сторонам и углу.', steps: ['$S = 60 \cdot \frac12 = 30$.'], answer: '30' }
        src: b247
      - type: numeric
        cat: problem
        q: 'Сторона равностороннего треугольника $2\sqrt3$. Найдите площадь (с точностью до 0,01).'
        num: { value: 5.1962, unit: '', tolAbs: 0.01, check: 'Math.sqrt(3)/4*12' }
