  # ───────────────────────────── 3.7.2 ─────────────────────────────
  - id: ma-3-7-2
    num: '3.7.2'
    title: Квадрат и окружность
    pages: [b277, b278]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.7 «Окружность и многоугольник», пункт 3.7.2'
      summary: 'Задания на окружности, вписанные в квадрат и описанные около него.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Квадрат и его окружности
        body: |
          Для квадрата со стороной $a$:
          - вписанная окружность: $r = \frac a2$;
          - описанная окружность: $R = \frac{a\sqrt2}{2}$ (половина диагонали);
          - $R = r\sqrt2$, площади описанного и вписанного кругов относятся как $2 : 1$.
          Квадрат, вписанный в окружность радиуса $R$: сторона $R\sqrt2$, площадь $2R^2$.
        src: b277
    formulas:
      - title: Радиусы окружностей квадрата
        tex: 'r = \frac a2,\qquad R = \frac{a\sqrt2}{2},\qquad R = r\sqrt2'
        meaning: '$a$ — сторона квадрата.'
        use: 'Квадрат и окружность.'
        src: b277
    examples:
      - title: Радиусы
        given: 'Сторона квадрата 8. Найдите радиусы вписанной и описанной окружностей.'
        find: '$r$, $R$.'
        method: 'Формулы.'
        steps:
          - '$r = 4$.'
          - '$R = 4\sqrt2 \approx 5{,}66$.'
        check: 'Диагональ $8\sqrt2 = 2R$ ✓.'
        answer: '$r = 4$, $R = 4\sqrt2$'
        src: b277
      - title: Вписанный квадрат
        given: 'В окружность радиуса 5 вписан квадрат. Найдите его площадь.'
        find: '$S$.'
        method: 'Диагональ — диаметр.'
        steps:
          - '$d = 10$.'
          - '$S = \frac{d^2}{2} = 50$.'
        check: 'Сторона $5\sqrt2$, $S = 50$ ✓.'
        answer: '$50$'
        src: b278
      - title: Описанный квадрат
        given: 'Около окружности радиуса 3 описан квадрат. Найдите его площадь.'
        find: '$S$.'
        method: 'Сторона — диаметр.'
        steps:
          - '$a = 6$.'
          - '$S = 36$.'
        check: '$r = \frac a2 = 3$ ✓.'
        answer: '$36$'
        src: b278
    questions:
      - type: numeric
        cat: problem
        q: 'Радиус окружности 6. Найдите сторону вписанного в неё квадрата (с точностью до 0,01).'
        num: { value: 8.4853, unit: '', tolAbs: 0.01, check: '6*Math.SQRT2' }
