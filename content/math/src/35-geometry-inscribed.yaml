    theory:
      - kind: law
        title: Правильный многоугольник и окружности
        body: |
          Около правильного $n$-угольника можно описать окружность и в него можно вписать окружность; центры совпадают.
          $$a_n = 2R\sin\frac{180^\circ}{n},\qquad r = R\cos\frac{180^\circ}{n}.$$
          Частные случаи: треугольник $a = R\sqrt3$; квадрат $a = R\sqrt2$; шестиугольник $a = R$.
          Площадь любого описанного около окружности многоугольника: $S = pr$ ($p$ — полупериметр).
        src: b281
    formulas:
      - title: Сторона и апофема правильного многоугольника
        tex: 'a_n = 2R\sin\frac{180^\circ}{n},\qquad r = R\cos\frac{180^\circ}{n}'
        meaning: '$R$ — радиус описанной окружности, $r$ — вписанной.'
        use: 'Правильные многоугольники.'
        src: b281
      - title: Площадь описанного многоугольника
        tex: 'S = p\,r'
        meaning: '$p$ — полупериметр, $r$ — радиус вписанной окружности.'
        use: 'Площадь через периметр и радиус.'
        src: b282
    examples:
