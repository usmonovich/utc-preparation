      - type: numeric
        cat: problem
        q: 'Стороны треугольника 7, 8, 9. Вписанная окружность касается стороны 8. Найдите меньший из отрезков, на которые точка касания делит эту сторону.'
        num: { value: 3, unit: '', check: '12-9' }
        hint: 'Отрезки $p - a$; $p = 12$.'
        explain: 'Отрезки $12 - 7 = 5$ и $12 - 9 = 3$.'
        sol: { method: 'Отрезки касательных.', steps: ['$p = 12$.', 'На стороне 8: $p - 9 = 3$ и $p - 7 = 5$.'], answer: '3' }
        src: b276
      - type: numeric
        cat: problem
        q: 'Радиус окружности, вписанной в равносторонний треугольник, равен 2. Найдите радиус описанной окружности.'
        num: { value: 4, unit: '', check: '2*2' }
