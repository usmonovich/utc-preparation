  # ───────────────────────────── 3.7.3 ─────────────────────────────
  - id: ma-3-7-3
    num: '3.7.3'
    title: Прямоугольник и окружность
    pages: [b278]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.7 «Окружность и многоугольник», пункт 3.7.3'
      summary: 'Задания на прямоугольник, вписанный в окружность.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Прямоугольник и окружность
        body: |
          Около любого прямоугольника можно описать окружность: её центр — точка пересечения диагоналей, $R = \frac d2 = \frac{\sqrt{a^2 + b^2}}{2}$.
          Вписать окружность в прямоугольник можно, только если он квадрат (суммы противоположных сторон должны быть равны).
          Из всех прямоугольников, вписанных в данную окружность, наибольшую площадь имеет квадрат: $S_{\max} = 2R^2$.
        src: b278
    formulas:
      - title: Радиус описанной окружности прямоугольника
        tex: 'R = \frac{\sqrt{a^2 + b^2}}{2}'
        meaning: '$a$, $b$ — стороны.'
        use: 'Прямоугольник, вписанный в окружность.'
        src: b278
    examples:
      - title: Радиус
        given: 'Стороны прямоугольника 6 и 8. Найдите радиус описанной окружности.'
        find: '$R$.'
        method: 'Половина диагонали.'
        steps:
          - '$d = 10$.'
          - '$R = 5$.'
        check: 'Все вершины на расстоянии 5 от центра ✓.'
        answer: '$5$'
        src: b278
      - title: Сторона по радиусу
        given: 'Прямоугольник вписан в окружность радиуса 13, одна сторона 10. Найдите площадь.'
        find: '$S$.'
        method: 'Диагональ 26.'
        steps:
          - '$b = \sqrt{676 - 100} = 24$.'
          - '$S = 240$.'
        check: '$10^2 + 24^2 = 26^2$ ✓.'
        answer: '$240$'
        src: b278
      - title: Отношение сторон
        given: 'Прямоугольник со сторонами в отношении $3 : 4$ вписан в окружность радиуса 5. Найдите площадь.'
        find: '$S$.'
        method: '$(3k)^2 + (4k)^2 = 10^2$.'
        steps:
          - '$25k^2 = 100 \Rightarrow k = 2$; стороны 6 и 8.'
          - '$S = 48$.'
        check: 'Диагональ 10 = диаметр ✓.'
        answer: '$48$'
        src: b278
    questions:
      - type: numeric
        cat: problem
        q: 'Стороны прямоугольника 5 и 12. Найдите радиус описанной окружности.'
        num: { value: 6.5, unit: '', check: 'Math.sqrt(25+144)/2' }
        hint: 'Половина диагонали.'
        explain: '$\frac{13}{2} = 6{,}5$.'
