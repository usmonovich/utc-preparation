      - type: numeric
        cat: problem
        q: 'Сторона треугольника 8 лежит против угла $30^\circ$. Найдите радиус описанной окружности.'
        num: { value: 8, unit: '', check: '8/(2*0.5)' }
        hint: '$R = \frac{a}{2\sin A}$.'
        explain: '$\frac{8}{1} = 8$.'
        f: [1]
