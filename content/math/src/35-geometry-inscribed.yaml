        src: b274
      - type: numeric
        cat: problem
        q: 'Катеты прямоугольного треугольника 5 и 12. Найдите радиус вписанной окружности.'
        num: { value: 2, unit: '', check: '(5+12-13)/2' }
        hint: '$\frac{a + b - c}{2}$.'
        explain: '$2$.'
        f: [2]
        sol: { method: 'Вписанная окружность прямоугольного треугольника.', steps: ['$r = \frac{5 + 12 - 13}{2} = 2$.'], answer: '2' }
        src: b274
      - type: numeric
        cat: problem
        q: 'Радиус окружности, описанной около равностороннего треугольника, $4\sqrt3$. Найдите сторону.'
        num: { value: 12, unit: '', check: '4*Math.sqrt(3)*Math.sqrt(3)' }
        hint: '$a = R\sqrt3$.'
        explain: '$4\sqrt3 \cdot \sqrt3 = 12$.'
