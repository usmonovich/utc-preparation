        method: '$c = \frac{a + b}{2}$, $h = \sqrt{ab}$.'
        steps:
          - '$c = 5$.'
          - '$h = \sqrt{16} = 4$, $r = 2$.'
        check: 'Проекция $3$, $\sqrt{25 - 9} = 4$ ✓.'
        answer: '$c = 5$, $r = 2$'
        src: b280
      - title: Средняя линия описанной трапеции
