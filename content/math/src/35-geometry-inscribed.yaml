        f: [1]
        sol: { method: 'Описанная окружность квадрата.', steps: ['$a = 6\sqrt2 \approx 8{,}49$.'], answer: '6√2 ≈ 8,49' }
        src: b278
      - type: numeric
        cat: problem
        q: 'Найдите площадь квадрата, вписанного в окружность радиуса 4.'
        num: { value: 32, unit: '', check: '2*16' }
        hint: '$S = 2R^2$.'
        explain: '$32$.'
        f: [1]
        sol: { method: 'Площадь через диагональ.', steps: ['$d = 8$, $S = \frac{64}{2} = 32$.'], answer: '32' }
        src: b278
      - type: numeric
        cat: problem
        q: 'Диагональ квадрата 10. Найдите радиус вписанной окружности (с точностью до 0,01).'
        num: { value: 3.5355, unit: '', tolAbs: 0.01, check: '10/Math.SQRT2/2' }
        hint: 'Сторона $\frac{10}{\sqrt2}$.'
        explain: '$r = \frac{5\sqrt2}{2} \approx 3{,}54$.'
        f: [1]
        sol: { method: 'Вписанная окружность квадрата.', steps: ['$a = 5\sqrt2$.', '$r = \frac a2 \approx 3{,}54$.'], answer: '≈ 3,54' }
        src: b277
      - type: numeric
        cat: problem
        q: 'Во сколько раз площадь круга, описанного около квадрата, больше площади вписанного круга?'
        num: { value: 2, unit: '', check: '2' }
        hint: '$R = r\sqrt2$.'
        explain: '$\left(\frac Rr\right)^2 = 2$.'
        f: [1]
        sol: { method: 'Отношение площадей.', steps: ['$\frac{\pi R^2}{\pi r^2} = 2$.'], answer: '2' }
        src: b277
      - type: numeric
        cat: problem
        q: 'Сторона квадрата 10. Найдите площадь части описанного круга вне квадрата (с точностью до 0,01).'
