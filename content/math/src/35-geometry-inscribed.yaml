  # ───────────────────────────── 3.7.1 ─────────────────────────────
  - id: ma-3-7-1
    num: '3.7.1'
    title: Треугольник и окружность
    pages: [b273, b274, b275, b276, b277]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.7 «Окружность и многоугольник», пункт 3.7.1'
      summary: 'Задания на радиусы вписанной и описанной окружностей треугольника, в том числе прямоугольного и равностороннего, и на отрезки касательных.'
    stage: verified
    stageNote: 'Радиусы пересчитаны по двум формулам.'
    sourcesChecked: '2026-10-25'
    web: [*lyc, *at-101]
    theory:
      - kind: law
        title: Вписанная и описанная окружности треугольника
        body: |
          - Центр **описанной** окружности — точка пересечения серединных перпендикуляров к сторонам; $R = \frac{abc}{4S} = \frac{a}{2\sin A}$.
          - Центр **вписанной** окружности — точка пересечения биссектрис; $r = \frac Sp$.
          - Прямоугольный треугольник: $R = \frac c2$ (центр — середина гипотенузы), $r = \frac{a + b - c}{2}$.
          - Равносторонний: $R = \frac{a}{\sqrt3}$, $r = \frac{a}{2\sqrt3}$, $R = 2r$.
          - Отрезок касательной от вершины $A$ до точки касания вписанной окружности: $p - a$ ($a$ — противолежащая сторона).
        src: b273
    formulas:
      - title: Радиусы окружностей треугольника
        tex: 'R = \frac{abc}{4S} = \frac{a}{2\sin A},\qquad r = \frac{S}{p}'
        meaning: '$p$ — полупериметр, $S$ — площадь.'
        use: 'Любой треугольник.'
        src: b273
      - title: Прямоугольный треугольник
        tex: 'R = \frac c2,\qquad r = \frac{a + b - c}{2}'
        meaning: '$a$, $b$ — катеты, $c$ — гипотенуза.'
        use: 'Быстрый расчёт радиусов.'
        src: b274
      - title: Равносторонний треугольник
        tex: 'R = \frac{a}{\sqrt3} = \frac{a\sqrt3}{3},\qquad r = \frac{a}{2\sqrt3} = \frac{a\sqrt3}{6}'
        meaning: '$a$ — сторона.'
        use: 'Равносторонний треугольник.'
        src: b275
    examples:
      - title: Египетский треугольник
        given: 'Стороны 3, 4, 5. Найдите $R$ и $r$.'
        find: '$R$, $r$.'
        method: 'Формулы для прямоугольного.'
        steps:
          - '$R = \frac52 = 2{,}5$.'
          - '$r = \frac{3 + 4 - 5}{2} = 1$.'
        check: '$r = \frac Sp = \frac66 = 1$ ✓.'
        answer: '$R = 2{,}5$, $r = 1$'
        src: b274
      - title: Равносторонний треугольник
        given: 'Сторона 6. Найдите $R$ и $r$.'
        find: '$R$, $r$.'
        method: 'Формулы для равностороннего.'
        steps:
          - '$R = \frac{6}{\sqrt3} = 2\sqrt3 \approx 3{,}46$.'
          - '$r = \sqrt3 \approx 1{,}73$.'
        check: '$R = 2r$; высота $3\sqrt3 = R + r$ ✓.'
        answer: '$R = 2\sqrt3$, $r = \sqrt3$'
        src: b275
      - title: Равнобедренный треугольник
        given: 'Стороны 5, 5, 6. Найдите $r$ и $R$.'
        find: '$r$, $R$.'
        method: 'Через площадь 12.'
        steps:
          - '$p = 8$, $r = \frac{12}{8} = 1{,}5$.'
          - '$R = \frac{5 \cdot 5 \cdot 6}{4 \cdot 12} = 3{,}125$.'
        check: '$\sin$ угла против 6: $\frac{2S}{25} = 0{,}96$, $\frac{6}{2 \cdot 0{,}96} = 3{,}125$ ✓.'
        answer: '$r = 1{,}5$, $R = 3{,}125$'
        src: b276
    questions:
      - type: numeric
        cat: problem
        q: 'Катеты прямоугольного треугольника 5 и 12. Найдите радиус описанной окружности.'
        num: { value: 6.5, unit: '', check: '13/2' }
