        find: '$a$, $r$.'
        method: '$a = R\sqrt3$, $r = \frac R2$.'
        steps:
          - '$a = 6\sqrt3$.'
          - '$r = 6\cos 60^\circ = 3$.'
        check: '$R = 2r$ ✓.'
        answer: '$6\sqrt3$; $3$'
