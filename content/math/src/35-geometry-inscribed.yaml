    title: Трапеция и окружность
    pages: [b279, b280, b281]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.7 «Окружность и многоугольник», пункт 3.7.5'
      summary: 'Задания на трапеции, вписанные в окружность и описанные около окружности.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Вписанная и описанная трапеция
        body: |
          - Трапецию можно **вписать** в окружность тогда и только тогда, когда она равнобедренная.
          - Около окружности можно **описать** четырёхугольник, если суммы противоположных сторон равны: для трапеции $a + b = c + d$ (основания и боковые стороны). Тогда периметр $P = 2(a + b)$, средняя линия равна полусумме боковых сторон.
          - Высота описанной трапеции равна диаметру: $h = 2r$.
          - Равнобедренная описанная трапеция: боковая сторона $c = \frac{a + b}{2}$, $h = \sqrt{ab}$.
        src: b279
    formulas:
      - title: Описанный четырёхугольник
        tex: 'a + b = c + d,\qquad h = 2r'
        meaning: '$a$, $b$ — основания, $c$, $d$ — боковые стороны.'
        use: 'Трапеция, описанная около окружности.'
        src: b280
      - title: Равнобедренная описанная трапеция
        tex: 'c = \frac{a + b}{2},\qquad h = 2r = \sqrt{ab}'
        meaning: '$c$ — боковая сторона.'
        use: 'Высота и радиус по основаниям.'
        src: b280
    examples:
      - title: Радиус по основаниям
