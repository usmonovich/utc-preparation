topics:
  # ───────────────────────────── 1.7.1 ─────────────────────────────
  - id: ma-1-7-1
    num: '1.7.1'
    title: Линейные неравенства
    pages: [b066, b067]
    book:
      place: 'Ч. 1, 1.7 «Неравенства», пункт 1.7.1'
      summary: 'Задания на решение линейных и двойных неравенств, нахождение наибольшего/наименьшего целого решения и числа натуральных решений.'
    stage: verified
    stageNote: 'Границы промежутков проверены подстановкой точек по обе стороны.'
    sourcesChecked: '2026-10-25'
    web: [*os-27, *rs-int]
    theory:
      - kind: law
        title: Свойства неравенств
        body: |
          - К обеим частям можно прибавить одно и то же число: знак неравенства сохраняется.
          - Обе части можно умножить (разделить) на **положительное** число — знак сохраняется.
          - При умножении (делении) на **отрицательное** число знак **меняется на противоположный**: $-2x > 6 \iff x < -3$.
        src: b066
      - kind: definition
        title: Числовые промежутки
        body: |
          | неравенство | промежуток |
          | --- | --- |
          | $a < x < b$ | $(a; b)$ |
          | $a \le x \le b$ | $[a; b]$ |
          | $a \le x < b$ | $[a; b)$ |
          | $x > a$ | $(a; +\infty)$ |
          | $x \le b$ | $(-\infty; b]$ |
          Круглая скобка — конец не входит (точка «выколота»), квадратная — входит. У $\pm\infty$ скобка всегда круглая.
        src: b066
      - kind: rule
        title: Линейное неравенство ax > b
        body: |
          - $a > 0$: $x > \frac ba$; $\ a < 0$: $x < \frac ba$;
          - $a = 0$: $0 > b$ — верно при всех $x$, если $b < 0$; решений нет, если $b \ge 0$.
          **Двойное неравенство** $m < ax + b < M$ решают сразу, выполняя одинаковые действия над всеми тремя частями.
        src: b067
    formulas:
      - title: Решение линейного неравенства
        tex: 'ax > b:\quad a > 0 \Rightarrow x > \frac ba,\qquad a < 0 \Rightarrow x < \frac ba'
        meaning: '$a$ — коэффициент при $x$, $b$ — число.'
        use: 'После раскрытия скобок и переноса слагаемых.'
        limits: 'При $a = 0$ — все $x$ или ни одного, в зависимости от знака $b$.'
        src: b066
      - title: Двойное неравенство
        tex: 'm < ax + b < M,\ a > 0 \ \iff\ \frac{m - b}{a} < x < \frac{M - b}{a}'
        meaning: 'При $a < 0$ границы меняются местами, знаки — на противоположные.'
        use: 'Неравенства вида $-3 < 2 - 5x \le 7$.'
        src: b067
    examples:
      - title: Деление на отрицательное число
        given: 'Решите неравенство $3(x - 2) - 4 > 5x + 2$.'
        find: 'множество решений.'
        method: 'Раскрыть скобки, перенести, разделить на коэффициент.'
        steps:
          - '$3x - 10 > 5x + 2$.'
          - '$-2x > 12$.'
          - 'Делим на $-2$, знак меняется: $x < -6$.'
        check: '$x = -7$: $-31 > -33$ ✓; $x = -5$: $-25 > -23$ — неверно ✓.'
        answer: '$(-\infty; -6)$'
        src: b066
      - title: Дробные коэффициенты
        given: 'Найдите наибольшее целое решение неравенства $\dfrac{x - 1}{2} - \dfrac{x + 1}{3} \le 1$.'
        find: 'наибольшее целое $x$.'
        method: 'Умножить на 6 (положительное число — знак сохраняется).'
        steps:
          - '$3(x - 1) - 2(x + 1) \le 6$.'
          - '$x - 5 \le 6$, $x \le 11$.'
        check: '$x = 11$: $5 - 4 = 1 \le 1$ ✓; $x = 12$: $5{,}5 - 4\frac13 > 1$.'
        answer: '$11$'
        src: b066
      - title: Двойное неравенство
        given: 'Решите неравенство $-3 < 2 - 5x \le 7$.'
        find: 'промежуток.'
        method: 'Действия со всеми тремя частями.'
        steps:
          - 'Вычитаем 2: $-5 < -5x \le 5$.'
          - 'Делим на $-5$ (знаки меняются): $1 > x \ge -1$.'
        check: '$x = -1$: $2 + 5 = 7 \le 7$ ✓; $x = 1$: $-3 < -3$ — неверно, конец выколот ✓.'
        answer: '$[-1; 1)$'
        src: b067
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение неравенства $2x - 7 < 5$.'
        num: { value: 5, unit: '', check: 'Math.ceil(6)-1' }
        hint: '$x < 6$, а 6 не входит.'
        explain: '$2x < 12$, $x < 6$; наибольшее целое — $5$.'
        f: [1]
        sol: { method: 'Линейное неравенство.', steps: ['$2x < 12$.', '$x < 6$; наибольшее целое $5$.'], answer: '5' }
        src: b066
      - type: numeric
        cat: problem
        q: 'Найдите сумму натуральных решений неравенства $5 - 3x \ge -10$.'
        num: { value: 15, unit: '', check: '1+2+3+4+5' }
        hint: 'При делении на $-3$ знак меняется.'
        explain: '$-3x \ge -15$, $x \le 5$; натуральные $1, \dots, 5$, сумма $15$.'
        f: [1]
        sol: { method: 'Деление на отрицательное число.', steps: ['$-3x \ge -15$.', '$x \le 5$.', '$1 + 2 + 3 + 4 + 5 = 15$.'], answer: '15' }
        src: b066
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение неравенства $\dfrac{x + 4}{3} > \dfrac{x - 2}{2}$.'
        num: { value: 13, unit: '', check: '13' }
        hint: 'Умножьте на 6.'
        explain: '$2x + 8 > 3x - 6$, $x < 14$; ответ $13$.'
        sol: { method: 'Умножение на общий знаменатель.', steps: ['$2(x + 4) > 3(x - 2)$.', '$2x + 8 > 3x - 6 \Rightarrow x < 14$.', 'Наибольшее целое — $13$.'], check: '$x = 13$: $\frac{17}{3} \approx 5{,}67 > 5{,}5$.', answer: '13' }
        src: b066
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $-1 \le \dfrac{3 - 2x}{5} < 1$?'
        num: { value: 5, unit: '', check: '5' }
        hint: 'Умножьте все части на 5, затем вычтите 3 и разделите на $-2$.'
        explain: '$-8 \le -2x < 2 \Rightarrow -1 < x \le 4$: целые $0, 1, 2, 3, 4$.'
        f: [2]
        sol: { method: 'Двойное неравенство.', steps: ['$-5 \le 3 - 2x < 5$.', '$-8 \le -2x < 2$.', '$4 \ge x > -1$: целые $0, 1, 2, 3, 4$ — пять.'], answer: '5' }
        src: b067
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее решение неравенства $0{,}5x - 3 \le 0{,}2x$.'
        num: { value: 10, unit: '', check: '3/0.3' }
        hint: 'Перенесите $0{,}2x$ влево.'
        explain: '$0{,}3x \le 3$, $x \le 10$.'
        sol: { method: 'Линейное неравенство.', steps: ['$0{,}3x \le 3$.', '$x \le 10$, наибольшее решение $10$.'], answer: '10' }
        src: b066
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее целое решение неравенства $4(x - 1) > 2x + 3$.'
        num: { value: 4, unit: '', check: 'Math.floor(3.5)+1' }
        hint: '$x > 3{,}5$.'
        explain: '$2x > 7$, $x > 3{,}5$; наименьшее целое $4$.'
        sol: { method: 'Линейное неравенство.', steps: ['$4x - 4 > 2x + 3$.', '$2x > 7$, $x > 3{,}5$.', 'Наименьшее целое $4$.'], answer: '4' }
        src: b066
      - type: single
        cat: theory
        q: 'Что происходит со знаком неравенства при умножении обеих частей на отрицательное число?'
        opts: ['меняется на противоположный', 'сохраняется', 'становится равенством', 'зависит от неравенства']
        ans: a
        hint: '$2 < 3$, а $-2 \ ? \ -3$.'
        explain: '$2 < 3$, но $-2 > -3$: знак меняется.'
        src: b066
      - type: single
        cat: theory
        q: 'Решения неравенства $0 \cdot x > -2$:'
        opts: ['любое $x$', 'решений нет', '$x > 0$', '$x > -2$']
        ans: a
        hint: 'Левая часть всегда равна 0.'
        explain: '$0 > -2$ — верно при любом $x$.'
        f: [1]
        src: b066

  # ───────────────────────────── 1.7.2 ─────────────────────────────
  - id: ma-1-7-2
    num: '1.7.2'
    title: Системы линейных неравенств
    pages: [b067, b068, b069]
    book:
      place: 'Ч. 1, 1.7 «Неравенства», пункт 1.7.2'
      summary: 'Задания на системы линейных неравенств: найти промежуток, число целых решений, их сумму, наибольшее или наименьшее целое решение.'
    stage: verified
    stageNote: 'Целые решения пересчитаны перебором.'
    sourcesChecked: '2026-10-25'
    web: [*os-27, *rs-int]
    theory:
      - kind: rule
        title: Решение системы неравенств
        body: |
          Решение системы — **пересечение** множеств решений всех неравенств. Каждое неравенство решают отдельно, результаты отмечают на одной числовой прямой и берут общую часть.
          - $\begin{cases} x > a \\ x > b \end{cases} \iff x > \max(a, b)$; $\quad \begin{cases} x < a \\ x < b \end{cases} \iff x < \min(a, b)$;
          - $\begin{cases} x > a \\ x < b \end{cases}$: при $a < b$ — $(a; b)$, при $a \ge b$ — решений нет.
        src: b067
      - kind: rule
        title: Подсчёт целых решений
        body: |
          На отрезке $[m; n]$ (целые $m \le n$) ровно $n - m + 1$ целых чисел. Для интервала с выколотыми концами исключите их. Сумма целых чисел от $m$ до $n$ равна $\frac{(m + n)(n - m + 1)}{2}$.
        src: b068
    formulas:
      - title: Пересечение лучей
        tex: '\begin{cases} x > a \\ x < b \end{cases} \iff a < x < b\quad (a < b)'
        meaning: 'При $a \ge b$ — пустое множество.'
        use: 'Системы из двух неравенств.'
        src: b067
      - title: Число и сумма целых на отрезке
        tex: 'N = n - m + 1,\qquad S = \frac{(m + n)(n - m + 1)}{2}'
        meaning: '$m \le n$ — целые концы отрезка $[m; n]$.'
        use: 'Ответы вида «сколько целых решений», «сумма целых решений».'
        src: b068
    examples:
      - title: Система с отрезком
        given: 'Решите систему $\begin{cases} 2x - 1 > 3 \\ 3x + 2 \le 17 \end{cases}$ и найдите число целых решений.'
        find: 'промежуток и число целых решений.'
        method: 'Решить каждое неравенство и пересечь.'
        steps:
          - '$x > 2$ и $x \le 5$.'
          - '$(2; 5]$: целые $3, 4, 5$.'
        check: '$x = 5$: $9 > 3$, $17 \le 17$ ✓; $x = 2$: $3 > 3$ — неверно ✓.'
        answer: '$(2; 5]$; три целых решения'
        src: b067
      - title: Несовместная система
        given: 'Решите систему $\begin{cases} 3 - x < 1 \\ 2x + 1 < 3 \end{cases}$.'
        find: 'решения.'
        method: 'Пересечение промежутков.'
        steps:
          - '$3 - x < 1 \Rightarrow x > 2$.'
          - '$2x + 1 < 3 \Rightarrow x < 1$.'
          - 'Общих точек у $(2; +\infty)$ и $(-\infty; 1)$ нет.'
        check: 'Любое $x > 2$ нарушает второе неравенство ✓.'
        answer: 'решений нет'
        src: b067
      - title: Три неравенства
        given: 'Найдите сумму целых решений системы $\begin{cases} -2x < 6 \\ \frac x2 \ge -1 \\ x - 4 < 1 \end{cases}$.'
        find: 'сумму целых решений.'
        method: 'Пересечь три промежутка.'
        steps:
          - '$x > -3$, $x \ge -2$, $x < 5$ — получаем $[-2; 5)$.'
          - 'Целые: $-2, -1, 0, 1, 2, 3, 4$; сумма $7$.'
        check: 'По формуле: $m = -2$, $n = 4$: $\frac{2 \cdot 7}{2} = 7$ ✓.'
        answer: '$7$'
        src: b068
    questions:
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у системы $\begin{cases} x - 2 > 0 \\ 3x < 21 \end{cases}$?'
        num: { value: 4, unit: '', check: '6-3+1' }
        hint: '$(2; 7)$.'
        explain: 'Целые $3, 4, 5, 6$.'
        f: [1]
        sol: { method: 'Пересечение промежутков.', steps: ['$x > 2$, $x < 7$.', 'Целые $3, 4, 5, 6$ — четыре.'], answer: '4' }
        src: b067
      - type: numeric
        cat: problem
        q: 'Найдите сумму целых решений системы $\begin{cases} 2x + 5 \ge 1 \\ 4 - x > 0 \end{cases}$.'
        num: { value: 3, unit: '', check: '-2-1+0+1+2+3' }
        hint: '$[-2; 4)$.'
        explain: 'Целые $-2, \dots, 3$; сумма $3$.'
        f: [2]
        sol: { method: 'Пересечение и сумма.', steps: ['$x \ge -2$, $x < 4$.', 'Целые $-2, -1, 0, 1, 2, 3$.', 'Сумма $3$.'], answer: '3' }
        src: b068
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение системы $\begin{cases} 3x - 1 < 2x + 5 \\ x + 4 > 0 \end{cases}$.'
        num: { value: 5, unit: '', check: '5' }
        hint: '$x < 6$ и $x > -4$.'
        explain: '$(-4; 6)$: наибольшее целое $5$.'
        sol: { method: 'Пересечение промежутков.', steps: ['$x < 6$.', '$x > -4$.', 'Наибольшее целое $5$.'], answer: '5' }
        src: b067
      - type: numeric
        cat: problem
        q: 'Решите систему $\begin{cases} x \ge 3 \\ 2x \le 6 \end{cases}$.'
        num: { value: 3, unit: '', check: '3' }
        hint: 'Пересечение $[3; +\infty)$ и $(-\infty; 3]$.'
        explain: 'Единственное решение $x = 3$.'
        sol: { method: 'Пересечение лучей.', steps: ['$x \ge 3$ и $x \le 3$.', 'Общая точка одна: $x = 3$.'], answer: '3' }
        src: b067
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у системы $\begin{cases} 5x - 2 > 3x \\ 7 - 2x \ge -3 \end{cases}$?'
        num: { value: 4, unit: '', check: '5-2+1' }
        hint: '$x > 1$, $x \le 5$.'
        explain: 'Целые $2, 3, 4, 5$.'
        f: [2]
        sol: { method: 'Пересечение.', steps: ['$2x > 2 \Rightarrow x > 1$.', '$-2x \ge -10 \Rightarrow x \le 5$.', 'Целые $2, 3, 4, 5$ — четыре.'], answer: '4' }
        src: b068
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее целое решение системы $\begin{cases} \frac{x - 1}{2} > 1 \\ x < 10 \end{cases}$.'
        num: { value: 4, unit: '', check: '4' }
        hint: '$x > 3$.'
        explain: '$(3; 10)$: наименьшее целое $4$.'
        sol: { method: 'Пересечение.', steps: ['$x - 1 > 2 \Rightarrow x > 3$.', '$(3; 10)$, наименьшее целое $4$.'], answer: '4' }
        src: b067
      - type: single
        cat: theory
        q: 'Решения системы $\begin{cases} x > 5 \\ x < 2 \end{cases}$:'
        opts: ['решений нет', '$(2; 5)$', '$x > 5$', '$x < 2$']
        ans: a
        hint: 'Нужно одновременно больше 5 и меньше 2.'
        explain: 'Промежутки $(5; +\infty)$ и $(-\infty; 2)$ не пересекаются.'
        f: [1]
        src: b067
      - type: single
        cat: theory
        q: 'Решения системы $\begin{cases} x > -1 \\ x > 4 \end{cases}$:'
        opts: ['$x > 4$', '$x > -1$', '$-1 < x < 4$', 'решений нет']
        ans: a
        hint: 'Оба неравенства должны выполняться.'
        explain: 'Пересечение лучей $x > -1$ и $x > 4$ — луч $x > 4$ (больший из концов).'
        src: b067

  # ───────────────────────────── 1.7.3 ─────────────────────────────
  - id: ma-1-7-3
    num: '1.7.3'
    title: Метод интервалов
    pages: [b069, b070, b071, b072, b073, b074, b075, b076]
    book:
      place: 'Ч. 1, 1.7 «Неравенства», пункт 1.7.3'
      summary: 'Задания на квадратные, рациональные и разложенные на множители неравенства (в том числе с множителями в чётной степени): найти решение, число и сумму целых решений, область определения.'
    stage: verified
    stageNote: 'Знаки на промежутках проверены подстановкой пробных точек; целые решения пересчитаны перебором.'
    sourcesChecked: '2026-10-25'
    web: [*rs-im, *lt-qi]
    theory:
      - kind: rule
        title: Алгоритм метода интервалов
        body: |
          1. Перенести всё в одну часть и разложить её на множители вида $(x - x_i)$ (дробь — числитель и знаменатель отдельно).
          2. Отметить на прямой нули числителя и знаменателя. Нули знаменателя **всегда выколоты**; нули числителя закрашены только в нестрогом неравенстве.
          3. Определить знак на крайнем правом промежутке (при старших коэффициентах множителей, равных 1, он «+»).
          4. При переходе через корень **нечётной** кратности знак меняется, через корень **чётной** кратности — сохраняется.
          5. Выписать промежутки с нужным знаком.
        src: b069
        fig: sign-chart
      - kind: rule
        title: Квадратное неравенство
        body: |
          Для $ax^2 + bx + c$ с корнями $x_1 < x_2$ и $a > 0$ (ветви параболы вверх):
          - $ax^2 + bx + c > 0 \iff x < x_1$ или $x > x_2$;
          - $ax^2 + bx + c < 0 \iff x_1 < x < x_2$.
          При $D < 0$ трёхчлен имеет знак $a$ при всех $x$: $x^2 + 2x + 5 > 0$ всегда.
        src: b070
      - kind: rule
        title: Рациональные неравенства
        body: |
          $\frac{P}{Q} > 0 \iff P \cdot Q > 0$; $\ \frac PQ \ge 0 \iff P \cdot Q \ge 0$ и $Q \ne 0$.
          **Нельзя** умножать неравенство на знаменатель с неизвестным знаком — так теряются или появляются решения.
        src: b071
    formulas:
      - title: Рациональное неравенство
        tex: '\frac{P(x)}{Q(x)} \ge 0 \iff \begin{cases} P(x)\,Q(x) \ge 0, \\ Q(x) \ne 0 \end{cases}'
        meaning: '$P$, $Q$ — многочлены.'
        use: 'Сведение дроби к произведению для метода интервалов.'
        limits: 'Нули $Q$ всегда исключаются.'
        src: b071
      - title: Знак квадратного трёхчлена
        tex: 'a > 0:\quad ax^2 + bx + c < 0 \iff x_1 < x < x_2'
        meaning: '$x_1 < x_2$ — корни; при $a < 0$ знаки меняются местами.'
        use: 'Квадратные неравенства без построения таблицы.'
        src: b070
      - title: Множитель чётной степени
        tex: '(x - a)^{2k} \ge 0;\qquad (x - a)^{2k} > 0 \iff x \ne a'
        meaning: '$k$ — натуральное; корень $a$ чётной кратности.'
        use: 'Знак не меняется при переходе через $a$; точку $a$ проверяют отдельно.'
        src: b072
    examples:
      - title: Три множителя
        given: 'Решите неравенство $(x + 2)(x - 1)(x - 3) > 0$.'
        find: 'промежутки.'
        method: 'Метод интервалов.'
        steps:
          - 'Корни $-2$, $1$, $3$ (все выколоты — неравенство строгое).'
          - 'Справа от 3 знак «+», далее чередуется: $(1; 3)$ «−», $(-2; 1)$ «+», $(-\infty; -2)$ «−».'
        check: '$x = 0$: $2 \cdot (-1)(-3) = 6 > 0$ ✓; $x = 2$: $4 \cdot 1 \cdot (-1) < 0$ ✓.'
        answer: '$(-2; 1) \cup (3; +\infty)$'
        src: b069
      - title: Дробное неравенство
        given: 'Решите неравенство $\dfrac{x - 4}{x + 1} \le 0$.'
        find: 'промежуток.'
        method: 'Нуль числителя $4$ (закрашен), нуль знаменателя $-1$ (выколот).'
        steps:
          - 'Знаки: $x > 4$ «+», $(-1; 4)$ «−», $x < -1$ «+».'
          - 'Ответ: $(-1; 4]$.'
        check: '$x = 0$: $-4 \le 0$ ✓; $x = 4$: $0 \le 0$ ✓; $x = -1$ не определено ✓.'
        answer: '$(-1; 4]$'
        src: b071
      - title: Корень чётной кратности
        given: 'Решите неравенство $(x - 2)^2(x + 1) \le 0$.'
        find: 'множество решений.'
        method: 'Через корень 2 (кратность 2) знак не меняется.'
        steps:
          - 'Справа от 2: «+»; на $(-1; 2)$ тоже «+»; левее $-1$: «−».'
          - 'Нестрогое неравенство: добавляем нули $-1$ и $2$.'
        check: '$x = 2$: $0 \le 0$ ✓ — изолированная точка; $x = 0$: $4 > 0$ ✓.'
        answer: '$(-\infty; -1] \cup \{2\}$'
        src: b072
    questions:
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $x^2 - 5x + 4 \le 0$?'
        num: { value: 4, unit: '', check: '4-1+1' }
        hint: 'Корни $1$ и $4$, ветви вверх.'
        explain: '$[1; 4]$: целые $1, 2, 3, 4$.'
        f: [2]
        sol: { method: 'Квадратное неравенство.', steps: ['Корни $1$ и $4$.', 'Между корнями трёхчлен $\le 0$: $[1; 4]$.', 'Целых — четыре.'], answer: '4' }
        src: b070
      - type: numeric
        cat: problem
        q: 'Найдите сумму целых решений неравенства $(x + 3)(x - 2) < 0$.'
        num: { value: -2, unit: '', check: '-2-1+0+1' }
        hint: 'Решение между корнями.'
        explain: '$(-3; 2)$: $-2 - 1 + 0 + 1 = -2$.'
        sol: { method: 'Метод интервалов.', steps: ['Корни $-3$, $2$; между ними «−».', 'Целые $-2, -1, 0, 1$; сумма $-2$.'], answer: '−2' }
        src: b069
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $\dfrac{x - 5}{x + 2} < 0$?'
        num: { value: 6, unit: '', check: '4-(-1)+1' }
        hint: 'Сведите к $(x - 5)(x + 2) < 0$.'
        explain: '$(-2; 5)$: целые $-1, 0, 1, 2, 3, 4$ — шесть.'
        f: [1]
        sol: { method: 'Рациональное неравенство.', steps: ['$(x - 5)(x + 2) < 0$.', '$-2 < x < 5$.', 'Целые от $-1$ до $4$ — шесть.'], answer: '6' }
        src: b071
      - type: numeric
        cat: problem
        q: 'Найдите сумму целых решений неравенства $(x + 1)(x - 2)(x - 6) \le 0$, принадлежащих отрезку $[-3; 6]$.'
