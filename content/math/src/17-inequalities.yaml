  # ───────────────────────────── 1.7.4 ─────────────────────────────
  - id: ma-1-7-4
    num: '1.7.4'
    title: Параметрические неравенства
    pages: [b076, b077]
    book:
      place: 'Ч. 1, 1.7 «Неравенства», пункт 1.7.4'
      summary: 'Задания на неравенства с параметром: линейные (разбор знака коэффициента) и квадратные (выполняется при всех $x$, имеет единственное решение и т. п.).'
    stage: verified
    stageNote: 'Найденные значения параметра проверены подстановкой.'
    sourcesChecked: '2026-10-25'
    web: [*kfu-par, *lt-qi]
    theory:
      - kind: rule
        title: Линейное неравенство с параметром
        body: |
          $A(a)\,x > B(a)$ решают, разбирая знак коэффициента:
          - $A > 0$: $x > \frac BA$;
          - $A < 0$: $x < \frac BA$ (знак меняется);
          - $A = 0$: $0 > B$ — все $x$ при $B < 0$ или ни одного при $B \ge 0$.
        src: b076
      - kind: rule
        title: Квадратный трёхчлен при всех x
        body: |
          - $ax^2 + bx + c > 0$ при всех $x$ $\iff$ $a > 0$ и $D < 0$ (или $a = b = 0$, $c > 0$);
          - $ax^2 + bx + c < 0$ при всех $x$ $\iff$ $a < 0$ и $D < 0$ (или $a = b = 0$, $c < 0$);
          - $ax^2 + bx + c \ge 0$ при всех $x$ ($a > 0$) $\iff D \le 0$.
          Неравенство $ax^2 + bx + c \le 0$ с $a > 0$ имеет **единственное** решение, когда $D = 0$ (решение — вершина $-\frac{b}{2a}$).
        src: b077
    formulas:
      - title: Положительность при всех x
        tex: 'ax^2 + bx + c > 0\ \forall x \iff \begin{cases} a > 0, \\ D < 0 \end{cases}\quad (a \ne 0)'
        meaning: '$D = b^2 - 4ac$.'
        use: 'Задачи «при каких $a$ неравенство верно при всех $x$».'
        limits: 'Если старший коэффициент зависит от параметра, случай $a = 0$ разбирают отдельно.'
        src: b077
      - title: Решение линейного неравенства с параметром
        tex: 'Ax > B:\quad \begin{cases} A > 0: & x > \frac BA, \\ A < 0: & x < \frac BA, \\ A = 0: & B < 0 \Rightarrow x \in \mathbb R;\ B \ge 0 \Rightarrow \varnothing \end{cases}'
        meaning: '$A$, $B$ зависят от параметра.'
        use: 'Полное исследование линейного неравенства.'
        src: b076
    examples:
      - title: Разбор знака коэффициента
        given: 'Решите неравенство $ax > 2$ при всех $a$.'
        find: 'решения в зависимости от $a$.'
        method: 'Три случая знака $a$.'
        steps:
          - '$a > 0$: $x > \frac2a$.'
          - '$a < 0$: $x < \frac2a$.'
          - '$a = 0$: $0 > 2$ — решений нет.'
        check: '$a = -1$: $-x > 2 \iff x < -2 = \frac{2}{-1}$ ✓.'
        answer: '$a > 0$: $x > \frac2a$; $a < 0$: $x < \frac2a$; $a = 0$: решений нет'
        src: b076
      - title: Верно при всех x
        given: 'При каких $m$ неравенство $x^2 - 2mx + 9 > 0$ выполняется при всех $x$?'
        find: 'значения $m$.'
        method: '$a = 1 > 0$, нужно $D < 0$.'
        steps:
          - '$\frac D4 = m^2 - 9 < 0$.'
          - '$-3 < m < 3$.'
        check: '$m = 3$: $(x - 3)^2 > 0$ нарушается при $x = 3$ — граница не входит ✓.'
        answer: '$-3 < m < 3$'
        src: b077
      - title: Заданное множество решений
        given: 'При каких $a$ решением неравенства $(a - 2)x > a - 2$ является промежуток $x < 1$?'
        find: '$a$.'
        method: 'Знак меняется, только если коэффициент отрицателен.'
        steps:
          - '$a - 2 < 0$: делим со сменой знака — $x < 1$.'
          - '$a - 2 > 0$ даёт $x > 1$; $a = 2$ — решений нет.'
        check: '$a = 0$: $-2x > -2 \iff x < 1$ ✓.'
        answer: '$a < 2$'
        src: b076
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое $m$, при котором неравенство $x^2 + mx + 4 > 0$ выполняется при всех $x$.'
        num: { value: 3, unit: '', check: '3' }
        hint: '$D = m^2 - 16 < 0$.'
        explain: '$-4 < m < 4$; наибольшее целое $3$.'
        f: [1]
        sol: { method: 'Условие $D < 0$.', steps: ['$m^2 - 16 < 0$.', '$-4 < m < 4$, наибольшее целое $3$.'], answer: '3' }
        src: b077
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее целое $m$, при котором $x^2 - 2x + m > 0$ при всех $x$.'
        num: { value: 2, unit: '', check: '2' }
        hint: '$\frac D4 = 1 - m < 0$.'
        explain: '$m > 1$; наименьшее целое $2$.'
        f: [1]
        sol: { method: 'Условие $D < 0$.', steps: ['$1 - m < 0 \Rightarrow m > 1$.', 'Наименьшее целое $2$; при $m = 1$: $(x - 1)^2 > 0$ неверно при $x = 1$.'], answer: '2' }
        src: b077
      - type: numeric
        cat: problem
        q: 'При каком $a$ множество решений неравенства $ax < 6$ — промежуток $x > -3$?'
        num: { value: -2, unit: '', check: '6/(-3)' }
        hint: 'Знак сменился — значит, $a < 0$.'
        explain: '$x > \frac6a = -3$, $a = -2$.'
        f: [2]
        sol: { method: 'Деление на отрицательный параметр.', steps: ['$a < 0$: $x > \frac6a$.', '$\frac6a = -3 \Rightarrow a = -2$.'], answer: '−2' }
        src: b076
      - type: numeric
        cat: problem
        q: 'При каком $a$ неравенство $x^2 - 6x + a \le 0$ имеет единственное решение?'
        num: { value: 9, unit: '', check: '36/4' }
        hint: 'Парабола касается оси: $D = 0$.'
        explain: '$36 - 4a = 0$, $a = 9$: $(x - 3)^2 \le 0 \iff x = 3$.'
        sol: { method: 'Условие $D = 0$.', steps: ['$D = 36 - 4a = 0 \Rightarrow a = 9$.', '$(x - 3)^2 \le 0$ только при $x = 3$.'], answer: '9' }
        src: b077
      - type: numeric
        cat: problem
        q: 'Сколько целых значений $a$, при которых неравенство $x^2 - ax + 1 \ge 0$ выполняется при всех $x$?'
        num: { value: 5, unit: '', check: '2-(-2)+1' }
        hint: 'Нестрогое: $D \le 0$.'
        explain: '$a^2 - 4 \le 0 \iff -2 \le a \le 2$: пять целых.'
        sol: { method: 'Условие $D \le 0$.', steps: ['$a^2 - 4 \le 0$.', '$a \in [-2; 2]$: $-2, -1, 0, 1, 2$.'], answer: '5' }
        src: b077
      - type: numeric
        cat: problem
        q: 'При каком $a$ неравенство $(a + 3)x > 5$ не имеет решений?'
        num: { value: -3, unit: '', check: '-3' }
        hint: 'Коэффициент при $x$ равен нулю.'
        explain: '$a = -3$: $0 > 5$ — неверно.'
        f: [2]
        sol: { method: 'Случай $A = 0$.', steps: ['$a + 3 = 0 \Rightarrow a = -3$.', '$0 \cdot x > 5$ — решений нет.'], answer: '−3' }
        src: b076
      - type: single
        cat: theory
        q: 'При каких $x$ выполнено $-x^2 + 4x - 5 < 0$?'
        opts: ['при всех $x$', 'ни при каких', '$1 < x < 5$', '$x > 2$']
        ans: a
        hint: '$a = -1 < 0$, $D = 16 - 20 < 0$.'
        explain: '$-x^2 + 4x - 5 = -\big((x - 2)^2 + 1\big) < 0$ всегда.'
        f: [1]
        src: b077
      - type: single
        cat: theory
        q: 'Условие «$ax^2 + bx + c < 0$ при всех $x$» (при $a \ne 0$):'
        opts: ['$a < 0$ и $D < 0$', '$a > 0$ и $D < 0$', '$a < 0$ и $D > 0$', '$D = 0$']
        ans: a
        hint: 'Парабола целиком под осью.'
        explain: 'Ветви вниз ($a < 0$) и нет пересечений с осью ($D < 0$).'
        f: [1]
        src: b077

  # ───────────────────────────── 1.7.5 ─────────────────────────────
  - id: ma-1-7-5
    num: '1.7.5'
    title: Доказательство неравенств
    pages: [b077, b078, b079, b080]
    book:
      place: 'Ч. 1, 1.7 «Неравенства», пункт 1.7.5'
      summary: 'Задания на сравнение чисел (в том числе с корнями), нахождение наименьшего значения выражений выделением полного квадрата и верные соотношения между выражениями.'
    stage: verified
    stageNote: 'Сравнения и наименьшие значения проверены численно.'
    sourcesChecked: '2026-10-25'
    web: [*rs-sq, *mu-am]
    theory:
      - kind: rule
        title: Метод разности
        body: |
          Чтобы доказать $A \ge B$, рассматривают разность $A - B$ и показывают, что она неотрицательна — обычно приводя её к сумме квадратов.
          Пример: $a^2 + b^2 - 2ab = (a - b)^2 \ge 0$, поэтому $a^2 + b^2 \ge 2ab$; равенство при $a = b$.
          **Наименьшее значение** квадратного трёхчлена находят выделением полного квадрата: $x^2 - 6x + 11 = (x - 3)^2 + 2 \ge 2$.
        src: b077
      - kind: law
        title: Неравенство Коши (о средних)
        body: |
          Для $a, b \ge 0$: $\frac{a + b}{2} \ge \sqrt{ab}$, равенство только при $a = b$.
          Следствия: $a + \frac1a \ge 2$ при $a > 0$; $x + \frac kx \ge 2\sqrt k$ при $x, k > 0$; при фиксированной сумме $x + y = S$ произведение $xy \le \frac{S^2}{4}$.
        src: b078
        fig: am-gm
      - kind: rule
        title: Сравнение чисел с корнями
        body: |
          Положительные числа сравнивают по квадратам: $\sqrt5 + \sqrt7$ и $2\sqrt6$: $12 + 2\sqrt{35}$ и $24$, то есть $\sqrt{35}$ и $6$; $35 < 36$, значит, $\sqrt5 + \sqrt7 < 2\sqrt6$.
          Общий факт: $\sqrt{n - 1} + \sqrt{n + 1} < 2\sqrt n$.
        src: b078
    formulas:
      - title: Неравенство между средними
        tex: '\frac{a + b}{2} \ge \sqrt{ab}\qquad (a, b \ge 0)'
        meaning: 'Среднее арифметическое не меньше среднего геометрического.'
        use: 'Оценки и наименьшие значения: $x + \frac{16}{x} \ge 8$ при $x > 0$.'
        limits: 'Только для неотрицательных чисел; равенство при $a = b$.'
        src: b078
      - title: Сумма квадратов и удвоенное произведение
        tex: 'a^2 + b^2 \ge 2ab,\qquad a + \frac1a \ge 2\ (a > 0)'
        meaning: 'Следуют из $(a - b)^2 \ge 0$ и $(\sqrt a - \frac{1}{\sqrt a})^2 \ge 0$.'
        use: 'Доказательство неравенств методом разности.'
        src: b077
      - title: Наименьшее значение трёхчлена
        tex: 'x^2 + px + q = \left(x + \frac p2\right)^2 + q - \frac{p^2}{4} \ge q - \frac{p^2}{4}'
        meaning: 'Равенство при $x = -\frac p2$.'
        use: 'Найти наименьшее значение выражения.'
        src: b077
    examples:
      - title: Метод разности
        given: 'Докажите, что $a^2 + b^2 \ge 2ab$ при любых $a$, $b$.'
        find: 'доказательство.'
        method: 'Рассмотреть разность.'
        steps:
          - '$a^2 + b^2 - 2ab = (a - b)^2$.'
          - 'Квадрат неотрицателен, значит, разность $\ge 0$; равенство при $a = b$.'
        check: '$a = 3$, $b = 1$: $10 \ge 6$ ✓; $a = b = 2$: $8 = 8$ ✓.'
        answer: 'неравенство верно при всех $a$, $b$'
        src: b077
      - title: Сравнение чисел
        given: 'Сравните $\sqrt5 + \sqrt7$ и $2\sqrt6$.'
        find: 'знак между числами.'
        method: 'Сравнить квадраты положительных чисел.'
        steps:
          - '$(\sqrt5 + \sqrt7)^2 = 12 + 2\sqrt{35}$; $(2\sqrt6)^2 = 24$.'
          - 'Сравниваем $2\sqrt{35}$ и $12$, то есть $\sqrt{35}$ и $6$: $35 < 36$.'
        check: '$2{,}236 + 2{,}646 = 4{,}882 < 4{,}899$ ✓.'
        answer: '$\sqrt5 + \sqrt7 < 2\sqrt6$'
        src: b078
      - title: Наименьшее значение по Коши
