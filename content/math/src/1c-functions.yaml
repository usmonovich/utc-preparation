  # ───────────────────────────── 1.12.5 ─────────────────────────────
  - id: ma-1-12-5
    num: '1.12.5'
    title: Обратная функция
    pages: [b132]
    book:
      place: 'Ч. 1, 1.12 «Функции», пункт 1.12.5'
      summary: 'Небольшой набор заданий: найти функцию, обратную данной, и её значение.'
    stage: verified
    stageNote: 'Обратные функции проверены условием $f(f^{-1}(x)) = x$ на нескольких точках.'
    sourcesChecked: '2026-10-25'
    web: [*ca-37, *ca-31]
    theory:
      - kind: definition
        title: Обратная функция
        body: |
          Если функция $f$ принимает каждое своё значение ровно один раз (например, строго монотонна), у неё есть **обратная** $f^{-1}$: $f^{-1}(y) = x \iff f(x) = y$.
          - Как найти: решить $y = f(x)$ относительно $x$ и поменять обозначения $x \leftrightarrow y$.
          - $D(f^{-1}) = E(f)$, $E(f^{-1}) = D(f)$; $f\big(f^{-1}(x)\big) = x$.
          - Графики $f$ и $f^{-1}$ **симметричны относительно прямой** $y = x$: точка $(a; b)$ переходит в $(b; a)$.
          У $y = x^2$ на всей прямой обратной нет (значение 4 принимается при $x = \pm2$), но на $x \ge 0$ обратная — $y = \sqrt x$.
        src: b132
        fig: inverse-mirror
    formulas:
      - title: Определение обратной функции
        tex: 'y = f(x) \iff x = f^{-1}(y),\qquad f\big(f^{-1}(x)\big) = x'
        meaning: '$f$ — взаимно однозначная функция.'
        use: 'Нахождение $f^{-1}$ и её значений: $f^{-1}(b)$ — решение уравнения $f(x) = b$.'
        src: b132
      - title: Обратная к линейной функции
        tex: 'f(x) = kx + b,\ k \ne 0 \ \Rightarrow\ f^{-1}(x) = \frac{x - b}{k}'
        meaning: 'Получается решением $y = kx + b$ относительно $x$.'
        use: 'Быстрая проверка ответа.'
        src: b132
    examples:
      - title: Линейная функция
        given: 'Найдите функцию, обратную $f(x) = 3x - 6$.'
        find: '$f^{-1}(x)$.'
        method: 'Выразить $x$ через $y$.'
        steps:
          - '$y = 3x - 6 \Rightarrow x = \frac{y + 6}{3}$.'
          - '$f^{-1}(x) = \frac{x + 6}{3}$.'
        check: '$f(f^{-1}(3)) = f(3) = 3$ ✓.'
        answer: '$f^{-1}(x) = \frac{x + 6}{3}$'
        src: b132
      - title: Дробно-линейная функция
        given: 'Найдите функцию, обратную $f(x) = \dfrac{2x + 1}{x - 3}$.'
        find: '$f^{-1}(x)$.'
        method: 'Решить относительно $x$.'
        steps:
          - '$y(x - 3) = 2x + 1 \Rightarrow x(y - 2) = 3y + 1$.'
          - '$x = \frac{3y + 1}{y - 2}$; $f^{-1}(x) = \frac{3x + 1}{x - 2}$.'
        check: '$f(10) = \frac{21}{7} = 3$, $f^{-1}(3) = \frac{10}{1} = 10$ ✓.'
        answer: '$f^{-1}(x) = \frac{3x + 1}{x - 2}$'
        src: b132
      - title: Ограничение области
        given: 'Найдите обратную к $f(x) = x^2$, $x \ge 0$.'
        find: '$f^{-1}$.'
        method: 'На $x \ge 0$ функция возрастает.'
        steps:
          - '$y = x^2$, $x \ge 0 \Rightarrow x = \sqrt y$.'
          - '$f^{-1}(x) = \sqrt x$, $x \ge 0$.'
        check: '$f(\sqrt9) = 9$ ✓.'
        answer: '$f^{-1}(x) = \sqrt x$'
        src: b132
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = 2x + 5$. Найдите $f^{-1}(11)$.'
        num: { value: 3, unit: '', check: '(11-5)/2' }
        hint: 'Решите $2x + 5 = 11$.'
        explain: '$x = 3$.'
        f: [1]
        sol: { method: 'Значение обратной функции.', steps: ['$2x + 5 = 11$.', '$x = 3$.'], answer: '3' }
        src: b132
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{x - 1}{3}$. Найдите $f^{-1}(2)$.'
        num: { value: 7, unit: '', check: '3*2+1' }
        hint: 'Решите $f(x) = 2$.'
        explain: '$x - 1 = 6$, $x = 7$.'
        f: [1]
        sol: { method: 'Значение обратной функции.', steps: ['$\frac{x - 1}{3} = 2$.', '$x = 7$.'], answer: '7' }
        src: b132
      - type: numeric
        cat: problem
        q: '$f(x) = x^3 + 1$. Найдите $f^{-1}(28)$.'
        num: { value: 3, unit: '', check: 'Math.cbrt(27)' }
        hint: '$x^3 = 27$.'
        explain: '$x = 3$.'
        f: [1]
        sol: { method: 'Решить $f(x) = 28$.', steps: ['$x^3 + 1 = 28 \Rightarrow x^3 = 27$.', '$x = 3$.'], answer: '3' }
        src: b132
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{2x + 1}{x - 3}$. Найдите $f^{-1}(3)$.'
        num: { value: 10, unit: '', check: '(3*3+1)/(3-2)' }
        hint: 'Решите $\frac{2x + 1}{x - 3} = 3$.'
