  # ───────────────────────────── 1.12.4 ─────────────────────────────
  - id: ma-1-12-4
    num: '1.12.4'
    title: Смешанный раздел
    pages: [b129, b130, b131, b132]
    book:
      place: 'Ч. 1, 1.12 «Функции», пункт 1.12.4'
      summary: 'Смешанный набор задач по функциям без новой теории в книге: композиции, кусочные функции, графики с модулем, число решений уравнения по графику. Здесь собраны приёмы, на которые опираются эти задачи (по 1.12.1–1.12.3 и открытым источникам).'
    stage: verified
    stageNote: 'Число решений проверено и алгебраически, и по графику.'
    sourcesChecked: '2026-10-25'
    web: [*ca-34, *ca-32, *ca-35]
    theory:
      - kind: rule
        title: Композиция и кусочные функции
        body: |
          - **Композиция** $f(g(x))$: сначала вычисляют $g(x)$, затем $f$ от результата. Обычно $f(g(x)) \ne g(f(x))$.
          - **Кусочная функция** задаётся разными формулами на разных промежутках; значение берут по формуле того промежутка, куда попал $x$.
        src: b129
      - kind: rule
        title: Графики с модулем и число решений
        body: |
          - $y = |f(x)|$: часть графика ниже оси $Ox$ отражается вверх.
          - $y = f(|x|)$: правая половина графика ($x \ge 0$) отражается налево — график симметричен относительно $Oy$.
          - Число решений уравнения $f(x) = a$ — число точек пересечения графика с горизонтальной прямой $y = a$.
          Пример: $y = x^2 - 2|x|$ имеет минимумы $-1$ в точках $\pm1$ и локальный максимум $0$ в нуле, поэтому $x^2 - 2|x| = a$ имеет 2 решения при $a = -1$ и $a > 0$, 4 — при $-1 < a < 0$, 3 — при $a = 0$.
        src: b130
    formulas:
      - title: Композиция функций
        tex: '(f \circ g)(x) = f\big(g(x)\big)'
        meaning: '$x$ должен входить в $D(g)$, а $g(x)$ — в $D(f)$.'
        use: 'Вычисление сложных функций.'
        src: b129
      - title: Отражения графиков
        tex: 'y = |f(x)|:\ \text{отражение части ниже } Ox;\qquad y = f(|x|):\ \text{симметрия относительно } Oy'
        meaning: 'Построение по графику $y = f(x)$.'
        use: 'Число решений уравнений с модулем.'
        src: b130
    examples:
      - title: Композиция
        given: '$f(x) = 2x + 1$, $g(x) = x^2$. Найдите $f(g(2))$ и $g(f(2))$.'
        find: 'значения.'
        method: 'Изнутри наружу.'
        steps:
          - '$g(2) = 4$, $f(4) = 9$.'
          - '$f(2) = 5$, $g(5) = 25$.'
        check: 'Порядок важен: $9 \ne 25$ ✓.'
        answer: '$9$ и $25$'
        src: b129
      - title: Число решений с модулем
        given: 'Сколько решений у уравнения $|x^2 - 4| = 3$?'
        find: 'число решений.'
        method: 'Раскрыть модуль (или по графику $y = |x^2 - 4|$).'
        steps:
          - '$x^2 - 4 = 3 \Rightarrow x = \pm\sqrt7$.'
          - '$x^2 - 4 = -3 \Rightarrow x = \pm1$.'
        check: 'Прямая $y = 3$ ниже «горба» высотой 4 — пересекает график 4 раза ✓.'
        answer: '4'
        src: b130
      - title: Параметр и график
        given: 'При каких $a$ уравнение $x^2 - 2|x| = a$ имеет ровно два решения?'
        find: 'значения $a$.'
        method: 'График $y = x^2 - 2|x|$ и горизонтальные прямые.'
        steps:
          - 'При $x \ge 0$: $(x - 1)^2 - 1$; график симметричен относительно $Oy$.'
          - 'Минимумы $-1$ при $x = \pm1$, в нуле значение $0$.'
          - 'Два пересечения: $a = -1$ или $a > 0$.'
        check: '$a = 3$: $|x| = 3$, $x = \pm3$ ✓; $a = -0{,}5$: четыре решения ✓.'
        answer: '$a = -1$ или $a > 0$'
        src: b130
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = x^2 - 1$, $g(x) = x + 2$. Найдите $f(g(1))$.'
        num: { value: 8, unit: '', check: '3*3-1' }
        hint: '$g(1) = 3$.'
        explain: '$f(3) = 8$.'
        f: [1]
        sol: { method: 'Композиция.', steps: ['$g(1) = 3$.', '$f(3) = 9 - 1 = 8$.'], answer: '8' }
        src: b129
      - type: numeric
        cat: problem
        q: '$f(x) = 3x - 2$. Найдите $f(f(2))$.'
        num: { value: 10, unit: '', check: '3*4-2' }
        hint: '$f(2) = 4$.'
        explain: '$f(4) = 10$.'
        f: [1]
        sol: { method: 'Композиция.', steps: ['$f(2) = 4$.', '$f(4) = 10$.'], answer: '10' }
        src: b129
      - type: numeric
        cat: problem
        q: 'Сколько решений у уравнения $x^2 - 2|x| = -0{,}5$?'
        num: { value: 4, unit: '', check: '4' }
        hint: 'Сравните $-0{,}5$ с минимумом $-1$ и значением $0$ в нуле.'
        explain: '$-1 < -0{,}5 < 0$ — четыре точки пересечения.'
        f: [2]
        sol: { method: 'По графику.', steps: ['$|x| = t \ge 0$: $t^2 - 2t + 0{,}5 = 0$, $t = 1 \pm \frac{\sqrt2}{2}$ — оба положительны.', 'Каждое $t$ даёт $x = \pm t$ — четыре решения.'], answer: '4' }
        src: b130
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее значение функции $y = x^2 - 2|x|$.'
        num: { value: -1, unit: '', check: '1-2' }
        hint: 'При $x \ge 0$: $(x - 1)^2 - 1$.'
        explain: 'Минимум $-1$ при $x = \pm1$.'
        sol: { method: 'Полный квадрат по $|x|$.', steps: ['$x^2 - 2|x| = (|x| - 1)^2 - 1 \ge -1$.', 'Достигается при $|x| = 1$.'], answer: '−1' }
        src: b130
      - type: numeric
        cat: problem
        q: '$f(x) = x + 1$ при $x < 0$ и $f(x) = x^2$ при $x \ge 0$. Найдите $f(-3) + f(3)$.'
        num: { value: 7, unit: '', check: '(-3+1)+9' }
        hint: 'Выберите формулу по знаку $x$.'
        explain: '$f(-3) = -2$, $f(3) = 9$; сумма $7$.'
        sol: { method: 'Кусочная функция.', steps: ['$-3 < 0$: $f(-3) = -2$.', '$3 \ge 0$: $f(3) = 9$.', 'Сумма $7$.'], answer: '7' }
        src: b129
      - type: numeric
        cat: problem
        q: 'Сколько общих точек у графиков $y = x^2$ и $y = |x|$?'
        num: { value: 3, unit: '', check: '3' }
        hint: '$x^2 = |x| \iff |x|(|x| - 1) = 0$.'
        explain: '$x = 0$ и $x = \pm1$ — три точки.'
        sol: { method: 'Уравнение с модулем.', steps: ['$|x|^2 - |x| = 0$.', '$|x| = 0$ или $|x| = 1$.', 'Точки $x = 0, \pm1$.'], answer: '3' }
        src: b130
      - type: single
        cat: theory
        q: 'График функции $y = f(|x|)$ всегда…'
