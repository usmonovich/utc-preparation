      - type: single
        cat: theory
        q: 'Вершина параболы $y = (x - 2)^2 + 3$:'
        opts: ['$(2; 3)$', '$(-2; 3)$', '$(2; -3)$', '$(3; 2)$']
        ans: a
        hint: 'Вид $a(x - x_0)^2 + y_0$.'
