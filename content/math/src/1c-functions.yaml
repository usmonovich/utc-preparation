        q: 'Если $a < 0$ и $D < 0$, то парабола $y = ax^2 + bx + c$…'
        opts: ['целиком лежит ниже оси $Ox$', 'целиком выше оси $Ox$', 'пересекает ось в двух точках', 'касается оси']
        ans: a
        hint: 'Ветви вниз, пересечений с осью нет.'
