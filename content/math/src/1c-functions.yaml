topics:
  # ───────────────────────────── 1.12.1 ─────────────────────────────
  - id: ma-1-12-1
    num: '1.12.1'
    title: Свойства функций
    pages: [b121, b122]
    book:
      place: 'Ч. 1, 1.12 «Функции», пункт 1.12.1'
      summary: 'Задания на вычисление значений функции, нахождение области определения и множества значений, на чётность функций.'
    stage: verified
    stageNote: 'Области определения проверены подстановкой граничных и внутренних точек.'
    sourcesChecked: '2026-10-25'
    web: [*ca-31, *ca-32, *ca-35]
    theory:
      - kind: definition
        title: Функция, область определения, множество значений
        body: |
          **Функция** $y = f(x)$ — правило, по которому каждому $x$ из множества $D(f)$ (**область определения**) соответствует ровно одно число $y$. Множество всех значений $y$ — **множество значений** $E(f)$.
          Если область определения не указана, её находят из условий:
          - знаменатель $\ne 0$;
          - под корнем чётной степени — выражение $\ge 0$ (в знаменателе — $> 0$);
          - (позже) под логарифмом — $> 0$, основание $> 0$ и $\ne 1$.
        src: b121
      - kind: definition
        title: Чётность и монотонность
        body: |
          Пусть $D(f)$ симметрична относительно нуля.
          - **Чётная**: $f(-x) = f(x)$ — график симметричен относительно оси $Oy$ ($x^2$, $|x|$).
          - **Нечётная**: $f(-x) = -f(x)$ — график симметричен относительно начала координат ($x^3$, $\frac1x$).
          - Большинство функций ни чётные, ни нечётные ($x^2 + x$).
          **Возрастает** на промежутке: большему $x$ соответствует большее $f(x)$; **убывает** — меньшее. **Нули** функции — корни уравнения $f(x) = 0$.
        src: b121
    formulas:
      - title: Чётная и нечётная функция
        tex: 'f(-x) = f(x)\ \text{(чётная)},\qquad f(-x) = -f(x)\ \text{(нечётная)}'
        meaning: 'Проверяется для всех $x$ из симметричной области определения.'
        use: 'Определить симметрию графика; $f(-3)$ по $f(3)$.'
        limits: 'Если $D(f)$ несимметрична (например, $x \ge 0$), функция не чётная и не нечётная.'
        src: b121
      - title: Условия области определения
        tex: '\frac{1}{g(x)}:\ g \ne 0;\qquad \sqrt{g(x)}:\ g \ge 0;\qquad \frac{1}{\sqrt{g(x)}}:\ g > 0'
        meaning: 'Ограничения, из которых складывается $D(f)$.'
        use: 'Нахождение области определения.'
        src: b121
    examples:
      - title: Знаменатель
        given: 'Найдите область определения $f(x) = \dfrac{x + 1}{x^2 - 4}$.'
        find: '$D(f)$.'
        method: 'Знаменатель не равен нулю.'
        steps:
          - '$x^2 - 4 \ne 0 \Rightarrow x \ne \pm2$.'
          - 'Числитель ограничений не даёт: остаются все $x$, кроме $\pm2$.'
        check: '$f(0) = -\frac14$ — определено; $f(2)$ — деление на ноль ✓.'
        answer: '$(-\infty; -2) \cup (-2; 2) \cup (2; +\infty)$'
        src: b121
      - title: Корень
        given: 'Найдите область определения $f(x) = \sqrt{6 - x - x^2}$.'
        find: '$D(f)$.'
        method: 'Подкоренное выражение неотрицательно.'
        steps:
          - '$6 - x - x^2 \ge 0 \iff x^2 + x - 6 \le 0 \iff (x + 3)(x - 2) \le 0$.'
          - '$-3 \le x \le 2$.'
        check: '$x = 0$: $\sqrt6$ ✓; $x = 3$: $\sqrt{-6}$ — не определено ✓.'
        answer: '$[-3; 2]$'
        src: b121
      - title: Чётность
        given: 'Исследуйте на чётность $f(x) = x^3 - 2x$, $g(x) = x^4 + |x|$, $h(x) = x^2 + x$.'
        find: 'чётность каждой функции.'
        method: 'Подставить $-x$.'
        steps:
          - '$f(-x) = -x^3 + 2x = -f(x)$ — нечётная.'
          - '$g(-x) = x^4 + |x| = g(x)$ — чётная.'
          - '$h(-x) = x^2 - x$ — не равно ни $h(x)$, ни $-h(x)$.'
        check: '$h(1) = 2$, $h(-1) = 0$ ✓.'
        answer: '$f$ — нечётная, $g$ — чётная, $h$ — ни та, ни другая'
        src: b121
    questions:
      - type: numeric
        cat: problem
        q: '$f(x) = 2x^2 - 3x + 1$. Найдите $f(-2)$.'
        num: { value: 15, unit: '', check: '2*4+6+1' }
        hint: 'Подставьте $x = -2$ (со скобками).'
        explain: '$8 + 6 + 1 = 15$.'
        sol: { method: 'Подстановка.', steps: ['$2 \cdot (-2)^2 - 3 \cdot (-2) + 1 = 8 + 6 + 1 = 15$.'], answer: '15' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Сколько целых чисел входит в область определения $f(x) = \sqrt{x + 3} + \sqrt{4 - x}$?'
        num: { value: 8, unit: '', check: '4-(-3)+1' }
        hint: 'Оба подкоренных выражения неотрицательны.'
        explain: '$-3 \le x \le 4$: восемь целых.'
        f: [2]
        sol: { method: 'Пересечение условий.', steps: ['$x \ge -3$ и $x \le 4$.', 'Целые $-3, \dots, 4$ — восемь.'], answer: '8' }
        src: b121
      - type: numeric
        cat: problem
        q: '$f(x) = \dfrac{x - 1}{x + 2}$. Найдите $f(f(0))$.'
        num: { value: -1, unit: '', check: '((-1/2)-1)/((-1/2)+2)' }
        hint: 'Сначала $f(0)$.'
        explain: '$f(0) = -\frac12$; $f\left(-\frac12\right) = \frac{-1{,}5}{1{,}5} = -1$.'
        sol: { method: 'Последовательная подстановка.', steps: ['$f(0) = -\frac12$.', '$f(-\frac12) = \frac{-\frac32}{\frac32} = -1$.'], answer: '−1' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее значение функции $y = x^2 - 4x + 7$ (левую границу множества значений).'
        num: { value: 3, unit: '', check: '4-8+7' }
        hint: '$(x - 2)^2 + 3$.'
        explain: '$E(y) = [3; +\infty)$.'
        sol: { method: 'Полный квадрат.', steps: ['$x^2 - 4x + 7 = (x - 2)^2 + 3 \ge 3$.', 'Наименьшее значение $3$ при $x = 2$.'], answer: '3' }
        src: b122
      - type: numeric
        cat: problem
        q: 'Функция $f$ нечётная, $f(3) = 5$. Найдите $f(-3)$.'
        num: { value: -5, unit: '', check: '-5' }
        hint: '$f(-x) = -f(x)$.'
        explain: '$f(-3) = -f(3) = -5$.'
        f: [1]
        sol: { method: 'Определение нечётной функции.', steps: ['$f(-3) = -f(3) = -5$.'], answer: '−5' }
        src: b121
      - type: numeric
        cat: problem
        q: 'Найдите сумму нулей функции $f(x) = x^2 - 7x + 10$.'
        num: { value: 7, unit: '', check: '2+5' }
        hint: 'Нули — корни уравнения $f(x) = 0$.'
        explain: 'Нули $2$ и $5$, сумма $7$.'
        sol: { method: 'Нули функции.', steps: ['$x^2 - 7x + 10 = 0$: $x = 2$, $x = 5$.', 'Сумма $7$.'], answer: '7' }
        src: b121
      - type: single
        cat: theory
        q: 'Какая из функций чётная?'
        opts: ['$y = |x| + x^2$', '$y = x^3$', '$y = x^2 + x$', '$y = \frac1x$']
        ans: a
        hint: 'Подставьте $-x$.'
        explain: '$|-x| + (-x)^2 = |x| + x^2$. Функции $x^3$ и $\frac1x$ нечётные, $x^2 + x$ — ни та, ни другая.'
        f: [1]
        src: b121
      - type: single
        cat: theory
        q: 'Область определения функции $y = \dfrac{1}{\sqrt{x - 1}}$:'
        opts: ['$x > 1$', '$x \ge 1$', '$x \ne 1$', '$x \ge 0$']
        ans: a
        hint: 'Корень стоит в знаменателе.'
        explain: 'Нужно $x - 1 \ge 0$ и $\sqrt{x - 1} \ne 0$, то есть $x > 1$.'
        f: [2]
        src: b121

  # ───────────────────────────── 1.12.2 ─────────────────────────────
  - id: ma-1-12-2
    num: '1.12.2'
    title: Линейная функция
    pages: [b122, b123, b124, b125]
    book:
      place: 'Ч. 1, 1.12 «Функции», пункт 1.12.2'
      summary: 'Книга выписывает условия взаимного расположения прямых $y = k_1x + b_1$ и $y = k_2x + b_2$ (пересекаются, параллельны, совпадают), то же для прямых $a_ix + b_iy = c_i$, и расстояние от точки до прямой $d = \frac{|ax_0 + by_0 + c|}{\sqrt{a^2 + b^2}}$. Задания — на уравнения прямых, точки пересечения и параметры.'
    stage: verified
    stageNote: 'Уравнения прямых проверены подстановкой точек; расстояния пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*ca-41]
    theory:
      - kind: definition
        title: Угловой коэффициент
        body: |
          **Линейная функция** $y = kx + b$; её график — прямая.
          - $k$ — **угловой коэффициент**: $k = \operatorname{tg}\alpha$ ($\alpha$ — угол наклона к оси $Ox$), $k = \frac{y_2 - y_1}{x_2 - x_1}$ по двум точкам.
          - $b$ — ордината точки пересечения с осью $Oy$.
          - $k > 0$ — функция возрастает, $k < 0$ — убывает, $k = 0$ — постоянна.
        src: b122
        fig: line-slope
      - kind: law
        title: Взаимное расположение прямых
        body: |
          Для $y = k_1x + b_1$ и $y = k_2x + b_2$:
          - $k_1 \ne k_2$ — пересекаются; $k_1k_2 = -1$ — перпендикулярны;
          - $k_1 = k_2$, $b_1 \ne b_2$ — параллельны; $k_1 = k_2$, $b_1 = b_2$ — совпадают.
          **Расстояние** от точки $(x_0; y_0)$ до прямой $ax + by + c = 0$: $d = \frac{|ax_0 + by_0 + c|}{\sqrt{a^2 + b^2}}$.
        src: b123
    formulas:
      - title: Прямая через две точки
        tex: 'k = \frac{y_2 - y_1}{x_2 - x_1},\qquad y - y_1 = k(x - x_1)'
        meaning: '$(x_1; y_1)$, $(x_2; y_2)$ — точки прямой, $x_1 \ne x_2$.'
        use: 'Составить уравнение прямой.'
        src: b122
      - title: Параллельность и перпендикулярность
        tex: 'k_1 = k_2\ (b_1 \ne b_2) \Rightarrow \parallel;\qquad k_1 k_2 = -1 \Rightarrow \perp'
        meaning: '$k_1$, $k_2$ — угловые коэффициенты.'
        use: 'Прямая, параллельная или перпендикулярная данной.'
        src: b123
      - title: Расстояние от точки до прямой
        tex: 'd = \frac{|ax_0 + by_0 + c|}{\sqrt{a^2 + b^2}}'
        meaning: 'Прямая $ax + by + c = 0$, точка $(x_0; y_0)$.'
        use: 'Расстояние, касание окружности и прямой.'
        src: b123
    examples:
      - title: Прямая через две точки
        given: 'Составьте уравнение прямой, проходящей через $(1; 3)$ и $(3; 7)$.'
        find: '$y = kx + b$.'
        method: 'Угловой коэффициент по двум точкам.'
        steps:
          - '$k = \frac{7 - 3}{3 - 1} = 2$.'
          - '$3 = 2 \cdot 1 + b \Rightarrow b = 1$.'
        check: '$2 \cdot 3 + 1 = 7$ ✓.'
        answer: '$y = 2x + 1$'
        src: b122
      - title: Параллельная прямая
        given: 'Составьте уравнение прямой, параллельной $y = -3x + 4$ и проходящей через $(2; 1)$.'
        find: 'уравнение.'
        method: 'Тот же $k$, новый $b$.'
        steps:
          - 'У параллельной прямой тот же угловой коэффициент: $k = -3$.'
          - '$1 = -3 \cdot 2 + b \Rightarrow b = 7$.'
        check: '$-3 \cdot 2 + 7 = 1$ ✓; $b = 7 \ne 4$ — прямые не совпадают.'
        answer: '$y = -3x + 7$'
        src: b123
      - title: Расстояние до прямой
        given: 'Найдите расстояние от точки $(3; 4)$ до прямой $3x + 4y - 5 = 0$.'
        find: '$d$.'
        method: 'Формула расстояния.'
        steps:
          - '$|9 + 16 - 5| = 20$, $\sqrt{9 + 16} = 5$.'
          - '$d = 4$.'
        check: 'Основание перпендикуляра $(3; 4) - 4 \cdot (0{,}6; 0{,}8) = (0{,}6; 0{,}8)$ лежит на прямой: $1{,}8 + 3{,}2 - 5 = 0$ ✓.'
        answer: '$4$'
        src: b123
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите угловой коэффициент прямой, проходящей через точки $(-1; 2)$ и $(3; 10)$.'
        num: { value: 2, unit: '', check: '(10-2)/(3+1)' }
        hint: '$k = \frac{\Delta y}{\Delta x}$.'
        explain: '$\frac{8}{4} = 2$.'
        f: [1]
        sol: { method: 'Угловой коэффициент по двум точкам.', steps: ['$k = \frac{10 - 2}{3 - (-1)} = 2$.'], answer: '2' }
        src: b122
      - type: numeric
        cat: problem
        q: 'В какой точке прямая $y = 2x - 6$ пересекает ось $Ox$? Укажите абсциссу.'
        num: { value: 3, unit: '', check: '6/2' }
        hint: 'На оси $Ox$ $y = 0$.'
        explain: '$2x - 6 = 0$, $x = 3$.'
        sol: { method: 'Нуль функции.', steps: ['$2x - 6 = 0 \Rightarrow x = 3$.'], answer: '3' }
        src: b122
      - type: numeric
        cat: problem
        q: 'Найдите угловой коэффициент прямой, перпендикулярной прямой $y = 0{,}5x + 1$.'
        num: { value: -2, unit: '', check: '-1/0.5' }
        hint: '$k_1k_2 = -1$.'
        explain: '$k_2 = -\frac{1}{0{,}5} = -2$.'
        f: [2]
        sol: { method: 'Условие перпендикулярности.', steps: ['$0{,}5 \cdot k = -1$.', '$k = -2$.'], answer: '−2' }
        src: b123
      - type: numeric
        cat: problem
        q: 'При каком $a$ прямые $y = (a - 1)x + 3$ и $y = 4x - 2$ параллельны?'
        num: { value: 5, unit: '', check: '4+1' }
        hint: 'Угловые коэффициенты равны, свободные члены разные.'
        explain: '$a - 1 = 4$, $a = 5$; $3 \ne -2$.'
        f: [2]
        sol: { method: 'Условие параллельности.', steps: ['$a - 1 = 4 \Rightarrow a = 5$.', '$b_1 = 3 \ne b_2 = -2$ — не совпадают.'], answer: '5' }
        src: b123
      - type: numeric
        cat: problem
        q: 'Найдите ординату точки пересечения прямых $y = 2x + 1$ и $y = -x + 7$.'
        num: { value: 5, unit: '', check: '2*2+1' }
        hint: 'Приравняйте правые части.'
        explain: '$2x + 1 = -x + 7$, $x = 2$, $y = 5$.'
        sol: { method: 'Система из двух уравнений.', steps: ['$3x = 6$, $x = 2$.', '$y = 2 \cdot 2 + 1 = 5$.'], answer: '5' }
        src: b123
      - type: numeric
        cat: problem
        q: 'Найдите расстояние от начала координат до прямой $3x - 4y + 10 = 0$.'
        num: { value: 2, unit: '', check: 'Math.abs(10)/Math.sqrt(9+16)' }
        hint: 'Подставьте $(0; 0)$ в формулу расстояния.'
        explain: '$\frac{10}{5} = 2$.'
        f: [3]
        sol: { method: 'Расстояние от точки до прямой.', steps: ['$\frac{|0 - 0 + 10|}{\sqrt{9 + 16}} = \frac{10}{5} = 2$.'], answer: '2' }
        src: b123
      - type: numeric
        cat: problem
        q: 'Найдите площадь треугольника, образованного прямой $y = -2x + 6$ и осями координат.'
        num: { value: 9, unit: '', check: '3*6/2' }
        hint: 'Найдите точки пересечения с осями.'
        explain: 'Отрезки на осях $3$ и $6$; площадь $\frac{3 \cdot 6}{2} = 9$.'
        sol: { method: 'Точки пересечения с осями.', steps: ['С $Oy$: $(0; 6)$; с $Ox$: $(3; 0)$.', '$S = \frac12 \cdot 3 \cdot 6 = 9$.'], answer: '9' }
        src: b122
      - type: single
        cat: theory
        q: 'Функция $y = -3x + 2$…'
        opts: ['убывает на всей числовой прямой', 'возрастает', 'постоянна', 'возрастает при $x > 0$']
        ans: a
        hint: 'Знак углового коэффициента.'
        explain: '$k = -3 < 0$ — функция убывает.'
        src: b122

  # ───────────────────────────── 1.12.3 ─────────────────────────────
  - id: ma-1-12-3
    num: '1.12.3'
    title: Квадратная функция
    pages: [b125, b126, b127, b128, b129]
    book:
      place: 'Ч. 1, 1.12 «Функции», пункт 1.12.3'
      summary: 'Задания на вершину параболы, наибольшее и наименьшее значения квадратичной функции, промежутки монотонности, нахождение коэффициентов по точкам графика.'
    stage: verified
    stageNote: 'Вершины и значения пересчитаны; коэффициенты проверены подстановкой точек.'
    sourcesChecked: '2026-10-25'
    web: [*ca-51, *ca-35, *rs-sq]
    theory:
      - kind: definition
        title: Парабола и её вершина
        body: |
          График $y = ax^2 + bx + c$ ($a \ne 0$) — **парабола**; при $a > 0$ ветви направлены вверх, при $a < 0$ — вниз.
          - Вершина: $x_0 = -\frac{b}{2a}$, $y_0 = f(x_0) = -\frac{D}{4a}$; ось симметрии $x = x_0$.
          - $a > 0$: наименьшее значение $y_0$, $E = [y_0; +\infty)$; функция убывает при $x \le x_0$ и возрастает при $x \ge x_0$.
          - $a < 0$: наибольшее значение $y_0$, $E = (-\infty; y_0]$.
          - $c = f(0)$ — точка пересечения с осью $Oy$.
        src: b125
      - kind: rule
        title: Вид с вершиной и сдвиги
        body: |
          Выделение полного квадрата даёт $y = a(x - x_0)^2 + y_0$. График получается из $y = ax^2$ сдвигом на $x_0$ по оси $Ox$ и на $y_0$ по оси $Oy$.
          Пример: $x^2 + 6x + 4 = (x + 3)^2 - 5$ — сдвиг $y = x^2$ на 3 влево и на 5 вниз.
        src: b126
        fig: parabola-vertex
    formulas:
      - title: Вершина параболы
        tex: 'x_0 = -\frac{b}{2a},\qquad y_0 = -\frac{D}{4a} = c - \frac{b^2}{4a}'
        meaning: '$a \ne 0$, $D = b^2 - 4ac$.'
        use: 'Наибольшее и наименьшее значение, ось симметрии, промежутки монотонности.'
        src: b125
      - title: Вид с выделенной вершиной
        tex: 'ax^2 + bx + c = a(x - x_0)^2 + y_0'
        meaning: '$(x_0; y_0)$ — вершина.'
        use: 'Построение графика сдвигами.'
        src: b126
    examples:
      - title: Наименьшее значение
        given: 'Найдите вершину и множество значений $y = 2x^2 - 8x + 5$.'
        find: 'вершину и $E(y)$.'
        method: 'Формулы вершины.'
        steps:
          - '$x_0 = \frac{8}{4} = 2$, $y_0 = 8 - 16 + 5 = -3$.'
          - '$a = 2 > 0$: $E = [-3; +\infty)$.'
        check: '$2(x - 2)^2 - 3 = 2x^2 - 8x + 5$ ✓.'
        answer: 'вершина $(2; -3)$, $E = [-3; +\infty)$'
        src: b125
      - title: Сдвиги
        given: 'Каким сдвигом получается график $y = x^2 + 6x + 4$ из $y = x^2$?'
        find: 'сдвиги.'
        method: 'Выделить полный квадрат.'
        steps:
          - '$x^2 + 6x + 4 = (x + 3)^2 - 5$.'
          - 'Сдвиг на 3 влево и на 5 вниз; вершина $(-3; -5)$.'
        check: '$(x + 3)^2 - 5 = x^2 + 6x + 9 - 5$ ✓.'
        answer: 'на 3 влево и на 5 вниз'
        src: b126
      - title: Коэффициенты по точкам
        given: 'Парабола $y = ax^2 + bx + 1$ проходит через точки $(1; 4)$ и $(-1; 0)$. Найдите $a$ и $b$.'
        find: '$a$, $b$.'
        method: 'Подставить точки.'
        steps:
          - '$a + b + 1 = 4$, $a - b + 1 = 0$.'
          - '$a + b = 3$, $a - b = -1 \Rightarrow a = 1$, $b = 2$.'
        check: '$y = x^2 + 2x + 1$: $y(1) = 4$, $y(-1) = 0$ ✓.'
        answer: '$a = 1$, $b = 2$'
        src: b127
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите абсциссу вершины параболы $y = 3x^2 - 12x + 1$.'
        num: { value: 2, unit: '', check: '12/6' }
        hint: '$x_0 = -\frac{b}{2a}$.'
        explain: '$\frac{12}{6} = 2$.'
        f: [1]
        sol: { method: 'Формула вершины.', steps: ['$x_0 = -\frac{-12}{2 \cdot 3} = 2$.'], answer: '2' }
        src: b125
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение функции $y = -x^2 + 4x + 5$.'
        num: { value: 9, unit: '', check: '-4+8+5' }
        hint: 'Ветви вниз — максимум в вершине.'
        explain: '$x_0 = 2$, $y_0 = -4 + 8 + 5 = 9$.'
        f: [1]
        sol: { method: 'Вершина параболы.', steps: ['$x_0 = 2$.', '$y(2) = 9$.'], answer: '9' }
        src: b125
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее значение функции $y = -2x^2 + 8x - 3$.'
        num: { value: 5, unit: '', check: '-8+16-3' }
        hint: '$x_0 = 2$.'
        explain: '$-8 + 16 - 3 = 5$.'
        f: [1]
        sol: { method: 'Вершина.', steps: ['$x_0 = -\frac{8}{-4} = 2$.', '$y(2) = 5$.'], answer: '5' }
        src: b125
      - type: numeric
        cat: problem
        q: 'При каком положительном $b$ вершина параболы $y = x^2 + bx + 9$ лежит на оси $Ox$?'
        num: { value: 6, unit: '', check: 'Math.sqrt(36)' }
        hint: 'Вершина на оси — значит, $y_0 = 0$, то есть $D = 0$.'
        explain: '$b^2 - 36 = 0$, $b = 6$.'
        f: [1]
        sol: { method: '$y_0 = -\frac{D}{4a} = 0$.', steps: ['$D = b^2 - 36 = 0$.', '$b = 6$ (положительное).'], answer: '6' }
        src: b126
      - type: numeric
        cat: problem
        q: 'Функция $y = x^2 - 6x + 2$ возрастает на промежутке $[m; +\infty)$. Найдите $m$.'
        num: { value: 3, unit: '', check: '6/2' }
        hint: 'Правее вершины при $a > 0$ функция возрастает.'
        explain: '$x_0 = 3$, $m = 3$.'
        f: [1]
        sol: { method: 'Монотонность параболы.', steps: ['$x_0 = 3$, $a > 0$.', 'Возрастает при $x \ge 3$.'], answer: '3' }
        src: b125
      - type: numeric
        cat: problem
        q: 'Парабола $y = a(x - 1)^2 + 1$ проходит через точку $(0; 3)$. Найдите $a$.'
        num: { value: 2, unit: '', check: '3-1' }
        hint: 'Подставьте $x = 0$.'
        explain: '$a + 1 = 3$, $a = 2$.'
        f: [2]
        sol: { method: 'Подстановка точки.', steps: ['$a(0 - 1)^2 + 1 = 3$.', '$a = 2$.'], answer: '2' }
        src: b126
      - type: single
