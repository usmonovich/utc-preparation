  # ───────────────────────────── 3.6.5 ─────────────────────────────
  - id: ma-3-6-5
    num: '3.6.5'
    title: Пересекающиеся хорды
    pages: [b269]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.5'
      summary: 'Задания на свойство отрезков пересекающихся хорд.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Произведения отрезков хорд
        body: |
          Если хорды $AB$ и $CD$ пересекаются в точке $E$, то
          $$AE \cdot EB = CE \cdot ED.$$
          (Треугольники $AEC$ и $DEB$ подобны по двум углам.) Для точки на расстоянии $m$ от центра это произведение равно $R^2 - m^2$.
        src: b269
    formulas:
      - title: Отрезки пересекающихся хорд
        tex: 'AE \cdot EB = CE \cdot ED = R^2 - OE^2'
        meaning: '$E$ — точка пересечения хорд, $O$ — центр.'
        use: 'Нахождение отрезков хорд.'
        src: b269
    examples:
      - title: Четвёртый отрезок
        given: '$AE = 4$, $EB = 6$, $CE = 3$. Найдите $ED$.'
        find: '$ED$.'
        method: 'Произведения отрезков равны.'
        steps:
          - '$4 \cdot 6 = 3 \cdot ED$.'
          - '$ED = 8$.'
        check: '$24 = 24$ ✓.'
        answer: '$8$'
        src: b269
      - title: Хорда через точку
        given: 'Радиус 5, точка удалена от центра на 3. Найдите хорду, перпендикулярную диаметру в этой точке.'
        find: 'хорду.'
        method: 'Диаметр делится точкой на 2 и 8.'
        steps:
          - '$\left(\frac c2\right)^2 = 2 \cdot 8 = 16$.'
          - '$c = 8$.'
        check: '$\frac c2 = \sqrt{25 - 9} = 4$ ✓.'
        answer: '$8$'
        src: b269
      - title: Отношение отрезков
        given: 'Хорда разделена точкой пересечения на отрезки 2 и 18. Вторая хорда делится этой точкой в отношении $1 : 4$. Найдите её длину.'
        find: 'длину.'
        method: '$x \cdot 4x = 2 \cdot 18$.'
        steps:
          - '$4x^2 = 36 \Rightarrow x = 3$.'
          - 'Хорда $5x = 15$.'
        check: '$3 \cdot 12 = 36$ ✓.'
        answer: '$15$'
        src: b269
    questions:
      - type: numeric
        cat: problem
        q: '$AE = 6$, $EB = 4$, $CE = 8$. Найдите $ED$.'
        num: { value: 3, unit: '', check: '24/8' }
        hint: '$AE \cdot EB = CE \cdot ED$.'
        explain: '$\frac{24}{8} = 3$.'
        f: [1]
        sol: { method: 'Произведения отрезков.', steps: ['$24 = 8 \cdot ED$, $ED = 3$.'], answer: '3' }
        src: b269
      - type: numeric
        cat: problem
        q: 'Одна хорда разделена точкой пересечения на отрезки 3 и 12, другая — пополам. Найдите длину второй хорды.'
        num: { value: 12, unit: '', check: '2*Math.sqrt(36)' }
        hint: '$x^2 = 36$.'
        explain: 'Половины по 6, хорда 12.'
        f: [1]
        sol: { method: 'Произведения отрезков.', steps: ['$x \cdot x = 3 \cdot 12$.', '$x = 6$, хорда $12$.'], answer: '12' }
        src: b269
      - type: numeric
        cat: problem
        q: 'Радиус 5, точка $E$ удалена от центра на 3. Найдите произведение отрезков любой хорды, проходящей через $E$.'
        num: { value: 16, unit: '', check: '25-9' }
        hint: '$R^2 - OE^2$.'
        explain: '$25 - 9 = 16$.'
        f: [1]
        sol: { method: 'Через диаметр.', steps: ['Диаметр через $E$: $(5 - 3)(5 + 3) = 16$.'], answer: '16' }
        src: b269
      - type: numeric
        cat: problem
        q: 'Хорда разделена точкой на отрезки 2 и 18, вторая хорда — в отношении $1 : 4$. Найдите длину второй хорды.'
        num: { value: 15, unit: '', check: '5*3' }
        hint: '$x \cdot 4x = 36$.'
        explain: '$x = 3$, хорда $15$.'
        f: [1]
        sol: { method: 'Произведения отрезков.', steps: ['$4x^2 = 36 \Rightarrow x = 3$.', '$5x = 15$.'], answer: '15' }
        src: b269
      - type: numeric
        cat: problem
        q: 'Хорда $AB = 10$, точка $E$ на ней, $AE = 2$. Хорда $CD$ проходит через $E$, $CE = 4$. Найдите $CD$.'
        num: { value: 8, unit: '', check: '4+16/4' }
        hint: '$EB = 8$.'
        explain: '$ED = \frac{16}{4} = 4$, $CD = 8$.'
        f: [1]
        sol: { method: 'Произведения отрезков.', steps: ['$2 \cdot 8 = 4 \cdot ED \Rightarrow ED = 4$.', '$CD = 4 + 4 = 8$.'], answer: '8' }
        src: b269
      - type: numeric
        cat: problem
        q: 'Диаметр окружности 10, точка $E$ на нём делит его в отношении $1 : 4$. Найдите хорду, перпендикулярную диаметру в точке $E$.'
        num: { value: 8, unit: '', check: '2*Math.sqrt(2*8)' }
        hint: 'Отрезки диаметра 2 и 8.'
        explain: '$\left(\frac c2\right)^2 = 16$, $c = 8$.'
        f: [1]
        sol: { method: 'Произведения отрезков.', steps: ['$\frac c2 \cdot \frac c2 = 2 \cdot 8$.', '$c = 8$.'], answer: '8' }
        src: b269
      - type: single
        cat: theory
        q: 'Хорды $AB$ и $CD$ пересекаются в точке $E$. Какое равенство верно?'
        opts: ['$AE \cdot EB = CE \cdot ED$', '$AE + EB = CE + ED$', '$AE \cdot CE = EB \cdot ED$', '$AE = CE$']
        ans: a
        hint: 'Подобие треугольников $AEC$ и $DEB$.'
        explain: 'Произведения отрезков каждой хорды равны.'
        f: [1]
        src: b269
      - type: single
        cat: theory
        q: 'Почему треугольники $AEC$ и $DEB$ (хорды $AB$ и $CD$ пересекаются в $E$) подобны?'
        opts: ['у них равны вертикальные углы и вписанные углы, опирающиеся на одну дугу', 'они прямоугольные', 'у них равны стороны', 'они равнобедренные']
        ans: a
        hint: 'Признак подобия по двум углам.'
        explain: '$\angle AEC = \angle DEB$, $\angle CAB = \angle CDB$.'
        src: b269

  # ───────────────────────────── 3.6.6 ─────────────────────────────
  - id: ma-3-6-6
    num: '3.6.6'
    title: Касательная и секущая
    pages: [b269, b270]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.6'
      summary: 'Задания на теорему о касательной и секущей и о двух секущих из одной точки.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Касательная и секущая
        body: |
          Из точки $M$ вне окружности проведены касательная $MT$ и секущая, пересекающая окружность в точках $A$ и $B$ ($MA < MB$). Тогда
          $$MT^2 = MA \cdot MB.$$
          Для двух секущих: $MA \cdot MB = MC \cdot MD$. Если секущая проходит через центр: $MT^2 = (d - R)(d + R) = d^2 - R^2$.
        src: b269
    formulas:
      - title: Касательная и секущая
        tex: 'MT^2 = MA \cdot MB,\qquad MA \cdot MB = MC \cdot MD'
        meaning: '$MA$, $MC$ — внешние части секущих, $MB$, $MD$ — секущие целиком.'
        use: 'Отрезки касательных и секущих.'
        src: b270
    examples:
      - title: Длина касательной
        given: '$MA = 4$, $MB = 9$. Найдите касательную $MT$.'
        find: '$MT$.'
        method: '$MT^2 = MA \cdot MB$.'
        steps:
          - '$MT^2 = 36$.'
          - '$MT = 6$.'
        check: '$36 = 4 \cdot 9$ ✓.'
        answer: '$6$'
        src: b270
      - title: Секущая через центр
        given: 'Точка удалена от центра на 13, радиус 5. Найдите касательную.'
        find: '$MT$.'
        method: 'Секущая через центр: $8$ и $18$.'
        steps:
          - '$MT^2 = 8 \cdot 18 = 144$.'
          - '$MT = 12$.'
        check: '$\sqrt{169 - 25} = 12$ ✓.'
        answer: '$12$'
        src: b270
      - title: Две секущие
        given: '$MA = 3$, $MB = 12$, $MC = 4$. Найдите $MD$.'
        find: '$MD$.'
        method: '$MA \cdot MB = MC \cdot MD$.'
        steps:
          - '$36 = 4 \cdot MD$.'
          - '$MD = 9$.'
        check: '$4 \cdot 9 = 36$ ✓.'
        answer: '$9$'
        src: b270
    questions:
      - type: numeric
        cat: problem
        q: '$MA = 2$, $MB = 8$. Найдите длину касательной $MT$.'
        num: { value: 4, unit: '', check: 'Math.sqrt(16)' }
        hint: '$MT^2 = 16$.'
        explain: '$4$.'
        f: [1]
        sol: { method: 'Касательная и секущая.', steps: ['$MT^2 = 2 \cdot 8 = 16$.', '$MT = 4$.'], answer: '4' }
        src: b270
      - type: numeric
        cat: problem
        q: 'Касательная $MT = 6$, внешняя часть секущей $MA = 3$. Найдите хорду $AB$.'
        num: { value: 9, unit: '', check: '36/3-3' }
        hint: '$MB = \frac{36}{3}$.'
        explain: '$MB = 12$, $AB = 9$.'
        f: [1]
        sol: { method: 'Касательная и секущая.', steps: ['$MB = \frac{36}{3} = 12$.', '$AB = 12 - 3 = 9$.'], answer: '9' }
        src: b270
      - type: numeric
        cat: problem
        q: 'Точка удалена от центра окружности радиуса 6 на 10. Найдите касательную.'
        num: { value: 8, unit: '', check: 'Math.sqrt(4*16)' }
        hint: 'Секущая через центр: 4 и 16.'
        explain: '$\sqrt{64} = 8$.'
        f: [1]
        sol: { method: 'Касательная и секущая.', steps: ['$MT^2 = 4 \cdot 16 = 64$.', '$MT = 8$.'], answer: '8' }
        src: b270
      - type: numeric
        cat: problem
        q: 'Из точки проведены две секущие: $MA = 5$, $AB = 7$, $MC = 6$. Найдите хорду $CD$.'
        num: { value: 4, unit: '', check: '60/6-6' }
        hint: '$MB = 12$, $MD = \frac{60}{6}$.'
        explain: '$MD = 10$, $CD = 4$.'
        f: [1]
        sol: { method: 'Две секущие.', steps: ['$5 \cdot 12 = 6 \cdot MD \Rightarrow MD = 10$.', '$CD = 10 - 6 = 4$.'], answer: '4' }
        src: b270
      - type: numeric
        cat: problem
        q: 'Касательная 12, внешняя часть секущей 8. Найдите всю секущую.'
        num: { value: 18, unit: '', check: '144/8' }
        hint: '$MB = \frac{MT^2}{MA}$.'
        explain: '$18$.'
        f: [1]
        sol: { method: 'Касательная и секущая.', steps: ['$MB = \frac{144}{8} = 18$.'], answer: '18' }
        src: b270
      - type: numeric
        cat: problem
        q: 'Секущая из точки $M$ проходит через центр окружности радиуса 3, её внешняя часть равна 2. Найдите касательную из $M$.'
        num: { value: 4, unit: '', check: 'Math.sqrt(2*8)' }
