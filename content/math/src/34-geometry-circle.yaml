  # ───────────────────────────── 3.6.7 ─────────────────────────────
  - id: ma-3-6-7
    num: '3.6.7'
    title: Площадь круга
    pages: [b270]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.7'
      summary: 'Задания на площадь круга и кольца, отношение площадей.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-106]
    theory:
      - kind: law
        title: Площадь круга
        body: |
          $$S = \pi R^2 = \frac{\pi d^2}{4}.$$
          При увеличении радиуса в $k$ раз площадь увеличивается в $k^2$ раз. Площадь кольца между окружностями радиусов $R > r$: $S = \pi(R^2 - r^2)$.
        src: b270
    formulas:
      - title: Площадь круга
        tex: 'S = \pi R^2 = \frac{\pi d^2}{4}'
        meaning: '$R$ — радиус, $d$ — диаметр.'
        use: 'Площадь круга.'
        src: b270
      - title: Площадь кольца
        tex: 'S = \pi(R^2 - r^2)'
        meaning: '$R > r$ — радиусы окружностей с общим центром.'
        use: 'Кольца, шайбы, трубы.'
        src: b270
    examples:
      - title: По радиусу
        given: 'Найдите площадь круга радиуса 3.'
        find: '$S$.'
        method: '$\pi R^2$.'
        steps:
          - '$S = 9\pi$.'
          - '$\approx 28{,}27$.'
        check: '$3{,}1416 \cdot 9 = 28{,}27$ ✓.'
        answer: '$9\pi$'
        src: b270
      - title: По длине окружности
        given: 'Длина окружности $10\pi$. Найдите площадь круга.'
        find: '$S$.'
        method: 'Сначала радиус.'
        steps:
          - '$R = 5$.'
          - '$S = 25\pi$.'
        check: '$S = \frac{C^2}{4\pi} = \frac{100\pi^2}{4\pi} = 25\pi$ ✓.'
        answer: '$25\pi$'
        src: b270
      - title: Кольцо
        given: 'Радиусы 5 и 3. Найдите площадь кольца.'
        find: '$S$.'
        method: 'Разность площадей.'
        steps:
          - '$\pi(25 - 9)$.'
          - '$= 16\pi$.'
        check: '$25\pi - 9\pi = 16\pi$ ✓.'
        answer: '$16\pi$'
        src: b270
