  # ───────────────────────────── 3.6.8 ─────────────────────────────
  - id: ma-3-6-8
    num: '3.6.8'
    title: Площадь сектора и сегмента круга
    pages: [b270, b271, b272, b273]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.8'
      summary: 'Задания на площади сектора и сегмента круга.'
    stage: verified
    stageNote: 'Ответы пересчитаны численно.'
    sourcesChecked: '2026-10-25'
    web: [*at-71, *lyc]
    theory:
      - kind: law
        title: Сектор и сегмент
        body: |
          - **Сектор** с центральным углом $\alpha$: $S = \frac{\pi R^2\alpha^\circ}{360^\circ} = \frac12R^2\alpha_{\text{рад}} = \frac12 lR$ ($l$ — длина дуги).
          - **Сегмент** (часть круга между хордой и дугой) = сектор − треугольник: $S = \frac{R^2}{2}(\alpha_{\text{рад}} - \sin\alpha)$ (для $\alpha < 180^\circ$).
        src: b270
    formulas:
      - title: Площадь сектора
        tex: 'S_{\text{сект}} = \frac{\pi R^2\alpha}{360^\circ} = \frac{1}{2}R^2\alpha_{\text{рад}} = \frac12 lR'
        meaning: '$\alpha$ — центральный угол, $l$ — длина дуги.'
        use: 'Площадь сектора.'
        src: b271
      - title: Площадь сегмента
        tex: 'S_{\text{сегм}} = \frac{R^2}{2}(\alpha_{\text{рад}} - \sin\alpha)'
        meaning: 'Сектор минус равнобедренный треугольник.'
        use: 'Площадь сегмента.'
        src: b272
    examples:
      - title: Сектор 60°
        given: 'Радиус 6, центральный угол $60^\circ$. Найдите площадь сектора.'
        find: '$S$.'
        method: 'Доля круга.'
        steps:
          - '$\frac{36\pi \cdot 60}{360}$.'
          - '$= 6\pi$.'
        check: '$\frac16$ от $36\pi$ ✓.'
        answer: '$6\pi$'
        src: b271
      - title: Сегмент 90°
        given: 'Радиус 2, центральный угол $90^\circ$. Найдите площадь сегмента.'
        find: '$S$.'
        method: 'Сектор минус треугольник.'
        steps:
          - 'Сектор $\pi$, треугольник $\frac12 \cdot 2 \cdot 2 = 2$.'
          - '$S = \pi - 2 \approx 1{,}14$.'
        check: '$\frac{4}{2}\left(\frac\pi2 - 1\right) = \pi - 2$ ✓.'
        answer: '$\pi - 2$'
        src: b272
      - title: Через длину дуги
        given: 'Длина дуги сектора 4, радиус 5. Найдите площадь сектора.'
        find: '$S$.'
        method: '$\frac12 lR$.'
        steps:
          - '$\frac12 \cdot 4 \cdot 5$.'
          - '$= 10$.'
        check: '$\alpha = 0{,}8$ рад, $\frac12 \cdot 25 \cdot 0{,}8 = 10$ ✓.'
        answer: '$10$'
        src: b271
    questions:
      - type: numeric
        cat: problem
        q: 'Радиус 10, центральный угол $36^\circ$. Найдите площадь сектора (с точностью до 0,01).'
        num: { value: 31.4159, unit: '', tolAbs: 0.01, check: 'Math.PI*100*36/360' }
        hint: '$\frac{1}{10}$ круга.'
        explain: '$10\pi \approx 31{,}42$.'
        f: [1]
        sol: { method: 'Площадь сектора.', steps: ['$\frac{100\pi}{10} = 10\pi \approx 31{,}42$.'], answer: '10π ≈ 31,42' }
        src: b271
      - type: numeric
        cat: problem
        q: 'Найдите площадь четверти круга радиуса 4 (с точностью до 0,01).'
        num: { value: 12.5664, unit: '', tolAbs: 0.01, check: 'Math.PI*16/4' }
        hint: 'Сектор $90^\circ$.'
        explain: '$4\pi \approx 12{,}57$.'
        f: [1]
        sol: { method: 'Площадь сектора.', steps: ['$\frac{16\pi}{4} = 4\pi$.'], answer: '4π ≈ 12,57' }
        src: b271
      - type: numeric
