  # ───────────────────────────── 3.6.4 ─────────────────────────────
  - id: ma-3-6-4
    num: '3.6.4'
    title: Центральный и вписанный углы. Угол между хордой и касательной
    pages: [b268, b269]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.4'
      summary: 'Задания на центральные и вписанные углы, угол между хордой и касательной, углы между хордами, вписанный четырёхугольник.'
    stage: verified
    stageNote: 'Ответы пересчитаны; свойство вписанного угла проверено на координатах.'
    sourcesChecked: '2026-10-25'
    web: [*lyc]
    theory:
      - kind: law
        title: Вписанный угол
        body: |
          - **Центральный** угол равен угловой величине своей дуги.
          - **Вписанный** угол (вершина на окружности) равен **половине** дуги, на которую опирается, то есть половине центрального угла.
          - Вписанные углы, опирающиеся на одну дугу, равны; опирающийся на диаметр — прямой.
          - Угол между хордой и касательной равен половине дуги, заключённой между ними.
          - В четырёхугольнике, вписанном в окружность, суммы противоположных углов равны $180^\circ$.
        src: b268
        fig: inscribed-angle
      - kind: rule
        title: Углы между хордами и секущими
        body: |
          - Угол между пересекающимися хордами равен полусумме дуг, заключённых между его сторонами и их продолжениями.
          - Угол между двумя секущими (вершина вне окружности) равен полуразности дуг.
        src: b269
    formulas:
      - title: Вписанный угол
        tex: '\angle_{\text{впис}} = \frac12\,\angle_{\text{центр}} = \frac12\,\breve{AB}'
        meaning: 'Угол опирается на дугу $AB$.'
        use: 'Нахождение углов в окружности.'
        src: b268
      - title: Углы между хордами и касательной
        tex: '\angle(\text{хорда}, \text{касательная}) = \frac{\breve{AB}}{2},\qquad \angle(\text{хорды}) = \frac{\breve{a} + \breve{b}}{2}'
        meaning: '$\breve a$, $\breve b$ — дуги, заключённые между сторонами угла.'
        use: 'Углы с вершиной на окружности и внутри неё.'
        src: b269
    examples:
      - title: Вписанный и центральный
        given: 'Центральный угол $100^\circ$. Найдите вписанный угол, опирающийся на ту же дугу.'
        find: 'угол.'
        method: 'Половина центрального.'
        steps:
          - '$\frac{100^\circ}{2}$.'
          - '$= 50^\circ$.'
        check: 'Дуга $100^\circ$, половина $50^\circ$ ✓.'
        answer: '$50^\circ$'
        src: b268
      - title: Дуга по вписанному углу
        given: 'Вписанный угол $35^\circ$. Найдите дугу, на которую он опирается.'
        find: 'дугу.'
        method: 'Дуга — удвоенный вписанный угол.'
        steps:
          - '$2 \cdot 35^\circ$.'
          - '$= 70^\circ$.'
        check: '$\frac{70}{2} = 35$ ✓.'
        answer: '$70^\circ$'
        src: b268
      - title: Хорда и касательная
        given: 'Хорда стягивает дугу $140^\circ$. Найдите угол между хордой и касательной в её конце.'
        find: 'угол.'
        method: 'Половина дуги.'
        steps:
          - '$\frac{140^\circ}{2}$.'
          - '$= 70^\circ$.'
        check: 'Равен вписанному углу, опирающемуся на ту же дугу ✓.'
        answer: '$70^\circ$'
        src: b269
    questions:
      - type: numeric
        cat: problem
        q: 'Вписанный угол опирается на дугу $110^\circ$. Найдите его.'
        num: { value: 55, unit: '°', check: '110/2' }
        hint: 'Половина дуги.'
        explain: '$55^\circ$.'
        f: [1]
        sol: { method: 'Вписанный угол.', steps: ['$\frac{110^\circ}{2} = 55^\circ$.'], answer: '55°' }
        src: b268
      - type: numeric
        cat: problem
        q: 'Вписанный угол $40^\circ$. Найдите центральный угол, опирающийся на ту же дугу.'
        num: { value: 80, unit: '°', check: '2*40' }
        hint: 'Удвоенный вписанный.'
        explain: '$80^\circ$.'
        f: [1]
        sol: { method: 'Связь углов.', steps: ['$2 \cdot 40^\circ = 80^\circ$.'], answer: '80°' }
        src: b268
      - type: numeric
        cat: problem
        q: 'Найдите вписанный угол, опирающийся на диаметр.'
        num: { value: 90, unit: '°', check: '180/2' }
