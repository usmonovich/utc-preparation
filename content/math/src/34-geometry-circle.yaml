        explain: '$\sqrt{16} = 4$.'
        f: [1]
        sol: { method: 'Касательная и секущая.', steps: ['$MB = 2 + 2 \cdot 3 = 8$.', '$MT = \sqrt{2 \cdot 8} = 4$.'], answer: '4' }
        src: b270
      - type: single
