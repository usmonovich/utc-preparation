        q: 'Радиус 5, хорда удалена от центра на 3. Найдите её длину.'
        num: { value: 8, unit: '', check: '2*Math.sqrt(25-9)' }
        hint: 'Половина хорды $\sqrt{25 - 9}$.'
        explain: '$2 \cdot 4 = 8$.'
        f: [1]
        sol: { method: 'Расстояние до хорды.', steps: ['$\frac c2 = 4$.', '$c = 8$.'], answer: '8' }
        src: b266
      - type: numeric
        cat: problem
        q: 'Точка удалена от центра окружности радиуса 5 на 13. Найдите длину касательной из этой точки.'
        num: { value: 12, unit: '', check: 'Math.sqrt(169-25)' }
        hint: '$\sqrt{d^2 - R^2}$.'
        explain: '$12$.'
        f: [2]
        sol: { method: 'Длина касательной.', steps: ['$\sqrt{169 - 25} = 12$.'], answer: '12' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Касательные из точки к окружности радиуса 4 перпендикулярны. Найдите длину каждой касательной.'
        num: { value: 4, unit: '', check: '4' }
