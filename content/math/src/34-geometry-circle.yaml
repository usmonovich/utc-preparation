  # ───────────────────────────── 3.6.2 ─────────────────────────────
  - id: ma-3-6-2
    num: '3.6.2'
    title: Длина окружности
    pages: [b267]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.2'
      summary: 'Задания на длину окружности, в том числе вписанной в квадрат и описанной около него.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*cm-104]
    theory:
      - kind: law
        title: Длина окружности
        body: |
          $$C = 2\pi R = \pi d,\qquad \pi \approx 3{,}14159.$$
          Отношение длины окружности к диаметру одинаково для всех окружностей — это число $\pi$.
          Длина окружности пропорциональна радиусу: если радиус увеличить в $k$ раз, длина увеличится в $k$ раз; если увеличить радиус на $\Delta R$, длина вырастет на $2\pi\Delta R$ (независимо от исходного радиуса).
          Окружность, вписанная в квадрат со стороной $a$: $R = \frac a2$; описанная: $R = \frac{a\sqrt2}{2}$.
        src: b267
    formulas:
      - title: Длина окружности
        tex: 'C = 2\pi R = \pi d'
        meaning: '$R$ — радиус, $d$ — диаметр.'
        use: 'Задачи на окружность, колёса.'
        src: b267
    examples:
      - title: По радиусу
        given: 'Найдите длину окружности радиуса 5.'
        find: '$C$.'
        method: '$2\pi R$.'
        steps:
          - '$C = 10\pi$.'
          - '$\approx 31{,}42$.'
        check: '$2 \cdot 3{,}1416 \cdot 5 = 31{,}42$ ✓.'
        answer: '$10\pi$'
        src: b267
      - title: Радиус по длине
        given: 'Длина окружности $12\pi$. Найдите радиус.'
        find: '$R$.'
        method: '$R = \frac{C}{2\pi}$.'
        steps:
          - '$R = \frac{12\pi}{2\pi}$.'
          - '$R = 6$.'
        check: '$2\pi \cdot 6 = 12\pi$ ✓.'
        answer: '$6$'
        src: b267
      - title: Колесо
        given: 'Диаметр колеса 0,7 м. Какой путь оно проходит за 100 оборотов?'
        find: 'путь.'
        method: 'Один оборот — длина окружности.'
        steps:
          - '$C = 0{,}7\pi$ м.'
          - '$100C = 70\pi \approx 219{,}9$ м.'
        check: '$0{,}7 \cdot 3{,}1416 \cdot 100 = 219{,}9$ ✓.'
        answer: '$70\pi \approx 219{,}9$ м'
        src: b267
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите длину окружности радиуса 3 (с точностью до 0,01).'
        num: { value: 18.8496, unit: '', tolAbs: 0.01, check: '2*Math.PI*3' }
        hint: '$2\pi R$.'
        explain: '$6\pi \approx 18{,}85$.'
        f: [1]
        sol: { method: 'Длина окружности.', steps: ['$C = 6\pi \approx 18{,}85$.'], answer: '6π ≈ 18,85' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Длина окружности 31,4 (считайте $\pi = 3{,}14$). Найдите радиус.'
        num: { value: 5, unit: '', check: '31.4/(2*3.14)' }
        hint: '$R = \frac{C}{2\pi}$.'
        explain: '$\frac{31{,}4}{6{,}28} = 5$.'
        f: [1]
        sol: { method: 'Радиус по длине.', steps: ['$R = 31{,}4 : 6{,}28 = 5$.'], answer: '5' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Радиусы двух окружностей 2 и 5. Во сколько раз длина большей окружности больше?'
        num: { value: 2.5, unit: '', check: '5/2' }
        hint: 'Длина пропорциональна радиусу.'
        explain: '$2{,}5$.'
        f: [1]
        sol: { method: 'Пропорциональность.', steps: ['$\frac{2\pi \cdot 5}{2\pi \cdot 2} = 2{,}5$.'], answer: '2,5' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Радиус окружности увеличили на 1. На сколько увеличилась её длина (с точностью до 0,01)?'
        num: { value: 6.2832, unit: '', tolAbs: 0.01, check: '2*Math.PI' }
        hint: '$2\pi(R + 1) - 2\pi R$.'
        explain: '$2\pi \approx 6{,}28$ — при любом $R$.'
        f: [1]
        sol: { method: 'Разность длин.', steps: ['$\Delta C = 2\pi \cdot 1 \approx 6{,}28$.'], answer: '2π ≈ 6,28' }
        src: b267
      - type: numeric
        cat: problem
        q: 'В квадрат со стороной 10 вписана окружность. Найдите её длину (с точностью до 0,01).'
        num: { value: 31.4159, unit: '', tolAbs: 0.01, check: 'Math.PI*10' }
        hint: 'Диаметр равен стороне.'
        explain: '$10\pi \approx 31{,}42$.'
        f: [1]
        sol: { method: 'Вписанная окружность.', steps: ['$d = 10$.', '$C = 10\pi \approx 31{,}42$.'], answer: '10π ≈ 31,42' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Около квадрата со стороной 4 описана окружность. Найдите её длину (с точностью до 0,01).'
        num: { value: 17.7715, unit: '', tolAbs: 0.01, check: 'Math.PI*4*Math.SQRT2' }
        hint: 'Диаметр — диагональ квадрата.'
        explain: '$d = 4\sqrt2$, $C = 4\sqrt2\pi \approx 17{,}77$.'
        f: [1]
        sol: { method: 'Описанная окружность.', steps: ['$d = 4\sqrt2$.', '$C = 4\sqrt2\pi \approx 17{,}77$.'], answer: '≈ 17,77' }
        src: b267
      - type: single
        cat: theory
        q: 'Что такое число $\pi$?'
        opts: ['отношение длины окружности к её диаметру', 'отношение длины окружности к радиусу', 'площадь круга радиуса 2', 'длина окружности радиуса 1']
        ans: a
        hint: '$C = \pi d$.'
        explain: 'Длина окружности радиуса 1 равна $2\pi$, а не $\pi$.'
        f: [1]
        src: b267
      - type: single
        cat: theory
        q: 'Радиус окружности увеличили в 3 раза. Как изменилась её длина?'
        opts: ['увеличилась в 3 раза', 'увеличилась в 9 раз', 'увеличилась на 3', 'не изменилась']
        ans: a
        hint: 'Линейная зависимость от $R$.'
        explain: '$C = 2\pi R$ пропорциональна $R$.'
        f: [1]
        src: b267

  # ───────────────────────────── 3.6.3 ─────────────────────────────
  - id: ma-3-6-3
    num: '3.6.3'
    title: Длина дуги окружности
    pages: [b267, b268]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.3'
      summary: 'Задания на длину дуги по радиусу и центральному углу и обратные задачи.'
    stage: verified
    stageNote: 'Ответы пересчитаны.'
    sourcesChecked: '2026-10-25'
    web: [*at-71]
    theory:
      - kind: law
        title: Длина дуги
        body: |
          Дуга с центральным углом $\alpha^\circ$ составляет $\frac{\alpha}{360}$ окружности:
          $$l = \frac{\pi R\alpha^\circ}{180^\circ} = R\alpha_{\text{рад}}.$$
          Если длина дуги равна радиусу, центральный угол — 1 радиан ($\approx 57{,}3^\circ$).
        src: b267
    formulas:
      - title: Длина дуги
        tex: 'l = \frac{\pi R\alpha}{180^\circ} = R\,\alpha_{\text{рад}}'
        meaning: '$\alpha$ — центральный угол.'
        use: 'Длина дуги и обратные задачи.'
        src: b267
    examples:
      - title: Дуга 60°
        given: 'Найдите длину дуги окружности радиуса 6 с центральным углом $60^\circ$.'
        find: '$l$.'
        method: 'Формула длины дуги.'
        steps:
          - '$l = \frac{\pi \cdot 6 \cdot 60}{180}$.'
          - '$l = 2\pi$.'
        check: '$\frac{60}{360}$ от $12\pi$ ✓.'
        answer: '$2\pi$'
        src: b267
      - title: Угол по дуге
        given: 'Длина дуги $3\pi$, радиус 9. Найдите центральный угол.'
        find: '$\alpha$.'
        method: '$\alpha = \frac{180l}{\pi R}$.'
        steps:
          - '$\alpha = \frac{180 \cdot 3\pi}{9\pi}$.'
          - '$\alpha = 60^\circ$.'
        check: '$\frac{\pi \cdot 9 \cdot 60}{180} = 3\pi$ ✓.'
        answer: '$60^\circ$'
        src: b268
      - title: Радиан
        given: 'Дуга равна радиусу. Найдите центральный угол в градусах.'
        find: '$\alpha$.'
        method: '$l = R\alpha_{\text{рад}}$.'
        steps:
          - '$\alpha = 1$ рад.'
          - '$\frac{180^\circ}{\pi} \approx 57{,}3^\circ$.'
        check: 'Определение радиана ✓.'
        answer: '$\approx 57{,}3^\circ$'
        src: b268
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите длину дуги окружности радиуса 12 с центральным углом $90^\circ$ (с точностью до 0,01).'
        num: { value: 18.8496, unit: '', tolAbs: 0.01, check: 'Math.PI*12*90/180' }
        hint: 'Четверть окружности.'
        explain: '$6\pi \approx 18{,}85$.'
        f: [1]
        sol: { method: 'Длина дуги.', steps: ['$\frac{24\pi}{4} = 6\pi \approx 18{,}85$.'], answer: '6π ≈ 18,85' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Радиус 10, длина дуги $5\pi$. Найдите центральный угол (в градусах).'
        num: { value: 90, unit: '°', check: '180*5/10' }
        hint: '$\alpha = \frac{180l}{\pi R}$.'
        explain: '$90^\circ$.'
        f: [1]
        sol: { method: 'Обратная задача.', steps: ['$\alpha = \frac{180 \cdot 5\pi}{10\pi} = 90^\circ$.'], answer: '90°' }
        src: b268
      - type: numeric
        cat: problem
        q: 'Найдите длину дуги в $120^\circ$ окружности радиуса 3 (с точностью до 0,01).'
        num: { value: 6.2832, unit: '', tolAbs: 0.01, check: 'Math.PI*3*120/180' }
        hint: 'Треть окружности.'
        explain: '$2\pi \approx 6{,}28$.'
        f: [1]
        sol: { method: 'Длина дуги.', steps: ['$\frac{6\pi}{3} = 2\pi$.'], answer: '2π ≈ 6,28' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Длина дуги 2, радиус 4. Найдите центральный угол в радианах.'
        num: { value: 0.5, unit: 'рад', check: '2/4' }
        hint: '$\alpha = \frac lR$.'
        explain: '$0{,}5$ рад.'
        f: [1]
        sol: { method: 'Радианная мера.', steps: ['$\alpha = \frac24 = 0{,}5$.'], answer: '0,5' }
        src: b268
      - type: numeric
        cat: problem
        q: 'Какую часть окружности составляет дуга в $45^\circ$?'
        num: { value: 0.125, unit: '', check: '45/360' }
