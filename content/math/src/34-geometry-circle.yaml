  # ───────────────────────────── 3.6.1 ─────────────────────────────
  - id: ma-3-6-1
    num: '3.6.1'
    title: Касательная, хорда, радиус, диаметр
    pages: [b266, b267]
    book:
      place: 'Ч. 2, раздел «Геометрия», 3.6 «Окружность и круг», пункт 3.6.1'
      summary: 'Задания на свойства касательной, хорды и радиуса: расстояние от центра до хорды, длина касательной, отрезки касательных.'
    stage: verified
    stageNote: 'Ответы пересчитаны теоремой Пифагора.'
    sourcesChecked: '2026-10-25'
    web: [*lyc, *cm-104]
    theory:
      - kind: law
        title: Хорда, касательная, радиус
        body: |
          - **Диаметр** — наибольшая хорда, $d = 2R$.
          - Диаметр (радиус), перпендикулярный хорде, делит её пополам; расстояние от центра до хорды длины $c$: $h = \sqrt{R^2 - \frac{c^2}{4}}$.
          - **Касательная** перпендикулярна радиусу, проведённому в точку касания.
          - Отрезки касательных, проведённых из одной точки, равны; центр лежит на биссектрисе угла между ними.
          - Длина касательной из точки на расстоянии $d$ от центра: $t = \sqrt{d^2 - R^2}$.
        src: b266
    formulas:
      - title: Расстояние от центра до хорды
        tex: 'h = \sqrt{R^2 - \left(\frac c2\right)^2}'
        meaning: '$c$ — длина хорды, $R$ — радиус.'
        use: 'Связь хорды и расстояния до центра.'
        src: b266
      - title: Длина касательной
        tex: 't = \sqrt{d^2 - R^2}'
        meaning: '$d$ — расстояние от точки до центра.'
        use: 'Касательная из внешней точки.'
        src: b267
    examples:
      - title: Расстояние до хорды
        given: '$R = 13$, хорда 24. Найдите расстояние от центра до хорды.'
        find: '$h$.'
        method: 'Половина хорды, радиус и расстояние — прямоугольный треугольник.'
        steps:
          - '$h = \sqrt{169 - 144}$.'
          - '$h = 5$.'
        check: '$5^2 + 12^2 = 13^2$ ✓.'
        answer: '$5$'
        src: b266
      - title: Длина касательной
        given: 'Точка удалена от центра окружности радиуса 6 на 10. Найдите длину касательной.'
        find: '$t$.'
        method: 'Касательная ⟂ радиусу.'
        steps:
          - '$t = \sqrt{100 - 36}$.'
          - '$t = 8$.'
        check: '$6^2 + 8^2 = 10^2$ ✓.'
        answer: '$8$'
        src: b267
      - title: Угол между касательными
        given: 'Из точки к окружности радиуса 5 проведены две касательные с углом $60^\circ$ между ними. Найдите расстояние от точки до центра.'
        find: '$d$.'
        method: 'Центр на биссектрисе угла.'
        steps:
          - 'Половина угла $30^\circ$: $\sin 30^\circ = \frac Rd$.'
          - '$d = \frac{5}{0{,}5} = 10$.'
        check: 'Касательная $\sqrt{100 - 25} = 5\sqrt3$, $\operatorname{tg} 30^\circ = \frac{5}{5\sqrt3}$ ✓.'
        answer: '$10$'
        src: b267
    questions:
      - type: numeric
        cat: problem
        q: 'Хорда окружности радиуса 10 равна 16. Найдите расстояние от центра до хорды.'
        num: { value: 6, unit: '', check: 'Math.sqrt(100-64)' }
