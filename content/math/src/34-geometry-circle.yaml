        ans: a
        hint: '$MT^2 = MA \cdot MB$.'
        explain: 'Теорема о касательной и секущей.'
        f: [1]
        src: b270
      - type: single
        cat: theory
        q: 'Для двух секущих из одной точки верно…'
        opts: ['$MA \cdot MB = MC \cdot MD$', '$MA = MC$', '$AB = CD$', '$MA + MB = MC + MD$']
        ans: a
