        explain: '$4$.'
        sol: { method: 'Квадрат из радиусов и касательных.', steps: ['Все углы четырёхугольника прямые, два соседних отрезка — радиусы.', 'Касательная $= R = 4$.'], answer: '4' }
        src: b267
      - type: numeric
        cat: problem
        q: 'Хорда окружности радиуса 8 удалена от центра на половину радиуса. Найдите хорду (с точностью до 0,01).'
        num: { value: 13.8564, unit: '', tolAbs: 0.01, check: '2*Math.sqrt(64-16)' }
