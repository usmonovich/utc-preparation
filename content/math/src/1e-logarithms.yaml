  # ───────────────────────────── 1.14.4 ─────────────────────────────
  - id: ma-1-14-4
    num: '1.14.4'
    title: Логарифмические неравенства
    pages: [b152, b153, b154, b155, b156]
    book:
      place: 'Ч. 1, 1.14 «Логарифмическая функция», пункт 1.14.4'
      summary: 'Задания на логарифмические неравенства: решения с учётом области определения, наибольшее/наименьшее целое решение, число и сумма целых решений.'
    stage: verified
    stageNote: 'Целые решения пересчитаны перебором с проверкой области определения.'
    sourcesChecked: '2026-10-25'
    web: [*ca-64, *ca-66]
    theory:
      - kind: rule
        title: Логарифмическое неравенство
        body: |
          - $a > 1$: $\log_a f > \log_a g \iff f > g > 0$.
          - $0 < a < 1$: $\log_a f > \log_a g \iff 0 < f < g$ — знак меняется.
          - Число $c$ записывают как логарифм: $c = \log_a a^c$. Например, $\log_2(x - 1) < 3 \iff 0 < x - 1 < 8$.
          - **Область определения** (все аргументы $> 0$) учитывается всегда — часто именно она даёт одну из границ.
        src: b152
    formulas:
      - title: Неравенство с логарифмами
        tex: '\log_a f > \log_a g \iff \begin{cases} f > g > 0, & a > 1, \\ 0 < f < g, & 0 < a < 1 \end{cases}'
        meaning: '$f$, $g$ — выражения с $x$.'
        use: 'После приведения обеих частей к логарифмам с одним основанием.'
        src: b152
    examples:
      - title: Основание больше 1
        given: 'Решите неравенство $\log_2(x - 1) < 3$.'
        find: 'промежуток.'
        method: '$3 = \log_2 8$, плюс ОДЗ.'
        steps:
          - '$0 < x - 1 < 8$.'
          - '$1 < x < 9$.'
        check: '$x = 5$: $\log_2 4 = 2 < 3$ ✓; $x = 1$ — не определено ✓.'
        answer: '$(1; 9)$'
        src: b152
      - title: Основание меньше 1
        given: 'Решите неравенство $\log_{1/3}(x - 2) \ge -2$.'
        find: 'промежуток.'
        method: '$-2 = \log_{1/3} 9$, знак меняется.'
        steps:
          - '$0 < x - 2 \le 9$.'
          - '$2 < x \le 11$.'
        check: '$x = 11$: $\log_{1/3} 9 = -2$ ✓; $x = 12$: $\log_{1/3} 10 < -2$ ✓.'
        answer: '$(2; 11]$'
        src: b153
      - title: Логарифмы в обеих частях
        given: 'Решите неравенство $\lg x > \lg(5 - x)$.'
        find: 'промежуток.'
        method: 'Основание 10 > 1: $x > 5 - x > 0$.'
        steps:
          - 'Область определения: $x > 0$, $5 - x > 0 \Rightarrow 0 < x < 5$.'
          - '$x > 5 - x \Rightarrow x > 2{,}5$; итого $2{,}5 < x < 5$.'
        check: '$x = 3$: $\lg 3 > \lg 2$ ✓.'
        answer: '$(2{,}5; 5)$'
        src: b153
    questions:
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $\log_3(x + 1) \le 2$?'
        num: { value: 9, unit: '', check: '8-0+1' }
        hint: '$0 < x + 1 \le 9$.'
        explain: '$-1 < x \le 8$: целые $0, \dots, 8$ — девять.'
        f: [1]
        sol: { method: 'С учётом области определения.', steps: ['$0 < x + 1 \le 9$.', '$-1 < x \le 8$.', 'Девять целых.'], answer: '9' }
        src: b152
      - type: numeric
        cat: problem
        q: 'Найдите наименьшее целое решение неравенства $\log_2 x > 3$.'
        num: { value: 9, unit: '', check: '9' }
        hint: '$x > 2^3$.'
        explain: '$x > 8$, ответ $9$.'
        f: [1]
        sol: { method: 'Основание больше 1.', steps: ['$x > 8$.', 'Наименьшее целое $9$.'], answer: '9' }
        src: b152
      - type: numeric
        cat: problem
        q: 'Найдите наибольшее целое решение неравенства $\log_{0{,}5}(x - 1) > -2$.'
        num: { value: 4, unit: '', check: '4' }
        hint: '$-2 = \log_{0{,}5} 4$, знак меняется.'
        explain: '$0 < x - 1 < 4$, $1 < x < 5$; ответ $4$.'
        f: [1]
        sol: { method: 'Основание меньше 1.', steps: ['$0 < x - 1 < 4$.', '$1 < x < 5$, наибольшее целое $4$.'], answer: '4' }
        src: b153
      - type: numeric
        cat: problem
        q: 'Найдите целое решение неравенства $\log_5(x^2 - 4) < \log_5(3x)$.'
        num: { value: 3, unit: '', check: '3' }
        hint: '$0 < x^2 - 4 < 3x$.'
        explain: '$x > 2$ и $x^2 - 3x - 4 < 0 \iff -1 < x < 4$: $(2; 4)$, целое $3$.'
        f: [1]
        sol: { method: 'Логарифмы в обеих частях.', steps: ['$x^2 - 4 > 0$ и $3x > 0 \Rightarrow x > 2$.', '$x^2 - 4 < 3x \iff -1 < x < 4$.', 'Решение $(2; 4)$, целое $3$.'], answer: '3' }
        src: b153
      - type: numeric
        cat: problem
        q: 'Сколько целых решений у неравенства $\lg^2 x - \lg x - 2 \le 0$?'
        num: { value: 100, unit: '', check: '100' }
        hint: '$t = \lg x$: $-1 \le t \le 2$.'
        explain: '$0{,}1 \le x \le 100$: целые $1, \dots, 100$.'
        sol: { method: 'Замена.', steps: ['$t^2 - t - 2 \le 0 \iff -1 \le t \le 2$.', '$0{,}1 \le x \le 100$.', 'Целых — 100.'], answer: '100' }
        src: b154
      - type: numeric
        cat: problem
        q: 'Найдите сумму целых решений неравенства $\log_2 x + \log_2(x - 2) \le 3$.'
        num: { value: 7, unit: '', check: '3+4' }
        hint: 'ОДЗ $x > 2$; $x(x - 2) \le 8$.'
        explain: '$x^2 - 2x - 8 \le 0 \iff -2 \le x \le 4$; с ОДЗ $(2; 4]$: $3 + 4 = 7$.'
        sol: { method: 'Сумма логарифмов и ОДЗ.', steps: ['$x > 2$.', '$x^2 - 2x \le 8 \iff -2 \le x \le 4$.', 'Целые $3$ и $4$, сумма $7$.'], answer: '7' }
        src: b154
      - type: single
        cat: theory
        q: 'Решения неравенства $\log_{0{,}5} x > 0$:'
        opts: ['$0 < x < 1$', '$x > 1$', '$x < 1$', '$x > 0$']
        ans: a
        hint: 'Основание меньше 1, $0 = \log_{0{,}5} 1$.'
        explain: 'Функция убывает: $\log_{0{,}5} x > \log_{0{,}5} 1 \iff 0 < x < 1$.'
        f: [1]
        src: b153
      - type: single
        cat: theory
        q: 'Решения неравенства $\log_2 x > -5$:'
        opts: ['$x > \frac1{32}$', '$x > -32$', '$x > 0$', '$x > -5$']
        ans: a
        hint: '$-5 = \log_2 2^{-5}$.'
        explain: '$x > 2^{-5} = \frac1{32}$ (это автоматически даёт $x > 0$).'
        f: [1]
        src: b152
