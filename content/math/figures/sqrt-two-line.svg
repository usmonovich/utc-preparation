<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Как отложить √2 на числовой прямой: диагональ квадрата со стороной 1 равна √(1² + 1²) = √2; циркулем переносим её на прямую — точка лежит между 1,4 и 1,5 и не совпадает ни с одной дробью</title><path class="s-ink" d="M20,160H344" stroke-width="2"/><path class="s-mute" d="M60,154V166" stroke-width="1.6"/><text class="t-s" x="60" y="184" text-anchor="middle">0</text><path class="s-mute" d="M170,154V166" stroke-width="1.6"/><text class="t-s" x="170" y="184" text-anchor="middle">1</text><path class="s-mute" d="M280,154V166" stroke-width="1.6"/><text class="t-s" x="280" y="184" text-anchor="middle">2</text><path class="s-mute" d="M181,157V163" stroke-width="1"/><path class="s-mute" d="M192,157V163" stroke-width="1"/><path class="s-mute" d="M203,157V163" stroke-width="1"/><path class="s-mute" d="M214,157V163" stroke-width="1"/><path class="s-mute" d="M225,157V163" stroke-width="1"/><path class="s-mute" d="M236,157V163" stroke-width="1"/><path class="s-mute" d="M247,157V163" stroke-width="1"/><path class="s-mute" d="M258,157V163" stroke-width="1"/><path class="s-mute" d="M269,157V163" stroke-width="1"/><rect class="f-soft" x="60" y="50" width="110" height="110"/><rect class="s-acc" x="60" y="50" width="110" height="110" fill="none" stroke-width="2"/><text class="t-acc" x="115" y="42" text-anchor="middle">1</text><text class="t-acc" x="50" y="109" text-anchor="end">1</text><path class="s-red" d="M60,160L170,50" stroke-width="3"/><text class="t-red" x="101" y="99" text-anchor="end">√2</text><path class="s-red" d="M170,50A155.56,155.56 0 0 1 215.56,160" fill="none" stroke-width="2" stroke-dasharray="122.18" stroke-dashoffset="122.18"><animate attributeName="stroke-dashoffset" values="122.18;122.18;0;0;122.18" keyTimes="0;0.15;0.55;0.92;1" dur="7s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.55;0.95" dur="7s" repeatCount="indefinite" calcMode="discrete"/><circle class="f-red" cx="215.56" cy="160" r="6"/><text class="t-red" x="223.56" y="146" text-anchor="start">√2 ≈ 1,414</text><text class="t-s" x="300" y="40" text-anchor="middle">1² + 1² = 2</text></g></svg>
