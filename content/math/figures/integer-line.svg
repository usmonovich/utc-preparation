<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" font-family="inherit"><title>Сложение целых чисел на числовой прямой: из точки −3 делаем шаг +5 вправо и попадаем в 2; противоположные числа −5 и 5 стоят на одинаковом расстоянии от нуля, |−5| = |5| = 5</title><defs><marker id="integer-line-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="integer-line-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker><marker id="integer-line-m-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-grn" d="M0,0L10,5L0,10Z"/></marker></defs><path class="s-ink" d="M20,110H340" stroke-width="2"/><path class="s-mute" d="M28,104V116" stroke-width="1.4"/><text class="t-s" x="28" y="134" text-anchor="middle">−8</text><path class="s-mute" d="M47,104V116" stroke-width="1.4"/><text class="t-s" x="47" y="134" text-anchor="middle">−7</text><path class="s-mute" d="M66,104V116" stroke-width="1.4"/><text class="t-s" x="66" y="134" text-anchor="middle">−6</text><path class="s-mute" d="M85,104V116" stroke-width="1.4"/><text class="t-s" x="85" y="134" text-anchor="middle">−5</text><path class="s-mute" d="M104,104V116" stroke-width="1.4"/><text class="t-s" x="104" y="134" text-anchor="middle">−4</text><path class="s-mute" d="M123,104V116" stroke-width="1.4"/><text class="t-s" x="123" y="134" text-anchor="middle">−3</text><path class="s-mute" d="M142,104V116" stroke-width="1.4"/><text class="t-s" x="142" y="134" text-anchor="middle">−2</text><path class="s-mute" d="M161,104V116" stroke-width="1.4"/><text class="t-s" x="161" y="134" text-anchor="middle">−1</text><path class="s-mute" d="M180,104V116" stroke-width="1.4"/><text class="t-s" x="180" y="134" text-anchor="middle">0</text><path class="s-mute" d="M199,104V116" stroke-width="1.4"/><text class="t-s" x="199" y="134" text-anchor="middle">1</text><path class="s-mute" d="M218,104V116" stroke-width="1.4"/><text class="t-s" x="218" y="134" text-anchor="middle">2</text><path class="s-mute" d="M237,104V116" stroke-width="1.4"/><text class="t-s" x="237" y="134" text-anchor="middle">3</text><path class="s-mute" d="M256,104V116" stroke-width="1.4"/><text class="t-s" x="256" y="134" text-anchor="middle">4</text><path class="s-mute" d="M275,104V116" stroke-width="1.4"/><text class="t-s" x="275" y="134" text-anchor="middle">5</text><path class="s-mute" d="M294,104V116" stroke-width="1.4"/><text class="t-s" x="294" y="134" text-anchor="middle">6</text><path class="s-mute" d="M313,104V116" stroke-width="1.4"/><text class="t-s" x="313" y="134" text-anchor="middle">7</text><path class="s-mute" d="M332,104V116" stroke-width="1.4"/><text class="t-s" x="332" y="134" text-anchor="middle">8</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.04;0.98" dur="7s" repeatCount="indefinite" calcMode="discrete"/><line class="s-acc" x1="180" y1="66" x2="180" y2="66" stroke-width="3" marker-end="url(#integer-line-m-acc)"><animate attributeName="x2" values="180;123;123;123;123;180" keyTimes="0;0.15;0.4;0.55;0.8;1" dur="7s" repeatCount="indefinite"/></line></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.18;0.98" dur="7s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="151.5" y="56" text-anchor="middle">−3</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.42;0.98" dur="7s" repeatCount="indefinite" calcMode="discrete"/><line class="s-red" x1="123" y1="90" x2="123" y2="90" stroke-width="3" marker-end="url(#integer-line-m-red)"><animate attributeName="x2" values="123;123;123;218;218;123" keyTimes="0;0.15;0.4;0.55;0.8;1" dur="7s" repeatCount="indefinite"/></line></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;0.98" dur="7s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="189.5" y="82" text-anchor="middle">+5</text></g><circle class="f-grn" cx="218" cy="110" r="0"><animate attributeName="r" values="0;0;0;0;7;0" keyTimes="0;0.15;0.4;0.55;0.8;1" dur="7s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.98" dur="7s" repeatCount="indefinite" calcMode="discrete"/><text class="t-grn" x="180" y="28" text-anchor="middle">−3 + 5 = 2</text></g><path class="s-mute" d="M85,150H275" stroke-width="1.4" stroke-dasharray="3 3"/><text class="t-s" x="132.5" y="168" text-anchor="middle">|−5| = 5</text><text class="t-s" x="227.5" y="168" text-anchor="middle">|5| = 5</text></svg>
