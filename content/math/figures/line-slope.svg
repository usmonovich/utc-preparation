<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Угловой коэффициент прямой y = kx + 1: прямая поворачивается вокруг точки (0; 1); при k &gt; 0 функция возрастает, при k = 0 прямая горизонтальна, при k &lt; 0 функция убывает; b = 1 — точка пересечения с осью Oy</title><path class="s-mute" d="M20,130H236M120,16V214" stroke-width="1.3"/><path class="s-mute" d="M30,127V133" stroke-width="1"/><path class="s-mute" d="M60,127V133" stroke-width="1"/><path class="s-mute" d="M90,127V133" stroke-width="1"/><path class="s-mute" d="M150,127V133" stroke-width="1"/><path class="s-mute" d="M180,127V133" stroke-width="1"/><path class="s-mute" d="M210,127V133" stroke-width="1"/><text class="t-s" x="240" y="134" text-anchor="start">x</text><text class="t-s" x="128" y="24" text-anchor="start">y</text><g><animateTransform attributeName="transform" type="rotate" values="-45 120 100;-45 120 100;0 120 100;0 120 100;45 120 100;45 120 100;-45 120 100" keyTimes="0;0.28;0.36;0.61;0.69;0.95;1" dur="9s" repeatCount="indefinite"/><path class="s-acc" d="M12,100H228" stroke-width="2.8"/></g><circle class="f-red" cx="120" cy="100" r="5.5"/><text class="t-red" x="84" y="92" text-anchor="end">b = 1</text><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.28" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="250" y="60" text-anchor="start">y = kx + 1</text><text class="t-grn" x="250" y="90" text-anchor="start">k = 1 &gt; 0</text><text class="t-grn" x="250" y="114" text-anchor="start">возрастает</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.36;0.61" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="250" y="60" text-anchor="start">y = kx + 1</text><text class="t-acc" x="250" y="90" text-anchor="start">k = 0</text><text class="t-acc" x="250" y="114" text-anchor="start">постоянна</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.69;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="250" y="60" text-anchor="start">y = kx + 1</text><text class="t-red" x="250" y="90" text-anchor="start">k = −1 &lt; 0</text><text class="t-red" x="250" y="114" text-anchor="start">убывает</text></g><text class="t-s" x="250" y="150" text-anchor="start">k = tg α</text></svg>
