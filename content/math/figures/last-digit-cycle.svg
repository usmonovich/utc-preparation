<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Последние цифры степеней двойки повторяются по кругу 2 → 4 → 8 → 6 → 2: период 4, поэтому у 2^k последняя цифра определяется остатком k при делении на 4</title><circle class="s-mute" cx="110" cy="110" r="62" fill="none" stroke-width="2" stroke-dasharray="5 4"/><circle class="f-paper" cx="110" cy="48" r="17"/><circle class="f-soft" cx="110" cy="48" r="17"/><circle class="s-acc" cx="110" cy="48" r="17" fill="none" stroke-width="2"/><text class="t-acc" x="110" y="54" text-anchor="middle">2</text><circle class="f-paper" cx="172" cy="110" r="17"/><circle class="f-soft" cx="172" cy="110" r="17"/><circle class="s-acc" cx="172" cy="110" r="17" fill="none" stroke-width="2"/><text class="t-acc" x="172" y="116" text-anchor="middle">4</text><circle class="f-paper" cx="110" cy="172" r="17"/><circle class="f-soft" cx="110" cy="172" r="17"/><circle class="s-acc" cx="110" cy="172" r="17" fill="none" stroke-width="2"/><text class="t-acc" x="110" y="178" text-anchor="middle">8</text><circle class="f-paper" cx="48" cy="110" r="17"/><circle class="f-soft" cx="48" cy="110" r="17"/><circle class="s-acc" cx="48" cy="110" r="17" fill="none" stroke-width="2"/><text class="t-acc" x="48" y="116" text-anchor="middle">6</text><line class="s-mute" x1="139.59" y1="69.1" x2="148.35" y2="77.87" stroke-width="1.6"/><path class="f-mute" d="M150.9,80.41L148.99,73.84L144.32,78.51Z"/><line class="s-mute" x1="150.9" y1="139.59" x2="142.13" y2="148.35" stroke-width="1.6"/><path class="f-mute" d="M139.59,150.9L146.16,148.99L141.49,144.32Z"/><line class="s-mute" x1="80.41" y1="150.9" x2="71.65" y2="142.13" stroke-width="1.6"/><path class="f-mute" d="M69.1,139.59L71.01,146.16L75.68,141.49Z"/><line class="s-mute" x1="69.1" y1="80.41" x2="77.87" y2="71.65" stroke-width="1.6"/><path class="f-mute" d="M80.41,69.1L73.84,71.01L78.51,75.68Z"/><circle class="s-red" r="23" fill="none" stroke-width="3"><animate attributeName="cx" values="110;172;110;48;110;172;110;48" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="cy" values="48;110;172;110;48;110;172;110" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/></circle><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^1 = 2</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 2</text><text class="t-s" x="205" y="132" text-anchor="start">1 = 4·0 + 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^2 = 4</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 4</text><text class="t-s" x="205" y="132" text-anchor="start">2 = 4·0 + 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^3 = 8</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 8</text><text class="t-s" x="205" y="132" text-anchor="start">3 = 4·0 + 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^4 = 16</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 6</text><text class="t-s" x="205" y="132" text-anchor="start">4 делится на 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^5 = 32</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 2</text><text class="t-s" x="205" y="132" text-anchor="start">5 = 4·1 + 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^6 = 64</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 4</text><text class="t-s" x="205" y="132" text-anchor="start">6 = 4·1 + 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^7 = 128</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 8</text><text class="t-s" x="205" y="132" text-anchor="start">7 = 4·1 + 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;0;1" keyTimes="0;0.12;0.25;0.38;0.5;0.62;0.75;0.88" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="205" y="80" text-anchor="start">2^8 = 256</text><text class="t-red" x="205" y="106" text-anchor="start">последняя цифра 6</text><text class="t-s" x="205" y="132" text-anchor="start">8 делится на 4</text></g><text class="t-s" x="180" y="200" text-anchor="middle">период 4: 2, 4, 8, 6, 2, 4, 8, 6, …</text></svg>
