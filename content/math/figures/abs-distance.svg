<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Модуль как расстояние: |x − 2| — расстояние от точки x до точки 2. Точка x = 6 удалена на 4, x = 0 — на 2, x = 5 — ровно на 3; поэтому |x − 2| ≤ 3 — это все точки на расстоянии не больше 3 от 2, отрезок [−1; 5]</title><path class="s-ink" d="M16,120H344" stroke-width="2"/><path class="s-mute" d="M40,116V124" stroke-width="1.2"/><text class="t-s" x="40" y="140" text-anchor="middle">−2</text><path class="s-mute" d="M70,116V124" stroke-width="1.2"/><text class="t-s" x="70" y="140" text-anchor="middle">−1</text><path class="s-mute" d="M100,116V124" stroke-width="1.2"/><text class="t-s" x="100" y="140" text-anchor="middle">0</text><path class="s-mute" d="M130,116V124" stroke-width="1.2"/><text class="t-s" x="130" y="140" text-anchor="middle">1</text><path class="s-mute" d="M160,116V124" stroke-width="1.2"/><text class="t-s" x="160" y="140" text-anchor="middle">2</text><path class="s-mute" d="M190,116V124" stroke-width="1.2"/><text class="t-s" x="190" y="140" text-anchor="middle">3</text><path class="s-mute" d="M220,116V124" stroke-width="1.2"/><text class="t-s" x="220" y="140" text-anchor="middle">4</text><path class="s-mute" d="M250,116V124" stroke-width="1.2"/><text class="t-s" x="250" y="140" text-anchor="middle">5</text><path class="s-mute" d="M280,116V124" stroke-width="1.2"/><text class="t-s" x="280" y="140" text-anchor="middle">6</text><path class="s-mute" d="M310,116V124" stroke-width="1.2"/><text class="t-s" x="310" y="140" text-anchor="middle">7</text><path class="s-mute" d="M340,116V124" stroke-width="1.2"/><text class="t-s" x="340" y="140" text-anchor="middle">8</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.76;0.96;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/><path class="s-grn" d="M70,120H250" stroke-width="8" stroke-linecap="round" opacity="0.5"/><circle class="f-grn" cx="70" cy="120" r="5.5"/><circle class="f-grn" cx="250" cy="120" r="5.5"/><text class="t-grn" x="180" y="176" text-anchor="middle">|x − 2| ≤ 3  ⇔  −1 ≤ x ≤ 5</text></g><line class="s-red" x1="160" y1="94" y2="94" stroke-width="3"><animate attributeName="x2" values="280;280;100;100;250;250;250;280" keyTimes="0;0.2;0.28;0.46;0.54;0.72;0.96;1" dur="10s" repeatCount="indefinite"/></line><circle class="f-red" cy="120" r="6"><animate attributeName="cx" values="280;280;100;100;250;250;250;280" keyTimes="0;0.2;0.28;0.46;0.54;0.72;0.96;1" dur="10s" repeatCount="indefinite"/></circle><circle class="f-acc" cx="160" cy="120" r="6"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2" dur="10s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="280" y="160" text-anchor="middle">x</text><text class="t" x="180" y="36" text-anchor="middle">x = 6:  |6 − 2| = 4</text><text class="t-s" x="180" y="58" text-anchor="middle">дальше 3 — вне</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.28;0.46" dur="10s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="100" y="160" text-anchor="middle">x</text><text class="t" x="180" y="36" text-anchor="middle">x = 0:  |0 − 2| = 2</text><text class="t-s" x="180" y="58" text-anchor="middle">ближе 3 — внутри</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.54;0.72" dur="10s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="250" y="160" text-anchor="middle">x</text><text class="t" x="180" y="36" text-anchor="middle">x = 5:  |5 − 2| = 3</text><text class="t-s" x="180" y="58" text-anchor="middle">ровно 3 — граница</text></g></svg>
