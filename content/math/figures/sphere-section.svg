<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Сечение шара плоскостью — круг: если плоскость удалена от центра на d, радиус сечения r = √(R² − d²). Для R = 5: при d = 0 — большой круг r = 5, при d = 3 — r = 4, при d = 4 — r = 3, при d = 5 плоскость только касается шара</title><circle class="f-acc" cx="120" cy="115" r="75" opacity="0.15"/><circle class="s-ink" cx="120" cy="115" r="75" fill="none" stroke-width="2"/><ellipse class="s-mute" cx="120" cy="115" rx="75" ry="14" fill="none" stroke-width="1.2" stroke-dasharray="4 3"/><circle class="f-ink" cx="120" cy="115" r="3"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.25" dur="10s" repeatCount="indefinite" calcMode="discrete"/><ellipse class="f-red" cx="120" cy="115" rx="75" ry="14.25" opacity="0.45"/><line class="s-red" x1="120" y1="115" x2="195" y2="115" stroke-width="2.4"/><text class="t-s" x="222" y="90" text-anchor="start">R = 5</text><text class="t-s" x="222" y="116" text-anchor="start">d = 0</text><text class="t-s" x="222" y="142" text-anchor="start">r = 5</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" dur="10s" repeatCount="indefinite" calcMode="discrete"/><ellipse class="f-red" cx="120" cy="70" rx="60" ry="11.4" opacity="0.45"/><line class="s-red" x1="120" y1="70" x2="180" y2="70" stroke-width="2.4"/><line class="s-grn" x1="120" y1="115" x2="120" y2="70" stroke-width="2.4"/><line class="s-mute" x1="120" y1="115" x2="180" y2="70" stroke-width="1.4"/><text class="t-s" x="222" y="90" text-anchor="start">R = 5</text><text class="t-s" x="222" y="116" text-anchor="start">d = 3</text><text class="t-s" x="222" y="142" text-anchor="start">r = √(25 − 9) = 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" dur="10s" repeatCount="indefinite" calcMode="discrete"/><ellipse class="f-red" cx="120" cy="55" rx="45" ry="8.55" opacity="0.45"/><line class="s-red" x1="120" y1="55" x2="165" y2="55" stroke-width="2.4"/><line class="s-grn" x1="120" y1="115" x2="120" y2="55" stroke-width="2.4"/><line class="s-mute" x1="120" y1="115" x2="165" y2="55" stroke-width="1.4"/><text class="t-s" x="222" y="90" text-anchor="start">R = 5</text><text class="t-s" x="222" y="116" text-anchor="start">d = 4</text><text class="t-s" x="222" y="142" text-anchor="start">r = √(25 − 16) = 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;1.0" dur="10s" repeatCount="indefinite" calcMode="discrete"/><ellipse class="f-red" cx="120" cy="40" rx="1" ry="1" opacity="0.45"/><line class="s-red" x1="120" y1="40" x2="120" y2="40" stroke-width="2.4"/><line class="s-grn" x1="120" y1="115" x2="120" y2="40" stroke-width="2.4"/><line class="s-mute" x1="120" y1="115" x2="120" y2="40" stroke-width="1.4"/><text class="t-s" x="222" y="90" text-anchor="start">R = 5</text><text class="t-s" x="222" y="116" text-anchor="start">d = 5</text><text class="t-s" x="222" y="142" text-anchor="start">r = 0</text></g><text class="t-s" x="180" y="24" text-anchor="middle">r² = R² − d²</text></svg>
