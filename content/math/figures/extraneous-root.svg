<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Откуда берётся посторонний корень: √(x + 2) = x — это пересечение верхней ветви y = √(x + 2) с прямой y = x, точка (2; 2). После возведения в квадрат уравнение x + 2 = x² описывает обе ветви y = ±√(x + 2), и появляется лишняя точка (−1; −1) на нижней ветви — посторонний корень x = −1</title><path class="s-mute" d="M24,118H262M120,12V224" stroke-width="1.3"/><path class="s-mute" d="M60,115V121" stroke-width="1"/><text class="t-s" x="60" y="134" text-anchor="middle">−2</text><path class="s-mute" d="M90,115V121" stroke-width="1"/><text class="t-s" x="90" y="134" text-anchor="middle">−1</text><path class="s-mute" d="M150,115V121" stroke-width="1"/><text class="t-s" x="150" y="134" text-anchor="middle">1</text><path class="s-mute" d="M180,115V121" stroke-width="1"/><text class="t-s" x="180" y="134" text-anchor="middle">2</text><path class="s-mute" d="M210,115V121" stroke-width="1"/><text class="t-s" x="210" y="134" text-anchor="middle">3</text><path class="s-ink" d="M36.0,202.0L222.0,16.0" stroke-width="2"/><text class="t-s" x="225" y="23" text-anchor="start">y = x</text><polyline class="s-acc" points="60,118 60.2,115.57 60.79,113.14 61.77,110.71 63.15,108.28 64.92,105.84 67.09,103.41 69.65,100.98 72.61,98.55 75.96,96.12 79.7,93.69 83.84,91.26 88.37,88.83 93.29,86.4 98.61,83.97 104.32,81.53 110.43,79.1 116.93,76.67 123.83,74.24 131.12,71.81 138.8,69.38 146.88,66.95 155.35,64.52 164.21,62.09 173.47,59.66 183.12,57.22 193.17,54.79 203.61,52.36 214.45,49.93 225.68,47.5" fill="none" stroke-width="2.8"/><text class="t-acc" x="112.5" y="71.5" text-anchor="end">y = √(x + 2)</text><circle class="f-grn" cx="180" cy="58" r="6"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.48;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><polyline class="s-red" points="60,118 60.2,120.43 60.79,122.86 61.77,125.29 63.15,127.72 64.92,130.16 67.09,132.59 69.65,135.02 72.61,137.45 75.96,139.88 79.7,142.31 83.84,144.74 88.37,147.17 93.29,149.6 98.61,152.03 104.32,154.47 110.43,156.9 116.93,159.33 123.83,161.76 131.12,164.19 138.8,166.62 146.88,169.05 155.35,171.48 164.21,173.91 173.47,176.34 183.12,178.78 193.17,181.21 203.61,183.64 214.45,186.07 225.68,188.5" fill="none" stroke-width="2.4" stroke-dasharray="7 5"/><circle class="f-red" cx="90" cy="148" r="6"/><text class="t-red" x="225" y="203" text-anchor="end">y = −√(x + 2)</text></g><g><animate attributeName="opacity" values="1;0" keyTimes="0;0.44" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="272" y="50" text-anchor="start">√(x + 2) = x</text><text class="t-s" x="272" y="76" text-anchor="start">одна точка</text><text class="t-grn" x="272" y="98" text-anchor="start">x = 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.44;0.96" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="272" y="50" text-anchor="start">x + 2 = x²</text><text class="t-s" x="272" y="76" text-anchor="start">корни 2 и −1</text><text class="t-grn" x="272" y="98" text-anchor="start">x = 2 ✓</text><text class="t-red" x="272" y="120" text-anchor="start">x = −1</text><text class="t-s" x="272" y="140" text-anchor="start">посторонний</text></g></svg>
