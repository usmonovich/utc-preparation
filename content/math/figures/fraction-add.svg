<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Сложение дробей с разными знаменателями: 1/2 и 1/3 делим на шестые доли (общий знаменатель 6 = НОК(2, 3)): 1/2 = 3/6, 1/3 = 2/6, вместе 5/6</title><g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.33;0.67" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-paper" x="60" y="30" width="240" height="34" rx="3"/><rect class="f-acc" x="60" y="30" width="120" height="34"/><path class="s-ink" d="M180,30V64" stroke-width="1.4"/><rect class="s-ink" x="60" y="30" width="240" height="34" rx="3" fill="none" stroke-width="2"/><text class="t-acc" x="40" y="53" text-anchor="end">1/2</text><rect class="f-paper" x="60" y="90" width="240" height="34" rx="3"/><rect class="f-red" x="60" y="90" width="80" height="34"/><path class="s-ink" d="M140,90V124" stroke-width="1.4"/><path class="s-ink" d="M220,90V124" stroke-width="1.4"/><rect class="s-ink" x="60" y="90" width="240" height="34" rx="3" fill="none" stroke-width="2"/><text class="t-red" x="40" y="113" text-anchor="end">1/3</text><text class="t-s" x="180" y="160" text-anchor="middle">знаменатели разные — складывать нельзя</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.67" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-paper" x="60" y="30" width="240" height="34" rx="3"/><rect class="f-acc" x="60" y="30" width="40" height="34"/><rect class="f-acc" x="100" y="30" width="40" height="34"/><rect class="f-acc" x="140" y="30" width="40" height="34"/><path class="s-mute" d="M100,30V64" stroke-width="1.4"/><path class="s-mute" d="M140,30V64" stroke-width="1.4"/><path class="s-mute" d="M180,30V64" stroke-width="1.4"/><path class="s-mute" d="M220,30V64" stroke-width="1.4"/><path class="s-mute" d="M260,30V64" stroke-width="1.4"/><rect class="s-ink" x="60" y="30" width="240" height="34" rx="3" fill="none" stroke-width="2"/><text class="t-acc" x="40" y="53" text-anchor="end">3/6</text><rect class="f-paper" x="60" y="90" width="240" height="34" rx="3"/><rect class="f-red" x="60" y="90" width="40" height="34"/><rect class="f-red" x="100" y="90" width="40" height="34"/><path class="s-mute" d="M100,90V124" stroke-width="1.4"/><path class="s-mute" d="M140,90V124" stroke-width="1.4"/><path class="s-mute" d="M180,90V124" stroke-width="1.4"/><path class="s-mute" d="M220,90V124" stroke-width="1.4"/><path class="s-mute" d="M260,90V124" stroke-width="1.4"/><rect class="s-ink" x="60" y="90" width="240" height="34" rx="3" fill="none" stroke-width="2"/><text class="t-red" x="40" y="113" text-anchor="end">2/6</text><text class="t-s" x="180" y="160" text-anchor="middle">общий знаменатель 6 = НОК(2, 3)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.33;0.67" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-paper" x="60" y="60" width="240" height="34" rx="3"/><rect class="f-acc" x="60" y="60" width="40" height="34"/><rect class="f-acc" x="100" y="60" width="40" height="34"/><rect class="f-acc" x="140" y="60" width="40" height="34"/><rect class="f-red" x="180" y="60" width="40" height="34"/><rect class="f-red" x="220" y="60" width="40" height="34"/><path class="s-mute" d="M100,60V94" stroke-width="1.4"/><path class="s-mute" d="M140,60V94" stroke-width="1.4"/><path class="s-mute" d="M180,60V94" stroke-width="1.4"/><path class="s-mute" d="M220,60V94" stroke-width="1.4"/><path class="s-mute" d="M260,60V94" stroke-width="1.4"/><rect class="s-ink" x="60" y="60" width="240" height="34" rx="3" fill="none" stroke-width="2"/><text class="t-grn" x="40" y="83" text-anchor="end">5/6</text><text class="t-grn" x="180" y="160" text-anchor="middle">1/2 + 1/3 = 3/6 + 2/6 = 5/6</text></g><text class="t-s" x="180" y="205" text-anchor="middle">a/b + c/d: приводим к общему знаменателю</text></svg>
