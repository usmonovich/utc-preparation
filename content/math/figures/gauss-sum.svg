<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Сумма арифметической прогрессии: две одинаковые «лесенки» 1, 2, …, 6 (вторая перевёрнута) складываются в прямоугольник 6 × 7, поэтому 1 + 2 + … + 6 = 6·7/2 = 21; в общем виде Sₙ = (a₁ + aₙ)·n/2</title><rect class="f-acc" x="40" y="170" width="20" height="20" opacity="0.85"/><rect class="s-ink" x="40" y="170" width="20" height="20" fill="none" stroke-width="1"/><text class="t-s" x="50" y="206" text-anchor="middle">1</text><rect class="f-acc" x="60" y="150" width="20" height="40" opacity="0.85"/><rect class="s-ink" x="60" y="150" width="20" height="40" fill="none" stroke-width="1"/><text class="t-s" x="70" y="206" text-anchor="middle">2</text><rect class="f-acc" x="80" y="130" width="20" height="60" opacity="0.85"/><rect class="s-ink" x="80" y="130" width="20" height="60" fill="none" stroke-width="1"/><text class="t-s" x="90" y="206" text-anchor="middle">3</text><rect class="f-acc" x="100" y="110" width="20" height="80" opacity="0.85"/><rect class="s-ink" x="100" y="110" width="20" height="80" fill="none" stroke-width="1"/><text class="t-s" x="110" y="206" text-anchor="middle">4</text><rect class="f-acc" x="120" y="90" width="20" height="100" opacity="0.85"/><rect class="s-ink" x="120" y="90" width="20" height="100" fill="none" stroke-width="1"/><text class="t-s" x="130" y="206" text-anchor="middle">5</text><rect class="f-acc" x="140" y="70" width="20" height="120" opacity="0.85"/><rect class="s-ink" x="140" y="70" width="20" height="120" fill="none" stroke-width="1"/><text class="t-s" x="150" y="206" text-anchor="middle">6</text><g><animateTransform attributeName="transform" type="translate" values="150 0;150 0;0 0;0 0;150 0" keyTimes="0;0.2;0.5;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-grn" x="40" y="50" width="20" height="120" opacity="0.8"/><rect class="s-ink" x="40" y="50" width="20" height="120" fill="none" stroke-width="1"/><rect class="f-grn" x="60" y="50" width="20" height="100" opacity="0.8"/><rect class="s-ink" x="60" y="50" width="20" height="100" fill="none" stroke-width="1"/><rect class="f-grn" x="80" y="50" width="20" height="80" opacity="0.8"/><rect class="s-ink" x="80" y="50" width="20" height="80" fill="none" stroke-width="1"/><rect class="f-grn" x="100" y="50" width="20" height="60" opacity="0.8"/><rect class="s-ink" x="100" y="50" width="20" height="60" fill="none" stroke-width="1"/><rect class="f-grn" x="120" y="50" width="20" height="40" opacity="0.8"/><rect class="s-ink" x="120" y="50" width="20" height="40" fill="none" stroke-width="1"/><rect class="f-grn" x="140" y="50" width="20" height="20" opacity="0.8"/><rect class="s-ink" x="140" y="50" width="20" height="20" fill="none" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><rect class="s-red" x="40" y="50" width="120" height="140" fill="none" stroke-width="2.6"/><text class="t-red" x="174" y="120" text-anchor="start">7</text><text class="t" x="220" y="80" text-anchor="start">2S = 6 · 7 = 42</text><text class="t-red" x="220" y="106" text-anchor="start">S = 21</text><text class="t-s" x="220" y="140" text-anchor="start">Sₙ = (a₁ + aₙ)·n/2</text></g><text class="t-acc" x="40" y="30" text-anchor="start">1 + 2 + … + 6 = ?</text></svg>
