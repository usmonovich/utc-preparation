<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="inherit"><title>Движение навстречу: расстояние 360 км, автомобили едут навстречу со скоростями 70 и 50 км/ч; расстояние между ними уменьшается на 70 + 50 = 120 км каждый час, поэтому встреча через 360 : 120 = 3 ч; первый проедет 210 км, второй 150 км</title><path class="s-ink" d="M30,124H330" stroke-width="2"/><path class="s-mute" d="M30,120V128" stroke-width="1.2"/><text class="t-s" x="30" y="144" text-anchor="middle">0</text><path class="s-mute" d="M80,120V128" stroke-width="1.2"/><text class="t-s" x="80" y="144" text-anchor="middle">60</text><path class="s-mute" d="M130,120V128" stroke-width="1.2"/><text class="t-s" x="130" y="144" text-anchor="middle">120</text><path class="s-mute" d="M180,120V128" stroke-width="1.2"/><text class="t-s" x="180" y="144" text-anchor="middle">180</text><path class="s-mute" d="M230,120V128" stroke-width="1.2"/><text class="t-s" x="230" y="144" text-anchor="middle">240</text><path class="s-mute" d="M280,120V128" stroke-width="1.2"/><text class="t-s" x="280" y="144" text-anchor="middle">300</text><path class="s-mute" d="M330,120V128" stroke-width="1.2"/><text class="t-s" x="330" y="144" text-anchor="middle">360</text><text class="t-s" x="330" y="162" text-anchor="end">км</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;175 0;175 0;0 0" keyTimes="0;0.1;0.7;0.95;1" dur="8s" repeatCount="indefinite"/><rect class="f-acc" x="16" y="104" width="28" height="14" rx="4"/><text class="t-acc" x="30" y="96" text-anchor="middle">70 км/ч</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-125 0;-125 0;0 0" keyTimes="0;0.1;0.7;0.95;1" dur="8s" repeatCount="indefinite"/><rect class="f-red" x="316" y="104" width="28" height="14" rx="4"/><text class="t-red" x="330" y="78" text-anchor="middle">50 км/ч</text></g><text class="t" x="180" y="30" text-anchor="middle">сближение: 70 + 50 = 120 км/ч</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.74;0.95;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><path class="s-grn" d="M205,70V124" stroke-width="2" stroke-dasharray="4 3"/><text class="t-grn" x="180" y="56" text-anchor="middle">t = 360 : 120 = 3 ч</text><text class="t-acc" x="199" y="180" text-anchor="end">210 км</text><text class="t-red" x="211" y="180" text-anchor="start">150 км</text></g></svg>
