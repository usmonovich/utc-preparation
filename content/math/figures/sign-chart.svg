<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Метод интервалов для (x + 2)(x − 1)(x − 3) &gt; 0: отмечаем корни −2, 1, 3 выколотыми точками, справа от большего корня знак «+», при переходе через каждый простой корень знак меняется; ответ — промежутки со знаком «+»: (−2; 1) ∪ (3; +∞)</title><text class="t" x="180" y="26" text-anchor="middle">(x + 2)(x − 1)(x − 3) &gt; 0</text><path class="s-ink" d="M14,124H346" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><path class="s-grn" d="M80.0,124H200.0M280.0,124H346" stroke-width="7" stroke-linecap="round" opacity="0.55"/><text class="t-grn" x="180" y="206" text-anchor="middle">x ∈ (−2; 1) ∪ (3; +∞)</text></g><path class="s-red" d="M346,74Q310.0,72 280.0,124Q240.0,204 200.0,124Q140.0,34 80.0,124Q50.0,176 14,178" fill="none" stroke-width="2.4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.14;0.5;0.95;1" dur="9s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.24000000000000002;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-grn" x="314" y="81" text-anchor="middle" style="font-size:24px;font-weight:700">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.33999999999999997;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="240" y="179" text-anchor="middle" style="font-size:24px;font-weight:700">−</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.44;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-grn" x="140" y="81" text-anchor="middle" style="font-size:24px;font-weight:700">+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="46" y="181" text-anchor="middle" style="font-size:24px;font-weight:700">−</text></g><circle class="f-paper s-ink" cx="80.0" cy="124" r="5.5" stroke-width="2"/><text class="t-s" x="80" y="146" text-anchor="middle">−2</text><circle class="f-paper s-ink" cx="200.0" cy="124" r="5.5" stroke-width="2"/><text class="t-s" x="200" y="146" text-anchor="middle">1</text><circle class="f-paper s-ink" cx="280.0" cy="124" r="5.5" stroke-width="2"/><text class="t-s" x="280" y="146" text-anchor="middle">3</text></svg>
