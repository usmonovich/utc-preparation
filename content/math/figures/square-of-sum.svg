<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Квадрат суммы на площадях: квадрат со стороной a + b складывается из квадрата a², квадрата b² и двух прямоугольников ab, поэтому (a + b)² = a² + 2ab + b² (на рисунке a = 3, b = 2: 25 = 9 + 6 + 6 + 4)</title><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 -6;-6 -6;0 0;0 0" keyTimes="0;0.12;0.45;0.75;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-acc" x="30" y="26" width="90" height="90" opacity="0.85"/><rect class="s-ink" x="30" y="26" width="90" height="90" fill="none" stroke-width="1.6"/><text class="t-w" x="75" y="77" text-anchor="middle">a²</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 -6;6 -6;0 0;0 0" keyTimes="0;0.12;0.45;0.75;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-red-soft" x="120" y="26" width="60" height="90" opacity="0.85"/><rect class="s-ink" x="120" y="26" width="60" height="90" fill="none" stroke-width="1.6"/><text class="t" x="150" y="77" text-anchor="middle">ab</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 6;-6 6;0 0;0 0" keyTimes="0;0.12;0.45;0.75;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-red-soft" x="30" y="116" width="90" height="60" opacity="0.85"/><rect class="s-ink" x="30" y="116" width="90" height="60" fill="none" stroke-width="1.6"/><text class="t" x="75" y="152" text-anchor="middle">ab</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 6;6 6;0 0;0 0" keyTimes="0;0.12;0.45;0.75;0.92;1" dur="8s" repeatCount="indefinite"/><rect class="f-grn" x="120" y="116" width="60" height="60" opacity="0.85"/><rect class="s-ink" x="120" y="116" width="60" height="60" fill="none" stroke-width="1.6"/><text class="t-w" x="150" y="152" text-anchor="middle">b²</text></g><path class="s-mute" d="M30,186H120M120,186H180" stroke-width="1.4"/><text class="t-acc" x="75" y="200" text-anchor="middle">a</text><text class="t-grn" x="150" y="200" text-anchor="middle">b</text><text class="t" x="202" y="46" text-anchor="start">(a + b)² =</text><text class="t" x="202" y="68" text-anchor="start">= a² + 2ab + b²</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.95" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-s" x="202" y="100" text-anchor="start">a = 3, b = 2:</text><text class="t-acc" x="202" y="122" text-anchor="start">25 = 9 + 6 + 6 + 4</text></g><text class="t-s" x="202" y="158" text-anchor="start">два прямоугольника ab —</text><text class="t-s" x="202" y="176" text-anchor="start">это «удвоенное</text><text class="t-s" x="202" y="194" text-anchor="start">произведение» 2ab</text></svg>
