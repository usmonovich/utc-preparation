<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Сколько решений у системы двух линейных уравнений: прямые x + 2y = 7 и 3x − y = 7 пересекаются в одной точке (3; 2) — одно решение; параллельные прямые x + 2y = 7 и x + 2y = 3 — решений нет; совпадающие x + 2y = 7 и 2x + 4y = 14 — бесконечно много решений</title><path class="s-mute" d="M14,176H214M40,16V208" stroke-width="1.4"/><path class="s-mute" d="M62,173V179" stroke-width="1"/><path class="s-mute" d="M84,173V179" stroke-width="1"/><path class="s-mute" d="M106,173V179" stroke-width="1"/><path class="s-mute" d="M128,173V179" stroke-width="1"/><path class="s-mute" d="M150,173V179" stroke-width="1"/><path class="s-mute" d="M172,173V179" stroke-width="1"/><path class="s-mute" d="M194,173V179" stroke-width="1"/><path class="s-mute" d="M37,154H43" stroke-width="1"/><path class="s-mute" d="M37,132H43" stroke-width="1"/><path class="s-mute" d="M37,110H43" stroke-width="1"/><path class="s-mute" d="M37,88H43" stroke-width="1"/><path class="s-mute" d="M37,66H43" stroke-width="1"/><path class="s-mute" d="M37,44H43" stroke-width="1"/><text class="t-s" x="106" y="192" text-anchor="middle">3</text><text class="t-s" x="32" y="136" text-anchor="end">2</text><path class="s-acc" d="M18,88L207.2,182.6" stroke-width="2.6"/><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.33" dur="9s" repeatCount="indefinite" calcMode="discrete"/><path class="s-red" d="M75.2,224.4L133.5,49.5" stroke-width="2.6"/><path class="s-mute" d="M106,176V132H40" stroke-width="1.2" stroke-dasharray="4 3"/><circle class="f-red" cx="106" cy="132" r="5.5"/><text class="t-acc" x="224" y="48" text-anchor="start">x + 2y = 7</text><text class="t-red" x="224" y="70" text-anchor="start">3x − y = 7</text><text class="t-grn" x="224" y="110" text-anchor="start">одно решение</text><text class="t-s" x="224" y="134" text-anchor="start">(3; 2)</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.66" dur="9s" repeatCount="indefinite" calcMode="discrete"/><path class="s-red" d="M18,132L172,209" stroke-width="2.6"/><text class="t-acc" x="224" y="48" text-anchor="start">x + 2y = 7</text><text class="t-red" x="224" y="70" text-anchor="start">x + 2y = 3</text><text class="t-red" x="224" y="110" text-anchor="start">решений нет</text><text class="t-s" x="224" y="134" text-anchor="start">прямые параллельны</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.66;0.999" dur="9s" repeatCount="indefinite" calcMode="discrete"/><path class="s-red" d="M18,88L207.2,182.6" stroke-width="2.6" stroke-dasharray="9 7"/><text class="t-acc" x="224" y="48" text-anchor="start">x + 2y = 7</text><text class="t-red" x="224" y="70" text-anchor="start">2x + 4y = 14</text><text class="t-acc" x="224" y="110" text-anchor="start">бесконечно</text><text class="t-acc" x="224" y="130" text-anchor="start">много решений</text><text class="t-s" x="224" y="154" text-anchor="start">прямые совпадают</text></g></svg>
