<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Конус, шар и цилиндр одного радиуса R и высоты 2R: их объёмы относятся как 1 : 2 : 3 (Архимед). Вода из конуса заполняет треть цилиндра, вода из шара — ещё две трети</title><path class="f-acc" d="M15,110H95L55,190Z" opacity="0.25"/><path class="s-ink" d="M15,110H95L55,190Z" fill="none" stroke-width="2"/><text class="t-s" x="55" y="208" text-anchor="middle">конус: 1</text><circle class="f-red" cx="155" cy="150" r="40" opacity="0.25"/><circle class="s-ink" cx="155" cy="150" r="40" fill="none" stroke-width="2"/><text class="t-s" x="155" y="208" text-anchor="middle">шар: 2</text><rect class="f-acc" x="230" width="80" opacity="0.55"><animate attributeName="height" values="0;0;26.67;26.67;26.67;26.67;0" keyTimes="0;0.1;0.35;0.45;0.92;0.98;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="190;190;163.33;163.33;163.33;163.33;190" keyTimes="0;0.1;0.35;0.45;0.92;0.98;1" dur="9s" repeatCount="indefinite"/></rect><rect class="f-red" x="230" width="80" opacity="0.55"><animate attributeName="height" values="0;0;53.33;53.33;0" keyTimes="0;0.5;0.8;0.95;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="163.33;163.33;110;110;163.33" keyTimes="0;0.5;0.8;0.95;1" dur="9s" repeatCount="indefinite"/></rect><rect class="s-ink" x="230" y="110" width="80" height="80" fill="none" stroke-width="2"/><text class="t-s" x="270" y="208" text-anchor="middle">цилиндр: 3</text><text class="t-s" x="180" y="26" text-anchor="middle">V = ⅓πR²·2R : ⁴⁄₃πR³ : πR²·2R = 1 : 2 : 3</text></svg>
