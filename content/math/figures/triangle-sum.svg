<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Сумма углов треугольника: через вершину B проведена прямая, параллельная AC; углы при A и C «переезжают» к вершине B как накрест лежащие и вместе с углом B составляют развёрнутый угол 180°</title><path class="s-mute" d="M20,50H340" stroke-width="1.5" stroke-dasharray="6 4"/><path class="s-ink" d="M40,180L150,50L300,180Z" fill="none" stroke-width="2.4"/><text class="t" x="32" y="196" text-anchor="middle">A</text><text class="t" x="150" y="38" text-anchor="middle">B</text><text class="t" x="308" y="196" text-anchor="middle">C</text><path class="f-red" d="M40,180L70,180A30,30 0 0 0 59.38,157.1Z" opacity="0.75"/><path class="f-grn" d="M300,180L277.33,160.35A30,30 0 0 0 270,180Z" opacity="0.75"/><path class="f-acc" d="M150,50L133.21,69.85A26,26 0 0 0 169.65,67.03Z" opacity="0.75"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;110 -130;110 -130;0 0" keyTimes="0;0.15;0.5;0.92;1" dur="9s" repeatCount="indefinite"/><g transform="rotate(180 40 180)"><path class="f-red" d="M40,180L70,180A30,30 0 0 0 59.38,157.1Z" opacity="0.75"/></g></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-150 -130;-150 -130;0 0" keyTimes="0;0.15;0.5;0.92;1" dur="9s" repeatCount="indefinite"/><g transform="rotate(180 300 180)"><path class="f-grn" d="M300,180L277.33,160.35A30,30 0 0 0 270,180Z" opacity="0.75"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;0.92;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-red" x="180" y="24" text-anchor="middle">∠A + ∠B + ∠C = 180°</text></g></svg>
