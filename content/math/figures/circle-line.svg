<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Система «окружность и прямая»: x² + y² = 25, y = x + b. При b = 1 прямая пересекает окружность в двух точках (3; 4) и (−4; −3) — два решения; при b = 5√2 ≈ 7,07 касается — одно решение; при b = 9 проходит мимо — решений нет</title><defs><clipPath id="circle-line-clip"><rect x="14" y="12" width="210" height="210"/></clipPath></defs><path class="s-mute" d="M24,128H218M112,16V222" stroke-width="1.3"/><circle class="s-acc" cx="112" cy="128" r="65" fill="none" stroke-width="2.6"/><text class="t-s" x="181" y="142" text-anchor="start">5</text><g clip-path="url(#circle-line-clip)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -78.92;0 -78.92;0 -104;0 -104;0 0" keyTimes="0;0.28;0.36;0.61;0.69;0.95;1" dur="9s" repeatCount="indefinite"/><path class="s-red" d="M-96,323L216,11" stroke-width="2.4"/></g></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.28" dur="9s" repeatCount="indefinite" calcMode="discrete"/><circle class="f-red" cx="151" cy="76" r="5.5"/><circle class="f-red" cx="60" cy="167" r="5.5"/><text class="t-acc" x="234" y="46" text-anchor="start">x² + y² = 25</text><text class="t-red" x="234" y="68" text-anchor="start">y = x + b</text><text class="t" x="234" y="108" text-anchor="start">b = 1</text><text class="t-grn" x="234" y="132" text-anchor="start">два решения</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.36;0.61" dur="9s" repeatCount="indefinite" calcMode="discrete"/><circle class="f-red" cx="66.04" cy="82.04" r="5.5"/><text class="t-acc" x="234" y="46" text-anchor="start">x² + y² = 25</text><text class="t-red" x="234" y="68" text-anchor="start">y = x + b</text><text class="t" x="234" y="108" text-anchor="start">b = 5√2 ≈ 7,07</text><text class="t-acc" x="234" y="132" text-anchor="start">одно (касание)</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.69;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="234" y="46" text-anchor="start">x² + y² = 25</text><text class="t-red" x="234" y="68" text-anchor="start">y = x + b</text><text class="t" x="234" y="108" text-anchor="start">b = 9</text><text class="t-red" x="234" y="132" text-anchor="start">решений нет</text></g></svg>
