<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="inherit"><title>Почему дробь 3/11 периодическая: при делении уголком остатки 3 → 8 → 3 → 8 … повторяются, значит, повторяются и цифры частного: 3/11 = 0,(27)</title><circle class="s-mute" cx="270" cy="110" r="46" fill="none" stroke-width="2" stroke-dasharray="5 4"/><circle class="f-paper" cx="270" cy="64" r="16"/><circle class="f-soft" cx="270" cy="64" r="16"/><circle class="s-acc" cx="270" cy="64" r="16" fill="none" stroke-width="2"/><text class="t-acc" x="270" y="69" text-anchor="middle">3</text><circle class="f-paper" cx="270" cy="156" r="16"/><circle class="f-soft" cx="270" cy="156" r="16"/><circle class="s-acc" cx="270" cy="156" r="16" fill="none" stroke-width="2"/><text class="t-acc" x="270" y="161" text-anchor="middle">8</text><text class="t-s" x="322" y="104" text-anchor="start">·10 : 11</text><text class="t-s" x="270" y="28" text-anchor="middle">остатки</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="20" y="70" text-anchor="start">30 = 11·2 + 8</text><text class="t-red" x="20" y="100" text-anchor="start">цифра 2, остаток 8</text><text class="t-acc" x="20" y="140" text-anchor="start">3/11 = 0,2…</text><circle class="s-red" cx="270" cy="156" r="22" fill="none" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="20" y="70" text-anchor="start">80 = 11·7 + 3</text><text class="t-red" x="20" y="100" text-anchor="start">цифра 7, остаток 3</text><text class="t-acc" x="20" y="140" text-anchor="start">3/11 = 0,27…</text><circle class="s-red" cx="270" cy="64" r="22" fill="none" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="20" y="70" text-anchor="start">30 = 11·2 + 8</text><text class="t-red" x="20" y="100" text-anchor="start">цифра 2, остаток 8</text><text class="t-acc" x="20" y="140" text-anchor="start">3/11 = 0,272…</text><circle class="s-red" cx="270" cy="156" r="22" fill="none" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t" x="20" y="70" text-anchor="start">80 = 11·7 + 3</text><text class="t-red" x="20" y="100" text-anchor="start">цифра 7, остаток 3</text><text class="t-acc" x="20" y="140" text-anchor="start">3/11 = 0,2727…</text><circle class="s-red" cx="270" cy="64" r="22" fill="none" stroke-width="3"/></g><text class="t-s" x="180" y="200" text-anchor="middle">остаток повторился → цифры повторяются: 0,(27)</text></svg>
