<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Совместная работа: первая труба наполняет бак за 6 ч (1/6 бака в час), вторая — за 3 ч (1/3 бака в час); вместе 1/6 + 1/3 = 1/2 бака в час, поэтому бак наполнится за 2 ч</title><rect class="s-ink" x="34" y="42" width="56" height="116" fill="none" stroke-width="2"/><rect class="f-acc" x="36" width="52" opacity="0.85"><animate attributeName="height" values="0;114;114;0" keyTimes="0;0.8;0.96;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="158;44;44;158" keyTimes="0;0.8;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text class="t-s" x="62" y="178" text-anchor="middle">первая: 6 ч</text><text class="t-s" x="62" y="32" text-anchor="middle">1/6 в час</text><rect class="s-ink" x="134" y="42" width="56" height="116" fill="none" stroke-width="2"/><rect class="f-grn" x="136" width="52" opacity="0.85"><animate attributeName="height" values="0;114;114;0" keyTimes="0;0.4;0.96;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="158;44;44;158" keyTimes="0;0.4;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text class="t-s" x="162" y="178" text-anchor="middle">вторая: 3 ч</text><text class="t-s" x="162" y="32" text-anchor="middle">1/3 в час</text><rect class="s-ink" x="234" y="42" width="56" height="116" fill="none" stroke-width="2"/><rect class="f-red" x="236" width="52" opacity="0.85"><animate attributeName="height" values="0;114;114;0" keyTimes="0;0.27;0.96;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="158;44;44;158" keyTimes="0;0.27;0.96;1" dur="9s" repeatCount="indefinite"/></rect><text class="t-s" x="262" y="178" text-anchor="middle">вместе: 2 ч</text><text class="t-s" x="262" y="32" text-anchor="middle">1/6 + 1/3 = 1/2</text><path class="s-mute" d="M30,192H330" stroke-width="1.2"/><path class="s-mute" d="M30,188V196" stroke-width="1"/><path class="s-mute" d="M80,188V196" stroke-width="1"/><path class="s-mute" d="M130,188V196" stroke-width="1"/><path class="s-mute" d="M180,188V196" stroke-width="1"/><path class="s-mute" d="M230,188V196" stroke-width="1"/><path class="s-mute" d="M280,188V196" stroke-width="1"/><path class="s-mute" d="M330,188V196" stroke-width="1"/><circle class="f-ink" cy="192" r="4.5"><animate attributeName="cx" values="30;330;330;30" keyTimes="0;0.8;0.96;1" dur="9s" repeatCount="indefinite"/></circle><text class="t-s" x="334" y="188" text-anchor="end">6 ч</text><text class="t-s" x="30" y="210" text-anchor="middle">0</text><text class="t-s" x="130" y="210" text-anchor="middle">2 ч</text><text class="t-s" x="180" y="210" text-anchor="middle">3 ч</text></svg>
