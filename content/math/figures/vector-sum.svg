<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Сложение векторов по правилу параллелограмма и в координатах: a = (3; 1), b = (1; 2); их сумма a + b = (4; 3) — диагональ параллелограмма, построенного на a и b; координаты складываются, длина |a + b| = 5</title><defs><marker id="vector-sum-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="vector-sum-m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-red" d="M0,0L10,5L0,10Z"/></marker><marker id="vector-sum-m-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-grn" d="M0,0L10,5L0,10Z"/></marker><marker id="vector-sum-m-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-mute" d="M0,0L10,5L0,10Z"/></marker></defs><path class="s-mute" d="M20,190H250M50,30V204" stroke-width="1.2"/><path class="s-mute" d="M90,187V193M47,150H53" stroke-width="1"/><text class="t-s" x="90" y="206" text-anchor="middle">1</text><path class="s-mute" d="M130,187V193M47,110H53" stroke-width="1"/><text class="t-s" x="130" y="206" text-anchor="middle">2</text><path class="s-mute" d="M170,187V193M47,70H53" stroke-width="1"/><text class="t-s" x="170" y="206" text-anchor="middle">3</text><path class="s-mute" d="M210,187V193M47,30H53" stroke-width="1"/><text class="t-s" x="210" y="206" text-anchor="middle">4</text><line class="s-acc" x1="50" y1="190" x2="170" y2="150" stroke-width="2.8" marker-end="url(#vector-sum-m-acc)"></line><text class="t-acc" x="122" y="190" text-anchor="middle">a</text><line class="s-red" x1="50" y1="190" x2="90" y2="110" stroke-width="2.8" marker-end="url(#vector-sum-m-red)"></line><text class="t-red" x="62" y="142" text-anchor="end">b</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.3;0.95;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><line class="s-red" x1="170" y1="150" x2="210" y2="70" stroke-width="2" marker-end="url(#vector-sum-m-red)" stroke-dasharray="5 4"></line><line class="s-acc" x1="90" y1="110" x2="210" y2="70" stroke-width="2" marker-end="url(#vector-sum-m-acc)" stroke-dasharray="5 4"></line></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.95;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><line class="s-grn" x1="50" y1="190" x2="210" y2="70" stroke-width="3.2" marker-end="url(#vector-sum-m-grn)"></line><text class="t-grn" x="142" y="114" text-anchor="end">a + b</text><text class="t-grn" x="250" y="120" text-anchor="start">a + b = (4; 3)</text><text class="t-grn" x="250" y="144" text-anchor="start">|a + b| = 5</text></g><text class="t-acc" x="250" y="50" text-anchor="start">a = (3; 1)</text><text class="t-red" x="250" y="74" text-anchor="start">b = (1; 2)</text></svg>
