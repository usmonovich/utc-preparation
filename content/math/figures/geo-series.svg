<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Бесконечно убывающая геометрическая прогрессия: 1/2 + 1/4 + 1/8 + … — каждый новый кусок закрывает половину оставшейся части квадрата, поэтому сумма равна 1 = b₁/(1 − q) = (1/2)/(1 − 1/2)</title><rect class="s-ink" x="40" y="20" width="180" height="180" fill="none" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.13;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-acc" x="40" y="20" width="90" height="180" opacity="0.90"/><rect class="s-ink" x="40" y="20" width="90" height="180" fill="none" stroke-width="1"/><text class="t-w" x="85" y="115" text-anchor="middle">1/2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.22;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-grn" x="130" y="20" width="90" height="90" opacity="0.83"/><rect class="s-ink" x="130" y="20" width="90" height="90" fill="none" stroke-width="1"/><text class="t-w" x="175" y="70" text-anchor="middle">1/4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.31;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-acc" x="130" y="110" width="45" height="90" opacity="0.76"/><rect class="s-ink" x="130" y="110" width="45" height="90" fill="none" stroke-width="1"/><text class="t-w" x="152.5" y="160" text-anchor="middle">1/8</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-grn" x="175" y="110" width="45" height="45" opacity="0.69"/><rect class="s-ink" x="175" y="110" width="45" height="45" fill="none" stroke-width="1"/><text class="t-w" x="197.5" y="137.5" text-anchor="middle">1/16</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.49;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-acc" x="175" y="155" width="22.5" height="45" opacity="0.62"/><rect class="s-ink" x="175" y="155" width="22.5" height="45" fill="none" stroke-width="1"/><text class="t-s" x="186.25" y="182.5" text-anchor="middle">1/32</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.58;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-grn" x="197.5" y="155" width="22.5" height="22.5" opacity="0.55"/><rect class="s-ink" x="197.5" y="155" width="22.5" height="22.5" fill="none" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.67;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-acc" x="197.5" y="177.5" width="11.25" height="22.5" opacity="0.48"/><rect class="s-ink" x="197.5" y="177.5" width="11.25" height="22.5" fill="none" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.76;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><rect class="f-grn" x="208.75" y="177.5" width="11.25" height="11.25" opacity="0.41"/><rect class="s-ink" x="208.75" y="177.5" width="11.25" height="11.25" fill="none" stroke-width="1"/></g><text class="t" x="238" y="44" text-anchor="start">1/2 + 1/4 + 1/8 + … = 1</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.85;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="238" y="80" text-anchor="start">S = b₁/(1 − q)</text><text class="t-acc" x="238" y="104" text-anchor="start">= (1/2)/(1/2) = 1</text></g><text class="t-s" x="238" y="140" text-anchor="start">q = 1/2, |q| &lt; 1</text></svg>
