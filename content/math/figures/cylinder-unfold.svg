<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="inherit"><title>Развёртка боковой поверхности цилиндра: если разрезать боковую поверхность по образующей и развернуть, получится прямоугольник; одна его сторона равна высоте h, другая — длине окружности основания 2πR, поэтому S бок = 2πR·h</title><rect class="f-acc" x="30" y="62" width="60" height="110" opacity="0.18"/><ellipse class="s-ink" cx="60" cy="62" rx="30" ry="9" fill="none" stroke-width="2"/><path class="s-ink" d="M30,172A30,9 0 0 0 90,172" fill="none" stroke-width="2"/><path class="s-mute" d="M30,172A30,9 0 0 1 90,172" fill="none" stroke-width="1.4" stroke-dasharray="4 3"/><line class="s-ink" x1="30" y1="62" x2="30" y2="172" stroke-width="2"/><line class="s-ink" x1="90" y1="62" x2="90" y2="172" stroke-width="2"/><line class="s-red" x1="60" y1="62" x2="90" y2="62" stroke-width="1.6"/><text class="t-s" x="75" y="48" text-anchor="middle">R</text><line class="s-red" x1="90" y1="62" x2="90" y2="172" stroke-width="3"/><text class="t-s" x="20" y="122" text-anchor="end">h</text><rect class="f-acc" x="130" y="62" height="110" opacity="0.3"><animate attributeName="width" values="0;0;188.5;188.5;0" keyTimes="0;0.15;0.6;0.9;1" dur="8s" repeatCount="indefinite"/></rect><rect class="s-acc" x="130" y="62" height="110" fill="none" stroke-width="2"><animate attributeName="width" values="0;0;188.5;188.5;0" keyTimes="0;0.15;0.6;0.9;1" dur="8s" repeatCount="indefinite"/></rect><line class="s-red" x1="130" y1="62" x2="130" y2="172" stroke-width="3"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.95" dur="8s" repeatCount="indefinite" calcMode="discrete"/><text class="t-s" x="224.25" y="192" text-anchor="middle">длина 2πR</text><text class="t-s" x="326.5" y="122" text-anchor="start">h</text><text class="t-s" x="224.25" y="122" text-anchor="middle">S = 2πR·h</text></g><text class="t-s" x="180" y="24" text-anchor="middle">разрезаем по образующей и разворачиваем</text></svg>
