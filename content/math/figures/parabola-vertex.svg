<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="inherit"><title>Сдвиги параболы: график y = (x − 2)² − 3 получается из y = x² сдвигом на 2 вправо и на 3 вниз; вершина (2; −3), ось симметрии x = 2. Так же y = ax² + bx + c приводится к виду a(x − x₀)² + y₀, где x₀ = −b/(2a)</title><path class="s-mute" d="M16,120H250M100,10V226" stroke-width="1.3"/><path class="s-mute" d="M34,117V123" stroke-width="1"/><path class="s-mute" d="M56,117V123" stroke-width="1"/><path class="s-mute" d="M78,117V123" stroke-width="1"/><path class="s-mute" d="M122,117V123" stroke-width="1"/><path class="s-mute" d="M144,117V123" stroke-width="1"/><path class="s-mute" d="M166,117V123" stroke-width="1"/><path class="s-mute" d="M188,117V123" stroke-width="1"/><path class="s-mute" d="M210,117V123" stroke-width="1"/><text class="t-s" x="144" y="136" text-anchor="middle">2</text><polyline class="s-mute" points="49.4,3.62 52.77,18.62 56.15,32.59 59.52,45.52 62.89,57.41 66.27,68.28 69.64,78.1 73.01,86.9 76.39,94.66 79.76,101.38 83.13,107.07 86.51,111.72 89.88,115.34 93.25,117.93 96.63,119.48 100,120 103.37,119.48 106.75,117.93 110.12,115.34 113.49,111.72 116.87,107.07 120.24,101.38 123.61,94.66 126.99,86.9 130.36,78.1 133.73,68.28 137.11,57.41 140.48,45.52 143.85,32.59 147.23,18.62 150.6,3.62" fill="none" stroke-width="1.6" stroke-dasharray="5 4"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;44 0;44 0;44 66;44 66;0 0" keyTimes="0;0.2;0.35;0.5;0.65;0.95;1" dur="9s" repeatCount="indefinite"/><polyline class="s-acc" points="49.4,3.62 52.77,18.62 56.15,32.59 59.52,45.52 62.89,57.41 66.27,68.28 69.64,78.1 73.01,86.9 76.39,94.66 79.76,101.38 83.13,107.07 86.51,111.72 89.88,115.34 93.25,117.93 96.63,119.48 100,120 103.37,119.48 106.75,117.93 110.12,115.34 113.49,111.72 116.87,107.07 120.24,101.38 123.61,94.66 126.99,86.9 130.36,78.1 133.73,68.28 137.11,57.41 140.48,45.52 143.85,32.59 147.23,18.62 150.6,3.62" fill="none" stroke-width="2.8"/><circle class="f-red" cx="100" cy="120" r="5.5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.7;0.95;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/><path class="s-red" d="M144,14V222" stroke-width="1.4" stroke-dasharray="4 3"/><text class="t-red" x="152" y="204" text-anchor="start">(2; −3)</text></g><g opacity="1"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="256" y="50" text-anchor="start">y = x²</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.35;0.5" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="256" y="50" text-anchor="start">y = (x − 2)²</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.65;0.95" dur="9s" repeatCount="indefinite" calcMode="discrete"/><text class="t-acc" x="256" y="50" text-anchor="start">y = (x − 2)² − 3</text></g><text class="t-s" x="256" y="90" text-anchor="start">вправо на 2,</text><text class="t-s" x="256" y="108" text-anchor="start">вниз на 3</text><text class="t-s" x="256" y="140" text-anchor="start">x₀ = −b/(2a)</text></svg>
