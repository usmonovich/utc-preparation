subsection: sl

symbols:
  rho_abs: { tex: '\rho', meaning: 'абсолютная влажность — масса водяного пара в 1 м³ воздуха', unit: 'г/м³', src: h01 }
  rho_sat: { tex: '\rho_0', meaning: 'максимальная влажность (плотность насыщенного пара) при данной температуре', unit: 'г/м³', src: h01 }
  phi_hum: { tex: '\varphi', meaning: 'относительная влажность', unit: '%', src: h01 }
  p_vap: { tex: 'p', meaning: 'парциальное давление водяного пара', unit: 'Па', src: h01 }
  p_sat: { tex: 'p_0', meaning: 'давление насыщенного водяного пара', unit: 'Па', src: h01 }
  m_vap: { tex: 'm', meaning: 'масса водяного пара', unit: 'г', src: h01 }
  V_air: { tex: 'V', meaning: 'объём воздуха', unit: 'м³', src: h01 }

topics:
  - id: sl-humidity
    title: Влажность воздуха
    pages: [h01]
    theory:
      - kind: definition
        title: Влажность воздуха
        body: Влажность воздуха — это содержание водяного пара в атмосфере Земли.
        src: h01
      - kind: definition
        title: Абсолютная влажность
        body: Абсолютная влажность — это физическая величина, которая показывает, сколько граммов воды содержится в 1 м³ воздуха.
        src: h01
      - kind: definition
        title: Максимальная влажность (плотность насыщенного пара)
        body: 'Максимальная влажность, или плотность насыщенного пара, — это наибольшая масса водяного пара, которая может содержаться в 1 м³ воздуха при данной температуре. $\rho_0$ [г/м³]. Плотность насыщенного пара постоянна для каждой температуры; её берут из специальных таблиц или она указана в условии задачи.'
        src: h01
      - kind: definition
        title: Относительная влажность
        body: Относительная влажность — это отношение абсолютной влажности к максимальной влажности.
        src: h01
      - kind: definition
        title: Точка росы
        fig: dew-point
        body: Точка росы — это температура, до которой должен охладиться воздух, чтобы водяной пар в нём достиг состояния насыщенного пара и начал конденсироваться в росу.
        src: h01
    formulas:
      - title: Абсолютная влажность
        tex: '\rho = \frac{m}{V}\quad[\text{г/м}^3]'
        sym: [rho_abs, m_vap, V_air]
        src: h01
      - title: Относительная влажность через плотности
        tex: '\varphi = \frac{\rho}{\rho_0}\cdot100\%'
        sym: [phi_hum, rho_abs, rho_sat]
        boxed: true
        src: h01
      - title: Относительная влажность через давления
        tex: '\varphi = \frac{p}{p_0}\cdot100\%'
        sym: [phi_hum, p_vap, p_sat]
        boxed: true
        src: h01
    questions:
      - type: numeric
        cat: problem
        q: В 2 м³ воздуха содержится 20 г водяного пара. Найдите абсолютную влажность.
        num: { value: 10, unit: 'г/м³', check: '20/2' }
        hint: Абсолютная влажность — сколько граммов воды в 1 м³ воздуха.
        explain: '$\rho = \frac mV$.'
        f: [1]
        sol: { given: ['m = 20 г', 'V = 2 м³'], find: 'ρ', formula: '\rho = \frac{m}{V}', calc: '\rho = \frac{20}{2} = 10', answer: '10 г/м³' }
        src: h01
      - type: numeric
        cat: problem
        q: 'Абсолютная влажность воздуха 10 г/м³, плотность насыщенного пара при этой температуре 17,3 г/м³. Найдите относительную влажность.'
        num: { value: 57.8, unit: '%', check: '10/17.3*100' }
        hint: Относительная влажность — отношение абсолютной влажности к максимальной.
        explain: '$\varphi = \frac{\rho}{\rho_0}\cdot100\%$. Значение $\rho_0$ дано в условии — в конспекте сказано, что его берут из таблиц или из условия.'
        f: [2]
        sol: { given: ['ρ = 10 г/м³', 'ρ₀ = 17,3 г/м³'], find: 'φ', formula: '\varphi = \frac{\rho}{\rho_0}\cdot100\%', calc: '\varphi = \frac{10}{17{,}3}\cdot100\% \approx 57{,}8\%', answer: '≈ 58 %' }
        src: h01
      - type: numeric
        cat: problem
        q: Парциальное давление водяного пара 1,2 кПа, давление насыщенного пара при этой температуре 2,4 кПа. Найдите относительную влажность.
        num: { value: 50, unit: '%', check: '1.2/2.4*100' }
        hint: Есть вторая формула относительной влажности — через давления.
        explain: '$\varphi = \frac{p}{p_0}\cdot100\%$.'
        f: [3]
        sol: { given: ['p = 1,2 кПа', 'p₀ = 2,4 кПа'], find: 'φ', formula: '\varphi = \frac{p}{p_0}\cdot100\%', calc: '\varphi = \frac{1{,}2}{2{,}4}\cdot100\% = 50\%', answer: '50 %' }
        src: h01
      - type: numeric
        cat: problem
        q: 'Относительная влажность 60 %, плотность насыщенного пара 23 г/м³. Найдите абсолютную влажность.'
        num: { value: 13.8, unit: 'г/м³', check: '0.6*23' }
        hint: 'Выразите $\rho$ из $\varphi = \frac{\rho}{\rho_0}\cdot100\%$.'
        explain: '$\rho = \frac{\varphi}{100\%}\rho_0$.'
        f: [2]
        sol: { given: ['φ = 60 %', 'ρ₀ = 23 г/м³'], find: 'ρ', formula: '\rho = \frac{\varphi}{100\%}\rho_0', calc: '\rho = 0{,}6\cdot23 = 13{,}8', answer: '13,8 г/м³' }
        src: h01
      - type: numeric
        cat: problem
        q: Абсолютная влажность в комнате объёмом 50 м³ равна 12 г/м³. Сколько граммов водяного пара в комнате?
        num: { value: 600, unit: 'г', check: '12*50' }
        hint: '$m = \rho V$.'
        explain: Масса пара из определения абсолютной влажности.
        f: [1]
        sol: { given: ['ρ = 12 г/м³', 'V = 50 м³'], find: 'm', formula: 'm = \rho V', calc: 'm = 12\cdot50 = 600', answer: '600 г' }
        src: h01
      - type: single
        cat: theory
        q: Что такое точка росы?
        opts:
          - Температура, до которой должен охладиться воздух, чтобы пар в нём стал насыщенным и начал конденсироваться
          - Температура, при которой вода кипит
          - Наибольшая масса пара в 1 м³ воздуха
          - Давление насыщенного водяного пара
        ans: a
        hint: В определении есть слова «охладиться» и «конденсироваться в росу».
        explain: Точка росы — температура, до которой должен охладиться воздух, чтобы водяной пар в нём достиг состояния насыщенного пара и начал конденсироваться в росу.
        src: h01
      - type: single
        cat: theory
        q: Воздух охладили до точки росы. Какой стала относительная влажность?
        opts: ['100 %', '0 %', '50 %', 'Не изменилась']
        ans: a
        hint: В точке росы пар становится насыщенным, то есть $\rho = \rho_0$.
        explain: 'По определению точки росы пар достигает насыщения: $\rho = \rho_0$, поэтому $\varphi = \frac{\rho}{\rho_0}\cdot100\% = 100\%$.'
        f: [2]
        src: h01
      - type: matching
        cat: theory
        q: Сопоставьте величину и её определение.
        pairs:
          - ['Абсолютная влажность', 'Сколько граммов воды содержится в 1 м³ воздуха']
          - ['Максимальная влажность', 'Наибольшая масса пара в 1 м³ воздуха при данной температуре']
          - ['Относительная влажность', 'Отношение абсолютной влажности к максимальной']
        hint: Все три определения записаны на одной странице одно за другим.
        explain: Определения со страницы «Влажность воздуха».
        src: h01
      - type: single
        cat: theory
        q: Откуда берут значение плотности насыщенного пара в задачах?
        opts: ['Из специальных таблиц или из условия задачи', 'Считают по формуле ρ = m/V', 'Она всегда равна 100 г/м³', 'Из относительной влажности']
        ans: a
        hint: Плотность насыщенного пара постоянна для каждой температуры.
        explain: Её берут из специальных таблиц или она указана в условии задачи.
        src: h01
