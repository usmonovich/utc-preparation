# ───────────────────────────────────────────────────────────────
  - id: transformer
    title: Трансформатор
    pages: [e26, e27]
    theory:
      - kind: definition
        title: Трансформатор
        body: Прибор, который, не меняя мощность переменного тока, меняет напряжение и силу тока, называется трансформатором. Трансформатор работает по принципу закона электромагнитной индукции.
        src: e26
      - kind: text
        title: Коэффициент трансформации
        body: 'Мощность $P = IU$ не меняется: $I_1U_1 = I_2U_2$, значит $\frac{I_1}{I_2} = \frac{U_2}{U_1}$. Коэффициент трансформации $k = \frac{N_1}{N_2} = \frac{U_1}{U_2} = \frac{I_2}{I_1}$.'
        src: e27
        fig: transformer
      - kind: list
        title: Понижающий и повышающий
        body: 'Понижающий: k > 1, $N_1 > N_2$, $U_1 > U_2$, $I_1 < I_2$. Повышающий: k < 1, $N_1 < N_2$, $U_1 < U_2$, $I_1 > I_2$.'
        src: e27
      - kind: text
        title: КПД трансформатора
        body: '$\eta = \frac{I_2U_2}{I_1U_1}\cdot100\%$. У идеального трансформатора η = 100 % и $I_1U_1 = I_2U_2$. На рисунке — автотрансформатор: одна обмотка, на входе ~10 В, с отвода — 5 В.'
        src: e27
    formulas:
      - title: Мощность сохраняется
        tex: 'P = IU,\qquad I_1U_1 = I_2U_2,\qquad \frac{I_1}{I_2} = \frac{U_2}{U_1}'
        sym: [P_pow, I12_tr, U12]
        src: e27
      - title: Коэффициент трансформации
        tex: 'k = \frac{N_1}{N_2} = \frac{U_1}{U_2} = \frac{I_2}{I_1}'
        sym: [k_tr, N12, U12, I12_tr]
        boxed: true
        src: e27
      - title: КПД трансформатора
        tex: '\eta = \frac{I_2U_2}{I_1U_1}\cdot100\%'
        sym: [eta, I12_tr, U12]
        boxed: true
        src: e27
    questions:
      - type: numeric
        cat: problem
        q: 'Первичная обмотка — 1000 витков, вторичная — 50, напряжение на первичной 220 В. Найдите напряжение на вторичной.'
        num: { value: 11, unit: 'В', check: '220*50/1000' }
        hint: '$\frac{N_1}{N_2} = \frac{U_1}{U_2}$.'
        explain: '$k = 20$, $U_2 = \frac{220}{20} = 11$ В.'
        f: [2]
        sol: { given: ['N₁ = 1000', 'N₂ = 50', 'U₁ = 220 В'], find: 'U₂', formula: 'U_2 = U_1\frac{N_2}{N_1}', calc: 'U_2 = 11', answer: '11 В' }
        src: e27
      - type: numeric
        cat: problem
        q: 'N₁ = 1000, N₂ = 50. Найдите коэффициент трансформации.'
        num: { value: 20, unit: '', check: '1000/50' }
        hint: '$k = \frac{N_1}{N_2}$.'
        explain: '$k = 20 > 1$ — трансформатор понижающий.'
        f: [2]
        sol: { given: ['N₁ = 1000', 'N₂ = 50'], find: 'k', formula: 'k = \frac{N_1}{N_2}', calc: 'k = 20', answer: '20' }
        src: e27
      - type: numeric
        cat: problem
        q: 'Идеальный трансформатор: U₁ = 220 В, I₁ = 0,5 А, U₂ = 11 В. Найдите ток во вторичной обмотке.'
        num: { value: 10, unit: 'А', check: '220*0.5/11' }
