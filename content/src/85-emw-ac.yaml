subsection: emw
# Колебательный контур, переменный ток, трансформатор, электромагнитные волны (стр. e20–e28).
# Этот файл стоит перед 89-emw.yaml: темы со стр. o01 (13.03.25) идут после тем со стр. e20–e28.

symbols:
  lambda_em: { tex: '\lambda', meaning: 'длина электромагнитной волны', unit: 'м', src: e28, web: true }
  omega_res: { tex: '\omega_0', meaning: 'резонансная циклическая частота цепи RLC', unit: 'рад/с', src: e26, web: true }
  I_res: { tex: 'I_{рез}', meaning: 'сила тока в цепи при резонансе', unit: 'А', src: e26, web: true }
  U_src_res: { tex: 'U', meaning: 'напряжение источника', unit: 'В', src: e26, web: true }
  q_t: { tex: 'q(t),\ q_0', meaning: 'заряд конденсатора в момент t и его наибольшее значение', unit: 'Кл', src: e20 }
