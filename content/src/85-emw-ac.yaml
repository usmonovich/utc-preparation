      - type: single
        cat: theory
        q: На каком законе основана работа трансформатора?
        opts: ['Закон электромагнитной индукции', 'Закон Ома', 'Закон Кулона', 'Закон сохранения импульса']
        ans: a
        hint: Последнее предложение на стр. e26.
