        ans: a
        hint: Ключевые слова — «внешняя сила».
        explain: Колебания под воздействием внешней силы называются вынужденными.
        src: e26
      - type: single
        cat: theory
        q: Когда возникает резонанс?
        opts: ['Частота вынуждающей силы близка к собственной частоте системы', 'Внешняя сила очень большая', 'Сопротивление цепи равно нулю', 'Частота внешней силы равна нулю']
        ans: a
        hint: Сравниваются две частоты.
        explain: Резонанс — когда частота вынуждающей силы принимает значение, близкое к собственной частоте системы.
        src: e26
      - type: numeric
        cat: problem
        q: 'Контур: L = 0,1 Гн, C = 10 мкФ. При какой частоте внешнего переменного напряжения возникнет резонанс?'
        num: { value: 159.15, unit: 'Гц', check: '1/(2*Math.PI*Math.sqrt(0.1*1e-5))' }
        hint: 'Резонанс — при частоте, близкой к собственной; собственная частота контура $\nu = \frac1{2\pi\sqrt{LC}}$ (стр. e20).'
        explain: '$\sqrt{LC} = 10^{-3}$, $\nu = \frac{1}{2\pi\cdot10^{-3}} \approx 159$ Гц.'
        f: [em-lc-f6]
        sol: { given: ['L = 0,1 Гн', 'C = 10⁻⁵ Ф'], find: 'ν', formula: '\nu = \frac{1}{2\pi\sqrt{LC}}', calc: '\nu = \frac{1}{2\pi\cdot10^{-3}} \approx 159', answer: '≈ 159 Гц' }
        src: [e20, e26]
      - type: text
