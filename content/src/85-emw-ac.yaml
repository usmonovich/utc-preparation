# ───────────────────────────────────────────────────────────────
  - id: ac-resonance
    title: Вынужденные колебания. Резонанс
    pages: [e26]
    theory:
      - kind: definition
        title: Вынужденные колебания
        body: Если колебания возникают и совершаются под воздействием внешней силы, такие колебания называются вынужденными.
        src: e26
      - kind: definition
        title: Резонанс
        body: Когда частота вынуждающей силы принимает близкое значение к собственной частоте системы, в системе возникает резонанс. В резонансе амплитуда системы резко меняется.
        src: e26
        errata: [EM11]
      - kind: note
        title: Что не записано
        body: Под темой нарисована цепь R–C–L с источником переменного тока; условие резонанса для этой цепи в конспекте не записано.
        src: e26
      - kind: law
        title: Резонанс напряжений в цепи RLC
        body: |
          Условие резонанса для последовательной цепи R–C–L в конспекте не записано. По учебным материалам:
          - Резонанс наступает, когда индуктивное сопротивление равно ёмкостному: $X_L = X_C$, то есть $\omega_0L = \frac{1}{\omega_0C}$. Отсюда резонансная частота $\omega_0 = \frac{1}{\sqrt{LC}}$ — та же, что собственная частота контура (стр. e20).
          - Полное сопротивление при этом наименьшее и равно активному: $Z = R$, а сила тока наибольшая: $I = \frac UR$. Ток и напряжение совпадают по фазе.
          - Напряжения на катушке и конденсаторе равны между собой и при малом R могут во много раз превысить напряжение источника — поэтому этот резонанс называют резонансом напряжений.
        src: e26
        fig: rlc-resonance
        web:
          - { title: 'Википедия: Резонанс напряжений', url: 'https://ru.wikipedia.org/wiki/Резонанс_напряжений' }
