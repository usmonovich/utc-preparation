  X_C: { tex: 'X_C', meaning: 'ёмкостное сопротивление', unit: 'Ом', src: e23 }
  X_L: { tex: 'X_L', meaning: 'индуктивное сопротивление', unit: 'Ом', src: e23 }
  Z_imp: { tex: 'Z', meaning: 'полное сопротивление цепи', unit: 'Ом', src: e25 }
  dphi_ac: { tex: '\Delta\varphi', meaning: 'разность фаз между током и напряжением', unit: 'рад', src: e25 }
  U_RCL: { tex: 'U_R,\ U_C,\ U_L', meaning: 'напряжения на резисторе, конденсаторе и катушке', unit: 'В', src: e25 }
  N12: { tex: 'N_1,\ N_2', meaning: 'числа витков первичной и вторичной обмоток', unit: '', src: e27 }
  U12: { tex: 'U_1,\ U_2', meaning: 'напряжения на первичной и вторичной обмотках', unit: 'В', src: e27 }
  I12_tr: { tex: 'I_1,\ I_2', meaning: 'токи в первичной и вторичной обмотках', unit: 'А', src: e27 }
  k_tr: { tex: 'k', meaning: 'коэффициент трансформации', unit: '', src: e27 }
  P_pow: { tex: 'P', meaning: 'мощность', unit: 'Вт', src: e27 }

errata:
  - id: EM15
    page: e22
    severity: unclear
    original: '«R ~ ν» рядом с графиком R(ν) — горизонтальной прямой'
    issue: 'Знак «~» обычно означает «пропорционально», а график показывает, что R от частоты не зависит. Вероятно, имелось в виду «R не ~ ν».'
    target: 'Подпись «R ~ ν» у графика R(ν)'
    suggestion: 'Записать «R не зависит от ν» — как показывает график (горизонтальная прямая).'
  - id: EM10
    page: e25
    severity: error
    original: '\(Z = (X_L - X_C)^2 + R^2\)'
    issue: 'Потерян корень. По диаграмме сопротивлений и по формуле \(U = \sqrt{(U_C - U_L)^2 + U_R^2}\) с той же страницы (при \(U = IZ\), \(U_R = IR\), \(U_C = IX_C\), \(U_L = IX_L\)) получается корень. Без корня и единицы не сходятся: Ом² вместо Ом.'
    target: 'Полное сопротивление цепи RLC'
    suggestion: '\(Z = \sqrt{(X_L - X_C)^2 + R^2}\).'
  - id: EM11
    page: e26
    severity: note
    original: '«В резонансе амплитуда системы резко меняется»'
    issue: При резонансе амплитуда резко возрастает. Слово «меняется» не говорит, в какую сторону.
    target: 'Определение резонанса'
    suggestion: 'Записать: «В резонансе амплитуда колебаний резко возрастает».'
    todo: 'Условие резонанса для цепи RLC по вашей просьбе добавлено из интернета (Википедия: «Резонанс напряжений») в эту же тему с пометкой «из интернета». Утвердите его или отклоните.'
  - id: EM12
    page: e28
    severity: error
    original: '«Когда заряженная частица покоится или двигается криволинейно и равномерно, то не распространяет электромагнитную волну»'
    issue: 'Противоречит примеру со стр. e27: частица, которая «вращается по окружности», излучает. Движение по окружности — криволинейное и равномерное, но с ускорением.'
    target: 'Условие, при котором заряженная частица не излучает волну'
    suggestion: '«…покоится или двигается прямолинейно и равномерно…».'
  - id: EM13
    page: e28
    severity: typo
    original: '«…за счёт комбинаций электромагнитного и магнитного поля. За счёт изменения электромагнитного поля возникает магнитное поле…»'
    issue: По смыслу (дальше — «за счёт магнитного поля возникает электрическое») речь об электрическом поле.
    target: 'Описание того, как образуется электромагнитная волна'
    suggestion: '«…комбинации электрического и магнитного поля. За счёт изменения электрического поля возникает магнитное…».'
  - id: EM14
    page: e28
    severity: note
    original: '«Основная особенность электромагнитной волны» — конец записи'
    issue: Фраза не закончена, шкала электромагнитных волн не записана.
    target: 'Незаконченная фраза в конце страницы об электромагнитных волнах'
    suggestion: 'Дописать фразу по лекции. Сам я ничего не дописывал.'
    todo: 'По вашей просьбе шкала электромагнитных волн добавлена из интернета в тему «Электромагнитные волны» с пометкой «из интернета». Утвердите её или отклоните.'

topics:
  - id: em-lc
    title: Колебательный контур. Свободные колебания
    pages: [e20, e21]
    theory:
      - kind: definition
        title: Колебательный контур
        body: Для того чтобы получить колебательный контур, как минимум нужен один конденсатор и одна индуктивная катушка. В колебательном контуре возникают свободные электромагнитные колебания.
        src: e20
      - kind: text
        title: Заряд, напряжение и ток
        body: 'Конденсатор заряжают от источника (ключ в положении 1) и замыкают на катушку (положение 2): $q(t) = q_0\cos(\omega t)$, $U(t) = U_0\cos(\omega t)$, $I(t) = -I_0\sin(\omega t)$; $q_0 = CU_0$, $I_0 = q_0\omega$.'
        src: e20
        fig: lc
      - kind: definition
        title: Идеальный колебательный контур
        body: Если в колебательном контуре отсутствует R — активное сопротивление, то полная электромагнитная энергия контура сохраняется. Такой контур называется идеальным колебательным контуром.
        src: e20
      - kind: rule
        title: Энергия в контуре
        body: 'В идеальном контуре энергия электрического поля конденсатора и энергия магнитного поля катушки меняются гармоническим образом, но частота их колебания в два раза больше, чем частота колебания самой системы. $W = W_{C0} = W_{L0} = \text{const}$.'
        src: [e20, e21]
    formulas:
      - title: Заряд конденсатора
        tex: 'q(t) = q_0\cos(\omega t)'
        sym: [q_t, omega_per]
        src: e20
      - title: Напряжение на конденсаторе
        tex: 'U(t) = U_0\cos(\omega t)'
        sym: [U_inst, U0_amp, omega_per]
        src: e20
      - title: Ток в контуре
        tex: 'I(t) = -I_0\sin(\omega t)'
        sym: [I_t, I0_amp, omega_per]
        src: e20
      - title: Амплитуда тока
        tex: 'I_0 = q_0\omega'
        sym: [I0_amp, q_t, omega_per]
        boxed: true
        src: e20
      - title: Наибольший заряд
        tex: 'q_0 = CU_0'
        sym: [q_t, C_cap, U0_amp]
        src: e20
      - title: Частота, период, циклическая частота контура
        tex: '\nu = \frac{1}{2\pi}\cdot\frac{1}{\sqrt{LC}},\qquad T = 2\pi\sqrt{LC},\qquad \omega = \frac{1}{\sqrt{LC}}'
        sym: [nu_osc, T_osc, omega_osc, L_ind, C_cap]
        boxed: true
        src: e20
      - title: Наибольшие энергии
        tex: 'W_{C0} = \frac{q_0^2}{2C},\qquad W_{L0} = \frac{LI_0^2}{2},\qquad W = W_{C0} = W_{L0} = \text{const}'
        sym: [W_C, W_L, W_lc, q_t, C_cap, L_ind, I0_amp]
        src: e20
      - title: Энергия конденсатора во времени
        tex: 'W_C(t) = \frac{q_0^2}{2C}\cos^2\omega t = W_{C0}\cos^2\omega t = \frac12W_{C0}(1 + \cos2\omega t)'
        sym: [W_C, q_t, C_cap, omega_per]
        src: e21
      - title: Энергия катушки во времени
        tex: 'W_L(t) = \frac{LI_0^2}{2}\sin^2\omega t = W_{L0}\sin^2\omega t = \frac12W_{L0}(1 - \cos2\omega t)'
        sym: [W_L, L_ind, I0_amp, omega_per]
        src: e21
    questions:
      - type: numeric
        cat: problem
        q: Конденсатор ёмкостью 2 мкФ заряжен до 10 В. Найдите наибольший заряд.
        num: { value: 2.0e-5, unit: 'Кл', check: '2e-6*10' }
        hint: '$q_0 = CU_0$; 1 мкФ = 10⁻⁶ Ф.'
        explain: '$q_0 = 2\cdot10^{-6}\cdot10 = 2\cdot10^{-5}$ Кл.'
        f: [5]
        sol: { given: ['C = 2 мкФ', 'U₀ = 10 В'], si: ['C = 2·10⁻⁶ Ф'], find: 'q₀', formula: 'q_0 = CU_0', calc: 'q_0 = 2\cdot10^{-5}', answer: '2·10⁻⁵ Кл' }
        src: e20
      - type: numeric
        cat: problem
        q: 'Наибольший заряд $10^{-4}$ Кл, циклическая частота 1000 рад/с. Найдите амплитуду тока.'
        num: { value: 0.1, unit: 'А', check: '1e-4*1000' }
        hint: '$I_0 = q_0\omega$.'
        explain: '$I_0 = 10^{-4}\cdot10^3 = 0{,}1$ А.'
        f: [4]
        sol: { given: ['q₀ = 10⁻⁴ Кл', 'ω = 1000 рад/с'], find: 'I₀', formula: 'I_0 = q_0\omega', calc: 'I_0 = 0{,}1', answer: '0,1 А' }
        src: e20
      - type: numeric
        cat: problem
        q: 'q₀ = $2\cdot10^{-4}$ Кл, C = 1 мкФ. Найдите наибольшую энергию конденсатора.'
        num: { value: 0.02, unit: 'Дж', check: '(2e-4)**2/(2*1e-6)' }
        hint: '$W_{C0} = \frac{q_0^2}{2C}$.'
        explain: '$W_{C0} = \frac{4\cdot10^{-8}}{2\cdot10^{-6}} = 0{,}02$ Дж.'
        f: [7]
        sol: { given: ['q₀ = 2·10⁻⁴ Кл', 'C = 10⁻⁶ Ф'], find: 'W_C0', formula: 'W_{C0} = \frac{q_0^2}{2C}', calc: 'W_{C0} = 0{,}02', answer: '0,02 Дж' }
        src: e20
      - type: numeric
        cat: problem
        q: 'L = 0,05 Гн, I₀ = 0,2 А. Найдите наибольшую энергию катушки.'
        num: { value: 0.001, unit: 'Дж', check: '0.05*0.2**2/2' }
        hint: '$W_{L0} = \frac{LI_0^2}{2}$.'
        explain: '$W_{L0} = \frac{0{,}05\cdot0{,}04}{2} = 10^{-3}$ Дж.'
        f: [7]
        sol: { given: ['L = 0,05 Гн', 'I₀ = 0,2 А'], find: 'W_L0', formula: 'W_{L0} = \frac{LI_0^2}{2}', calc: 'W_{L0} = 10^{-3}', answer: '10⁻³ Дж' }
        src: e20
      - type: numeric
        cat: problem
        q: 'В идеальном контуре C = 1 мкФ, U₀ = 100 В, L = 0,1 Гн. Найдите амплитуду тока.'
        num: { value: 0.31623, unit: 'А', check: 'Math.sqrt(2*((1e-6*100)**2/(2*1e-6))/0.1)' }
        hint: 'Энергия сохраняется: $W_{C0} = W_{L0}$, то есть $\frac{q_0^2}{2C} = \frac{LI_0^2}{2}$.'
        explain: '$q_0 = 10^{-4}$ Кл, $W = \frac{10^{-8}}{2\cdot10^{-6}} = 5\cdot10^{-3}$ Дж; $I_0 = \sqrt{\frac{2W}{L}} = \sqrt{0{,}1} \approx 0{,}32$ А.'
        f: [5, 7]
        sol: { given: ['C = 10⁻⁶ Ф', 'U₀ = 100 В', 'L = 0,1 Гн'], find: 'I₀', formula: '\frac{q_0^2}{2C} = \frac{LI_0^2}{2}', calc: 'q_0 = 10^{-4};\ W = 5\cdot10^{-3};\ I_0 = \sqrt{\frac{2W}{L}} \approx 0{,}32', answer: '≈ 0,32 А' }
        src: e20
      - type: numeric
        cat: problem
        q: Период колебаний в контуре 4 мс. С каким периодом меняется энергия конденсатора (в мс)?
        num: { value: 2, unit: 'мс', check: '4/2' }
        hint: Частота колебаний энергии в два раза больше частоты системы.
        explain: 'Период энергии вдвое меньше: 2 мс.'
        f: [8]
        sol: { given: ['T = 4 мс'], find: 'T_W', calc: 'T_W = \frac{T}{2} = 2', answer: '2 мс' }
        src: e20
      - type: numeric
        cat: problem
        q: '$W_{C0} = 8$ мДж. Найдите энергию конденсатора при $\omega t = \frac\pi4$ (в мДж).'
        num: { value: 4, unit: 'мДж', check: '8*Math.cos(Math.PI/4)**2' }
        hint: '$W_C = W_{C0}\cos^2\omega t$, $\cos^2\frac\pi4 = \frac12$.'
        explain: '$W_C = 8\cdot\frac12 = 4$ мДж — в этот момент энергия поровну у конденсатора и катушки.'
        f: [8]
        sol: { given: ['W_C0 = 8 мДж', 'ωt = π/4'], find: 'W_C', formula: 'W_C = W_{C0}\cos^2\omega t', calc: 'W_C = 8\cdot\tfrac12 = 4', answer: '4 мДж' }
        src: e21
      - type: multiple
        cat: theory
        q: Что, по конспекту, как минимум нужно для колебательного контура? Выберите все.
        opts: ['Один конденсатор', 'Одна индуктивная катушка', 'Резистор', 'Трансформатор']
        ans: [a, b]
        hint: Первая фраза темы.
        explain: Как минимум нужен один конденсатор и одна индуктивная катушка.
        src: e20
      - type: single
        cat: theory
        q: Какой колебательный контур называется идеальным?
        opts: ['Без активного сопротивления R — энергия сохраняется', 'С очень большой ёмкостью', 'С источником тока', 'С резистором']
        ans: a
        hint: В нём полная электромагнитная энергия сохраняется.
        explain: Если в контуре отсутствует R — активное сопротивление, контур идеальный.
        src: e20

# ───────────────────────────────────────────────────────────────
  - id: ac-basics
    title: Переменный ток. Действующие значения
    pages: [e21, e22, e23]
    theory:
      - kind: definition
        title: Переменный ток
        body: Ток, у которого значение и направление меняются гармоническим образом, называется переменным.
        src: e21
      - kind: text
        title: Источник переменного тока
        body: 'Источником переменного тока является контур из проводника, который вращается в магнитном поле. Поток через рамку $\Phi = BS\cos(\omega t)$, ЭДС $\varepsilon_и = NBS\omega\sin(\omega t) = \varepsilon_0\sin(\omega t)$, где $\varepsilon_0 = NBS\omega$. Напряжение $U(t) = U_0\sin(\omega t)$.'
        src: [e21, e22]
        fig: generator
      - kind: text
        title: ① Резистор в цепи переменного тока
        body: '$U(t) = U_0\sin(\omega t)$, $I(t) = \frac{U_0}{R}\sin(\omega t) = I_0\sin(\omega t)$, $I_0 = \frac{U_0}{R}$. $R = \rho\frac lS$; по графику R от частоты не зависит.'
        src: e22
        errata: [EM15]
      - kind: definition
        title: Моментальное, максимальное и эффективное значения
        body: '$U(t)$ — моментальное напряжение, $U_0$ — максимальное, $U_{эф}$ — эффективное: значение при фазе π/4, действующее значение, показание вольтметра. $U_{эф} = U_0\sin\frac\pi4 = \frac{U_0}{\sqrt2}$. Для тока так же: $I_{эф} = \frac{I_0}{\sqrt2}$ — показание амперметра.'
        src: e22
      - kind: rule
        title: Сеть, которой мы пользуемся
        body: '$U_{эф} = 220$ В, $U_0 \approx 310$ В, ν = 50 Гц.'
        src: e23
      - kind: text
        title: Мощность
        body: '$P(t) = IU = I_0U_0\sin^2(\omega t)$ — моментальная мощность. Средняя: $\bar P = \frac{I_0U_0}{2} = \frac{I_0^2R}{2} = \frac{U_0^2}{2R} = I_{эф}U_{эф} = I_{эф}^2R = \frac{U_{эф}^2}{R}$.'
        src: e23
    formulas:
      - title: Поток через вращающуюся рамку
        tex: '\Phi = BS\cos(\omega t)'
        sym: [Phi_m, B_mag, S_area, omega_per]
        src: e22
      - title: ЭДС генератора
        tex: '\varepsilon_{и} = NBS\omega\sin(\omega t),\qquad \varepsilon_0 = NBS\omega'
        sym: [eps_i, N_frame, B_mag, S_area, omega_per, eps0]
        src: e22
      - title: Мгновенная ЭДС и напряжение
        tex: '\varepsilon_{и}(t) = \varepsilon_0\sin(\omega t),\qquad U(t) = U_0\sin(\omega t)'
        sym: [eps_i, eps0, U_inst, U0_amp, omega_per]
        src: e22
      - title: Ток через резистор
        tex: 'I(t) = \frac{U_0}{R}\sin(\omega t) = I_0\sin(\omega t),\qquad I_0 = \frac{U_0}{R}'
        sym: [I_t, U0_amp, R_res, I0_amp, omega_per]
        src: e22
      - title: Сопротивление проводника
        tex: 'R = \rho\frac{l}{S}'
        sym: [R_res, rho_r, l_wire, S_area]
        src: e22
      - title: Эффективное напряжение
        tex: 'U_{эф} = U_0\sin\frac{\pi}{4} = \frac{U_0}{\sqrt{2}}'
        sym: [U_eff, U0_amp]
        boxed: true
        src: e22
      - title: Эффективный ток
        tex: 'I_{эф} = I_0\sin\frac{\pi}{4} = \frac{I_0}{\sqrt{2}}'
        sym: [I_eff, I0_amp]
        boxed: true
        src: e22
      - title: Моментальная мощность
        tex: 'P(t) = I\cdot U = I_0U_0\sin^2(\omega t)'
        sym: [P_t, I_cur, U_volt, I0_amp, U0_amp, omega_per]
        src: e23
      - title: Средняя мощность через амплитуды
        tex: '\bar P = \frac{I_0U_0}{2} = \frac{I_0^2R}{2} = \frac{U_0^2}{2R}'
        sym: [P_avg, I0_amp, U0_amp, R_res]
