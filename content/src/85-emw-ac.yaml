# ───────────────────────────────────────────────────────────────
  - id: ac-rlc
    title: Последовательная цепь RLC. Полное сопротивление
    pages: [e25, e26]
    theory:
      - kind: rule
        title: Ток в последовательной цепи
        body: 'Резистор, конденсатор и катушка соединены последовательно: ток через них одинаков, $I = I_R = I_C = I_L$.'
        src: e25
      - kind: text
        title: Векторная диаграмма напряжений
        body: '$U_R$ направлено вверх, $U_C$ и $U_L$ — в противоположные стороны по горизонтали. Полное напряжение $U = \sqrt{(U_C - U_L)^2 + U_R^2}$, Δφ — разность фаз между током и напряжением.'
        src: e25
      - kind: text
        title: Полное сопротивление
        body: '$U_R = I_RR$, $U_C = I_CX_C$, $U_L = I_LX_L$, $U = IZ$, где Z — полное сопротивление. В конспекте записано $Z = (X_L - X_C)^2 + R^2$ — см. замечание EM10. $\operatorname{tg}\Delta\varphi = \frac{|X_L - X_C|}{R}$, $\cos\Delta\varphi = \frac RZ$ — коэффициент мощности.'
        src: e25
        errata: [EM10]
      - kind: text
        title: Мощность в цепи RLC
        body: '$\bar P = \frac{I_0U_0}{2}\cos\Delta\varphi$; $U_0 = I_0Z$, $U_{эф} = I_{эф}Z$; $\bar P = \frac{I_0^2R}{2} = \frac{U_0^2}{2Z^2}R$.'
        src: e25
      - kind: definition
        title: Реактивные сопротивления
        body: Ёмкостное и индуктивное сопротивления называются реактивными, потому что в них не выделяется теплота, то есть закон Джоуля–Ленца не работает.
        src: e26
    formulas:
      - title: Ток в последовательной цепи
        tex: 'I = I_R = I_C = I_L'
        sym: [I_cur]
        src: e25
      - title: Полное напряжение
        tex: 'U = \sqrt{(U_C - U_L)^2 + U_R^2}'
        sym: [U_volt, U_RCL]
        boxed: true
        src: e25
      - title: Напряжения на элементах
        tex: 'U_R = I_R\cdot R,\qquad U_C = I_C\cdot X_C,\qquad U_L = I_L\cdot X_L'
        sym: [U_RCL, I_cur, R_res, X_C, X_L]
        src: e25
      - title: Закон Ома для цепи RLC
        tex: 'U = IZ'
        sym: [U_volt, I_cur, Z_imp]
        src: e25
      - title: Полное сопротивление (как в конспекте)
        tex: 'Z = (X_L - X_C)^2 + R^2'
        sym: [Z_imp, X_L, X_C, R_res]
        src: e25
        errata: [EM10]
      - title: Тангенс разности фаз
        tex: '\operatorname{tg}\Delta\varphi = \frac{|X_L - X_C|}{R},\qquad \Delta\varphi = \operatorname{arctg}\frac{|X_L - X_C|}{R}'
        sym: [dphi_ac, X_L, X_C, R_res]
        src: e25
      - title: Коэффициент мощности
        tex: '\cos\Delta\varphi = \frac{R}{Z}'
        sym: [dphi_ac, R_res, Z_imp]
        boxed: true
        src: e25
      - title: Средняя мощность в цепи RLC
        tex: '\bar P = \frac{I_0U_0}{2}\cdot\cos\Delta\varphi'
        sym: [P_avg, I0_amp, U0_amp, dphi_ac]
        boxed: true
        src: e25
      - title: Амплитуды и действующие значения
        tex: 'U_0 = I_0Z,\qquad U_{эф} = I_{эф}\cdot Z'
        sym: [U0_amp, I0_amp, U_eff, I_eff, Z_imp]
        src: e25
      - title: Средняя мощность через R
        tex: '\bar P = \frac{I_0^2R}{2} = \frac{U_0^2}{2Z^2}\cdot R'
        sym: [P_avg, I0_amp, R_res, U0_amp, Z_imp]
        boxed: true
        src: e25
    questions:
      - type: numeric
        cat: problem
        q: 'В последовательной цепи $U_R = 30$ В, $U_C = 70$ В, $U_L = 30$ В. Найдите полное напряжение.'
        num: { value: 50, unit: 'В', check: 'Math.sqrt((70-30)**2+30**2)' }
        hint: '$U = \sqrt{(U_C - U_L)^2 + U_R^2}$ — напряжения нельзя просто сложить.'
        explain: '$\sqrt{40^2 + 30^2} = 50$ В, хотя $30 + 70 + 30 = 130$.'
        f: [2]
        sol: { given: ['U_R = 30 В', 'U_C = 70 В', 'U_L = 30 В'], find: 'U', formula: 'U = \sqrt{(U_C - U_L)^2 + U_R^2}', calc: 'U = \sqrt{1600 + 900} = 50', answer: '50 В' }
        src: e25
      - type: numeric
        cat: problem
        q: Напряжение на цепи RLC 100 В, ток 2 А. Найдите полное сопротивление.
        num: { value: 50, unit: 'Ом', check: '100/2' }
        hint: '$U = IZ$.'
        explain: '$Z = \frac{100}{2} = 50$ Ом.'
        f: [4]
        sol: { given: ['U = 100 В', 'I = 2 А'], find: 'Z', formula: 'Z = \frac{U}{I}', calc: 'Z = 50', answer: '50 Ом' }
        src: e25
      - type: numeric
        cat: problem
