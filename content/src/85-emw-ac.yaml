  W_L: { tex: 'W_L,\ W_{L0}', meaning: 'энергия магнитного поля катушки и её наибольшее значение', unit: 'Дж', src: e20 }
  W_lc: { tex: 'W', meaning: 'полная электромагнитная энергия контура', unit: 'Дж', src: e20 }
  N_frame: { tex: 'N', meaning: 'в конспекте не расшифровано; по смыслу — число витков рамки', unit: '', src: null }
