        src: e24
      - title: Ток через катушку отстаёт от напряжения
        tex: 'I(t) = I_0\sin(\omega t) = I_0\cos\left(\omega t - \frac{\pi}{2}\right)'
        sym: [I_t, I0_amp, omega_per]
        src: e24
