# ───────────────────────────────────────────────────────────────
  - id: ac-cl
    title: Конденсатор и катушка в цепи переменного тока
    pages: [e23, e24]
    theory:
      - kind: text
        title: ② Конденсатор
        body: '$U(t) = U_0\cos(\omega t)$, $I(t) = -I_0\sin(\omega t)$, $I_0 = U_0\omega C = U_0\cdot2\pi\nu C$. Из $I_0 = \frac{U_0}{X_C}$: ёмкостное сопротивление $X_C = \frac1{\omega C} = \frac1{2\pi\nu C}$ — убывает с ростом частоты.'
        src: e23
      - kind: rule
        title: Конденсатор и постоянный ток
        body: 'При ν = 0 (постоянный ток) $X_C \to \infty$, поэтому $I_C = 0$. Моментальная мощность $P(t) = -\frac12I_0U_0\sin(2\omega t)$, средняя $\bar P = 0$.'
        src: e23
      - kind: text
        title: ③ Индуктивная катушка
        body: '$U(t) = U_0\cos(\omega t)$, $I(t) = I_0\sin(\omega t)$, $I_0 = \frac{U_0}{\omega L} = \frac{U_0}{2\pi\nu L}$. Из $I_0 = \frac{U_0}{X_L}$: индуктивное сопротивление $X_L = \omega L = 2\pi\nu L$ — растёт прямо пропорционально.'
        src: e23
      - kind: rule
        title: Катушка и постоянный ток
        body: 'При ν = 0 $X_L \to 0$, поэтому $I_L \ne 0$. $P(t) = \frac12I_0U_0\sin(2\omega t)$, $\bar P = 0$.'
        src: e24
      - kind: rule
        title: Сдвиг фаз между током и напряжением
        body: 'Резистор: $\Delta\varphi = 0$ — ток и напряжение в фазе. Конденсатор: $I = I_0\cos\left(\frac\pi2 + \omega t\right)$, $\Delta\varphi = \frac\pi2$ — ток впереди. Катушка: $I = I_0\cos\left(\omega t - \frac\pi2\right)$, $\Delta\varphi = \frac\pi2$ — ток позади.'
        src: e24
        fig: ac-phase
    formulas:
      - title: Амплитуда тока через конденсатор
        tex: 'I_0 = U_0\omega C = U_0\cdot2\pi\nu C'
