# ───────────────────────────────────────────────────────────────
  - id: em-waves
    title: Электромагнитные волны
    pages: [e27, e28]
    theory:
      - kind: rule
        title: Кто излучает электромагнитную волну
        body: 'Заряженная частица, которая двигается с ускорением, распространяет электромагнитную волну. Примеры: частица двигается равноускоренно или равнозамедленно по прямой, вращается по окружности, гармонически колеблется.'
        src: e27
      - kind: rule
        title: Кто не излучает
        body: 'По конспекту не распространяет электромагнитную волну частица, которая покоится или «двигается криволинейно и равномерно» — см. замечание EM12.'
        src: e28
        errata: [EM12]
      - kind: text
        title: Как возникает и распространяется волна
        body: Электромагнитная волна возникает и распространяется по пространству за счёт комбинации электрического и магнитного поля. За счёт изменения электрического поля возникает магнитное поле, за счёт магнитного поля возникает электрическое.
        src: e28
        errata: [EM13]
        fig: em-wave
      - kind: rule
        title: Направление распространения
        body: 'Направление распространения находим через правило буравчика: если повернуть буравчик от $\vec E$ к $\vec B$, наконечник буравчика покажет направление распространения электромагнитной волны.'
        src: e28
      - kind: note
        title: Шкала электромагнитных волн
        body: В зависимости от частоты электромагнитные волны можно разделить на несколько частей — так получается шкала электромагнитных волн. Дальше запись не закончена.
        src: e28
