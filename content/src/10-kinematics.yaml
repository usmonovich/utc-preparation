subsection: kin
topics:

# ───────────────────────────────────────────────────────────────
  - id: kin-basics
    title: Основные понятия кинематики
    pages: [p01, p02L]
    theory:
      - kind: definition
        title: Физика
        body: Физика — это предмет, который изучает процессы и явления, которые происходят в природе.
        src: p01
      - kind: list
        title: Разделы физики (схема из конспекта)
        body: |
          - Механика
          - Молекулярная физика и термодинамика
          - Электромагнетизм
          - Оптика
          - Атомная и ядерная физика
        src: p01
      - kind: definition
        title: Механика
        body: |
          Механика — это раздел физики, изучающий процессы движения. В механике мы изучаем:
          - виды движения → **кинематика**;
          - причину движения → **динамика**;
          - равновесие движения → **статика**.
        src: p01
      - kind: definition
        title: Материальная точка
        body: Материальная точка — объект, чей размер очень мал относительно пространства, в котором он расположен.
        src: p01
      - kind: definition
        title: Механическое движение
        body: Механическое движение — изменение положения одного тела относительно другого.
        src: p01
      - kind: definition
        title: Система отсчёта
        body: С помощью системы отсчёта мы оцениваем движение. Система отсчёта состоит из **тела отсчёта**, **координатной системы** и **прибора для отсчёта времени**.
        src: p01
      - kind: definition
        title: Траектория
        body: Траектория — след, который остаётся после движения тела в пространстве.
        src: p01
      - kind: definition
        title: Путь и перемещение
        fig: path-disp
        body: |
          Длина траектории — это **путь**, пройденный телом: $L$ [м; дм; см; мм].
          Прямая, которая соединяет начальное положение с конечным, называется **перемещением**: $S$ [м; дм; см; мм].
          Перемещение — это кратчайшее расстояние между двумя точками.
        src: p02L
      - kind: definition
        title: Скорость
        body: Скорость — путь, пройденный за единицу времени. Скорость $\upsilon$ [м/с; км/ч …], время $t$ [с; мин; ч …].
        src: p02L
      - kind: text
        title: Полезные значения
        body: |
          1 сутки = 24 ч = 1440 мин = 86 400 с.
          Скорость света ≈ 300 000 км/с = $3\cdot10^5$ км/с.
        src: p02L
    formulas:
      - title: Путь не меньше модуля перемещения
        tex: 'L \ge |\vec S|'
        sym: [L_path, S]
        src: p02L
      - title: Путь равен модулю перемещения
        tex: 'L = |\vec S|'
        sym: [L_path, S]
        cond: при прямолинейном движении
        src: p02L
      - title: Возвращение к исходной точке
        tex: 'L \ne 0,\quad \vec S = 0'
        sym: [L_path, S]
        cond: тело вернулось в исходную точку
        src: p02L
      - title: Покой
        tex: 'L = \vec S = 0'
        sym: [L_path, S]
        cond: покой
        src: p02L
      - title: Скорость
        tex: '\upsilon = \frac{S}{t}'
        sym: [v, S, t]
        src: p02L
      - title: Время
        tex: 't = \frac{S}{\upsilon}'
        sym: [t, S, v]
        src: p02L
    questions:
      - type: single
        cat: theory
        q: Что такое материальная точка (по определению из конспекта)?
        opts:
          - Объект, чей размер очень мал относительно пространства, в котором он расположен
          - Объект с очень маленькой массой
          - Точка, относительно которой рассматривают движение
          - Тело, которое не движется
        ans: a
        hint: В определении речь идёт о **размере** тела — по сравнению с чем?
        explain: Материальная точка — объект, чей размер очень мал относительно пространства, в котором он расположен. Масса в определении не участвует.
        src: p01
      - type: multiple
        cat: theory
        q: Из чего состоит система отсчёта? Выберите все верные варианты.
        opts:
          - Тело отсчёта
          - Координатная система
          - Прибор для отсчёта времени
          - Траектория движения
          - Материальная точка
        ans: [a, b, c]
        hint: Чтобы оценить движение, нужно знать — относительно чего, где именно и когда. Каждому вопросу соответствует одна часть системы отсчёта.
        explain: Система отсчёта состоит из тела отсчёта, координатной системы и прибора для отсчёта времени. Траектория — результат движения, а не часть системы отсчёта.
        src: p01
      - type: matching
        cat: theory
        q: Сопоставьте раздел механики и то, что он изучает.
        pairs:
          - ['Кинематика', 'Виды движения']
          - ['Динамика', 'Причину движения']
          - ['Статика', 'Равновесие движения']
        hint: Раздел, изучающий **причину** движения, — тот, где появляются силы.
        explain: 'По схеме из конспекта: виды движения → кинематика; причина движения → динамика; равновесие → статика.'
        src: p01
      - type: single
        cat: theory
        q: Тело прошло по траектории и вернулось в исходную точку. Что можно сказать о пути $L$ и перемещении $S$?
        opts:
          - '$L \ne 0$, $\vec S = 0$'
          - '$L = 0$, $\vec S \ne 0$'
          - '$L = \vec S = 0$'
          - '$L = |\vec S| \ne 0$'
        ans: a
        hint: Перемещение — прямая, соединяющая **начальное** положение с **конечным**. Где окажется конец этой прямой?
        explain: Путь — длина траектории, он не равен нулю. Начальная и конечная точки совпали, поэтому перемещение равно нулю. В конспекте этот случай подписан «возвращение к исходной точке».
        f: [3]
        src: p02L
      - type: numeric
        cat: problem
        q: Сколько секунд в одних сутках?
        num: { value: 86400, unit: 'с', check: '24*60*60' }
        hint: 1 сутки = 24 ч, 1 ч = 60 мин, 1 мин = 60 с.
        explain: '1 сутки = 24 ч = 1440 мин = 86 400 с.'
        sol: { calc: '24\cdot60\cdot60 = 86\,400\ \text{с}', answer: '86 400 с' }
        src: p02L
      - type: text
        cat: theory
        q: Дайте определение перемещения.
        ref: Прямая, которая соединяет начальное положение тела с конечным, называется перемещением. Перемещение — кратчайшее расстояние между двумя точками.
        criteria:
          - Упомянуто начальное и конечное положение
          - Сказано, что это прямая (кратчайшее расстояние), а не длина траектории
        hint: Не путайте с путём — длиной траектории.
        explain: Перемещение $S$ — прямая от начального положения к конечному; путь $L$ — длина траектории.
        src: p02L

# ───────────────────────────────────────────────────────────────
  - id: kin-motion-types
    title: Виды движения. Средняя скорость
    pages: [p02R]
    theory:
      - kind: list
        title: Классификация движения
        body: |
          По виду траектории: **прямолинейное** / **криволинейное**.
          По характеристике скорости: **равномерное** ($\upsilon = \text{const}$) / **неравномерное** ($\upsilon \ne \text{const}$).
          Четыре типа движения:
          - прямолинейное равномерное;
          - прямолинейное неравномерное;
          - криволинейное равномерное;
          - криволинейное неравномерное.
        src: p02R
      - kind: rule
        title: Средняя скорость
        body: В любом движении средняя скорость находится при помощи деления общего расстояния на затраченное время.
        src: p02R
    formulas:
      - title: Средняя скорость
        tex: '\upsilon_{ср} = \frac{S_{общ}}{t_{общ}}'
        sym: [v_avg, S_tot, t_tot]
        src: p02R
      - title: Средняя скорость для нескольких участков
        tex: '\upsilon_{ср} = \frac{S_1 + S_2 + \dots + S_n}{t_1 + t_2 + \dots + t_n}'
        sym: [v_avg, S, t]
        src: p02R
      - title: Путь разделён пополам (I)
        tex: '\bar\upsilon = \frac{2\upsilon_1\upsilon_2}{\upsilon_1 + \upsilon_2}'
        sym: [v_avg, v1v2]
        cond: путь делится пополам; на половинах скорости υ₁ и υ₂
        src: p02R
      - title: Путь разделён на 1/3 и 2/3 (II)
        tex: '\bar\upsilon = \frac{3\upsilon_1\upsilon_2}{2\upsilon_1 + \upsilon_2}'
        sym: [v_avg, v1v2]
        cond: путь делится на 1/3 и 2/3 части
        src: p02R
      - title: Время разделено пополам
        tex: '\bar\upsilon = \frac{\upsilon_1 + \upsilon_2}{2}'
        sym: [v_avg, v1v2]
        cond: время делится пополам
        src: p02R
    questions:
      - type: single
        cat: theory
        q: Тело движется по окружности, модуль скорости не меняется. Какой это тип движения по классификации конспекта?
        opts: ['Криволинейное равномерное', 'Прямолинейное равномерное', 'Криволинейное неравномерное', 'Прямолинейное неравномерное']
        ans: a
        hint: Классифицируйте отдельно по виду траектории и отдельно по характеристике скорости.
        explain: Траектория — окружность (криволинейная), скорость по значению постоянна (равномерное). Получаем «криволинейное равномерное».
        src: p02R
      - type: numeric
        cat: problem
        q: Первую половину пути автомобиль проехал со скоростью 40 км/ч, вторую — со скоростью 60 км/ч. Найдите среднюю скорость.
        num: { value: 48, unit: 'км/ч', check: '2*40*60/(40+60)' }
        hint: Путь разделён **пополам** — в конспекте для этого случая есть отдельная формула (I). Среднее арифметическое здесь не подходит.
        explain: При делении пути пополам средняя скорость находится по формуле (I).
        f: [3]
        sol: { given: ['υ₁ = 40 км/ч', 'υ₂ = 60 км/ч'], find: 'ῡ', formula: '\bar\upsilon = \frac{2\upsilon_1\upsilon_2}{\upsilon_1+\upsilon_2}', calc: '\bar\upsilon = \frac{2\cdot40\cdot60}{40+60} = \frac{4800}{100} = 48', answer: '48 км/ч' }
        src: p02R
      - type: numeric
        cat: problem
        q: Первую половину времени тело двигалось со скоростью 10 м/с, вторую половину — со скоростью 20 м/с. Найдите среднюю скорость.
        num: { value: 15, unit: 'м/с', check: '(10+20)/2' }
        hint: Пополам делится **время**, а не путь.
        explain: При делении времени пополам средняя скорость — среднее арифметическое скоростей.
        f: [5]
        sol: { given: ['υ₁ = 10 м/с', 'υ₂ = 20 м/с'], find: 'ῡ', formula: '\bar\upsilon = \frac{\upsilon_1+\upsilon_2}{2}', calc: '\bar\upsilon = \frac{10+20}{2} = 15', answer: '15 м/с' }
        src: p02R
      - type: numeric
        cat: problem
        q: Первую треть пути автомобиль ехал со скоростью 30 км/ч, остальные две трети — со скоростью 60 км/ч. Найдите среднюю скорость.
        num: { value: 45, unit: 'км/ч', check: '3*30*60/(2*30+60)' }
        hint: Для деления пути на 1/3 и 2/3 в конспекте есть формула (II). Скорость на первой трети — $\upsilon_1$.
        explain: Применяем формулу (II) для деления пути на 1/3 и 2/3.
        f: [4]
        sol: { given: ['υ₁ = 30 км/ч (1/3 пути)', 'υ₂ = 60 км/ч (2/3 пути)'], find: 'ῡ', formula: '\bar\upsilon = \frac{3\upsilon_1\upsilon_2}{2\upsilon_1+\upsilon_2}', calc: '\bar\upsilon = \frac{3\cdot30\cdot60}{2\cdot30+60} = \frac{5400}{120} = 45', answer: '45 км/ч' }
        src: p02R
      - type: numeric
        cat: problem
        q: Тело прошло 100 м за 20 с, затем 200 м за 30 с. Найдите среднюю скорость на всём пути.
        num: { value: 6, unit: 'м/с', check: '(100+200)/(20+30)' }
        hint: Средняя скорость — это **общий путь**, делённый на **общее время**.
        explain: Средняя скорость в любом движении — общий путь, делённый на общее время.
        f: [2]
        sol: { given: ['S₁ = 100 м, t₁ = 20 с', 'S₂ = 200 м, t₂ = 30 с'], find: 'υ_ср', formula: '\upsilon_{ср} = \frac{S_1+S_2}{t_1+t_2}', calc: '\upsilon_{ср} = \frac{100+200}{20+30} = \frac{300}{50} = 6', answer: '6 м/с' }
        src: p02R
      - type: single
        cat: formula
        q: Какой формулой находят среднюю скорость, если **путь** разделён пополам?
        opts:
          - '$\bar\upsilon = \frac{2\upsilon_1\upsilon_2}{\upsilon_1+\upsilon_2}$'
          - '$\bar\upsilon = \frac{\upsilon_1+\upsilon_2}{2}$'
          - '$\bar\upsilon = \frac{3\upsilon_1\upsilon_2}{2\upsilon_1+\upsilon_2}$'
          - '$\bar\upsilon = \upsilon_1 + \upsilon_2$'
        ans: a
        hint: Среднее арифметическое скоростей подходит только тогда, когда пополам делится время.
        explain: 'Формула (I) из конспекта: при делении пути пополам $\bar\upsilon = \frac{2\upsilon_1\upsilon_2}{\upsilon_1+\upsilon_2}$.'
        f: [3, 5]
        src: p02R

# ───────────────────────────────────────────────────────────────
  - id: kin-uniform
    title: Равномерное прямолинейное движение. Уравнение и графики
    pages: [p03L, p03R]
    theory:
      - kind: text
        title: Равномерное движение
        body: При равномерном движении $\upsilon = \text{const}$ — скорость неизменна. $x$ — координата (положение), «0» — начало отсчёта, $x_0$ — начальная координата.
        src: p03L
      - kind: text
        title: Графики прямолинейного равномерного движения
        fig: uniform-graphs
        body: |
          ① **S(t)** ($S$ — путь): прямая из начала координат. Возрастающие прямые допустимы; убывающие прямые и кривые в конспекте подписаны «нет смысла». Наклон графика: $\operatorname{tg}\alpha = \upsilon$.
          ② **x(t)**: прямая, начинающаяся в точке $x_0$.
          ③ **υ(t)**: горизонтальная прямая; она может лежать выше оси ($\upsilon > 0$), на оси ($\upsilon = 0$) или ниже оси ($\upsilon < 0$). Площадь под графиком υ(t) — путь $L$.
        src: p03R
    formulas:
      - title: Путь при равномерном движении
        tex: 'S = \upsilon t'
        sym: [S, v, t]
        cond: '\(\upsilon = \text{const}\)'
        src: p03L
      - title: Уравнение равномерного движения
        tex: 'x(t) = x_0 + \upsilon t'
        sym: [x, x0, v, t]
        cond: '\(\upsilon = \text{const}\)'
        src: p03L
      - title: Наклон графика пути
        tex: '\operatorname{tg}\alpha = \upsilon'
        sym: [alpha_g, v]
        cond: график S(t)
        src: p03R
    examples:
      - title: Координата в разные моменты времени
        given: '$x_0 = 3$, $\upsilon = 2$ м/с'
        steps: ['$t = 1$ с → $x = 5$', '$t = 2$ с → $x = 7$']
        src: p03L
      - title: Чтение уравнения движения
        steps:
          - '$x = 3 + 2t$ → $x_0 = 3,\ \upsilon = 2$'
          - '$x = 6 + 8t$ → $x_0 = 6,\ \upsilon = 8$'
          - '$x = -4 + 5t$ → $x_0 = -4,\ \upsilon = 5$'
          - '$x = 7t - 9$ → $x_0 = -9,\ \upsilon = 7$'
          - '$x = 5$ → $x_0 = 5,\ \upsilon = 0$'
          - '$x = 0$ → $x_0 = 0,\ \upsilon = 0$'
        src: p03L
      - title: Уравнение по графику x(t)
        given: 'График: $x = 20$ при $t = 0$; $x = 60$ при $t = 8$ с'
        steps: ['$x_0 = 20$', '$S = 60 - 20 = 40$ м', '$\upsilon = \frac{40}{8} = 5$ м/с', '$x(t) = 20 + 5t$']
        src: p03R
    questions:
      - type: single
        cat: formula
        q: 'Уравнение движения: $x = 7t - 9$. Чему равны $x_0$ и $\upsilon$?'
        opts: ['$x_0 = -9,\ \upsilon = 7$', '$x_0 = 7,\ \upsilon = -9$', '$x_0 = 9,\ \upsilon = 7$', '$x_0 = -9,\ \upsilon = -7$']
        ans: a
        hint: Сравните с общим видом $x(t) = x_0 + \upsilon t$ — порядок слагаемых не важен.
        explain: 'Перепишем: $x = -9 + 7t$. Свободный член — $x_0 = -9$, коэффициент при $t$ — $\upsilon = 7$.'
        f: [2]
        src: p03L
      - type: numeric
        cat: problem
        q: 'Тело движется по закону $x = -4 + 5t$ (м). Найдите координату при $t = 3$ с.'
        num: { value: 11, unit: 'м', check: '-4+5*3' }
        hint: Подставьте время в уравнение движения.
        explain: Подставляем $t = 3$ с в уравнение $x(t) = x_0 + \upsilon t$.
        f: [2]
        sol: { given: ['x = −4 + 5t', 't = 3 с'], find: 'x', formula: 'x(t) = x_0 + \upsilon t', calc: 'x = -4 + 5\cdot3 = 11', answer: '11 м' }
        src: p03L
      - type: numeric
        cat: problem
        q: 'По графику x(t): при $t = 0$ координата $x = 20$ м, при $t = 8$ с координата $x = 60$ м. Найдите скорость.'
        num: { value: 5, unit: 'м/с', check: '(60-20)/8' }
        hint: Сначала найдите путь как разность координат, затем разделите на время.
        explain: Пример со стр. 3R конспекта.
        f: [1, 2]
        sol: { given: ['x₀ = 20 м', 'x = 60 м при t = 8 с'], find: 'υ', formula: '\upsilon = \frac{S}{t},\ S = x - x_0', calc: 'S = 60 - 20 = 40\ \text{м};\ \upsilon = \frac{40}{8} = 5', answer: '5 м/с' }
        src: p03R
      - type: single
        cat: theory
        q: Что равно площади фигуры под графиком скорости υ(t)?
        opts: ['Путь', 'Ускорение', 'Начальная координата', 'Время движения']
        ans: a
        hint: На графике υ(t) в конспекте заштрихованная площадь подписана одной буквой.
        explain: Площадь под графиком υ(t) подписана в конспекте «L — путь».
        src: p03R
      - type: single
        cat: formula
        q: График пути S(t) — прямая, наклонённая к оси времени под углом α. Чему равен $\operatorname{tg}\alpha$?
        opts: ['Скорости $\upsilon$', 'Ускорению $a$', 'Пути $S$', 'Времени $t$']
        ans: a
        hint: Тангенс угла наклона — отношение приращения $S$ к приращению $t$.
        explain: Для графика S(t) в конспекте записано $\operatorname{tg}\alpha = \upsilon$.
        f: [3]
        src: p03R

# ───────────────────────────────────────────────────────────────
  - id: kin-vectors
    title: Векторы. Сложение и вычитание. Переправа через реку
    pages: [p04L, p04R]
    theory:
      - kind: definition
        title: Векторные и скалярные величины
        body: |
          Физическая величина, у которой имеются и численное значение, и направление, называется **векторной** величиной: $\vec\upsilon,\ \vec F,\ \vec S$ …
          Физическая величина, у которой имеются численные значения, но нет направления, называется **скалярной**: $t,\ m$ …
          Направление важно! (Пример в конспекте: скорости 150, 60 и 180 направлены в разные стороны.)
        src: p04L
      - kind: text
        title: Сложение векторов
        body: 'Векторная запись: $\vec c = \vec a + \vec b$. Графически — правило параллелограмма или треугольника.'
        src: p04L
      - kind: text
        title: Вычитание векторов
        body: 'Метод треугольника: $\vec c = \vec a - \vec b$. В конспекте: «вектор $\vec c$ направлен в сторону вычитаемого» (см. замечание E01).'
        src: p04R
        errata: [E01]
      - kind: text
        title: Переправа через реку
        fig: river
        body: |
          ① Скорость лодки $\upsilon_л$ направлена перпендикулярно берегу: лодку сносит течением на $l$.
          ② Переправа через минимальное расстояние: снос $l = 0$, возможна при $\upsilon_л > \upsilon_т$.
          Индексы л, т, р в конспекте не расшифрованы (см. замечание E02).
        src: p04R
        errata: [E02]
    formulas:
      - title: Модуль суммы векторов
        tex: 'c = \sqrt{a^2 + b^2 + 2ab\cos\alpha}'
        sym: [vec_c, vec_a, vec_b, alpha_v]
        src: p04L
      - title: Модуль разности векторов
        tex: 'c = \sqrt{a^2 + b^2 - 2ab\cos\alpha}'
        sym: [vec_c, vec_a, vec_b, alpha_v]
        src: p04R
      - title: Результирующая скорость лодки
        tex: '\upsilon_р = \sqrt{\upsilon_л^2 + \upsilon_т^2}'
        sym: [v_res, v_boat, v_cur]
        cond: скорость лодки перпендикулярна берегу
        src: p04R
      - title: Снос и ширина реки
        tex: 'l = \upsilon_т t,\qquad H = \upsilon_л t'
        sym: [l_drift, H_river, v_cur, v_boat, t]
        cond: скорость лодки перпендикулярна берегу
        src: p04R
      - title: Время переправы
        tex: 't = \frac{H}{\upsilon_л} = \frac{l}{\upsilon_т}'
        sym: [t, H_river, l_drift, v_boat, v_cur]
        cond: скорость лодки перпендикулярна берегу
        boxed: true
        src: p04R
      - title: Угол движения лодки
        tex: '\operatorname{tg}\alpha = \frac{\upsilon_л}{\upsilon_т}'
        sym: [v_boat, v_cur]
        boxed: true
        src: p04R
      - title: Переправа по кратчайшему пути — скорость
        tex: '\upsilon_р = \sqrt{\upsilon_л^2 - \upsilon_т^2}'
        sym: [v_res, v_boat, v_cur]
        cond: 'снос \(l = 0\); \(\upsilon_л > \upsilon_т\)'
        src: p04R
      - title: Переправа по кратчайшему пути — время
        tex: 't = \frac{H}{\upsilon_р} = \frac{H}{\sqrt{\upsilon_л^2 - \upsilon_т^2}}'
        sym: [t, H_river, v_res, v_boat, v_cur]
        cond: 'снос \(l = 0\); \(\upsilon_л > \upsilon_т\)'
        src: p04R
    questions:
      - type: multiple
        cat: theory
        q: Какие величины из перечисленных — векторные? Выберите все верные.
        opts: ['Скорость $\vec\upsilon$', 'Сила $\vec F$', 'Перемещение $\vec S$', 'Время $t$', 'Масса $m$']
        ans: [a, b, c]
        hint: У векторной величины, кроме численного значения, есть **направление**.
        explain: В конспекте векторы — $\vec\upsilon,\ \vec F,\ \vec S$; скаляры — $t,\ m$.
        src: p04L
      - type: numeric
        cat: problem
        q: Два вектора $a = 3$ и $b = 4$ (условные единицы) перпендикулярны друг другу. Найдите модуль их суммы.
        num: { value: 5, unit: '', check: 'Math.sqrt(3*3+4*4+2*3*4*Math.cos(Math.PI/2))' }
        hint: При $\alpha = 90°$ имеем $\cos\alpha = 0$.
        explain: Подставляем в формулу модуля суммы векторов.
        f: [1]
        sol: { given: ['a = 3', 'b = 4', 'α = 90°'], find: 'c', formula: 'c = \sqrt{a^2+b^2+2ab\cos\alpha}', calc: 'c = \sqrt{9+16+0} = 5', answer: '5' }
        src: p04L
      - type: numeric
        cat: problem
        q: Векторы $a = 5$ и $b = 3$ (усл. ед.) направлены под углом 60° друг к другу. Найдите модуль разности $\vec c = \vec a - \vec b$.
        num: { value: 4.359, unit: '', check: 'Math.sqrt(25+9-2*5*3*0.5)' }
        hint: В формуле разности перед удвоенным произведением стоит знак «минус». $\cos60° = 0{,}5$.
        explain: Применяем формулу модуля разности векторов.
        f: [2]
        sol: { given: ['a = 5', 'b = 3', 'α = 60°'], find: 'c', formula: 'c = \sqrt{a^2+b^2-2ab\cos\alpha}', calc: 'c = \sqrt{25+9-2\cdot5\cdot3\cdot0{,}5} = \sqrt{19} \approx 4{,}36', answer: '≈ 4,36' }
        src: p04R
      - type: numeric
        cat: problem
        q: Ширина реки 120 м. Лодка плывёт перпендикулярно берегу со скоростью 4 м/с относительно воды, скорость течения 3 м/с. Найдите время переправы.
        num: { value: 30, unit: 'с', check: '120/4' }
        hint: Время переправы определяется только составляющей скорости поперёк реки.
        explain: При скорости лодки, перпендикулярной берегу, $t = H/\upsilon_л$.
        f: [5]
        sol: { given: ['H = 120 м', 'υл = 4 м/с', 'υт = 3 м/с'], find: 't', formula: 't = \frac{H}{\upsilon_л}', calc: 't = \frac{120}{4} = 30', answer: '30 с' }
        src: p04R
      - type: numeric
        cat: problem
        q: В условиях предыдущей задачи (H = 120 м, υл = 4 м/с, υт = 3 м/с) найдите снос лодки вниз по течению.
        num: { value: 90, unit: 'м', check: '3*(120/4)' }
        hint: Снос — путь, пройденный вместе с течением за время переправы.
        explain: Сначала время переправы, затем снос $l = \upsilon_т t$.
        f: [4, 5]
        sol: { given: ['H = 120 м', 'υл = 4 м/с', 'υт = 3 м/с'], find: 'l', formula: 't = \frac{H}{\upsilon_л},\ l = \upsilon_т t', calc: 't = 30\ \text{с};\ l = 3\cdot30 = 90', answer: '90 м' }
        src: p04R
      - type: numeric
        cat: problem
        q: Ширина реки 120 м, скорость лодки относительно воды 5 м/с, скорость течения 3 м/с. Лодка переправляется по кратчайшему пути (без сноса). Найдите время переправы.
        num: { value: 30, unit: 'с', check: '120/Math.sqrt(25-9)' }
        hint: 'При переправе по кратчайшему пути результирующая скорость $\upsilon_р = \sqrt{\upsilon_л^2 - \upsilon_т^2}$.'
        explain: Случай ② — переправа через минимальное расстояние.
        f: [7, 8]
        sol: { given: ['H = 120 м', 'υл = 5 м/с', 'υт = 3 м/с', 'l = 0'], find: 't', formula: 't = \frac{H}{\sqrt{\upsilon_л^2-\upsilon_т^2}}', calc: 't = \frac{120}{\sqrt{25-9}} = \frac{120}{4} = 30', answer: '30 с' }
        src: p04R
      - type: single
        cat: theory
        q: При каком условии возможна переправа по кратчайшему пути (снос $l = 0$)?
        opts: ['$\upsilon_л > \upsilon_т$', '$\upsilon_л < \upsilon_т$', '$\upsilon_л = 0$', 'При любых скоростях']
        ans: a
        hint: Посмотрите на подкоренное выражение $\upsilon_л^2 - \upsilon_т^2$.
        explain: 'Скорость $\upsilon_р = \sqrt{\upsilon_л^2-\upsilon_т^2}$ существует только при $\upsilon_л > \upsilon_т$ — это условие записано в конспекте.'
        f: [7]
        src: p04R

# ───────────────────────────────────────────────────────────────
  - id: kin-accel
    title: Ускорение. Равнопеременное движение
    pages: [p05L, p05R, p06L]
    theory:
      - kind: text
        title: Виды движения по изменению скорости
        body: |
          30 30 30 30 30 — **равномерное**.
          30 35 40 45 50 (+5) — **равноускоренное**.
          60 56 52 48 44 (−4) — **равнозамедленное**.
          70 81 90 56 75 — неравномерное.
          Равноускоренное и равнозамедленное движения — **равнопеременные** (частный случай неравномерного).
        src: p05L
      - kind: definition
        title: Ускорение
        fig: accel
        body: Ускорение — это изменение скорости за единицу времени. $a$ — ускорение [м/с²]; $\upsilon_0$ — начальная скорость; $\upsilon$ — конечная (мгновенная) скорость. Например, $a = 2$ м/с² — скорость тела за секунду увеличивается на 2.
        src: p05L
      - kind: rule
        title: Когда υ₀ = 0
        body: Формулировки «начав движение», «из состояния покоя», «без начальной скорости» означают $\upsilon_0 = 0$, тогда $\upsilon = at$.
        src: p05L
      - kind: rule
        title: Тормозное движение
        body: При равнозамедленном движении ($\vec\upsilon_0\uparrow\downarrow\vec a$) скорость уменьшается; если $\upsilon = 0$ — тормозное движение, $t_т$ — тормозное время.
        src: p05L
      - kind: list
        title: Как определить вид движения по уравнению скорости
        body: |
          ① $\upsilon = 20 + 3t$: $\upsilon_0 = 20,\ a = 3$ — равноускоренное.
          ② $\upsilon = 20$: $\upsilon_0 = 20,\ a = 0$ — равномерное.
          ③ $\upsilon = 20 - 3t$: $\upsilon_0 = 20,\ a = -3$ — равнозамедленное.
          ④ $\upsilon = 3t$: $\upsilon_0 = 0,\ a = 3$ — равноускоренное.
          ⑤ $\upsilon = 0$: покой.
          ⑥ $\upsilon = -4t$: $\upsilon_0 = 0,\ a = -4$ — равноускоренное.
          ⑦ $\upsilon = -10 + 2t$: $\upsilon_0 = -10,\ a = 2$ — равнозамедленное.
          ⑧ $\upsilon = -10$: $\upsilon_0 = -10,\ a = 0$ — равномерное.
          ⑨ $\upsilon = -10 - 2t$: $\upsilon_0 = -10,\ a = -2$ — равноускоренное.
        src: [p05L, p05R]
      - kind: text
        title: Графики равнопеременного движения υ(t)
        body: |
          $\upsilon_0 > 0$: $a > 0$ — равноуск.; $a = 0$ — равномерное; $a < 0$ — равнозамед.
          $\upsilon_0 = 0$: $a > 0$ — равноуск.; $a = 0$ — покой; $a < 0$ — равноуск.
          $\upsilon_0 < 0$: $a > 0$ — равнозамед.; $a = 0$ — равномерное; $a < 0$ — равноуск.
          Наклон графика υ(t): $\operatorname{tg}\alpha = a$; чем круче прямая, тем больше ускорение ($a_3 > a_2 > a_1$).
        src: [p05R, p06L]
    formulas:
      - title: Ускорение
        tex: '\vec a = \frac{\Delta\vec\upsilon}{t} = \frac{\vec\upsilon - \vec\upsilon_0}{t}'
        sym: [a, v, v0, t]
        src: p05L
      - title: Скорость при равноускоренном движении
        tex: '\upsilon(t) = \upsilon_0 + at'
        sym: [v, v0, a, t]
        cond: '\(\vec\upsilon_0 \uparrow\uparrow \vec a\)'
        src: p05L
      - title: Скорость без начальной скорости
        tex: '\upsilon = at'
        sym: [v, a, t]
        cond: '\(\upsilon_0 = 0\)'
        src: p05L
      - title: Скорость при равнозамедленном движении
        tex: '\upsilon(t) = \upsilon_0 - at'
        sym: [v, v0, a, t]
        cond: '\(\vec\upsilon_0 \uparrow\downarrow \vec a\)'
        src: p05L
      - title: Тормозное время
        tex: 't_т = \frac{\upsilon_0}{a}'
        sym: [t_br, v0, a]
        cond: 'торможение до остановки (\(\upsilon = 0\))'
        src: p05L
      - title: Наклон графика скорости
        tex: '\operatorname{tg}\alpha = a'
        sym: [a]
        cond: график υ(t)
        src: p06L
    examples:
      - title: Ускорение по графику υ(t)
        given: 'Скорость растёт от 20 м/с ($t = 0$) до 60 м/с ($t = 10$ с)'
        steps: ['$\upsilon_0 = 20$', '$\Delta\upsilon = 60 - 20 = 40$', '$a = \frac{\Delta\upsilon}{t} = \frac{40}{10} = 4$ м/с², $a = \text{const}$', 'при $t = 15$ с ускорение то же: $a = 4$ м/с²', '$\upsilon(t) = 20 + 4t$']
        src: p06L
    questions:
      - type: single
        cat: theory
        q: 'Уравнение скорости: $\upsilon = -10 + 2t$. Какое это движение по классификации конспекта?'
        opts: ['Равнозамедленное', 'Равноускоренное', 'Равномерное', 'Покой']
        ans: a
        hint: Сравните знаки $\upsilon_0$ и $a$. Если они разные, модуль скорости ...
        explain: '$\upsilon_0 = -10$, $a = 2$ — знаки разные, скорость по модулю уменьшается: равнозамедленное (случай ⑦ в конспекте).'
        src: p05R
      - type: single
        cat: theory
        q: 'Уравнение скорости: $\upsilon = -4t$. Какое это движение?'
        opts: ['Равноускоренное', 'Равнозамедленное', 'Равномерное', 'Покой']
        ans: a
        hint: 'Начальная скорость равна нулю. Растёт ли модуль скорости со временем?'
        explain: '$\upsilon_0 = 0$, $a = -4$: модуль скорости растёт — равноускоренное движение (случай ⑥).'
        src: p05R
      - type: matching
        cat: theory
        q: Сопоставьте уравнение скорости и вид движения.
        pairs:
          - ['$\upsilon = 20 + 3t$', 'Равноускоренное']
          - ['$\upsilon = 20$', 'Равномерное']
          - ['$\upsilon = 20 - 3t$', 'Равнозамедленное']
          - ['$\upsilon = 0$', 'Покой']
        hint: Определите $\upsilon_0$ и $a$ для каждого уравнения.
        explain: 'Случаи ①, ②, ③ и ⑤ из конспекта.'
        src: [p05L, p05R]
      - type: numeric
        cat: problem
        q: Скорость тела равномерно выросла с 20 м/с до 60 м/с за 10 с. Найдите ускорение.
        num: { value: 4, unit: 'м/с²', check: '(60-20)/10' }
        hint: Ускорение — изменение скорости за единицу времени.
        explain: Пример со стр. 6L конспекта.
        f: [1]
        sol: { given: ['υ₀ = 20 м/с', 'υ = 60 м/с', 't = 10 с'], find: 'a', formula: 'a = \frac{\upsilon - \upsilon_0}{t}', calc: 'a = \frac{60-20}{10} = 4', answer: '4 м/с²' }
        src: p06L
      - type: numeric
        cat: problem
        q: Автомобиль тормозит до остановки с начальной скоростью 20 м/с и ускорением 4 м/с². Найдите тормозное время.
        num: { value: 5, unit: 'с', check: '20/4' }
        hint: При торможении до остановки $\upsilon = 0$.
        explain: 'Из $\upsilon = \upsilon_0 - at = 0$ получаем $t_т = \upsilon_0/a$.'
        f: [5]
        sol: { given: ['υ₀ = 20 м/с', 'a = 4 м/с²', 'υ = 0'], find: 'tт', formula: 't_т = \frac{\upsilon_0}{a}', calc: 't_т = \frac{20}{4} = 5', answer: '5 с' }
        src: p05L
      - type: numeric
        cat: problem
        q: Тело начинает движение из состояния покоя с ускорением 3 м/с². Какой будет скорость через 6 с?
        num: { value: 18, unit: 'м/с', check: '3*6' }
        hint: «Из состояния покоя» означает $\upsilon_0 = 0$.
        explain: При $\upsilon_0 = 0$ скорость $\upsilon = at$.
        f: [3]
        sol: { given: ['υ₀ = 0', 'a = 3 м/с²', 't = 6 с'], find: 'υ', formula: '\upsilon = at', calc: '\upsilon = 3\cdot6 = 18', answer: '18 м/с' }
        src: p05L
      - type: multiple
        cat: theory
        q: Какие формулировки в условии задачи означают, что $\upsilon_0 = 0$? Выберите все.
        opts: ['«начав движение»', '«из состояния покоя»', '«без начальной скорости»', '«равномерно»', '«тормозное движение»']
        ans: [a, b, c]
        hint: Ищите формулировки, где тело в начальный момент не двигалось.
        explain: 'В конспекте перечислены три формулировки: «начав движение», «из состояния покоя», «без начальной скорости».'
        src: p05L

# ───────────────────────────────────────────────────────────────
  - id: kin-relative
    title: Относительная и результирующая скорость
    pages: [p06L]
    theory:
      - kind: text
        title: Обозначения
        body: '$\upsilon_{от}$ — относительная скорость (скорость одного тела относительно другого); $\upsilon_р$ — результирующая скорость. Стрелки: ↑↓ — взаимообратное (встречное) движение, ↑↑ — сонаправленное, ⊥ — перпендикулярное, ∠α — под углом.'
        src: p06L
    formulas:
      - title: Относительная скорость, встречное движение
        tex: '\upsilon_{от} = \upsilon_1 + \upsilon_2'
        sym: [v_rel, v1v2]
        cond: '↑↓ — взаимообратное движение'
        src: p06L
      - title: Относительная скорость, сонаправленное движение
        tex: '\upsilon_{от} = \upsilon_1 - \upsilon_2'
        sym: [v_rel, v1v2]
        cond: '↑↑ — сонаправленное движение'
        src: p06L
      - title: Относительная скорость, перпендикулярное движение
        tex: '\upsilon_{от} = \sqrt{\upsilon_1^2 + \upsilon_2^2}'
        sym: [v_rel, v1v2]
        cond: '⊥ — перпендикулярное движение'
        src: p06L
      - title: Относительная скорость, движение под углом
        tex: '\upsilon_{от} = \sqrt{\upsilon_1^2 + \upsilon_2^2 - 2\upsilon_1\upsilon_2\cos\alpha}'
        sym: [v_rel, v1v2]
        cond: '∠α — движение под углом'
        src: p06L
      - title: Результирующая скорость, ↑↓
        tex: '\upsilon_р = \upsilon_1 - \upsilon_2'
        sym: [v_res, v1v2]
        cond: '↑↓'
        src: p06L
      - title: Результирующая скорость, ↑↑
        tex: '\upsilon_р = \upsilon_1 + \upsilon_2'
        sym: [v_res, v1v2]
        cond: '↑↑'
        src: p06L
      - title: Результирующая скорость, ⊥
        tex: '\upsilon_р = \sqrt{\upsilon_1^2 + \upsilon_2^2}'
        sym: [v_res, v1v2]
        cond: '⊥'
        src: p06L
      - title: Результирующая скорость, ∠α
        tex: '\upsilon_р = \sqrt{\upsilon_1^2 + \upsilon_2^2 + 2\upsilon_1\upsilon_2\cos\alpha}'
        sym: [v_res, v1v2]
        cond: '∠α'
        src: p06L
    questions:
      - type: numeric
        cat: problem
        q: Два поезда движутся навстречу друг другу со скоростями 60 км/ч и 40 км/ч. Найдите скорость одного поезда относительно другого.
        num: { value: 100, unit: 'км/ч', check: '60+40' }
        hint: Встречное движение (↑↓) — для относительной скорости скорости складываются.
        explain: Для взаимообратного движения $\upsilon_{от} = \upsilon_1 + \upsilon_2$.
        f: [1]
        sol: { given: ['υ₁ = 60 км/ч', 'υ₂ = 40 км/ч', '↑↓'], find: 'υот', formula: '\upsilon_{от} = \upsilon_1 + \upsilon_2', calc: '\upsilon_{от} = 60 + 40 = 100', answer: '100 км/ч' }
        src: p06L
      - type: numeric
        cat: problem
        q: Два автомобиля едут в одном направлении со скоростями 60 км/ч и 40 км/ч. Найдите относительную скорость.
        num: { value: 20, unit: 'км/ч', check: '60-40' }
        hint: Сонаправленное движение (↑↑).
        explain: Для сонаправленного движения $\upsilon_{от} = \upsilon_1 - \upsilon_2$.
        f: [2]
        sol: { given: ['υ₁ = 60 км/ч', 'υ₂ = 40 км/ч', '↑↑'], find: 'υот', formula: '\upsilon_{от} = \upsilon_1 - \upsilon_2', calc: '\upsilon_{от} = 60 - 40 = 20', answer: '20 км/ч' }
        src: p06L
      - type: numeric
        cat: problem
        q: Два тела движутся во взаимно перпендикулярных направлениях со скоростями 6 м/с и 8 м/с. Найдите относительную скорость.
        num: { value: 10, unit: 'м/с', check: 'Math.sqrt(36+64)' }
        hint: Для перпендикулярного движения используйте теорему Пифагора.
        explain: Для перпендикулярного движения $\upsilon_{от} = \sqrt{\upsilon_1^2+\upsilon_2^2}$.
        f: [3]
        sol: { given: ['υ₁ = 6 м/с', 'υ₂ = 8 м/с', '⊥'], find: 'υот', formula: '\upsilon_{от} = \sqrt{\upsilon_1^2+\upsilon_2^2}', calc: '\upsilon_{от} = \sqrt{36+64} = 10', answer: '10 м/с' }
        src: p06L
      - type: single
        cat: formula
        q: Какая формула из конспекта даёт **относительную** скорость при движении под углом α?
        opts:
          - '$\upsilon_{от} = \sqrt{\upsilon_1^2+\upsilon_2^2-2\upsilon_1\upsilon_2\cos\alpha}$'
          - '$\upsilon_{от} = \sqrt{\upsilon_1^2+\upsilon_2^2+2\upsilon_1\upsilon_2\cos\alpha}$'
          - '$\upsilon_{от} = \upsilon_1 + \upsilon_2$'
          - '$\upsilon_{от} = \sqrt{\upsilon_1^2+\upsilon_2^2}$'
        ans: a
        hint: Относительная скорость — это модуль **разности** векторов скоростей.
        explain: Для относительной скорости под углом в конспекте стоит «минус» перед удвоенным произведением, для результирующей — «плюс».
        f: [4, 8]
        src: p06L
      - type: numeric
        cat: problem
        q: Лодка плывёт по течению (↑↑). Собственная скорость лодки 5 м/с, скорость течения 2 м/с. Найдите результирующую скорость лодки.
        num: { value: 7, unit: 'м/с', check: '5+2' }
        hint: Для **результирующей** скорости при сонаправленном движении скорости складываются.
        explain: 'По конспекту: $\upsilon_р = \upsilon_1 + \upsilon_2$ при ↑↑.'
        f: [6]
        sol: { given: ['υ₁ = 5 м/с', 'υ₂ = 2 м/с', '↑↑'], find: 'υр', formula: '\upsilon_р = \upsilon_1 + \upsilon_2', calc: '\upsilon_р = 5 + 2 = 7', answer: '7 м/с' }
        src: p06L

# ───────────────────────────────────────────────────────────────
  - id: kin-path-accel
    title: Путь в равнопеременном движении. Путь за n-ю секунду
    pages: [p06R]
    theory:
      - kind: text
        title: Как выбрать формулу пути
        body: Для каждого вида движения в конспекте даны три формулы пути — без конечной скорости $\upsilon$, без времени $t$ и без ускорения $a$. Выбирайте ту, в которой нет неизвестной величины.
        src: p06R
      - kind: note
        title: Средняя скорость в равнопеременном движении
        body: В конспекте есть заголовок «Средняя скорость в равнопеременном движении», но формула под ним не записана.
        src: p06R
      - kind: text
        title: Путь за n-ю секунду
        fig: nth-second
        body: 'Пример: $\upsilon_0 = 5$, $a = 2$. Путь **за пять секунд** — это весь отрезок от начала до конца 5-й секунды; путь **за пятую секунду** — только участок между концом 4-й и концом 5-й секунды.'
        src: p06R
      - kind: text
        title: Средняя скорость в равнопеременном движении
        body: 'Под этим заголовком в конспекте формулы нет. Её дают учебники, и её легко получить из формулы пути с этой же страницы $S = \frac{\upsilon + \upsilon_0}{2}t$ и определения средней скорости $\upsilon_{ср} = \frac St$: при равноускоренном движении $\upsilon_{ср} = \frac{\upsilon_0 + \upsilon}{2}$ — средняя скорость равна полусумме начальной и конечной скоростей.'
        src: p06R
        web:
          - { title: 'Открытая физика: Равноускоренное движение', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph4/theory.html' }
    formulas:
      - title: Путь при равноускоренном движении (без υ)
        tex: 'S = \upsilon_0 t + \frac{at^2}{2}'
        sym: [S, v0, a, t]
        cond: '\(\vec\upsilon_0\uparrow\uparrow\vec a\)'
        src: p06R
      - title: Путь при равноускоренном движении (без t)
        tex: 'S = \frac{\upsilon^2 - \upsilon_0^2}{2a}'
        sym: [S, v, v0, a]
        cond: '\(\vec\upsilon_0\uparrow\uparrow\vec a\)'
        src: p06R
      - title: Путь при равнопеременном движении (без a)
        tex: 'S = \frac{\upsilon + \upsilon_0}{2}\,t'
        sym: [S, v, v0, t]
        src: p06R
      - title: Путь без начальной скорости
        tex: 'S = \frac{at^2}{2},\qquad S = \frac{\upsilon^2}{2a},\qquad S = \frac{\upsilon t}{2}'
        sym: [S, a, t, v]
        cond: '\(\upsilon_0 = 0\)'
        src: p06R
      - title: Путь при равнозамедленном движении (без υ)
        tex: 'S = \upsilon_0 t - \frac{at^2}{2}'
        sym: [S, v0, a, t]
        cond: '\(\vec\upsilon_0\uparrow\downarrow\vec a\)'
        src: p06R
      - title: Путь при равнозамедленном движении (без t)
        tex: 'S = \frac{\upsilon_0^2 - \upsilon^2}{2a}'
        sym: [S, v0, v, a]
        cond: '\(\vec\upsilon_0\uparrow\downarrow\vec a\)'
        src: p06R
      - title: Тормозной путь
        tex: 'S_т = \frac{a t_т^2}{2},\qquad S_т = \frac{\upsilon_0^2}{2a},\qquad S_т = \frac{\upsilon_0 t_т}{2}'
        sym: [S_br, a, t_br, v0]
        cond: 'тормозное движение, \(\upsilon = 0\)'
        src: p06R
      - title: Путь за n-ю секунду (определение)
        tex: 'S_{n} = S_n - S_{n-1}'
        sym: [S_n, n_sec]
        src: p06R
      - title: Путь за n-ю секунду
        tex: 'S_{n} = \upsilon_0 \pm \frac{a}{2}(2n - 1)'
        sym: [S_n, v0, a, n_sec]
        cond: '«+» — равноускоренно, «−» — равнозамедленно'
        src: p06R
      - id: kin-path-accel-favg
        title: Средняя скорость при равноускоренном движении
        tex: '\upsilon_{ср} = \frac{\upsilon_0 + \upsilon}{2}'
        sym: [v_avg, v0, v]
        cond: 'только для равноускоренного (равнопеременного) движения'
        src: p06R
        web:
          - { title: 'Открытая физика: Равноускоренное движение', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph4/theory.html' }
    questions:
      - type: numeric
        cat: problem
        q: Тело движется равноускоренно, $\upsilon_0 = 5$ м/с, $a = 2$ м/с². Найдите путь за **пять секунд**.
        num: { value: 50, unit: 'м', check: '5*5+2*25/2' }
        hint: «За пять секунд» — весь путь от начала движения. Время известно, конечная скорость — нет.
        explain: Используем формулу пути без конечной скорости.
        f: [1]
        sol: { given: ['υ₀ = 5 м/с', 'a = 2 м/с²', 't = 5 с'], find: 'S', formula: 'S = \upsilon_0 t + \frac{at^2}{2}', calc: 'S = 5\cdot5 + \frac{2\cdot25}{2} = 25 + 25 = 50', answer: '50 м' }
        src: p06R
      - type: numeric
        cat: problem
        q: Тело движется равноускоренно, $\upsilon_0 = 5$ м/с, $a = 2$ м/с². Найдите путь за **пятую секунду**.
        num: { value: 14, unit: 'м', check: '5+1*(2*5-1)' }
        hint: Для пути за n-ю секунду в конспекте есть отдельная формула; движение равноускоренное — знак «+».
        explain: 'Проверка: $S_5 - S_4 = 50 - (5\cdot4 + 16) = 50 - 36 = 14$ м.'
        f: [8, 9]
        sol: { given: ['υ₀ = 5 м/с', 'a = 2 м/с²', 'n = 5'], find: 'S₅', formula: 'S_{n} = \upsilon_0 + \frac{a}{2}(2n-1)', calc: 'S_{5} = 5 + \frac{2}{2}(2\cdot5-1) = 5 + 9 = 14', answer: '14 м' }
        src: p06R
      - type: numeric
        cat: problem
        q: Автомобиль, двигавшийся со скоростью 20 м/с, тормозит с ускорением 5 м/с² до остановки. Найдите тормозной путь.
        num: { value: 40, unit: 'м', check: '20*20/(2*5)' }
        hint: Время торможения не дано — нужна формула тормозного пути без времени.
        explain: 'Тормозной путь $S_т = \frac{\upsilon_0^2}{2a}$.'
        f: [7]
        sol: { given: ['υ₀ = 20 м/с', 'a = 5 м/с²', 'υ = 0'], find: 'Sт', formula: 'S_т = \frac{\upsilon_0^2}{2a}', calc: 'S_т = \frac{400}{10} = 40', answer: '40 м' }
        src: p06R
      - type: numeric
        cat: problem
        q: Тело начинает движение из состояния покоя с ускорением 4 м/с² и достигает скорости 20 м/с. Какой путь оно прошло?
        num: { value: 50, unit: 'м', check: '20*20/(2*4)' }
        hint: Время не дано, $\upsilon_0 = 0$.
        explain: 'При $\upsilon_0 = 0$ путь $S = \frac{\upsilon^2}{2a}$.'
        f: [4]
        sol: { given: ['υ₀ = 0', 'a = 4 м/с²', 'υ = 20 м/с'], find: 'S', formula: 'S = \frac{\upsilon^2}{2a}', calc: 'S = \frac{400}{8} = 50', answer: '50 м' }
        src: p06R
      - type: single
        cat: formula
        q: В задаче на равноускоренное движение неизвестно время. Какую формулу пути выбрать?
        opts: ['$S = \frac{\upsilon^2 - \upsilon_0^2}{2a}$', '$S = \upsilon_0 t + \frac{at^2}{2}$', '$S = \frac{\upsilon+\upsilon_0}{2}t$', '$S = \upsilon t$']
        ans: a
        hint: Нужна формула, в которой нет $t$.
        explain: 'Формула «без t»: $S = \frac{\upsilon^2-\upsilon_0^2}{2a}$.'
        f: [2]
        src: p06R
      - type: single
        cat: formula
        q: Известны начальная и конечная скорости и время, но не ускорение. Какая формула пути подходит?
        opts: ['$S = \frac{\upsilon+\upsilon_0}{2}t$', '$S = \frac{\upsilon^2-\upsilon_0^2}{2a}$', '$S = \upsilon_0 t + \frac{at^2}{2}$', '$S = \frac{at^2}{2}$']
        ans: a
        hint: Нужна формула «без a».
        explain: 'Формула «без a»: $S = \frac{\upsilon+\upsilon_0}{2}t$ — подходит и для равноускоренного, и для равнозамедленного движения.'
        f: [3]
        src: p06R
      - type: numeric
        cat: problem
        q: 'Тело разогналось равноускоренно с 4 м/с до 10 м/с. Найдите среднюю скорость на этом участке.'
        num: { value: 7, unit: 'м/с', check: '(4+10)/2' }
        hint: 'При равноускоренном движении $\upsilon_{ср} = \frac{\upsilon_0 + \upsilon}{2}$.'
        explain: '$\upsilon_{ср} = \frac{4 + 10}{2} = 7$ м/с.'
        f: [kin-path-accel-favg]
        sol: { given: ['υ₀ = 4 м/с', 'υ = 10 м/с'], find: 'υ_ср', formula: '\upsilon_{ср} = \frac{\upsilon_0 + \upsilon}{2}', calc: '\upsilon_{ср} = \frac{4 + 10}{2} = 7', answer: '7 м/с' }
        src: p06R
        web:
          - { title: 'Открытая физика: Равноускоренное движение', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph4/theory.html' }
      - type: numeric
        cat: problem
        q: 'Автомобиль тронулся с места и за 5 с равноускоренно разогнался до 20 м/с. Найдите путь через среднюю скорость.'
        num: { value: 50, unit: 'м', check: '(0+20)/2*5' }
        hint: 'Сначала $\upsilon_{ср} = \frac{\upsilon_0 + \upsilon}{2}$, затем $S = \upsilon_{ср}t$.'
        explain: '$\upsilon_{ср} = \frac{0 + 20}{2} = 10$ м/с, $S = 10\cdot5 = 50$ м — то же даёт формула $S = \frac{\upsilon + \upsilon_0}{2}t$ из конспекта.'
        f: [kin-path-accel-favg]
        sol: { given: ['υ₀ = 0', 'υ = 20 м/с', 't = 5 с'], find: 'S', formula: 'S = \upsilon_{ср}t = \frac{\upsilon_0 + \upsilon}{2}t', calc: 'S = \frac{0 + 20}{2}\cdot5 = 50', answer: '50 м' }
        src: p06R
        web:
          - { title: 'Открытая физика: Равноускоренное движение', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph4/theory.html' }

# ───────────────────────────────────────────────────────────────
  - id: kin-equation-accel
    title: Уравнение движения при равнопеременном движении. Путь по графику
    pages: [p07L, p07R]
    theory:
      - kind: rule
        title: Последовательные этапы движения
        body: При последовательных этапах движения конечная скорость одного этапа — это и есть начальная скорость следующего этапа.
        src: p07R
      - kind: text
        title: Путь и перемещение по графику υ(t)
        fig: vt-area
        body: 'Площадь фигуры под графиком υ(t): $S = L$, $L$ — путь. Если часть площади $S_1$ над осью, а часть $S_2$ под осью, то путь $L = S_1 + S_2$, а перемещение (или координата) $S = S_1 - S_2$.'
        src: p07R
    formulas:
      - title: Координата через путь
        tex: 'x = x_0 + S'
        sym: [x, x0, S]
        boxed: true
        src: p07L
      - title: Уравнение равнопеременного движения
        tex: 'x = x_0 + \upsilon_0 t + \frac{a}{2}t^2'
        sym: [x, x0, v0, a, t]
        cond: '\(\upsilon \ne \text{const}\), \(a = \text{const}\)'
        src: p07L
      - title: Путь и перемещение по графику
        tex: 'L = S_1 + S_2,\qquad S = S_1 - S_2'
        sym: [L_path, S]
        cond: части площади над осью (S₁) и под осью (S₂)
        src: p07R
      - title: Скорость в середине пути
        tex: '\upsilon_x = \sqrt{\frac{\upsilon_0^2 + \upsilon^2}{2}}'
        sym: [v_mid, v0, v]
        cond: '\(a = \text{const}\)'
        boxed: true
        src: p07R
    examples:
      - title: Составить уравнение
        given: '$x_0 = -6$, $\upsilon_0 = 10$, $a = 4$'
        steps: ['$x = -6 + 10t + 2t^2$']
        src: p07L
      - title: Анализ уравнения x = −20 + 10t − t²
        steps: ['① $x_0 = -20$', '② $\upsilon_0 = 10$', '③ $a = -2$ (модуль 2, проекция −2)', '④ $\upsilon(t) = 10 - 2t$', '⑤ $t = 4$ с: $S = 10\cdot4 - \frac{2\cdot16}{2}$', '⑥ $S_3 = \upsilon_0 + \frac a2(2\cdot3 - 1)$']
        answer: 'Результаты ⑤ и ⑥ в конспекте не записаны. Вычислено: S = 24 м; S₃ = 5 м.'
        computed: true
        src: p07L
        errata: [E19]
      - title: Путь по графику скорости
        given: 'υ растёт от 10 м/с до 40 м/с за 6 с'
        steps: ['Прямоугольник: $10\cdot6 = 60$ м', 'Треугольник: $\frac{30\cdot6}{2} = 90$ м', '$L = 60 + 90 = 150$ м']
        src: p07R
    questions:
      - type: single
        cat: formula
        q: 'Уравнение движения $x = -20 + 10t - t^2$. Чему равна проекция ускорения?'
        opts: ['$a = -2$ м/с²', '$a = -1$ м/с²', '$a = 10$ м/с²', '$a = 2$ м/с²']
        ans: a
        hint: В общем виде перед $t^2$ стоит $\frac{a}{2}$, а не $a$.
        explain: '$\frac{a}{2} = -1$, значит $a = -2$ м/с². В конспекте: «модуль 2, проекция −2».'
        f: [2]
        src: p07L
      - type: numeric
        cat: problem
        q: 'Тело движется по закону $x = -20 + 10t - t^2$ (м). Найдите путь за 4 с.'
        num: { value: 24, unit: 'м', check: '10*4-2*16/2' }
        hint: 'Определите $\upsilon_0$ и $a$ из уравнения. Тело остановится при $t = 5$ с — до этого момента путь равен перемещению.'
        explain: Пункт ⑤ примера со стр. 7L; в конспекте результат не записан, здесь он вычислен.
        f: [2]
        sol: { given: ['υ₀ = 10 м/с', 'a = −2 м/с²', 't = 4 с'], find: 'S', formula: 'S = \upsilon_0 t + \frac{at^2}{2}', calc: 'S = 10\cdot4 - \frac{2\cdot16}{2} = 40 - 16 = 24', answer: '24 м' }
        src: p07L
      - type: numeric
        cat: problem
        q: '$x_0 = -6$ м, $\upsilon_0 = 10$ м/с, $a = 4$ м/с². Найдите координату тела при $t = 2$ с.'
        num: { value: 22, unit: 'м', check: '-6+10*2+2*4' }
        hint: Составьте уравнение $x = x_0 + \upsilon_0 t + \frac{a}{2}t^2$ и подставьте время.
        explain: 'Уравнение из конспекта: $x = -6 + 10t + 2t^2$.'
        f: [2]
        sol: { given: ['x₀ = −6 м', 'υ₀ = 10 м/с', 'a = 4 м/с²', 't = 2 с'], find: 'x', formula: 'x = x_0 + \upsilon_0 t + \frac{a}{2}t^2', calc: 'x = -6 + 20 + 2\cdot4 = 22', answer: '22 м' }
        src: p07L
      - type: numeric
        cat: problem
        q: Скорость тела равномерно выросла от 10 м/с до 40 м/с за 6 с. Найдите путь по графику υ(t).
        num: { value: 150, unit: 'м', check: '10*6+30*6/2' }
        hint: Площадь трапеции под графиком = прямоугольник + треугольник.
        explain: Пример со стр. 7R.
        sol: { given: ['υ₀ = 10 м/с', 'υ = 40 м/с', 't = 6 с'], find: 'L', formula: 'L = S_{прям} + S_{треуг}', calc: 'L = 10\cdot6 + \frac{30\cdot6}{2} = 60 + 90 = 150', answer: '150 м' }
        src: p07R
      - type: numeric
        cat: problem
        q: Тело движется равноускоренно. В начале участка его скорость 10 м/с, в конце — 50 м/с. Найдите скорость в середине пути.
        num: { value: 36.06, unit: 'м/с', check: 'Math.sqrt((100+2500)/2)' }
        hint: Это не среднее арифметическое. В конспекте выведена отдельная формула для середины пути.
        explain: Формула получена приравниванием путей на двух половинах.
        f: [4]
        sol: { given: ['υ₀ = 10 м/с', 'υ = 50 м/с'], find: 'υx', formula: '\upsilon_x = \sqrt{\frac{\upsilon_0^2+\upsilon^2}{2}}', calc: '\upsilon_x = \sqrt{\frac{100+2500}{2}} = \sqrt{1300} \approx 36{,}06', answer: '≈ 36,1 м/с' }
        src: p07R
      - type: single
        cat: theory
        q: Часть площади под графиком υ(t) лежит над осью ($S_1$), часть — под осью ($S_2$). Что равно $S_1 - S_2$?
        opts: ['Перемещение (координата)', 'Путь', 'Ускорение', 'Средняя скорость']
        ans: a
        hint: Площадь под осью соответствует движению в обратную сторону.
        explain: 'В конспекте: путь $L = S_1 + S_2$; перемещение или координата $S = S_1 - S_2$.'
        f: [3]
        src: p07R

# ───────────────────────────────────────────────────────────────
  - id: kin-fall-down
    title: Ускорение свободного падения. Бросок вниз и свободное падение
    pages: [p08L, p08R]
    theory:
      - kind: text
        title: Ускорение свободного падения
        fig: free-fall
        body: '$g$ — ускорение свободного падения. $g = 9{,}81$ м/с² — для Парижа; $g = 9{,}78 \div 9{,}84$ м/с² (на экваторе … на полюсах); в расчётах $g = 10$ м/с². Вектор $\vec g$ направлен вниз, к поверхности Земли.'
        src: p08L
        errata: [E03]
      - kind: rule
        title: Когда υ₀ = 0
        body: Формулировки «тело отпустили», «свободное падение» означают $\upsilon_0 = 0$.
        src: p08R
    formulas:
      - title: Скорость при броске вниз
        tex: '\upsilon = \upsilon_0 + gt'
        sym: [v, v0, g, t]
        cond: бросок вертикально вниз
        src: p08L
      - title: Высота при броске вниз
        tex: 'h = \upsilon_0 t + \frac{gt^2}{2},\qquad h = \frac{\upsilon^2 - \upsilon_0^2}{2g}'
        sym: [h, v0, v, g, t]
        cond: бросок вертикально вниз
        src: p08L
      - title: Путь за n-ю секунду при броске вниз
        tex: 'h_{n} = \upsilon_0 + \frac{g}{2}(2n - 1)'
        sym: [h_n, v0, g, n_sec]
        src: p08L
      - title: Высота в момент t
        tex: 'y = H - \upsilon_0 t - \frac{g}{2}t^2'
        sym: [y, H, v0, g, t]
        cond: бросок вертикально вниз с высоты H
        boxed: true
        src: p08L
      - title: Время падения
        tex: 't = \frac{-\upsilon_0 + \sqrt{\upsilon_0^2 + 2gH}}{g}'
        sym: [t, v0, g, H]
        cond: 'бросок вниз; получено из условия \(y = 0\)'
        boxed: true
        src: p08L
      - title: Скорость падения на землю
        tex: '\upsilon = \sqrt{\upsilon_0^2 + 2gH}'
        sym: [v, v0, g, H]
        cond: бросок вниз; конечная скорость
        boxed: true
        src: p08R
      - title: Свободное падение
        tex: '\upsilon = gt,\qquad h = \frac{gt^2}{2},\qquad h = \frac{\upsilon^2}{2g},\qquad h_{n} = \frac{g}{2}(2n-1)'
        sym: [v, g, t, h, h_n, n_sec]
        cond: '\(\upsilon_0 = 0\)'
        src: p08R
      - title: Время и скорость свободного падения с высоты H
        tex: 't = \sqrt{\frac{2H}{g}},\qquad \upsilon = \sqrt{2gH}'
        sym: [t, H, g, v]
        cond: '\(\upsilon_0 = 0\)'
        src: p08R
      - title: Время падения по последнему участку
        tex: 't = \frac{\Delta h}{g\,\Delta t} + \frac{\Delta t}{2}'
        sym: [t, dh, dt, g]
        cond: 'свободное падение; последний участок \(\Delta h\) пройден за \(\Delta t\)'
        boxed: true
        src: p08R
    examples:
      - title: Вывод времени падения по последнему участку
        steps: ['$H = \frac{gt^2}{2}$', '$H - \Delta h = \frac{g(t-\Delta t)^2}{2}$', '$\frac{gt^2}{2} - \Delta h = \frac{gt^2}{2} - gt\Delta t + \frac{g\Delta t^2}{2}$', '$\Delta h + \frac{g\Delta t^2}{2} = gt\Delta t$', '$t = \frac{\Delta h}{g\Delta t} + \frac{\Delta t}{2}$']
        src: p08R
    questions:
      - type: numeric
        cat: problem
        q: Тело свободно падает с высоты 80 м. Найдите время падения ($g = 10$ м/с²).
        num: { value: 4, unit: 'с', check: 'Math.sqrt(2*80/10)' }
        hint: «Свободно падает» — значит $\upsilon_0 = 0$.
        explain: 'Время свободного падения $t = \sqrt{2H/g}$.'
        f: [8]
        sol: { given: ['H = 80 м', 'υ₀ = 0', 'g = 10 м/с²'], find: 't', formula: 't = \sqrt{\frac{2H}{g}}', calc: 't = \sqrt{\frac{160}{10}} = 4', answer: '4 с' }
        src: p08R
      - type: numeric
        cat: problem
        q: Тело отпустили с высоты 45 м. С какой скоростью оно упадёт на землю ($g = 10$ м/с²)?
        num: { value: 30, unit: 'м/с', check: 'Math.sqrt(2*10*45)' }
        hint: «Тело отпустили» — $\upsilon_0 = 0$.
        explain: 'Скорость свободного падения $\upsilon = \sqrt{2gH}$.'
        f: [8]
        sol: { given: ['H = 45 м', 'υ₀ = 0'], find: 'υ', formula: '\upsilon = \sqrt{2gH}', calc: '\upsilon = \sqrt{2\cdot10\cdot45} = \sqrt{900} = 30', answer: '30 м/с' }
        src: p08R
      - type: numeric
        cat: problem
        q: Тело бросили вертикально вниз с высоты 40 м со скоростью 10 м/с. С какой скоростью оно упадёт на землю ($g = 10$ м/с²)?
        num: { value: 30, unit: 'м/с', check: 'Math.sqrt(100+2*10*40)' }
        hint: Начальная скорость не равна нулю — используйте формулу конечной скорости броска вниз.
        explain: Формула из рамки на стр. 8R.
        f: [6]
        sol: { given: ['H = 40 м', 'υ₀ = 10 м/с'], find: 'υ', formula: '\upsilon = \sqrt{\upsilon_0^2+2gH}', calc: '\upsilon = \sqrt{100+800} = 30', answer: '30 м/с' }
        src: p08R
      - type: numeric
        cat: problem
        q: Тело бросили вертикально вниз с высоты 40 м со скоростью 10 м/с. За какое время оно упадёт ($g = 10$ м/с²)?
        num: { value: 2, unit: 'с', check: '(-10+Math.sqrt(100+2*10*40))/10' }
        hint: Время падения получено в конспекте из условия $y = 0$.
        explain: Подставляем в формулу времени падения.
        f: [5]
        sol: { given: ['H = 40 м', 'υ₀ = 10 м/с'], find: 't', formula: 't = \frac{-\upsilon_0+\sqrt{\upsilon_0^2+2gH}}{g}', calc: 't = \frac{-10+\sqrt{900}}{10} = \frac{20}{10} = 2', answer: '2 с' }
        src: p08L
      - type: numeric
        cat: problem
        q: Какой путь проходит свободно падающее тело за **третью** секунду падения ($g = 10$ м/с²)?
        num: { value: 25, unit: 'м', check: '10/2*(2*3-1)' }
        hint: Для свободного падения $h_n = \frac{g}{2}(2n-1)$.
        explain: 'Проверка: $h(3) - h(2) = 45 - 20 = 25$ м.'
        f: [7]
        sol: { given: ['n = 3', 'υ₀ = 0'], find: 'h₃', formula: 'h_{n} = \frac{g}{2}(2n-1)', calc: 'h_{3} = 5\cdot(6-1) = 25', answer: '25 м' }
        src: p08R
      - type: numeric
        cat: problem
        q: Последние 35 м свободно падающее тело пролетело за 1 с. Сколько всего длилось падение ($g = 10$ м/с²)?
        num: { value: 4, unit: 'с', check: '35/(10*1)+1/2' }
        hint: В конспекте выведена формула времени падения через последний участок $\Delta h$ и интервал $\Delta t$.
        explain: 'Проверка: за 4 с тело пролетит 80 м, за 3 с — 45 м; разница 35 м.'
        f: [9]
        sol: { given: ['Δh = 35 м', 'Δt = 1 с'], find: 't', formula: 't = \frac{\Delta h}{g\Delta t} + \frac{\Delta t}{2}', calc: 't = \frac{35}{10\cdot1} + 0{,}5 = 4', answer: '4 с' }
        src: p08R
      - type: multiple
        cat: theory
        q: Какие формулировки в условии означают, что начальная скорость равна нулю? Выберите все.
        opts: ['«тело отпустили»', '«свободное падение»', '«тело бросили вниз»', '«тело бросили вертикально вверх»']
        ans: [a, b]
        hint: Бросок всегда сообщает телу начальную скорость.
        explain: В конспекте для $\upsilon_0 = 0$ указаны формулировки «тело отпустили» и «свободное падение».
        src: p08R

# ───────────────────────────────────────────────────────────────
  - id: kin-throw-up
    title: Бросок тела вертикально вверх
    pages: [p09L, p09R]
    theory:
      - kind: text
        title: Подъём и падение
        fig: throw-up
        body: 'Ускорение $a = g$ направлено вниз, $\upsilon_0$ — вверх. Скорость уменьшается (например 30 → 20 → 10 → 0); в верхней точке $\upsilon = 0$; затем тело падает, и скорость растёт (10 → 20 → 30). Время подъёма равно времени падения.'
        src: p09L
      - kind: rule
        title: Путь и перемещение
        body: 'При $t \le t_{под}$: $h = S = L$. При $t \ge t_{под}$: $h = S \ne L$ (путь больше модуля перемещения). Обозначения: под. — подъём; пад. — падение; пол. — полёт.'
        src: p09L
    formulas:
      - title: Скорость при броске вверх
        tex: '\upsilon = \upsilon_0 - gt'
        sym: [v, v0, g, t]
        src: p09L
      - title: Высота при броске вверх
        tex: 'h = \upsilon_0 t - \frac{gt^2}{2},\qquad h = \frac{\upsilon_0^2 - \upsilon^2}{2g}'
        sym: [h, v0, g, t, v]
        src: p09L
      - title: Путь за n-ю секунду при броске вверх
        tex: 'h_{n} = \upsilon_0 - \frac{g}{2}(2n - 1)'
        sym: [h_n, v0, g, n_sec]
        src: p09L
      - title: Время подъёма
        tex: 't_{под} = \frac{\upsilon_0}{g}'
        sym: [t_up, v0, g]
        src: p09L
      - title: Максимальная высота
        tex: 'H_{max} = \frac{\upsilon_0^2}{2g}'
        sym: [H_max, v0, g]
        boxed: true
        src: p09L
      - title: Время полёта
        tex: 't_{под} = t_{пад},\qquad t_{пол} = \frac{2\upsilon_0}{g}'
        sym: [t_up, t_fall, t_fl, v0, g]
        boxed: true
        src: p09L
      - title: Время встречи двух тел
        tex: 't = \frac{\upsilon_0}{g} + \frac{\Delta t}{2}'
        sym: [t, v0, g, dt]
        cond: 'два тела брошены из одной точки вверх с одинаковой \(\upsilon_0\) с интервалом \(\Delta t\); t — время полёта первого тела'
        boxed: true
        src: p09R
      - title: Высота встречи
        tex: 'h = \frac{\upsilon_0^2}{2g} - \frac{g\left(\frac{\Delta t}{2}\right)^2}{2}'
        sym: [h, v0, g, dt]
        cond: то же
        boxed: true
        src: p09R
      - title: Скорость первого тела при встрече
        tex: '\upsilon = -g\frac{\Delta t}{2}'
        sym: [v, g, dt]
        cond: то же
        boxed: true
        src: p09R
      - title: Относительная скорость при встрече
        tex: '\upsilon_{от} = g\,\Delta t'
        sym: [v_rel, g, dt]
        cond: то же
        boxed: true
        src: p09R
      - title: Разность путей
        tex: '\Delta L = \frac{g\,\Delta t^2}{4}'
        sym: [dL, g, dt]
        cond: то же
        boxed: true
        src: p09R
    examples:
      - title: Вывод времени встречи двух тел
        steps: ['$\Delta t = t_1 - t_2$', '$y_1 = \upsilon_0 t_1 - \frac{gt_1^2}{2}$, $y_2 = \upsilon_0 t_2 - \frac{gt_2^2}{2}$', '$y_1 = y_2$: $\upsilon_0 t - \frac{gt^2}{2} = \upsilon_0(t-\Delta t) - \frac{g(t-\Delta t)^2}{2}$', '$t = \frac{\upsilon_0}{g} + \frac{\Delta t}{2}$']
        src: p09R
    questions:
      - type: numeric
        cat: problem
        q: Тело брошено вертикально вверх со скоростью 30 м/с. Найдите максимальную высоту подъёма ($g = 10$ м/с²).
        num: { value: 45, unit: 'м', check: '30*30/(2*10)' }
        hint: В верхней точке скорость равна нулю.
        explain: 'Формула в рамке: $H_{max} = \frac{\upsilon_0^2}{2g}$.'
        f: [5]
        sol: { given: ['υ₀ = 30 м/с'], find: 'Hmax', formula: 'H_{max} = \frac{\upsilon_0^2}{2g}', calc: 'H_{max} = \frac{900}{20} = 45', answer: '45 м' }
        src: p09L
      - type: numeric
        cat: problem
        q: Тело брошено вертикально вверх со скоростью 30 м/с. Через сколько секунд оно вернётся в точку броска?
        num: { value: 6, unit: 'с', check: '2*30/10' }
        hint: Время подъёма равно времени падения.
        explain: '$t_{пол} = 2t_{под} = \frac{2\upsilon_0}{g}$.'
        f: [6]
        sol: { given: ['υ₀ = 30 м/с'], find: 'tпол', formula: 't_{пол} = \frac{2\upsilon_0}{g}', calc: 't_{пол} = \frac{60}{10} = 6', answer: '6 с' }
        src: p09L
      - type: numeric
        cat: problem
        q: Тело брошено вертикально вверх со скоростью 30 м/с. Найдите его скорость через 2 с.
        num: { value: 10, unit: 'м/с', check: '30-10*2' }
        hint: При броске вверх скорость уменьшается на $g$ каждую секунду.
        explain: '$\upsilon = \upsilon_0 - gt$.'
        f: [1]
        sol: { given: ['υ₀ = 30 м/с', 't = 2 с'], find: 'υ', formula: '\upsilon = \upsilon_0 - gt', calc: '\upsilon = 30 - 20 = 10', answer: '10 м/с' }
        src: p09L
      - type: numeric
        cat: problem
        q: Из одной точки вертикально вверх с одинаковой скоростью 30 м/с бросили два тела с интервалом 2 с. Через сколько секунд после броска **первого** тела они встретятся?
        num: { value: 4, unit: 'с', check: '30/10+2/2' }
        hint: В конспекте выведена формула времени встречи первого брошенного тела.
        explain: 'Проверка: $y_1(4) = 120 - 80 = 40$ м, $y_2(2) = 60 - 20 = 40$ м.'
        f: [7]
        sol: { given: ['υ₀ = 30 м/с', 'Δt = 2 с'], find: 't', formula: 't = \frac{\upsilon_0}{g} + \frac{\Delta t}{2}', calc: 't = 3 + 1 = 4', answer: '4 с' }
        src: p09R
      - type: numeric
        cat: problem
        q: В условиях предыдущей задачи (υ₀ = 30 м/с, Δt = 2 с) найдите высоту встречи.
        num: { value: 40, unit: 'м', check: '900/20-10*1*1/2' }
        hint: Используйте формулу высоты встречи из рамки.
        explain: Формула высоты встречи со стр. 9R.
        f: [8]
        sol: { given: ['υ₀ = 30 м/с', 'Δt = 2 с'], find: 'h', formula: 'h = \frac{\upsilon_0^2}{2g} - \frac{g(\Delta t/2)^2}{2}', calc: 'h = 45 - \frac{10\cdot1}{2} = 40', answer: '40 м' }
        src: p09R
      - type: numeric
        cat: problem
        q: Два тела брошены вверх из одной точки с интервалом 2 с. Найдите их относительную скорость в момент встречи ($g = 10$ м/с²).
        num: { value: 20, unit: 'м/с', check: '10*2' }
        hint: Относительная скорость при встрече не зависит от $\upsilon_0$.
        explain: '$\upsilon_{от} = g\Delta t$.'
        f: [10]
        sol: { given: ['Δt = 2 с'], find: 'υот', formula: '\upsilon_{от} = g\Delta t', calc: '\upsilon_{от} = 10\cdot2 = 20', answer: '20 м/с' }
        src: p09R
      - type: single
        cat: theory
        q: В какой момент путь тела, брошенного вверх, перестаёт совпадать с модулем перемещения?
        opts: ['После верхней точки ($t > t_{под}$)', 'Сразу после броска', 'Никогда', 'Только при падении на землю']
        ans: a
        hint: Пока тело движется в одну сторону, путь равен модулю перемещения.
        explain: 'В конспекте: при $t \le t_{под}$ $h = S = L$; при $t \ge t_{под}$ $h = S \ne L$.'
        src: p09L

# ───────────────────────────────────────────────────────────────
  - id: kin-circle
    title: Равномерное движение по окружности
    pages: [p10L, p10R, p11L]
    theory:
      - kind: text
        title: Обозначения
        body: '$R$ — радиус; $d$ — диаметр; $\varphi$ — угол [рад, °]; $\breve l$ — дуга. $\pi = 3{,}14$ рад $= 180°$; $1$ рад $= 57{,}29°$.'
        src: [p10L, p10R]
      - kind: definition
        title: Период и частота
        body: '**Период** $T$ — время, затраченное на один оборот [с]. **Частота** $\nu$ — количество оборотов за единицу времени [Гц; 1/с; с⁻¹]. Период и частота являются взаимно обратными параметрами.'
        src: [p10L, p10R]
      - kind: definition
        title: Угловая и линейная скорость
        fig: circle-motion
        body: '**Угловая скорость** — это угол поворота за единицу времени [рад/с]. **Линейная скорость** направлена по касательной к траектории.'
        src: p10R
    formulas:
      - title: Диаметр, длина окружности, дуга
        tex: 'd = 2R,\qquad l = 2\pi R,\qquad \breve l = \varphi R'
        sym: [d, R, l_circ, l_arc, phi]
        src: p10L
      - title: Период
        tex: 'T = \frac{t}{n}'
        sym: [T, t, n_rev]
        cond: '\(\upsilon = \text{const}\)'
        src: p10L
      - title: Частота
        tex: '\nu = \frac{n}{t}'
        sym: [nu, n_rev, t]
        src: p10L
      - title: Путь за n оборотов
        tex: 'S = n\,l'
        sym: [S, n_rev, l_circ]
        src: p10L
      - title: Связь периода и частоты
        tex: 'T\cdot\nu = 1,\qquad T = \frac{1}{\nu},\qquad \nu = \frac{1}{T}'
        sym: [T, nu]
        src: p10R
      - title: Угловая скорость
        tex: '\omega = \frac{\varphi}{t}'
        sym: [omega, phi, t]
        src: p10R
      - title: Линейная скорость
        tex: '\upsilon = \frac{l}{t}'
        sym: [v, l_circ, t]
        src: p10R
      - title: Угловая скорость через период и частоту
        tex: '\omega = \frac{2\pi}{T},\qquad \omega = 2\pi\nu'
        sym: [omega, T, nu]
        src: p10R
      - title: Связь угловой и линейной скорости
        tex: '\omega = \frac{\upsilon}{R},\qquad \upsilon = \omega R'
        sym: [omega, v, R]
        src: [p10R, p11L]
      - title: Линейная скорость через период и частоту
        tex: '\upsilon = \frac{2\pi R n}{t},\qquad \upsilon = 2\pi R\nu,\qquad \upsilon = \frac{2\pi R}{T}'
        sym: [v, R, n_rev, t, nu, T]
        src: p11L
      - title: Формула из рамки (контекст не указан)
        tex: '\upsilon = \frac{2\pi R}{T}\cos\alpha'
        sym: [v, R, T]
        boxed: true
        manual: true
        src: p11L
        errata: [E04]
    questions:
      - type: numeric
        cat: problem
        q: Колесо делает 120 оборотов за 60 с. Найдите период вращения.
        num: { value: 0.5, unit: 'с', check: '60/120' }
        hint: Период — время одного оборота.
        explain: '$T = t/n$.'
        f: [2]
        sol: { given: ['n = 120', 't = 60 с'], find: 'T', formula: 'T = \frac{t}{n}', calc: 'T = \frac{60}{120} = 0{,}5', answer: '0,5 с' }
        src: p10L
      - type: numeric
        cat: problem
        q: Колесо делает 120 оборотов за 60 с. Найдите частоту вращения.
        num: { value: 2, unit: 'Гц', check: '120/60' }
        hint: Частота — число оборотов за единицу времени.
        explain: '$\nu = n/t$.'
        f: [3]
        sol: { given: ['n = 120', 't = 60 с'], find: 'ν', formula: '\nu = \frac{n}{t}', calc: '\nu = \frac{120}{60} = 2', answer: '2 Гц' }
        src: p10L
      - type: numeric
        cat: problem
        q: Точка движется по окружности радиусом 0,5 м с частотой 2 Гц. Найдите линейную скорость (π = 3,14).
        num: { value: 6.28, unit: 'м/с', check: '2*3.14*0.5*2' }
        hint: Есть формула линейной скорости через радиус и частоту.
        explain: '$\upsilon = 2\pi R\nu$.'
        f: [10]
        sol: { given: ['R = 0,5 м', 'ν = 2 Гц'], find: 'υ', formula: '\upsilon = 2\pi R\nu', calc: '\upsilon = 2\cdot3{,}14\cdot0{,}5\cdot2 = 6{,}28', answer: '6,28 м/с' }
        src: p11L
      - type: numeric
        cat: problem
        q: Период вращения 2 с. Найдите угловую скорость (π = 3,14).
        num: { value: 3.14, unit: 'рад/с', check: '2*3.14/2' }
        hint: За один период тело поворачивается на угол $2\pi$.
        explain: '$\omega = \frac{2\pi}{T}$.'
        f: [8]
        sol: { given: ['T = 2 с'], find: 'ω', formula: '\omega = \frac{2\pi}{T}', calc: '\omega = \frac{2\cdot3{,}14}{2} = 3{,}14', answer: '3,14 рад/с' }
        src: p10R
      - type: single
        cat: theory
        q: Как направлена линейная скорость при движении по окружности?
        opts: ['По касательной к траектории', 'К центру окружности', 'От центра окружности', 'Вдоль радиуса']
        ans: a
        hint: Вспомните определение линейной скорости в конспекте.
        explain: Линейная скорость направлена по касательной к траектории.
        src: p10R
      - type: matching
        cat: formula
        q: Сопоставьте обозначение и величину.
        pairs:
          - ['$T$', 'Период']
          - ['$\nu$', 'Частота']
          - ['$\omega$', 'Угловая скорость']
          - ['$\varphi$', 'Угол поворота']
        hint: Частоту в конспекте обозначают греческой буквой «ню».
        explain: '$T$ — период [с], $\nu$ — частота [Гц], $\omega$ — угловая скорость [рад/с], $\varphi$ — угол [рад].'
        src: [p10L, p10R]

# ───────────────────────────────────────────────────────────────
  - id: kin-centripetal
    title: Центростремительное ускорение. Передача вращения
    pages: [p11L, p11R, p12L]
    theory:
      - kind: text
        title: Почему есть ускорение
        fig: cp-accel
        body: 'В круговом движении скорость направлена по касательной. Значение скорости постоянно ($\upsilon = \text{const}$), но направление меняется ($\vec\upsilon \ne \text{const}$) ⇒ возникает нормальное (центростремительное) ускорение $a_н$, направленное к центру.'
        src: p11L
      - kind: text
        title: Диск
        body: 'Для точек одного диска на разных расстояниях от центра ($R_2 > R_1$): $\upsilon_2 > \upsilon_1$, а угловая скорость одинакова: $\omega = \omega_1 = \omega_2$.'
        src: p11R
      - kind: list
        title: Передача движения
        fig: belt-drive
        body: |
          1) **Концентрическая** (колёса на одной оси): $R_3 > R_2 > R_1$ ⇒ $\upsilon_3 > \upsilon_2 > \upsilon_1$, $a_3 > a_2 > a_1$.
          2) **Ленточная** (два шкива связаны лентой): $R_1 < R_2$ ⇒ $\omega_1 > \omega_2$, $a_1 > a_2$, $\upsilon_1 = \upsilon_2$.
          3) **Зубчатая** (шестерни в зацеплении): $\upsilon_1 = \upsilon_2$; число зубчиков $N \sim R$.
        src: [p11R, p12L]
    formulas:
      - title: Нормальное (центростремительное) ускорение
        tex: 'a_н = \frac{\upsilon^2}{R} = \omega^2 R = \omega\upsilon = \frac{4\pi^2}{T^2}R = 4\pi^2\nu^2 R'
        sym: [a_n, v, R, omega, T, nu]
        src: p11L
      - title: Изменение скорости при повороте
        tex: '\Delta\upsilon = 2\upsilon\sin\frac{\varphi}{2}'
        sym: [dv, v, phi]
        cond: 'полный оборот: \(\Delta\upsilon = 0\); ½ оборота: \(2\upsilon\); ¼ оборота: \(\sqrt2\,\upsilon\)'
        boxed: true
        src: p11L
      - title: Точки одного диска
        tex: '\frac{\upsilon_1}{R_1} = \frac{\upsilon_2}{R_2} = \frac{\upsilon_2 \pm \upsilon_1}{R_2 \pm R_1}'
        sym: [v, R]
        src: p11R
      - title: Ленточная передача
        tex: '\upsilon_1 = \upsilon_2,\qquad \omega_1 R_1 = \omega_2 R_2'
        sym: [v, omega, R]
        boxed: true
        src: p11R
      - title: Зубчатая передача
        tex: '\omega_1 N_1 = \omega_2 N_2'
        sym: [omega, N_teeth]
        boxed: true
        src: p12L
    questions:
      - type: numeric
        cat: problem
        q: Автомобиль движется по закруглению радиусом 20 м со скоростью 10 м/с. Найдите центростремительное ускорение.
        num: { value: 5, unit: 'м/с²', check: '10*10/20' }
        hint: '$a_н = \frac{\upsilon^2}{R}$.'
        explain: Нормальное ускорение через линейную скорость и радиус.
        f: [1]
        sol: { given: ['υ = 10 м/с', 'R = 20 м'], find: 'aн', formula: 'a_н = \frac{\upsilon^2}{R}', calc: 'a_н = \frac{100}{20} = 5', answer: '5 м/с²' }
        src: p11L
      - type: numeric
        cat: problem
        q: Тело движется по окружности со скоростью 10 м/с. Найдите модуль изменения скорости за четверть оборота.
        num: { value: 14.14, unit: 'м/с', check: '2*10*Math.sin(Math.PI/4)' }
        hint: 'За ¼ оборота угол $\varphi = 90°$.'
        explain: 'По конспекту за ¼ оборота $\Delta\upsilon = \sqrt2\,\upsilon$.'
        f: [2]
        sol: { given: ['υ = 10 м/с', 'φ = 90°'], find: 'Δυ', formula: '\Delta\upsilon = 2\upsilon\sin\frac{\varphi}{2}', calc: '\Delta\upsilon = 2\cdot10\cdot\sin45° = 10\sqrt2 \approx 14{,}14', answer: '≈ 14,1 м/с' }
        src: p11L
      - type: numeric
        cat: problem
        q: Тело движется по окружности со скоростью 5 м/с. Найдите модуль изменения скорости за половину оборота.
        num: { value: 10, unit: 'м/с', check: '2*5*Math.sin(Math.PI/2)' }
        hint: За ½ оборота скорость меняет направление на противоположное.
        explain: 'За ½ оборота ($\varphi = 180°$) $\Delta\upsilon = 2\upsilon$.'
        f: [2]
        sol: { given: ['υ = 5 м/с', 'φ = 180°'], find: 'Δυ', formula: '\Delta\upsilon = 2\upsilon\sin\frac{\varphi}{2}', calc: '\Delta\upsilon = 2\cdot5\cdot1 = 10', answer: '10 м/с' }
        src: p11L
      - type: single
        cat: theory
        q: Ленточная передача, радиус первого шкива меньше второго ($R_1 < R_2$). Что верно?
        opts: ['$\upsilon_1 = \upsilon_2$, $\omega_1 > \omega_2$', '$\omega_1 = \omega_2$, $\upsilon_1 < \upsilon_2$', '$\upsilon_1 > \upsilon_2$, $\omega_1 = \omega_2$', '$\upsilon_1 < \upsilon_2$, $\omega_1 < \omega_2$']
        ans: a
        hint: Лента движется как одно целое — что тогда одинаково у точек обода обоих шкивов?
        explain: 'Для ленточной передачи $\upsilon_1 = \upsilon_2$ и $\omega_1 R_1 = \omega_2 R_2$; меньший шкив вращается быстрее: $\omega_1 > \omega_2$.'
        f: [4]
        src: p11R
      - type: numeric
        cat: problem
        q: Шестерня с 20 зубцами вращается с угловой скоростью 30 рад/с и вращает шестерню с 60 зубцами. Найдите угловую скорость второй шестерни.
        num: { value: 10, unit: 'рад/с', check: '30*20/60' }
        hint: Для зубчатой передачи в конспекте записано соотношение через число зубчиков.
        explain: '$\omega_1 N_1 = \omega_2 N_2$.'
        f: [5]
        sol: { given: ['N₁ = 20', 'ω₁ = 30 рад/с', 'N₂ = 60'], find: 'ω₂', formula: '\omega_1 N_1 = \omega_2 N_2', calc: '\omega_2 = \frac{30\cdot20}{60} = 10', answer: '10 рад/с' }
        src: p12L
      - type: single
        cat: theory
        q: Две точки находятся на одном вращающемся диске на разных расстояниях от центра. Что у них одинаково?
        opts: ['Угловая скорость', 'Линейная скорость', 'Центростремительное ускорение', 'Длина пройденной дуги']
        ans: a
        hint: За одно и то же время обе точки поворачиваются на один и тот же угол.
        explain: 'В конспекте: $\omega = \omega_1 = \omega_2$, а $\upsilon_2 > \upsilon_1$ при $R_2 > R_1$.'
        src: p11R

# ───────────────────────────────────────────────────────────────
  - id: kin-horizontal
    title: Горизонтальный бросок
    pages: [p40R, p41L]
    theory:
      - kind: text
        title: Характер движения
        body: 'Горизонтальный бросок — неравномерное криволинейное движение; траектория — парабола. По горизонтали: $\upsilon_{0x} = \upsilon_0$, $a_x = 0$ — равномерно. По вертикали: $\upsilon_{0y} = 0$, $a_y = -g$ — равноускоренно.'
        src: p40R
      - kind: rule
        title: Время падения не зависит от скорости
        fig: horizontal
        body: 'Тела, брошенные горизонтально с одной высоты с разными скоростями (например, 0, 20 и 50 м/с), падают одновременно: $t_1 = t_2 = t_3$. $t \sim \sqrt h$, $t$ не зависит от $\upsilon$.'
        src: p41L
    formulas:
      - title: Проекции скорости
        tex: '\upsilon_x = \upsilon_0 = \text{const},\qquad \upsilon_y = -gt'
        sym: [vxy, v0, g, t]
        boxed: true
        src: p40R
      - title: Мгновенная скорость
        tex: '\upsilon = \sqrt{\upsilon_x^2 + \upsilon_y^2},\qquad \upsilon(t) = \sqrt{\upsilon_0^2 + g^2t^2}'
        sym: [v, vxy, v0, g, t]
        src: p41L
      - title: Угол между скоростью и горизонтом
        tex: '\sin\beta = \frac{\upsilon_y}{\upsilon} = \frac{gt}{\upsilon},\quad \cos\beta = \frac{\upsilon_x}{\upsilon} = \frac{\upsilon_0}{\upsilon},\quad \operatorname{tg}\beta = \frac{\upsilon_y}{\upsilon_x} = \frac{gt}{\upsilon_0}'
        sym: [beta, vxy, v, g, t, v0]
        src: p41L
      - title: Время падения
        tex: 'h = \frac{gt^2}{2},\qquad t = \sqrt{\frac{2h}{g}}'
        sym: [h, g, t]
        boxed: true
        src: p41L
      - title: Дальность полёта
        tex: 'L = \upsilon_0 t,\qquad L = \upsilon_0\sqrt{\frac{2h}{g}}'
        sym: [L_range, v0, t, h, g]
        boxed: true
        src: p41L
    questions:
      - type: numeric
        cat: problem
        q: С высоты 20 м горизонтально брошено тело со скоростью 15 м/с. Через сколько секунд оно упадёт ($g = 10$ м/с²)?
        num: { value: 2, unit: 'с', check: 'Math.sqrt(2*20/10)' }
        hint: Время падения зависит только от высоты.
        explain: '$t = \sqrt{2h/g}$ — та же формула, что для свободного падения.'
        f: [4]
        sol: { given: ['h = 20 м', 'υ₀ = 15 м/с'], find: 't', formula: 't = \sqrt{\frac{2h}{g}}', calc: 't = \sqrt{\frac{40}{10}} = 2', answer: '2 с' }
        src: p41L
      - type: numeric
        cat: problem
        q: С высоты 20 м горизонтально брошено тело со скоростью 15 м/с. Найдите дальность полёта.
        num: { value: 30, unit: 'м', check: '15*Math.sqrt(2*20/10)' }
        hint: По горизонтали тело движется равномерно всё время падения.
        explain: '$L = \upsilon_0\sqrt{2h/g}$.'
        f: [5]
        sol: { given: ['h = 20 м', 'υ₀ = 15 м/с'], find: 'L', formula: 'L = \upsilon_0\sqrt{\frac{2h}{g}}', calc: 'L = 15\cdot2 = 30', answer: '30 м' }
        src: p41L
      - type: numeric
        cat: problem
        q: Тело брошено горизонтально со скоростью 15 м/с. Найдите модуль его скорости через 2 с ($g = 10$ м/с²).
        num: { value: 25, unit: 'м/с', check: 'Math.sqrt(15*15+100*4)' }
        hint: Сложите горизонтальную и вертикальную составляющие по теореме Пифагора.
        explain: '$\upsilon(t) = \sqrt{\upsilon_0^2 + g^2t^2}$.'
        f: [2]
        sol: { given: ['υ₀ = 15 м/с', 't = 2 с'], find: 'υ', formula: '\upsilon = \sqrt{\upsilon_0^2+g^2t^2}', calc: '\upsilon = \sqrt{225+400} = 25', answer: '25 м/с' }
        src: p41L
      - type: numeric
        cat: problem
        q: Тело брошено горизонтально со скоростью 10 м/с. Под каким углом к горизонту направлена его скорость через 1 с ($g = 10$ м/с²)? Ответ в градусах.
        num: { value: 45, unit: '°', check: 'Math.atan(10*1/10)*180/Math.PI' }
        hint: '$\operatorname{tg}\beta = \frac{gt}{\upsilon_0}$.'
        explain: '$\operatorname{tg}\beta = 1$ ⇒ $\beta = 45°$.'
        f: [3]
        sol: { given: ['υ₀ = 10 м/с', 't = 1 с'], find: 'β', formula: '\operatorname{tg}\beta = \frac{gt}{\upsilon_0}', calc: '\operatorname{tg}\beta = \frac{10}{10} = 1 \Rightarrow \beta = 45°', answer: '45°' }
        src: p41L
      - type: single
        cat: theory
        q: С одной высоты одновременно горизонтально бросили три тела со скоростями 0, 20 и 50 м/с. Какое упадёт первым?
        opts: ['Все упадут одновременно', 'Тело со скоростью 0', 'Тело со скоростью 50 м/с', 'Тело со скоростью 20 м/с']
        ans: a
        hint: От чего зависит время падения при горизонтальном броске?
        explain: 'Время падения $t = \sqrt{2h/g}$ не зависит от горизонтальной скорости: $t_1 = t_2 = t_3$.'
        f: [4]
        src: p41L
      - type: single
        cat: theory
        q: Как движется тело, брошенное горизонтально, вдоль горизонтальной оси?
        opts: ['Равномерно ($a_x = 0$)', 'Равноускоренно ($a_x = g$)', 'Равнозамедленно', 'Не движется']
        ans: a
        hint: Какая проекция ускорения по оси x записана в конспекте?
        explain: '$a_x = 0$ — равномерно; $a_y = -g$ — равноускоренно.'
        src: p40R

# ───────────────────────────────────────────────────────────────
  - id: kin-angle
    title: Бросок под углом к горизонту
    pages: [p41L, p41R]
    theory:
      - kind: text
        title: Характер движения
        fig: projectile
        body: 'Криволинейное неравномерное движение; траектория — парабола. По горизонтали скорость постоянна (равномерное движение); вертикальная составляющая сначала уменьшается (замедляется), потом увеличивается (ускоряется).'
        src: [p41L, p41R]
      - kind: note
        title: Замечание к конспекту
        body: 'На стр. 41L записано $a_y = 0$; по смыслу должно быть $a_y = -g$ (см. замечание E16). Также в рамке на стр. 41R пропущен корень в формуле модуля скорости (E17).'
        src: [p41L, p41R]
        errata: [E16, E17]
      - kind: text
        title: Два момента с одинаковым углом
        body: 'Угол β между скоростью и горизонтом одинаков в два момента: $t_1$ (знак «−») — при подъёме, $t_2$ (знак «+») — при падении.'
        src: p41R
    formulas:
      - title: Проекции начальной скорости
        tex: '\upsilon_{0x} = \upsilon_0\cos\alpha,\qquad \upsilon_{0y} = \upsilon_0\sin\alpha'
        sym: [v0xy, v0]
        boxed: true
        src: p41L
      - title: Проекции скорости в момент t
        tex: '\upsilon_x = \upsilon_0\cos\alpha = \text{const},\qquad \upsilon_y = \upsilon_0\sin\alpha - gt'
        sym: [vxy, v0, g, t]
        src: p41R
      - title: Модуль скорости
        tex: '\upsilon(t) = \sqrt{\upsilon_0^2\cos^2\alpha + (\upsilon_0\sin\alpha - gt)^2}'
        sym: [v, v0, g, t]
        boxed: true
        src: p41R
      - title: Угол скорости с горизонтом
        tex: '\sin\beta = \frac{\upsilon_y}{\upsilon},\quad \cos\beta = \frac{\upsilon_x}{\upsilon},\quad \operatorname{tg}\beta = \frac{\upsilon_y}{\upsilon_x}'
        sym: [beta, vxy, v]
        src: p41R
      - title: Минимальная скорость
        tex: '\upsilon_{min} = \upsilon_0\cos\alpha'
        sym: [v_min, v0]
        boxed: true
        src: p41R
      - title: Время подъёма
        tex: 't_{под} = \frac{\upsilon_0\sin\alpha}{g}'
        sym: [t_up, v0, g]
        boxed: true
        src: p41R
      - title: Время полёта
        tex: 't_{под} = t_{пад},\quad t_{пол} = 2t_{под} = \frac{2\upsilon_0\sin\alpha}{g}'
        sym: [t_up, t_fall, t_fl, v0, g]
        boxed: true
        src: p41R
      - title: Максимальная высота
        tex: 'H_{max} = \frac{\upsilon_0^2\sin^2\alpha}{2g} = \frac{g\,t_{под}^2}{2} = \frac{g\,t_{пол}^2}{8}'
        sym: [H_max, v0, g, t_up, t_fl]
        boxed: true
        src: p41R
      - title: Дальность полёта
        tex: 'L = \upsilon_0\cos\alpha\cdot t_{пол},\qquad L = \frac{\upsilon_0^2\sin2\alpha}{g}'
        sym: [L_range, v0, t_fl, g]
        boxed: true
        src: p41R
      - title: Отношение высоты к дальности
        tex: '\frac{H_{max}}{L} = \frac{\operatorname{tg}\alpha}{4}'
        sym: [H_max, L_range]
        cond: 'при \(\alpha = 45°\): \(L = 4H_{max}\)'
        boxed: true
        src: p41R
      - title: Моменты с заданным углом β
        tex: 't_{1,2} = \frac{\upsilon_0\sin\alpha \mp \operatorname{tg}\beta\cdot\upsilon_0\cos\alpha}{g}'
        sym: [beta, v0, g]
        cond: '\(t_1\) (−) — при подъёме, \(t_2\) (+) — при падении'
        boxed: true
        src: p41R
    questions:
      - type: numeric
        cat: problem
        q: Тело брошено под углом 30° к горизонту со скоростью 20 м/с. Найдите время полёта ($g = 10$ м/с²).
        num: { value: 2, unit: 'с', check: '2*20*0.5/10' }
        hint: Время полёта — удвоенное время подъёма; $\sin30° = 0{,}5$.
        explain: '$t_{пол} = \frac{2\upsilon_0\sin\alpha}{g}$.'
        f: [7]
        sol: { given: ['υ₀ = 20 м/с', 'α = 30°'], find: 'tпол', formula: 't_{пол} = \frac{2\upsilon_0\sin\alpha}{g}', calc: 't_{пол} = \frac{2\cdot20\cdot0{,}5}{10} = 2', answer: '2 с' }
        src: p41R
      - type: numeric
        cat: problem
        q: Тело брошено под углом 30° к горизонту со скоростью 20 м/с. Найдите максимальную высоту подъёма.
        num: { value: 5, unit: 'м', check: '400*0.25/20' }
        hint: '$\sin^2 30° = 0{,}25$.'
        explain: '$H_{max} = \frac{\upsilon_0^2\sin^2\alpha}{2g}$.'
        f: [8]
        sol: { given: ['υ₀ = 20 м/с', 'α = 30°'], find: 'Hmax', formula: 'H_{max} = \frac{\upsilon_0^2\sin^2\alpha}{2g}', calc: 'H_{max} = \frac{400\cdot0{,}25}{20} = 5', answer: '5 м' }
        src: p41R
      - type: numeric
        cat: problem
        q: Тело брошено под углом 30° к горизонту со скоростью 20 м/с. Найдите дальность полёта.
        num: { value: 34.64, unit: 'м', check: '400*Math.sin(Math.PI/3)/10' }
        hint: '$\sin2\alpha = \sin60° \approx 0{,}866$.'
        explain: '$L = \frac{\upsilon_0^2\sin2\alpha}{g}$.'
        f: [9]
        sol: { given: ['υ₀ = 20 м/с', 'α = 30°'], find: 'L', formula: 'L = \frac{\upsilon_0^2\sin2\alpha}{g}', calc: 'L = \frac{400\cdot0{,}866}{10} \approx 34{,}6', answer: '≈ 34,6 м' }
        src: p41R
      - type: numeric
        cat: problem
        q: Тело брошено под углом 30° к горизонту со скоростью 20 м/с. Найдите минимальную скорость за время полёта.
        num: { value: 17.32, unit: 'м/с', check: '20*Math.cos(Math.PI/6)' }
        hint: В верхней точке вертикальная составляющая скорости равна нулю.
        explain: '$\upsilon_{min} = \upsilon_0\cos\alpha$.'
        f: [5]
        sol: { given: ['υ₀ = 20 м/с', 'α = 30°'], find: 'υmin', formula: '\upsilon_{min} = \upsilon_0\cos\alpha', calc: '\upsilon_{min} = 20\cdot0{,}866 \approx 17{,}3', answer: '≈ 17,3 м/с' }
        src: p41R
      - type: single
        cat: formula
        q: Тело брошено под углом 45° к горизонту. Как связаны дальность полёта и максимальная высота?
        opts: ['$L = 4H_{max}$', '$L = H_{max}$', '$L = 2H_{max}$', '$H_{max} = 4L$']
        ans: a
        hint: '$\frac{H_{max}}{L} = \frac{\operatorname{tg}\alpha}{4}$, а $\operatorname{tg}45° = 1$.'
        explain: 'При $\alpha = 45°$: $\operatorname{tg}\alpha = 1$, $L = 4H_{max}$ — записано в конспекте.'
        f: [10]
        src: p41R
      - type: numeric
        cat: problem
        q: Тело, брошенное под углом к горизонту, находилось в полёте 4 с. Какой максимальной высоты оно достигло ($g = 10$ м/с²)?
        num: { value: 20, unit: 'м', check: '10*16/8' }
        hint: В конспекте есть формула максимальной высоты через время полёта.
        explain: '$H_{max} = \frac{g\,t_{пол}^2}{8}$.'
        f: [8]
        sol: { given: ['tпол = 4 с'], find: 'Hmax', formula: 'H_{max} = \frac{g\,t_{пол}^2}{8}', calc: 'H_{max} = \frac{10\cdot16}{8} = 20', answer: '20 м' }
        src: p41R
      - type: single
        cat: theory
        q: Как изменяется вертикальная составляющая скорости при броске под углом к горизонту?
