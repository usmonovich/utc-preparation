errata:
  - id: EM08
    page: e15
    severity: note
    original: '«Магнитный поток — это силовые линии магнитного поля, которые проходят через закрытый контур нормальным образом»'
    issue: 'Магнитный поток — физическая величина (число), а не сами линии: он показывает, сколько силовых линий проходит через контур, и считается по формуле \(\Phi = BS\cos\alpha\) со следующей страницы.'
    target: 'Определение магнитного потока'
    suggestion: 'Записать: «Магнитный поток — величина, которая показывает, сколько силовых линий проходит через контур: \(\Phi = BS\cos\alpha\)» (формула со следующей страницы).'
  - id: EM09
    page: e18
    severity: error
    original: '\(W = \frac{\Phi^2}{LI}\)'
    issue: 'Из \(W = \frac{LI^2}{2}\) и \(\Phi = LI\) (та же страница) следует \(W = \frac{\Phi^2}{2L}\). Запись \(\frac{\Phi^2}{LI}\) после подстановки \(\Phi = LI\) равна \(LI = \Phi\) — это магнитный поток (в веберах), а не энергия.'
    target: 'Энергия магнитного поля через поток'
    suggestion: '\(W = \frac{\Phi^2}{2L}\).'

topics:
  - id: ind-flux
    title: Магнитный поток
    pages: [e15, e16]
    theory:
      - kind: definition
        title: Магнитный поток
        body: Магнитный поток — это силовые линии магнитного поля, которые проходят через закрытый контур нормальным образом.
        src: e15
        errata: [EM08]
      - kind: text
        title: Формула магнитного потока
        body: '$\Phi = BS\cos\alpha$ [Вб] (вебер), где $\alpha$ — угол между $\vec B$ и нормалью $\vec n$ к контуру площадью S. Когда контур поворачивается, угол α меняется, и поток меняется вместе с ним.'
        src: e16
        fig: flux
      - kind: list
        title: Как может меняться поток
        body: '$\Delta\Phi = \Phi_2 - \Phi_1$. Меняется только B: $\Delta\Phi = \Delta B\,S\cos\alpha$. Меняется только S: $\Delta\Phi = B\,\Delta S\cos\alpha$. Меняется только угол: $\Delta\Phi = BS(\cos\alpha_2 - \cos\alpha_1)$.'
        src: e16
    formulas:
      - title: Магнитный поток
        tex: '\Phi = BS\cos\alpha\quad[\text{Вб}]'
        sym: [Phi_m, B_mag, S_area, alpha_Bn]
        boxed: true
        src: e16
      - title: Изменение потока
        tex: '\Delta\Phi = \Phi_2 - \Phi_1'
        sym: [Phi12]
        src: e16
      - title: Меняется индукция
        tex: '\Delta\Phi = \Delta B\cdot S\cos\alpha'
        sym: [B_mag, S_area, alpha_Bn]
        cond: 'B ≠ const, S = const, α = const'
        src: e16
      - title: Меняется площадь
        tex: '\Delta\Phi = B\cdot\Delta S\cdot\cos\alpha'
        sym: [B_mag, S_area, alpha_Bn]
        cond: 'B = const, S ≠ const, α = const'
        src: e16
      - title: Меняется угол
        tex: '\Delta\Phi = B\cdot S\cdot(\cos\alpha_2 - \cos\alpha_1)'
        sym: [B_mag, S_area, alpha_Bn]
        cond: 'B = const, S = const, α ≠ const'
        src: e16
    questions:
      - type: numeric
        cat: problem
        q: 'B = 0,2 Тл, площадь контура 0,5 м², линии параллельны нормали (α = 0°). Найдите магнитный поток.'
        num: { value: 0.1, unit: 'Вб', check: '0.2*0.5*Math.cos(0)' }
        hint: '$\Phi = BS\cos\alpha$, $\cos0° = 1$.'
        explain: '$\Phi = 0{,}2\cdot0{,}5 = 0{,}1$ Вб.'
        f: [1]
        sol: { given: ['B = 0,2 Тл', 'S = 0,5 м²', 'α = 0°'], find: 'Φ', formula: '\Phi = BS\cos\alpha', calc: '\Phi = 0{,}1', answer: '0,1 Вб' }
        src: e16
      - type: numeric
        cat: problem
        q: 'B = 0,4 Тл, S = 0,25 м², угол между B и нормалью 60°. Найдите магнитный поток.'
        num: { value: 0.05, unit: 'Вб', check: '0.4*0.25*Math.cos(Math.PI/3)' }
        hint: '$\cos60° = 0{,}5$.'
        explain: '$\Phi = 0{,}4\cdot0{,}25\cdot0{,}5 = 0{,}05$ Вб.'
        f: [1]
        sol: { given: ['B = 0,4 Тл', 'S = 0,25 м²', 'α = 60°'], find: 'Φ', formula: '\Phi = BS\cos\alpha', calc: '\Phi = 0{,}05', answer: '0,05 Вб' }
        src: e16
      - type: numeric
        cat: problem
        q: 'Индукция выросла с 0,1 до 0,5 Тл, S = 0,2 м², α = 0°. Найдите изменение потока.'
        num: { value: 0.08, unit: 'Вб', check: '(0.5-0.1)*0.2*1' }
        hint: '$\Delta\Phi = \Delta B\,S\cos\alpha$.'
        explain: '$\Delta\Phi = 0{,}4\cdot0{,}2 = 0{,}08$ Вб.'
        f: [3]
        sol: { given: ['B₁ = 0,1 Тл', 'B₂ = 0,5 Тл', 'S = 0,2 м²', 'α = 0°'], find: 'ΔΦ', formula: '\Delta\Phi = \Delta B\,S\cos\alpha', calc: '\Delta\Phi = 0{,}4\cdot0{,}2 = 0{,}08', answer: '0,08 Вб' }
        src: e16
      - type: numeric
        cat: problem
        q: 'Контур (B = 0,5 Тл, S = 0,2 м²) повернули: угол α изменился с 0° до 90°. Найдите изменение потока.'
        num: { value: -0.1, unit: 'Вб', check: '0.5*0.2*(Math.cos(Math.PI/2)-Math.cos(0))' }
        hint: '$\Delta\Phi = BS(\cos\alpha_2 - \cos\alpha_1)$.'
        explain: '$\Delta\Phi = 0{,}1\cdot(0 - 1) = -0{,}1$ Вб — поток уменьшился.'
        f: [5]
        sol: { given: ['B = 0,5 Тл', 'S = 0,2 м²', 'α₁ = 0°', 'α₂ = 90°'], find: 'ΔΦ', formula: '\Delta\Phi = BS(\cos\alpha_2 - \cos\alpha_1)', calc: '\Delta\Phi = 0{,}1\cdot(0 - 1) = -0{,}1', answer: '−0,1 Вб' }
        src: e16
      - type: numeric
        cat: problem
        q: 'B = 2 Тл, площадь контура увеличили с 0,1 до 0,3 м², α = 60°. Найдите изменение потока.'
        num: { value: 0.2, unit: 'Вб', check: '2*(0.3-0.1)*Math.cos(Math.PI/3)' }
        hint: '$\Delta\Phi = B\,\Delta S\cos\alpha$.'
        explain: '$\Delta\Phi = 2\cdot0{,}2\cdot0{,}5 = 0{,}2$ Вб.'
        f: [4]
        sol: { given: ['B = 2 Тл', 'ΔS = 0,2 м²', 'α = 60°'], find: 'ΔΦ', formula: '\Delta\Phi = B\,\Delta S\cos\alpha', calc: '\Delta\Phi = 0{,}2', answer: '0,2 Вб' }
        src: e16
      - type: single
        cat: formula
        q: Линии поля идут вдоль плоскости контура (α = 90°). Чему равен поток?
        opts: ['Нулю', 'BS', 'BS/2', 'Бесконечности']
        ans: a
        hint: '$\cos90° = 0$.'
        explain: '$\Phi = BS\cos90° = 0$ — линии не проходят сквозь контур.'
        f: [1]
        src: e16
      - type: single
        cat: theory
        q: В каких единицах измеряется магнитный поток?
        opts: ['Вб (вебер)', 'Тл (тесла)', 'Гн (генри)', 'А/м']
        ans: a
        hint: В квадратных скобках подписано «Вебер».
        explain: '$[\Phi]$ = Вб.'
        src: e16

# ───────────────────────────────────────────────────────────────
  - id: ind-faraday
    title: Закон Фарадея (электромагнитная индукция)
    pages: [e16, e17]
    theory:
      - kind: law
        title: Закон Фарадея
        body: 'Изменение магнитного потока является источником индукционной электродвижущей силы: $\varepsilon_и = -\frac{\Delta\Phi}{\Delta t}$. В замкнутом контуре с сопротивлением R: $\varepsilon_и = IR$.'
        src: e16
      - kind: text
        title: Опыт с магнитом и катушкой
        body: 'Магнит вдвигают в катушку: $\Phi_0 = 0$, $\Phi = 1000$, $\Delta\Phi \ne 0$ — стрелка гальванометра отклоняется. Магнит лежит в катушке: $\Phi_0 = \Phi = 1000$, $\Delta\Phi = 0$ — тока нет. Магнит вынимают: $\Phi_0 = 1000$, $\Phi = 0$ — стрелка отклоняется в другую сторону.'
        src: e16
        fig: faraday
      - kind: rule
        title: Поток меняется равномерно
        body: 'Если $\Phi(t) = kt + b$, то $\varepsilon_и = -k = \text{const}$ (на графике — горизонтальная прямая). Если $\Phi = \text{const}$, то $\varepsilon = 0$.'
        src: e17
      - kind: text
        title: Катушка из N витков
        body: '$\varepsilon_и = -N\frac{\Delta\Phi}{\Delta t}$, где N — количество витков, $\frac{\Delta\Phi}{\Delta t}$ — скорость изменения магнитного потока [Вб/с].'
        src: e17
    formulas:
      - title: Закон Фарадея
        tex: '\varepsilon_{и} = -\frac{\Delta\Phi}{\Delta t}'
        sym: [eps_i, Phi_m, dt]
        boxed: true
        src: [e16, e17]
      - title: ЭДС и ток в контуре
        tex: '\varepsilon_{и} = I\cdot R'
        sym: [eps_i, I_cur, R_res]
        src: e16
      - title: Равномерное изменение потока
        tex: '\Phi(t) = kt + b\ \Rightarrow\ \varepsilon_{и} = -k = \text{const}'
        sym: [Phi_m, k_rate, eps_i]
        boxed: true
        src: e17
      - title: Катушка из N витков
        tex: '\varepsilon_{и} = -N\frac{\Delta\Phi}{\Delta t}'
        sym: [eps_i, N_turns, dPhi_dt]
        src: e17
    questions:
      - type: numeric
        cat: problem
        q: Магнитный поток через контур изменился на 0,06 Вб за 0,02 с. Найдите модуль ЭДС индукции.
        num: { value: 3, unit: 'В', check: '0.06/0.02' }
        hint: '$|\varepsilon_и| = \frac{\Delta\Phi}{\Delta t}$.'
        explain: '$\frac{0{,}06}{0{,}02} = 3$ В.'
        f: [1]
        sol: { given: ['ΔΦ = 0,06 Вб', 'Δt = 0,02 с'], find: '|ε|', formula: '|\varepsilon_{и}| = \frac{\Delta\Phi}{\Delta t}', calc: '|\varepsilon| = 3', answer: '3 В' }
        src: e16
      - type: numeric
        cat: problem
        q: 'Катушка из 100 витков; поток через каждый виток меняется со скоростью 0,05 Вб/с. Найдите модуль ЭДС.'
        num: { value: 5, unit: 'В', check: '100*0.05' }
        hint: '$|\varepsilon_и| = N\frac{\Delta\Phi}{\Delta t}$.'
        explain: '$100\cdot0{,}05 = 5$ В.'
        f: [4]
        sol: { given: ['N = 100', 'ΔΦ/Δt = 0,05 Вб/с'], find: '|ε|', formula: '|\varepsilon_{и}| = N\frac{\Delta\Phi}{\Delta t}', calc: '|\varepsilon| = 5', answer: '5 В' }
        src: e17
      - type: numeric
        cat: problem
        q: 'Поток меняется по закону $\Phi(t) = 3t + 2$ (Вб). Найдите ЭДС индукции (со знаком).'
        num: { value: -3, unit: 'В', check: '-3' }
        hint: 'При $\Phi = kt + b$: $\varepsilon_и = -k$.'
        explain: '$k = 3$, значит $\varepsilon_и = -3$ В — постоянная величина.'
        f: [3]
        sol: { given: ['Φ = 3t + 2'], find: 'ε', formula: '\varepsilon_{и} = -k', calc: '\varepsilon = -3', answer: '−3 В' }
        src: e17
      - type: numeric
        cat: problem
        q: ЭДС индукции в контуре 6 В, сопротивление контура 2 Ом. Найдите индукционный ток.
        num: { value: 3, unit: 'А', check: '6/2' }
        hint: '$\varepsilon_и = IR$.'
        explain: '$I = \frac62 = 3$ А.'
        f: [2]
        sol: { given: ['ε = 6 В', 'R = 2 Ом'], find: 'I', formula: 'I = \frac{\varepsilon_{и}}{R}', calc: 'I = 3', answer: '3 А' }
        src: e16
      - type: single
        cat: theory
        q: Магнит неподвижно лежит внутри катушки. Что показывает гальванометр?
        opts: ['Ноль: поток не меняется', 'Наибольший ток', 'Ток в одну сторону, пока лежит магнит', 'Ток то в одну, то в другую сторону']
        ans: a
        hint: 'На рисунке: $\Phi_0 = 1000$, $\Phi = 1000$.'
        explain: '$\Delta\Phi = 0$, значит ЭДС индукции нет.'
        src: e16
      - type: single
        cat: theory
        q: Магнит вдвигали в катушку, затем вынимают. Что происходит со стрелкой гальванометра при вынимании?
        opts: ['Отклоняется в другую сторону', 'Отклоняется в ту же сторону', 'Остаётся на нуле', 'Прибор ломается']
        ans: a
        hint: Сравните рисунки 2 и 4 на стр. e16.
        explain: 'При вдвигании поток растёт, при вынимании — убывает; знак ΔΦ, а с ним и направление тока, меняются.'
        src: e16
      - type: single
        cat: theory
        q: 'В каких единицах измеряется скорость изменения магнитного потока $\frac{\Delta\Phi}{\Delta t}$?'
        opts: ['Вб/с', 'Вб', 'Тл·с', 'Гн/с']
        ans: a
        hint: Поток делим на время.
        explain: 'В конспекте: $\left[\frac{Вб}{с}\right]$.'
        f: [4]
        src: e17
      - type: text
        cat: theory
        q: Сформулируйте закон Фарадея своими словами по конспекту.
        ref: Изменение магнитного потока является источником индукционной электродвижущей силы; ЭДС индукции равна скорости изменения потока со знаком минус.
        criteria: ['Сказано, что источник ЭДС — изменение магнитного потока', 'Упомянута формула ε = −ΔΦ/Δt или скорость изменения потока']
        hint: Источник ЭДС — не сам поток, а его изменение.
        explain: Закон со стр. e16.
        f: [1]
        src: e16

# ───────────────────────────────────────────────────────────────
  - id: ind-lenz
    title: Правило Ленца
    pages: [e17]
    theory:
      - kind: rule
        title: Цепочка явлений
        body: Изменение магнитного потока является источником ЭДС индукции. За счёт ЭДС индукции в замкнутом контуре возникает индукционный ток, а он в свою очередь создаёт собственное поле индукционного тока.
        src: e17
      - kind: law
        title: Правило Ленца
        body: Собственное поле индукционного тока всегда противодействует изменению магнитного потока.
        src: e17
    questions:
      - type: single
        cat: theory
        q: Чему противодействует собственное поле индукционного тока?
        opts: ['Изменению магнитного потока', 'Самому магнитному потоку', 'Движению электронов', 'Сопротивлению проводника']
        ans: a
        hint: Не потоку, а его…
        explain: Собственное поле индукционного тока всегда противодействует изменению магнитного потока.
        src: e17
      - type: sequence
        cat: theory
        q: Расположите явления в порядке, в котором они описаны в конспекте.
        seq: ['Изменение магнитного потока', 'ЭДС индукции', 'Индукционный ток', 'Собственное поле индукционного тока']
        hint: Всё начинается с изменения потока.
        explain: Цепочка из правила Ленца на стр. e17.
        src: e17
      - type: single
        cat: theory
        q: Поток внешнего поля через контур растёт. Как направлено собственное поле индукционного тока?
        opts: ['Против внешнего поля — мешает росту', 'По внешнему полю — помогает росту', 'Перпендикулярно внешнему полю', 'Поле не возникает']
        ans: a
        hint: Противодействовать росту — значит уменьшать.
        explain: 'По правилу Ленца поле индукционного тока противодействует изменению: при росте потока оно направлено против внешнего поля.'
        src: e17
      - type: single
        cat: theory
        q: Поток внешнего поля через контур убывает. Как направлено собственное поле индукционного тока?
        opts: ['По внешнему полю — поддерживает поток', 'Против внешнего поля', 'Перпендикулярно', 'Поле не возникает']
        ans: a
        hint: Противодействовать убыванию — значит поддерживать.
        explain: При убывании потока поле индукционного тока направлено так же, как внешнее, и мешает потоку уменьшаться.
        src: e17
      - type: text
        cat: theory
        q: Сформулируйте правило Ленца.
        ref: Собственное поле индукционного тока всегда противодействует изменению магнитного потока.
        criteria: ['Упомянуто собственное поле индукционного тока', 'Сказано, что оно противодействует изменению магнитного потока']
        hint: Одно предложение на стр. e17.
        explain: Правило со стр. e17.
        src: e17

# ───────────────────────────────────────────────────────────────
  - id: ind-self
    title: Индуктивность и самоиндукция
    pages: [e17, e18, e19]
    theory:
      - kind: definition
        title: Индуктивность
        body: Индуктивность — это магнитный поток, который возникает в индуктивной катушке при прохождении через неё тока, равного 1 А.
        src: e17
      - kind: text
        title: Индуктивность соленоида
        body: 'Для соленоида длиной $l_0$ с площадью сечения S и N витками: $L = \mu\mu_0\frac{N^2S}{l_0}$ [Гн] (генри). Поток $\Phi = LI = NBS$; отсюда напряжённость поля в соленоиде $H = \frac{NI}{l_0}$.'
        src: e18
      - kind: text
        title: При включении и при выключении
        body: '① При включении: ток растёт от $I_0 = 0$ до $I_к = I$, поток от 0 до LI, $\Delta\Phi = LI > 0$ — индукционный ток в катушке направлен против основного. ② При выключении: ток падает от I до 0, $\Delta\Phi = -LI < 0$ — индукционный ток направлен по основному.'
        src: e18
        fig: self-ind
      - kind: text
        title: ЭДС самоиндукции
        body: '$\varepsilon_и = -L\frac{\Delta I}{\Delta t}$, где $\frac{\Delta I}{\Delta t}$ — скорость изменения тока. Если $I(t) = I_0\cos(\omega t)$, то $\varepsilon_и = LI_0\omega\sin(\omega t)$, $\varepsilon_0 = LI_0\omega$.'
        src: e18
      - kind: text
        title: Энергия магнитного поля
