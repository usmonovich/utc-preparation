# ───────────────────────────────────────────────────────────────
  - id: td-carnot
    title: КПД тепловой машины. Цикл Карно
    pages: [m16]
    theory:
      - kind: text
        title: Тепловая машина
        body: 'Рабочее тело получает от нагревателя теплоту $Q_1$, отдаёт охладителю теплоту $Q_2$ и совершает работу $A = Q_1 - Q_2$.'
        src: m16
      - kind: definition
        title: Цикл Карно
        fig: carnot
        body: 'Идеальная тепловая машина работает по циклу Карно. Цикл Карно состоит из двух изотерм и из двух адиабат и обходится по часовой стрелке: 1–2 — изотерма ($T = \text{const}$, $T_I$); 2–3 — адиабата ($Q = 0$); 3–4 — изотерма ($T_{II}$); 4–1 — адиабата.'
        src: m16
      - kind: rule
        title: Свойство цикла Карно
        body: В цикле Карно произведения противоположных V и p равны.
        src: m16
    formulas:
      - title: Работа тепловой машины
        tex: 'A = Q_1 - Q_2'
        sym: [A_gas, Q12]
        src: m16
      - title: КПД тепловой машины
        tex: '\eta = \frac{Q_1 - Q_2}{Q_1}\cdot100\%,\qquad \eta = \frac{A}{Q_1}\cdot100\%'
        sym: [eta, Q12, A_gas]
        boxed: true
        src: m16
      - title: КПД цикла Карно
        tex: '\eta = \frac{T_I - T_{II}}{T_I}\cdot100\%'
        sym: [eta, T_I]
        boxed: true
        src: m16
      - title: Уравнения участков цикла
        tex: 'p_1V_1 = p_2V_2,\quad p_2V_2^{\gamma} = p_3V_3^{\gamma},\quad p_3V_3 = p_4V_4,\quad p_4V_4^{\gamma} = p_1V_1^{\gamma}'
        sym: [p, V, gamma_ad]
        boxed: true
        src: m16
      - title: Произведения противоположных V и p
        tex: 'V_2V_4 = V_3V_1,\qquad p_1p_3 = p_2p_4'
        sym: [p, V]
        boxed: true
        src: m16
    questions:
      - type: numeric
        cat: problem
        q: Тепловая машина получает от нагревателя 1000 Дж и отдаёт охладителю 600 Дж. Найдите КПД в процентах.
        num: { value: 40, unit: '%', check: '(1000-600)/1000*100' }
        hint: '$\eta = \frac{Q_1 - Q_2}{Q_1}$.'
        explain: КПД тепловой машины.
        f: [2]
        sol: { given: ['Q₁ = 1000 Дж', 'Q₂ = 600 Дж'], find: 'η', formula: '\eta = \frac{Q_1-Q_2}{Q_1}\cdot100\%', calc: '\eta = \frac{400}{1000}\cdot100\% = 40\%', answer: '40 %' }
        src: m16
      - type: numeric
        cat: problem
        q: КПД двигателя 25 %, за цикл он совершает работу 500 Дж. Сколько теплоты он получает от нагревателя?
        num: { value: 2000, unit: 'Дж', check: '500/0.25' }
        hint: '$\eta = \frac{A}{Q_1}$ — выразите $Q_1$.'
        explain: '$Q_1 = \frac{A}{\eta}$.'
        f: [2]
        sol: { given: ['η = 25 %', 'A = 500 Дж'], find: 'Q₁', formula: 'Q_1 = \frac{A}{\eta}', calc: 'Q_1 = \frac{500}{0{,}25} = 2000', answer: '2000 Дж' }
        src: m16
      - type: numeric
        cat: problem
        q: Идеальная машина работает по циклу Карно с нагревателем 127 °C и охладителем 27 °C. Найдите КПД в процентах.
        num: { value: 25, unit: '%', check: '(400-300)/400*100' }
        hint: Температуры переведите в кельвины.
        explain: '$\eta = \frac{T_I - T_{II}}{T_I}$ при $T_I = 400$ К, $T_{II} = 300$ К.'
        f: [3]
        sol: { given: ['t₁ = 127 °C', 't₂ = 27 °C'], si: ['T_I = 400 К', 'T_II = 300 К'], find: 'η', formula: '\eta = \frac{T_I - T_{II}}{T_I}\cdot100\%', calc: '\eta = \frac{100}{400}\cdot100\% = 25\%', answer: '25 %' }
        src: m16
      - type: numeric
        cat: problem
        q: 'В цикле Карно $V_1 = 1$ л, $V_2 = 2$ л, $V_3 = 8$ л. Найдите $V_4$ в литрах.'
        num: { value: 4, unit: 'л', check: '1*8/2' }
        hint: В цикле Карно произведения противоположных объёмов равны.
        explain: '$V_2V_4 = V_3V_1$.'
        f: [5]
        sol: { formula: 'V_2V_4 = V_3V_1', calc: 'V_4 = \frac{8\cdot1}{2} = 4', answer: '4 л' }
        src: m16
      - type: sequence
        cat: theory
        q: Расставьте участки цикла Карно по порядку, начиная с точки 1.
        seq: ['Изотерма при температуре нагревателя (1–2)', 'Адиабата, Q = 0 (2–3)', 'Изотерма при температуре охладителя (3–4)', 'Адиабата, Q = 0 (4–1)']
        hint: Цикл обходится по часовой стрелке; изотермы и адиабаты чередуются.
        explain: '1–2: T = const; 2–3: Q = 0; 3–4: T = const; 4–1: Q = 0.'
        src: m16
      - type: multiple
        cat: theory
        q: Из каких процессов состоит цикл Карно? Выберите все.
        opts: ['Две изотермы', 'Две адиабаты', 'Две изобары', 'Две изохоры']
        ans: [a, b]
        hint: Определение записано под формулами КПД.
        explain: Цикл Карно состоит из двух изотерм и из двух адиабат.
        src: m16

# ───────────────────────────────────────────────────────────────
  - id: td-second
    title: Второй закон термодинамики. Теплообмен
    pages: [m19]
    theory:
      - kind: list
        title: Способы передачи энергии
        body: |
          Энергия из одного объекта в другой может передаваться тремя способами:
          - излучение;
          - конвекция;
          - теплообмен.
        src: m19
        errata: [M12]
      - kind: definition
        title: Теплообмен
        fig: heat-flow
        body: Теплообмен — это переход энергии из тела с большей температурой на тело с меньшей температурой, не выполняя при этом работу. В процессе теплообмена тело с большей температурой является телом, которое отдаёт теплоту, а тело с меньшей температурой является телом, которое получает теплоту.
        src: m19
      - kind: law
        title: Второй закон термодинамики
        body: По второму закону термодинамики теплота всегда направляется из тела с большей температурой на тело с меньшей температурой (от горячего к холодному). Теплообмен будет продолжаться до того момента, пока система не достигнет **термодинамического равновесия**. В термодинамическом равновесии температуры всех тел становятся одинаковыми.
        src: m19
    formulas:
      - title: Уравнение теплового баланса
        tex: 'Q_1 = Q_2'
        sym: [Q12]
        cond: Q₁ — отданная теплота, Q₂ — полученная
        boxed: true
        src: m19
      - title: Конечная температура
        tex: '\theta \in [T_2;\ T_1]'
        sym: [theta]
        cond: '\(T_1 > T_2\)'
        src: m19
    questions:
      - type: multiple
        cat: theory
        q: Какими способами, по конспекту, энергия может передаваться от одного объекта к другому? Выберите все.
        opts: ['Излучение', 'Конвекция', 'Теплообмен', 'Давление', 'Испарение']
        ans: [a, b, c]
        hint: В конспекте перечислены три способа.
        explain: 'I — излучение, II — конвекция, III — теплообмен (см. замечание M12 о названии третьего способа).'
        src: m19
      - type: single
        cat: theory
        q: В каком направлении, по второму закону термодинамики, передаётся теплота?
        opts: ['От тела с большей температурой к телу с меньшей', 'От тела с меньшей температурой к телу с большей', 'От тела большей массы к телу меньшей массы', 'В обе стороны одинаково']
        ans: a
        hint: «От горячего к …»
        explain: Теплота всегда направляется от горячего к холодному.
        src: m19
      - type: single
        cat: theory
        q: До какого момента продолжается теплообмен?
        opts: ['Пока температуры всех тел не станут одинаковыми', 'Пока горячее тело не остынет до 0 °C', 'Пока холодное тело не нагреется до температуры горячего', 'Бесконечно']
        ans: a
        hint: Как называется состояние, в котором теплообмен прекращается?
        explain: Теплообмен идёт до термодинамического равновесия, когда температуры всех тел одинаковы.
        src: m19
      - type: single
        cat: theory
        q: 'Тела с температурами $T_1 > T_2$ привели в контакт. Какой может быть конечная температура θ?'
        opts: ['$T_2 \le \theta \le T_1$', '$\theta > T_1$', '$\theta < T_2$', '$\theta = T_1 + T_2$']
        ans: a
        hint: Конечная температура лежит в определённом отрезке.
        explain: '$\theta \in [T_2;\ T_1]$.'
        f: [2]
        src: m19
      - type: text
        cat: theory
        q: Сформулируйте второй закон термодинамики (как в конспекте).
        ref: Теплота всегда направляется из тела с большей температурой на тело с меньшей температурой (от горячего к холодному); теплообмен идёт до термодинамического равновесия.
        criteria: ['От тела с большей температурой к телу с меньшей', 'Сказано, что так происходит всегда']
        hint: Ключевые слова — «всегда» и «от горячего к холодному».
        explain: Формулировка со стр. m19.
        src: m19

# ───────────────────────────────────────────────────────────────
  - id: td-heat
    title: Количество теплоты. Температура смеси
    pages: [m20]
    theory:
      - kind: definition
        title: Удельная теплоёмкость
        body: '$c$ — удельная теплоёмкость. $c_{вода} = 4200$ Дж/(кг·°C): чтобы нагреть 1 кг воды на 1 °C, мы тратим 4200 Дж энергии. $C = cm$ — теплоёмкость тела.'
        src: m20
      - kind: rule
        title: Температура смеси
        fig: mixing
        body: 'При смешивании $t_1 < \theta < t_2$. Формула для θ работает, когда не меняется агрегатное состояние. Для одного и того же вещества ($c_1 = c_2 = \dots$) удельные теплоёмкости сокращаются; если ещё и массы равны — θ равна средней арифметической температуре.'
        src: m20
    formulas:
      - title: Количество теплоты при нагревании
        tex: 'Q = cm\Delta t,\qquad c = \frac{Q}{m\Delta t}'
        sym: [Q, c_sp, m, dt_cel]
        boxed: true
        src: m20
      - title: Теплоёмкость тела
        tex: 'C = cm,\qquad C = \frac{Q}{\Delta t}'
        sym: [C_heat, c_sp, m, Q, dt_cel]
        boxed: true
        src: m20
      - title: Уравнение теплового баланса для смеси
        tex: 'm_1c_1(\theta - t_1) = m_2c_2(t_2 - \theta)'
        sym: [m, c_sp, theta, t_cel]
        src: m20
      - title: Температура смеси двух тел
        tex: '\theta = \frac{m_1c_1t_1 + m_2c_2t_2}{m_1c_1 + m_2c_2}'
        sym: [theta, m, c_sp, t_cel]
        cond: агрегатное состояние не меняется
        boxed: true
        src: m20
      - title: Температура смеси n тел
        tex: '\theta = \frac{m_1c_1t_1 + m_2c_2t_2 + \dots + m_nc_nt_n}{m_1c_1 + m_2c_2 + \dots + m_nc_n}'
        sym: [theta, m, c_sp, t_cel]
        boxed: true
        src: m20
      - title: Одно и то же вещество
        tex: '\theta = \frac{m_1t_1 + m_2t_2 + \dots + m_nt_n}{m_1 + m_2 + \dots + m_n}'
        sym: [theta, m, t_cel]
        cond: '\(c_1 = c_2 = \dots = c_n\)'
        src: m20
      - title: Одинаковые вещество и массы
        tex: '\theta = \frac{t_1 + t_2 + \dots + t_n}{n}'
        sym: [theta, t_cel]
        cond: 'одинаковые c и m — средняя арифметическая температура'
        src: m20
    questions:
      - type: numeric
        cat: problem
        q: Сколько теплоты нужно, чтобы нагреть 2 кг воды на 30 °C ($c = 4200$ Дж/(кг·°C))?
        num: { value: 252000, unit: 'Дж', check: '4200*2*30' }
        hint: '$Q = cm\Delta t$.'
        explain: Количество теплоты при нагревании.
        f: [1]
        sol: { given: ['m = 2 кг', 'Δt = 30 °C', 'c = 4200 Дж/(кг·°C)'], find: 'Q', formula: 'Q = cm\Delta t', calc: 'Q = 4200\cdot2\cdot30 = 252\,000', answer: '252 кДж' }
        src: m20
      - type: numeric
        cat: problem
        q: Чтобы нагреть 0,5 кг металла на 40 °C, потребовалось 9200 Дж. Найдите удельную теплоёмкость металла.
        num: { value: 460, unit: 'Дж/(кг·°C)', check: '9200/(0.5*40)' }
        hint: '$c = \frac{Q}{m\Delta t}$.'
        explain: Удельная теплоёмкость из количества теплоты.
        f: [1]
        sol: { given: ['Q = 9200 Дж', 'm = 0,5 кг', 'Δt = 40 °C'], find: 'c', formula: 'c = \frac{Q}{m\Delta t}', calc: 'c = \frac{9200}{0{,}5\cdot40} = 460', answer: '460 Дж/(кг·°C)' }
        src: m20
      - type: numeric
        cat: problem
        q: Смешали 1 кг воды при 20 °C и 3 кг воды при 60 °C. Найдите температуру смеси.
        num: { value: 50, unit: '°C', check: '(1*20+3*60)/(1+3)' }
        hint: Вещество одно и то же — удельные теплоёмкости сокращаются.
        explain: '$\theta = \frac{m_1t_1 + m_2t_2}{m_1 + m_2}$.'
        f: [6]
        sol: { given: ['m₁ = 1 кг, t₁ = 20 °C', 'm₂ = 3 кг, t₂ = 60 °C'], find: 'θ', formula: '\theta = \frac{m_1t_1 + m_2t_2}{m_1 + m_2}', calc: '\theta = \frac{20 + 180}{4} = 50', answer: '50 °C' }
        src: m20
      - type: numeric
        cat: problem
        q: Смешали три одинаковые порции воды с температурами 10, 30 и 50 °C. Найдите температуру смеси.
        num: { value: 30, unit: '°C', check: '(10+30+50)/3' }
        hint: Одинаковые вещество и массы — средняя арифметическая.
        explain: '$\theta = \frac{t_1 + t_2 + t_3}{3}$.'
        f: [7]
        sol: { calc: '\theta = \frac{10+30+50}{3} = 30', answer: '30 °C' }
        src: m20
      - type: numeric
        cat: problem
        q: 'В 2 кг воды при 20 °C ($c = 4200$) опустили 1 кг металла при 100 °C ($c = 400$ Дж/(кг·°C)). Найдите установившуюся температуру.'
        num: { value: 23.64, unit: '°C', check: '(2*4200*20+1*400*100)/(2*4200+1*400)' }
