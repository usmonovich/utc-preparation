        explain: 'Не путайте удельную теплоёмкость c и теплоёмкость тела C.'
        f: [2]
        sol: { calc: 'C = 4200\cdot3 = 12\,600', answer: '12 600 Дж/°C' }
        src: m20

# ───────────────────────────────────────────────────────────────
  - id: td-phase
    title: Изменение агрегатного состояния
    pages: [m21]
    theory:
      - kind: text
        title: График T(U)
        fig: phase-curve
        body: 'При нагревании твёрдое тело нагревается до 0 °C, затем плавится (тает) при постоянной температуре, жидкость нагревается до 100 °C, затем испаряется (кипит) при постоянной температуре и дальше нагревается газ. Обратные процессы — затвердевание и конденсация. У процесса сгорания нет обратного процесса.'
        src: m21
