        explain: '$\theta = \frac{m_1c_1t_1 + m_2c_2t_2}{m_1c_1 + m_2c_2}$.'
        f: [4]
        sol: { given: ['m₁ = 2 кг, c₁ = 4200, t₁ = 20 °C', 'm₂ = 1 кг, c₂ = 400, t₂ = 100 °C'], find: 'θ', formula: '\theta = \frac{m_1c_1t_1 + m_2c_2t_2}{m_1c_1 + m_2c_2}', calc: '\theta = \frac{168\,000 + 40\,000}{8400 + 400} \approx 23{,}6', answer: '≈ 23,6 °C' }
        src: m20
      - type: numeric
        cat: problem
        q: Найдите теплоёмкость 3 кг воды ($c = 4200$ Дж/(кг·°C)).
        num: { value: 12600, unit: 'Дж/°C', check: '4200*3' }
