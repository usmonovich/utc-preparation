subsection: td
topics:

# ───────────────────────────────────────────────────────────────
  - id: td-u
    title: Внутренняя энергия идеального газа
    pages: [m11, m12]
    theory:
      - kind: definition
        title: Термодинамика
        body: Термодинамика — это раздел молекулярной физики, где изучаются процессы, связанные с переходом энергии. U — внутренняя энергия.
        src: m11
      - kind: text
        title: Внутренняя энергия идеального газа
        body: 'Молекулы идеального газа не взаимодействуют на расстоянии друг с другом, и за счёт этого потенциальная энергия идеального газа не существует, то есть всегда равна 0 ($W_п = 0$). Поэтому внутренняя энергия идеального газа равна кинетической: $U = W_к$; $U \sim T$.'
        src: m11
      - kind: list
        title: Степени свободы
        body: |
          - $i = 3$ — одноатомная молекула;
          - $i = 5$ — двухатомная;
          - $i = 6$ — многоатомная.
        src: m11
      - kind: rule
        title: Открытый сосуд
        body: 'В открытом сосуде при нагревании (T↑) газ выходит (ν↓), а $U = \text{const}$; при охлаждении (T↓) газ входит (ν↑), $U = \text{const}$.'
        src: m11
        errata: [M08]
      - kind: rule
        title: Изменение внутренней энергии не зависит от пути
        body: 'Если газ переходит из состояния 1 в состояние 2 разными путями a и b, то $\Delta U_a = \Delta U_b$. На диаграмме p–V чем точка дальше от начала координат, тем больше там U.'
        src: m11
    formulas:
      - title: Внутренняя энергия
        tex: 'U = W_к + W_п'
        sym: [U_int, W_k, W_p]
        boxed: true
        src: m11
      - title: Для идеального газа (как записано)
        tex: 'W_п = 0\;\Rightarrow\; U = W_к,\qquad U = \frac32 pV'
        sym: [U_int, W_k, W_p, p, V]
        src: m11
        errata: [M07]
      - title: Внутренняя энергия через степени свободы
        tex: 'U = \frac{i}{2}\nu RT,\qquad U = \frac{i}{2}pV'
        sym: [U_int, i_dof, nu_mol, R_gas, T_abs, p, V]
        boxed: true
        src: m11
      - title: Изменение внутренней энергии
        tex: '\Delta U = U_2 - U_1,\qquad \Delta U = \frac{i}{2}\nu R\Delta T'
        sym: [U_int, i_dof, nu_mol, R_gas, T_abs]
        cond: '\(\nu = \text{const}\)'
        src: [m11, m12]
      - title: ΔU в изопроцессах
        tex: '\Delta U^T = 0;\qquad \Delta U^p = \frac{i}{2}p\Delta V;\qquad \Delta U^V = \frac{i}{2}\Delta p\,V'
        sym: [U_int, i_dof, p, V]
        boxed: true
        src: m12
    questions:
      - type: numeric
        cat: problem
        q: Найдите внутреннюю энергию 2 моль одноатомного газа при 300 К ($R = 8{,}31$).
        num: { value: 7479, unit: 'Дж', check: '3/2*2*8.31*300' }
        hint: Для одноатомного газа $i = 3$.
        explain: '$U = \frac i2\nu RT$.'
        f: [3]
        sol: { given: ['ν = 2 моль', 'T = 300 К', 'i = 3'], find: 'U', formula: 'U = \frac{i}{2}\nu RT', calc: 'U = 1{,}5\cdot2\cdot8{,}31\cdot300 = 7479', answer: '≈ 7,5 кДж' }
        src: m11
      - type: numeric
        cat: problem
        q: Двухатомный газ занимает 0,02 м³ при давлении $10^5$ Па. Найдите его внутреннюю энергию.
        num: { value: 5000, unit: 'Дж', check: '5/2*1e5*0.02' }
        hint: Для двухатомного газа $i = 5$; используйте форму через p и V.
        explain: '$U = \frac i2 pV$.'
        f: [3]
        sol: { given: ['p = 10⁵ Па', 'V = 0,02 м³', 'i = 5'], find: 'U', formula: 'U = \frac{i}{2}pV', calc: 'U = 2{,}5\cdot10^5\cdot0{,}02 = 5000', answer: '5 кДж' }
        src: m11
      - type: matching
        cat: theory
        q: Сопоставьте газ и число степеней свободы его молекулы.
        pairs:
          - ['He', '3']
          - ['O₂', '5']
          - ['CH₄', '6']
        hint: Одноатомная, двухатомная, многоатомная.
        explain: 'i = 3 — одноатомная, i = 5 — двухатомная, i = 6 — многоатомная.'
        src: m11
      - type: numeric
        cat: problem
        q: Как изменится внутренняя энергия 1 моль идеального газа при изотермическом сжатии? Введите ΔU в джоулях.
        num: { value: 0, unit: 'Дж', check: '0', tolAbs: 0.001 }
        hint: От какой величины зависит U идеального газа?
        explain: '$U \sim T$; при $T = \text{const}$ $\Delta U^T = 0$.'
        f: [5]
        sol: { formula: '\Delta U = \frac{i}{2}\nu R\Delta T', calc: '\Delta T = 0 \Rightarrow \Delta U = 0', answer: '0' }
        src: m12
      - type: single
        cat: theory
        q: Газ переходит из состояния 1 в состояние 2 двумя разными путями. Что можно сказать об изменении внутренней энергии?
        opts: ['Оно одинаково для обоих путей', 'Больше на более длинном пути', 'Меньше на более длинном пути', 'Зависит от скорости процесса']
        ans: a
        hint: Внутренняя энергия определяется состоянием газа.
        explain: '$\Delta U_a = \Delta U_b$ — изменение внутренней энергии не зависит от пути.'
        src: m11
      - type: single
        cat: theory
        q: Почему потенциальная энергия идеального газа равна нулю?
        opts: ['Молекулы не взаимодействуют на расстоянии', 'Молекулы неподвижны', 'Газ находится в открытом сосуде', 'Температура газа равна нулю']
        ans: a
        hint: Потенциальная энергия связана с взаимодействием частиц.
        explain: Молекулы идеального газа не взаимодействуют на расстоянии, поэтому $W_п = 0$ и $U = W_к$.
        src: m11

# ───────────────────────────────────────────────────────────────
  - id: td-work
    title: Работа газа
    pages: [m12, m13]
    theory:
      - kind: definition
        title: Термодинамическая работа
        fig: gas-work
        body: 'Термодинамическая работа, или работа идеального газа, характеризуется изменением объёма газа: $A \sim \Delta V$. На графике p(V) работа равна площади фигуры под графиком: $S = A$.'
        src: m12
      - kind: rule
        title: Работа газа и работа внешних сил
        body: '$A$ — работа газа; $A\prime$ — работа внешних сил над газом. При расширении ($\Delta V > 0$): $A > 0$, $A\prime < 0$. При сжатии ($\Delta V < 0$): $A < 0$, $A\prime > 0$.'
        src: m13
    formulas:
      - title: Работа газа
        tex: 'A = \int_{V_1}^{V_2} p(V)\,dV,\qquad A = S'
        sym: [A_gas, p, V]
        src: m12
      - title: Изохорный процесс
        tex: 'A^V = 0'
        sym: [A_gas]
        cond: '\(\Delta V = 0\)'
        src: m12
      - title: Изобарный процесс
        tex: 'A^p = p\Delta V,\qquad A^p = \nu R\Delta T'
        sym: [A_gas, p, V, nu_mol, R_gas, T_abs]
        boxed: true
        src: m12
      - title: Изотермический процесс
        tex: 'A^T = \nu RT\ln\frac{V_2}{V_1},\qquad A^T = \nu RT\ln\frac{p_1}{p_2}'
        sym: [A_gas, nu_mol, R_gas, T_abs, V, p]
        boxed: true
        src: m13
      - title: Работа газа и внешних сил
        tex: "A = -A',\\qquad A' = -A"
        sym: [A_gas, A_ext]
        boxed: true
        src: m13
    questions:
      - type: numeric
        cat: problem
        q: 'Газ при постоянном давлении 2·10⁵ Па расширился от 0,01 м³ до 0,03 м³. Найдите работу газа.'
        num: { value: 4000, unit: 'Дж', check: '2e5*(0.03-0.01)' }
        hint: '$A^p = p\Delta V$.'
        explain: Работа газа при изобарном процессе.
        f: [3]
        sol: { given: ['p = 2·10⁵ Па', 'V₁ = 0,01 м³', 'V₂ = 0,03 м³'], find: 'A', formula: 'A^p = p\Delta V', calc: 'A = 2\cdot10^5\cdot0{,}02 = 4000', answer: '4 кДж' }
        src: m12
      - type: numeric
        cat: problem
        q: 3 моль газа изобарно нагрели на 100 К. Найдите работу газа ($R = 8{,}31$).
        num: { value: 2493, unit: 'Дж', check: '3*8.31*100' }
        hint: Работа при p = const через ν, R и ΔT.
        explain: '$A^p = \nu R\Delta T$.'
        f: [3]
        sol: { given: ['ν = 3 моль', 'ΔT = 100 К'], find: 'A', formula: 'A^p = \nu R\Delta T', calc: 'A = 3\cdot8{,}31\cdot100 = 2493', answer: '2493 Дж' }
        src: m12
      - type: numeric
        cat: problem
        q: 1 моль газа изотермически расширился при 300 К, объём увеличился в 2 раза. Найдите работу газа ($\ln2 \approx 0{,}693$).
        num: { value: 1728, unit: 'Дж', check: '8.31*300*Math.log(2)' }
        hint: Для изотермического процесса в формуле стоит логарифм.
        explain: '$A^T = \nu RT\ln\frac{V_2}{V_1}$.'
        f: [4]
        sol: { given: ['ν = 1 моль', 'T = 300 К', 'V₂/V₁ = 2'], find: 'A', formula: 'A^T = \nu RT\ln\frac{V_2}{V_1}', calc: 'A = 8{,}31\cdot300\cdot0{,}693 \approx 1728', answer: '≈ 1,73 кДж' }
        src: m13
      - type: single
        cat: theory
        q: Газ сжимают. Какие знаки у работы газа A и работы внешних сил A′?
        opts: ["$A < 0$, $A' > 0$", "$A > 0$, $A' < 0$", "$A > 0$, $A' > 0$", "$A = 0$, $A' = 0$"]
        ans: a
        hint: При сжатии $\Delta V < 0$.
        explain: "Сжатие: $A < 0$, $A' > 0$; расширение — наоборот."
        f: [5]
        src: m13
      - type: single
        cat: theory
        q: Что на графике p(V) равно работе газа?
        opts: ['Площадь фигуры под графиком', 'Наклон графика', 'Длина графика', 'Наибольшее давление']
        ans: a
        hint: На рисунке в конспекте площадь заштрихована и подписана S.
        explain: '$S = A$ — работа равна площади под графиком p(V).'
        f: [1]
        src: m12
      - type: numeric
        cat: problem
        q: Газ нагрели в закрытом жёстком баллоне. Чему равна работа газа? Введите число в джоулях.
        num: { value: 0, unit: 'Дж', check: '0', tolAbs: 0.001 }
        hint: Меняется ли объём газа?
        explain: 'При $V = \text{const}$ $\Delta V = 0$, $A^V = 0$.'
        f: [2]
        sol: { calc: '\Delta V = 0 \Rightarrow A^V = 0', answer: '0' }
        src: m12

# ───────────────────────────────────────────────────────────────
  - id: td-first
    title: Первый закон термодинамики
    pages: [m13, m14, m15]
    theory:
      - kind: law
        title: Первый закон термодинамики
        fig: first-law
        body: 'Теплота, переданная идеальному газу, затрачивается на изменение внутренней энергии и на работу идеального газа. Q — теплота (энергия) [Дж]. $\Delta U \sim T$, $A \sim \Delta V$. Разные комбинации: 1000 = 600 + 400; 1000 = −200 + 1200; 1000 = 1800 − 800; 1000 = 1000 + 0.'
        src: m13
      - kind: rule
        title: Знаки
        body: |
          - газ получил теплоту (газу отдали теплоту) — $Q > 0$;
          - газ отдал теплоту (из газа получили теплоту) — $Q < 0$;
          - внутренняя энергия увеличивается — $\Delta U > 0$, уменьшается — $\Delta U < 0$.
        src: m13
      - kind: rule
        title: Первый закон в изопроцессах
        body: |
          - при T = const теплота равна работе газа;
          - при V = const теплота равна изменению внутренней энергии;
          - при p = const теплота равна сумме изменения внутренней энергии и работы газа; всегда можно найти пропорциональное соотношение работы газа и изменения внутренней энергии к теплоте.
        src: m14
    formulas:
      - title: Первый закон термодинамики
        tex: 'Q = \Delta U + A'
        sym: [Q, U_int, A_gas]
        boxed: true
        src: m13
      - title: Через работу внешних сил
        tex: "\\Delta U = Q + A'"
        sym: [U_int, Q, A_ext]
        boxed: true
        src: m14
      - title: Изотермический процесс
        tex: 'Q^T = A^T = \nu RT\ln\frac{V_2}{V_1} = \nu RT\ln\frac{p_1}{p_2}'
        sym: [Q, A_gas, nu_mol, R_gas, T_abs, V, p]
        boxed: true
        src: m14
      - title: Изохорный процесс
        tex: 'Q^V = \Delta U^V = \frac{i}{2}\nu R\Delta T = \frac{i}{2}\Delta p\,V'
        sym: [Q, U_int, i_dof, nu_mol, R_gas, T_abs, p, V]
        boxed: true
        src: m14
      - title: Изобарный процесс
        tex: 'Q^p = \frac{i+2}{2}\nu R\Delta T = \frac{i+2}{2}p\Delta V = \frac{i+2}{2}A^p'
        sym: [Q, i_dof, nu_mol, R_gas, T_abs, p, V, A_gas]
        boxed: true
        src: m14
      - title: Доли теплоты при p = const
        tex: '\Delta U^p = \frac{i}{2}A^p,\qquad A^p = \frac{2}{i+2}Q^p,\qquad \Delta U^p = \frac{i}{i+2}Q^p'
        sym: [U_int, A_gas, Q, i_dof]
        boxed: true
        src: m14
      - title: Числовые соотношения при p = const
        tex: 'i = 3:\ A^p = 0{,}4Q^p,\ \Delta U^p = 0{,}6Q^p;\quad i = 5:\ A^p = \tfrac27 Q^p,\ \Delta U^p = \tfrac57 Q^p;\quad i = 6:\ A^p = 0{,}25Q^p,\ \Delta U^p = 0{,}75Q^p'
        sym: [A_gas, U_int, Q, i_dof]
        src: [m14, m15]
    questions:
      - type: numeric
        cat: problem
        q: Газ получил 1000 Дж теплоты и совершил работу 400 Дж. На сколько изменилась его внутренняя энергия?
        num: { value: 600, unit: 'Дж', check: '1000-400' }
        hint: '$Q = \Delta U + A$.'
        explain: Первая комбинация из конспекта — 1000 = 600 + 400.
        f: [1]
        sol: { given: ['Q = 1000 Дж', 'A = 400 Дж'], find: 'ΔU', formula: 'Q = \Delta U + A', calc: '\Delta U = 1000 - 400 = 600', answer: '600 Дж' }
        src: m13
      - type: numeric
        cat: problem
        q: Газу передали 500 Дж теплоты, и внешние силы совершили над ним работу 300 Дж. Найдите изменение внутренней энергии.
        num: { value: 800, unit: 'Дж', check: '500+300' }
        hint: "$\\Delta U = Q + A'$."
        explain: Работа внешних сил тоже увеличивает внутреннюю энергию.
        f: [2]
        sol: { given: ['Q = 500 Дж', "A' = 300 Дж"], find: 'ΔU', formula: "\\Delta U = Q + A'", calc: '\Delta U = 500 + 300 = 800', answer: '800 Дж' }
        src: m14
      - type: numeric
        cat: problem
        q: Одноатомному газу при постоянном давлении передали 1000 Дж теплоты. Какую работу совершил газ?
        num: { value: 400, unit: 'Дж', check: '2/(3+2)*1000' }
        hint: 'При p = const $A^p = \frac{2}{i+2}Q^p$; для одноатомного $i = 3$.'
        explain: 'Для i = 3: $A^p = 0{,}4Q^p$.'
        f: [6]
        sol: { given: ['Q = 1000 Дж', 'i = 3'], find: 'A', formula: 'A^p = \frac{2}{i+2}Q^p', calc: 'A = \frac25\cdot1000 = 400', answer: '400 Дж' }
        src: m14
      - type: numeric
        cat: problem
        q: Двухатомному газу при постоянном давлении передали 700 Дж теплоты. На сколько увеличилась его внутренняя энергия?
        num: { value: 500, unit: 'Дж', check: '5/7*700' }
        hint: 'Для двухатомного газа $i = 5$, $\Delta U^p = \frac{i}{i+2}Q^p$.'
        explain: '$\Delta U^p = \frac57 Q^p$.'
        f: [6]
        sol: { given: ['Q = 700 Дж', 'i = 5'], find: 'ΔU', formula: '\Delta U^p = \frac{i}{i+2}Q^p', calc: '\Delta U = \frac57\cdot700 = 500', answer: '500 Дж' }
        src: m15
      - type: numeric
        cat: problem
        q: 2 моль одноатомного газа изохорно нагрели на 100 К. Сколько теплоты получил газ ($R = 8{,}31$)?
        num: { value: 2493, unit: 'Дж', check: '3/2*2*8.31*100' }
        hint: При V = const теплота равна изменению внутренней энергии.
        explain: '$Q^V = \frac i2\nu R\Delta T$.'
        f: [4]
        sol: { given: ['ν = 2 моль', 'ΔT = 100 К', 'i = 3'], find: 'Q', formula: 'Q^V = \frac{i}{2}\nu R\Delta T', calc: 'Q = 1{,}5\cdot2\cdot8{,}31\cdot100 = 2493', answer: '2493 Дж' }
        src: m14
      - type: single
        cat: theory
        q: Чему равна теплота, переданная газу при изотермическом процессе?
        opts: ['Работе газа', 'Изменению внутренней энергии', 'Нулю', 'Сумме работы и изменения внутренней энергии, где ΔU > 0']
        ans: a
        hint: Чему равно ΔU при T = const?
        explain: '$\Delta U^T = 0$, поэтому $Q^T = A^T$.'
        f: [3]
        src: m14
      - type: single
        cat: theory
        q: Газ отдал теплоту окружающим телам. Какой знак у Q?
        opts: ['$Q < 0$', '$Q > 0$', '$Q = 0$', 'Зависит от работы газа']
        ans: a
        hint: В конспекте перечислены четыре правила знаков.
        explain: Газ отдал теплоту (из газа получили теплоту) — $Q < 0$.
        src: m13
      - type: text
        cat: theory
        q: Сформулируйте первый закон термодинамики.
        ref: Теплота, переданная идеальному газу, затрачивается на изменение внутренней энергии и на работу газа, Q = ΔU + A.
        criteria: ['Теплота идёт на изменение внутренней энергии', 'и на работу газа', 'Формула Q = ΔU + A']
        hint: На что «тратится» полученная газом теплота?
        explain: Формулировка со стр. m13.
        f: [1]
        src: m13

# ───────────────────────────────────────────────────────────────
  - id: td-adiabat
    title: Адиабатный процесс
    pages: [m15]
    theory:
      - kind: definition
        title: Адиабатный процесс
        body: 'Адиабатный процесс — процесс, при котором $Q = 0$. Тогда $\Delta U + A = 0$: работа газа совершается за счёт внутренней энергии. На диаграмме p–V адиабата идёт круче изотермы.'
        src: m15
      - kind: rule
        title: Расширение и сжатие
        fig: adiabat
        body: |
          - $\Delta V > 0$: $\Delta T < 0$, $A > 0$, $\Delta U < 0$ — при адиабатном расширении (объём увеличивается) температура уменьшается;
          - $\Delta V < 0$: $\Delta T > 0$, $A < 0$, $\Delta U > 0$ — при адиабатном сжатии (объём уменьшается) температура увеличивается.
        src: m15
    formulas:
      - title: Первый закон для адиабаты
        tex: "\\Delta U + A = 0,\\qquad \\Delta U = -A,\\qquad \\Delta U = A'"
        sym: [U_int, A_gas, A_ext]
        cond: '\(Q = 0\)'
        src: m15
      - title: ΔU и работа через температуры
        tex: '\Delta U = \frac{i}{2}\nu R(T_2 - T_1),\qquad A = \frac{i}{2}\nu R(T_1 - T_2)'
        sym: [U_int, A_gas, i_dof, nu_mol, R_gas, T_abs]
        src: m15
      - title: Уравнение Пуассона
        tex: 'pV^{\gamma} = \text{const},\qquad p_1V_1^{\gamma} = p_2V_2^{\gamma}'
        sym: [p, V, gamma_ad]
        boxed: true
        src: m15
