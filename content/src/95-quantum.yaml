errata:
  - id: O14
    page: o12
    severity: note
    original: '\(h = 6{,}62\cdot10^{-34}\) Дж·с'
    issue: Обычно приводят 6,63·10⁻³⁴ Дж·с (точнее 6,626·10⁻³⁴). Разница меньше 0,2 %.
    target: 'Значение постоянной Планка'
    suggestion: 'Записать \(h = 6{,}63\cdot10^{-34}\) Дж·с; в задачах приложения — \(6{,}62\cdot10^{-34}\), как в конспекте (разница меньше 0,2 %).'
  - id: O15
    page: o14
    severity: error
    original: '\(\frac{h\nu}{\lambda} = \frac{h\nu}{\lambda_к} + E_к\)'
    issue: 'В числителях должно стоять hc: \(h\nu = \frac{hc}{\lambda}\) (стр. o12) и \(h\nu_к = \frac{hc}{\lambda_к}\) (стр. o14). У записи \(\frac{h\nu}{\lambda}\) даже не размерность энергии.'
    target: 'Уравнение фотоэффекта через длины волн'
    suggestion: '\(\frac{hc}{\lambda} = \frac{hc}{\lambda_к} + E_к\).'
  - id: O16
    page: o14
    severity: note
    original: '\(U_т\) — тормозное напряжение; \(\frac{m\upsilon^2}{2} = eU\)'
    issue: 'Во второй формуле пропущен индекс «т». В задачниках это напряжение чаще называют задерживающим (запирающим). Обозначения e и m (заряд и масса электрона) в конспекте не расшифрованы.'
    target: 'Индекс напряжения в формуле для фотоэлектронов'
    suggestion: '\(\frac{m\upsilon^2}{2} = eU_т\); \(U_т\) — тормозное (задерживающее) напряжение.'

topics:
  - id: q-photon
    title: Фотон
    pages: [o12]
    theory:
      - kind: definition
        title: Фотон
        body: Световая частица называется фотоном. Фотон можно считать носителем энергии. Основная особенность фотона — то, что фотон не существует в покое.
        src: o12
      - kind: text
        title: Энергия, масса и импульс фотона
        body: '$E = h\nu$, где $\nu$ — частота, $h = 6{,}62\cdot10^{-34}$ Дж·с — постоянная Планка. Так как $\nu = \frac c\lambda$, то $E = \frac{hc}{\lambda}$. Масса покоя фотона $m_0 = 0$, масса в движении $m = \frac{h\nu}{c^2} = \frac{h}{c\lambda}$. Импульс $p = \frac Ec = \frac{h\nu}{c} = \frac h\lambda$.'
        src: o12
        errata: [O14]
      - kind: rule
        title: Фотон в среде
        body: 'В среде: $\upsilon_с = \frac cn$, $\lambda_с = \frac{\lambda_0}{n}$, а частота не меняется: $\nu_с = \nu_0 = \text{const}$, поэтому энергия $E = h\nu$ та же. Масса и импульс: $m_с = \frac{h\nu}{c^2}n^2 = \frac{hn}{c\lambda_с}$, $p_с = \frac{h\nu}{c}\cdot n$.'
        src: o12
    formulas:
      - title: Энергия фотона
        tex: 'E = h\nu'
        sym: [E_ph, h_pl, nu_osc]
        boxed: true
        src: o12
      - title: Частота и длина волны
        tex: '\lambda = \frac{c}{\nu},\qquad \nu = \frac{c}{\lambda}'
        sym: [lambda_w, c_light, nu_osc]
        src: o12
      - title: Энергия фотона через длину волны
        tex: 'E = \frac{hc}{\lambda}'
        sym: [E_ph, h_pl, c_light, lambda_w]
        src: o12
      - title: Масса покоя фотона
        tex: 'm_0 = 0'
        sym: [m0_rel]
        src: o12
      - title: Масса фотона через частоту
        tex: 'm = \frac{h\nu}{c^2}'
        sym: [m_ph, h_pl, nu_osc, c_light]
        src: o12
      - title: Масса фотона через длину волны
        tex: 'm = \frac{h}{c\lambda}'
        sym: [m_ph, h_pl, c_light, lambda_w]
        src: o12
      - title: Импульс фотона через энергию
        tex: 'p = \frac{E}{c}'
        sym: [p_ph, E_ph, c_light]
        src: o12
      - title: Импульс фотона через частоту
        tex: 'p = \frac{h\nu}{c}'
        sym: [p_ph, h_pl, nu_osc, c_light]
        src: o12
      - title: Импульс фотона через длину волны
        tex: 'p = \frac{h}{\lambda}'
        sym: [p_ph, h_pl, lambda_w]
        src: o12
      - title: Свет в среде
        tex: '\upsilon_{с} = \frac{c}{n},\qquad \lambda_{с} = \frac{\lambda_0}{n},\qquad \nu_{с} = \nu_0 = \text{const}'
        sym: [v_c_med, c_light, n_ref, lambda_c_med, lambda0_vac, nu_c0]
        src: o12
      - title: Масса фотона в среде через частоту
        tex: 'm_{с} = \frac{h\nu}{c^2}\,n^2'
        sym: [m_c_med, h_pl, nu_osc, c_light, n_ref]
        src: o12
      - title: Масса фотона в среде через длину волны
        tex: 'm_{с} = \frac{h\,n}{c\,\lambda_{с}}'
        sym: [m_c_med, h_pl, n_ref, c_light, lambda_c_med]
        src: o12
      - title: Импульс фотона в среде
        tex: 'p_{с} = \frac{h\nu}{c}\cdot n'
        sym: [p_c_med, h_pl, nu_osc, c_light, n_ref]
        src: o12
    questions:
      - type: numeric
        cat: problem
        q: 'Частота света $5\cdot10^{14}$ Гц. Найдите энергию фотона ($h = 6{,}62\cdot10^{-34}$ Дж·с).'
        num: { value: 3.31e-19, unit: 'Дж', check: '6.62e-34*5e14' }
        hint: '$E = h\nu$.'
        explain: '$E = 6{,}62\cdot10^{-34}\cdot5\cdot10^{14} = 3{,}31\cdot10^{-19}$ Дж.'
        f: [1]
        sol: { given: ['ν = 5·10¹⁴ Гц', 'h = 6,62·10⁻³⁴ Дж·с'], find: 'E', formula: 'E = h\nu', calc: 'E = 6{,}62\cdot10^{-34}\cdot5\cdot10^{14} = 3{,}31\cdot10^{-19}', answer: '3,31·10⁻¹⁹ Дж' }
        src: o12
      - type: numeric
        cat: problem
        q: 'Длина волны света 662 нм. Найдите энергию фотона ($h = 6{,}62\cdot10^{-34}$ Дж·с, $c = 3\cdot10^8$ м/с).'
        num: { value: 3.0e-19, unit: 'Дж', check: '6.62e-34*3e8/662e-9' }
        hint: '$E = \frac{hc}{\lambda}$; 1 нм = 10⁻⁹ м.'
        explain: '$E = \frac{6{,}62\cdot10^{-34}\cdot3\cdot10^8}{6{,}62\cdot10^{-7}} = 3\cdot10^{-19}$ Дж.'
        f: [3]
        sol: { given: ['λ = 662 нм', 'h = 6,62·10⁻³⁴ Дж·с', 'c = 3·10⁸ м/с'], si: ['λ = 6,62·10⁻⁷ м'], find: 'E', formula: 'E = \frac{hc}{\lambda}', calc: 'E = \frac{6{,}62\cdot10^{-34}\cdot3\cdot10^8}{6{,}62\cdot10^{-7}} = 3\cdot10^{-19}', answer: '3·10⁻¹⁹ Дж' }
        src: o12
      - type: numeric
        cat: problem
        q: 'Найдите импульс фотона с длиной волны 662 нм ($h = 6{,}62\cdot10^{-34}$ Дж·с).'
        num: { value: 1.0e-27, unit: 'кг·м/с', check: '6.62e-34/662e-9' }
        hint: '$p = \frac h\lambda$.'
        explain: '$p = \frac{6{,}62\cdot10^{-34}}{6{,}62\cdot10^{-7}} = 10^{-27}$ кг·м/с.'
        f: [9]
        sol: { given: ['λ = 662 нм'], si: ['λ = 6,62·10⁻⁷ м'], find: 'p', formula: 'p = \frac{h}{\lambda}', calc: 'p = \frac{6{,}62\cdot10^{-34}}{6{,}62\cdot10^{-7}} = 10^{-27}', answer: '10⁻²⁷ кг·м/с' }
        src: o12
      - type: numeric
        cat: problem
        q: 'Найдите массу фотона с частотой $10^{15}$ Гц ($h = 6{,}62\cdot10^{-34}$ Дж·с, $c = 3\cdot10^8$ м/с).'
        num: { value: 7.36e-36, unit: 'кг', check: '6.62e-34*1e15/(3e8)**2' }
        hint: '$m = \frac{h\nu}{c^2}$.'
        explain: '$m = \frac{6{,}62\cdot10^{-19}}{9\cdot10^{16}} \approx 7{,}36\cdot10^{-36}$ кг — это масса в движении; масса покоя фотона равна нулю.'
        f: [5]
        sol: { given: ['ν = 10¹⁵ Гц'], find: 'm', formula: 'm = \frac{h\nu}{c^2}', calc: 'm = \frac{6{,}62\cdot10^{-34}\cdot10^{15}}{9\cdot10^{16}} \approx 7{,}36\cdot10^{-36}', answer: '≈ 7,36·10⁻³⁶ кг' }
        src: o12
      - type: numeric
        cat: problem
        q: 'Фотон с длиной волны в вакууме 600 нм попадает в стекло с $n = 1{,}5$. Какой стала длина волны (в нм)?'
        num: { value: 400, unit: 'нм', check: '600/1.5' }
        hint: '$\lambda_с = \frac{\lambda_0}{n}$.'
        explain: '$\lambda_с = \frac{600}{1{,}5} = 400$ нм; частота и энергия фотона при этом не меняются.'
        f: [10]
        sol: { given: ['λ₀ = 600 нм', 'n = 1,5'], find: 'λ_с', formula: '\lambda_{с} = \frac{\lambda_0}{n}', calc: '\lambda_{с} = \frac{600}{1{,}5} = 400', answer: '400 нм' }
        src: o12
      - type: numeric
        cat: problem
        q: 'Фотон с частотой $5\cdot10^{14}$ Гц находится в среде с $n = 1{,}5$. Найдите его импульс в среде ($h = 6{,}62\cdot10^{-34}$ Дж·с, $c = 3\cdot10^8$ м/с).'
        num: { value: 1.655e-27, unit: 'кг·м/с', check: '6.62e-34*5e14/3e8*1.5' }
        hint: '$p_с = \frac{h\nu}{c}\cdot n$.'
        explain: '$p_с = \frac{3{,}31\cdot10^{-19}}{3\cdot10^8}\cdot1{,}5 \approx 1{,}655\cdot10^{-27}$ кг·м/с.'
        f: [13]
        sol: { given: ['ν = 5·10¹⁴ Гц', 'n = 1,5'], find: 'p_с', formula: 'p_{с} = \frac{h\nu}{c}\cdot n', calc: 'p_{с} = \frac{6{,}62\cdot10^{-34}\cdot5\cdot10^{14}}{3\cdot10^8}\cdot1{,}5 \approx 1{,}655\cdot10^{-27}', answer: '≈ 1,66·10⁻²⁷ кг·м/с' }
        src: o12
      - type: single
        cat: theory
        q: В чём, по конспекту, основная особенность фотона?
        opts: ['Фотон не существует в покое', 'Фотон имеет отрицательный заряд', 'Фотон всегда покоится', 'Фотон не переносит энергию']
        ans: a
        hint: 'Отсюда и масса покоя $m_0 = 0$.'
        explain: Основная особенность фотона — то, что фотон не существует в покое.
        src: o12
      - type: single
        cat: theory
        q: Что не меняется у фотона при переходе из вакуума в среду?
        opts: ['Частота и энергия', 'Скорость', 'Длина волны', 'Импульс']
        ans: a
        hint: '$\nu_с = \nu_0 = \text{const}$, а $E = h\nu$.'
        explain: 'Частота постоянна, поэтому энергия $E = h\nu$ та же; скорость и длина волны уменьшаются в $n$ раз, импульс растёт в $n$ раз.'
        f: [10, 13]
        src: o12
      - type: matching
        cat: formula
        q: Сопоставьте величину фотона и формулу через длину волны.
        pairs:
          - ['Энергия', '$\frac{hc}{\lambda}$']
          - ['Импульс', '$\frac{h}{\lambda}$']
          - ['Масса', '$\frac{h}{c\lambda}$']
        hint: Импульс равен энергии, делённой на c; масса — энергии, делённой на c².
        explain: '$E = \frac{hc}{\lambda}$, $p = \frac h\lambda$, $m = \frac{h}{c\lambda}$.'
        f: [3, 9, 6]
        src: o12

# ───────────────────────────────────────────────────────────────
  - id: q-photoeffect
    title: Фотоэффект. Законы Столетова
    pages: [o13]
    theory:
      - kind: definition
        title: Электронная эмиссия
        body: Выход электронов под внешним воздействием называется электронной эмиссией.
        src: o13
      - kind: definition
        title: Фотоэффект
        body: Выход электронов с поверхности металла под воздействием света называется фотоэлектронной эмиссией, или фотоэффектом. Электрон, вышедший в процессе фотоэффекта, называется фотоэлектроном.
        src: o13
      - kind: law
        title: Уравнение фотоэффекта
        body: '$h\nu = A + E_к$, где $A$ — работа выхода, $E_к$ — кинетическая энергия фотоэлектрона.'
        src: o13
      - kind: law
        title: Законы Столетова для фотоэффекта
        fig: photoeffect
        body: 'I. Количество фотоэлектронов зависит от интенсивности света и не зависит от её частоты. Интенсивность света часто характеризуют количеством фотонов. II. Кинетическая энергия фотоэлектрона не зависит от интенсивности света, а зависит от частоты.'
        src: o13
    formulas:
      - title: Уравнение фотоэффекта
        tex: 'h\nu = A + E_{к}'
        sym: [h_pl, nu_osc, A_out, Ek_e]
        boxed: true
        src: o13
    questions:
      - type: numeric
        cat: problem
        q: Энергия фотона 6 эВ, работа выхода металла 2,5 эВ. Найдите кинетическую энергию фотоэлектрона (в эВ).
        num: { value: 3.5, unit: 'эВ', check: '6-2.5' }
        hint: '$E_к = h\nu - A$.'
        explain: '$E_к = 6 - 2{,}5 = 3{,}5$ эВ.'
        f: [1]
        sol: { given: ['hν = 6 эВ', 'A = 2,5 эВ'], find: 'E_к', formula: 'E_{к} = h\nu - A', calc: 'E_{к} = 6 - 2{,}5 = 3{,}5', answer: '3,5 эВ' }
        src: o13
      - type: numeric
        cat: problem
        q: 'Работа выхода 4,5 эВ, кинетическая энергия фотоэлектрона 1,5 эВ. Найдите энергию фотона (в эВ).'
        num: { value: 6, unit: 'эВ', check: '4.5+1.5' }
        hint: '$h\nu = A + E_к$.'
        explain: '$h\nu = 4{,}5 + 1{,}5 = 6$ эВ.'
        f: [1]
        sol: { given: ['A = 4,5 эВ', 'E_к = 1,5 эВ'], find: 'hν', formula: 'h\nu = A + E_{к}', calc: 'h\nu = 4{,}5 + 1{,}5 = 6', answer: '6 эВ' }
        src: o13
      - type: single
        cat: theory
        q: Что называется фотоэффектом?
        opts: ['Выход электронов с поверхности металла под воздействием света', 'Свечение металла при нагревании', 'Поглощение света металлом без выхода электронов', 'Отражение света от металла']
        ans: a
        hint: Его ещё называют фотоэлектронной эмиссией.
        explain: Выход электронов с поверхности металла под воздействием света называется фотоэлектронной эмиссией, или фотоэффектом.
        src: o13
      - type: single
        cat: theory
        q: От чего, по первому закону Столетова, зависит количество фотоэлектронов?
        opts: ['От интенсивности света', 'От частоты света', 'От работы выхода', 'Ни от чего']
        ans: a
        hint: Интенсивность часто характеризуют количеством фотонов.
        explain: Количество фотоэлектронов зависит от интенсивности света и не зависит от её частоты.
        src: o13
      - type: single
        cat: theory
        q: Свет сделали интенсивнее, частота осталась прежней. Как изменится кинетическая энергия фотоэлектронов?
        opts: ['Не изменится', 'Увеличится', 'Уменьшится', 'Станет равна нулю']
        ans: a
        hint: Второй закон Столетова.
        explain: Кинетическая энергия фотоэлектрона не зависит от интенсивности света, а зависит от частоты; вырастет только количество фотоэлектронов.
        src: o13
      - type: single
        cat: formula
        q: Частоту падающего света увеличили. Как изменится кинетическая энергия фотоэлектрона?
        opts: ['Увеличится', 'Не изменится', 'Уменьшится', 'Станет равна работе выхода']
        ans: a
        hint: 'В уравнении $h\nu = A + E_к$ работа выхода у металла постоянна.'
        explain: '$E_к = h\nu - A$ растёт с частотой — это и второй закон Столетова.'
        f: [1]
        src: o13
      - type: matching
        cat: theory
        q: Сопоставьте термин и его смысл.
        pairs:
          - ['Электронная эмиссия', 'Выход электронов под внешним воздействием']
          - ['Фотоэффект', 'Выход электронов с поверхности металла под воздействием света']
          - ['Фотоэлектрон', 'Электрон, вышедший в процессе фотоэффекта']
        hint: Фотоэффект — частный случай электронной эмиссии.
        explain: Определения со стр. o13.
        src: o13

# ───────────────────────────────────────────────────────────────
  - id: q-redline
    title: Красная граница фотоэффекта. Тормозное напряжение
    pages: [o14]
    theory:
      - kind: rule
        title: Условие фотоэффекта
        body: 'Фотоэффект выполняется, если $h\nu \ge A$, и не выполняется, если $h\nu < A$.'
        src: o14
      - kind: definition
        title: Красная граница
        fig: red-limit
        body: '$h\nu = A$ — красная граница фотоэффекта: $\nu_к = \frac Ah$, $\lambda_к = \frac{hc}{A}$; работа выхода $A = h\nu_к = \frac{hc}{\lambda_к}$.'
        src: o14
      - kind: rule
        title: Сравнение с красной границей
        body: 'Если $\nu \ge \nu_к$ ($\lambda \le \lambda_к$) — фотоэффект выполняется; если $\nu < \nu_к$ ($\lambda > \lambda_к$) — не выполняется.'
        src: o14
      - kind: text
        title: Уравнение через красную границу
