subsection: emw
# Начало конспекта по оптике (стр. o01, 13.03.25) — окончание темы об электромагнитных волнах.
# Файлы электродинамики из следующего конспекта получат номера 80–88 и встанут перед этим файлом.

pageDates:
  o01: 13.03.25
  o03: 15.03.25 (нижняя часть)
  o07: 18.03.25
  o09: 20.03.25 (нижняя часть)
  o13: 25.03.25 (нижняя часть)
  o15: 27.03.25
  o17: 29.03.25
  o20: 1.04.25

symbols:
  L_ind: { tex: 'L', meaning: 'индуктивность катушки колебательного контура (на рисунке — катушка L)', unit: 'Гн', src: o01 }
  C_cap: { tex: 'C', meaning: 'ёмкость конденсатора колебательного контура (на рисунке — конденсатор C)', unit: 'Ф', src: o01 }
  nu_osc: { tex: '\nu', meaning: 'частота колебаний (частота волны, света)', unit: 'Гц', src: o01 }
  T_osc: { tex: 'T', meaning: 'период колебаний в контуре', unit: 'с', src: o01 }
  omega_osc: { tex: '\omega', meaning: 'циклическая частота колебаний', unit: 'рад/с', src: o01 }
  lambda_w: { tex: '\lambda', meaning: 'длина волны', unit: 'м', src: o04 }
  c_light: { tex: 'c', meaning: 'скорость света в вакууме, 3·10⁸ м/с = 300 000 км/с', unit: 'м/с', src: o10 }
  I_int: { tex: 'I', meaning: 'интенсивность (плотность потока энергии) — энергия через единицу площади за единицу времени', unit: 'Дж/(м²·с)', src: o01 }
  w_en: { tex: 'w', meaning: 'плотность энергии — энергия в единице объёма', unit: 'Дж/м³', src: o01 }
  A_amp: { tex: 'A', meaning: 'амплитуда волны', unit: '', src: o04 }
  R_src: { tex: 'R', meaning: 'в конспекте не расшифровано; по смыслу — расстояние до источника', unit: 'м', src: null }

errata:
  - id: O01
    page: o01
    severity: unclear
    original: '\(\omega = \frac WV\) (в рамке) — плотность энергии'
    issue: Буква плотности энергии похожа на \(\omega\) — ту же, что у циклической частоты \(\omega = \frac{1}{\sqrt{LC}}\) выше на странице. Это разные величины.
    target: 'Буква для плотности энергии'
    suggestion: Обозначать плотность энергии буквой \(w\). В приложении записано \(w = \frac WV\).
  - id: O02
    page: o01
    severity: unclear
    original: '\(I \sim \frac{1}{R^2}\)'
    issue: Обозначение R в конспекте не расшифровано.
    target: 'Буква R в \(I \sim \frac{1}{R^2}\)'
    suggestion: 'Расшифровать: R — расстояние от источника волны.'
    todo: 'Если так было на лекции — «Принять исправление».'

topics:
  - id: em-circuit
    title: Колебательный контур. Радиоволны
    pages: [o01]
    theory:
      - kind: text
        title: Колебательный контур
        fig: radio
        body: 'На рисунке конспекта колебательный контур — катушка $L$ и конденсатор $C$; к контуру подключены заземление и антенна. По формулам конспекта частота, период и циклическая частота колебаний определяются произведением $LC$.'
        src: o01
      - kind: text
        title: Длина радиоволны
        body: 'Длина волны связана с периодом и частотой: $\lambda = cT$, $\lambda = \frac{c}{\nu}$. Если подставить период контура $T = 2\pi\sqrt{LC}$, получится $\lambda = c\cdot2\pi\sqrt{LC}$.'
        src: o01
    formulas:
      - title: Частота колебаний в контуре
        tex: '\nu = \frac{1}{2\pi}\cdot\frac{1}{\sqrt{LC}}'
        sym: [nu_osc, L_ind, C_cap]
        src: o01
      - title: Период колебаний в контуре
        tex: 'T = 2\pi\sqrt{LC}'
        sym: [T_osc, L_ind, C_cap]
        src: o01
      - title: Циклическая частота
        tex: '\omega = \frac{1}{\sqrt{LC}}'
        sym: [omega_osc, L_ind, C_cap]
        src: o01
      - title: Длина волны через период
        tex: '\lambda = cT'
        sym: [lambda_w, c_light, T_osc]
        boxed: true
        src: o01
      - title: Длина волны через частоту
        tex: '\lambda = \frac{c}{\nu}'
        sym: [lambda_w, c_light, nu_osc]
        boxed: true
        src: o01
      - title: Длина волны, излучаемой контуром
        tex: '\lambda = c\cdot2\pi\sqrt{LC}'
        sym: [lambda_w, c_light, L_ind, C_cap]
        boxed: true
        src: o01
    questions:
      - type: numeric
        cat: problem
        q: 'Катушка контура $L = 1$ Гн, конденсатор $C = 1$ мкФ. Найдите период колебаний.'
        num: { value: 0.00628, unit: 'с', check: '2*Math.PI*Math.sqrt(1*1e-6)' }
        hint: '$T = 2\pi\sqrt{LC}$; 1 мкФ = 10⁻⁶ Ф.'
        explain: 'Период контура зависит от произведения $LC$.'
        f: [2]
        sol: { given: ['L = 1 Гн', 'C = 1 мкФ'], si: ['C = 10⁻⁶ Ф'], find: 'T', formula: 'T = 2\pi\sqrt{LC}', calc: 'T = 2\pi\sqrt{1\cdot10^{-6}} = 2\pi\cdot10^{-3} \approx 6{,}28\cdot10^{-3}', answer: '≈ 6,28·10⁻³ с' }
        src: o01
      - type: numeric
        cat: problem
        q: 'Период электромагнитных колебаний $T = 2\cdot10^{-6}$ с. Найдите длину излучаемой волны ($c = 3\cdot10^8$ м/с).'
        num: { value: 600, unit: 'м', check: '3e8*2e-6' }
        hint: '$\lambda = cT$.'
        explain: 'Формула $\lambda = cT$ записана в рамке на стр. o01.'
        f: [4]
        sol: { given: ['T = 2·10⁻⁶ с', 'c = 3·10⁸ м/с'], find: 'λ', formula: '\lambda = cT', calc: '\lambda = 3\cdot10^8\cdot2\cdot10^{-6} = 600', answer: '600 м' }
        src: o01
      - type: numeric
        cat: problem
        q: 'Радиостанция работает на частоте 1,5 МГц. Найдите длину волны ($c = 3\cdot10^8$ м/с).'
        num: { value: 200, unit: 'м', check: '3e8/1.5e6' }
        hint: '$\lambda = \frac c\nu$; 1 МГц = 10⁶ Гц.'
        explain: 'Длина волны равна скорости света, делённой на частоту.'
        f: [5]
        sol: { given: ['ν = 1,5 МГц', 'c = 3·10⁸ м/с'], si: ['ν = 1,5·10⁶ Гц'], find: 'λ', formula: '\lambda = \frac{c}{\nu}', calc: '\lambda = \frac{3\cdot10^8}{1{,}5\cdot10^6} = 200', answer: '200 м' }
        src: o01
      - type: numeric
        cat: problem
        q: 'В контуре $L = 0{,}01$ Гн, $C = 10^{-4}$ Ф. Найдите циклическую частоту колебаний.'
        num: { value: 1000, unit: 'рад/с', check: '1/Math.sqrt(0.01*1e-4)' }
        hint: '$\omega = \frac{1}{\sqrt{LC}}$.'
        explain: '$LC = 10^{-6}$, $\sqrt{LC} = 10^{-3}$, $\omega = 10^3$ рад/с.'
        f: [3]
        sol: { given: ['L = 0,01 Гн', 'C = 10⁻⁴ Ф'], find: 'ω', formula: '\omega = \frac{1}{\sqrt{LC}}', calc: '\omega = \frac{1}{\sqrt{10^{-6}}} = 1000', answer: '1000 рад/с' }
        src: o01
      - type: single
        cat: formula
        q: Ёмкость конденсатора в контуре увеличили в 4 раза. Как изменился период колебаний?
        opts: ['Увеличился в 2 раза', 'Увеличился в 4 раза', 'Уменьшился в 2 раза', 'Не изменился']
        ans: a
        hint: '$T = 2\pi\sqrt{LC}$ — ёмкость стоит под корнем.'
        explain: '$\sqrt{4} = 2$, поэтому период вырос в 2 раза.'
        f: [2]
        src: o01
      - type: single
        cat: formula
        q: Какая формула из конспекта связывает длину излучаемой волны с параметрами контура?
        opts: ['$\lambda = c\cdot2\pi\sqrt{LC}$', '$\lambda = \frac{2\pi\sqrt{LC}}{c}$', '$\lambda = \frac{c}{2\pi\sqrt{LC}}$', '$\lambda = cLC$']
        ans: a
        hint: 'Начните с $\lambda = cT$ и подставьте период контура.'
        explain: '$\lambda = cT$ и $T = 2\pi\sqrt{LC}$, отсюда $\lambda = c\cdot2\pi\sqrt{LC}$.'
        f: [6]
        src: o01
      - type: matching
        cat: formula
        q: Сопоставьте величину и формулу.
        pairs:
          - ['Частота $\nu$', '$\frac{1}{2\pi}\cdot\frac{1}{\sqrt{LC}}$']
          - ['Период $T$', '$2\pi\sqrt{LC}$']
          - ['Циклическая частота $\omega$', '$\frac{1}{\sqrt{LC}}$']
          - ['Длина волны $\lambda$', '$cT$']
        hint: Все четыре формулы — в верхней части стр. o01.
        explain: 'Формулы колебательного контура и длины волны со стр. o01.'
        f: [1, 2, 3, 4]
        src: o01

# ───────────────────────────────────────────────────────────────
  - id: em-intensity
    title: Интенсивность и плотность энергии волны
    pages: [o01]
    theory:
      - kind: definition
        title: Интенсивность (плотность потока энергии)
        body: Интенсивность, или плотность потока энергии, — это энергия, которая проходит через единицу площади за единицу времени.
        src: o01
      - kind: note
        title: Не путать
        body: 'Плотность потока энергии и плотность энергии — это не одно и то же. Интенсивность $I = \frac{W}{S\cdot t}$ измеряется в $\frac{Дж}{м^2\cdot с}$, плотность энергии $w = \frac WV$ — в $\frac{Дж}{м^3}$.'
        src: o01
        errata: [O01]
      - kind: rule
        title: Интенсивность электромагнитных волн
        fig: intensity-spread
        body: 'Для ЭМВ: $I \sim \nu^4$, $I \sim A^2$, $I \sim \frac{1}{R^2}$.'
        src: o01
        errata: [O02]
    formulas:
      - title: Интенсивность
        tex: 'I = \frac{W}{S\cdot t}\quad\left[\frac{Дж}{м^2\cdot с}\right]'
        sym: [I_int, W, S_area, t]
        boxed: true
        src: o01
      - title: Плотность энергии
        tex: 'w = \frac{W}{V}\quad\left[\frac{Дж}{м^3}\right]'
        sym: [w_en, W, V]
        boxed: true
        src: o01
        errata: [O01]
      - title: Зависимость интенсивности ЭМВ от частоты
        tex: 'I \sim \nu^4'
        sym: [I_int, nu_osc]
        src: o01
      - title: Зависимость интенсивности от амплитуды
        tex: 'I \sim A^2'
        sym: [I_int, A_amp]
        src: o01
      - title: Зависимость интенсивности от расстояния
        tex: 'I \sim \frac{1}{R^2}'
        sym: [I_int, R_src]
        src: o01
        errata: [O02]
    questions:
      - type: numeric
        cat: problem
        q: Через площадку 2 м² за 5 с прошла энергия 100 Дж. Найдите интенсивность.
        num: { value: 10, unit: 'Дж/(м²·с)', check: '100/(2*5)' }
        hint: '$I = \frac{W}{S\cdot t}$.'
        explain: Интенсивность — энергия через единицу площади за единицу времени.
        f: [1]
        sol: { given: ['W = 100 Дж', 'S = 2 м²', 't = 5 с'], find: 'I', formula: 'I = \frac{W}{S\cdot t}', calc: 'I = \frac{100}{2\cdot5} = 10', answer: '10 Дж/(м²·с)' }
        src: o01
      - type: numeric
        cat: problem
        q: В объёме 0,5 м³ содержится энергия волны 20 Дж. Найдите плотность энергии.
        num: { value: 40, unit: 'Дж/м³', check: '20/0.5' }
        hint: '$w = \frac WV$.'
        explain: Плотность энергии — энергия в единице объёма.
        f: [2]
        sol: { given: ['W = 20 Дж', 'V = 0,5 м³'], find: 'w', formula: 'w = \frac{W}{V}', calc: 'w = \frac{20}{0{,}5} = 40', answer: '40 Дж/м³' }
        src: o01
      - type: single
        cat: formula
        q: Частоту электромагнитной волны увеличили в 2 раза. Во сколько раз изменилась интенсивность?
        opts: ['Увеличилась в 16 раз', 'Увеличилась в 4 раза', 'Увеличилась в 2 раза', 'Уменьшилась в 16 раз']
        ans: a
        hint: '$I \sim \nu^4$.'
        explain: '$2^4 = 16$.'
        f: [3]
        src: o01
      - type: single
        cat: formula
        q: Амплитуду волны увеличили в 3 раза. Как изменилась интенсивность?
        opts: ['Увеличилась в 9 раз', 'Увеличилась в 3 раза', 'Увеличилась в 81 раз', 'Не изменилась']
        ans: a
        hint: '$I \sim A^2$.'
        explain: '$3^2 = 9$.'
        f: [4]
        src: o01
      - type: single
        cat: formula
        q: Расстояние до источника увеличили в 2 раза. Как изменилась интенсивность?
        opts: ['Уменьшилась в 4 раза', 'Уменьшилась в 2 раза', 'Увеличилась в 4 раза', 'Не изменилась']
        ans: a
        hint: '$I \sim \frac{1}{R^2}$ (R — см. замечание O02).'
        explain: 'Интенсивность обратно пропорциональна квадрату $R$: $2^2 = 4$.'
        f: [5]
        src: o01
      - type: single
        cat: theory
        q: Что такое интенсивность волны по конспекту?
        opts: ['Энергия, которая проходит через единицу площади за единицу времени', 'Энергия в единице объёма', 'Энергия, которую переносит волна за один период', 'Амплитуда волны в квадрате']
        ans: a
        hint: Её ещё называют плотностью потока энергии.
        explain: 'Интенсивность, или плотность потока энергии, — энергия через единицу площади за единицу времени; энергия в единице объёма — это плотность энергии, «не одно и то же».'
        src: o01
      - type: matching
        cat: theory
        q: Сопоставьте величину и её единицу.
        pairs:
          - ['Интенсивность (плотность потока энергии)', '$\frac{Дж}{м^2\cdot с}$']
          - ['Плотность энергии', '$\frac{Дж}{м^3}$']
          - ['Энергия', 'Дж']
        hint: В единицах интенсивности есть и площадь, и время.
        explain: 'Единицы указаны рядом с формулами на стр. o01.'
        f: [1, 2]
        src: o01
