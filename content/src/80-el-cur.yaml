errata:
  - id: EL10
    page: c36
    severity: typo
    original: '«Из опыта Мандельштама и Папалекси, Толмена и Стюарда…»'
    issue: Фамилия — Стюарт (опыт Толмена и Стюарта).
    target: 'Фамилия в названии опыта'
    suggestion: '«…Толмена и Стюарта».'
  - id: EL11
    page: c37
    severity: note
    original: '«Ag³⁺ q = +3e»'
    issue: 'Правило верно: у иона 3+ заряд +3e. Но ион серебра обычно однозарядный — Ag⁺ (q = +e); трёхзарядный ион для примера — Al³⁺.'
    target: 'Пример иона с зарядом +3e'
    suggestion: '«Ag⁺: q = +e; Al³⁺: q = +3e».'
  - id: EL12
    page: c38
    severity: note
    original: '\(k = \frac1F\cdot\frac Az\), «A — атомная масса (можно найти в таблице Менделеева)»'
    issue: 'Чтобы k получился в кг/Кл (как в \(m = kIt\) с массой в кг), A подставляют как молярную массу в кг/моль. В таблице Менделеева значение указано в г/моль (а. е. м.) — его делят на 1000.'
    target: 'Расшифровка A в законе Фарадея'
    suggestion: '«A — молярная масса, кг/моль (число из таблицы Менделеева, делённое на 1000)».'
  - id: EL13
    page: c39
    severity: note
    original: '«В качестве меньшего воздействия можно считать термическое воздействие, световое…» [чтение неуверенное]'
    issue: 'По смыслу (строкой выше: «проводимость которых сильно зависит от внешнего воздействия») здесь, видимо, «внешнего».'
    target: 'Слово «меньшего» в описании полупроводников'
    suggestion: '«В качестве внешнего воздействия можно считать термическое, световое, деформационное и примесное воздействие».'

topics:
  - id: med-metals
    title: Ток в диэлектриках и металлах
    pages: [c36]
    theory:
      - kind: definition
        title: Электрический ток в диэлектриках
        body: Диэлектрики не пропускают электрический ток. Сопротивление диэлектриков очень большое, поэтому их проводимость стремится к нулю. Сопротивление диэлектриков почти не меняется даже при изменении температуры (на графике R(T) — горизонтальная прямая).
        src: c36
      - kind: text
        title: Носители тока в металлах
        body: Из опытов Мандельштама и Папалекси, Толмена и Стюарта (в тетради «Стюарда», см. EL10) известно, что носителями электрического тока в металлах являются свободные электроны.
        src: c36
        errata: [EL10]
      - kind: rule
        title: Сопротивление металла и температура
        body: 'При увеличении температуры металла его сопротивление линейно возрастает, а проводимость уменьшается, и наоборот: $R(t) = R_0(1 + \alpha t)$, где α — термический (температурный) коэффициент сопротивления [К⁻¹], $R_0$ — сопротивление при t = 0 °C.'
        src: c36
        fig: rt-graphs
    formulas:
      - title: Сопротивление металла
        tex: 'R(t) = R_0(1 + \alpha t)'
        sym: [R_res, R0_t, alpha_T, t_temp]
        src: c36
    questions:
      - type: numeric
        cat: problem
        q: 'Сопротивление металлической проволоки при 0 °C равно 10 Ом, термический коэффициент $4\cdot10^{-3}$ К⁻¹. Найдите её сопротивление при 100 °C.'
        num: { value: 14, unit: 'Ом', check: '10*(1+4e-3*100)' }
        hint: '$R(t) = R_0(1 + \alpha t)$.'
        explain: '$R = 10\cdot(1 + 0{,}4) = 14$ Ом.'
        f: [1]
        sol: { given: ['R₀ = 10 Ом', 'α = 4·10⁻³ К⁻¹', 't = 100 °C'], find: 'R', formula: 'R = R_0(1 + \alpha t)', calc: 'R = 10\cdot1{,}4 = 14', answer: '14 Ом' }
        src: c36
      - type: numeric
        cat: problem
        q: 'При нагревании от 0 °C до 50 °C сопротивление металлического резистора выросло с 20 Ом до 24 Ом. Найдите термический коэффициент сопротивления.'
        num: { value: 0.004, unit: 'К⁻¹', check: '(24/20-1)/50' }
        hint: '$\alpha = \frac{R - R_0}{R_0t}$.'
        explain: '$\alpha = \frac{24 - 20}{20\cdot50} = 4\cdot10^{-3}$ К⁻¹.'
        f: [1]
        sol: { given: ['R₀ = 20 Ом', 'R = 24 Ом', 't = 50 °C'], find: 'α', formula: '\alpha = \frac{R - R_0}{R_0t}', calc: '\alpha = \frac{4}{1000} = 4\cdot10^{-3}', answer: '4·10⁻³ К⁻¹' }
        src: c36
      - type: single
        cat: theory
        q: Что является носителями тока в металлах?
        opts: ['Свободные электроны', 'Положительные ионы', 'Электроны и дырки', 'Протоны']
        ans: a
        hint: Вывод из опытов Мандельштама–Папалекси и Толмена–Стюарта.
        explain: Носителями электрического тока в металлах являются свободные электроны.
        src: c36
      - type: single
        cat: theory
        q: Как сопротивление диэлектрика зависит от температуры?
        opts: ['Почти не меняется', 'Резко растёт', 'Резко падает', 'Линейно растёт']
        ans: a
        hint: График R(T) на стр. c36 — горизонтальная прямая.
        explain: Сопротивление диэлектриков почти не меняется даже при изменении температуры.
        src: c36
      - type: single
        cat: theory
        q: Как меняется сопротивление металла при нагревании?
        opts: ['Линейно растёт', 'Линейно уменьшается', 'Резко уменьшается', 'Не меняется']
        ans: a
        hint: '$R(t) = R_0(1 + \alpha t)$.'
        explain: Сопротивление металла при нагревании линейно возрастает, проводимость уменьшается.
        f: [1]
        src: c36

# ───────────────────────────────────────────────────────────────
  - id: med-electrolyte
    title: Ток в электролитах. Законы Фарадея
    pages: [c37, c38]
    theory:
      - kind: definition
        title: Электролиты и ионы
        body: 'Жидкость проводит ток, если это жидкий металл или электролит. Электролиты — это жидкости с ионными примесями. Ион — частица, которая потеряла своего противоположно заряженного напарника: в NaCl натрий отдаёт электрон хлору, получаются Na⁺ ($q = +e$) и Cl⁻ ($q = -e$). Ион с зарядом 3+ имеет заряд $+3e$ (о примере Ag³⁺ см. EL11).'
        src: c37
        errata: [EL11]
      - kind: rule
        title: Катионы и анионы
        body: 'Положительные ионы — катионы, отрицательные — анионы. Катионы притягиваются к катоду (электрод «−»), анионы — к аноду (электрод «+»). Носители тока в электролитах — положительные и отрицательные ионы.'
        src: [c37, c38]
        fig: electrolysis
      - kind: law
        title: Первый закон Фарадея
        body: 'Масса вещества, выделившегося на электроде, пропорциональна прошедшему заряду: $m = kq$, а так как $q = It$, то $m = kIt$; k — электрохимический эквивалент.'
        src: c37
      - kind: law
        title: Второй закон Фарадея
        body: 'Электрохимический эквивалент пропорционален химическому эквиваленту: $k = \frac1F\cdot\frac Az$, где $F = 96\,500$ Кл/моль — постоянная Фарадея, A — атомная масса (из таблицы Менделеева), z — валентность (о единицах A см. EL12).'
        src: c38
        errata: [EL12]
      - kind: rule
        title: Сопротивление электролита и температура
        body: 'При увеличении температуры электролита его сопротивление линейно уменьшается, а проводимость увеличивается: $R(t) = R_0(1 - \alpha t)$.'
        src: c38
    formulas:
      - title: Первый закон Фарадея
        tex: 'm = kq,\qquad m = kIt'
        sym: [m_dep, k_ech, q_el, I_cur, t]
        boxed: true
        src: c37
      - title: Второй закон Фарадея
        tex: 'k = \frac{1}{F}\cdot\frac{A}{z}'
        sym: [k_ech, F_far, A_atom, z_val]
        boxed: true
        src: c38
        errata: [EL12]
      - title: Постоянная Фарадея
        tex: 'F = 96\,500\ \frac{\text{Кл}}{\text{моль}}'
        sym: [F_far]
        src: c38
      - title: Сопротивление электролита
        tex: 'R(t) = R_0(1 - \alpha t)'
        sym: [R_res, R0_t, alpha_T, t_temp]
        src: c38
    questions:
      - type: numeric
        cat: problem
        q: 'При электролизе через раствор 1 час идёт ток 2 А. Электрохимический эквивалент вещества $3{,}3\cdot10^{-7}$ кг/Кл. Какая масса выделится на катоде?'
        num: { value: 2.376e-3, unit: 'кг', check: '3.3e-7*2*3600' }
        hint: '$m = kIt$, t = 3600 с.'
        explain: '$m = 3{,}3\cdot10^{-7}\cdot2\cdot3600 \approx 2{,}38\cdot10^{-3}$ кг ≈ 2,4 г.'
        f: [1]
        sol: { given: ['k = 3,3·10⁻⁷ кг/Кл', 'I = 2 А', 't = 3600 с'], find: 'm', formula: 'm = kIt', calc: 'm = 3{,}3\cdot10^{-7}\cdot7200 \approx 2{,}38\cdot10^{-3}', answer: '≈ 2,38·10⁻³ кг' }
        src: c37
      - type: numeric
        cat: problem
        q: 'Найдите электрохимический эквивалент двухвалентного металла с молярной массой 64 г/моль ($F = 96\,500$ Кл/моль).'
        num: { value: 3.316e-7, unit: 'кг/Кл', check: '0.064/(96500*2)' }
        hint: '$k = \frac{A}{Fz}$, A = 0,064 кг/моль.'
        explain: '$k = \frac{0{,}064}{96\,500\cdot2} \approx 3{,}3\cdot10^{-7}$ кг/Кл.'
        f: [2]
        sol: { given: ['A = 0,064 кг/моль', 'z = 2', 'F = 96 500 Кл/моль'], find: 'k', formula: 'k = \frac{1}{F}\cdot\frac{A}{z}', calc: 'k = \frac{0{,}064}{193\,000} \approx 3{,}3\cdot10^{-7}', answer: '≈ 3,3·10⁻⁷ кг/Кл' }
        src: c38
        errata: [EL12]
      - type: numeric
        cat: problem
        q: 'Вещество с электрохимическим эквивалентом $10^{-7}$ кг/Кл выделяют током 10 А. За какое время выделится 3,6 г?'
        num: { value: 3600, unit: 'с', check: '3.6e-3/(1e-7*10)' }
        hint: '$t = \frac{m}{kI}$.'
        explain: '$t = \frac{3{,}6\cdot10^{-3}}{10^{-7}\cdot10} = 3600$ с = 1 ч.'
        f: [1]
        sol: { given: ['m = 3,6·10⁻³ кг', 'k = 10⁻⁷ кг/Кл', 'I = 10 А'], find: 't', formula: 't = \frac{m}{kI}', calc: 't = \frac{3{,}6\cdot10^{-3}}{10^{-6}} = 3600', answer: '3600 с' }
        src: c37
      - type: numeric
        cat: problem
        q: 'Сопротивление электролита при 0 °C равно 50 Ом, α = 0,02 К⁻¹. Найдите его сопротивление при 10 °C.'
        num: { value: 40, unit: 'Ом', check: '50*(1-0.02*10)' }
        hint: 'У электролитов $R(t) = R_0(1 - \alpha t)$.'
        explain: '$R = 50\cdot(1 - 0{,}2) = 40$ Ом — при нагревании сопротивление уменьшилось.'
        f: [4]
        sol: { given: ['R₀ = 50 Ом', 'α = 0,02 К⁻¹', 't = 10 °C'], find: 'R', formula: 'R = R_0(1 - \alpha t)', calc: 'R = 50\cdot0{,}8 = 40', answer: '40 Ом' }
        src: c38
      - type: numeric
        cat: problem
        q: 'Чему равен заряд иона Al³⁺ в кулонах?'
        num: { value: 4.8e-19, unit: 'Кл', check: '3*1.6e-19' }
        hint: 'Ион 3+ имеет заряд $+3e$.'
        explain: '$q = 3\cdot1{,}6\cdot10^{-19} = 4{,}8\cdot10^{-19}$ Кл.'
        sol: { given: ['ион 3+', 'e = 1,6·10⁻¹⁹ Кл'], find: 'q', formula: 'q = +3e', calc: 'q = 3\cdot1{,}6\cdot10^{-19} = 4{,}8\cdot10^{-19}', answer: '4,8·10⁻¹⁹ Кл' }
        src: c37
        errata: [EL11]
      - type: single
        cat: theory
        q: К какому электроду движутся катионы?
        opts: ['К катоду («−»)', 'К аноду («+»)', 'Остаются на месте', 'К обоим электродам']
        ans: a
        hint: Рисунок сосуда на стр. c37.
        explain: Катионы (положительные ионы) притягиваются к катоду.
        src: c37
      - type: single
        cat: theory
        q: Что является носителями тока в электролитах?
        opts: ['Положительные и отрицательные ионы', 'Только свободные электроны', 'Электроны и дырки', 'Только протоны']
        ans: a
        hint: Начало второго абзаца стр. c38.
        explain: Носители тока в электролитах — положительные и отрицательные ионы.
        src: c38
      - type: single
        cat: theory
        q: Как меняется сопротивление электролита при нагревании?
        opts: ['Линейно уменьшается', 'Линейно растёт', 'Не меняется', 'Резко растёт']
        ans: a
        hint: '$R(t) = R_0(1 - \alpha t)$.'
        explain: Сопротивление электролита при нагревании уменьшается, проводимость растёт.
        f: [4]
        src: c38
      - type: matching
        cat: theory
        q: Сопоставьте обозначение в законах Фарадея и смысл.
        pairs:
          - ['$k$', 'Электрохимический эквивалент']
          - ['$F$', 'Постоянная Фарадея, 96 500 Кл/моль']
          - ['$A$', 'Атомная (молярная) масса']
          - ['$z$', 'Валентность']
        hint: Обозначения на стр. c37–c38.
        explain: '$m = kIt$, $k = \frac{A}{Fz}$.'
        f: [1, 2]
        src: [c37, c38]

# ───────────────────────────────────────────────────────────────
  - id: med-semicond
    title: Ток в полупроводниках. Примесная проводимость
    pages: [c38, c39, c40]
    theory:
      - kind: definition
        title: Полупроводники
        body: 'Полупроводники — вещества, проводимость которых сильно зависит от внешнего воздействия: термического, светового, деформационного, примесного. По электропроводности полупроводники находятся между диэлектриками и металлами.'
        src: [c38, c39]
        errata: [EL13]
      - kind: rule
        title: Полупроводник и температура
        body: При увеличении температуры полупроводника его сопротивление резко уменьшается, а проводимость резко возрастает (на графике R(t) — резко убывающая кривая).
        src: [c38, c39]
      - kind: text
        title: Электроны и дырки
        body: 'Носители тока в полупроводниках — электроны и дырки. Самые распространённые полупроводники — кремний (Si) и германий (Ge). В чистом полупроводнике $I_e = I_{дырки}$: электроны кочуют из дырки в дырку, и ток дырок образуется за счёт перемещения дырок.'
        src: c39
        fig: semi-holes
      - kind: text
        title: Примесная проводимость n-типа
        body: 'n-тип (negative): к четырёхвалентному кремнию (IV) добавляют пятивалентный фосфор (V) в соотношении $10^9 : 1$ ($\frac{10^9}{1} = \frac{10^{23}}{10^{14}}$). Проводимость резко возрастает: $I_e \gg I_{дырки}$ — электронная проводимость, донорная примесь.'
        src: [c39, c40]
      - kind: text
        title: Примесная проводимость p-типа
        body: 'p-тип (positive): к кремнию (IV) добавляют трёхвалентный бор (III), тоже $10^9 : 1$. Проводимость резко возрастает: $I_e \ll I_{дырки}$ — дырочная проводимость, акцепторная примесь; свободный электрон заполняет место дырки.'
        src: c40
        fig: semi-np
    formulas:
      - title: Соотношение атомов кремния и примеси
        tex: '\frac{10^9}{1} = \frac{10^{23}}{10^{14}}'
        sym: []
        src: [c39, c40]
    questions:
      - type: single
        cat: theory
        q: Что является носителями тока в полупроводниках?
        opts: ['Электроны и дырки', 'Только ионы', 'Только свободные электроны', 'Протоны']
        ans: a
        hint: Стр. c39.
        explain: Носителями электрического тока в полупроводниках являются электроны и дырки.
        src: c39
      - type: single
        cat: theory
        q: В кремний добавили фосфор. Какая получится проводимость?
        opts: ['n-тип, электронная (донорная примесь)', 'p-тип, дырочная (акцепторная примесь)', 'Собственная', 'Ионная']
        ans: a
        hint: Фосфор — элемент V группы.
        explain: 'IV (Si) + V (P): $I_e \gg I_{дырки}$ — электронная проводимость, донорная примесь.'
        src: [c39, c40]
      - type: single
        cat: theory
        q: В кремний добавили бор. Какая получится проводимость?
        opts: ['p-тип, дырочная (акцепторная примесь)', 'n-тип, электронная (донорная примесь)', 'Металлическая', 'Ионная']
        ans: a
        hint: Бор — элемент III группы.
        explain: 'IV (Si) + III (B): $I_e \ll I_{дырки}$ — дырочная проводимость, акцепторная примесь.'
        src: c40
      - type: single
        cat: theory
