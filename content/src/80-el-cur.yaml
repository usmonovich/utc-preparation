# ───────────────────────────────────────────────────────────────
  - id: el-diode
    title: Полупроводниковый диод в цепи
    pages: [c40, e01]
    theory:
      - kind: definition
        id: el-diode-t4
        title: Полупроводниковый диод
        body: 'Полупроводниковый диод работает по принципу p-n перехода. Диодом пользуются в выпрямительных схемах: из переменного тока в них получают постоянный. Основная особенность диода — он проводит ток только в одном направлении. В прямом направлении (как на схеме стр. c40) ток идёт: $I \ne 0$, $R \to 0$.'
        src: c40
      - kind: note
        id: el-diode-t1
        title: Продолжение в другой тетради
        body: Тема о диоде начинается на стр. c40 конспекта «Электричество» и продолжается на стр. e01 — первой странице конспекта «Магнетизм».
        src: [c40, e01]
      - kind: rule
        id: el-diode-t2
        title: Диод в обратном направлении
        body: 'Если диод соединён неправильно (в обратном направлении), то $I \to 0$, $R \to \infty$ — ток через него не идёт.'
        src: e01
      - kind: text
        id: el-diode-t3
        title: Две схемы с диодом
        body: 'Ветвь «диод + резистор R» включена параллельно резистору 2R. При одной полярности диод открыт ($R \to 0$) и ток идёт по обеим ветвям: $R_{об} = \frac{2R}{3}$. При обратной полярности диод закрыт ($R \to \infty$), ветвь с R не работает — «ток не проходит», остаётся только 2R: $R_{об} = 2R$.'
        src: e01
        fig: diode
    formulas:
      - title: Диод открыт
        tex: 'R_{об} = \frac{2R}{3}'
        sym: [R_tot, R_res]
        cond: 'диод в прямом направлении ($R \to 0$), ветвь R параллельно 2R'
        src: e01
      - title: Диод закрыт
        tex: 'R_{об} = 2R'
        sym: [R_tot, R_res]
        cond: 'диод в обратном направлении ($R \to \infty$)'
        src: e01
    questions:
      - type: single
        cat: theory
        id: el-diode-q7
        q: В чём основная особенность полупроводникового диода?
        opts: ['Проводит ток только в одном направлении', 'Накапливает заряд', 'Увеличивает напряжение', 'Проводит ток одинаково в обе стороны']
        ans: a
        hint: Последний абзац стр. c40.
        explain: Основная особенность диода — он проводит электрический ток в одном направлении.
        src: c40
      - type: single
        cat: theory
        id: el-diode-q8
        q: Для чего диоды используют в выпрямительных схемах?
        opts: ['Чтобы из переменного тока получить постоянный', 'Чтобы повысить напряжение', 'Чтобы накопить заряд', 'Чтобы измерить силу тока']
        ans: a
        hint: Стр. c40.
        explain: В выпрямительных схемах из переменного тока получают постоянный электрический ток.
        src: c40
      - type: single
        cat: theory
        id: el-diode-q9
        q: На каком принципе работает полупроводниковый диод?
        opts: ['На p-n переходе', 'На электролизе', 'На электромагнитной индукции', 'На тепловом расширении']
        ans: a
        hint: Рисунок «p | n» на стр. c40.
        explain: Полупроводниковый диод работает по принципу p-n перехода.
        src: c40
