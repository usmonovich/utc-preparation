topics:
  - id: at-rutherford
    title: Опыт и модель Резерфорда
    pages: [a01]
    theory:
      - kind: text
        title: Опыт Резерфорда
        body: 'Резерфорд предложил свою модель, опираясь на свой опыт. В своём опыте он направил пучок заряженных частиц на тонкую металлическую пластину (в конспекте — алюминиевая фольга, см. замечание AT01). Под воздействием электрического поля ядра частицы отклонялись на большие углы (см. AT02).'
        src: a01
        errata: [AT01, AT02]
        fig: rutherford
      - kind: definition
        title: Планетарная модель атома
        body: 'По модели Резерфорда атом — это частица, состоящая из плотного положительно заряженного ядра, вокруг которого на больших расстояниях вращаются электроны, подобно планетам вокруг Солнца. Электроны движутся вокруг ядра по орбитам за счёт электростатического притяжения к ядру.'
        src: a01
      - kind: note
        title: Что ещё показал опыт
        body: |
          - Использовали α-частицы с энергией около 5 МэВ и тонкую золотую фольгу.
          - Большинство частиц проходило почти без отклонения, небольшая часть отклонялась более чем на 30°, и примерно одна из десяти тысяч — почти на 180°.
          - Отсюда: ядро имеет размер не более $10^{-14}$–$10^{-15}$ м (атом — около $10^{-10}$ м), но в нём весь положительный заряд и не менее 99,95 % массы атома.
          - По законам классической физики электрон, движущийся по орбите с ускорением, должен излучать и примерно за $10^{-8}$ с упасть на ядро. Атомы устойчивы — это противоречие разрешили постулаты Бора.
        src: a01
        web: &wruth
          - { title: 'Открытая физика: Опыт Резерфорда. Ядерная модель атома', url: 'https://physics.ru/courses/op25part2/content/chapter6/section/paragraph1/theory.html' }
    questions:
      - type: single
        cat: theory
        q: Что, по модели Резерфорда, находится в центре атома?
        opts: ['Плотное положительно заряженное ядро', 'Облако отрицательного заряда', 'Пустота', 'Электроны, собранные в шар']
        ans: a
        hint: Модель сравнивают с Солнечной системой.
        explain: По модели Резерфорда атом состоит из плотного положительно заряженного ядра, вокруг которого вращаются электроны.
        src: a01
      - type: single
        cat: theory
        q: За счёт чего, по конспекту, электроны движутся вокруг ядра по орбитам?
        opts: ['За счёт электростатического притяжения к ядру', 'За счёт гравитационного притяжения к ядру', 'За счёт магнитного поля Земли', 'За счёт ядерных сил']
        ans: a
        hint: Ядро заряжено положительно, электроны — отрицательно.
        explain: Электроны движутся вокруг ядра по орбитам за счёт электростатического притяжения к ядру.
        src: a01
      - type: single
        cat: theory
        q: С чем сравнивают планетарную модель атома?
        opts: ['С планетами, вращающимися вокруг Солнца', 'С кексом с изюмом', 'С кристаллической решёткой', 'С облаком пара']
        ans: a
        hint: Название модели — «планетарная».
        explain: Электроны вращаются вокруг ядра подобно планетам вокруг Солнца.
        src: a01
      - type: single
        cat: theory
        q: Почему часть частиц в опыте Резерфорда отклонялась на большие углы?
        opts: ['Их отталкивало электрическое поле положительного ядра', 'Их притягивали электроны', 'Они сталкивались друг с другом', 'Их отклоняло магнитное поле Земли']
        ans: a
        hint: 'Строка конспекта: «под воздействием электрического поля ядра…».'
        explain: Частицы отклонялись под воздействием электрического поля ядра.
        src: a01
      - type: single
        cat: theory
        q: Какие частицы и какую фольгу на самом деле использовали в опыте Резерфорда?
        opts: ['α-частицы и золотую фольгу', 'Электроны и алюминиевую фольгу', 'Нейтроны и медную фольгу', 'Протоны и свинцовую пластину']
        ans: a
        hint: См. замечание AT01 и блок «Что ещё показал опыт».
        explain: 'Использовали α-частицы с энергией около 5 МэВ и тонкую золотую фольгу (Открытая физика, 6.1).'
        src: a01
        web: *wruth
      - type: single
        cat: theory
        q: Как прошло фольгу большинство α-частиц?
        opts: ['Почти без отклонения', 'Все отразились назад', 'Все отклонились на 90°', 'Все застряли в фольге']
        ans: a
        hint: 'Атом почти «пустой»: ядро очень мало.'
        explain: 'Большинство частиц проходило почти без отклонения; примерно одна из десяти тысяч отклонялась почти на 180°.'
        src: a01
        web: *wruth
      - type: numeric
        cat: problem
        q: 'Размер атома около $10^{-10}$ м, размер ядра около $10^{-14}$ м. Во сколько раз атом больше ядра?'
        num: { value: 10000, unit: 'раз', check: '1e-10/1e-14' }
        hint: Разделите один размер на другой.
        explain: '$\frac{10^{-10}}{10^{-14}} = 10^4$ — атом в десять тысяч раз больше ядра.'
        sol: { given: ['d_атома ≈ 10⁻¹⁰ м', 'd_ядра ≈ 10⁻¹⁴ м'], find: 'во сколько раз', formula: 'k = \frac{d_{атома}}{d_{ядра}}', calc: 'k = \frac{10^{-10}}{10^{-14}} = 10^4', answer: '10⁴ раз' }
        src: a01
        web: *wruth
      - type: single
        cat: theory
        q: Какое противоречие было у планетарной модели с классической физикой?
        opts: ['Электрон на орбите должен излучать, терять энергию и упасть на ядро', 'Ядро должно разлететься от отталкивания электронов', 'Электроны должны притягиваться друг к другу', 'Атом должен быть нейтральным']
        ans: a
        hint: Заряд, движущийся с ускорением, излучает электромагнитные волны.
        explain: 'По классическим законам электрон на орбите излучал бы и примерно за 10⁻⁸ с упал бы на ядро; атомы же устойчивы.'
        src: a01
        web: *wruth

  - id: at-bohr
    title: Постулаты Бора
    pages: [a01, a02]
    theory:
      - kind: law
        title: Первый постулат Бора
        body: 'Атом может находиться только в определённых (стационарных) энергетических состояниях, при которых электроны движутся по разрешённым орбитам без излучения энергии.'
        src: a01
      - kind: law
        title: Второй постулат Бора (как в конспекте)
        body: 'Переход электрона между орбитами сопровождается поглощением или излучением фотона с энергией… — в конспекте фраза не закончена (см. AT13).'
        src: a02
        errata: [AT13]
      - kind: law
        title: Второй постулат Бора (правило частот)
        body: 'При переходе атома из одного стационарного состояния в другое излучается или поглощается квант (фотон), энергия которого равна разности энергий этих состояний: $h\nu_{kn} = E_k - E_n$. Если атом переходит на более низкий уровень ($E_k > E_n$), фотон излучается; чтобы перейти на более высокий уровень, атом должен поглотить фотон такой же энергии.'
        src: a02
        fig: bohr-levels
        web: &wbohr
          - { title: 'Открытая физика: Квантовые постулаты Бора', url: 'https://physics.ru/courses/op25part2/content/chapter6/section/paragraph2/theory.html' }
      - kind: text
        title: Уровни энергии атома водорода
        body: |
          По теории Бора энергия атома водорода в n-м стационарном состоянии $E_n = -\frac{13{,}6\ \text{эВ}}{n^2}$, $n = 1, 2, 3, \dots$ Знак «минус» означает, что электрон связан с ядром.
          - $n = 1$ — основное (самое устойчивое) состояние, $E_1 = -13{,}6$ эВ.
          - Энергия ионизации — энергия, чтобы перевести электрон с первого уровня «на бесконечность» ($n \to \infty$): $13{,}6$ эВ.
          - Радиусы орбит: $r_n = n^2 r_1$, где $r_1 = 5{,}29\cdot10^{-11}$ м — боровский радиус.
        src: a02
        web: &whyd
          - { title: 'Открытая физика: Атом водорода. Линейчатые спектры', url: 'https://physics.ru/textbook1/chapter6/section/paragraph3/' }
      - kind: list
        title: Спектральные серии водорода
        body: |
          Частоты линий спектра водорода: $\nu = R\left(\frac{1}{m^2} - \frac{1}{n^2}\right)$, $R = 3{,}29\cdot10^{15}$ Гц.
          - Серия Лаймана — переходы на уровень $m = 1$ (с $n = 2, 3, \dots$), ультрафиолетовая область.
          - Серия Бальмера — переходы на уровень $m = 2$ (с $n = 3, 4, \dots$), видимая область.
          - Серия Пашена — переходы на уровень $m = 3$, инфракрасная область.
        src: a02
        web: *whyd
    formulas:
      - title: Правило частот (второй постулат Бора)
        tex: 'h\nu_{kn} = E_k - E_n'
        sym: [h_pl, nu_kn, E_n_lvl]
        src: a02
        web: *wbohr
      - title: Энергия атома водорода
        tex: 'E_n = -\frac{13{,}6\ \text{эВ}}{n^2}'
        sym: [E_n_lvl, n_lvl]
        src: a02
        web: *whyd
      - title: Радиусы орбит атома водорода
        tex: 'r_n = n^2 r_1,\qquad r_1 = 5{,}29\cdot10^{-11}\ \text{м}'
        sym: [r_n_orb, n_lvl, r1_bohr]
        src: a02
        web: *whyd
      - title: Формула Ридберга
        tex: '\nu = R\left(\frac{1}{m^2} - \frac{1}{n^2}\right),\qquad R = 3{,}29\cdot10^{15}\ \text{Гц}'
        sym: [nu_kn, R_ryd, n_lvl]
        src: a02
        web: *whyd
    questions:
      - type: single
        cat: theory
        q: Что утверждает первый постулат Бора?
        opts: ['Атом находится только в стационарных состояниях и в них не излучает', 'Атом излучает энергию непрерывно', 'Электрон может находиться на любой орбите', 'Ядро атома всегда излучает фотоны']
        ans: a
        hint: 'Ключевые слова: «стационарные состояния», «без излучения».'
        explain: Атом может находиться только в определённых (стационарных) состояниях, при которых электроны движутся по разрешённым орбитам без излучения энергии.
        src: a01
      - type: single
        cat: theory
        q: Чем сопровождается, по конспекту, переход электрона между орбитами?
        opts: ['Поглощением или излучением фотона', 'Распадом ядра', 'Изменением заряда ядра', 'Ничем — переход происходит без энергии']
        ans: a
        hint: Второй постулат Бора на стр. a02.
        explain: Переход электрона между орбитами сопровождается поглощением или излучением фотона.
        src: a02
      - type: single
        cat: formula
        q: Чему равна энергия фотона при переходе атома из состояния k в состояние n?
        opts: ['$E_k - E_n$', '$E_k + E_n$', '$E_k\cdot E_n$', '$\frac{E_k}{E_n}$']
        ans: a
        hint: Правило частот.
        explain: '$h\nu_{kn} = E_k - E_n$ — энергия фотона равна разности энергий стационарных состояний.'
        f: [1]
        web: *wbohr
        src: a02
      - type: single
        cat: theory
        q: Что происходит, когда электрон переходит на более низкий уровень энергии?
        opts: ['Атом излучает фотон', 'Атом поглощает фотон', 'Атом ионизируется', 'Ничего не происходит']
        ans: a
        hint: Энергия атома уменьшается — куда она уходит?
        explain: При переходе на более низкий уровень разность энергий уносит излучённый фотон.
        f: [1]
        web: *wbohr
        src: a02
      - type: numeric
        cat: problem
        q: 'Найдите энергию атома водорода во втором стационарном состоянии (в эВ).'
        num: { value: -3.4, unit: 'эВ', check: '-13.6/4' }
        hint: '$E_n = -\frac{13{,}6}{n^2}$ эВ.'
        explain: '$E_2 = -\frac{13{,}6}{4} = -3{,}4$ эВ.'
        f: [2]
        sol: { given: ['n = 2'], find: 'E₂', formula: 'E_n = -\frac{13{,}6}{n^2}', calc: 'E_2 = -\frac{13{,}6}{2^2} = -3{,}4', answer: '−3,4 эВ' }
        web: *whyd
        src: a02
      - type: numeric
        cat: problem
        q: 'Атом водорода переходит с третьего уровня на второй. Найдите энергию излучённого фотона (в эВ).'
        num: { value: 1.889, unit: 'эВ', check: '13.6*(1/4-1/9)' }
        hint: '$E_3 - E_2$, где $E_n = -\frac{13{,}6}{n^2}$ эВ.'
        explain: '$E_3 - E_2 = -\frac{13{,}6}{9} + \frac{13{,}6}{4} \approx 1{,}89$ эВ — это красная линия серии Бальмера.'
        f: [1, 2]
        sol: { given: ['k = 3', 'n = 2'], find: 'hν', formula: 'h\nu = E_3 - E_2', calc: 'h\nu = 13{,}6\left(\frac14 - \frac19\right) \approx 1{,}89', answer: '≈ 1,89 эВ' }
        web: *whyd
        src: a02
      - type: numeric
        cat: problem
        q: 'Какую энергию нужно сообщить атому водорода в основном состоянии, чтобы ионизировать его (в эВ)?'
        num: { value: 13.6, unit: 'эВ', check: '13.6' }
        hint: Ионизация — переход с n = 1 на n → ∞, где энергия равна нулю.
        explain: '$0 - E_1 = 13{,}6$ эВ — энергия ионизации водорода.'
        f: [2]
        sol: { given: ['n = 1 → ∞'], find: 'E_ион', formula: 'E_{ион} = 0 - E_1', calc: 'E_{ион} = 0 - (-13{,}6) = 13{,}6', answer: '13,6 эВ' }
        web: *whyd
        src: a02
      - type: numeric
        cat: problem
        q: 'Во сколько раз радиус третьей орбиты атома водорода больше радиуса первой?'
        num: { value: 9, unit: 'раз', check: '3**2' }
        hint: '$r_n = n^2 r_1$.'
        explain: '$\frac{r_3}{r_1} = 3^2 = 9$.'
        f: [3]
        sol: { given: ['n = 3'], find: 'r₃/r₁', formula: 'r_n = n^2 r_1', calc: '\frac{r_3}{r_1} = 3^2 = 9', answer: '9 раз' }
        web: *whyd
        src: a02
      - type: numeric
        cat: problem
        q: 'Найдите частоту фотона, излучаемого при переходе атома водорода с уровня 2 на уровень 1 ($R = 3{,}29\cdot10^{15}$ Гц).'
        num: { value: 2.4675e15, unit: 'Гц', check: '3.29e15*(1-1/4)' }
        hint: '$\nu = R\left(\frac{1}{m^2} - \frac{1}{n^2}\right)$, здесь m = 1, n = 2.'
        explain: '$\nu = 3{,}29\cdot10^{15}\cdot\left(1 - \frac14\right) \approx 2{,}47\cdot10^{15}$ Гц — ультрафиолет (серия Лаймана).'
        f: [4]
        sol: { given: ['m = 1', 'n = 2', 'R = 3,29·10¹⁵ Гц'], find: 'ν', formula: '\nu = R\left(\frac{1}{m^2} - \frac{1}{n^2}\right)', calc: '\nu = 3{,}29\cdot10^{15}\cdot\frac34 \approx 2{,}47\cdot10^{15}', answer: '≈ 2,47·10¹⁵ Гц' }
        web: *whyd
        src: a02
      - type: matching
        cat: theory
        q: Сопоставьте серию спектра водорода и область спектра.
        pairs:
          - ['Лаймана (переходы на m = 1)', 'ультрафиолетовая']
          - ['Бальмера (переходы на m = 2)', 'видимая']
