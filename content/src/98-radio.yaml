errata:
  - id: AT08
    page: a06
    severity: typo
    original: '\(^2_1H\) — «дайтрон» / дейтерий'
    issue: 'Ядро дейтерия называется дейтрон.'
    target: 'Название ядра \(^2_1H\)'
    suggestion: '\(^2_1H\) — дейтрон / дейтерий.'
  - id: AT10
    page: a06
    severity: note
    original: '\(^{232}_{90}Th + ^1_0n \to ^{108}_{47}Ag + ^{73}_{32}Ge + ^1_1p + ^4_2\alpha + ^{47}_8O\)'
    issue: 'По законам сохранения последнее ядро найдено правильно (A: 233 = 233, Z: 90 = 90). Но изотопа кислорода с массовым числом 47 в природе нет — это учебное упражнение на законы сохранения, а не реальная реакция.'
    target: 'Пример «Бомбардировка» с торием'
    suggestion: 'Подписать: «учебное упражнение: неизвестное ядро \(^{47}_8X\) найдено из сохранения A и Z».'
  - id: AT11
    page: a07
    severity: note
    original: '«Радиоактивность — это способность некоторых тяжёлых ядер…»'
    issue: 'Радиоактивными бывают не только тяжёлые ядра: например, радиоуглерод (углерод-14) с периодом полураспада 5730 лет.'
    target: 'Определение радиоактивности'
    suggestion: '«Радиоактивность — способность некоторых ядер самопроизвольно распадаться, испуская частицы».'
  - id: AT12
    page: a07
    severity: note
    original: '\(^A_ZX \to ^0_0\gamma + ^A_ZX\) — γ-распад'
    issue: 'γ-квант испускает ядро, находящееся в возбуждённом состоянии; после излучения то же ядро переходит в обычное состояние. Без звёздочки запись выглядит так, будто ядро ничего не теряет.'
    target: 'Запись γ-распада'
    suggestion: '\(^A_ZX^* \to ^A_ZX + ^0_0\gamma\) (звёздочка — возбуждённое ядро).'
  - id: AT14
    page: a07
    severity: note
    original: 'Заголовок «Радиация» — дальше запись отсутствует'
    issue: 'Тема только озаглавлена.'
    target: 'Тема «Радиация» в конце стр. a07'
    suggestion: 'По вашей просьбе тема «Радиация (ионизирующее излучение)» составлена по материалам из интернета: виды излучения, проникающая способность, дозы, защита. Все записи — с пометкой «из интернета» и ссылками.'
    todo: 'Проверьте тему «Радиация» в подразделе «Ядерные реакции и радиоактивность» и утвердите или отклоните её записи.'

topics:
  - id: rad-particles
    title: Основные частицы ядерной физики
    pages: [a06]
    theory:
      - kind: list
        title: Обозначения частиц
        body: |
          - $^1_1p$ — протон / $^1_1H$ — ядро водорода.
          - $^1_0n$ — нейтрон.
          - $^0_{-1}e^-$ — электрон / $^0_{-1}\beta^-$ — β⁻-частица.
          - $^0_{+1}e^+$ — позитрон / $^0_{+1}\beta^+$ — β⁺-частица.
          - $^4_2\alpha$ — α-частица / $^4_2He$ — ядро гелия.
          - $^0_0\gamma$ — γ-луч / электромагнитная волна.
          - $^2_1H$ — дейтрон / дейтерий (в конспекте «дайтрон», см. AT08).
          - $^3_1H$ — тритон / тритий.
        src: a06
        errata: [AT08]
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте обозначение и частицу.
        pairs:
          - ['$^1_0n$', 'нейтрон']
          - ['$^0_{-1}e$', 'электрон (β⁻-частица)']
          - ['$^0_{+1}e$', 'позитрон (β⁺-частица)']
          - ['$^4_2\alpha$', 'ядро гелия']
        hint: Нижнее число — заряд в единицах e, верхнее — массовое число.
        explain: 'n — нейтрон, $e^-$ — электрон, $e^+$ — позитрон, α — ядро гелия $^4_2He$.'
        src: a06
      - type: single
        cat: theory
        q: Что такое α-частица?
        opts: ['Ядро гелия $^4_2He$', 'Электрон', 'Фотон', 'Нейтрон']
        ans: a
        hint: У неё A = 4, Z = 2.
        explain: '$^4_2\alpha$ — α-частица, она же ядро гелия $^4_2He$.'
        src: a06
      - type: single
        cat: theory
        q: Чем является γ-излучение?
        opts: ['Электромагнитной волной', 'Потоком электронов', 'Потоком ядер гелия', 'Потоком нейтронов']
        ans: a
        hint: 'У γ-кванта $A = 0$ и $Z = 0$.'
        explain: '$^0_0\gamma$ — луч, электромагнитная волна.'
        src: a06
      - type: single
        cat: theory
        q: Какое ядро называют дейтроном?
        opts: ['$^2_1H$', '$^3_1H$', '$^1_1H$', '$^4_2He$']
        ans: a
        hint: Дейтерий — «тяжёлый водород» с одним нейтроном.
        explain: '$^2_1H$ — дейтрон (ядро дейтерия), $^3_1H$ — тритон.'
        src: a06
      - type: single
        cat: theory
        q: Чем позитрон отличается от электрона?
        opts: ['Знаком заряда: у позитрона +e', 'Массой: позитрон в 1836 раз тяжелее', 'Позитрон — это ядро гелия', 'Позитрон не имеет заряда']
        ans: a
        hint: Сравните нижние индексы $-1$ и $+1$.
        explain: '$^0_{+1}e^+$ — позитрон с зарядом +e, $^0_{-1}e^-$ — электрон с зарядом −e.'
        src: a06

  - id: rad-reactions
    title: Ядерные реакции
    pages: [a06, a07]
    theory:
      - kind: law
        title: Законы сохранения в ядерных реакциях
        body: 'В реакции $^{A_1}_{Z_1}X + ^{A_2}_{Z_2}Y \to ^{A_3}_{Z_3}K + ^{A_4}_{Z_4}L$ сохраняются суммы массовых и зарядовых чисел: $A_1 + A_2 = A_3 + A_4$, $Z_1 + Z_2 = Z_3 + Z_4$.'
        src: a06
      - kind: text
        title: Бомбардировка (пример из конспекта)
        body: '$^{232}_{90}Th + ^1_0n \to ^{108}_{47}Ag + ^{73}_{32}Ge + ^1_1p + ^4_2\alpha + ^{47}_8O$. Последнее ядро найдено из законов сохранения: $232 + 1 = 108 + 73 + 1 + 4 + 47$ и $90 + 0 = 47 + 32 + 1 + 2 + 8$ (см. AT10).'
        src: a06
        errata: [AT10]
      - kind: definition
        title: Эндотермические и экзотермические реакции
        body: 'Если в процессе реакции масса ядер увеличивается, то в этой реакции энергия поглощается — такая реакция называется эндотермической. Если масса ядер уменьшается, энергия (теплота) выделяется — реакция экзотермическая.'
        src: [a06, a07]
    formulas:
      - title: Сохранение массового числа
        tex: 'A_1 + A_2 = A_3 + A_4'
        sym: [A_Z_reac]
        src: a06
      - title: Сохранение зарядового числа
        tex: 'Z_1 + Z_2 = Z_3 + Z_4'
        sym: [A_Z_reac]
        src: a06
    questions:
      - type: single
        cat: theory
        q: Что сохраняется в ядерной реакции по конспекту?
        opts: ['Сумма массовых чисел и сумма зарядовых чисел', 'Только масса ядер', 'Только число протонов в каждом ядре', 'Число ядер']
        ans: a
        hint: Две строки под общей записью реакции.
        explain: '$A_1 + A_2 = A_3 + A_4$ и $Z_1 + Z_2 = Z_3 + Z_4$.'
        f: [1, 2]
        src: a06
      - type: numeric
        cat: problem
        q: 'В реакции $^{14}_7N + ^4_2He \to ^{17}_8O + ^A_ZX$ найдите массовое число A частицы X.'
        num: { value: 1, unit: '', check: '14+4-17' }
        hint: '$A_1 + A_2 = A_3 + A_4$.'
        explain: '$A = 14 + 4 - 17 = 1$; $Z = 7 + 2 - 8 = 1$ — это протон $^1_1p$.'
        f: [1, 2]
        sol: { given: ['A: 14 + 4 = 17 + A', 'Z: 7 + 2 = 8 + Z'], find: 'A', formula: 'A_1 + A_2 = A_3 + A_4', calc: 'A = 18 - 17 = 1;\quad Z = 9 - 8 = 1', answer: 'A = 1 (протон)' }
        src: a06
      - type: numeric
        cat: problem
        q: 'В реакции $^9_4Be + ^4_2He \to ^{12}_6C + ^A_ZX$ найдите зарядовое число Z частицы X.'
        num: { value: 0, unit: '', check: '4+2-6', tolAbs: 0.01 }
        hint: '$Z_1 + Z_2 = Z_3 + Z_4$.'
        explain: '$Z = 4 + 2 - 6 = 0$, $A = 9 + 4 - 12 = 1$ — это нейтрон $^1_0n$.'
        f: [2]
        sol: { given: ['Z: 4 + 2 = 6 + Z', 'A: 9 + 4 = 12 + A'], find: 'Z', formula: 'Z_1 + Z_2 = Z_3 + Z_4', calc: 'Z = 6 - 6 = 0;\quad A = 13 - 12 = 1', answer: 'Z = 0 (нейтрон)' }
        src: a06
      - type: numeric
        cat: problem
        q: 'Проверьте пример из конспекта: чему равна сумма массовых чисел в правой части реакции $^{232}_{90}Th + ^1_0n \to ^{108}_{47}Ag + ^{73}_{32}Ge + ^1_1p + ^4_2\alpha + ^{47}_8O$?'
        num: { value: 233, unit: '', check: '108+73+1+4+47' }
        hint: Сложите верхние числа справа.
        explain: '$108 + 73 + 1 + 4 + 47 = 233 = 232 + 1$ — массовое число сохраняется.'
        f: [1]
        sol: { given: ['A справа: 108, 73, 1, 4, 47'], find: 'ΣA', formula: 'A_1 + A_2 = A_3 + A_4 + \dots', calc: '108 + 73 + 1 + 4 + 47 = 233', answer: '233' }
        src: a06
      - type: single
        cat: theory
        q: Как называется реакция, в которой масса ядер уменьшается?
        opts: ['Экзотермическая — энергия выделяется', 'Эндотермическая — энергия поглощается', 'Цепная', 'Термоядерная']
        ans: a
        hint: «Экзо» — наружу.
        explain: Если масса ядер уменьшается, энергия (теплота) выделяется — реакция экзотермическая.
        src: [a06, a07]
      - type: single
        cat: theory
        q: Что происходит в эндотермической ядерной реакции?
        opts: ['Масса ядер увеличивается, энергия поглощается', 'Масса ядер уменьшается, энергия выделяется', 'Масса и энергия не меняются', 'Выделяется только γ-излучение']
        ans: a
        hint: «Эндо» — внутрь.
        explain: Если масса ядер увеличивается, энергия поглощается — реакция эндотермическая.
        src: a06

  - id: rad-decay
    title: Радиоактивность. Виды распада
    pages: [a07]
    theory:
      - kind: definition
        title: Радиоактивность
        body: 'Радиоактивность — это способность некоторых (в конспекте — «тяжёлых», см. AT11) ядер к самопроизвольному распаду. Радиоактивное ядро распадается, выделяя частицы спонтанно, то есть без внешнего воздействия.'
        src: a07
        errata: [AT11]
      - kind: list
        title: Виды распада
        body: |
          - ① α-распад: $^A_ZX \to ^4_2\alpha + ^{A-4}_{Z-2}Y$ — элемент сдвигается в таблице Менделеева на 2 клетки к началу.
          - ② а) β⁻-распад: $^A_ZX \to ^0_{-1}e + ^A_{Z+1}Y + \tilde\nu$ ($\tilde\nu$ — антинейтрино) — сдвиг на 1 клетку к концу.
          - ② б) β⁺-распад: $^A_ZX \to ^0_{+1}e + ^A_{Z-1}Y + \nu$ (ν — нейтрино) — сдвиг на 1 клетку к началу.
          - ③ γ-распад: $^A_ZX \to ^0_0\gamma + ^A_ZX$ — элемент остаётся на месте (см. AT12).
        src: a07
        errata: [AT12]
        fig: decay-shift
    formulas:
      - title: α-распад
        tex: '^A_ZX \to {}^4_2\alpha + {}^{A-4}_{Z-2}Y'
        sym: [A_mass, Z_ch]
        src: a07
      - title: β⁻-распад
        tex: '^A_ZX \to {}^{\ \ 0}_{-1}e + {}^{A}_{Z+1}Y + \tilde\nu'
        sym: [A_mass, Z_ch]
        src: a07
      - title: β⁺-распад
        tex: '^A_ZX \to {}^{\ \ 0}_{+1}e + {}^{A}_{Z-1}Y + \nu'
        sym: [A_mass, Z_ch]
        src: a07
      - title: γ-распад
        tex: '^A_ZX \to {}^0_0\gamma + {}^A_ZX'
        sym: [A_mass, Z_ch]
        src: a07
    questions:
      - type: single
        cat: theory
        q: Что такое радиоактивность по конспекту?
        opts: ['Способность ядер к самопроизвольному распаду с выделением частиц', 'Способность атомов излучать свет при нагревании', 'Деление ядер под ударами нейтронов', 'Свечение вещества в темноте']
        ans: a
        hint: Ключевое слово — «самопроизвольный» (без внешнего воздействия).
        explain: Радиоактивное ядро распадается, выделяя частицы спонтанно, без внешнего воздействия.
        src: a07
      - type: single
        cat: formula
        q: Как меняются A и Z при α-распаде?
        opts: ['A уменьшается на 4, Z — на 2', 'A не меняется, Z растёт на 1', 'A не меняется, Z уменьшается на 1', 'A и Z не меняются']
        ans: a
        hint: Ядро теряет $^4_2\alpha$.
        explain: '$^A_ZX \to ^4_2\alpha + ^{A-4}_{Z-2}Y$.'
        f: [1]
        src: a07
      - type: single
        cat: formula
        q: Как меняются A и Z при β⁻-распаде?
        opts: ['A не меняется, Z увеличивается на 1', 'A уменьшается на 4, Z — на 2', 'A не меняется, Z уменьшается на 1', 'A увеличивается на 1']
        ans: a
        hint: 'Ядро испускает электрон $^0_{-1}e$.'
        explain: '$^A_ZX \to ^0_{-1}e + ^A_{Z+1}Y + \tilde\nu$.'
        f: [2]
        src: a07
      - type: matching
        cat: formula
        q: Сопоставьте вид распада и сдвиг элемента в таблице Менделеева.
        pairs:
          - ['α-распад', 'на 2 клетки к началу']
          - ['β⁻-распад', 'на 1 клетку к концу']
          - ['β⁺-распад', 'на 1 клетку к началу']
          - ['γ-распад', 'остаётся на месте']
        hint: Сдвиг равен изменению Z.
        explain: 'α: Z − 2; β⁻: Z + 1; β⁺: Z − 1; γ: Z не меняется.'
        f: [1, 2, 3, 4]
        src: a07
      - type: numeric
        cat: problem
        q: 'Ядро $^{226}_{88}Ra$ испытывает α-распад. Найдите массовое число получившегося ядра.'
        num: { value: 222, unit: '', check: '226-4' }
        hint: При α-распаде A уменьшается на 4.
        explain: '$A = 226 - 4 = 222$, $Z = 88 - 2 = 86$ — получается $^{222}_{86}Rn$ (радон).'
        f: [1]
        sol: { given: ['A = 226', 'Z = 88', 'α-распад'], find: 'A′', formula: '^A_ZX \to ^4_2\alpha + ^{A-4}_{Z-2}Y', calc: "A' = 226 - 4 = 222;\\quad Z' = 88 - 2 = 86", answer: '222' }
        src: a07
      - type: numeric
        cat: problem
        q: 'Ядро $^{14}_6C$ испытывает β⁻-распад. Найдите зарядовое число получившегося ядра.'
        num: { value: 7, unit: '', check: '6+1' }
        hint: При β⁻-распаде Z увеличивается на 1, A не меняется.
        explain: '$Z = 6 + 1 = 7$, $A = 14$ — получается $^{14}_7N$ (азот).'
        f: [2]
        sol: { given: ['A = 14', 'Z = 6', 'β⁻-распад'], find: 'Z′', formula: '^A_ZX \to ^0_{-1}e + ^A_{Z+1}Y + \tilde\nu', calc: "Z' = 6 + 1 = 7", answer: '7' }
        src: a07
      - type: numeric
        cat: problem
        q: 'Ядро $^{238}_{92}U$ испытало один α-распад и затем два β⁻-распада. Найдите Z получившегося ядра.'
        num: { value: 92, unit: '', check: '92-2+1+1' }
        hint: α уменьшает Z на 2, каждый β⁻ увеличивает Z на 1.
        explain: '$Z = 92 - 2 + 1 + 1 = 92$, $A = 238 - 4 = 234$ — получается изотоп урана $^{234}_{92}U$.'
        f: [1, 2]
        sol: { given: ['Z = 92', '1 α, 2 β⁻'], find: 'Z′', formula: "Z' = Z - 2 + 2\\cdot1", calc: "Z' = 92 - 2 + 2 = 92", answer: '92' }
        src: a07
      - type: single
        cat: theory
        q: Какая частица вылетает вместе с электроном при β⁻-распаде?
        opts: ['Антинейтрино', 'Нейтрино', 'Протон', 'α-частица']
        ans: a
        hint: 'В конспекте обозначена $\tilde\nu$.'
        explain: 'При β⁻-распаде вылетают электрон и антинейтрино $\tilde\nu$; при β⁺-распаде — позитрон и нейтрино ν.'
        f: [2, 3]
        src: a07

  - id: rad-law
    title: Закон радиоактивного распада
    pages: [a08]
    theory:
      - kind: law
        title: Закон радиоактивного распада
        body: 'За каждый период полураспада T распадается половина имеющихся ядер, поэтому $N(t) = N_0\cdot2^{-\frac tT}$. Здесь $N_0$ — начальное количество радиоактивных ядер, $N(t)$ — количество нераспавшихся ядер, t — время. Количество распавшихся ядер $\Delta N = N_0 - N = N_0\left(1 - 2^{-\frac tT}\right)$.'
        src: a08
        fig: half-life
      - kind: definition
        title: Активность
        body: 'Активность — это число радиоактивных распадов за единицу времени: $A = \frac{\Delta N}{\Delta t}$. Также $A = \frac{N_0}{T}\cdot2^{-\frac tT}\ln2 = \lambda N$, $A_0 = \lambda N_0$, $A(t) = A_0\cdot2^{-\frac tT}$.'
        src: a08
      - kind: definition
        title: Радиоактивная постоянная и время жизни
        body: '$\lambda = \frac{\ln2}{T}$ — радиоактивная постоянная; $\tau = \frac{T}{\ln2}$ — время средней жизни ядра.'
        src: a08
    formulas:
      - title: Закон радиоактивного распада
        tex: 'N(t) = N_0\cdot2^{-\frac{t}{T}}'
        sym: [N_t_dec, N0_dec, t_dec, T_half]
        boxed: true
