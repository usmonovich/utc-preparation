  - id: rad-radiation
    title: Радиация (ионизирующее излучение)
    pages: [a07]
    web:
      - { title: 'Открытая физика: Радиоактивность', url: 'https://physics.ru/courses/op25part2/content/chapter6/section/paragraph7/theory.html' }
      - { title: 'Википедия: Доза излучения', url: 'https://ru.wikipedia.org/wiki/Доза_излучения' }
      - { title: 'Википедия: Эквивалентная доза', url: 'https://ru.wikipedia.org/wiki/Эквивалентная_доза' }
      - { title: 'МЧС России: Альфа-излучение (термины)', url: 'https://mchs.gov.ru/ministerstvo/o-ministerstve/terminy-mchs-rossii/term/2425' }
      - { title: 'МЧС России: Радиационные аварии', url: 'https://mchs.gov.ru/deyatelnost/bezopasnost-grazhdan/radiacionnye-avarii_7' }
      - { title: 'БРЭ: Нейтронное излучение', url: 'https://bigenc.ru/c/neitronnoe-izluchenie-d5a0e3' }
    theory:
      - kind: note
        title: Почему тема дополнена
        body: 'В конспекте на стр. a07 есть только заголовок «Радиация» (замечание AT14). По вашей просьбе тема составлена по материалам из интернета; источники — ниже каждой записи.'
        src: a07
        errata: [AT14]
      - kind: definition
        title: Виды ионизирующего излучения
        body: |
          Излучения, которые возникают при радиоактивном распаде, ионизируют атомы и молекулы вещества, поэтому их называют ионизирующими.
          - **α-излучение** — поток ядер гелия, заряжено положительно.
          - **β-излучение** — поток электронов (при β⁺-распаде — позитронов).
          - **γ-излучение** — коротковолновое электромагнитное излучение (поток γ-квантов), заряда не имеет и в магнитном поле не отклоняется.
          - **Нейтронное излучение** — поток нейтронов.
        src: a07
      - kind: rule
        title: Проникающая способность
        body: |
          - α-частицы проходят в воздухе лишь несколько сантиметров и задерживаются листом бумаги. Но они очень опасны, если источник попал внутрь организма с пищей, воздухом или через повреждения кожи.
          - β-частицы проходят через слой алюминия толщиной в несколько миллиметров.
          - γ-излучение проникает сильнее всех: проходит через слой свинца толщиной 5–10 см.
          - Нейтроны лучше всего замедляют водородсодержащие вещества — вода, парафин, полиэтилен.
          - Чем сильнее излучение ионизирует вещество, тем меньше его проникающая способность: α ионизирует сильнее всех, γ — слабее.
        src: a07
        fig: penetration
      - kind: definition
        title: Дозы излучения
        body: |
          - **Поглощённая доза** $D = \frac{E}{m}$ — энергия излучения, поглощённая единицей массы. Единица — грей: 1 Гр = 1 Дж/кг (внесистемная — рад, 1 рад = 0,01 Гр).
          - **Эквивалентная доза** $H = W_R\cdot D$ учитывает опасность вида излучения. Единица — зиверт (Зв), внесистемная — бэр (1 бэр = 0,01 Зв). Коэффициент $W_R$: γ и β — 1, протоны — 2, α — 20, нейтроны — от 2,5 до ≈ 20 в зависимости от энергии.
          - **Экспозиционная доза** $X = \frac{q}{m}$ — заряд ионов одного знака, образованных излучением в единице массы сухого воздуха; единица Кл/кг, внесистемная — рентген: 1 Р = 2,58·10⁻⁴ Кл/кг.
          - **Мощность дозы** — доза за единицу времени (например, мкЗв/ч).
        src: a07
      - kind: rule
        title: Действие на организм и защита
        body: |
          Ионизирующее излучение возбуждает и ионизирует атомы и молекулы клеток, разрушает молекулы и клеточные структуры — так возникает лучевое поражение. Основные способы защиты:
          - **временем** — меньше находиться рядом с источником;
          - **расстоянием** — дальше от источника (эвакуация);
          - **экранированием** — поглощающие преграды и укрытия.
        src: a07
    formulas:
      - title: Поглощённая доза
        tex: 'D = \frac{E}{m}'
        sym: [D_abs, E_abs, m_abs]
        src: a07
      - title: Эквивалентная доза
        tex: 'H = W_R\cdot D'
        sym: [H_eq, W_R, D_abs]
        src: a07
      - title: Экспозиционная доза
        tex: 'X = \frac{q}{m},\qquad 1\ \text{Р} = 2{,}58\cdot10^{-4}\ \text{Кл/кг}'
        sym: [X_exp, q_ions, m_abs]
        src: a07
    questions:
      - type: single
        cat: theory
        q: Какое излучение задерживается листом бумаги?
        opts: ['α-излучение', 'β-излучение', 'γ-излучение', 'Нейтронное излучение']
        ans: a
        hint: У него самая малая проникающая способность.
        explain: α-частицы проходят в воздухе несколько сантиметров и задерживаются листом бумаги.
        src: a07
      - type: sequence
        cat: theory
        q: Расположите излучения по возрастанию проникающей способности.
        seq: ['α-излучение', 'β-излучение', 'γ-излучение']
        hint: Бумага → несколько мм алюминия → 5–10 см свинца.
        explain: 'α задерживается бумагой, β проходит несколько миллиметров алюминия, γ — 5–10 см свинца.'
        src: a07
      - type: single
        cat: theory
        q: Почему α-источники особенно опасны внутри организма?
        opts: ['α-частицы сильнее всех ионизируют вещество и при попадании внутрь облучают ткани вплотную', 'α-излучение проходит сквозь свинец', 'α-частицы не имеют заряда', 'α-излучение — это свет']
        ans: a
        hint: Снаружи их задерживает даже лист бумаги — а внутри преграды нет.
        explain: 'α-излучение сильнее всех ионизирует, а проникающая способность у него малая; внутри организма между источником и клетками преграды нет (МЧС России).'
        src: a07
      - type: numeric
        cat: problem
        q: 'Тело массой 50 кг поглотило энергию излучения 0,1 Дж. Найдите поглощённую дозу.'
        num: { value: 0.002, unit: 'Гр', check: '0.1/50' }
        hint: '$D = \frac Em$.'
        explain: '$D = \frac{0{,}1}{50} = 0{,}002$ Гр = 2 мГр.'
        f: [1]
        sol: { given: ['E = 0,1 Дж', 'm = 50 кг'], find: 'D', formula: 'D = \frac{E}{m}', calc: 'D = \frac{0{,}1}{50} = 0{,}002', answer: '0,002 Гр' }
        src: a07
      - type: numeric
        cat: problem
        q: 'Поглощённая доза α-излучения 1 мГр. Найдите эквивалентную дозу в мЗв ($W_R = 20$).'
        num: { value: 20, unit: 'мЗв', check: '20*1' }
        hint: '$H = W_R\cdot D$.'
        explain: '$H = 20\cdot1 = 20$ мЗв — та же поглощённая доза γ-излучения дала бы только 1 мЗв.'
        f: [2]
        sol: { given: ['D = 1 мГр', 'W_R = 20'], find: 'H', formula: 'H = W_R\cdot D', calc: 'H = 20\cdot1 = 20', answer: '20 мЗв' }
        src: a07
      - type: matching
        cat: formula
        q: Сопоставьте величину и её единицу в СИ.
        pairs:
          - ['Поглощённая доза', 'грей (Гр)']
          - ['Эквивалентная доза', 'зиверт (Зв)']
          - ['Экспозиционная доза', 'Кл/кг']
          - ['Активность', 'беккерель (Бк)']
        hint: Грей и зиверт — оба Дж/кг, но для разных доз.
        explain: 'D — Гр, H — Зв, X — Кл/кг; активность — число распадов в секунду, Бк.'
        f: [1, 2, 3]
        src: a07
      - type: multiple
        cat: theory
        q: Какие способы защиты от ионизирующего излучения названы в материалах МЧС? Выберите все.
        opts: ['Защита временем', 'Защита расстоянием', 'Защита экранированием', 'Нагревание источника']
        ans: [a, b, c]
        hint: Меньше быть рядом, дальше отойти, поставить преграду.
        explain: 'Защита временем (ограничение времени), расстоянием (эвакуация) и экранированием (укрытия, поглощающие материалы).'
        src: a07
      - type: single
        cat: theory
        q: Что лучше всего замедляет нейтроны?
        opts: ['Водородсодержащие вещества: вода, парафин, полиэтилен', 'Лист бумаги', 'Воздух', 'Магнитное поле']
        ans: a
        hint: Нейтрон теряет больше всего энергии при столкновении с лёгким ядром водорода.
        explain: Лучше всего замедляют нейтроны водородсодержащие соединения — вода, парафин, полиэтилен (БРЭ).
        src: a07
