  h_obj: { tex: 'h', meaning: 'размер предмета', unit: 'м', src: o16 }
  H_img: { tex: 'H', meaning: 'размер изображения', unit: 'м', src: o16 }
  k_mag: { tex: 'k', meaning: 'коэффициент увеличения', unit: '', src: o16 }
  D_opt: { tex: 'D', meaning: 'оптическая сила линзы (системы линз)', unit: 'дптр = м⁻¹', src: o18 }
  n_lens: { tex: 'n_{л}', meaning: 'показатель преломления материала линзы', unit: '', src: o18 }
  n_med: { tex: 'n_{с}', meaning: 'показатель преломления среды вокруг линзы (если не указан — 1)', unit: '', src: o18 }
