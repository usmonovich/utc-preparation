errata:
  - id: O17
    page: o15
    severity: note
    original: '«F — фокусное расстояние» (подпись к точке F на рисунке; так же на стр. o18)'
    issue: На рисунке буквой F отмечена точка — фокус. Фокусное расстояние — это расстояние от оптического центра O до фокуса; в формулах \(\frac1F = \frac1d + \frac1f\) и \(D = \frac1F\) F — именно расстояние.
    target: 'Подпись к точке F на рисунках линз'
    suggestion: 'Подписать: «F — фокус; OF = F — фокусное расстояние».'
  - id: O18
    page: o18
    severity: unclear
    original: Рисунок построения изображения в рассеивающей линзе с подписью «отражённый луч»
    issue: 'На рисунке изображение H больше предмета h и дальше от линзы — так выглядит построение для собирающей линзы при F > d (лупа). Подпись «отражённый луч», вероятно, относится к продолжению преломлённого луча: линза свет не отражает. По рисунку однозначно прочитать построение не удалось.'
    target: 'Рисунок построения изображения в рассеивающей линзе'
    suggestion: 'Подпись «отражённый луч» заменить на «продолжение преломлённого луча» (линза свет не отражает). Само построение похоже на собирающую линзу-лупу — его нужно перерисовать по лекции. Вопросов по этому рисунку в приложении нет.'
    todo: 'Сверьте рисунок с лекцией.'

topics:
  - id: lens-types
    title: Линзы и их виды
    pages: [o15]
    theory:
      - kind: definition
        title: Линза
        body: Прозрачная пластина, имеющая одно- или двухстороннюю кривизну, называется линзой.
        src: o15
      - kind: list
        title: Типы линз по функциональности
        body: 'По функциональности линза делится на два типа: собирающие и рассеивающие.'
        src: o15
      - kind: list
        title: Виды линз по внешнему виду
        body: 'Выпукло-выпуклая (двояковыпуклая); вогнуто-вогнутая (двояковогнутая); плоско-выпуклая; плоско-вогнутая; выпукло-вогнутая.'
        src: o15
      - kind: rule
        title: Значки линз на рисунках
        body: 'Собирающую линзу рисуют отрезком со стрелками наружу, рассеивающую — отрезком со стрелками внутрь.'
        src: [o15, o17]
    questions:
      - type: single
        cat: theory
        q: Что называется линзой?
        opts: ['Прозрачная пластина, имеющая одно- или двухстороннюю кривизну', 'Любое прозрачное тело', 'Плоское зеркало', 'Пластина с параллельными плоскими гранями']
        ans: a
        hint: Определение — первая фраза темы «Линзы».
        explain: Прозрачная пластина, имеющая одно- или двухстороннюю кривизну, называется линзой.
        src: o15
      - type: multiple
        cat: theory
        q: На какие два типа делятся линзы по функциональности? Выберите все.
        opts: ['Собирающие', 'Рассеивающие', 'Выпуклые', 'Плоские']
        ans: [a, b]
        hint: '«Выпуклая» и «вогнутая» — это внешний вид, а не функция.'
        explain: По функциональности линзы бывают собирающие и рассеивающие; выпуклость — признак внешнего вида.
        src: o15
      - type: multiple
        cat: theory
        q: Какие виды линз по внешнему виду перечислены в конспекте? Выберите все.
        opts: ['Двояковыпуклая', 'Двояковогнутая', 'Плоско-выпуклая', 'Плоско-вогнутая', 'Плоско-плоская', 'Цилиндрическая']
        ans: [a, b, c, d]
        hint: В конспекте пять рисунков; пятая — выпукло-вогнутая, её здесь нет.
        explain: 'Выпукло-выпуклая (двояковыпуклая), вогнуто-вогнутая (двояковогнутая), плоско-выпуклая, плоско-вогнутая и выпукло-вогнутая.'
        src: o15
      - type: single
        cat: theory
        q: Как на рисунках обозначают собирающую линзу?
        opts: ['Отрезком со стрелками наружу', 'Отрезком со стрелками внутрь', 'Отрезком без стрелок', 'Кругом']
        ans: a
        hint: У рассеивающей линзы стрелки направлены наоборот.
        explain: 'Собирающая линза — отрезок со стрелками наружу (стр. o15), рассеивающая — со стрелками внутрь (стр. o17).'
        src: [o15, o17]
      - type: text
        cat: theory
        q: Дайте определение линзы.
        ref: Прозрачная пластина, имеющая одно- или двухстороннюю кривизну, называется линзой.
        criteria: ['Сказано, что это прозрачная пластина', 'Упомянута кривизна одной или двух сторон']
        hint: Два признака — прозрачность и кривизна.
        explain: Определение со стр. o15.
        src: o15

# ───────────────────────────────────────────────────────────────
  - id: lens-conv
    title: 'Собирающая линза: ход лучей и формула линзы'
    pages: [o15, o16]
    theory:
      - kind: rule
        title: Собирающая линза
        body: Часто собирающую линзу мы получаем с помощью выпуклой линзы.
        src: o15
      - kind: text
        title: Обозначения на рисунке
        body: 'O — оптический центр; F — фокус (в конспекте подписано «фокусное расстояние»); через фокусы проходят фокальные плоскости (пунктир); прямая через O и F — главная оптическая ось.'
        src: o15
        errata: [O17]
      - kind: rule
        title: Параллельный пучок
        body: Пучок лучей, параллельных главной оптической оси, после собирающей линзы сходится в фокусе F.
        src: o16
      - kind: list
        title: Три луча для построения
        fig: lens-rays
        body: 'По рисункам конспекта: ① луч, параллельный главной оптической оси, после линзы проходит через фокус F; ② луч, проходящий через фокус, после линзы идёт параллельно оси; ③ луч через оптический центр O идёт не преломляясь.'
        src: o16
      - kind: text
        title: Обозначения в формуле линзы
        body: 'd — расстояние от предмета до линзы; f — расстояние от линзы до изображения; h — размер предмета; H — размер изображения; k — коэффициент увеличения.'
        src: o16
    formulas:
      - title: Формула собирающей линзы
        tex: '\frac{1}{F} = \frac{1}{d} + \frac{1}{f}'
        sym: [F_foc, d_obj, f_img]
        boxed: true
        src: o16
      - title: Коэффициент увеличения
        tex: 'k = \frac{H}{h} = \frac{|f|}{d}'
        sym: [k_mag, H_img, h_obj, f_img, d_obj]
        boxed: true
        src: o16
    questions:
      - type: numeric
        cat: problem
        q: Предмет стоит на расстоянии 30 см от собирающей линзы с фокусным расстоянием 10 см. На каком расстоянии от линзы получится изображение (в см)?
        num: { value: 15, unit: 'см', check: '1/(1/10-1/30)' }
        hint: 'Выразите $\frac1f = \frac1F - \frac1d$.'
        explain: '$\frac1f = \frac1{10} - \frac1{30} = \frac{2}{30}$, $f = 15$ см.'
        f: [1]
        sol: { given: ['d = 30 см', 'F = 10 см'], find: 'f', formula: '\frac1f = \frac1F - \frac1d', calc: '\frac1f = \frac1{10} - \frac1{30} = \frac{1}{15} \Rightarrow f = 15', answer: '15 см' }
        src: o16
      - type: numeric
        cat: problem
        q: Предмет находится на расстоянии 0,6 м от собирающей линзы, изображение — на расстоянии 0,3 м. Найдите фокусное расстояние.
        num: { value: 0.2, unit: 'м', check: '1/(1/0.6+1/0.3)' }
        hint: '$\frac1F = \frac1d + \frac1f$.'
        explain: '$\frac1F = \frac{1}{0{,}6} + \frac{1}{0{,}3} = 5$ м⁻¹, $F = 0{,}2$ м.'
        f: [1]
        sol: { given: ['d = 0,6 м', 'f = 0,3 м'], find: 'F', formula: '\frac1F = \frac1d + \frac1f', calc: '\frac1F = \frac{1}{0{,}6} + \frac{1}{0{,}3} = 5 \Rightarrow F = 0{,}2', answer: '0,2 м' }
        src: o16
      - type: numeric
        cat: problem
        q: Высота предмета 2 см, высота изображения 6 см. Найдите коэффициент увеличения.
        num: { value: 3, unit: '', check: '6/2' }
        hint: '$k = \frac Hh$.'
        explain: '$k = \frac{6}{2} = 3$.'
        f: [2]
        sol: { given: ['h = 2 см', 'H = 6 см'], find: 'k', formula: 'k = \frac{H}{h}', calc: 'k = \frac{6}{2} = 3', answer: '3' }
        src: o16
      - type: numeric
        cat: problem
        q: 'Предмет высотой 1 см стоит на расстоянии 20 см от линзы, изображение получилось на расстоянии 60 см. Найдите высоту изображения (в см).'
        num: { value: 3, unit: 'см', check: '1*60/20' }
        hint: '$\frac Hh = \frac{|f|}{d}$ ⇒ $H = h\frac{|f|}{d}$.'
        explain: '$k = \frac{60}{20} = 3$, $H = 3\cdot1 = 3$ см.'
        f: [2]
        sol: { given: ['h = 1 см', 'd = 20 см', 'f = 60 см'], find: 'H', formula: 'H = h\frac{|f|}{d}', calc: 'H = 1\cdot\frac{60}{20} = 3', answer: '3 см' }
        src: o16
      - type: single
        cat: theory
        q: Куда пойдёт луч, параллельный главной оптической оси, после собирающей линзы?
        opts: ['Через фокус F', 'Через оптический центр O', 'Параллельно оси', 'Обратно к предмету']
        ans: a
        hint: Первый из трёх рисунков на стр. o16.
        explain: 'Луч, параллельный главной оптической оси, после собирающей линзы проходит через фокус.'
        src: o16
      - type: single
        cat: theory
        q: Как идёт луч, проходящий через оптический центр линзы?
        opts: ['Не меняя направления', 'Через фокус', 'Параллельно главной оптической оси', 'Отражается назад']
        ans: a
        hint: Третий рисунок на стр. o16.
        explain: Луч через оптический центр O идёт не преломляясь.
        src: o16
      - type: matching
        cat: theory
        q: Сопоставьте обозначение и его смысл.
        pairs:
          - ['$d$', 'Расстояние от предмета до линзы']
          - ['$f$', 'Расстояние от линзы до изображения']
          - ['$h$', 'Размер предмета']
          - ['$H$', 'Размер изображения']
          - ['$k$', 'Коэффициент увеличения']
        hint: Список обозначений — внизу стр. o16.
        explain: Обозначения формулы линзы со стр. o16.
        f: [1, 2]
        src: o16

# ───────────────────────────────────────────────────────────────
  - id: lens-images
    title: Изображения в собирающей линзе
    pages: [o17]
    theory:
      - kind: list
        title: Положение предмета и вид изображения
        fig: lens-images
        body: '① $d > 2F$ — действительное, перевёрнутое, уменьшенное. ② $d = 2F$ — действительное, перевёрнутое, равное. ③ $2F > d > F$ — действительное, перевёрнутое, увеличенное. ④ $d = F$ — изображения нет. ⑤ $F > d > 0$ — мнимое, прямое, увеличенное. ⑥ $d = \infty$ — действительное, перевёрнутое, уменьшенное; $f \approx F$ — изображение возникает на фокусе (на фокальной плоскости).'
        src: o17
    questions:
      - type: single
        cat: theory
        q: 'Предмет стоит дальше двойного фокуса ($d > 2F$). Какое изображение даёт собирающая линза?'
        opts: ['Действительное, перевёрнутое, уменьшенное', 'Действительное, перевёрнутое, увеличенное', 'Мнимое, прямое, увеличенное', 'Действительное, перевёрнутое, равное']
        ans: a
        hint: Это первый случай в таблице на стр. o17.
        explain: '① $d > 2F$ — действительное, перевёрнутое, уменьшенное.'
        src: o17
      - type: single
        cat: theory
        q: 'Предмет стоит в фокусе ($d = F$). Что получится?'
        opts: ['Изображения нет', 'Мнимое, прямое, увеличенное', 'Действительное, равное', 'Изображение в фокусе']
        ans: a
        hint: Случай ④ на стр. o17.
        explain: '④ $d = F$ — изображения нет.'
        src: o17
      - type: single
        cat: theory
        q: 'Предмет стоит между фокусом и линзой ($F > d > 0$). Какое изображение?'
        opts: ['Мнимое, прямое, увеличенное', 'Действительное, перевёрнутое, увеличенное', 'Мнимое, перевёрнутое, уменьшенное', 'Изображения нет']
        ans: a
        hint: Это единственный случай в таблице, где изображение мнимое.
        explain: '⑤ $F > d > 0$ — мнимое, прямое, увеличенное.'
        src: o17
      - type: single
        cat: theory
        q: 'Предмет очень далеко ($d = \infty$). Где возникает изображение?'
        opts: ['На фокусе (на фокальной плоскости)', 'На двойном фокусе', 'В оптическом центре', 'Изображения нет']
        ans: a
        hint: 'В конспекте: $f \approx F$.'
        explain: '⑥ $d = \infty$: $f \approx F$ — изображение возникает на фокусе (на фокальной плоскости).'
        src: o17
      - type: matching
        cat: theory
        q: Сопоставьте положение предмета и вид изображения в собирающей линзе.
        pairs:
          - ['$d > 2F$', 'Действительное, перевёрнутое, уменьшенное']
          - ['$d = 2F$', 'Действительное, перевёрнутое, равное']
          - ['$2F > d > F$', 'Действительное, перевёрнутое, увеличенное']
          - ['$d = F$', 'Изображения нет']
          - ['$F > d > 0$', 'Мнимое, прямое, увеличенное']
        hint: Таблица на стр. o17, случаи ①–⑤.
        explain: 'Чем ближе предмет к фокусу, тем больше изображение; в фокусе изображения нет, ближе фокуса — мнимое.'
        src: o17
      - type: numeric
        cat: problem
        q: 'Фокусное расстояние собирающей линзы 20 см, предмет стоит на расстоянии 40 см ($d = 2F$). На каком расстоянии от линзы изображение (в см)?'
        num: { value: 40, unit: 'см', check: '1/(1/20-1/40)' }
        hint: 'Формула линзы: $\frac1f = \frac1F - \frac1d$.'
        explain: '$\frac1f = \frac1{20} - \frac1{40} = \frac1{40}$, $f = 40$ см $= d$, поэтому $k = 1$ — изображение равное, как в случае ② таблицы.'
        f: [lens-conv-f1]
        sol: { given: ['F = 20 см', 'd = 40 см'], find: 'f', formula: '\frac1f = \frac1F - \frac1d', calc: '\frac1f = \frac1{20} - \frac1{40} = \frac1{40} \Rightarrow f = 40', answer: '40 см' }
        src: [o16, o17]

# ───────────────────────────────────────────────────────────────
  - id: lens-div
    title: Рассеивающая линза
    pages: [o17, o18]
    theory:
      - kind: rule
        title: Рассеивающая линза
        body: Часто рассеивающую линзу мы получаем с помощью вогнутой линзы.
        src: o17
      - kind: text
        title: Ход лучей
        fig: lens-div
        body: 'По рисунку на стр. o18: лучи, параллельные главной оптической оси, после рассеивающей линзы расходятся, а их продолжения (пунктир) проходят через фокус F.'
        src: o18
      - kind: text
        title: Формула рассеивающей линзы
        body: 'В конспекте для рассеивающей линзы записано $-\frac1F = \frac1d - \frac1f$; увеличение — та же формула $k = \frac Hh = \frac{|f|}{d}$. Здесь $F$ и $f$ подставляются как расстояния (положительные числа).'
        src: o18
        errata: [O18]
    formulas:
      - title: Формула рассеивающей линзы
        tex: '-\frac{1}{F} = \frac{1}{d} - \frac{1}{f}'
        sym: [F_foc, d_obj, f_img]
        boxed: true
        src: o18
      - title: Коэффициент увеличения
        tex: 'k = \frac{H}{h} = \frac{|f|}{d}'
        sym: [k_mag, H_img, h_obj, f_img, d_obj]
        boxed: true
        src: o18
    questions:
      - type: numeric
        cat: problem
        q: 'Фокусное расстояние рассеивающей линзы 20 см, предмет на расстоянии 20 см. На каком расстоянии от линзы изображение (в см)?'
        num: { value: 10, unit: 'см', check: '1/(1/20+1/20)' }
        hint: 'Из $-\frac1F = \frac1d - \frac1f$: $\frac1f = \frac1d + \frac1F$.'
        explain: '$\frac1f = \frac1{20} + \frac1{20} = \frac1{10}$, $f = 10$ см.'
        f: [1]
        sol: { given: ['F = 20 см', 'd = 20 см'], find: 'f', formula: '\frac1f = \frac1d + \frac1F', calc: '\frac1f = \frac1{20} + \frac1{20} = \frac1{10} \Rightarrow f = 10', answer: '10 см' }
        src: o18
      - type: numeric
        cat: problem
        q: 'Рассеивающая линза с фокусным расстоянием 15 см, предмет на расстоянии 30 см. Найдите коэффициент увеличения.'
        num: { value: 0.333, unit: '', check: '(1/(1/30+1/15))/30' }
        hint: 'Сначала найдите $f$ из $\frac1f = \frac1d + \frac1F$, потом $k = \frac{|f|}{d}$.'
        explain: '$\frac1f = \frac1{30} + \frac1{15} = \frac1{10}$, $f = 10$ см; $k = \frac{10}{30} \approx 0{,}33$.'
        f: [1, 2]
