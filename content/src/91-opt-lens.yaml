# ───────────────────────────────────────────────────────────────
  - id: lens-power
    title: Оптическая сила линзы
    pages: [o18, o19]
    theory:
      - kind: text
        title: Оптическая сила
        body: 'Оптическая сила линзы $D = \frac1F$; единица — диоптрия: [дптр] = [м⁻¹].'
        src: o18
      - kind: text
        title: Фокусное расстояние через радиусы
        body: 'Линза — общая часть двух сфер радиусов $R_1$ и $R_2$ из одинакового материала ($n_л = n_1 = n_2$): $\frac1F = \left(\frac{n_л - n_с}{n_с}\right)\left(\frac{1}{R_1} + \frac{1}{R_2}\right)$. Та же формула для $D$.'
        src: o18
      - kind: rule
        title: Если детали не указаны
        body: 'Если детали особо не указаны: $n_с = 1$, $n_л = n$, $R_1 = R_2 = R$. Тогда $\frac1F = (n-1)\frac2R$ и $D = (n-1)\frac2R$.'
        src: o18
      - kind: rule
        title: Плоско-выпуклая и плоско-вогнутая линзы
        body: 'Одна поверхность плоская: $R_1 = R$, $R_2 = \infty$. Тогда $\frac1F = \left(\frac{n_л - n_с}{n_с}\right)\frac1R$, а при $n_с = 1$: $\frac1F = \frac{n_л - 1}{R}$.'
        src: o19
      - kind: rule
        title: Правило знаков
        body: '1) Выпуклая линза: $R_1, R_2 > 0$. 2) Вогнутая линза: $R_1, R_2 < 0$. 3) Собирающая линза: $F, D > 0$. 4) Рассеивающая линза: $F, D < 0$.'
        src: o19
      - kind: rule
        title: Вывод
        body: 'Выпуклая → собирающая; вогнутая → рассеивающая. Но при $n_л < n_с$: выпуклая → рассеивающая; вогнутая → собирающая.'
