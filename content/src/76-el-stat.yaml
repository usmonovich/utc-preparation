        src: c05
      - type: numeric
        cat: problem
        q: '$E_1 = E_2 = 100$ В/м, угол между векторами 120°. Найдите $E_{рез}$.'
        num: { value: 100, unit: 'В/м', check: 'Math.sqrt(100**2+100**2+2*100*100*Math.cos(2*Math.PI/3))' }
        hint: '$\cos120° = -0{,}5$.'
        explain: '$E_{рез} = \sqrt{10^4 + 10^4 - 10^4} = 100$ В/м.'
        f: [5]
        sol: {"given": ["E₁ = E₂ = 100 В/м", "α = 120°"], "find": "E_рез", "formula": "E_{рез} = \\sqrt{E_1^2 + E_2^2 + 2E_1E_2\\cos\\alpha}", "calc": "E_{рез} = \\sqrt{10^4 + 10^4 - 10^4} = 100", "answer": "100 В/м"}
        src: c05
      - type: numeric
        cat: problem
        q: Расстояние от точечного заряда до точки увеличили в 3 раза. Во сколько раз уменьшилась напряжённость?
        num: { value: 9, unit: '', check: '3**2' }
        hint: '$E \sim \frac{1}{R^2}$.'
        explain: Напряжённость уменьшилась в 9 раз.
        f: [1]
        sol: {"given": ["R' = 3R"], "find": "E / E'", "formula": "E \\sim \\frac{1}{R^2}", "calc": "\\frac{E}{E'} = 3^2 = 9", "answer": "в 9 раз"}
        src: c05
      - type: single
        cat: theory
        q: Как направлены силовые линии положительного заряда?
        opts: ['Исходят из заряда', 'Входят в заряд', 'Замкнуты вокруг заряда', 'Параллельны друг другу']
        ans: a
        hint: Стр. c04, рисунки «+» и «−».
        explain: Из положительного заряда силовые линии исходят, в отрицательный — входят.
        src: c04
      - type: single
