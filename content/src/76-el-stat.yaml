        opts: ['Всегда перпендикулярно', 'По касательной', 'Под углом 45°', 'Произвольно']
        ans: a
        hint: Второе предложение темы «Электрическое поле».
        explain: Силовые линии электрического поля всегда перпендикулярны к поверхности заряда.
        src: c04
