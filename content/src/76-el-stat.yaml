# ───────────────────────────────────────────────────────────────
  - id: es-sphere
    title: Поле заряженной сферы. Однородное поле
    pages: [c05, c06, c07]
    theory:
      - kind: rule
        title: Заряд на металлическом теле
        body: 'Если зарядить металлическое тело, то весь заряд распределится по поверхности тела. Распределение при этом неравномерное: на краях и гранях тела плотность заряда наибольшая. Только у сферы распределение заряда равномерное.'
        src: c05
      - kind: definition
        title: Поверхностная плотность заряда
        body: 'Поверхностная плотность заряда — это заряд единицы площади тела: $\sigma = \frac qS$ [Кл/м²]. (В тетради символ похож на δ, в приложении записан как σ.)'
        src: c05
      - kind: text
        title: Напряжённость поля заряженной сферы
        body: '① Внутри ($r < R$): $E_{внутр} = 0$; r — расстояние от центра до точки. ② На поверхности ($r = R$): $E_0 = k\frac{q}{R^2} = \frac{q}{\varepsilon_0S} = \frac{\sigma}{\varepsilon_0}$. ③ Снаружи ($r > R$, $r = R + l$): $E_{внеш} = k\frac{q}{r^2} = E_0\left(\frac{R}{R+l}\right)^2$.'
        src: c06
        fig: sphere-field
      - kind: definition
