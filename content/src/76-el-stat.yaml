# ───────────────────────────────────────────────────────────────
  - id: es-work
    title: Работа поля. Напряжение. Закон сохранения энергии
    pages: [c11, c12]
    theory:
      - kind: text
        title: Работа однородного поля
        body: 'Заряд перемещается на l под углом α к силе $F_к$; $\cos\alpha = \frac dl$, где d — расстояние между эквипотенциалями. $A = F_к\cdot l\cos\alpha = Eql\cos\alpha = Eqd$. Работа не зависит от формы пути: для четырёх разных путей между двумя эквипотенциалями $A_1 = A_2 = A_3 = A_4$.'
        src: c11
        fig: work-paths
      - kind: definition
        title: Энергия заряда в поле. Электрон-вольт
        body: '$W_п = \varphi\cdot q$. Электрон-вольт [эВ] — единица энергии, как и джоуль: 1 эВ = $1{,}6\cdot10^{-19}$ Дж, 1 кэВ = $1{,}6\cdot10^{-16}$ Дж, 1 МэВ = $1{,}6\cdot10^{-13}$ Дж.'
        src: c11
      - kind: definition
        title: Напряжение (разность потенциалов)
        body: '$A = -\Delta W_п = -(W_{п2} - W_{п1}) = -q(\varphi_2 - \varphi_1)$. $U = \varphi_1 - \varphi_2$ [В] — напряжение, разность потенциалов: $A = q(\varphi_1 - \varphi_2) = Uq$. В однородном поле $U = Ed$, $E = \frac Ud$ [В/м].'
        src: c12
      - kind: law
        title: Закон сохранения энергии для электрического поля
        body: 'Из $A = q(\varphi_1 - \varphi_2) = Eqd = Fd$ и $d = \frac{\upsilon_2^2 - \upsilon_1^2}{2a}$: $\varphi_1q - \varphi_2q = \frac{m\upsilon_2^2}{2} - \frac{m\upsilon_1^2}{2}$, то есть $\varphi_1q + \frac{m\upsilon_1^2}{2} = \varphi_2q + \frac{m\upsilon_2^2}{2}$, $W_{п1} + W_{к1} = W_{п2} + W_{к2}$.'
        src: c12
    formulas:
      - title: Работа однородного поля
        tex: 'A = Eql\cos\alpha,\qquad A = Eqd'
        sym: [A_el, E_el, q_el, l_disp, alpha_disp, d_el]
        boxed: true
        src: c11
      - title: Энергия заряда в поле
        tex: 'W_{п} = \varphi\cdot q'
        sym: [W_el, phi_el, q_el]
        src: c11
      - title: Электрон-вольт
        tex: '1\ \text{эВ} = 1{,}6\cdot10^{-19}\ \text{Дж},\quad 1\ \text{кэВ} = 1{,}6\cdot10^{-16}\ \text{Дж},\quad 1\ \text{МэВ} = 1{,}6\cdot10^{-13}\ \text{Дж}'
        sym: []
        src: c11
      - title: Напряжение
        tex: 'U = \varphi_1 - \varphi_2'
        sym: [U_volt, phi12_el]
        boxed: true
        src: c12
      - title: Работа через напряжение
        tex: 'A = q(\varphi_1 - \varphi_2) = Uq'
        sym: [A_el, q_el, phi12_el, U_volt]
        boxed: true
        src: c12
      - title: Напряжение и напряжённость
        tex: 'U = Ed,\qquad E = \frac Ud'
        sym: [U_volt, E_el, d_el]
        boxed: true
        src: c12
      - title: Закон сохранения энергии в электрическом поле
        tex: '\varphi_1q + \frac{m\upsilon_1^2}{2} = \varphi_2q + \frac{m\upsilon_2^2}{2}'
        sym: [phi12_el, q_el, m, v12_el]
        boxed: true
        src: c12
    questions:
      - type: numeric
        cat: problem
        q: 'Заряд 2 мкКл перемещается в однородном поле 1000 В/м на 5 см вдоль силовой линии. Найдите работу поля.'
        num: { value: 1e-4, unit: 'Дж', check: '1000*2e-6*0.05' }
