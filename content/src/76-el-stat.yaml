        num: { value: 2, unit: '', check: '2/1' }
        hint: 'ε стоит в знаменателе закона Кулона.'
        explain: '$F \sim \frac1\varepsilon$: сила уменьшилась в 2 раза.'
        f: [1]
        sol: {"given": ["ε = 2", "r не меняется"], "find": "F / F'", "formula": "F \\sim \\frac{1}{\\varepsilon}", "calc": "\\frac{F}{F'} = \\frac{2}{1} = 2", "answer": "в 2 раза"}
        src: c03
      - type: numeric
        cat: problem
        q: 'Два одинаковых заряда в вакууме на расстоянии 1 м взаимодействуют с силой 0,9 Н. Найдите каждый заряд.'
        num: { value: 1e-5, unit: 'Кл', check: 'Math.sqrt(0.9*1**2/9e9)' }
        hint: 'При $q_1 = q_2 = q$: $F = k\frac{q^2}{r^2}$.'
        explain: '$q = r\sqrt{\frac Fk} = \sqrt{\frac{0{,}9}{9\cdot10^9}} = 10^{-5}$ Кл.'
        f: [1]
        sol: { given: ['F = 0,9 Н', 'r = 1 м'], find: 'q', formula: 'q = r\sqrt{\frac{F}{k}}', calc: 'q = \sqrt{10^{-10}} = 10^{-5}', answer: '10⁻⁵ Кл' }
        src: c03
