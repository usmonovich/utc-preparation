  - id: es-energy
    title: Потенциальная энергия взаимодействия зарядов
    pages: [c07, c08]
    theory:
      - kind: text
        title: Энергия взаимодействия двух зарядов
        body: 'Сила взаимодействия: $F = k\frac{|q_1|\cdot|q_2|}{R^2}$; потенциальная энергия: $W_п = k\frac{q_1q_2}{R}$. Разница — в модулях: в формулу энергии заряды подставляют со знаками. Одноимённые заряды (+ +, − −): $W_п > 0$, отталкиваются; разноимённые (+ −): $W_п < 0$, притягиваются.'
        src: c07
      - kind: rule
        title: Вывод о знаке энергии
        body: Энергия отталкивания всегда положительна, а энергия притяжения тел всегда отрицательна.
        src: c07
      - kind: text
        title: Энергия системы зарядов
        body: 'Для трёх зарядов в вершинах треугольника со сторонами a, b, c энергии всех пар складываются: $W_{общ} = W_{1-2} + W_{2-3} + W_{1-3} = k\frac{q_1q_2}{a} + k\frac{q_2q_3}{b} + k\frac{q_1q_3}{c}$. Число пар в конспекте записано как $C_n^2 = \frac{n(n+1)}{2}$ — см. замечание EL04 (правильно $\frac{n(n-1)}{2}$).'
        src: c08
        errata: [EL04]
    formulas:
      - title: Потенциальная энергия двух зарядов
        tex: 'W_{п} = k\frac{q_1q_2}{R}'
        sym: [W_el, k_coul, q12, r_q]
        src: c07
      - title: Энергия трёх зарядов
        tex: 'W_{общ} = k\frac{q_1q_2}{a} + k\frac{q_2q_3}{b} + k\frac{q_1q_3}{c}'
        sym: [W_el, k_coul, q1n, abc_tri]
