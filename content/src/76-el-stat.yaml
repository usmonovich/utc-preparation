        src: c03
      - type: numeric
        cat: problem
        q: 'Заряды 2 нКл и 8 нКл находятся в воздухе на расстоянии 4 см. Найдите силу взаимодействия.'
        num: { value: 9e-5, unit: 'Н', check: '9e9*2e-9*8e-9/0.04**2' }
