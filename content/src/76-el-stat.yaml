        src: c05
      - type: numeric
        cat: problem
        q: 'В точке поля двух зарядов $E_1 = 30$ В/м и $E_2 = 40$ В/м, векторы перпендикулярны. Найдите результирующую напряжённость.'
        num: { value: 50, unit: 'В/м', check: 'Math.sqrt(30**2+40**2)' }
