        src: c12
      - type: numeric
        cat: problem
        q: 'Переведите энергию 5 кэВ в джоули.'
        num: { value: 8e-16, unit: 'Дж', check: '5*1.6e-16' }
        hint: '1 кэВ = $1{,}6\cdot10^{-16}$ Дж.'
        explain: '$5\cdot1{,}6\cdot10^{-16} = 8\cdot10^{-16}$ Дж.'
        f: [3]
        sol: {"given": ["W = 5 кэВ"], "find": "W в джоулях", "formula": "1\\ \\text{кэВ} = 1{,}6\\cdot10^{-16}\\ \\text{Дж}", "calc": "W = 5\\cdot1{,}6\\cdot10^{-16} = 8\\cdot10^{-16}", "answer": "8·10⁻¹⁶ Дж"}
        src: c11
      - type: numeric
        cat: problem
        q: 'Протон ($q = 1{,}6\cdot10^{-19}$ Кл, $m = 1{,}67\cdot10^{-27}$ кг) из состояния покоя прошёл разность потенциалов 100 В. Найдите его скорость.'
        num: { value: 1.384e5, unit: 'м/с', check: 'Math.sqrt(2*1.6e-19*100/1.67e-27)' }
        hint: 'По закону сохранения энергии $qU = \frac{m\upsilon^2}{2}$.'
