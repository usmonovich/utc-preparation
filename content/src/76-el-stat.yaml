        explain: '$A = 1000\cdot2\cdot10^{-6}\cdot0{,}05 = 10^{-4}$ Дж.'
        f: [1]
        sol: { given: ['E = 1000 В/м', 'q = 2·10⁻⁶ Кл', 'd = 0,05 м'], find: 'A', formula: 'A = Eqd', calc: 'A = 1000\cdot2\cdot10^{-6}\cdot0{,}05 = 10^{-4}', answer: '10⁻⁴ Дж' }
        src: c11
      - type: numeric
        cat: problem
        q: 'Тот же заряд (2 мкКл) в поле 1000 В/м сместился на 10 см под углом 60° к силовым линиям. Найдите работу.'
        num: { value: 1e-4, unit: 'Дж', check: '1000*2e-6*0.1*Math.cos(Math.PI/3)' }
