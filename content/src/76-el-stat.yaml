        q: 'Заряд 4 мкКл перенесли между двумя точками одной эквипотенциальной поверхности (φ = 50 В). Какую работу совершило поле?'
        num: { value: 0, unit: 'Дж', check: '4e-6*(50-50)', tolAbs: 1e-9 }
