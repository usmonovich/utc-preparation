# ───────────────────────────────────────────────────────────────
  - id: es-contact
    title: Контакт заряженных металлических тел
    pages: [c12, c13]
    theory:
      - kind: definition
        title: Контакт заряженных тел
        body: Когда два заряженных металлических тела соединяют тонким проводом или они соприкасаются друг с другом, возникает контакт, и за счёт этого тела обмениваются зарядами.
        src: c12
      - kind: rule
        title: Заряды после контакта
        body: 'После контакта потенциалы шаров становятся равными: $\varphi_1'' = \varphi_2''$, то есть $k\frac{q_1''}{R_1} = k\frac{q_2''}{R_2}$, а полный заряд сохраняется: $q_1 + q_2 = q_1'' + q_2''$. Отсюда $q_1'' = R_1\frac{q_1 + q_2}{R_1 + R_2}$, $q_2'' = R_2\frac{q_1 + q_2}{R_1 + R_2}$ — заряды делятся пропорционально радиусам. Одинаковые шары ($R_1 = R_2$) делят заряд поровну. Для нескольких шаров $q_i'' = R_i\frac{q_{об}}{R_{об}}$.'
        src: c13
        fig: contact-spheres
      - kind: text
        title: Общий потенциал после контакта
        body: '$\varphi''_{общ} = \varphi_1'' = \varphi_2''$; $\varphi''_{общ} = k\frac{q_{об}}{R_{об}} = \frac{\varphi_1R_1 + \dots + \varphi_NR_N}{R_1 + \dots + R_N}$, где $q_{об}$ — сумма зарядов, $R_{об}$ — сумма радиусов.'
        src: c13
    formulas:
      - title: Условие после контакта
        tex: "\\varphi_1' = \\varphi_2'"
        sym: [R12_sph, q12_after]
        boxed: true
        src: c13
      - title: Заряды двух шаров после контакта
        tex: "q_1' = R_1\\frac{q_1 + q_2}{R_1 + R_2},\\qquad q_2' = R_2\\frac{q_1 + q_2}{R_1 + R_2}"
        sym: [q12_after, R12_sph, q12]
        src: c13
      - title: Одинаковые шары
        tex: "q_1' = q_2' = \\frac{q_1 + q_2}{2}"
        sym: [q12_after, q12]
        cond: '\(R_1 = R_2\)'
        src: c13
      - title: Несколько шаров
        tex: "q_i' = R_i\\frac{q_{об}}{R_{об}},\\quad i = 1\\dots N"
        sym: [q12_after, qR_ob]
        boxed: true
        src: c13
      - title: Общий потенциал после контакта
        tex: "\\varphi'_{общ} = k\\frac{q_{об}}{R_{об}} = \\frac{\\varphi_1R_1 + \\dots + \\varphi_NR_N}{R_1 + \\dots + R_N}"
        sym: [phi_after, k_coul, qR_ob]
        boxed: true
        src: c13
    questions:
      - type: numeric
        cat: problem
        q: 'Шар радиусом 1 см с зарядом 8 нКл соединили тонким проводом с незаряженным шаром радиусом 3 см. Какой заряд останется на маленьком шаре?'
        num: { value: 2e-9, unit: 'Кл', check: '0.01*(8e-9+0)/(0.01+0.03)' }
        hint: Заряды делятся пропорционально радиусам.
        explain: "$q_1' = R_1\\frac{q_1 + q_2}{R_1 + R_2} = 1\\cdot\\frac{8}{4} = 2$ нКл."
        f: [2]
        sol: { given: ['R₁ = 1 см', 'R₂ = 3 см', 'q₁ = 8 нКл', 'q₂ = 0'], find: "q₁'", formula: "q_1' = R_1\\frac{q_1 + q_2}{R_1 + R_2}", calc: "q_1' = 1\\cdot\\frac{8}{4} = 2", answer: '2 нКл' }
        src: c13
      - type: numeric
        cat: problem
        q: 'В той же задаче (R₁ = 1 см, R₂ = 3 см, общий заряд 8 нКл) найдите заряд большого шара после соединения.'
        num: { value: 6e-9, unit: 'Кл', check: '0.03*8e-9/(0.01+0.03)' }
        hint: Или вычтите заряд маленького шара из полного заряда.
        explain: "$q_2' = 3\\cdot\\frac84 = 6$ нКл; $2 + 6 = 8$ — заряд сохранился."
        f: [2]
        sol: {"given": ["R₁ = 1 см", "R₂ = 3 см", "q₁ + q₂ = 8 нКл"], "find": "q₂'", "formula": "q_2' = R_2\\frac{q_1 + q_2}{R_1 + R_2}", "calc": "q_2' = 3\\cdot\\frac{8}{4} = 6", "answer": "6 нКл"}
        src: c13
      - type: numeric
