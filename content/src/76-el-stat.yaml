        f: [1]
        sol: { given: ['q₁ = 2·10⁻⁹ Кл', 'q₂ = 8·10⁻⁹ Кл', 'r = 0,04 м'], find: 'F', formula: 'F = k\frac{|q_1||q_2|}{r^2}', calc: 'F = \frac{9\cdot10^9\cdot16\cdot10^{-18}}{1{,}6\cdot10^{-3}} = 9\cdot10^{-5}', answer: '9·10⁻⁵ Н' }
        src: c03
      - type: numeric
        cat: problem
        q: Расстояние между двумя зарядами увеличили в 3 раза. Во сколько раз уменьшилась сила их взаимодействия?
        num: { value: 9, unit: '', check: '3**2' }
        hint: Сила обратно пропорциональна квадрату расстояния.
        explain: '$F \sim \frac{1}{r^2}$: при $r \cdot 3$ сила уменьшается в $3^2 = 9$ раз.'
        f: [1]
