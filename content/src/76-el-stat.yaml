errata:
  - id: EL01
    page: c03
    severity: note
    original: '«\(\varepsilon = 8{,}85\cdot10^{-12}\) [ — ] — электрическая постоянная, диэлектрическая проницаемость»'
    issue: 'Смешаны две величины. Электрическая постоянная \(\varepsilon_0 = 8{,}85\cdot10^{-12}\) Ф/м входит в \(k = \frac{1}{4\pi\varepsilon_0}\). Диэлектрическая проницаемость среды ε — безразмерная, для вакуума и воздуха ε = 1 (так и записано в рамке ниже). На стр. c14 конспект пишет правильно: \(\varepsilon_0 = 8{,}85\cdot10^{-12}\) Ф/м и отдельно «ε — диэлектрическая проницаемость».'
    target: 'Расшифровка ε в законе Кулона'
    suggestion: '«\(\varepsilon_0 = 8{,}85\cdot10^{-12}\) Ф/м — электрическая постоянная; ε — диэлектрическая проницаемость среды».'
  - id: EL02
    page: c05
    severity: typo
    original: '\(\vec E = k\frac{|q|}{R^2}\) (в рамке)'
    issue: Стрелка вектора стоит над E, а справа записан модуль. Так же записаны формулы суперпозиции ниже.
    target: 'Напряжённость поля точечного заряда (в рамке)'
    suggestion: '\(E = k\frac{|q|}{R^2}\) — модуль напряжённости (направление: от «+», к «−»).'
  - id: EL03
    page: c07
    severity: note
    original: '\(E = \frac{\sigma}{2\varepsilon_0}\) (в рамке) — «для однородного поля», рядом рисунок двух пластин'
    issue: 'Формула — поле одной равномерно заряженной бесконечной плоскости (источник однородного поля со стр. c06). Между двумя разноимённо заряженными пластинами поля складываются, и напряжённость вдвое больше — так получено в самом конспекте на стр. c22: \(E_{внутр} = \frac{\sigma}{\varepsilon\varepsilon_0}\).'
    target: 'Формула \(E = \frac{\sigma}{2\varepsilon_0}\) рядом с рисунком двух пластин'
    suggestion: 'Подписать: «\(E = \frac{\sigma}{2\varepsilon_0}\) — поле одной бесконечной плоскости; между пластинами конденсатора \(E = \frac{\sigma}{\varepsilon_0}\)».'
  - id: EL04
    page: c08
    severity: error
    original: '\(C_n^2 = \frac{n(n+1)}{2}\) (в рамке)'
    issue: 'Число пар из n зарядов равно \(\frac{n(n-1)}{2}\). Для трёх зарядов на этой же странице в формуле энергии три слагаемых (3 пары), а по записи в рамке выходит 6.'
    target: 'Число пар зарядов (в рамке)'
    suggestion: '\(C_n^2 = \frac{n(n-1)}{2}\).'
  - id: EL14
    page: c09
    severity: note
    original: '«Объединение точек с одинаковым значением потенциала называется эквипотенциальной плоскостью… Эквипотенциальные плоскости точечного заряда имеют форму концентрических сфер»'
    issue: 'Плоскость не может иметь форму сферы. Обычно говорят «эквипотенциальная поверхность»; плоскостями эти поверхности бывают только у однородного поля.'
    target: 'Термин «эквипотенциальная плоскость»'
    suggestion: '«…называется эквипотенциальной поверхностью. У точечного заряда это концентрические сферы, у однородного поля — параллельные плоскости».'

topics:
  - id: es-charge
    title: Электрический заряд. Закон сохранения заряда
    pages: [c01, c02]
    theory:
      - kind: list
        title: Курс электромагнетизма
        body: |
          Курс электромагнетизма делится на пять разделов:
          - I. Электростатика;
          - II. Электродинамика;
          - III. Электрический ток в различных средах;
          - IV. Магнетизм;
          - V. Переменный электрический ток.
        src: c01
      - kind: definition
        title: Электрический заряд
        body: 'Заряд обозначают $q$ или $Q$, единица — кулон [Кл]. $q > 0$ — положительный заряд («+»), $q < 0$ — отрицательный («−»), $q = 0$ — тело электронейтрально.'
        src: c01
      - kind: text
        title: Протон и электрон
        body: 'В атоме в ядре находятся протоны, вокруг ядра по орбитам движутся электроны. Протон: $m_p = 1{,}67\cdot10^{-27}$ кг, $q_p = e = 1{,}6\cdot10^{-19}$ Кл. Электрон: $m_e = 9{,}1\cdot10^{-31}$ кг, $q_e = -e = -1{,}6\cdot10^{-19}$ Кл. $m_p = 1836\,m_e$. $e$ — элементарный заряд, самый маленький заряд.'
        src: c01
        fig: charge-atom
      - kind: rule
        title: Откуда у тела заряд
        body: 'Атом кислорода: 8 протонов и 8 электронов — $q = 0$; 8p и 5e⁻ — $q = +3e$; 8p и 10e⁻ — $q = -2e$. Случаев, где изменяется количество протонов, не бывает, так как они находятся в ядре. «Плюс» — значит недостаток электронов, «минус» — избыток электронов: $|q| = Ne$, где при $q > 0$ N — количество недостающих электронов, при $q < 0$ — количество лишних.'
        src: c02
      - kind: law
        title: Закон сохранения заряда
        body: 'В закрытой системе сумма зарядов всех тел, то есть полный заряд системы, не меняется: $q = q_1 + q_2 + \dots + q_N = \text{const}$. Пример конспекта: шарики +7 и +9 после соприкосновения — по +8 (вместе +16); шарики +12, 0 и −3 — по +3 (вместе +9).'
        src: c02
        fig: charge-contact
    formulas:
      - title: Заряд протона и электрона
        tex: 'q_p = e = 1{,}6\cdot10^{-19}\ \text{Кл},\qquad q_e = -e = -1{,}6\cdot10^{-19}\ \text{Кл}'
        sym: [e_el]
        src: c01
      - title: Массы протона и электрона
        tex: 'm_p = 1{,}67\cdot10^{-27}\ \text{кг},\qquad m_e = 9{,}1\cdot10^{-31}\ \text{кг},\qquad m_p = 1836\,m_e'
        sym: [m_p, m_el]
        src: c01
      - title: Заряд тела через число электронов
        tex: '|q| = Ne'
        sym: [q_el, N_el, e_el]
        boxed: true
        src: c02
      - title: Закон сохранения заряда
        tex: 'q = q_1 + q_2 + \dots + q_N = \text{const}'
        sym: [q_el, q1n]
        src: c02
    examples:
      - title: Заряд атома кислорода
        steps: ['8 протонов, 8 электронов → $q = 0$', '8 протонов, 5 электронов → $q = +3e$ (не хватает трёх электронов)', '8 протонов, 10 электронов → $q = -2e$ (два лишних электрона)']
        src: c02
      - title: Одинаковые шарики после соприкосновения
        steps: ['+7 и +9: вместе +16 → по +8', '+12, 0 и −3: вместе +9 → по +3']
        src: c02
    questions:
      - type: single
        cat: theory
        q: Какой заряд в конспекте назван элементарным?
        opts: ['Заряд $e = 1{,}6\cdot10^{-19}$ Кл — самый маленький заряд', 'Заряд в 1 Кл', 'Заряд ядра атома', 'Заряд тела массой 1 кг']
        ans: a
        hint: Последняя строка стр. c01.
        explain: '$e$ — элементарный заряд, самый маленький заряд; заряд протона $+e$, электрона $-e$.'
        f: [1]
        src: c01
      - type: single
        cat: theory
        q: Тело заряжено положительно. Что это значит по конспекту?
        opts: ['У тела недостаток электронов', 'У тела избыток электронов', 'У тела лишние протоны', 'Тело электронейтрально']
        ans: a
        hint: '«Плюс заряд значит…»'
        explain: '«Плюс» — недостаток электронов, «минус» — избыток электронов.'
        src: c02
      - type: single
        cat: theory
        q: Почему при электризации не меняется число протонов?
        opts: ['Протоны находятся в ядре', 'Протоны не имеют заряда', 'Протоны легче электронов', 'Протоны всегда парные']
        ans: a
        hint: 'Вспомните рисунок атома на стр. c01.'
        explain: Случаев, где изменяется количество протонов, не бывает, так как они находятся в ядре.
        src: c02
      - type: numeric
        cat: problem
        q: 'Заряд тела $+3{,}2\cdot10^{-18}$ Кл. Сколько электронов ему не хватает?'
        num: { value: 20, unit: '', check: '3.2e-18/1.6e-19' }
        hint: '$|q| = Ne$, отсюда $N = \frac{|q|}{e}$.'
        explain: '$N = \frac{3{,}2\cdot10^{-18}}{1{,}6\cdot10^{-19}} = 20$.'
        f: [3]
        sol: { given: ['q = 3,2·10⁻¹⁸ Кл', 'e = 1,6·10⁻¹⁹ Кл'], find: 'N', formula: 'N = \frac{|q|}{e}', calc: 'N = \frac{3{,}2\cdot10^{-18}}{1{,}6\cdot10^{-19}} = 20', answer: '20' }
        src: c02
      - type: numeric
        cat: problem
        q: 'Тело получило $5\cdot10^{10}$ лишних электронов. Найдите модуль его заряда.'
        num: { value: 8e-9, unit: 'Кл', check: '5e10*1.6e-19' }
        hint: '$|q| = Ne$.'
        explain: '$|q| = 5\cdot10^{10}\cdot1{,}6\cdot10^{-19} = 8\cdot10^{-9}$ Кл (заряд отрицательный).'
        f: [3]
        sol: { given: ['N = 5·10¹⁰', 'e = 1,6·10⁻¹⁹ Кл'], find: '|q|', formula: '|q| = Ne', calc: '|q| = 5\cdot10^{10}\cdot1{,}6\cdot10^{-19} = 8\cdot10^{-9}', answer: '8·10⁻⁹ Кл' }
        src: c02
      - type: numeric
        cat: problem
        q: 'Ион кислорода: 8 протонов и 10 электронов. Найдите его заряд в единицах $e$ (со знаком).'
        num: { value: -2, unit: 'e', check: '8-10' }
        hint: Каждый протон даёт $+e$, каждый электрон $-e$.
        explain: '$q = (8 - 10)e = -2e$ — как в примере на стр. c02.'
        sol: {"given": ["8 протонов", "10 электронов"], "find": "q", "formula": "q = (N_p - N_e)e", "calc": "q = (8 - 10)e = -2e", "answer": "−2e"}
        src: c02
      - type: numeric
        cat: problem
        q: 'Одинаковые шарики с зарядами +7 и +9 (условных единиц) соприкоснулись и разошлись. Какой заряд стал у каждого?'
        num: { value: 8, unit: '', check: '(7+9)/2' }
        hint: Полный заряд сохраняется и делится между одинаковыми шариками поровну.
        explain: '$+7 + 9 = +16$, после соприкосновения по $+8$ — пример стр. c02.'
        f: [4]
        sol: {"given": ["q₁ = +7", "q₂ = +9", "шарики одинаковые"], "find": "q'", "formula": "q' = \\frac{q_1 + q_2}{2}", "calc": "q' = \\frac{16}{2} = 8", "answer": "+8"}
        src: c02
      - type: numeric
        cat: problem
        q: 'Три одинаковых шарика с зарядами +12, 0 и −3 (условных единиц) одновременно соприкоснулись. Какой заряд стал у каждого?'
        num: { value: 3, unit: '', check: '(12+0-3)/3' }
        hint: Сначала найдите полный заряд системы.
        explain: '$12 + 0 - 3 = 9$, на троих — по $+3$.'
        f: [4]
        sol: {"given": ["q₁ = +12", "q₂ = 0", "q₃ = −3"], "find": "q'", "formula": "q' = \\frac{q_1 + q_2 + q_3}{3}", "calc": "q' = \\frac{9}{3} = 3", "answer": "+3"}
        src: c02
      - type: numeric
        cat: problem
        q: 'По данным конспекта ($m_p = 1{,}67\cdot10^{-27}$ кг, $m_e = 9{,}1\cdot10^{-31}$ кг) найдите, во сколько раз протон тяжелее электрона.'
        num: { value: 1836, unit: '', check: '1.67e-27/9.1e-31' }
        hint: Разделите массу протона на массу электрона.
        explain: '$\frac{1{,}67\cdot10^{-27}}{9{,}1\cdot10^{-31}} \approx 1835$ — в конспекте $m_p = 1836\,m_e$.'
        f: [2]
        sol: {"given": ["m_p = 1,67·10⁻²⁷ кг", "m_e = 9,1·10⁻³¹ кг"], "find": "m_p / m_e", "formula": "\\frac{m_p}{m_e}", "calc": "\\frac{1{,}67\\cdot10^{-27}}{9{,}1\\cdot10^{-31}} \\approx 1835", "answer": "≈ 1836"}
        src: c01
      - type: matching
        cat: theory
        q: Сопоставьте знак заряда и название.
        pairs:
          - ['$q > 0$', 'Положительный заряд']
          - ['$q < 0$', 'Отрицательный заряд']
          - ['$q = 0$', 'Электронейтральное тело']
        hint: Три строки на стр. c01.
        explain: 'Обозначения стр. c01: «+» — положительный, «−» — отрицательный, 0 — электронейтральный.'
        src: c01
      - type: text
        cat: theory
        q: Сформулируйте закон сохранения заряда.
        ref: В закрытой системе сумма зарядов всех тел, то есть полный заряд системы, не меняется.
        criteria: ['Сказано про закрытую (замкнутую) систему', 'Сказано, что сумма зарядов (полный заряд) не меняется']
        hint: '$q_1 + q_2 + \dots + q_N = \text{const}$.'
        explain: Формулировка со стр. c02.
        src: c02
      - type: sequence
        cat: theory
        q: Расположите разделы курса электромагнетизма в порядке конспекта.
        seq: ['Электростатика', 'Электродинамика', 'Электрический ток в различных средах', 'Магнетизм', 'Переменный электрический ток']
        hint: План курса — в начале стр. c01.
        explain: Курс делится на пять разделов в этом порядке.
        src: c01

# ───────────────────────────────────────────────────────────────
  - id: es-coulomb
    title: Закон Кулона
    pages: [c03, c04]
    theory:
      - kind: law
        title: Закон Кулона
        body: 'Два неподвижных точечных электрических заряда в вакууме взаимодействуют с силой, прямо пропорциональной модулям этих зарядов и обратно пропорциональной квадрату расстояния между ними: $F = k\frac{|q_1|\cdot|q_2|}{\varepsilon r^2}$.'
        src: c03
        fig: coulomb
      - kind: text
        title: Постоянные в законе Кулона
        body: '$k = 9\cdot10^9\ \frac{Н\cdot м^2}{Кл^2}$ — коэффициент пропорциональности, постоянная Кулона; $k = \frac{1}{4\pi\varepsilon_0}$. Электрическая постоянная — $8{,}85\cdot10^{-12}$ (в конспекте здесь смешана с диэлектрической проницаемостью, см. замечание EL01). Для воздуха и вакуума $\varepsilon = 1$.'
        src: c03
        errata: [EL01]
      - kind: rule
        title: Сила Кулона и сила тяготения
        body: 'Формулы похожи: $F = k\frac{q_1q_2}{r^2}$ и $F = G\frac{m_1m_2}{R^2}$. Главное отличие: гравитационная сила выражает силу притяжения двух тел, а сила Кулона — с какой силой два заряда притягиваются либо отталкиваются.'
        src: c03
      - kind: rule
        title: Притяжение и отталкивание
        body: 'Если силовые линии взаимодействующих зарядов разноимённые, заряды притягиваются; если одноимённые — отталкиваются.'
        src: [c03, c04]
    formulas:
      - title: Закон Кулона
        tex: 'F = k\frac{|q_1|\cdot|q_2|}{\varepsilon r^2}'
        sym: [F_coul, k_coul, q12, eps_d, r_q]
        boxed: true
        src: c03
      - title: Постоянная Кулона
        tex: 'k = 9\cdot10^9\ \frac{\text{Н}\cdot\text{м}^2}{\text{Кл}^2},\qquad k = \frac{1}{4\pi\varepsilon_0}'
        sym: [k_coul, eps0_el]
        boxed: true
        src: c03
        errata: [EL01]
      - title: Проницаемость вакуума и воздуха
        tex: '\varepsilon_{воздух,\ вакуум} = 1'
        sym: [eps_d]
        boxed: true
        src: c03
      - title: Сравнение с законом всемирного тяготения
        tex: 'F = k\frac{q_1q_2}{r^2},\qquad F = G\frac{m_1m_2}{R^2}'
        sym: [F_coul, k_coul, q12, r_q, G, m]
        src: c03
