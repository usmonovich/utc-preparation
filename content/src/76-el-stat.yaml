# ───────────────────────────────────────────────────────────────
  - id: es-field
    title: Электрическое поле. Напряжённость. Принцип суперпозиции
    pages: [c04, c05]
    theory:
      - kind: definition
        title: Электрическое поле и силовые линии
        body: 'Электрическое поле характеризуется силовыми линиями, которые возникают вокруг электрического заряда. Силовые линии электрического поля всегда перпендикулярны к поверхности заряда. Из положительного заряда силовые линии исходят, а в отрицательный заряд входят.'
        src: c04
        fig: field-radial
      - kind: text
        title: Причина притяжения и отталкивания зарядов
        body: 'У разноимённых зарядов линии идут от «+» к «−» — заряды притягиваются; у одноимённых линии расходятся — заряды отталкиваются. За счёт взаимодействия силовых линий происходит деформация этих линий, за счёт чего заряды либо притягиваются, либо отталкиваются.'
        src: c04
        fig: field-pair
      - kind: definition
        title: Напряжённость электрического поля
        body: 'Значение и направление электрического поля характеризуются напряжённостью $\vec E$ [В/м]. Для точечного заряда $E = k\frac{|q|}{R^2}$; у положительного заряда вектор $\vec E$ направлен от заряда, у отрицательного — к заряду.'
        src: c05
        errata: [EL02]
      - kind: rule
        title: Принцип суперпозиции
        body: 'Поля нескольких зарядов складываются как векторы: ↑↑ — $E_{рез} = E_1 + E_2$; ↑↓ — $E_{рез} = E_1 - E_2$; ⊥ — $E_{рез} = \sqrt{E_1^2 + E_2^2}$; под углом α — $E_{рез} = \sqrt{E_1^2 + E_2^2 + 2E_1E_2\cos\alpha}$.'
        src: c05
        fig: superposition
    formulas:
      - title: Напряжённость поля точечного заряда
        tex: '\vec E = k\frac{|q|}{R^2}'
        sym: [E_el, k_coul, q_el, r_q]
        boxed: true
        src: c05
        errata: [EL02]
      - title: Суперпозиция — поля направлены одинаково
        tex: 'E_{рез} = E_1 + E_2'
        sym: [E_rez_el, E12_el]
        src: c05
      - title: Суперпозиция — поля направлены противоположно
        tex: 'E_{рез} = E_1 - E_2'
        sym: [E_rez_el, E12_el]
        src: c05
      - title: Суперпозиция — поля перпендикулярны
        tex: 'E_{рез} = \sqrt{E_1^2 + E_2^2}'
        sym: [E_rez_el, E12_el]
        src: c05
      - title: Суперпозиция — общий случай
        tex: 'E_{рез} = \sqrt{E_1^2 + E_2^2 + 2E_1E_2\cos\alpha}'
        sym: [E_rez_el, E12_el, alpha_E]
        src: c05
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите напряжённость поля точечного заряда 4 нКл на расстоянии 0,2 м в вакууме.'
        num: { value: 900, unit: 'В/м', check: '9e9*4e-9/0.2**2' }
