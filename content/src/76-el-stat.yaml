  - id: es-potential
    title: Потенциал. Эквипотенциальные поверхности
    pages: [c08, c09, c10]
    theory:
      - kind: definition
        title: Потенциал
        body: 'Потенциал поля точечного заряда: $\varphi = k\frac{q}{R}$ [В]. Если $q > 0$, то $\varphi > 0$; если $q < 0$, то $\varphi < 0$. Потенциал поля нескольких зарядов равен сумме потенциалов: $\varphi_{об} = \varphi_1 + \varphi_2 + \dots + \varphi_n$.'
        src: [c08, c09]
      - kind: text
        title: Потенциал заряженной металлической сферы
        body: '1) Внутри и на поверхности ($r \le R$): $\varphi_{внутр} = \varphi_{повер} = \varphi_0 = k\frac qR = \frac{qR}{\varepsilon_0S} = \frac{\sigma R}{\varepsilon_0}$. 2) Снаружи ($r > R$): $\varphi_{внеш} = k\frac qr = k\frac{q}{R+l} = \varphi_0\frac{R}{R+l}$.'
        src: c09
      - kind: definition
        title: Эквипотенциальная поверхность
        body: 'Объединение точек с одинаковым значением потенциала в конспекте названо эквипотенциальной плоскостью (обычно — поверхностью, см. EL14). У точечного заряда эти поверхности имеют форму концентрических сфер: на одной сфере $\varphi_A = \varphi_B = \varphi_C$, на другой $\varphi_D = \varphi_E = \varphi_F$.'
        src: [c09, c10]
        errata: [EL14]
        fig: equipotential
      - kind: rule
        title: Потенциал вдоль силовой линии
        body: 'Потенциал в электрическом поле всегда уменьшается по направлению силовых линий. Пример конспекта: от +q — 500 В, 300 В, 100 В; к −q (по стрелке) — −100 В, −300 В, −500 В.'
        src: c10
      - kind: rule
        title: Эквипотенциали однородного поля
        body: Работа по перемещению электрического заряда по эквипотенциальной поверхности всегда равна нулю. Эквипотенциальные поверхности однородного поля всегда перпендикулярны к силовым линиям и параллельны друг другу.
        src: c10
    formulas:
      - title: Потенциал точечного заряда
        tex: '\varphi = k\frac{q}{R}'
        sym: [phi_el, k_coul, q_el, r_q]
        boxed: true
        src: c08
      - title: Потенциал поля нескольких зарядов
        tex: '\varphi_{об} = \varphi_1 + \varphi_2 + \varphi_3 + \dots + \varphi_n'
        sym: [phi_el, phi1n]
        boxed: true
        src: c09
      - title: Потенциал сферы внутри и на поверхности
        tex: '\varphi_0 = k\frac{q}{R} = \frac{qR}{4\pi\varepsilon_0R^2} = \frac{qR}{\varepsilon_0S} = \frac{\sigma R}{\varepsilon_0}'
        sym: [phi0_sph, k_coul, q_el, R_sph, eps0_el, S_sph, sigma_el]
        boxed: true
        cond: '\(r \le R\)'
        src: c09
      - title: Потенциал снаружи сферы
        tex: '\varphi_{внеш} = k\frac{q}{r} = k\frac{q}{R+l} = \varphi_0\frac{R}{R+l}'
        sym: [phi_el, k_coul, q_el, r_c, R_sph, l_surf, phi0_sph]
        boxed: true
        cond: '\(r > R\)'
        src: c09
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите потенциал поля заряда 5 нКл на расстоянии 0,3 м.'
        num: { value: 150, unit: 'В', check: '9e9*5e-9/0.3' }
        hint: '$\varphi = k\frac qR$.'
        explain: '$\varphi = \frac{9\cdot10^9\cdot5\cdot10^{-9}}{0{,}3} = 150$ В.'
        f: [1]
