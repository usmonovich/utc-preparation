        sol: { given: ['υ₁ = c', 'υ₂ = 0,5c'], find: 'υ_от', formula: '\upsilon_{от} = \frac{\upsilon_1 + \upsilon_2}{1 + \frac{\upsilon_1\upsilon_2}{c^2}}', calc: '\upsilon_{от} = \frac{1{,}5c}{1{,}5} = c', answer: 'c' }
