errata:
  - id: EM01
    page: e01
    severity: typo
    original: '«Основное поля магнитного поля от электрического — это то, что магнитное поле всегда замкнуто»'
    issue: Пропущено слово — по смыслу «основное отличие».
    target: 'Отличие магнитного поля от электрического'
    suggestion: '«Основное отличие магнитного поля от электрического — магнитное поле всегда замкнуто».'
  - id: EM02
    page: e03
    severity: typo
    original: '\(B = \mu\mu_0\vec H\) (в рамке)'
    issue: Стрелка вектора стоит только над H. Либо обе величины векторные, либо обе — модули.
    target: 'Связь B и H (в рамке)'
    suggestion: '\(\vec B = \mu\mu_0\vec H\) (или \(B = \mu\mu_0H\) для модулей).'
  - id: EM03
    page: e05
    severity: note
    original: '«При этом пятый, главный палец будет показывать направление силы Ампера»'
    issue: По смыслу правила левой руки это большой палец, отогнутый на 90°.
    target: 'Правило левой руки'
    suggestion: '«…отогнутый на 90° большой палец покажет направление силы Ампера».'

topics:
  - id: mag-basics
    title: Магнитное поле. Силовые линии
    pages: [e01, e02]
    theory:
      - kind: rule
        title: Источник магнитного поля
        body: Основным источником магнитного поля является движение заряженных частиц.
        src: e01
      - kind: text
        title: Какие поля «видит» наблюдатель
        body: 'Если наблюдатель движется вместе с зарядом, он обнаруживает гравитационное и электрическое поле заряда. Если наблюдатель стоит, а заряд движется, — ещё и магнитное поле, так как относительно него заряд двигается.'
        src: e01
      - kind: rule
        title: Силовые линии магнитного поля
        body: Как и электрическое поле, магнитное поле тоже характеризуется силовыми линиями. Основное отличие магнитного поля от электрического — магнитное поле всегда замкнуто. Одностороннего магнитного поля не существует. Отдельно магнитных частиц не существует.
        src: e01
        errata: [EM01]
      - kind: text
        title: Поле полосового магнита
        body: 'На рисунке конспекта у магнита полюса S и N; силовые линии замкнуты, снаружи магнита они идут от N к S. Земля тоже является магнитом.'
        src: e02
        fig: mag-bar
      - kind: definition
        title: Однородное магнитное поле
        body: Между полюсами подковообразного магнита силовые линии параллельны — такое поле называется однородным.
        src: e02
    questions:
      - type: single
        cat: theory
        q: Что, по конспекту, является основным источником магнитного поля?
        opts: ['Движение заряженных частиц', 'Неподвижные заряды', 'Масса тела', 'Тепловое движение молекул']
        ans: a
        hint: Первая фраза темы «Магнетизм».
        explain: Основным источником магнитного поля является движение заряженных частиц.
        src: e01
      - type: single
        cat: theory
        q: Наблюдатель движется вместе с зарядом. Какие поля заряда он обнаружит?
        opts: ['Гравитационное и электрическое', 'Только магнитное', 'Гравитационное, электрическое и магнитное', 'Никаких']
        ans: a
        hint: Относительно этого наблюдателя заряд покоится.
        explain: 'Магнитное поле появляется только тогда, когда заряд движется относительно наблюдателя.'
        src: e01
      - type: single
        cat: theory
        q: Наблюдатель стоит, а заряд проезжает мимо. Какие поля заряда он обнаружит?
        opts: ['Гравитационное, электрическое и магнитное', 'Только гравитационное и электрическое', 'Только магнитное', 'Только электрическое']
        ans: a
        hint: '«…магнитное — так как относительно него заряд двигается».'
        explain: 'Для неподвижного наблюдателя заряд движется, поэтому добавляется магнитное поле.'
        src: e01
      - type: single
        cat: theory
        q: В чём основное отличие магнитного поля от электрического по конспекту?
        opts: ['Магнитное поле всегда замкнуто', 'Магнитное поле не имеет силовых линий', 'Магнитное поле бывает только у Земли', 'Магнитное поле не действует на токи']
        ans: a
        hint: Силовые линии магнитного поля не имеют начала и конца.
        explain: Магнитное поле всегда замкнуто; одностороннего магнитного поля не существует (см. EM01).
        src: e01
        errata: [EM01]
      - type: single
        cat: theory
        q: Можно ли получить магнитное поле только с одним полюсом?
        opts: ['Нет: одностороннего магнитного поля не существует', 'Да, если разрезать магнит', 'Да, у Земли', 'Да, у ферромагнетиков']
        ans: a
        hint: '«Отдельно магнитных частиц не существует».'
        explain: Одностороннего магнитного поля не существует, отдельных магнитных частиц тоже.
        src: e01
      - type: single
        cat: theory
        q: Где на рисунках конспекта магнитное поле однородное?
        opts: ['Между полюсами подковообразного магнита', 'Вокруг проводника с током', 'Около одного полюса полосового магнита', 'Вокруг Земли']
        ans: a
        hint: Там силовые линии нарисованы параллельно.
        explain: Подпись к рисунку подковообразного магнита — «однородное магнитное поле».
        src: e02
      - type: single
        cat: theory
        q: Как направлены силовые линии снаружи полосового магнита на рисунке конспекта?
        opts: ['От N к S', 'От S к N', 'Перпендикулярно магниту', 'Направления нет']
        ans: a
        hint: Посмотрите на стрелки на линиях рисунка на стр. e02.
        explain: Снаружи магнита линии идут от северного полюса N к южному S и замыкаются внутри магнита.
        src: e02
      - type: text
        cat: theory
        q: Чем магнитное поле отличается от электрического? Что сказано об одностороннем поле?
        ref: Основное отличие магнитного поля от электрического — магнитное поле всегда замкнуто. Одностороннего магнитного поля не существует.
        criteria: ['Сказано, что магнитное поле (его линии) всегда замкнуто', 'Сказано, что одностороннего магнитного поля не существует']
        hint: Два коротких утверждения на стр. e01.
        explain: Запись со стр. e01 (см. замечание EM01 о пропущенном слове).
        src: e01

# ───────────────────────────────────────────────────────────────
  - id: mag-wire
    title: Поле проводника с током. Правило буравчика
    pages: [e02, e03]
    theory:
      - kind: rule
        title: Магнитное поле проводника с током
        body: Когда через проводник протекает электрический ток, то вокруг данного проводника возникает магнитное поле. Направление данного поля находим через правило буравчика.
        src: e02
      - kind: rule
        title: Правило буравчика
        body: Если наконечник буравчика совпадает с направлением тока в проводнике, то направление вращения совпадает с направлением магнитного поля.
        src: e02
        fig: mag-wire
      - kind: text
        title: Ток «от нас» и «к нам»
        body: '⊗ — ток идёт от нас (за плоскость рисунка): силовые линии направлены по часовой стрелке. ⊙ — ток идёт к нам: против часовой стрелки.'
        src: e03
    questions:
      - type: single
        cat: theory
        q: Ток в проводнике направлен от нас (⊗). Как направлены силовые линии магнитного поля?
        opts: ['По часовой стрелке', 'Против часовой стрелки', 'От проводника по радиусам', 'Вдоль проводника']
        ans: a
        hint: Буравчик вкручивают «от себя» — он вращается по часовой стрелке.
        explain: 'Рисунки на стр. e03: ⊗ — по часовой, ⊙ — против часовой стрелки.'
        src: e03
      - type: single
        cat: theory
        q: Ток в проводнике направлен к нам (⊙). Как направлены силовые линии?
        opts: ['Против часовой стрелки', 'По часовой стрелке', 'Вдоль тока', 'Поля нет']
        ans: a
        hint: Это противоположный случай к ⊗.
        explain: 'При токе к нам (⊙) линии идут против часовой стрелки.'
        src: e03
      - type: single
        cat: theory
        q: Каким правилом определяют направление магнитного поля проводника с током?
        opts: ['Правилом буравчика', 'Правилом левой руки', 'Правилом Ленца', 'Правилом правой руки для силы Лоренца']
        ans: a
        hint: Левая рука в конспекте — для силы Ампера.
        explain: Направление поля проводника с током находим через правило буравчика.
        src: e02
      - type: text
        cat: theory
        q: Сформулируйте правило буравчика.
        ref: Если наконечник буравчика совпадает с направлением тока в проводнике, то направление вращения совпадает с направлением магнитного поля.
        criteria: ['Наконечник (поступательное движение) буравчика — по направлению тока', 'Направление вращения — направление магнитного поля (силовых линий)']
        hint: В правиле два элемента — наконечник и вращение.
        explain: Правило со стр. e02.
        src: e02
      - type: single
        cat: theory
        q: Направление тока в проводнике сменили на противоположное. Что стало с магнитным полем?
        opts: ['Направление силовых линий сменилось на противоположное', 'Поле исчезло', 'Направление не изменилось', 'Линии стали прямыми']
        ans: a
        hint: Сравните рисунки ⊗ и ⊙.
        explain: По правилу буравчика при обратном токе вращение, а значит и поле, меняет направление.
        src: [e02, e03]
      - type: single
        cat: theory
        q: Ток в вертикальном проводе идёт вверх. Как направлены линии поля, если смотреть сверху?
        opts: ['Против часовой стрелки', 'По часовой стрелке', 'Вверх вдоль провода', 'Вниз вдоль провода']
        ans: a
        hint: Ток вверх — значит «к смотрящему сверху», как ⊙.
        explain: 'Смотрим сверху — ток идёт к нам (⊙), линии против часовой стрелки, как на рисунке на стр. e02.'
        src: [e02, e03]

# ───────────────────────────────────────────────────────────────
  - id: mag-HB
    title: Напряжённость и индукция магнитного поля
    pages: [e03]
    theory:
      - kind: text
        title: Две характеристики поля
        body: 'Направление и значение магнитного поля характеризуются напряжённостью магнитного поля $\vec H$ [А/м] и вектором магнитной индукции $\vec B$ [Тл] (тесла). Связь: $B = \mu\mu_0H$.'
        src: e03
        errata: [EM02]
      - kind: definition
        title: Проницаемость и магнитная постоянная
        body: 'μ — магнитная проницаемость среды; $\mu_0$ — магнитная постоянная, $\mu_0 = 4\pi\cdot10^{-7}$ Гн/м.'
        src: e03
      - kind: rule
        title: Направление векторов
        body: И вектор магнитной индукции, и напряжённость магнитного поля всегда направлены по касательной к силовым линиям магнитного поля.
        src: e03
    formulas:
      - title: Связь индукции и напряжённости
        tex: 'B = \mu\mu_0\vec H'
        sym: [B_mag, mu_m, mu0, H_mag]
        boxed: true
        src: e03
        errata: [EM02]
      - title: Магнитная постоянная
        tex: '\mu_0 = 4\pi\cdot10^{-7}\ \frac{\text{Гн}}{\text{м}}'
        sym: [mu0]
        boxed: true
        src: e03
    questions:
      - type: numeric
        cat: problem
        q: 'Напряжённость поля 1000 А/м, среда с μ = 1. Найдите индукцию ($\mu_0 = 4\pi\cdot10^{-7}$ Гн/м).'
        num: { value: 1.2566e-3, unit: 'Тл', check: '1*4*Math.PI*1e-7*1000' }
        hint: '$B = \mu\mu_0H$.'
        explain: '$B = 4\pi\cdot10^{-7}\cdot10^3 = 4\pi\cdot10^{-4} \approx 1{,}26\cdot10^{-3}$ Тл.'
        f: [1]
        sol: { given: ['H = 1000 А/м', 'μ = 1'], find: 'B', formula: 'B = \mu\mu_0H', calc: 'B = 4\pi\cdot10^{-7}\cdot10^3 \approx 1{,}26\cdot10^{-3}', answer: '≈ 1,26·10⁻³ Тл' }
        src: e03
      - type: numeric
        cat: problem
        q: 'Индукция 0,02 Тл в среде с μ = 100. Найдите напряжённость поля.'
        num: { value: 159.15, unit: 'А/м', check: '0.02/(100*4*Math.PI*1e-7)' }
        hint: '$H = \frac{B}{\mu\mu_0}$.'
        explain: '$H = \frac{0{,}02}{100\cdot4\pi\cdot10^{-7}} \approx 159$ А/м.'
        f: [1]
        sol: { given: ['B = 0,02 Тл', 'μ = 100'], find: 'H', formula: 'H = \frac{B}{\mu\mu_0}', calc: 'H = \frac{0{,}02}{4\pi\cdot10^{-5}} \approx 159', answer: '≈ 159 А/м' }
        src: e03
      - type: single
        cat: theory
        q: В каких единицах измеряется напряжённость магнитного поля?
        opts: ['А/м', 'Тл', 'Гн/м', 'Вб']
        ans: a
        hint: Единица записана в квадратных скобках рядом с H.
        explain: '$\vec H$ — [А/м], $\vec B$ — [Тл].'
        src: e03
      - type: single
        cat: theory
        q: В каких единицах измеряется магнитная индукция?
        opts: ['Тл (тесла)', 'А/м', 'Вб (вебер)', 'Гн (генри)']
        ans: a
        hint: Подписано под скобками — «Тесла».
        explain: Вектор магнитной индукции измеряется в теслах.
        src: e03
      - type: single
        cat: theory
        q: Как направлены векторы B и H относительно силовых линий?
        opts: ['По касательной к силовым линиям', 'Перпендикулярно силовым линиям', 'К центру линий', 'Направления не имеют']
        ans: a
        hint: Последнее предложение на стр. e03.
        explain: И вектор индукции, и напряжённость всегда направлены по касательной к силовым линиям.
        src: e03
      - type: matching
        cat: theory
        q: Сопоставьте обозначение и смысл.
        pairs:
          - ['$\vec H$', 'Напряжённость магнитного поля, А/м']
          - ['$\vec B$', 'Вектор магнитной индукции, Тл']
          - ['$\mu$', 'Магнитная проницаемость среды']
          - ['$\mu_0$', 'Магнитная постоянная, Гн/м']
        hint: Все четыре обозначения расшифрованы на стр. e03.
        explain: Обозначения со стр. e03.
        f: [1, 2]
        src: e03

# ───────────────────────────────────────────────────────────────
  - id: mag-superpos
    title: Принцип суперпозиции. Взаимодействие токов
    pages: [e04]
    theory:
      - kind: rule
        title: Принцип суперпозиции магнитных полей
        body: 'Если поля направлены одинаково (↑↑), их значения складываются; если противоположно (↑↓) — вычитаются; если перпендикулярно — $\sqrt{H_1^2 + H_2^2}$; в общем случае — $\sqrt{H_1^2 + H_2^2 + 2H_1H_2\cos\alpha}$. Для индукции B — так же.'
        src: e04
      - kind: text
        title: Поле двух токов в точке
        body: 'На рисунке токи $I_1$ (⊙) и $I_2$ (⊗); в точке между ними поля $\vec B_1$ и $\vec B_2$ складываются в $\vec B_{рез}$.'
        src: e04
      - kind: rule
        title: Взаимодействие параллельных токов
        body: 'Если токи в параллельных проводах направлены одинаково ($I_1 \uparrow\uparrow I_2$), провода притягиваются; если противоположно ($I_1 \uparrow\downarrow I_2$) — отталкиваются.'
        src: e04
        fig: mag-parallel
    formulas:
      - title: Поля направлены одинаково
        tex: 'H_{рез} = H_1 + H_2,\qquad B_{рез} = B_1 + B_2'
        sym: [HB_rez, H12, B12]
        src: e04
      - title: Поля направлены противоположно
