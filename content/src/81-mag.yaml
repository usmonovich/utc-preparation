        sol: { given: ['q = 10⁻³ Кл', 'm = 10⁻⁴ кг', 'B = 2 Тл'], find: 'ν', formula: '\nu = \frac{qB}{2\pi m}', calc: '\nu = \frac{20}{2\pi} \approx 3{,}18', answer: '≈ 3,18 Гц' }
