# ───────────────────────────────────────────────────────────────
  - id: mag-motion
    title: Движение заряженной частицы в магнитном поле
    pages: [e08]
    theory:
      - kind: rule
        title: ① Частица летит вдоль линий поля
        body: 'При $\alpha = 0°$ или $\alpha = 180°$: $F_л = 0$ — частица движется по прямой линии.'
        src: e08
      - kind: rule
        title: ② Частица летит перпендикулярно линиям
        body: 'При $\alpha = 90°$ — круговое движение. Сила Лоренца играет роль центробежной в формуле конспекта: $q\upsilon B = \frac{m\upsilon^2}{R}$, отсюда $R = \frac{m\upsilon}{qB}$. На рисунке поле ⊗, частица ⊖ движется вверх, сила $F_л$ направлена вправо — к центру окружности.'
        src: e08
        fig: lorentz-circle
      - kind: rule
        title: Период не зависит от скорости
        body: '$T = \frac{2\pi R}{\upsilon} = \frac{2\pi m}{qB}$ — в магнитном поле период не зависит от скорости. Частота $\nu = \frac{qB}{2\pi m}$, угловая скорость $\omega = \frac{qB}{m} = \frac{2\pi}{T}$.'
        src: e08
      - kind: text
        title: Радиус через энергию
        body: '$W_к = \frac{m\upsilon^2}{2}$ ⇒ $\upsilon = \sqrt{\frac{2W_к}{m}}$, поэтому $R = \frac{\sqrt{2W_km}}{qB}$. Если $W_к = Uq$, то $R = \frac1B\sqrt{\frac{2Um}{q}}$.'
        src: e08
      - kind: rule
        title: ③ Частица летит под углом — спираль
        body: 'При $0 < \alpha < 90°$ частица движется по спирали вдоль линий поля: $R = \frac{m\upsilon}{qB}\sin\alpha$, шаг спирали $d = 2\pi\frac{m\upsilon}{qB}\cos\alpha$.'
        src: e08
        fig: spiral
    formulas:
      - title: Сила Лоренца как центробежная
        tex: 'F_{л} = F_{цб}:\qquad q\upsilon B = \frac{m\upsilon^2}{R}'
        sym: [F_lor, F_cf, q_ch, v, B_mag, m, R_circ]
        src: e08
      - title: Радиус окружности
        tex: 'R = \frac{m\upsilon}{qB}'
        sym: [R_circ, m, v, q_ch, B_mag]
        boxed: true
        src: e08
      - title: Период через радиус
        tex: 'T = \frac{2\pi R}{\upsilon}'
        sym: [T_rev, R_circ, v]
        src: e08
      - title: Период обращения
        tex: 'T = \frac{2\pi m}{qB}'
        sym: [T_rev, m, q_ch, B_mag]
        boxed: true
        src: e08
      - title: Частота обращения
        tex: '\nu = \frac{qB}{2\pi m}'
        sym: [nu_rev, q_ch, B_mag, m]
        boxed: true
        src: e08
      - title: Угловая скорость
        tex: '\omega = \frac{qB}{m},\qquad \omega = \frac{2\pi}{T}'
        sym: [omega_rev, q_ch, B_mag, m, T_rev]
        boxed: true
        src: e08
      - title: Радиус через кинетическую энергию
        tex: 'R = \frac{\sqrt{2W_{к}m}}{qB}'
        sym: [R_circ, W_k, m, q_ch, B_mag]
        boxed: true
        src: e08
      - title: Радиус через напряжение
        tex: 'R = \frac{1}{B}\sqrt{\frac{2Um}{q}}'
        sym: [R_circ, B_mag, U_acc, m, q_ch]
        boxed: true
        src: e08
      - title: Радиус спирали
        tex: 'R = \frac{m\upsilon}{qB}\cdot\sin\alpha'
        sym: [R_circ, m, v, q_ch, B_mag, alpha_Bv]
        boxed: true
        src: e08
      - title: Шаг спирали
        tex: 'd = 2\pi\frac{m\upsilon}{qB}\cdot\cos\alpha'
        sym: [d_step, m, v, q_ch, B_mag, alpha_Bv]
        boxed: true
        src: e08
    questions:
      - type: numeric
        cat: problem
        q: 'Частица массой $1{,}6\cdot10^{-27}$ кг с зарядом $1{,}6\cdot10^{-19}$ Кл влетает со скоростью $10^6$ м/с перпендикулярно полю 0,1 Тл. Найдите радиус окружности.'
        num: { value: 0.1, unit: 'м', check: '1.6e-27*1e6/(1.6e-19*0.1)' }
