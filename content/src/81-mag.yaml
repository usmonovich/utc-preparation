  - id: mag-ampere
    title: Сила Ампера. Правило левой руки
    pages: [e05, e06]
    theory:
      - kind: definition
        title: Сила Ампера
        body: Сила, которая действует на проводник с током со стороны магнитного поля, называется силой Ампера.
        src: e05
      - kind: rule
        title: Правило левой руки
        body: Открытую левую руку помещаем так, чтобы силовые линии перпендикулярно входили в ладонь, а четыре пальца показывали направление тока в проводнике. Тогда большой палец покажет направление силы Ампера.
        src: e05
        errata: [EM03]
      - kind: text
        title: Значение силы Ампера
        body: '$F_A = BIl\sin\alpha$, где $\alpha$ — угол между $\vec B$ и током $I$. На рисунке конспекта проводник с током между полюсами S и N: поле направлено к S, ток — к нам (⊙), сила Ампера — вниз.'
        src: [e05, e06]
        fig: ampere
      - kind: rule
        title: Ток вдоль линий поля
        body: 'Если ток идёт вдоль силовых линий, $\alpha = 0°$ и $F_A = 0$.'
        src: e06
    formulas:
      - title: Сила Ампера
        tex: 'F_A = B\cdot I\cdot l\sin\alpha'
        sym: [F_amp, B_mag, I_cur, l_wire, alpha_BI]
        boxed: true
        src: e05
