        f: [1]
        sol: { given: ['B = 0,5 Тл', 'I = 4 А', 'l = 0,2 м', 'α = 90°'], find: 'F_A', formula: 'F_A = BIl\sin\alpha', calc: 'F_A = 0{,}5\cdot4\cdot0{,}2 = 0{,}4', answer: '0,4 Н' }
