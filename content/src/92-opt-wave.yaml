topics:
  - id: wave-nature
    title: Корпускулярные и волновые свойства света
    pages: [o03, o04, o07]
    theory:
      - kind: text
        title: Природа света
        body: 'Свет — это частица, которая распространяется волновым образом, и за счёт этого у света наблюдаются классические свойства волны.'
        src: o03
        errata: [O04]
      - kind: list
        title: Свойства частицы света
        body: 'По конспекту «классические свойства частицы света» наблюдаются в эффектах: распространение света по прямой; возникновение геометрической тени; закон отражения света; закон преломления света; фотоэффект.'
        src: o03
        errata: [O04]
      - kind: list
        title: Волновые свойства света
        body: 'Волновые свойства частицы света характеризуются эффектами: интерференция; дифракция; дисперсия; поляризация.'
        src: [o03, o04]
      - kind: note
        title: Дифракция
        body: Тема «Дифракция» (18.03.25) в этой тетради только озаглавлена — запись пустая. Сама тема записана на отдельных листах (стр. d01–d02) — см. тему «Дифракция света. Дифракционная решётка».
        src: o07
        errata: [O09]
    questions:
      - type: multiple
        cat: theory
        q: Какие эффекты, по конспекту, показывают волновые свойства света? Выберите все.
        opts: ['Интерференция', 'Дифракция', 'Дисперсия', 'Поляризация', 'Фотоэффект', 'Возникновение тени']
        ans: [a, b, c, d]
        hint: В списке волновых свойств четыре пункта.
        explain: 'Волновые свойства: интерференция, дифракция, дисперсия, поляризация. Фотоэффект и тень — в списке свойств частицы.'
        src: [o03, o04]
      - type: multiple
        cat: theory
        q: Какие эффекты в конспекте отнесены к свойствам частицы света? Выберите все.
        opts: ['Распространение света по прямой', 'Возникновение геометрической тени', 'Закон отражения', 'Закон преломления', 'Фотоэффект', 'Интерференция', 'Дисперсия']
        ans: [a, b, c, d, e]
        hint: В этом списке пять пунктов, последний — фотоэффект.
        explain: 'Прямолинейное распространение, тень, отражение, преломление и фотоэффект. Интерференция и дисперсия — волновые свойства.'
        src: o03
      - type: single
        cat: theory
        q: Как в конспекте описана природа света?
        opts: ['Частица, которая распространяется волновым образом', 'Только волна', 'Только поток частиц', 'Колебание молекул воздуха']
        ans: a
        hint: Первая фраза темы «Волновая оптика».
        explain: 'Свет — это частица, которая распространяется волновым образом.'
        src: o03
      - type: single
        cat: theory
        q: К какой группе эффектов в конспекте отнесён фотоэффект?
        opts: ['К свойствам частицы света', 'К волновым свойствам', 'К геометрической оптике', 'Ни к какой']
        ans: a
        hint: Он стоит последним в первом списке.
        explain: Фотоэффект — в списке «классических свойств частицы света» (см. замечание O04).
        src: o03

# ───────────────────────────────────────────────────────────────
  - id: wave-interference
    title: Интерференция
    pages: [o04, o05]
    theory:
      - kind: definition
        title: Когерентные волны
        body: Интерференция наблюдается для когерентных волн. Когерентные волны — это волны с одинаковой частотой и разностью фаз, не меняющейся в процессе распространения.
        src: o04
      - kind: definition
        title: Интерференция
        fig: interference
        body: Интерференция — это взаимное увеличение или уменьшение двух когерентных волн при их встрече в некоторой точке пространства.
        src: o04
      - kind: text
        title: Разность фаз
        body: 'Волны от источников $A_1$ и $A_2$ проходят до точки встречи волновые пути $x_1$ и $x_2$. Разность фаз $\Delta\varphi = \frac{2\pi}{\lambda}\Delta x$, где $\Delta x = x_1 - x_2$ — разность волновых путей, $\lambda$ — длина волны.'
        src: o04
      - kind: text
        title: Результирующая интенсивность
        body: 'Интенсивность пропорциональна квадрату амплитуды: $I \sim A^2$. Результирующая интенсивность $I_{рез} = I_1 + I_2 + 2\sqrt{I_1I_2}\cos\Delta\varphi$.'
        src: o04
        errata: [O05]
      - kind: rule
        title: Интерференционный максимум
        body: 'Максимум наблюдается при $\Delta\varphi = 2\pi k$, $k \in \mathbb Z$, то есть при $\Delta x = k\lambda$: разность волновых путей кратна целому числу длин волн, или чётному числу половин длины волны. В максимуме $A_{рез} = A_1 + A_2$, $I_{рез} = (\sqrt{I_1} + \sqrt{I_2})^2$; при $A_1 = A_2 = A$: $A_{рез} = 2A$, $I_{рез} = 4I$.'
        src: [o04, o05]
        errata: [O06]
      - kind: note
        title: Интерференционный минимум
        body: 'В конспекте заголовок «Интерференционный минимум» есть, но запись не заполнена — условия минимума нет.'
        src: o05
        errata: [O07]
      - kind: rule
        title: Отражение волны
        body: Когда волна упруго отражается от некоторой плоскости, её фаза меняется на π.
        src: o05
      - kind: rule
        title: Интерференционный минимум (дополнено)
        body: 'Минимум наблюдается, когда разность хода равна нечётному числу половин длины волны: $\Delta x = (2k + 1)\frac{\lambda}{2}$, $k \in \mathbb Z$ (то же самое: $\Delta x = k\lambda + \frac\lambda2$), то есть когда $\Delta\varphi = (2k + 1)\pi$. Волны приходят в противофазе и ослабляют друг друга: $A_{рез} = |A_1 - A_2|$; при равных амплитудах наблюдается тёмная полоса.'
        src: o05
        errata: [O07]
        web:
          - { title: 'Открытая физика: Интерференция световых волн', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph7/theory.html' }
    formulas:
      - title: Разность фаз
        tex: '\Delta\varphi = \frac{2\pi}{\lambda}\Delta x'
        sym: [dphi, lambda_w, dx_path]
        boxed: true
        src: o04
      - title: Разность волновых путей
        tex: '\Delta x = x_1 - x_2'
        sym: [dx_path, x12]
        src: o04
      - title: Интенсивность и амплитуда
        tex: 'I \sim A^2'
        sym: [I_int, A_amp]
        src: o04
      - title: Результирующая амплитуда (как в конспекте)
        tex: 'A_{рез} = A_1^2 + A_2^2 + 2A_1A_2\cos\Delta\varphi'
        sym: [A_rez, A12, dphi]
        boxed: true
        src: o04
        errata: [O05]
      - title: Результирующая интенсивность
        tex: 'I_{рез} = I_1 + I_2 + 2\sqrt{I_1I_2}\cos\Delta\varphi'
        sym: [I_rez, I12, dphi]
        boxed: true
        src: o04
      - title: Условие максимума через фазу
        tex: '\Delta\varphi = 2\pi k,\quad k \in \mathbb{Z}'
        sym: [dphi, k_int]
        src: o04
      - title: Условие максимума через пути
        tex: '\Delta x = k\lambda'
        sym: [dx_path, k_int, lambda_w]
        boxed: true
        src: o04
      - title: Амплитуда в максимуме
        tex: 'A_{рез} = A_1 + A_2'
        sym: [A_rez, A12]
        src: o05
      - title: Интенсивность в максимуме
        tex: 'I_{рез} = \left(\sqrt{I_1} + \sqrt{I_2}\right)^2'
        sym: [I_rez, I12]
        src: o05
      - id: wave-interference-fmin
        title: Условие минимума через пути
        tex: '\Delta x = (2k + 1)\frac{\lambda}{2}'
        sym: [dx_path, k_int, lambda_w]
        src: o05
        web:
          - { title: 'Открытая физика: Интерференция световых волн', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph7/theory.html' }
      - id: wave-interference-fminphi
        title: Условие минимума через фазу
        tex: '\Delta\varphi = (2k + 1)\pi'
        sym: [dphi, k_int]
        src: o05
        web:
          - { title: 'Открытая физика: Интерференция световых волн', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph7/theory.html' }
    questions:
      - type: single
        cat: theory
        q: Какие волны называются когерентными?
        opts: ['Волны с одинаковой частотой и разностью фаз, не меняющейся в процессе распространения', 'Любые две волны одинаковой амплитуды', 'Волны с разными частотами', 'Волны, идущие в противоположные стороны']
        ans: a
        hint: Два признака — частота и разность фаз.
        explain: 'Когерентные волны — волны с одинаковой частотой и разностью фаз, не меняющейся в процессе распространения.'
        src: o04
      - type: text
        cat: theory
        q: Что такое интерференция?
        ref: Интерференция — это взаимное увеличение или уменьшение двух когерентных волн при их встрече в некоторой точке пространства.
        criteria: ['Сказано о взаимном увеличении или уменьшении', 'Упомянуты когерентные волны', 'Упомянута встреча в точке пространства']
        hint: Интерференция наблюдается только для когерентных волн.
        explain: Определение со стр. o04.
        src: o04
      - type: numeric
        cat: problem
        q: 'Разность волновых путей 1200 нм, длина волны 600 нм. Найдите разность фаз в радианах (ответ — числом).'
        num: { value: 12.57, unit: 'рад', check: '2*Math.PI/600*1200' }
        hint: '$\Delta\varphi = \frac{2\pi}{\lambda}\Delta x$.'
