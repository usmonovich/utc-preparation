        tex: 'd = \frac{l_0}{N},\qquad l_0 = 1\ \text{мм}'
        sym: [d_grat, l_grat, N_lines]
        src: d01
      - id: wave-diffraction-f5
        title: Синус угла через расстояния на экране
        tex: '\sin\varphi = \frac{x}{\sqrt{L^2 + x^2}}'
        sym: [phi_grat, x_scr, L_scr]
        src: d02
      - id: wave-diffraction-f6
        title: Условие максимума через расстояния на экране
        tex: 'd\cdot\frac{x}{\sqrt{L^2 + x^2}} = k\lambda'
        sym: [d_grat, x_scr, L_scr, k_grat, lambda_w]
        src: d02
      - id: wave-diffraction-f7
        title: Ограничение на номер максимума
        tex: '\frac{k\lambda}{d} = \sin\varphi \le 1'
        sym: [k_grat, lambda_w, d_grat, phi_grat]
        src: d02
      - id: wave-diffraction-f3
        title: Наибольший номер максимума
        tex: 'K = \left[\frac{d}{\lambda}\right]'
        sym: [K_maxn, d_grat, lambda_w]
        src: d02
        errata: [DF03]
      - id: wave-diffraction-f8
        title: Общее число максимумов
        tex: 'N = 2\left[\frac{d}{\lambda}\right] + 1'
