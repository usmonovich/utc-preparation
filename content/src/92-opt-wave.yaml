        sol: { given: ['N = 400 на 1 мм', 'λ = 0,45 мкм'], find: 'K', formula: 'd = \frac{l_0}{N},\ \ K = \left[\frac{d}{\lambda}\right]', calc: 'd = 2{,}5\ \text{мкм};\quad \frac{2{,}5}{0{,}45} \approx 5{,}6\ \Rightarrow\ K = 5', answer: '5' }
        src: [d01, d02]
      - id: wave-diffraction-q14
        type: matching
        cat: formula
        q: Сопоставьте обозначение на рисунке решётки и его смысл.
        pairs:
          - ['$L$', 'расстояние между решёткой и экраном']
          - ['$x$', 'расстояние между 0-max и k-max']
          - ['$\varphi$', 'угол между k-max и 0-max']
          - ['$d$', 'период решётки']
        hint: Рисунок на стр. дф2.
        explain: 'L — до экрана, x — на экране от центрального максимума до k-го, φ — угол между ними, d — период.'
        src: d02
      - id: wave-diffraction-q5
        type: single
        cat: theory
        q: Какие лучи белого света решётка отклоняет сильнее всего?
        opts: ['Красные', 'Фиолетовые', 'Зелёные', 'Все одинаково']
        ans: a
        hint: '$\sin\varphi = \frac{k\lambda}{d}$ — чем больше λ, тем больше угол.'
        explain: У красного света наибольшая длина волны, поэтому он отклоняется сильнее; фиолетовый — ближе к центру.
        f: [wave-diffraction-f1]
        src: d02
        web:
          - { title: 'Открытая физика: Спектральные приборы. Дифракционная решётка', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph10/theory.html' }
      - id: wave-diffraction-q6
        type: single
        cat: theory
        q: Какого цвета центральный максимум (k = 0) при освещении решётки белым светом?
        opts: ['Белого', 'Красного', 'Фиолетового', 'Он тёмный']
        ans: a
        hint: При k = 0 угол одинаков (ноль) для всех длин волн.
        explain: При k = 0 все длины волн идут без отклонения и складываются в белый свет; спектры — в остальных порядках.
        src: d02
        web:
          - { title: 'Открытая физика: Спектральные приборы. Дифракционная решётка', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph10/theory.html' }

  - id: wave-dispersion
    title: Дисперсия
    pages: [o08, o09]
    theory:
      - kind: definition
        title: Монохроматический свет
        body: Монохроматический свет — это набор лучей с одинаковым значением частоты.
        src: o08
      - kind: definition
        title: Полихроматический свет
        body: Полихроматический свет — это набор лучей с разными значениями частоты.
        src: o08
      - kind: text
        title: Источники света
        body: В природе в основном источники света распространяют полихроматический свет. Лазер является источником монохроматического света. Естественный белый свет Солнца тоже является полихроматическим. Его можно разложить на отдельные лучи, то есть цвета, с помощью эффекта дисперсии.
        src: o08
      - kind: list
        title: Как получить дисперсию
        fig: prism
        body: 'Дисперсию можно получить с помощью дифракционной решётки, треугольной призмы и водяной капли. Цвет зависит от частоты.'
        src: o08
      - kind: definition
        title: Дисперсия
        body: 'Дисперсия — это зависимость показателя преломления среды от частоты падающего света: $n = n(\nu)$. На графиках конспекта с ростом частоты $n$ растёт, а с ростом длины волны — убывает.'
        src: o09
      - kind: text
        title: Отклонение луча призмой
        body: 'Треугольная призма с углом $\theta$ при вершине отклоняет луч на угол $\delta = \theta(n - 1)$.'
        src: o09
        errata: [O10]
    formulas:
      - title: Дисперсия
        tex: 'n = n(\nu)'
        sym: [n_ref, nu_osc]
        src: o09
      - title: Угол отклонения призмой
        tex: '\delta = \theta(n - 1)'
        sym: [delta_pr, theta_pr, n_ref]
        boxed: true
        src: o09
        errata: [O10]
    questions:
      - type: single
        cat: theory
        q: Что такое дисперсия?
        opts: ['Зависимость показателя преломления среды от частоты падающего света', 'Отражение света от зеркала', 'Сложение двух когерентных волн', 'Вылет электронов под действием света']
        ans: a
        hint: 'В конспекте записано $n = n(\nu)$.'
        explain: Дисперсия — это зависимость показателя преломления среды от частоты падающего света.
        f: [1]
        src: o09
      - type: single
        cat: theory
        q: Какой источник, по конспекту, даёт монохроматический свет?
        opts: ['Лазер', 'Солнце', 'Лампа накаливания', 'Костёр']
        ans: a
        hint: Белый свет Солнца — полихроматический.
        explain: Лазер является источником монохроматического света.
        src: o08
      - type: multiple
        cat: theory
        q: С помощью чего можно получить дисперсию? Выберите все.
        opts: ['Дифракционной решётки', 'Треугольной призмы', 'Водяной капли', 'Плоского зеркала', 'Непрозрачного экрана']
        ans: [a, b, c]
        hint: В конспекте перечислены три способа.
        explain: Дисперсию можно получить с помощью дифракционной решётки, треугольной призмы и водяной капли.
        src: o08
      - type: matching
        cat: theory
        q: Сопоставьте понятие и определение.
        pairs:
          - ['Монохроматический свет', 'Набор лучей с одинаковым значением частоты']
          - ['Полихроматический свет', 'Набор лучей с разными значениями частоты']
          - ['Дисперсия', 'Зависимость показателя преломления от частоты света']
        hint: «Моно» — один, «поли» — много.
        explain: Определения со стр. o08–o09.
        src: [o08, o09]
      - type: single
        cat: theory
        q: Как, по графику в конспекте, меняется показатель преломления с ростом длины волны?
        opts: ['Убывает', 'Растёт', 'Не меняется', 'Сначала растёт, потом убывает']
        ans: a
        hint: С ростом частоты n растёт, а частота и длина волны связаны обратно.
        explain: 'На втором графике $n(\lambda)$ кривая идёт вниз.'
        src: o09
      - type: numeric
        cat: problem
        q: 'Тонкая призма с углом при вершине 6° сделана из стекла с $n = 1{,}5$. На какой угол она отклоняет луч (в градусах)?'
        num: { value: 3, unit: '°', check: '6*(1.5-1)' }
        hint: '$\delta = \theta(n - 1)$.'
        explain: '$\delta = 6°\cdot0{,}5 = 3°$.'
        f: [2]
        sol: { given: ['θ = 6°', 'n = 1,5'], find: 'δ', formula: '\delta = \theta(n - 1)', calc: '\delta = 6°\cdot(1{,}5 - 1) = 3°', answer: '3°' }
        src: o09
      - type: numeric
        cat: problem
        q: Тонкая призма с углом при вершине 5° отклоняет луч на 2°. Найдите показатель преломления материала призмы.
        num: { value: 1.4, unit: '', check: '1+2/5' }
        hint: 'Выразите $n$ из $\delta = \theta(n - 1)$.'
        explain: '$n = 1 + \frac{\delta}{\theta} = 1 + \frac25 = 1{,}4$.'
        f: [2]
        sol: { given: ['θ = 5°', 'δ = 2°'], find: 'n', formula: 'n = 1 + \frac{\delta}{\theta}', calc: 'n = 1 + \frac{2}{5} = 1{,}4', answer: '1,4' }
        src: o09
      - type: single
        cat: theory
        q: От чего, по конспекту, зависит цвет света?
        opts: ['От частоты', 'От интенсивности', 'От скорости источника', 'От размера призмы']
        ans: a
        hint: Последняя фраза на стр. o08.
        explain: Цвет зависит от частоты.
        src: o08
