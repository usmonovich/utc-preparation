# ───────────────────────────────────────────────────────────────
  - id: wave-diffraction
    title: Дифракция света. Дифракционная решётка
    pages: [o07, d01, d02]
    theory:
      - id: wave-diffraction-n1
        kind: definition
        title: Дифракция
        body: 'Дифракция — это способность светового луча по прохождению через геометрическую щель или препятствие (формулировка в конспекте не закончена, см. DF01). За счёт дифракции можно наблюдать, как световой луч огибается в область геометрической тени.'
        src: d01
        errata: [DF01]
      - id: wave-diffraction-n2
        kind: rule
        title: Когда дифракция хорошо наблюдается
        body: 'Для того чтобы дифракция хорошо наблюдалась, длина волны должна быть близка по значению к ширине препятствия или щели.'
        src: d01
      - id: wave-diffraction-t2
        kind: text
        title: Почему свет огибает препятствие (дополнено)
        body: 'Дифракционную картину объясняют как интерференцию вторичных волн (принцип Гюйгенса — Френеля). Если размеры препятствия много больше длины волны, дифракцией обычно можно пренебречь — тогда свет идёт прямолинейно, как в геометрической оптике.'
        src: d01
        web:
          - { title: 'Википедия: Дифракция', url: 'https://ru.wikipedia.org/wiki/Дифракция' }
      - id: wave-diffraction-n3
        kind: definition
        title: Дифракционная решётка и её период
        body: |
          Дифракционная решётка — это пластина, где последовательно расположены препятствия и щели.
          - Период решётки: $d = a + b$ (a и b — ширины щели и препятствия, см. DF05).
          - Если на $l_0 = 1$ мм нанесено N штрихов, то $d = \frac{l_0}{N}$.
          - На рисунке подписано «λ → d»: длина волны должна быть сравнима с периодом решётки (см. DF04).
        src: d01
        errata: [DF04, DF05]
      - id: wave-diffraction-n4
        kind: definition
        title: Постоянная решётки (как в конспекте)
        body: 'Постоянная дифракционной решётки — это количество штрихов в каждом миллиметре (в формуле $d = \frac{l_0}{N}$ это N; уточнение — в замечании DF02).'
        src: d02
        errata: [DF02]
      - id: wave-diffraction-n5
        kind: law
        title: Условие максимумов на экране
        body: |
          Свет после решётки даёт на экране светлые полосы — максимумы: 0-max (напротив решётки), 1-max, 2-max, …, k-max.
          - Условие максимума: $d\sin\varphi = k\lambda$, где φ — угол между k-max и 0-max.
          - Если L — расстояние между решёткой и экраном, а x — расстояние на экране между 0-max и k-max, то $\sin\varphi = \frac{x}{\sqrt{L^2 + x^2}}$, и условие максимума: $d\cdot\frac{x}{\sqrt{L^2 + x^2}} = k\lambda$.
        src: d02
        fig: grating-screen
      - id: wave-diffraction-n6
        kind: rule
        title: Наибольший номер и число максимумов
        body: 'Так как $\frac{k\lambda}{d} = \sin\varphi \le 1$, наибольший номер максимума $K = \left[\frac d\lambda\right]$ (целая часть числа). Всего на экране $N = 2\left[\frac d\lambda\right] + 1$ максимумов: по K с каждой стороны и центральный (см. DF03, DF06).'
        src: d02
        errata: [DF03, DF06]
      - id: wave-diffraction-t4
        kind: text
        title: Белый свет в решётке (дополнено)
        body: 'Если на решётку падает белый свет, центральный максимум (k = 0) остаётся белым, а в каждом следующем порядке свет раскладывается в спектр: фиолетовые лучи ближе к центру, красные отклоняются сильнее всего (у них больше λ, значит, больше и $\sin\varphi = \frac{k\lambda}{d}$). На практике обычно используют спектры 1-го и 2-го порядков.'
        src: d02
        fig: grating
        web:
          - { title: 'Открытая физика: Спектральные приборы. Дифракционная решётка', url: 'https://physics.ru/courses/op25part2/content/chapter3/section/paragraph10/theory.html' }
    formulas:
      - id: wave-diffraction-f1
        title: Формула дифракционной решётки
        tex: 'd\sin\varphi = k\lambda'
        sym: [d_grat, phi_grat, k_grat, lambda_w]
        src: d02
      - id: wave-diffraction-f4
        title: Период решётки через щель и препятствие
        tex: 'd = a + b'
        sym: [d_grat, ab_grat]
        src: d01
        errata: [DF05]
      - id: wave-diffraction-f2
