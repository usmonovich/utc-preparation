subsection: wave

symbols:
  d_grat: { tex: 'd', meaning: 'период дифракционной решётки', unit: 'м', src: d01 }
  phi_grat: { tex: '\varphi', meaning: 'угол между k-max и 0-max', unit: '°', src: d02 }
  k_grat: { tex: 'k', meaning: 'номер максимума: 0, 1, 2, …', unit: '—', src: d02 }
  N_lines: { tex: 'N', meaning: 'число штрихов на длине l₀ = 1 мм', unit: '—', src: d01 }
  l_grat: { tex: 'l_0', meaning: 'длина участка решётки (в конспекте l₀ = 1 мм)', unit: 'м', src: d01 }
  ab_grat: { tex: 'a,\ b', meaning: 'ширины щели и препятствия (на рисунке не подписано, что есть что, см. DF05)', unit: 'м', src: d01 }
  L_scr: { tex: 'L', meaning: 'расстояние между решёткой и экраном', unit: 'м', src: d02 }
  x_scr: { tex: 'x', meaning: 'расстояние на экране между 0-max и k-max', unit: 'м', src: d02 }
  K_maxn: { tex: 'K', meaning: 'наибольший номер максимума', unit: '—', src: d02 }
  N_maxn: { tex: 'N', meaning: 'общее число максимумов (в формуле N = 2[d/λ] + 1; см. DF06)', unit: '—', src: d02 }
  dphi: { tex: '\Delta\varphi', meaning: 'разность фаз двух волн', unit: 'рад', src: o04 }
  dx_path: { tex: '\Delta x', meaning: 'разность волновых путей, Δx = x₁ − x₂', unit: 'м', src: o04 }
  x12: { tex: 'x_1,\ x_2', meaning: 'волновые пути от источников до точки встречи', unit: 'м', src: o04 }
  A12: { tex: 'A_1,\ A_2', meaning: 'амплитуды двух складываемых волн', unit: '', src: o04 }
  A_rez: { tex: 'A_{рез}', meaning: 'результирующая амплитуда', unit: '', src: o04 }
  I12: { tex: 'I_1,\ I_2', meaning: 'интенсивности двух складываемых волн', unit: 'Дж/(м²·с)', src: o04 }
  I_rez: { tex: 'I_{рез}', meaning: 'результирующая интенсивность', unit: 'Дж/(м²·с)', src: o04 }
