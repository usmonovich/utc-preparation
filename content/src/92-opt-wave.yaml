  theta_pr: { tex: '\theta', meaning: 'угол призмы при вершине', unit: '°', src: o09 }

errata:
  - id: DF01
    page: d01
    severity: note
    original: '«Дифракция — это способность светового луча по прохождению через геометрическую щель или препятствие»'
    issue: 'Формулировка не закончена: не сказано, что делает луч. По последней фразе этой же страницы речь о том, что луч огибает препятствие и заходит в область геометрической тени.'
    target: 'Определение дифракции'
    suggestion: '«Дифракция — способность света огибать препятствия: проходя через узкую щель или мимо препятствия, луч заходит в область геометрической тени».'
  - id: DF02
    page: d02
    severity: note
    original: '«Постоянная дифракционной решётки — это кол-во штрихов в каждом мм»'
    issue: 'Обычно постоянной (периодом) решётки называют d — расстояние, на котором повторяются щель и препятствие (d = a + b, стр. d01). Количество штрихов на 1 мм — это N в формуле \(d = \frac{l_0}{N}\).'
    target: 'Определение постоянной решётки'
    suggestion: '«Постоянная (период) решётки — d = a + b. Если на 1 мм нанесено N штрихов, то \(d = \frac{1\ \text{мм}}{N}\)».'
  - id: DF03
    page: d02
    severity: note
    original: '\(K = \left[\frac{d}{\lambda}\right]\) — самое максимальное среди целых max (номер)'
    issue: 'Формула верна, если \(\frac d\lambda\) — не целое. Если же \(\frac d\lambda\) — целое, максимум с номером \(k = \frac d\lambda\) шёл бы под углом 90° (вдоль решётки) и на экран не попадает.'
    target: 'Наибольший номер максимума'
    suggestion: '«K — наибольшее целое число, меньшее \(\frac d\lambda\)» (при нецелом \(\frac d\lambda\) это то же, что \(\left[\frac d\lambda\right]\)). В задачах приложения \(\frac d\lambda\) — не целое.'
  - id: DF04
    page: d01
    severity: unclear
    original: '«λ → d» рядом с рисунком решётки'
    issue: 'Запись не пояснена.'
    target: 'Подпись «λ → d» на рисунке'
    suggestion: 'По смыслу (строкой выше — условие для щели): «длина волны λ должна быть сравнима с периодом решётки d».'
    todo: 'Если на занятии эта запись означала другое — оставьте как в конспекте.'
  - id: DF05
    page: d01
    severity: unclear
    original: 'На рисунке решётки слева подписаны a (сверху) и b (снизу)'
    issue: 'Не подписано, что из них — ширина щели, а что — ширина препятствия.'
    target: 'Обозначения a и b в формуле d = a + b'
    suggestion: 'Подписать: «a — ширина щели (прозрачной части), b — ширина препятствия (непрозрачной части)». На формулу d = a + b это не влияет.'
    todo: 'Если на занятии было наоборот — оставьте как в конспекте.'
  - id: DF06
    page: d02
    severity: note
    original: '\(d = \frac{l_0}{N}\) (стр. d01) и \(N = 2\left[\frac{d}{\lambda}\right] + 1\)'
    issue: 'Одной буквой N обозначены разные величины: число штрихов на 1 мм и общее число максимумов.'
    target: 'Буква N в формулах решётки'
    suggestion: 'Обозначить общее число максимумов, например, \(N_{max} = 2\left[\frac d\lambda\right] + 1\). В приложении эти величины расшифрованы отдельно.'
  - id: O04
    page: o03
    severity: unclear
    original: '«Свет — это частица, которая распространяется волновым образом…»; «Классические свойства частицы света наблюдаются в эффектах…»'
    issue: 'Перечисленные эффекты (прямолинейное распространение, тень, отражение, преломление, фотоэффект) обычно называют корпускулярными (частичными) свойствами света. Слово «классические», вероятно, неточность.'
    target: 'Слово «классические» в описании свойств света'
    suggestion: 'Записать: «Корпускулярные (частичные) свойства света проявляются в эффектах…».'
  - id: O05
    page: o04
    severity: error
    original: '\(A_{рез} = A_1^2 + A_2^2 + 2A_1A_2\cos\Delta\varphi\) (в рамке)'
    issue: 'Справа стоит квадрат результирующей амплитуды. С формулой из той же рамки \(I_{рез} = I_1 + I_2 + 2\sqrt{I_1I_2}\cos\Delta\varphi\) и \(I \sim A^2\) согласуется только \(A_{рез}^2\). Иначе при \(\Delta\varphi = 0\) не получается \(A_{рез} = A_1 + A_2\) со стр. o05.'
    target: 'Сложение амплитуд при интерференции (в рамке)'
    suggestion: '\(A_{рез}^2 = A_1^2 + A_2^2 + 2A_1A_2\cos\Delta\varphi\).'
  - id: O06
    page: o05
    severity: unclear
    original: '«ΔP = 0»'
    issue: 'Обозначение ΔP в теме больше не встречается. По смыслу (максимум, \(A_{рез} = A_1 + A_2\)) это разность фаз \(\Delta\varphi = 0\), то есть k = 0.'
    target: 'Обозначение ΔP в условии максимума'
    suggestion: '\(\Delta\varphi = 0\).'
  - id: O07
    page: o05
    severity: note
    original: Заголовок «Интерференционный минимум» (дважды) без записи
    issue: Условие интерференционного минимума в конспекте не записано.
    target: 'Пустой заголовок «Интерференционный минимум»'
    suggestion: 'Условие минимума: \(\Delta x = (2k + 1)\frac{\lambda}{2}\) — нечётное число половин длины волны (то же: \(\Delta\varphi = (2k + 1)\pi\)). По вашей просьбе добавлено из интернета в тему «Интерференция».'
    todo: 'По вашей просьбе условие минимума добавлено из интернета («Открытая физика», 3.7) в тему «Интерференция» с пометкой «из интернета». Утвердите блок или отклоните.'
  - id: O09
    page: o07
    severity: note
    original: Заголовок «Дифракция» (18.03.25), страница пустая
    issue: Записи по дифракции нет, поэтому тема не создана.
    target: 'Пустая страница «Дифракция»'
    suggestion: 'Тема записана на отдельных листах — фото «Дифракция» (стр. d01–d02, получены 22.10.2026); по ним тема «Дифракция света. Дифракционная решётка» перестроена.'
    todo: 'Записи из интернета в этой теме заменены записями из конспекта; осталось два дополнения с пометкой «из интернета». Проверьте тему и утвердите записи.'
  - id: O10
    page: o09
    severity: note
    original: '\(\delta = \theta(n - 1)\) (в рамке)'
    issue: 'Формула приближённая: она верна для призмы с малым углом при вершине θ (тонкой призмы). Для призмы с большим углом даёт заметную ошибку.'
    target: 'Угол отклонения лучей призмой (в рамке)'
