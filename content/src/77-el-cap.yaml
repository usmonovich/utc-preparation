    title: Энергия конденсатора. Плотность энергии
    pages: [c22, c23]
    theory:
      - kind: text
        title: Энергия заряженного шара и конденсатора
        body: 'Шар: $\varphi = k\frac{q}{\varepsilon R}$, $C = 4\pi\varepsilon\varepsilon_0R$, $q = \varphi C$; $W = \frac{q^2}{2C} = \frac{C\varphi^2}{2} = \frac{\varphi q}{2}$. Конденсатор: $q = UC$, $C = \frac{\varepsilon\varepsilon_0S}{d}$; $W = \frac{q^2}{2C} = \frac{CU^2}{2} = \frac{Uq}{2}$.'
        src: c22
      - kind: rule
        title: Подключён к источнику или отключён
        body: '① «Соединён к источнику»: U = const, $W = \frac{CU^2}{2}$, W ~ C — W ~ ε, W ~ S, W ~ $\frac1d$. ② «Зарядили и отсоединили от источника»: q = const, $W = \frac{q^2}{2C}$, W ~ $\frac1C$ — W ~ $\frac1\varepsilon$, W ~ $\frac1S$, W ~ d.'
        src: c23
        fig: cap-two-cases
      - kind: definition
        title: Плотность энергии
        body: 'Плотность энергии — это энергия единицы объёма: $w = \frac WV$ [Дж/м³]. Для конденсатора $V = Sd$: $w = \frac{CU^2}{2V} = \frac{\varepsilon\varepsilon_0}{2}\left(\frac Ud\right)^2 = \frac{\varepsilon\varepsilon_0E^2}{2} = \frac{\sigma^2}{2\varepsilon\varepsilon_0}$.'
        src: c23
