        src: c15
      - type: numeric
        cat: problem
        q: Между пластинами воздушного конденсатора поместили диэлектрик с ε = 7. Во сколько раз увеличилась ёмкость?
        num: { value: 7, unit: '', check: '7/1' }
        hint: '$C \sim \varepsilon$.'
        explain: Ёмкость увеличилась в 7 раз.
        f: [1]
        sol: { given: ['ε = 7'], find: "C'/C", formula: 'C \sim \varepsilon', calc: "\\frac{C'}{C} = 7", answer: 'в 7 раз' }
        src: c15
      - type: numeric
        cat: problem
        q: 'Конденсатор ёмкостью 2 мкФ подключён к источнику 50 В. Найдите его заряд.'
        num: { value: 1e-4, unit: 'Кл', check: '2e-6*50' }
        hint: '$q = CU$.'
        explain: '$q = 2\cdot10^{-6}\cdot50 = 10^{-4}$ Кл.'
        f: [2]
        sol: { given: ['C = 2·10⁻⁶ Ф', 'U = 50 В'], find: 'q', formula: 'q = CU', calc: 'q = 2\cdot10^{-6}\cdot50 = 10^{-4}', answer: '10⁻⁴ Кл' }
        src: c15
      - type: numeric
        cat: problem
        q: 'Заряд конденсатора 6 мкКл, ёмкость 3 мкФ. Найдите напряжение конденсатора.'
        num: { value: 2, unit: 'В', check: '6e-6/3e-6' }
        hint: '$U_c = \frac qC$.'
        explain: '$U_c = \frac{6\cdot10^{-6}}{3\cdot10^{-6}} = 2$ В.'
        f: [2]
        sol: { given: ['q = 6·10⁻⁶ Кл', 'C = 3·10⁻⁶ Ф'], find: 'U_c', formula: 'U_c = \frac{q}{C}', calc: 'U_c = 2', answer: '2 В' }
        src: c15
      - type: single
        cat: theory
        q: 'На обкладках конденсатора заряды +7 Кл и −7 Кл. Чему равен заряд конденсатора?'
        opts: ['7 Кл', '0', '14 Кл', '−7 Кл']
        ans: a
        hint: Рисунок на стр. c15.
        explain: 'Заряд конденсатора — заряд одной обкладки: $q = 7$ Кл.'
        src: c15
      - type: single
        cat: theory
        q: Зависит ли ёмкость конденсатора от его заряда и напряжения?
        opts: ['Нет: зависит только от S, ε и d', 'Да, растёт с зарядом', 'Да, растёт с напряжением', 'Да, падает с напряжением']
        ans: a
        hint: 'Запись «C ≁ q, U» на стр. c15.'
        explain: 'Ёмкость определяется устройством конденсатора: $C \sim S,\ \varepsilon,\ \frac1d$.'
        f: [1]
        src: c15
      - type: multiple
        cat: theory
        q: Как можно увеличить ёмкость плоского конденсатора? Выберите все верные варианты.
        opts: ['Увеличить площадь пластин', 'Поместить между пластинами диэлектрик с большим ε', 'Уменьшить расстояние между пластинами', 'Увеличить напряжение на нём', 'Увеличить заряд на нём']
        ans: [a, b, c]
        hint: '$C = \frac{\varepsilon\varepsilon_0S}{d}$.'
        explain: Ёмкость растёт с S и ε и убывает с d; от заряда и напряжения она не зависит.
        f: [1]
        src: c15
      - type: single
        cat: theory
        q: Что всегда располагается между пластинками конденсатора?
        opts: ['Диэлектрик', 'Проводник', 'Источник тока', 'Резистор']
        ans: a
