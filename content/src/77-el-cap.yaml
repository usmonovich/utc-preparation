# ───────────────────────────────────────────────────────────────
  - id: cap-connect
    title: Соединение конденсаторов
    pages: [c16, c17, c18]
    theory:
      - kind: definition
        title: Последовательное соединение
        body: 'Существует три вида соединения: последовательное, параллельное и смешанное. Два элемента соединены последовательно, если к «выходу» первого присоединён только «вход» другого: заряд без выбора проходит с первого на второй конденсатор. $U = U_1 + U_2 + \dots + U_n$, $q_{об} = q_1 = q_2 = \dots = q_n$, $C_{об} = \left(\frac1{C_1} + \dots + \frac1{C_n}\right)^{-1}$; для n одинаковых $C_{об} = \frac Cn$. Общая ёмкость меньше каждой из ёмкостей (см. EL05).'
        src: [c16, c17]
        errata: [EL05]
        fig: cap-series
      - kind: definition
        title: Параллельное соединение
        body: 'Элементы соединены параллельно, если их «входы» и «выходы» соединены одновременно. Если между входами есть помеха (другой элемент), это уже не параллельное соединение. $C_{об} = C_1 + C_2 + \dots + C_n$, $U_{об} = U_1 = U_2 = \dots = U_n$, $q_{об} = q_1 + q_2 + \dots + q_n$.'
        src: c17
      - kind: text
        title: Смешанное соединение — примеры конспекта
        body: |
          - Два C последовательно ($\frac C2$) и параллельно им C: $C_{об} = \frac C2 + C = \frac{3C}{2}$.
          - Три C последовательно, два C последовательно и одна C — всё параллельно: $C_{об} = \frac C3 + \frac C2 + C = \frac{11C}{6}$.
          - Две C параллельно (2C) и последовательно с ними C: $C_{об} = \left(\frac1{2C} + \frac1C\right)^{-1} = \frac{2C}{3}$.
          - «Ромб» из четырёх C и пятая C прямо между выводами: $C_{об} = \frac C2 + C + \frac C2 = 2C$.
        src: c18
    formulas:
      - title: Последовательное соединение
        tex: 'U = U_1 + \dots + U_n,\quad q_{об} = q_1 = \dots = q_n,\quad C_{об} = \left(\frac{1}{C_1} + \frac{1}{C_2} + \dots + \frac{1}{C_n}\right)^{-1}'
        sym: [U_volt, U1n, q1n_cap, C_ob, C1n]
        src: c16
      - title: n одинаковых конденсаторов последовательно
        tex: 'C_{об} = \frac{C}{n}'
        sym: [C_ob, C_el, n_cap]
        boxed: true
        src: c17
      - title: Общая ёмкость последовательного соединения (как в конспекте)
        tex: 'C_{об} < C_1\cdot C_2\cdot C_3\cdot\dots\cdot C_n'
        sym: [C_ob, C1n]
        boxed: true
        src: c17
        errata: [EL05]
      - title: Параллельное соединение
        tex: 'C_{об} = C_1 + C_2 + \dots + C_n,\quad U_{об} = U_1 = U_2 = \dots = U_n,\quad q_{об} = q_1 + q_2 + \dots + q_n'
        sym: [C_ob, C1n, U1n, q1n_cap]
        boxed: true
        src: c17
    examples:
      - title: Два последовательных и один параллельный
        steps: ['$\left(\frac1C + \frac1C\right)^{-1} = \frac C2$ — «убрали один конденсатор»', '$C_{об} = \frac C2 + C = \frac{3C}{2}$']
        src: c18
      - title: Три ветви
        steps: ['$\frac C3$ (три последовательно), $\frac C2$ (два последовательно), $C$', '$C_{об} = \frac C3 + \frac C2 + C = \frac{11C}{6}$']
        src: c18
      - title: Параллельная пара и последовательный конденсатор
        steps: ['$C + C = 2C$', '$C_{об} = \left(\frac{1}{2C} + \frac1C\right)^{-1} = \frac{2C}{3}$']
        src: c18
      - title: «Ромб» с конденсатором между выводами
        steps: ['Каждая сторона ромба: $\left(\frac1C + \frac1C\right)^{-1} = \frac C2$', 'Пятый конденсатор подключён прямо к выводам', '$C_{об} = \frac C2 + C + \frac C2 = 2C$']
        src: c18
    questions:
      - type: numeric
        cat: problem
        q: 'Конденсаторы 2 мкФ и 3 мкФ соединены последовательно. Найдите общую ёмкость.'
        num: { value: 1.2e-6, unit: 'Ф', check: '1/(1/2e-6+1/3e-6)' }
        hint: '$C_{об} = \left(\frac1{C_1} + \frac1{C_2}\right)^{-1}$.'
        explain: '$C_{об} = \frac{2\cdot3}{2 + 3} = 1{,}2$ мкФ — меньше каждой.'
        f: [1]
        sol: { given: ['C₁ = 2 мкФ', 'C₂ = 3 мкФ'], find: 'C_об', formula: 'C_{об} = \left(\frac{1}{C_1} + \frac{1}{C_2}\right)^{-1}', calc: 'C_{об} = \frac{2\cdot3}{5} = 1{,}2', answer: '1,2 мкФ' }
        src: c16
      - type: numeric
        cat: problem
        q: 'Конденсаторы 2 мкФ и 3 мкФ соединены параллельно. Найдите общую ёмкость.'
        num: { value: 5e-6, unit: 'Ф', check: '2e-6+3e-6' }
        hint: При параллельном соединении ёмкости складываются.
        explain: '$C_{об} = 2 + 3 = 5$ мкФ.'
        f: [4]
        sol: { given: ['C₁ = 2 мкФ', 'C₂ = 3 мкФ'], find: 'C_об', formula: 'C_{об} = C_1 + C_2', calc: 'C_{об} = 2 + 3 = 5', answer: '5 мкФ' }
        src: c17
      - type: numeric
        cat: problem
        q: 'Четыре одинаковых конденсатора по 8 мкФ соединены последовательно. Найдите общую ёмкость.'
        num: { value: 2e-6, unit: 'Ф', check: '8e-6/4' }
        hint: '$C_{об} = \frac Cn$.'
        explain: '$C_{об} = \frac84 = 2$ мкФ.'
        f: [2]
        sol: { given: ['C = 8 мкФ', 'n = 4'], find: 'C_об', formula: 'C_{об} = \frac{C}{n}', calc: 'C_{об} = \frac{8}{4} = 2', answer: '2 мкФ' }
        src: c17
      - type: numeric
        cat: problem
        q: 'Два конденсатора по C = 6 мкФ соединены последовательно, а параллельно им подключён третий такой же. Найдите общую ёмкость.'
        num: { value: 9e-6, unit: 'Ф', check: '1/(1/6e-6+1/6e-6)+6e-6' }
        hint: 'Первый пример на стр. c18: $C_{об} = \frac{3C}{2}$.'
        explain: '$\frac62 + 6 = 9$ мкФ.'
        f: [1, 4]
        sol: { given: ['C = 6 мкФ'], find: 'C_об', formula: 'C_{об} = \frac{C}{2} + C = \frac{3C}{2}', calc: 'C_{об} = 3 + 6 = 9', answer: '9 мкФ' }
        src: c18
      - type: numeric
        cat: problem
        q: 'Три ветви соединены параллельно: три конденсатора по C последовательно, два по C последовательно и один C. Найдите общую ёмкость при C = 6 мкФ.'
        num: { value: 11e-6, unit: 'Ф', check: '6e-6/3+6e-6/2+6e-6' }
        hint: 'Второй пример стр. c18: $\frac{11C}{6}$.'
        explain: '$2 + 3 + 6 = 11$ мкФ.'
        f: [2, 4]
        sol: { given: ['C = 6 мкФ'], find: 'C_об', formula: 'C_{об} = \frac{C}{3} + \frac{C}{2} + C = \frac{11C}{6}', calc: 'C_{об} = 2 + 3 + 6 = 11', answer: '11 мкФ' }
        src: c18
      - type: numeric
        cat: problem
        q: 'Два конденсатора по 3 мкФ соединены параллельно, и последовательно с ними подключён ещё один на 3 мкФ. Найдите общую ёмкость.'
        num: { value: 2e-6, unit: 'Ф', check: '1/(1/6e-6+1/3e-6)' }
        hint: 'Третий пример стр. c18: $\frac{2C}{3}$.'
        explain: '$(\frac16 + \frac13)^{-1} = 2$ мкФ.'
        f: [1, 4]
        sol: { given: ['C = 3 мкФ'], find: 'C_об', formula: 'C_{об} = \left(\frac{1}{2C} + \frac{1}{C}\right)^{-1} = \frac{2C}{3}', calc: 'C_{об} = \frac{2\cdot3}{3} = 2', answer: '2 мкФ' }
        src: c18
      - type: numeric
        cat: problem
        q: 'Схема «ромб» из четырёх конденсаторов по C = 5 мкФ и пятый такой же прямо между выводами (как на стр. c18). Найдите общую ёмкость.'
        num: { value: 10e-6, unit: 'Ф', check: '5e-6/2+5e-6+5e-6/2' }
        hint: 'Стороны ромба дают по $\frac C2$, всё вместе — параллельно.'
        explain: '$2{,}5 + 5 + 2{,}5 = 10$ мкФ ($2C$).'
        f: [1, 4]
        sol: { given: ['C = 5 мкФ'], find: 'C_об', formula: 'C_{об} = \frac{C}{2} + C + \frac{C}{2} = 2C', calc: 'C_{об} = 2\cdot5 = 10', answer: '10 мкФ' }
        src: c18
      - type: numeric
        cat: problem
        q: 'Конденсаторы 2 мкФ и 3 мкФ соединены последовательно и подключены к 10 В. Найдите заряд каждого.'
        num: { value: 1.2e-5, unit: 'Кл', check: '1/(1/2e-6+1/3e-6)*10' }
        hint: 'При последовательном соединении заряды равны: $q = C_{об}U$.'
        explain: '$q = 1{,}2\cdot10^{-6}\cdot10 = 1{,}2\cdot10^{-5}$ Кл на каждом.'
        f: [1]
        sol: { given: ['C₁ = 2 мкФ', 'C₂ = 3 мкФ', 'U = 10 В'], find: 'q', formula: 'q = C_{об}U', calc: 'q = 1{,}2\cdot10^{-6}\cdot10 = 1{,}2\cdot10^{-5}', answer: '1,2·10⁻⁵ Кл' }
        src: c16
      - type: single
        cat: theory
        q: Что одинаково у последовательно соединённых конденсаторов?
        opts: ['Заряд', 'Напряжение', 'Ёмкость', 'Энергия']
        ans: a
        hint: '«Заряд безвыборочно проходит с первого на второй».'
        explain: '$q_{об} = q_1 = q_2 = \dots = q_n$.'
        f: [1]
        src: c16
      - type: single
        cat: theory
        q: Что одинаково у параллельно соединённых конденсаторов?
        opts: ['Напряжение', 'Заряд', 'Ёмкость', 'Ничего']
        ans: a
        hint: Входы и выходы соединены одновременно.
        explain: '$U_{об} = U_1 = U_2 = \dots = U_n$.'
        f: [4]
        src: c17
      - type: single
        cat: theory
        q: Как общая ёмкость последовательного соединения соотносится с ёмкостями конденсаторов?
        opts: ['Меньше наименьшей из них', 'Больше наибольшей', 'Равна их сумме', 'Равна их произведению']
        ans: a
        hint: См. замечание EL05.
        explain: 'Например, 2 мкФ и 3 мкФ дают 1,2 мкФ. Запись конспекта как произведения неверна (EL05).'
        f: [1, 3]
        src: c17
        errata: [EL05]
      - type: matching
        cat: theory
        q: Сопоставьте величину и правило для параллельного соединения.
        pairs:
          - ['$C_{об}$', 'Сумма ёмкостей']
          - ['$U_{об}$', 'Одинаково на всех конденсаторах']
          - ['$q_{об}$', 'Сумма зарядов']
        hint: Три формулы в рамке на стр. c17.
        explain: 'Параллельно: ёмкости и заряды складываются, напряжение общее.'
        f: [4]
        src: c17

# ───────────────────────────────────────────────────────────────
  - id: cap-potmethod
    title: Метод потенциалов
    pages: [c20]
    theory:
      - kind: rule
        title: Метод потенциалов
        body: 'Узлы схемы нумеруют: точки, соединённые проводом, получают одинаковый номер (одинаковый потенциал). Конденсаторы с одинаковыми номерами по бокам соединены параллельно. Конденсатор, у которого с обеих сторон один и тот же номер, не работает: потенциалы равны, U = 0 (в конспекте «⇒ C = 0», правильно — заряд $q = 0$, см. EL06).'
        src: c20
        errata: [EL06]
      - kind: text
        title: Пример — ключ в схеме
        body: 'Сверху C и 2C последовательно, снизу 2C и C, ключ K соединяет средние точки. Ключ разомкнут: $C_{об} = \frac{2C}{3} + \frac{2C}{3} = \frac{4C}{3}$. Ключ замкнут: (C ∥ 2C) последовательно с (2C ∥ C), то есть 3C и 3C: $C_{об} = \frac{3C}{2}$ — ёмкость увеличилась в $\frac98$ раз.'
        src: c20
        fig: key-circuit
    formulas:
      - title: Ключ разомкнут
        tex: 'C_{об} = \frac{4C}{3}'
        sym: [C_ob, C_el]
        src: c20
      - title: Ключ замкнут
        tex: 'C_{об} = \frac{3C}{2}'
        sym: [C_ob, C_el]
        src: c20
    questions:
      - type: numeric
        cat: problem
        q: 'В схеме с ключом из конспекта C = 3 мкФ, ключ разомкнут. Найдите общую ёмкость.'
        num: { value: 4e-6, unit: 'Ф', check: '1/(1/3e-6+1/6e-6)*2' }
        hint: 'Две ветви «C и 2C последовательно» соединены параллельно.'
        explain: 'Каждая ветвь $\frac{2C}{3} = 2$ мкФ, вместе $\frac{4C}{3} = 4$ мкФ.'
        f: [1]
        sol: { given: ['C = 3 мкФ', 'ключ разомкнут'], find: 'C_об', formula: 'C_{об} = 2\cdot\frac{C\cdot2C}{C + 2C} = \frac{4C}{3}', calc: 'C_{об} = \frac{4\cdot3}{3} = 4', answer: '4 мкФ' }
        src: c20
      - type: numeric
        cat: problem
        q: 'Та же схема (C = 3 мкФ), ключ замкнут. Найдите общую ёмкость.'
        num: { value: 4.5e-6, unit: 'Ф', check: '1/(1/9e-6+1/9e-6)' }
        hint: 'Получаются две пары «C ∥ 2C», соединённые последовательно.'
        explain: 'Каждая пара $3C = 9$ мкФ, последовательно — $\frac{3C}{2} = 4{,}5$ мкФ.'
        f: [2]
        sol: { given: ['C = 3 мкФ', 'ключ замкнут'], find: 'C_об', formula: 'C_{об} = \left(\frac{1}{3C} + \frac{1}{3C}\right)^{-1} = \frac{3C}{2}', calc: 'C_{об} = \frac{3\cdot3}{2} = 4{,}5', answer: '4,5 мкФ' }
        src: c20
      - type: numeric
        cat: problem
        q: Во сколько раз увеличивается общая ёмкость этой схемы при замыкании ключа?
        num: { value: 1.125, unit: '', check: '(3/2)/(4/3)' }
        hint: Разделите $\frac{3C}{2}$ на $\frac{4C}{3}$.
        explain: '$\frac{3/2}{4/3} = \frac98 = 1{,}125$ — «увеличилось в $\frac98$ раз».'
        f: [1, 2]
        sol: { given: ['C_раз = 4C/3', 'C_зам = 3C/2'], find: 'C_зам/C_раз', formula: '\frac{3C/2}{4C/3}', calc: '\frac{3}{2}\cdot\frac{3}{4} = \frac{9}{8}', answer: '9/8 = 1,125' }
        src: c20
      - type: single
        cat: theory
        q: У конденсатора с обеих сторон оказался один и тот же номер узла. Что это значит?
        opts: ['Он не заряжается — его можно убрать из схемы', 'Он соединён параллельно со всеми', 'Его ёмкость удваивается', 'Через него течёт наибольший ток']
        ans: a
        hint: Потенциалы с обеих сторон равны.
        explain: 'U = 0, значит $q = CU = 0$ — конденсатор «не работает» (о записи «C = 0» см. EL06).'
        src: c20
        errata: [EL06]
      - type: single
        cat: theory
        q: Как по методу потенциалов узнать, что два конденсатора соединены параллельно?
        opts: ['У них одинаковые пары номеров по бокам', 'У них одинаковые ёмкости', 'Они нарисованы рядом', 'Между ними нет провода']
        ans: a
        hint: Первое правило на стр. c20.
        explain: Конденсаторы с одинаковыми номерами по бокам параллельны.
        src: c20
      - type: single
        cat: theory
        q: 'Почему конденсатор между точками с равными потенциалами «не работает»?'
        opts: ['Напряжение на нём 0, поэтому заряд q = CU = 0', 'Его ёмкость становится равной нулю', 'Он пробивается', 'Через него течёт ток короткого замыкания']
        ans: a
        hint: Ёмкость от напряжения не зависит (стр. c15).
        explain: 'В конспекте написано «U = 0 ⇒ C = 0»; правильно — $q = 0$ (замечание EL06).'
        src: c20
        errata: [EL06]

# ───────────────────────────────────────────────────────────────
  - id: cap-voltage
    title: Распределение напряжения. Поле конденсатора
    pages: [c21, c22]
    theory:
      - kind: rule
        title: Напряжения при последовательном соединении
        body: 'Заряды последовательно соединённых конденсаторов равны: $q_{об} = q_i$, то есть $C_{об}U = C_iU_i$, откуда $U_i = U\frac{C_{об}}{C_i}$. На конденсаторе меньшей ёмкости напряжение больше.'
        src: c21
      - kind: text
        title: Поле заряженной пластины
        body: 'Положительно заряженная пластина создаёт линии по обе стороны от себя, к отрицательной линии сходятся с обеих сторон. Напряжённость поля пластины $E = \frac{|\sigma|}{2\varepsilon\varepsilon_0}$.'
        src: c21
      - kind: text
        title: Поле двух пластин
        body: 'Одноимённые пластины ($+\sigma_1$, $+\sigma_2$): между ними $E_{внутр} = E_1 - E_2$, снаружи $E_{внеш} = E_1 + E_2$. Разноимённые ($+\sigma_1$, $-\sigma_2$): между ними $E_{внутр} = E_1 + E_2$, снаружи $E_{внеш} = E_1 - E_2$; здесь $E_1 = \frac{|\sigma_1|}{2\varepsilon\varepsilon_0}$, $E_2 = \frac{|\sigma_2|}{2\varepsilon\varepsilon_0}$.'
        src: [c21, c22]
      - kind: rule
        title: Поле конденсатора
        body: 'У конденсатора $|\sigma_1| = |\sigma_2| = |\sigma|$: между пластинами $E_{внутр} = \frac{\sigma}{\varepsilon\varepsilon_0}$, снаружи $E_{внеш} = 0$.'
        src: c22
        fig: plates-field
    formulas:
      - title: Напряжение на i-м конденсаторе (последовательно)
        tex: 'U_i = U\cdot\frac{C_{об}}{C_i}'
        sym: [U1n, U_volt, C_ob, C1n]
        boxed: true
        src: c21
      - title: Поле одной пластины
        tex: 'E = \frac{|\sigma|}{2\varepsilon\varepsilon_0}'
        sym: [E_el, sigma_el, eps_d, eps0_el]
        src: c21
      - title: Две одноимённые пластины
        tex: 'E_{внутр} = \frac{|\sigma_1| - |\sigma_2|}{2\varepsilon\varepsilon_0},\qquad E_{внеш} = \frac{|\sigma_1| + |\sigma_2|}{2\varepsilon\varepsilon_0}'
        sym: [E_in_out, sigma12, eps_d, eps0_el]
        src: c21
      - title: Две разноимённые пластины
        tex: 'E_{внутр} = \frac{|\sigma_1| + |\sigma_2|}{2\varepsilon\varepsilon_0},\qquad E_{внеш} = \frac{|\sigma_1| - |\sigma_2|}{2\varepsilon\varepsilon_0}'
        sym: [E_in_out, sigma12, eps_d, eps0_el]
        src: c22
      - title: Поле конденсатора
        tex: 'E_{внутр} = \frac{\sigma}{\varepsilon\varepsilon_0},\qquad E_{внеш} = 0'
        sym: [E_in_out, sigma_el, eps_d, eps0_el]
        boxed: true
        src: c22
    questions:
      - type: numeric
        cat: problem
        q: 'Конденсаторы 2 мкФ и 3 мкФ соединены последовательно и подключены к 10 В. Найдите напряжение на конденсаторе 2 мкФ.'
        num: { value: 6, unit: 'В', check: '10*1.2/2' }
        hint: '$U_i = U\frac{C_{об}}{C_i}$, $C_{об} = 1{,}2$ мкФ.'
        explain: '$U_1 = 10\cdot\frac{1{,}2}{2} = 6$ В.'
        f: [1]
        sol: { given: ['C₁ = 2 мкФ', 'C₂ = 3 мкФ', 'U = 10 В'], find: 'U₁', formula: 'U_1 = U\frac{C_{об}}{C_1}', calc: 'C_{об} = 1{,}2;\ U_1 = 10\cdot\frac{1{,}2}{2} = 6', answer: '6 В' }
        src: c21
      - type: numeric
        cat: problem
        q: 'В той же цепи (2 мкФ и 3 мкФ последовательно, 10 В) найдите напряжение на конденсаторе 3 мкФ.'
        num: { value: 4, unit: 'В', check: '10*1.2/3' }
        hint: 'Проверка: $U_1 + U_2 = U$.'
        explain: '$U_2 = 10\cdot\frac{1{,}2}{3} = 4$ В; $6 + 4 = 10$ В.'
        f: [1]
        sol: { given: ['C₂ = 3 мкФ', 'C_об = 1,2 мкФ', 'U = 10 В'], find: 'U₂', formula: 'U_2 = U\frac{C_{об}}{C_2}', calc: 'U_2 = 10\cdot\frac{1{,}2}{3} = 4', answer: '4 В' }
        src: c21
      - type: numeric
        cat: problem
        q: 'Поверхностная плотность заряда обкладок воздушного конденсатора $8{,}85\cdot10^{-7}$ Кл/м². Найдите напряжённость поля между обкладками.'
        num: { value: 1e5, unit: 'В/м', check: '8.85e-7/(1*8.85e-12)' }
        hint: '$E_{внутр} = \frac{\sigma}{\varepsilon\varepsilon_0}$.'
        explain: '$E = \frac{8{,}85\cdot10^{-7}}{8{,}85\cdot10^{-12}} = 10^5$ В/м.'
        f: [5]
        sol: { given: ['σ = 8,85·10⁻⁷ Кл/м²', 'ε = 1'], find: 'E_внутр', formula: 'E_{внутр} = \frac{\sigma}{\varepsilon\varepsilon_0}', calc: 'E = \frac{8{,}85\cdot10^{-7}}{8{,}85\cdot10^{-12}} = 10^5', answer: '10⁵ В/м' }
        src: c22
      - type: numeric
        cat: problem
        q: 'Одна пластина с той же плотностью заряда $8{,}85\cdot10^{-7}$ Кл/м² в воздухе. Найдите напряжённость её поля.'
