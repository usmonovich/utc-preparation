        sol: { given: ['R = 6,4·10⁶ м', 'ε = 1'], find: 'C', formula: 'C = 4\pi\varepsilon_0\varepsilon R', calc: 'C = 4\cdot3{,}14\cdot8{,}85\cdot10^{-12}\cdot6{,}4\cdot10^6 \approx 7{,}1\cdot10^{-4}', answer: '≈ 7,1·10⁻⁴ Ф' }
