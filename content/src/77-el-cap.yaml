# ───────────────────────────────────────────────────────────────
  - id: cap-flat
    title: Конденсатор. Плоский конденсатор
    pages: [c14, c15]
    theory:
      - kind: definition
        title: Конденсатор
        body: 'Прибор, предназначенный для накопления электрического заряда, называется конденсатором. Бывает трёх видов: плоский, цилиндрический, сферический. Конденсатор состоит из двух металлических пластинок, расположенных очень близко друг к другу, но не касающихся друг друга. Между пластинками всегда располагается диэлектрик. На пластинках накапливаются одинаковые, но разные по знаку заряды.'
        src: c14
        fig: capacitor-charge
      - kind: text
        title: Ёмкость плоского конденсатора
        body: 'Ёмкость растёт с площадью пластин S и проницаемостью диэлектрика ε и убывает с расстоянием d: $C \sim S,\ \varepsilon$; $C \sim \frac1d$; $C = \frac{\varepsilon\varepsilon_0S}{d}$.'
        src: c15
      - kind: list
        title: Основные элементы электрической схемы
        body: |
          - источник — длинная черта «+», короткая «−» (U = const);
          - ключ;
          - провод;
          - конденсатор — две параллельные черты.
        src: c15
      - kind: rule
        title: Заряд и напряжение конденсатора
        body: 'Заряд конденсатора — заряд одной обкладки: при +7 Кл и −7 Кл $q = 7$ Кл. $q = CU_c$, где $U_c = \varphi_1 - \varphi_2$ — напряжение конденсатора. Ёмкость не зависит от q и U ($C = \frac{q}{U_c}$, но $C \sim S,\ \varepsilon,\ \frac1d$). Если конденсатор подключён к источнику, потенциалы обкладок равны потенциалам полюсов: $U_c = U$.'
        src: c15
    formulas:
      - title: Ёмкость плоского конденсатора
        tex: 'C = \frac{\varepsilon\varepsilon_0S}{d}'
        sym: [C_el, eps_d, eps0_el, S_pl, d_pl]
        boxed: true
        src: c15
      - title: Заряд конденсатора
        tex: 'q = CU_c,\qquad U_c = \varphi_1 - \varphi_2'
        sym: [q_el, C_el, U_c, phi12_el]
        boxed: true
        src: c15
      - title: Конденсатор подключён к источнику
        tex: 'U_c = \varphi_1 - \varphi_2 = U'
        sym: [U_c, phi12_el, U_volt]
        src: c15
    questions:
      - type: numeric
        cat: problem
        q: 'Площадь пластин воздушного конденсатора 100 см², расстояние между ними 1 мм. Найдите ёмкость.'
        num: { value: 8.85e-11, unit: 'Ф', check: '1*8.85e-12*0.01/0.001' }
        hint: '$C = \frac{\varepsilon\varepsilon_0S}{d}$, 100 см² = 0,01 м².'
        explain: '$C = \frac{8{,}85\cdot10^{-12}\cdot0{,}01}{0{,}001} = 8{,}85\cdot10^{-11}$ Ф.'
        f: [1]
        sol: { given: ['S = 0,01 м²', 'd = 10⁻³ м', 'ε = 1'], find: 'C', formula: 'C = \frac{\varepsilon\varepsilon_0S}{d}', calc: 'C = \frac{8{,}85\cdot10^{-12}\cdot0{,}01}{10^{-3}} = 8{,}85\cdot10^{-11}', answer: '8,85·10⁻¹¹ Ф' }
        src: c15
      - type: numeric
        cat: problem
        q: Расстояние между пластинами конденсатора уменьшили в 2 раза. Во сколько раз изменилась ёмкость?
        num: { value: 2, unit: '', check: '1/(1/2)' }
        hint: '$C \sim \frac1d$.'
        explain: Ёмкость увеличилась в 2 раза.
        f: [1]
