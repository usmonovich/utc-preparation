errata:
  - id: EL05
    page: c17
    severity: note
    original: '\(C_{об} < C_1\cdot C_2\cdot C_3\cdot\dots\cdot C_n\) (в рамке, последовательное соединение)'
    issue: 'По смыслу записано, что общая ёмкость меньше каждой из ёмкостей (в том числе наименьшей); точки, видимо, разделители. Как произведение запись неверна: например, для 2 мкФ и 3 мкФ общая ёмкость 1,2 мкФ, а произведение — 6·10⁻¹² Ф², величина другой размерности.'
    target: 'Неравенство для общей ёмкости при последовательном соединении'
    suggestion: '«\(C_{об}\) меньше наименьшей из ёмкостей \(C_1, C_2, \dots, C_n\)».'
  - id: EL06
    page: c20
    severity: error
    original: '«…если потенциалы равны, то U = 0 ⇒ C = 0»'
    issue: 'При U = 0 равен нулю заряд конденсатора: \(q = CU = 0\). Ёмкость от напряжения не зависит — это сказано на стр. c15 («C ≁ q, U»).'
    target: 'Объяснение, почему конденсатор с одинаковыми потенциалами «не работает»'
    suggestion: '«…если потенциалы равны, то U = 0 ⇒ q = 0: конденсатор не заряжается, и его можно убрать из схемы».'

topics:
  - id: cap-capacity
    title: Электроёмкость. Ёмкость шара
    pages: [c13, c14]
    theory:
      - kind: definition
        title: Электроёмкость
        body: 'Электроёмкость — это необходимый заряд для зарядки тела до потенциала 1 В: $C = \frac q\varphi$ [Кл/В] = [Ф] (фарад).'
        src: c13
      - kind: text
        title: Ёмкость шара
        body: 'Потенциал шара $\varphi = k\frac{q}{\varepsilon R} = \frac{q}{4\pi\varepsilon_0\varepsilon R}$, поэтому $C = \frac q\varphi = 4\pi\varepsilon_0\varepsilon R$. Здесь π = 3,14, $\varepsilon_0 = 8{,}85\cdot10^{-12}$ Ф/м — электрическая постоянная, ε — диэлектрическая проницаемость.'
        src: c14
      - kind: rule
        title: Формулы электростатики в среде
        body: 'В среде с диэлектрической проницаемостью ε во все формулы входит ε: $F_к = k\frac{q_1q_2}{\varepsilon R^2}$, $E = k\frac{q}{\varepsilon R^2}$, $W_п = k\frac{q_1q_2}{\varepsilon R}$, $\varphi = k\frac{q}{\varepsilon R}$.'
        src: c14
      - kind: list
        title: Дольные единицы ёмкости
        body: |
          - 1 мкФ = $10^{-6}$ Ф;
          - 1 нФ = $10^{-9}$ Ф;
          - 1 пФ = $10^{-12}$ Ф.
        src: c14
    formulas:
      - title: Электроёмкость
        tex: 'C = \frac{q}{\varphi}'
        sym: [C_el, q_el, phi_el]
        src: c13
      - title: Ёмкость шара
        tex: 'C = \frac{q}{\varphi} = 4\pi\varepsilon_0\varepsilon R'
        sym: [C_el, eps0_el, eps_d, R_sph]
        boxed: true
        src: c14
      - title: Электрическая постоянная
        tex: '\varepsilon_0 = 8{,}85\cdot10^{-12}\ \frac{\text{Ф}}{\text{м}}'
        sym: [eps0_el]
        src: c14
      - title: Сила, напряжённость, энергия и потенциал в среде
        tex: 'F_{к} = k\frac{q_1q_2}{\varepsilon R^2},\quad E = k\frac{q}{\varepsilon R^2},\quad W_{п} = k\frac{q_1q_2}{\varepsilon R},\quad \varphi = k\frac{q}{\varepsilon R}'
        sym: [F_coul, E_el, W_el, phi_el, k_coul, q12, eps_d, r_q]
        src: c14
      - title: Дольные единицы ёмкости
        tex: '1\ \text{мкФ} = 10^{-6}\ \text{Ф},\quad 1\ \text{нФ} = 10^{-9}\ \text{Ф},\quad 1\ \text{пФ} = 10^{-12}\ \text{Ф}'
        sym: []
        src: c14
    examples:
      - title: Радиус шара ёмкостью 1 Ф (задача из конспекта)
        given: 'ε = 1, C = 1 Ф, R — ?'
        steps: ['$C = 4\pi\varepsilon_0\varepsilon R$', '$R = \frac{C}{4\pi\varepsilon_0\varepsilon} = \frac{1}{4\pi\varepsilon_0} = k$']
        answer: '$R = 9\cdot10^9$ м'
        src: c14
    questions:
      - type: numeric
        cat: problem
        q: 'Найдите ёмкость металлического шара радиусом 9 см в воздухе.'
        num: { value: 1e-11, unit: 'Ф', check: '4*Math.PI*8.85e-12*1*0.09' }
        hint: '$C = 4\pi\varepsilon_0\varepsilon R$, ε = 1.'
