subsection: osc
# Механические колебания, волны и звук — из конспекта по магнетизму (стр. e09–e15).

symbols:
  x_off: { tex: 'x', meaning: 'смещение от точки равновесия', unit: 'м', src: e09 }
  A_osc: { tex: 'A', meaning: 'амплитуда — наибольшее смещение, A = x_max', unit: 'м', src: e09 }
  l_pend: { tex: 'l', meaning: 'длина нити маятника', unit: 'м', src: e09 }
  d_ball: { tex: 'd', meaning: 'размер (диаметр) шарика маятника', unit: 'м', src: e09 }
  N_osc: { tex: 'N', meaning: 'число колебаний', unit: '', src: e10 }
  T_per: { tex: 'T', meaning: 'период колебаний', unit: 'с', src: e10 }
  nu_per: { tex: '\nu', meaning: 'частота колебаний (волны)', unit: 'Гц = с⁻¹', src: e10 }
  omega_per: { tex: '\omega', meaning: 'циклическая частота', unit: 'рад/с', src: e10 }
  phi_ph: { tex: '\varphi', meaning: 'фаза колебаний', unit: 'рад', src: e11 }
  phi0_ph: { tex: '\varphi_0', meaning: 'начальная фаза', unit: 'рад', src: e11 }
  v_max: { tex: '\upsilon_{max}', meaning: 'наибольшая скорость при колебаниях', unit: 'м/с', src: e10 }
  a_max: { tex: 'a_{max}', meaning: 'наибольшее ускорение при колебаниях', unit: 'м/с²', src: e10 }
  E_kin: { tex: 'E_{к}', meaning: 'кинетическая энергия колебаний', unit: 'Дж', src: e12 }
  E_pot: { tex: 'E_{п}', meaning: 'потенциальная энергия колебаний', unit: 'Дж', src: e12 }
  E_tot: { tex: 'E', meaning: 'полная механическая энергия колебаний', unit: 'Дж', src: e12 }
  v_wave: { tex: '\upsilon', meaning: 'скорость распространения волны', unit: 'м/с', src: e14 }

errata:
  - id: EM04
    page: e11
    severity: error
    original: '\(a(t) = a_{max}\cdot\cos(\omega t)\) (в рамке)'
    issue: 'Строкой выше записано \(a(t) = -A\omega^2\cos(\omega t)\), а \(a_{max} = \omega^2A\). Значит, в рамке потерян минус. Без него не выполняется \(a(x) = -\omega^2x\) с той же страницы.'
    target: 'Формула ускорения при колебаниях (в рамке)'
    suggestion: '\(a(t) = -a_{max}\cos(\omega t)\).'
  - id: EM05
    page: e11
    severity: unclear
    original: '\(\upsilon = 4\cos\left(\frac{\pi}{9} + \frac{\pi}{8}t\right)\) — первая дробь'
    issue: 'Знаменатель первой дроби читается как 9 или 5. На ответ примера (υ при фазе π/3 равна 2) это не влияет.'
    target: 'Начальная фаза в примере \(\upsilon = 4\cos(\dots)\)'
    suggestion: 'По фото это скорее \(\frac{\pi}{5}\): \(\upsilon = 4\cos\left(\frac{\pi}{5} + \frac{\pi}{8}t\right)\). На ответ примера (υ = 2 при фазе π/3) это не влияет.'
    todo: 'Сверьте цифру с тетрадью.'
  - id: EM06
    page: e14
    severity: note
    original: '«Волны на поверхности воды … — это поперечные волны» и «Механические поперечные волны распространяются только в твёрдых телах»'
    issue: 'Два утверждения на одной странице противоречат друг другу: вода не твёрдое тело. Второе утверждение относится к волнам внутри вещества; волны на поверхности жидкости — особый случай (частицы воды движутся и вверх-вниз, и вперёд-назад).'
    target: 'Два утверждения о поперечных волнах на одной странице'
    suggestion: 'Записать второе утверждение так: «внутри вещества механические поперечные волны распространяются только в твёрдых телах; волны на поверхности воды — особый случай».'
  - id: EM07
    page: e15
    severity: note
    original: 'υ = 1340 м/с — вода'
    issue: Для скорости звука в воде обычно приводят около 1450–1500 м/с (зависит от температуры).
    target: 'Скорость звука в воде'
    suggestion: 'Записать ≈ 1450–1500 м/с (по справочным данным; зависит от температуры).'
    todo: 'Значение не из конспекта. Если на занятии называли 1340 м/с — «Оставить как в конспекте». В задачах приложения скорость звука в воде не используется.'

topics:
  - id: mosc-basics
    title: Механические колебания. Период и частота
    pages: [e09, e10]
    theory:
      - kind: definition
        title: Механические колебания
        body: Движение, которое происходит периодическим образом вокруг точки равновесия, называется механическими колебаниями.
        src: e09
      - kind: definition
        title: Гармонические колебания
        body: Колебания, где параметры меняются по закону синуса или косинуса, называются гармоническими колебаниями.
        src: e09
      - kind: rule
        title: Математический маятник
        body: 'Нить длиной $l$ с шариком размером $d$: $l \gg d$, масса нити много меньше массы шарика ($m_н \ll m_ш$). O — точка равновесия. $x$ — смещение, $x_{max} = A$ — амплитуда. В крайней точке A скорость $\upsilon = 0$, по пути $\upsilon \ne 0$.'
        src: e09
        fig: pendulum
      - kind: rule
        title: За одно полное колебание
        body: 'Маятник проходит путь A → O → A → O → A: перемещение $\vec S = 0$, путь $L = 4A$.'
        src: e10
      - kind: text
        title: Период, частота, циклическая частота
        body: '$T = \frac tN$ — период колебаний [с]; $\nu = \frac Nt$ — частота колебаний [Гц], [с⁻¹]; $\omega = \frac\varphi t$ — циклическая частота [рад/с]. Связь: $T = \frac1\nu$, $\nu = \frac1T$, $\omega = 2\pi\nu$, $\omega = \frac{2\pi}{T}$.'
        src: e10
    formulas:
      - title: Перемещение за полное колебание
        tex: '\vec S = 0'
        sym: [S]
        boxed: true
        src: e10
      - title: Путь за полное колебание
        tex: 'L = 4A'
        sym: [L_path, A_osc]
        boxed: true
        src: e10
      - title: Период
        tex: 'T = \frac{t}{N}'
        sym: [T_per, t, N_osc]
        src: e10
      - title: Частота
        tex: '\nu = \frac{N}{t}'
        sym: [nu_per, N_osc, t]
        src: e10
      - title: Циклическая частота
        tex: '\omega = \frac{\varphi}{t}'
        sym: [omega_per, phi_ph, t]
        src: e10
      - title: Период и частота
        tex: 'T = \frac{1}{\nu},\qquad \nu = \frac{1}{T}'
        sym: [T_per, nu_per]
        boxed: true
        src: e10
      - title: Циклическая частота через ν и T
        tex: '\omega = 2\pi\nu,\qquad \omega = \frac{2\pi}{T}'
        sym: [omega_per, nu_per, T_per]
        boxed: true
        src: e10
    examples:
      - title: Чтение уравнений колебаний
        steps:
          - '$x = 5\sin\left(\frac\pi2t\right)$: $\omega = \frac\pi2$, $x_{max} = A = 5$'
          - '$\upsilon = 14\cos(2\pi t)$: $\omega = 2\pi$, $\upsilon_{max} = 14$'
          - '$I = 10^{-4}\sin\left(\frac\pi8 + \frac\pi6t\right)$: $\omega = \frac\pi6$, $I_{max} = 10^{-4}$'
          - '$a = 4\sin\left(\frac\pi2t\right)$, при $t = 2$: $a = 4\sin\pi = 0$'
        src: e10
    questions:
      - type: numeric
        cat: problem
        q: Маятник совершил 20 колебаний за 40 с. Найдите период.
        num: { value: 2, unit: 'с', check: '40/20' }
        hint: '$T = \frac tN$.'
        explain: Период — время одного колебания.
        f: [3]
        sol: { given: ['N = 20', 't = 40 с'], find: 'T', formula: 'T = \frac{t}{N}', calc: 'T = \frac{40}{20} = 2', answer: '2 с' }
        src: e10
      - type: numeric
        cat: problem
        q: Тело совершает 30 колебаний за 10 с. Найдите частоту.
        num: { value: 3, unit: 'Гц', check: '30/10' }
        hint: '$\nu = \frac Nt$.'
        explain: Частота — число колебаний за 1 с.
        f: [4]
        sol: { given: ['N = 30', 't = 10 с'], find: 'ν', formula: '\nu = \frac{N}{t}', calc: '\nu = \frac{30}{10} = 3', answer: '3 Гц' }
        src: e10
      - type: numeric
        cat: problem
        q: Амплитуда колебаний 5 см. Какой путь проходит тело за одно полное колебание (в см)?
        num: { value: 20, unit: 'см', check: '4*5' }
        hint: 'В конспекте: $L = 4A$.'
        explain: 'За полное колебание тело проходит A → O → A → O → A, то есть четыре амплитуды.'
        f: [2]
        sol: { given: ['A = 5 см'], find: 'L', formula: 'L = 4A', calc: 'L = 4\cdot5 = 20', answer: '20 см' }
        src: e10
      - type: single
        cat: theory
        q: Чему равно перемещение тела за одно полное колебание?
        opts: ['Нулю', 'Амплитуде A', 'Двум амплитудам', 'Четырём амплитудам']
        ans: a
        hint: После полного колебания тело возвращается в ту же точку.
        explain: 'За полное колебание $\vec S = 0$, а путь $L = 4A$.'
        f: [1]
        src: e10
      - type: numeric
        cat: problem
        q: Период колебаний 0,5 с. Найдите циклическую частоту.
        num: { value: 12.566, unit: 'рад/с', check: '2*Math.PI/0.5' }
        hint: '$\omega = \frac{2\pi}{T}$.'
        explain: '$\omega = \frac{2\pi}{0{,}5} = 4\pi \approx 12{,}57$ рад/с.'
        f: [7]
        sol: { given: ['T = 0,5 с'], find: 'ω', formula: '\omega = \frac{2\pi}{T}', calc: '\omega = \frac{2\pi}{0{,}5} = 4\pi \approx 12{,}57', answer: '≈ 12,57 рад/с' }
        src: e10
      - type: numeric
        cat: problem
        q: Частота колебаний 4 Гц. Найдите период.
        num: { value: 0.25, unit: 'с', check: '1/4' }
        hint: '$T = \frac1\nu$.'
        explain: Период и частота — взаимно обратные величины.
        f: [6]
        sol: { given: ['ν = 4 Гц'], find: 'T', formula: 'T = \frac{1}{\nu}', calc: 'T = \frac14 = 0{,}25', answer: '0,25 с' }
        src: e10
      - type: single
        cat: formula
        q: 'Чему равна циклическая частота в уравнении $x = 5\sin\left(\frac\pi2t\right)$?'
        opts: ['$\frac\pi2$ рад/с', '5 рад/с', '$2\pi$ рад/с', '$\frac\pi4$ рад/с']
        ans: a
        hint: 'Циклическая частота стоит множителем при $t$ под синусом.'
        explain: 'В уравнении $x = A\sin(\omega t)$: $\omega = \frac\pi2$, а 5 — это амплитуда.'
        src: e10
      - type: numeric
        cat: problem
        q: 'Ускорение меняется по закону $a = 4\sin\left(\frac\pi2t\right)$. Найдите $a$ при $t = 1$ с.'
        num: { value: 4, unit: 'м/с²', check: '4*Math.sin(Math.PI/2*1)' }
        hint: 'Подставьте $t = 1$: под синусом будет $\frac\pi2$.'
        explain: '$a = 4\sin\frac\pi2 = 4\cdot1 = 4$. Для сравнения в конспекте: при $t = 2$ получается $a = 0$.'
        sol: { given: ['a = 4sin(πt/2)', 't = 1 с'], find: 'a', calc: 'a = 4\sin\frac{\pi}{2} = 4', answer: '4 м/с²' }
        src: e10
      - type: numeric
        cat: problem
        q: 'Скорость меняется по закону $\upsilon = 14\cos(2\pi t)$. Найдите частоту колебаний.'
        num: { value: 1, unit: 'Гц', check: '(2*Math.PI)/(2*Math.PI)' }
        hint: 'Сначала $\omega$ из уравнения, потом $\nu = \frac{\omega}{2\pi}$.'
        explain: '$\omega = 2\pi$, значит $\nu = 1$ Гц.'
        f: [7]
        sol: { given: ['υ = 14cos(2πt)'], find: 'ν', formula: '\omega = 2\pi\nu', calc: '\nu = \frac{2\pi}{2\pi} = 1', answer: '1 Гц' }
        src: e10
      - type: single
        cat: theory
        q: Какие колебания называются гармоническими?
        opts: ['Колебания, где параметры меняются по закону синуса или косинуса', 'Любые колебания маятника', 'Колебания с уменьшающейся амплитудой', 'Колебания под действием внешней силы']
        ans: a
        hint: Определение — сразу после определения механических колебаний.
        explain: Колебания, где параметры меняются по закону синуса или косинуса, называются гармоническими.
        src: e09
      - type: multiple
        cat: theory
        q: Какие условия математического маятника записаны в конспекте? Выберите все.
        opts: ['Длина нити много больше размера шарика', 'Масса нити много меньше массы шарика', 'Шарик заряжен', 'Нить растягивается']
        ans: [a, b]
        hint: 'В конспекте: $l \gg d$, $m_н \ll m_ш$.'
        explain: 'Математический маятник: $l \gg d$ и $m_н \ll m_ш$.'
        src: e09

# ───────────────────────────────────────────────────────────────
  - id: mosc-eq
    title: Уравнения гармонических колебаний
    pages: [e10, e11]
    theory:
      - kind: text
        title: ① Колебания начинаются из точки равновесия
        body: '$x(t) = A\sin(\omega t)$; $\upsilon(t) = A\omega\cos(\omega t) = \upsilon_{max}\cos(\omega t)$; $a(t) = -A\omega^2\sin(\omega t) = -a_{max}\sin(\omega t)$.'
        src: e10
      - kind: text
        title: ② Тело вывели из равновесия и отпустили
        body: '$x(t) = A\cos(\omega t)$; $\upsilon(t) = -A\omega\sin(\omega t) = -\upsilon_{max}\sin(\omega t)$; $a(t) = -A\omega^2\cos(\omega t)$. На графике $x = A\cos\omega t$ период T — расстояние между соседними максимумами.'
        src: [e11, e13]
        errata: [EM04]
        fig: osc-graph
      - kind: text
        title: ③ Вывели из равновесия и дали толчок
        body: '$x(t) = A\sin(\omega t + \varphi_0)$; $\varphi(t) = \omega t + \varphi_0$ — фаза; $\varphi_0$ — начальная фаза.'
        src: e11
      - kind: rule
        title: Наибольшие значения
        body: '$\upsilon_{max} = \omega A$, $a_{max} = \omega^2A$; при любом начале $a(x) = -\omega^2x$.'
        src: [e10, e11]
    formulas:
      - title: Смещение (из точки равновесия)
        tex: 'x(t) = A\sin(\omega t)'
        sym: [x_off, A_osc, omega_per, t]
        boxed: true
        src: e10
      - title: Скорость (из точки равновесия)
        tex: '\upsilon(t) = A\omega\cos(\omega t) = \upsilon_{max}\cos(\omega t)'
        sym: [v, A_osc, omega_per, v_max]
        boxed: true
        src: e10
      - title: Ускорение (из точки равновесия)
        tex: 'a(t) = -A\omega^2\sin(\omega t) = -a_{max}\sin(\omega t)'
        sym: [a, A_osc, omega_per, a_max]
        boxed: true
        src: e10
      - title: Наибольшая скорость и ускорение
        tex: '\upsilon_{max} = \omega A,\qquad a_{max} = \omega^2A'
        sym: [v_max, a_max, omega_per, A_osc]
        boxed: true
        src: e10
      - title: Ускорение через смещение
        tex: 'a(x) = -\omega^2x'
        sym: [a, omega_per, x_off]
        boxed: true
        src: e10
      - title: Смещение (отвели и отпустили)
        tex: 'x(t) = A\cos(\omega t)'
        sym: [x_off, A_osc, omega_per, t]
        boxed: true
        src: e11
      - title: Скорость (отвели и отпустили)
        tex: '\upsilon(t) = -A\omega\sin(\omega t) = -\upsilon_{max}\sin(\omega t)'
        sym: [v, A_osc, omega_per, v_max]
        boxed: true
        src: e11
      - title: Ускорение (отвели и отпустили)
        tex: 'a(t) = -A\omega^2\cos(\omega t)'
        sym: [a, A_osc, omega_per]
        src: e11
      - title: Ускорение (как в рамке конспекта)
        tex: 'a(t) = a_{max}\cos(\omega t)'
        sym: [a, a_max, omega_per]
        boxed: true
        src: e11
        errata: [EM04]
      - title: Смещение (отвели и толкнули)
        tex: 'x(t) = A\sin(\omega t + \varphi_0)'
        sym: [x_off, A_osc, omega_per, phi0_ph]
        boxed: true
        src: e11
      - title: Фаза
        tex: '\varphi(t) = \omega t + \varphi_0'
        sym: [phi_ph, omega_per, phi0_ph]
        boxed: true
        src: e11
    examples:
      - title: Скорость при заданной фазе
        given: 'Скорость меняется по закону косинуса с амплитудой 4; найти υ при фазе $\frac\pi3$'
        steps: ['$\upsilon = 4\cos\frac\pi3 = 4\cdot\frac12 = 2$']
        answer: '$\upsilon = 2$'
        src: e11
        errata: [EM05]
    questions:
      - type: numeric
        cat: problem
        q: 'Амплитуда колебаний 0,1 м, циклическая частота 10 рад/с. Найдите наибольшую скорость.'
        num: { value: 1, unit: 'м/с', check: '10*0.1' }
        hint: '$\upsilon_{max} = \omega A$.'
        explain: '$\upsilon_{max} = 10\cdot0{,}1 = 1$ м/с.'
        f: [4]
        sol: { given: ['A = 0,1 м', 'ω = 10 рад/с'], find: 'υ_max', formula: '\upsilon_{max} = \omega A', calc: '\upsilon_{max} = 10\cdot0{,}1 = 1', answer: '1 м/с' }
        src: e10
      - type: numeric
        cat: problem
        q: 'Амплитуда 0,1 м, циклическая частота 10 рад/с. Найдите наибольшее ускорение.'
        num: { value: 10, unit: 'м/с²', check: '10**2*0.1' }
        hint: '$a_{max} = \omega^2A$.'
        explain: '$a_{max} = 100\cdot0{,}1 = 10$ м/с².'
        f: [4]
        sol: { given: ['A = 0,1 м', 'ω = 10 рад/с'], find: 'a_max', formula: 'a_{max} = \omega^2A', calc: 'a_{max} = 10^2\cdot0{,}1 = 10', answer: '10 м/с²' }
        src: e10
      - type: numeric
        cat: problem
        q: 'Циклическая частота 5 рад/с. Чему равно ускорение тела при смещении $x = 0{,}02$ м?'
        num: { value: -0.5, unit: 'м/с²', check: '-(5**2)*0.02' }
        hint: '$a(x) = -\omega^2x$ — не забудьте знак.'
        explain: '$a = -25\cdot0{,}02 = -0{,}5$ м/с²: ускорение направлено к точке равновесия.'
        f: [5]
        sol: { given: ['ω = 5 рад/с', 'x = 0,02 м'], find: 'a', formula: 'a = -\omega^2x', calc: 'a = -25\cdot0{,}02 = -0{,}5', answer: '−0,5 м/с²' }
        src: e10
      - type: numeric
        cat: problem
        q: 'Скорость меняется по закону $\upsilon = 6\cos\varphi$. Найдите скорость при фазе $\varphi = \frac\pi3$.'
        num: { value: 3, unit: 'м/с', check: '6*Math.cos(Math.PI/3)' }
        hint: '$\cos\frac\pi3 = \frac12$.'
        explain: 'Как в примере конспекта: подставляем фазу целиком, $\upsilon = 6\cdot\frac12 = 3$.'
        sol: { given: ['υ = 6cos φ', 'φ = π/3'], find: 'υ', calc: '\upsilon = 6\cos\frac{\pi}{3} = 3', answer: '3 м/с' }
        src: e11
      - type: numeric
        cat: problem
        q: '$x = 0{,}2\sin\left(\frac\pi2t + \frac\pi6\right)$. Найдите фазу колебаний при $t = 1$ с (в радианах).'
        num: { value: 2.0944, unit: 'рад', check: 'Math.PI/2*1+Math.PI/6' }
        hint: '$\varphi = \omega t + \varphi_0$.'
        explain: '$\varphi = \frac\pi2 + \frac\pi6 = \frac{2\pi}{3} \approx 2{,}09$ рад.'
        f: [11]
        sol: { given: ['ω = π/2 рад/с', 'φ₀ = π/6', 't = 1 с'], find: 'φ', formula: '\varphi = \omega t + \varphi_0', calc: '\varphi = \frac{\pi}{2} + \frac{\pi}{6} = \frac{2\pi}{3} \approx 2{,}09', answer: '2π/3 ≈ 2,09 рад' }
        src: e11
      - type: single
        cat: formula
        q: Тело отвели из положения равновесия и отпустили. Какое уравнение описывает смещение?
        opts: ['$x = A\cos(\omega t)$', '$x = A\sin(\omega t)$', '$x = A\sin(\omega t + \varphi_0)$', '$x = -A\omega^2\cos(\omega t)$']
        ans: a
        hint: 'В момент $t = 0$ смещение должно быть равно $A$.'
        explain: 'Случай ②: $x(t) = A\cos(\omega t)$, при $t = 0$ получается $x = A$.'
        f: [6]
        src: e11
      - type: single
        cat: formula
        q: Колебания начинаются из точки равновесия. Какое уравнение смещения?
        opts: ['$x = A\sin(\omega t)$', '$x = A\cos(\omega t)$', '$x = \omega A\cos(\omega t)$', '$x = -\omega^2A$']
        ans: a
        hint: 'При $t = 0$ смещение равно нулю.'
        explain: 'Случай ①: $x(t) = A\sin(\omega t)$, $\sin0 = 0$.'
        f: [1]
        src: e10
      - type: single
        cat: formula
        q: 'Что означает минус в формуле $a(x) = -\omega^2x$?'
        opts: ['Ускорение направлено противоположно смещению, к точке равновесия', 'Ускорение всегда отрицательное число', 'Тело тормозит всё время', 'Смещение отрицательно']
        ans: a
        hint: 'Знак $a$ всегда противоположен знаку $x$.'
        explain: 'При $x > 0$ получается $a < 0$, при $x < 0$ — $a > 0$: ускорение возвращает тело к точке O.'
        f: [5]
