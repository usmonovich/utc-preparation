# ───────────────────────────────────────────────────────────────
  - id: mosc-energy
    title: Энергия колебаний
    pages: [e12, e13]
    theory:
      - kind: law
        title: Сохранение энергии колебаний
        body: Если в колебательной системе отсутствуют сила трения либо сила сопротивления, то полная механическая энергия колебания сохраняется.
        src: e12
      - kind: rule
        title: Превращение энергии
        body: 'В крайней точке A: $E_к \to 0$, $E_п \to \max$. В точке равновесия O: $E_к \to \max$, $E_п \to 0$. $E_{к\,max} = E_{п\,max} = E = \text{const}$ — для обоих маятников.'
        src: e12
        fig: pend-energy
      - kind: text
        title: Энергия во времени
        body: '$E_к(t) = \frac{m\upsilon_{max}^2}{2}\cos^2\omega t = E_{к\,max}\cos^2\omega t = \frac12E_{к\,max}(1 + \cos2\omega t)$; $E_п(t) = \frac{kA^2}{2}\sin^2\omega t = E_{п\,max}\sin^2\omega t = \frac12E_{к\,max}(1 - \cos2\omega t)$; $E_{п\,max} = \frac{kA^2}{2}$.'
        src: e12
      - kind: rule
        title: Удвоенная частота
        body: И в пружинном, и в математическом маятнике кинетическая (потенциальная) энергия тоже меняется гармоническим образом, но частота этих колебаний в два раза больше, чем частота колебаний самой системы.
        src: [e12, e13]
    formulas:
      - title: Кинетическая энергия во времени
        tex: 'E_{к}(t) = \frac{m\upsilon_{max}^2}{2}\cos^2\omega t = E_{к\,max}\cos^2\omega t'
        sym: [E_kin, m, v_max, omega_per]
        boxed: true
        src: e12
      - title: Кинетическая энергия через cos 2ωt
        tex: 'E_{к}(t) = \frac12E_{к\,max}(1 + \cos2\omega t)'
        sym: [E_kin, omega_per]
        boxed: true
        src: e12
      - title: Сохранение энергии
        tex: 'E_{к\,max} = E_{п\,max} = E = \text{const}'
        sym: [E_kin, E_pot, E_tot]
        boxed: true
        src: e12
      - title: Потенциальная энергия во времени
        tex: 'E_{п}(t) = \frac{kA^2}{2}\sin^2\omega t = E_{п\,max}\sin^2\omega t'
        sym: [E_pot, k, A_osc, omega_per]
        boxed: true
        src: e12
      - title: Потенциальная энергия через cos 2ωt
        tex: 'E_{п}(t) = \frac12E_{к\,max}(1 - \cos2\omega t)'
        sym: [E_pot, E_kin, omega_per]
        boxed: true
        src: e12
      - title: Наибольшая потенциальная энергия пружинного маятника
        tex: 'E_{п\,max} = \frac{kA^2}{2}'
        sym: [E_pot, k, A_osc]
        boxed: true
        src: e12
    questions:
      - type: numeric
        cat: problem
        q: 'Пружина жёсткостью 200 Н/м, амплитуда 0,1 м. Найдите наибольшую потенциальную энергию.'
        num: { value: 1, unit: 'Дж', check: '200*0.1**2/2' }
        hint: '$E_{п\,max} = \frac{kA^2}{2}$.'
        explain: '$E = \frac{200\cdot0{,}01}{2} = 1$ Дж.'
        f: [6]
        sol: { given: ['k = 200 Н/м', 'A = 0,1 м'], find: 'E_п max', formula: 'E_{п\,max} = \frac{kA^2}{2}', calc: 'E = \frac{200\cdot0{,}01}{2} = 1', answer: '1 Дж' }
        src: e12
      - type: numeric
        cat: problem
        q: 'Масса шарика 0,2 кг, наибольшая скорость 3 м/с. Найдите наибольшую кинетическую энергию.'
        num: { value: 0.9, unit: 'Дж', check: '0.2*3**2/2' }
        hint: '$E_{к\,max} = \frac{m\upsilon_{max}^2}{2}$.'
        explain: '$E = \frac{0{,}2\cdot9}{2} = 0{,}9$ Дж.'
        f: [1]
        sol: { given: ['m = 0,2 кг', 'υ_max = 3 м/с'], find: 'E_к max', formula: 'E_{к\,max} = \frac{m\upsilon_{max}^2}{2}', calc: 'E = \frac{0{,}2\cdot9}{2} = 0{,}9', answer: '0,9 Дж' }
        src: e12
      - type: numeric
        cat: problem
        q: Полная энергия колебаний 2 Дж. В некоторый момент потенциальная энергия 0,5 Дж. Найдите кинетическую энергию.
        num: { value: 1.5, unit: 'Дж', check: '2-0.5' }
        hint: Без трения полная энергия сохраняется.
        explain: '$E_к = E - E_п = 2 - 0{,}5 = 1{,}5$ Дж.'
        f: [3]
        sol: { given: ['E = 2 Дж', 'E_п = 0,5 Дж'], find: 'E_к', calc: 'E_{к} = 2 - 0{,}5 = 1{,}5', answer: '1,5 Дж' }
        src: e12
      - type: numeric
        cat: problem
        q: Период колебаний маятника 2 с. С каким периодом меняется его кинетическая энергия?
        num: { value: 1, unit: 'с', check: '2/2' }
        hint: Частота колебаний энергии в два раза больше частоты системы.
        explain: 'Частота вдвое больше — период вдвое меньше: 1 с.'
        f: [2]
        sol: { given: ['T = 2 с'], find: 'T_E', calc: 'T_E = \frac{T}{2} = 1', answer: '1 с' }
        src: [e12, e13]
      - type: numeric
        cat: problem
        q: Частота колебаний пружинного маятника 3 Гц. С какой частотой меняется его потенциальная энергия?
        num: { value: 6, unit: 'Гц', check: '2*3' }
        hint: 'В формуле стоит $\cos2\omega t$.'
        explain: 'Частота колебаний энергии в два раза больше: 6 Гц.'
        f: [5]
        sol: { given: ['ν = 3 Гц'], find: 'ν_E', calc: '\nu_E = 2\cdot3 = 6', answer: '6 Гц' }
        src: [e12, e13]
      - type: numeric
        cat: problem
        q: '$E_{к\,max} = 4$ Дж. Найдите кинетическую энергию в момент, когда $\omega t = \frac\pi3$.'
        num: { value: 1, unit: 'Дж', check: '4*Math.cos(Math.PI/3)**2' }
        hint: '$E_к = E_{к\,max}\cos^2\omega t$, $\cos\frac\pi3 = \frac12$.'
        explain: '$E_к = 4\cdot\frac14 = 1$ Дж.'
        f: [1]
        sol: { given: ['E_к max = 4 Дж', 'ωt = π/3'], find: 'E_к', formula: 'E_{к} = E_{к\,max}\cos^2\omega t', calc: 'E_{к} = 4\cdot\left(\tfrac12\right)^2 = 1', answer: '1 Дж' }
        src: e12
      - type: single
        cat: theory
        q: Какая энергия у маятника в крайней точке A?
        opts: ['Кинетическая → 0, потенциальная → max', 'Кинетическая → max, потенциальная → 0', 'Обе равны нулю', 'Обе максимальны']
        ans: a
        hint: В крайней точке скорость равна нулю.
        explain: 'В точке A: $E_к \to 0$, $E_п \to \max$; в точке O — наоборот.'
        src: e12
      - type: single
        cat: theory
        q: При каком условии полная механическая энергия колебаний сохраняется?
        opts: ['Если нет силы трения и силы сопротивления', 'Если амплитуда большая', 'Только для пружинного маятника', 'Всегда']
        ans: a
        hint: Первая фраза темы «Энергия колебания».
        explain: Если в колебательной системе отсутствуют сила трения либо сила сопротивления, то полная механическая энергия колебания сохраняется.
        src: e12

# ───────────────────────────────────────────────────────────────
  - id: waves
    title: Волны. Длина волны
    pages: [e13, e14]
    theory:
      - kind: definition
        title: Волны
        body: Колебания, которые распространяются в одном направлении или по всему пространству, называются волнами. Волна бывает двух типов — поперечная и продольная.
        src: e13
      - kind: definition
        title: Поперечная волна
        body: 'Если направление распространения волны и плоскость колебания волны перпендикулярны, то эта волна называется поперечной. Волны на поверхности воды и электромагнитные волны — поперечные. На рисунке конспекта волна идёт вправо: точки перед гребнем движутся вверх, за гребнем — вниз.'
        src: [e13, e14]
        errata: [EM06]
        fig: wave-trans
      - kind: definition
        title: Продольная волна
        body: Если направление распространения и плоскость колебания волны параллельны, то эта волна называется продольной. Все звуковые волны — продольные.
        src: [e13, e14]
        fig: wave-long
      - kind: definition
        title: Длина волны
        body: 'Путь, пройденный за одно полное колебание, называется длиной волны: $\lambda = \upsilon T = \frac\upsilon\nu$.'
        src: e14
      - kind: rule
        title: Где распространяются механические волны
        body: Механические поперечные волны распространяются только в твёрдых телах. Механические продольные волны распространяются во всех средах.
        src: e14
        errata: [EM06]
      - kind: rule
        title: Переход в другую среду
        body: Скорость распространения и длина волны зависят от среды, а частота не зависит. Когда волна переходит из одной среды в другую, скорость распространения и длина волны меняются, а частота не меняется.
        src: e14
    formulas:
      - title: Длина волны через период
        tex: '\lambda = \upsilon\cdot T'
        sym: [lambda_w, v_wave, T_per]
        boxed: true
        src: e14
      - title: Длина волны через частоту
        tex: '\lambda = \frac{\upsilon}{\nu}'
        sym: [lambda_w, v_wave, nu_per]
        boxed: true
        src: e14
    examples:
      - title: Расстояние между пиками
        given: 'Между 2-м и 4-м пиком волны 30 м'
        steps: ['Между 2-м и 4-м пиком укладываются две длины волны: $2\lambda = 30$', '$\lambda = 15$ м']
        answer: '$\lambda = 15$ м'
        src: e14
    questions:
      - type: numeric
        cat: problem
        q: 'Волна идёт со скоростью 340 м/с, частота 170 Гц. Найдите длину волны.'
        num: { value: 2, unit: 'м', check: '340/170' }
        hint: '$\lambda = \frac\upsilon\nu$.'
        explain: '$\lambda = \frac{340}{170} = 2$ м.'
        f: [2]
        sol: { given: ['υ = 340 м/с', 'ν = 170 Гц'], find: 'λ', formula: '\lambda = \frac{\upsilon}{\nu}', calc: '\lambda = \frac{340}{170} = 2', answer: '2 м' }
        src: e14
      - type: numeric
        cat: problem
        q: Длина волны 3 м, период 0,01 с. Найдите скорость волны.
        num: { value: 300, unit: 'м/с', check: '3/0.01' }
        hint: 'Из $\lambda = \upsilon T$: $\upsilon = \frac\lambda T$.'
        explain: '$\upsilon = \frac{3}{0{,}01} = 300$ м/с.'
        f: [1]
        sol: { given: ['λ = 3 м', 'T = 0,01 с'], find: 'υ', formula: '\upsilon = \frac{\lambda}{T}', calc: '\upsilon = \frac{3}{0{,}01} = 300', answer: '300 м/с' }
        src: e14
      - type: numeric
