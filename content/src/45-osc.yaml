        ans: a
        hint: '$\varphi = \omega t + \varphi_0$ — это фаза; при $t = 0$ остаётся…'
        explain: '$\varphi_0$ — начальная фаза, фаза в момент $t = 0$.'
        f: [11]
        src: e11

