subsection: nucl

symbols:
  A_mass: { tex: 'A', meaning: 'массовое число — количество нуклонов в ядре (в конспекте также «атомная масса», см. AT03)', unit: '—', src: a03 }
  Z_ch: { tex: 'Z', meaning: 'зарядовое число — количество протонов, порядковый номер элемента', unit: '—', src: a03 }
  N_p: { tex: 'N_p', meaning: 'количество протонов в ядре', unit: '—', src: a03 }
  N_n: { tex: 'N_n', meaning: 'количество нейтронов в ядре', unit: '—', src: a03 }
  m_pr: { tex: 'm_p', meaning: 'масса протона, 1,67·10⁻²⁷ кг ≈ 1 а.е.м.', unit: 'кг', src: a03 }
  m_nt: { tex: 'm_n', meaning: 'масса нейтрона, 1,68·10⁻²⁷ кг ≈ 1 а.е.м.', unit: 'кг', src: a03 }
  q_pr: { tex: 'q_p', meaning: 'заряд протона, 1,6·10⁻¹⁹ Кл = 1e', unit: 'Кл', src: a03 }
  q_ion: { tex: 'q', meaning: 'заряд атома (иона): число протонов минус число электронов, умноженное на e', unit: 'Кл (или в единицах e)', src: a04 }
  E_bind: { tex: 'E_{связи}', meaning: 'энергия связи ядра', unit: 'Дж (в задачах — эВ, МэВ)', src: a05 }
  dm_def: { tex: '\Delta m', meaning: 'дефект массы — на сколько масса ядра меньше суммы масс его нуклонов', unit: 'кг (или а.е.м.)', src: a05 }
  m_nuc: { tex: 'm_{ядра}', meaning: 'масса ядра', unit: 'кг', src: a05 }
  eps_bind: { tex: '\varepsilon', meaning: 'удельная энергия связи — энергия связи на один нуклон', unit: 'эВ/нуклон', src: a05 }
  c_vac: { tex: 'c', meaning: 'скорость света в вакууме, 3·10⁸ м/с', unit: 'м/с', src: a05 }

errata:
  - id: AT03
    page: a03
    severity: note
    original: '«A — количество нуклонов \((N_p + N_n)\); атомная масса»'
    issue: 'A — целое число нуклонов, его называют массовым числом. Атомная масса — масса атома в а.е.м.; она близка к A, но не равна ему (у ядра есть дефект массы, у атома — ещё и электроны).'
    target: 'Название числа A в записи ядра \(^A_ZX\)'
    suggestion: '«A — массовое число (количество нуклонов \(N_p + N_n\)); масса ядра приблизительно равна A а.е.м.».'
  - id: AT04
    page: a04
    severity: typo
    original: '\(^{59}_{27}Co\), \(^{59}_{28}N\) — изобары'
    issue: 'Элемент с Z = 28 — никель, его символ Ni. Символ N — азот (Z = 7).'
    target: 'Пример изобар'
    suggestion: '\(^{59}_{27}Co\) и \(^{59}_{28}Ni\) — изобары.'
  - id: AT05
    page: a04
    severity: unclear
    original: 'Рисунок \(^{11}_5B\), \(q = -2e\) — вокруг ядра нарисованы 2 электрона'
    issue: 'У бора 5 протонов. При заряде −2e электронов должно быть 5 + 2 = 7. На рисунке видны только два — похоже, рисунок не закончен.'
    target: 'Рисунок иона бора на стр. a04'
    suggestion: 'Дорисовать электроны: у иона \(^{11}_5B\) с \(q = -2e\) их 7. В вопросах приложения используется именно 7.'
  - id: AT06
    page: a05
    severity: note
    original: '«Удельная энергия связи — это необходимая энергия для того, чтобы отделить один нуклон от ядра, или энергия связи одного нуклона»'
    issue: 'По формуле конспекта \(\varepsilon = \frac{E_{связи}}{A}\) удельная энергия связи — средняя энергия связи, приходящаяся на один нуклон. Энергия, нужная, чтобы оторвать один конкретный нуклон, бывает другой.'
    target: 'Определение удельной энергии связи'
    suggestion: '«Удельная энергия связи — энергия связи, приходящаяся в среднем на один нуклон: \(\varepsilon = \frac{E_{связи}}{A}\)».'

topics:
  - id: nuc-composition
    title: Состав атомного ядра
    pages: [a03]
    theory:
      - kind: definition
        title: Нуклоны
        body: |
          Ядро состоит из нуклонов: протонов (p) и нейтронов (n).
          - Протон: $m_p = 1{,}67\cdot10^{-27}$ кг $= 1$ а.е.м., $q_p = 1{,}6\cdot10^{-19}$ Кл $= 1e$.
          - Нейтрон: $m_n = 1{,}68\cdot10^{-27}$ кг $= 1$ а.е.м., $q_n = 0$.
        src: a03
      - kind: definition
        title: Запись ядра $^A_ZX$
        body: |
          - A — количество нуклонов ($N_p + N_n$); в конспекте также «атомная масса» (см. AT03).
          - Z — количество зарядов; количество протонов; порядковый номер.
          - Число нейтронов: $N_n = A - Z$.
        src: a03
        errata: [AT03]
      - kind: text
        title: Примеры из конспекта
        body: |
          - Ядро из 3 протонов и 4 нейтронов: $m = 7$ а.е.м., $q = 3e$.
          - $^{39}_{19}K$: 39 нуклонов — 19 протонов и 20 нейтронов.
        src: a03
    formulas:
      - title: Массовое число
        tex: 'A = N_p + N_n'
        sym: [A_mass, N_p, N_n]
        src: a03
      - title: Число протонов и нейтронов
        tex: 'N_p = Z,\qquad N_n = A - Z'
        sym: [N_p, Z_ch, N_n, A_mass]
        src: a03
      - title: Масса и заряд протона
        tex: 'm_p = 1{,}67\cdot10^{-27}\ \text{кг} = 1\ \text{а.е.м.},\qquad q_p = 1{,}6\cdot10^{-19}\ \text{Кл} = 1e'
        sym: [m_pr, q_pr]
        src: a03
      - title: Масса и заряд нейтрона
        tex: 'm_n = 1{,}68\cdot10^{-27}\ \text{кг} = 1\ \text{а.е.м.},\qquad q_n = 0'
        sym: [m_nt]
        src: a03
    questions:
      - type: single
        cat: theory
        q: Из каких частиц состоит атомное ядро?
        opts: ['Из протонов и нейтронов', 'Из протонов и электронов', 'Из электронов и нейтронов', 'Только из протонов']
        ans: a
        hint: Их общее название — нуклоны.
        explain: Нуклоны — это протоны и нейтроны.
        src: a03
      - type: single
        cat: theory
        q: Что показывает число Z в записи $^A_ZX$?
        opts: ['Количество протонов (порядковый номер)', 'Количество нейтронов', 'Количество нуклонов', 'Количество электронных орбит']
        ans: a
        hint: Z — количество зарядов в ядре.
        explain: Z — количество зарядов, количество протонов, порядковый номер.
        f: [2]
        src: a03
      - type: single
        cat: theory
        q: Что показывает число A в записи $^A_ZX$?
        opts: ['Количество нуклонов в ядре', 'Количество протонов', 'Заряд ядра', 'Количество электронов']
        ans: a
        hint: 'В конспекте: $A = N_p + N_n$.'
        explain: A — количество нуклонов (массовое число).
        f: [1]
        src: a03
      - type: numeric
        cat: problem
        q: 'Сколько нейтронов в ядре $^{39}_{19}K$?'
        num: { value: 20, unit: '', check: '39-19' }
        hint: '$N_n = A - Z$.'
        explain: '$N_n = 39 - 19 = 20$ — как и записано в конспекте.'
        f: [2]
        sol: { given: ['A = 39', 'Z = 19'], find: 'N_n', formula: 'N_n = A - Z', calc: 'N_n = 39 - 19 = 20', answer: '20' }
        src: a03
      - type: numeric
        cat: problem
        q: 'Сколько нейтронов в ядре $^{238}_{92}U$?'
        num: { value: 146, unit: '', check: '238-92' }
        hint: '$N_n = A - Z$.'
        explain: '$N_n = 238 - 92 = 146$.'
        f: [2]
        sol: { given: ['A = 238', 'Z = 92'], find: 'N_n', formula: 'N_n = A - Z', calc: 'N_n = 238 - 92 = 146', answer: '146' }
        src: a03
      - type: numeric
        cat: problem
        q: 'Ядро содержит 3 протона и 4 нейтрона. Найдите его заряд в единицах e.'
        num: { value: 3, unit: 'e', check: '3' }
        hint: Заряд несут только протоны, у нейтрона $q_n = 0$.
        explain: '$q = 3e$, масса — 7 а.е.м. (пример из конспекта).'
        f: [3, 4]
        sol: { given: ['N_p = 3', 'N_n = 4'], find: 'q', formula: 'q = N_p\cdot e', calc: 'q = 3e', answer: '3e' }
        src: a03
      - type: numeric
        cat: problem
        q: 'Найдите заряд ядра $^{39}_{19}K$ в кулонах ($e = 1{,}6\cdot10^{-19}$ Кл).'
        num: { value: 3.04e-18, unit: 'Кл', check: '19*1.6e-19' }
        hint: 'Заряд ядра равен $Z\cdot e$.'
        explain: '$q = 19\cdot1{,}6\cdot10^{-19} = 3{,}04\cdot10^{-18}$ Кл.'
        f: [3]
        sol: { given: ['Z = 19', 'e = 1,6·10⁻¹⁹ Кл'], find: 'q', formula: 'q = Z\cdot e', calc: 'q = 19\cdot1{,}6\cdot10^{-19} = 3{,}04\cdot10^{-18}', answer: '3,04·10⁻¹⁸ Кл' }
        src: a03
      - type: matching
        cat: formula
        q: Сопоставьте частицу и её заряд.
        pairs:
          - ['Протон', '$+1e$']
          - ['Нейтрон', '$0$']
          - ['Электрон', '$-1e$']
        hint: Нейтрон — «нейтральный».
        explain: '$q_p = 1e$, $q_n = 0$, заряд электрона $-e$.'
        f: [3, 4]
        src: a03

  - id: nuc-isotopes
    title: Изотопы, изобары, изотоны. Строение атома
    pages: [a04]
    theory:
      - kind: definition
        title: Изотопы, изобары, изотоны
        body: |
          - **Изотопы** — это ядра с одинаковым количеством протонов: $^1_1H$, $^2_1H$, $^3_1H$; $^{16}_8O$, $^{17}_8O$, $^{18}_8O$.
          - **Изобары** — это ядра с одинаковым количеством нуклонов: $^{59}_{27}Co$ и $^{59}_{28}Ni$ (в конспекте — «N», см. AT04).
          - **Изотоны** — это ядра с одинаковым количеством нейтронов: $^3_1H$ и $^4_2He$ (по 2 нейтрона).
        src: a04
        errata: [AT04]
        fig: nucleus-isotopes
      - kind: text
        title: Атомная структура и заряд атома
        body: 'Заряд атома определяется разницей между числом протонов в ядре и числом электронов: $^{17}_8O$ с 8 электронами — $q = 0$; $^{12}_6C$ с 5 электронами — $q = +e$; $^{11}_5B$ с 7 электронами — $q = -2e$ (на рисунке конспекта электроны нарисованы не все, см. AT05).'
        src: a04
        errata: [AT05]
    formulas:
      - title: Заряд атома (иона)
        tex: 'q = (N_p - N_e)\cdot e'
        sym: [q_ion, N_p, N_el, e_el]
        src: a04
    questions:
      - type: single
        cat: theory
        q: Что такое изотопы?
        opts: ['Ядра с одинаковым количеством протонов', 'Ядра с одинаковым количеством нейтронов', 'Ядра с одинаковым количеством нуклонов', 'Ядра с одинаковой массой и разным зарядом']
        ans: a
        hint: Изотопы — один и тот же химический элемент.
        explain: Изотопы — это ядра с одинаковым количеством протонов.
        src: a04
      - type: matching
        cat: theory
        q: Сопоставьте название и то, что у ядер одинаково.
        pairs:
          - ['Изотопы', 'количество протонов']
          - ['Изобары', 'количество нуклонов']
          - ['Изотоны', 'количество нейтронов']
        hint: «Изото**н**ы» — «**н**ейтроны».
        explain: Изотопы — одинаковое число протонов, изобары — нуклонов, изотоны — нейтронов.
        src: a04
      - type: single
        cat: theory
        q: Какая пара ядер — изотопы?
        opts: ['$^{16}_8O$ и $^{18}_8O$', '$^{59}_{27}Co$ и $^{59}_{28}Ni$', '$^3_1H$ и $^4_2He$', '$^{12}_6C$ и $^{14}_7N$']
        ans: a
        hint: Ищите одинаковое нижнее число Z.
        explain: У $^{16}_8O$ и $^{18}_8O$ одинаковое число протонов (Z = 8).
        src: a04
      - type: single
        cat: theory
        q: Какая пара ядер — изотоны?
        opts: ['$^3_1H$ и $^4_2He$', '$^1_1H$ и $^2_1H$', '$^{59}_{27}Co$ и $^{59}_{28}Ni$', '$^{16}_8O$ и $^{17}_8O$']
        ans: a
        hint: Посчитайте $A - Z$ у каждого ядра.
        explain: 'У $^3_1H$: 3 − 1 = 2 нейтрона, у $^4_2He$: 4 − 2 = 2 нейтрона.'
        src: a04
      - type: single
        cat: theory
        q: Почему $^{59}_{27}Co$ и $^{59}_{28}Ni$ — изобары?
        opts: ['У них одинаковое число нуклонов', 'У них одинаковое число протонов', 'У них одинаковое число нейтронов', 'Это один и тот же элемент']
        ans: a
        hint: Сравните верхние числа.
        explain: У обоих A = 59 — одинаковое количество нуклонов.
        src: a04
      - type: numeric
        cat: problem
        q: 'В атоме $^{12}_6C$ вокруг ядра 5 электронов. Найдите заряд атома в единицах e.'
        num: { value: 1, unit: 'e', check: '6-5' }
        hint: '$q = (N_p - N_e)\cdot e$.'
        explain: '$q = (6 - 5)e = +e$ — как в конспекте.'
        f: [1]
        sol: { given: ['N_p = 6', 'N_e = 5'], find: 'q', formula: 'q = (N_p - N_e)e', calc: 'q = (6 - 5)e = +e', answer: '+1e' }
        src: a04
      - type: numeric
        cat: problem
        q: 'Ион $^{11}_5B$ имеет заряд $q = -2e$. Сколько у него электронов?'
        num: { value: 7, unit: '', check: '5+2' }
        hint: 'Минус 2e — значит, электронов на 2 больше, чем протонов.'
        explain: '$N_e = 5 + 2 = 7$ (на рисунке конспекта нарисованы не все, см. AT05).'
        f: [1]
        sol: { given: ['N_p = 5', 'q = −2e'], find: 'N_e', formula: 'q = (N_p - N_e)e', calc: '-2 = 5 - N_e\ \Rightarrow\ N_e = 7', answer: '7' }
        src: a04
      - type: numeric
        cat: problem
        q: 'Сколько нейтронов в ядре $^{17}_8O$?'
        num: { value: 9, unit: '', check: '17-8' }
        hint: '$N_n = A - Z$.'
        explain: '$N_n = 17 - 8 = 9$.'
        sol: { given: ['A = 17', 'Z = 8'], find: 'N_n', formula: 'N_n = A - Z', calc: 'N_n = 17 - 8 = 9', answer: '9' }
        src: a04

  - id: nuc-binding
    title: Ядерные силы. Энергия связи ядра
    pages: [a05]
    theory:
      - kind: definition
        title: Ядерная сила
        body: 'Сила, которая возникает только между нуклонами, называется ядерной силой. Она может возникнуть между протоном и протоном, протоном и нейтроном, нейтроном и нейтроном. Основное условие возникновения ядерных сил — расстояние между нуклонами должно быть в пределах $10^{-15}$ м.'
        src: a05
      - kind: law
        title: Дефект массы и энергия связи
        body: 'Масса ядра меньше суммы масс его нуклонов (на рисунке конспекта: 2 протона и 2 нейтрона по отдельности — «4 а.е.м.», вместе в ядре — «3,9 а.е.м.»). Эта разница — дефект массы $\Delta m = Z\cdot m_p + (A - Z)m_n - m_{ядра}$. Энергия связи $E_{связи} = \Delta mc^2$.'
        src: a05
        fig: mass-defect
      - kind: definition
        title: Энергия связи и удельная энергия связи
        body: 'Энергия связи — это энергия, необходимая для того, чтобы разделить ядро на отдельные нуклоны. Удельная энергия связи ε — энергия связи одного нуклона: $\varepsilon = \frac{E_{связи}}{A}$ [эВ/нуклон] (уточнение — в замечании AT06).'
        src: a05
        errata: [AT06]
    formulas:
      - title: Энергия связи
        tex: 'E_{связи} = \Delta m c^2'
        sym: [E_bind, dm_def, c_vac]
        boxed: true
        src: a05
      - title: Дефект массы
        tex: '\Delta m = Z\cdot m_p + (A - Z)\,m_n - m_{ядра}'
        sym: [dm_def, Z_ch, m_pr, A_mass, m_nt, m_nuc]
        boxed: true
        src: a05
      - title: Удельная энергия связи
        tex: '\varepsilon = \frac{E_{связи}}{A}'
        sym: [eps_bind, E_bind, A_mass]
        boxed: true
        src: a05
    questions:
      - type: single
        cat: theory
        q: При каком условии, по конспекту, возникают ядерные силы?
        opts: ['Расстояние между нуклонами — в пределах 10⁻¹⁵ м', 'Нуклоны должны иметь одинаковый заряд', 'Расстояние больше 10⁻¹⁰ м', 'Только между протонами']
        ans: a
        hint: Ядерные силы действуют только на очень малых расстояниях.
        explain: Основное условие возникновения ядерных сил — расстояние между нуклонами в пределах 10⁻¹⁵ м.
        src: a05
      - type: multiple
        cat: theory
        q: Между какими частицами действует ядерная сила? Выберите все.
        opts: ['Протон — протон', 'Протон — нейтрон', 'Нейтрон — нейтрон', 'Электрон — протон']
        ans: [a, b, c]
        hint: Ядерная сила действует между нуклонами.
        explain: Ядерная сила возникает между протон-протоном, протон-нейтроном и нейтрон-нейтроном.
        src: a05
      - type: single
        cat: theory
        q: Что такое дефект массы?
        opts: ['Разница между суммой масс нуклонов и массой ядра', 'Масса электронов атома', 'Масса нейтронов ядра', 'Разница масс протона и нейтрона']
        ans: a
        hint: '$\Delta m = Z m_p + (A - Z)m_n - m_{ядра}$.'
        explain: Дефект массы — на сколько масса ядра меньше суммы масс его нуклонов.
        f: [2]
        src: a05
      - type: single
        cat: theory
        q: Что такое энергия связи ядра?
        opts: ['Энергия, необходимая, чтобы разделить ядро на отдельные нуклоны', 'Энергия электронов атома', 'Энергия, выделяемая при движении ядра', 'Кинетическая энергия нуклонов']
        ans: a
        hint: Определение на стр. a05.
        explain: Энергия связи — необходимая энергия для того, чтобы разделить ядро на отдельные нуклоны.
        f: [1]
        src: a05
      - type: numeric
        cat: problem
        q: 'Дефект массы ядра $\Delta m = 5\cdot10^{-29}$ кг. Найдите энергию связи ($c = 3\cdot10^8$ м/с).'
        num: { value: 4.5e-12, unit: 'Дж', check: '5e-29*(3e8)**2' }
        hint: '$E_{связи} = \Delta mc^2$.'
        explain: '$E = 5\cdot10^{-29}\cdot9\cdot10^{16} = 4{,}5\cdot10^{-12}$ Дж.'
        f: [1]
        sol: { given: ['Δm = 5·10⁻²⁹ кг', 'c = 3·10⁸ м/с'], find: 'E_связи', formula: 'E_{связи} = \Delta mc^2', calc: 'E = 5\cdot10^{-29}\cdot(3\cdot10^8)^2 = 4{,}5\cdot10^{-12}', answer: '4,5·10⁻¹² Дж' }
        src: a05
      - type: numeric
        cat: problem
