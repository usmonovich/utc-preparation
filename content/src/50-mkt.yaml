errata:
  - id: M01
    page: m02
    severity: note
    original: '\(N_A = 6{,}023\cdot10^{23}\) моль⁻¹'
    issue: Обычно приводят 6,022·10²³ моль⁻¹. В расчётах конспект использует 6·10²³.
    target: 'Значение постоянной Авогадро'
    suggestion: 'Записать \(N_A = 6{,}022\cdot10^{23}\) моль⁻¹; в задачах — \(6\cdot10^{23}\), как в конспекте.'
  - id: M02
    page: m03
    severity: note
    original: '«Броуновское движение — это беспорядочное распределение частиц твёрдого тела по всему объёму жидкости»'
    issue: Обычно так описывают диффузию; броуновским называют беспорядочное движение мелких взвешенных частиц под ударами молекул.
    target: 'Определение броуновского движения'
    suggestion: 'Записать: «Броуновское движение — беспорядочное движение мелких частиц, взвешенных в жидкости или газе, под ударами молекул». Описание из конспекта больше подходит к диффузии.'
  - id: M03
    page: m04
    severity: typo
    original: '\(\bar\upsilon^2 = \left(\frac{\upsilon_1 + \dots + \upsilon_N}{\upsilon_N}\right)^2\)'
    issue: В знаменателе стоит \(\upsilon_N\); среднее арифметическое делится на число молекул N.
    target: 'Формула квадрата средней скорости'
    suggestion: '\(\bar\upsilon^2 = \left(\frac{\upsilon_1 + \dots + \upsilon_N}{N}\right)^2\).'
  - id: M04
    page: m04
    severity: note
    original: '\(\overline{\upsilon^2}\) — «среднеквадратичная скорость»'
    issue: \(\overline{\upsilon^2}\) — средний квадрат скорости (м²/с²); среднеквадратичная скорость — корень из него, \(\upsilon_{кв}\) на стр. m06.
    target: 'Название величины \(\overline{\upsilon^2}\)'
    suggestion: 'Называть \(\overline{\upsilon^2}\) средним квадратом скорости; среднеквадратичная скорость — корень из него: \(\upsilon_{кв} = \sqrt{\overline{\upsilon^2}}\).'
  - id: M05
    page: m05
    severity: error
    original: '\(\overline{W}_к = \frac32 pV\) (в рамке)'
    issue: Из \(\overline{W}_к = \frac32\frac pn\) и \(n = \frac NV\) следует \(\overline{W}_к = \frac{3pV}{2N}\); величина \(\frac32 pV\) — полная энергия \(W_к = N\overline{W}_к\) (ср. \(U = \frac32 pV\) на стр. m11).
    target: 'Формула средней кинетической энергии молекулы (в рамке)'
    suggestion: '\(W_к = \frac32 pV\) или \(\overline{W}_к = \frac{3pV}{2N}\).'
  - id: M06
    page: m06
    severity: unclear
    original: '«\(\nu \ne \text{const}\) — закрытый сосуд»'
    issue: 'В закрытом сосуде количество вещества не меняется, а строкой выше «закрытая система» уже стоит при \(\nu = \text{const}\).'
    target: 'Пояснение к уравнению Клапейрона: когда \(\nu \ne \text{const}\)'
    suggestion: 'Записать «\(\nu \ne \text{const}\) — открытый сосуд» (газ может выходить или входить). На фото действительно написано «закрытый сосуд» — по смыслу это описка.'
  - id: M07
    page: m11
    severity: note
    original: '\(U = \frac32 pV\) — для идеального газа'
    issue: Эта форма верна для одноатомного газа (i = 3); ниже в конспекте дана общая формула \(U = \frac i2 pV\).
    target: 'Формула внутренней энергии \(U = \frac32 pV\)'
    suggestion: 'Дописать условие: «для одноатомного газа (i = 3)»; общая формула — \(U = \frac i2 pV\).'
  - id: M08
    page: m11
    severity: note
    original: '«Сосуд открытый: T↑ — ν↓, U = const»'
    issue: Вывод следует из \(U = \frac i2 pV\) при постоянных давлении и объёме сосуда; условие в конспекте не записано.
    target: 'Вывод об открытом сосуде при нагревании'
    suggestion: Дописать условие «при p = const и V = const».
  - id: M09
    page: m17
    severity: note
    original: '\(E = \frac{\Delta l}{l_0}\cdot100\%\) — относительная деформация'
    issue: Буквой E на этой же странице обозначен модуль Юнга. Относительную деформацию обычно обозначают ε.
    target: 'Обозначение относительной деформации'
    suggestion: 'Записать \(\varepsilon = \frac{\Delta l}{l_0}\cdot100\%\) — относительная деформация; букву E оставить для модуля Юнга.'
  - id: M10
    page: m17
    severity: unclear
    original: '«3 — предел жёсткости»'
    issue: Слово читается неуверенно; обычно максимум на диаграмме растяжения называют пределом прочности.
    target: 'Название точки 3 на графике растяжения'
    suggestion: 'Записать «3 — предел прочности» (наибольшее напряжение перед разрушением).'
    todo: 'Сверьте слово с фото страницы.'
  - id: M11
    page: m17
    severity: unclear
    original: 'символ механического напряжения и коэффициента поверхностного натяжения'
    issue: В тетради символ похож на δ; стандартное обозначение — σ. В приложении записан как σ.
    target: 'Буква для механического напряжения и поверхностного натяжения'
    suggestion: 'Обозначать σ (в тетради буква похожа на δ). В приложении уже записано σ.'
    todo: 'Если согласны с σ — «Принять исправление».'
  - id: M12
    page: m19
    severity: note
    original: '«Энергия … может передаваться тремя способами: излучение, конвекция, теплообмен»'
    issue: Третий способ обычно называют теплопроводностью; «теплообмен» — общее название всех трёх способов.
    target: 'Три способа передачи энергии'
    suggestion: '«…излучение, конвекция, теплопроводность».'
  - id: M13
    page: m21
    severity: note
    original: 'r — «удельная теплота кипения»'
    issue: Обычно эту величину называют удельной теплотой парообразования.
    target: 'Название величины r'
    suggestion: 'Называть r удельной теплотой парообразования (кипения) — оба названия.'

topics:

# ───────────────────────────────────────────────────────────────
  - id: mol-basics
    title: Основные понятия. Количество вещества. Число Авогадро
    pages: [m01, m02, m03]
    theory:
      - kind: definition
        title: Молекулярная физика
        body: |
          В молекулярной физике все вещества состоят из молекул, а сама молекула может состоять из одного атома или химической связи из нескольких атомов. Молекулярная физика делится на три части:
          - молекулярно-кинетическая теория и идеальный газ;
          - термодинамика;
          - некоторые свойства твёрдых тел и жидкостей.
        src: m01
      - kind: list
        title: Основные понятия — I группа
        body: |
          - $m$ — масса [кг], [г], [мг]: 1 кг = 10³ г; 1 г = 10⁻³ кг; 1 мг = 10⁻⁶ кг; 1 кг = 10⁶ мг.
          - $V$ — объём [м³], [л], [см³]: 1 м³ = 10³ л; 1 л = 10⁻³ м³; 1 см³ = 10⁻⁶ м³; 1 м³ = 10⁶ см³.
          - $\rho$ — плотность [кг/м³], [г/см³].
        src: m01
      - kind: list
        title: Основные понятия — II группа
        body: |
          - $m$ — масса [кг], [г], [мг];
          - $\nu$ — количество вещества [моль];
          - $\mu$ — молярная масса [кг/моль].
        src: m01
      - kind: definition
        title: Число Авогадро
        body: Количество вещества 1 моль характеризует определённое число молекул. Это значение является одинаковым для всех веществ. В любом веществе число молекул в 1 моле имеет определённое значение, это число называется **числом Авогадро**.
        src: m02
        errata: [M01]
      - kind: definition
        title: Молярная масса
        body: 'Молярная масса — это масса одной моли вещества. Примеры: $\mu_{Si} = 28$ г/моль $= 28\cdot10^{-3}$ кг/моль; $\mu_{Hg} = 200$ г/моль $= 200\cdot10^{-3}$ кг/моль.'
        src: m02
      - kind: list
        title: Виды молекул
        body: |
          - одноатомные: He, Ne, Na, Au, Ag, P…;
          - двухатомные: H₂, O₂, N₂, F₂, Br₂, I₂, Cl₂, NaCl…;
          - многоатомные: H₂O, NaOH, O₃, CH₄, CO₂…
          Водород, кислород и азот в задачах часто даются в виде двухатомных молекул: $\mu_{O_2} = 32\cdot10^{-3}$, $\mu_{H_2} = 2\cdot10^{-3}$, $\mu_{N_2} = 28\cdot10^{-3}$ кг/моль (для атомов — 16, 1 и 14 г/моль).
        src: m02
    formulas:
      - title: Масса, объём и плотность
        tex: 'm = \rho V,\qquad V = \frac{m}{\rho},\qquad \rho = \frac{m}{V}'
        sym: [m, V, rho]
        src: m01
      - title: Количество вещества и молярная масса
        tex: 'm = \nu\mu,\qquad \nu = \frac{m}{\mu},\qquad \mu = \frac{m}{\nu}'
        sym: [m, nu_mol, mu_mol]
        boxed: true
        src: m01
      - title: Число Авогадро
        tex: 'N_A = 6{,}023\cdot10^{23}\ \text{моль}^{-1},\qquad N_A \approx 6\cdot10^{23}\ \text{моль}^{-1}'
        sym: [N_Av]
        src: m02
        errata: [M01]
      - title: Число молекул
        tex: 'N = \nu N_A'
        sym: [N_mol, nu_mol, N_Av]
        boxed: true
        src: m02
      - title: Число молекул через массу
        tex: 'N = \frac{m}{\mu}N_A'
        sym: [N_mol, m, mu_mol, N_Av]
        boxed: true
        src: m03
      - title: Масса одной молекулы
        tex: 'm_0 = \frac{\mu}{N_A}'
        sym: [m0, mu_mol, N_Av]
        boxed: true
        src: m03
    examples:
      - title: Молярная масса сложного вещества
        steps: ['$\mu_{H_2O} = 2\cdot1 + 16 = 18$ г/моль', '$\mu_{CH_4} = 12 + 4 = 16$ г/моль']
        src: m02
    questions:
      - type: numeric
        cat: problem
        q: Сколько молей вещества в 36 г воды ($\mu = 18$ г/моль)?
        num: { value: 2, unit: 'моль', check: '36/18' }
        hint: '$\nu = \frac{m}{\mu}$ — граммы можно делить на г/моль.'
        explain: Количество вещества — масса, делённая на молярную массу.
        f: [2]
        sol: { given: ['m = 36 г', 'μ = 18 г/моль'], find: 'ν', formula: '\nu = \frac{m}{\mu}', calc: '\nu = \frac{36}{18} = 2', answer: '2 моль' }
        src: m01
      - type: numeric
        cat: problem
        q: Сколько молекул содержится в 2 моль вещества ($N_A = 6\cdot10^{23}$ моль⁻¹)?
        num: { value: 1.2e24, unit: '', check: '2*6e23' }
        hint: '$N = \nu N_A$.'
        explain: Число молекул равно количеству вещества, умноженному на число Авогадро.
        f: [4]
        sol: { given: ['ν = 2 моль'], find: 'N', formula: 'N = \nu N_A', calc: 'N = 2\cdot6\cdot10^{23} = 1{,}2\cdot10^{24}', answer: '1,2·10²⁴' }
        src: m02
      - type: numeric
        cat: problem
        q: Сколько молекул в 4 г водорода H₂ ($\mu = 2\cdot10^{-3}$ кг/моль, $N_A = 6\cdot10^{23}$ моль⁻¹)?
        num: { value: 1.2e24, unit: '', check: '4e-3/2e-3*6e23' }
        hint: Переведите массу в килограммы и используйте $N = \frac{m}{\mu}N_A$.
        explain: Водород в задачах берётся в виде молекулы H₂.
        f: [5]
        sol: { given: ['m = 4 г', 'μ = 2·10⁻³ кг/моль'], si: ['m = 4·10⁻³ кг'], find: 'N', formula: 'N = \frac{m}{\mu}N_A', calc: 'N = \frac{4\cdot10^{-3}}{2\cdot10^{-3}}\cdot6\cdot10^{23} = 1{,}2\cdot10^{24}', answer: '1,2·10²⁴' }
        src: m03
      - type: numeric
        cat: problem
        q: Найдите массу одной молекулы кислорода O₂ ($\mu = 32\cdot10^{-3}$ кг/моль, $N_A = 6\cdot10^{23}$ моль⁻¹).
        num: { value: 5.333e-26, unit: 'кг', check: '32e-3/6e23' }
        hint: Масса одной молекулы — молярная масса, делённая на число Авогадро.
        explain: '$m_0 = \frac{\mu}{N_A}$ — формула в рамке на стр. m03.'
        f: [6]
        sol: { given: ['μ = 32·10⁻³ кг/моль'], find: 'm₀', formula: 'm_0 = \frac{\mu}{N_A}', calc: 'm_0 = \frac{32\cdot10^{-3}}{6\cdot10^{23}} \approx 5{,}33\cdot10^{-26}', answer: '≈ 5,3·10⁻²⁶ кг' }
        src: m03
      - type: numeric
        cat: problem
        q: Найдите молярную массу углекислого газа CO₂ в г/моль (C — 12, O — 16 г/моль).
        num: { value: 44, unit: 'г/моль', check: '12+2*16' }
        hint: Сложите молярные массы всех атомов молекулы, как в примере с H₂O и CH₄.
        explain: 'По образцу конспекта: $\mu_{CO_2} = 12 + 2\cdot16$.'
        sol: { calc: '\mu_{CO_2} = 12 + 2\cdot16 = 44', answer: '44 г/моль' }
        src: m02
      - type: matching
        cat: theory
        q: Сопоставьте вещество и тип его молекулы.
        pairs:
          - ['He', 'Одноатомная']
          - ['N₂', 'Двухатомная']
          - ['CO₂', 'Многоатомная']
        hint: Посчитайте атомы в формуле молекулы.
        explain: Классификация со стр. m02.
        src: m02
      - type: single
        cat: theory
        q: Что такое молярная масса (по конспекту)?
        opts: ['Масса одной моли вещества', 'Масса одной молекулы', 'Число молекул в одном моле', 'Масса единицы объёма']
        ans: a
        hint: Определение стоит перед примерами $\mu_{Si}$ и $\mu_{Hg}$.
        explain: Молярная масса — это масса одной моли вещества [кг/моль].
        src: m02

# ───────────────────────────────────────────────────────────────
  - id: mol-mkt
    title: Молекулярно-кинетическая теория. Идеальный газ
    pages: [m03]
    theory:
      - kind: definition
        title: Положения МКТ
        body: В молекулярно-кинетической теории все вещества состоят из молекул, а молекулы состоят из атомов. Все молекулы всегда находятся в движении. Это движение называется **тепловым движением**. Это движение является беспрерывным и беспорядочным (хаотичным).
        src: m03
      - kind: definition
        title: Броуновское движение
        body: Броуновское движение — это беспорядочное распределение частиц твёрдого тела по всему объёму жидкости.
        src: m03
        errata: [M02]
      - kind: definition
        title: Идеальный газ
        fig: gas-box
        body: Идеальный газ — это газ, где молекулы имеют очень маленькие размеры и за счёт этого чаще сталкиваются со стенками сосуда, чем сталкиваются друг с другом. В идеальном газе молекулы сталкиваются друг с другом, но не взаимодействуют на расстоянии друг с другом.
        src: m03
    questions:
      - type: single
        cat: theory
        q: Как в конспекте называется постоянное движение молекул?
        opts: ['Тепловое движение', 'Механическое движение', 'Равномерное движение', 'Колебательное движение']
        ans: a
        hint: Название связано с температурой.
        explain: Все молекулы всегда находятся в движении; это движение называется тепловым.
        src: m03
      - type: multiple
        cat: theory
        q: Какими свойствами обладает тепловое движение молекул? Выберите все верные.
        opts: ['Беспрерывное', 'Беспорядочное (хаотичное)', 'Упорядоченное', 'Прекращается при 0 °C']
        ans: [a, b]
        hint: В конспекте названы два свойства.
        explain: Тепловое движение является беспрерывным и беспорядочным (хаотичным).
        src: m03
      - type: single
        cat: theory
        q: Какое утверждение об идеальном газе соответствует конспекту?
        opts:
          - Молекулы очень малы и не взаимодействуют на расстоянии
          - Молекулы сильно притягиваются друг к другу
          - Молекулы никогда не сталкиваются со стенками сосуда
          - Молекулы неподвижны
        ans: a
        hint: В определении две части — о размерах молекул и о взаимодействии.
        explain: Молекулы идеального газа имеют очень маленькие размеры; они сталкиваются, но не взаимодействуют на расстоянии.
        src: m03
      - type: text
        cat: theory
        q: Сформулируйте основные положения молекулярно-кинетической теории.
        ref: Все вещества состоят из молекул, а молекулы — из атомов. Все молекулы всегда находятся в движении (тепловом), которое является беспрерывным и беспорядочным.
        criteria: ['Вещество состоит из молекул (атомов)', 'Молекулы всегда движутся', 'Движение беспрерывное и хаотичное']
        hint: Три мысли — из чего состоят вещества, что делают молекулы и какое это движение.
        explain: Определение со стр. m03.
        src: m03

# ───────────────────────────────────────────────────────────────
  - id: mol-eq
    title: Основное уравнение МКТ. Концентрация молекул
    pages: [m04, m05]
    theory:
      - kind: definition
        title: Концентрация молекул
        body: Концентрация молекул — это число молекул в единице объёма.
        src: m04
      - kind: text
        title: Единицы давления
        body: '$p$ — давление [Па], [атм], [мм Hg]: 1 атм $= 10^5$ Па; 1 мм Hg $= 133{,}3$ Па.'
        src: m04
      - kind: rule
        title: Средний квадрат и квадрат средней скорости
        body: '$\overline{\upsilon^2}$ (в конспекте — «среднеквадратичная скорость») и $\bar\upsilon^2$ — квадрат средней скорости — разные величины: $\overline{\upsilon^2} \ne \bar\upsilon^2$.'
        src: m04
        errata: [M04]
    formulas:
      - title: Основное уравнение МКТ
        tex: 'p = \frac13 m_0 n\overline{\upsilon^2}'
        sym: [p, m0, n_conc, v2_avg]
        boxed: true
        src: m04
      - title: Концентрация молекул
        tex: 'n = \frac{N}{V}'
        sym: [n_conc, N_mol, V]
        boxed: true
        src: m04
      - title: Концентрация через массу и плотность
        tex: 'n = \frac{mN_A}{V\mu},\qquad n = \frac{\rho}{m_0},\qquad n = \rho\frac{N_A}{\mu},\qquad \rho = m_0 n'
        sym: [n_conc, m, N_Av, V, mu_mol, rho, m0]
        boxed: true
        src: m04
      - title: Средний квадрат скорости
        tex: '\overline{\upsilon^2} = \frac{\upsilon_1^2 + \upsilon_2^2 + \dots + \upsilon_N^2}{N}'
        sym: [v2_avg, N_mol]
        boxed: true
        src: m04
      - title: Квадрат средней скорости (как записано)
        tex: '\bar\upsilon^2 = \left(\frac{\upsilon_1 + \upsilon_2 + \dots + \upsilon_N}{\upsilon_N}\right)^2'
        sym: [v_avg_sq]
        boxed: true
        src: m04
        errata: [M03]
      - title: Средняя и полная кинетическая энергия
        tex: '\overline{W}_к = \frac{m_0\overline{\upsilon^2}}{2},\qquad W_к = N\overline{W}_к'
        sym: [Wk_avg, Wk_all, m0, v2_avg, N_mol]
        src: m05
      - title: Давление через плотность
        tex: 'p = \frac13\rho\overline{\upsilon^2}'
        sym: [p, rho, v2_avg]
        boxed: true
        src: m05
      - title: Давление через среднюю кинетическую энергию
        tex: 'p = \frac23 n\overline{W}_к,\qquad \overline{W}_к = \frac32\frac{p}{n}'
        sym: [p, n_conc, Wk_avg]
        boxed: true
        src: m05
      - title: Формула из рамки (как записано)
        tex: '\overline{W}_к = \frac32 pV'
        sym: [Wk_avg, p, V]
        boxed: true
        src: m05
        errata: [M05]
    questions:
      - type: numeric
        cat: problem
        q: 'Плотность газа 1,2 кг/м³, средний квадрат скорости его молекул $\overline{\upsilon^2} = 2{,}5\cdot10^5$ м²/с². Найдите давление газа.'
        num: { value: 100000, unit: 'Па', check: '1.2*2.5e5/3' }
        hint: Есть форма основного уравнения МКТ через плотность.
        explain: '$p = \frac13\rho\overline{\upsilon^2}$.'
        f: [7]
        sol: { given: ['ρ = 1,2 кг/м³', 'υ² ср. = 2,5·10⁵ м²/с²'], find: 'p', formula: 'p = \frac13\rho\overline{\upsilon^2}', calc: 'p = \frac{1{,}2\cdot2{,}5\cdot10^5}{3} = 10^5', answer: '10⁵ Па' }
        src: m05
      - type: numeric
        cat: problem
        q: В сосуде объёмом 2 м³ находится $3\cdot10^{25}$ молекул. Найдите концентрацию молекул.
        num: { value: 1.5e25, unit: 'м⁻³', check: '3e25/2' }
        hint: Концентрация — число молекул в единице объёма.
        explain: '$n = \frac NV$.'
        f: [2]
        sol: { given: ['N = 3·10²⁵', 'V = 2 м³'], find: 'n', formula: 'n = \frac{N}{V}', calc: 'n = \frac{3\cdot10^{25}}{2} = 1{,}5\cdot10^{25}', answer: '1,5·10²⁵ м⁻³' }
        src: m04
      - type: numeric
        cat: problem
        q: 'Концентрация молекул газа $3\cdot10^{25}$ м⁻³, средняя кинетическая энергия молекулы $5\cdot10^{-21}$ Дж. Найдите давление.'
        num: { value: 100000, unit: 'Па', check: '2/3*3e25*5e-21' }
        hint: '$p = \frac23 n\overline{W}_к$.'
        explain: Давление через среднюю кинетическую энергию молекул.
        f: [8]
        sol: { given: ['n = 3·10²⁵ м⁻³', 'W̄к = 5·10⁻²¹ Дж'], find: 'p', formula: 'p = \frac23 n\overline{W}_к', calc: 'p = \frac23\cdot3\cdot10^{25}\cdot5\cdot10^{-21} = 10^5', answer: '10⁵ Па' }
        src: m05
      - type: numeric
        cat: problem
        q: 'Три молекулы движутся со скоростями 1, 2 и 3 м/с. Найдите средний квадрат скорости $\overline{\upsilon^2}$.'
        num: { value: 4.667, unit: 'м²/с²', check: '(1+4+9)/3' }
        hint: Сначала возведите каждую скорость в квадрат, потом усредните.
        explain: 'Для сравнения: квадрат средней скорости $\bar\upsilon^2 = 2^2 = 4$ — величины не равны.'
        f: [4]
        sol: { given: ['υ = 1; 2; 3 м/с'], find: 'υ² ср.', formula: '\overline{\upsilon^2} = \frac{\upsilon_1^2+\upsilon_2^2+\upsilon_3^2}{N}', calc: '\overline{\upsilon^2} = \frac{1+4+9}{3} \approx 4{,}67', answer: '≈ 4,67 м²/с²' }
        src: m04
      - type: single
        cat: theory
        q: 'Как связаны $\overline{\upsilon^2}$ и $\bar\upsilon^2$ (по конспекту)?'
        opts: ['В общем случае они не равны', 'Они всегда равны', '$\overline{\upsilon^2}$ всегда в 3 раза больше', '$\bar\upsilon^2$ равно нулю']
        ans: a
        hint: Под формулами в конспекте записано отдельное соотношение.
        explain: '$\overline{\upsilon^2} \ne \bar\upsilon^2$: средний квадрат и квадрат среднего — разные величины.'
        src: m04
      - type: numeric
        cat: problem
        q: Выразите давление 760 мм Hg в паскалях (1 мм Hg = 133,3 Па).
        num: { value: 101308, unit: 'Па', check: '760*133.3' }
        hint: Умножьте на 133,3.
        explain: Перевод единиц со стр. m04.
        sol: { calc: '760\cdot133{,}3 = 101\,308', answer: '101 308 Па' }
        src: m04
      - type: numeric
        cat: problem
        q: 'Плотность газа 0,09 кг/м³, масса одной молекулы $3\cdot10^{-27}$ кг. Найдите концентрацию молекул.'
        num: { value: 3e25, unit: 'м⁻³', check: '0.09/3e-27' }
        hint: '$n = \frac{\rho}{m_0}$.'
        explain: Концентрация через плотность и массу молекулы.
        f: [3]
        sol: { given: ['ρ = 0,09 кг/м³', 'm₀ = 3·10⁻²⁷ кг'], find: 'n', formula: 'n = \frac{\rho}{m_0}', calc: 'n = \frac{0{,}09}{3\cdot10^{-27}} = 3\cdot10^{25}', answer: '3·10²⁵ м⁻³' }
        src: m04

# ───────────────────────────────────────────────────────────────
  - id: mol-temp
    title: Температура. Постоянная Больцмана. Скорость молекул
    pages: [m05, m06]
    theory:
      - kind: definition
        title: Температура
        fig: temp-speed
        body: 'Температура — это мера измерения средней кинетической энергии тел. $T$ [К] — абсолютная температура; $t$ [°C] — температура по шкале Цельсия. 0 К соответствует −273 °C, 273 К — 0 °C. $T \in (0;\infty)$, $t \in (-273{,}15;\infty)$.'
        src: m05
      - kind: rule
        title: «от», «на», «до» для температуры
        body: '«от» $t_1 = 17$ °C → $T_1 = 290$ К; «на» $\Delta t = 10$ °C → $\Delta T = 10$ К; «до» $t_2 = 27$ °C → $T_2 = 300$ К. Изменение температуры в °C и в К одинаково: $\Delta t = \Delta T$.'
        src: m05
    formulas:
      - title: Перевод температуры
        tex: 'T = t + 273,\qquad t = T - 273,\qquad \Delta t = \Delta T'
        sym: [T_abs, t_cel]
        src: m05
      - title: Температура и средняя кинетическая энергия
        tex: 'T = \frac23\frac{\overline{W}_к}{k},\qquad W_к = \frac32 kT,\qquad W_к = \frac32\frac{p}{n}'
        sym: [T_abs, Wk_avg, k_B, p, n_conc]
        boxed: true
        src: m05
      - title: Постоянная Больцмана
        tex: 'k = 1{,}38\cdot10^{-23}\ \text{Дж/К}'
        sym: [k_B]
        boxed: true
        src: m05
      - title: Давление и число молекул
        tex: 'p = nkT,\qquad N = \frac{pV}{kT}'
        sym: [p, n_conc, k_B, T_abs, N_mol, V]
        boxed: true
        src: m05
      - title: Универсальная газовая постоянная
        tex: 'R = N_A k = 8{,}31'
        sym: [R_gas, N_Av, k_B]
        src: m06
      - title: Среднеквадратичная скорость
        tex: '\upsilon_{кв} = \sqrt{\frac{3p}{m_0 n}} = \sqrt{\frac{3p}{\rho}} = \sqrt{\frac{3pV}{m}} = \sqrt{\frac{3kT}{m_0}} = \sqrt{\frac{3RT}{\mu}}'
        sym: [v_kv, p, m0, n_conc, rho, V, m, k_B, T_abs, R_gas, mu_mol]
        boxed: true
        src: m06
    questions:
      - type: numeric
        cat: problem
        q: Переведите 27 °C в кельвины.
        num: { value: 300, unit: 'К', check: '27+273' }
        hint: '$T = t + 273$.'
        explain: Пример «до» со стр. m05.
        f: [1]
        sol: { calc: 'T = 27 + 273 = 300', answer: '300 К' }
        src: m05
      - type: numeric
        cat: problem
        q: Газ нагрели на 15 °C. На сколько кельвинов изменилась его температура?
        num: { value: 15, unit: 'К', check: '15' }
        hint: «На» означает изменение. Изменение в °C и в К одинаково.
        explain: '$\Delta t = \Delta T$.'
        f: [1]
        sol: { calc: '\Delta T = \Delta t = 15', answer: '15 К' }
        src: m05
      - type: numeric
        cat: problem
        q: Найдите среднюю кинетическую энергию молекулы газа при 300 К ($k = 1{,}38\cdot10^{-23}$ Дж/К).
        num: { value: 6.21e-21, unit: 'Дж', check: '1.5*1.38e-23*300' }
        hint: '$W_к = \frac32 kT$.'
        explain: Средняя кинетическая энергия зависит только от температуры.
        f: [2]
        sol: { given: ['T = 300 К'], find: 'W̄к', formula: 'W_к = \frac32 kT', calc: 'W_к = 1{,}5\cdot1{,}38\cdot10^{-23}\cdot300 = 6{,}21\cdot10^{-21}', answer: '6,21·10⁻²¹ Дж' }
        src: m05
      - type: numeric
        cat: problem
        q: 'Найдите давление газа при концентрации молекул $2{,}5\cdot10^{25}$ м⁻³ и температуре 290 К.'
        num: { value: 100050, unit: 'Па', check: '2.5e25*1.38e-23*290' }
        hint: '$p = nkT$.'
        explain: Давление через концентрацию и температуру.
        f: [4]
        sol: { given: ['n = 2,5·10²⁵ м⁻³', 'T = 290 К'], find: 'p', formula: 'p = nkT', calc: 'p = 2{,}5\cdot10^{25}\cdot1{,}38\cdot10^{-23}\cdot290 \approx 1{,}0\cdot10^5', answer: '≈ 10⁵ Па' }
        src: m05
      - type: numeric
        cat: problem
        q: Найдите среднеквадратичную скорость молекул водорода при 300 К ($\mu = 2\cdot10^{-3}$ кг/моль, $R = 8{,}31$).
        num: { value: 1934, unit: 'м/с', check: 'Math.sqrt(3*8.31*300/2e-3)' }
        hint: Используйте форму через R, T и μ.
        explain: '$\upsilon_{кв} = \sqrt{\frac{3RT}{\mu}}$.'
        f: [6]
        sol: { given: ['T = 300 К', 'μ = 2·10⁻³ кг/моль'], find: 'υкв', formula: '\upsilon_{кв} = \sqrt{\frac{3RT}{\mu}}', calc: '\upsilon_{кв} = \sqrt{\frac{3\cdot8{,}31\cdot300}{2\cdot10^{-3}}} \approx 1934', answer: '≈ 1,93 км/с' }
        src: m06
      - type: single
        cat: formula
        q: Абсолютную температуру газа увеличили в 4 раза. Как изменится среднеквадратичная скорость молекул?
        opts: ['Увеличится в 2 раза', 'Увеличится в 4 раза', 'Увеличится в 16 раз', 'Не изменится']
        ans: a
        hint: Температура стоит под корнем.
        explain: '$\upsilon_{кв} = \sqrt{\frac{3RT}{\mu}}$, $\sqrt4 = 2$.'
        f: [6]
        src: m06
      - type: single
        cat: theory
        q: Какое значение абсолютной температуры невозможно?
        opts: ['−5 К', '1 К', '273 К', '1000 К']
        ans: a
        hint: Посмотрите, в каком интервале лежит T.
        explain: '$T \in (0;\infty)$: отрицательных абсолютных температур не бывает.'
        src: m05
      - type: numeric
        cat: problem
        q: 'Найдите универсальную газовую постоянную $R = N_A k$ при $N_A = 6{,}02\cdot10^{23}$ и $k = 1{,}38\cdot10^{-23}$.'
        num: { value: 8.31, unit: 'Дж/(моль·К)', check: '6.02e23*1.38e-23' }
        hint: Перемножьте мантиссы, степени десяти сократятся.
        explain: '$R = N_A k \approx 8{,}31$.'
        f: [5]
        sol: { calc: 'R = 6{,}02\cdot1{,}38 \approx 8{,}31', answer: '8,31' }
        src: m06

# ───────────────────────────────────────────────────────────────
  - id: mol-mk
    title: Уравнение Менделеева–Клапейрона. Плотность газа
    pages: [m06, m07]
    theory:
      - kind: law
        title: Уравнение состояния идеального газа
        body: Уравнение Менделеева–Клапейрона также называется уравнением состояния идеального газа.
        src: m06
      - kind: rule
        title: Молярный объём
        body: При нормальных условиях любой газ количеством 1 моль занимает объём, равный 22,4 литра.
        src: m06
      - kind: text
        title: Уравнение Клапейрона
        body: '$\nu = \text{const}$ — закрытая система; тогда $\frac{pV}{T} = \nu R = \text{const}$. В конспекте также записано «$\nu \ne \text{const}$ — закрытый сосуд» (см. замечание M06).'
        src: m06
        errata: [M06]
    formulas:
      - title: Уравнение Менделеева–Клапейрона
        tex: 'pV = \nu RT,\qquad pV = \frac{m}{\mu}RT'
        sym: [p, V, nu_mol, R_gas, T_abs, m, mu_mol]
        boxed: true
        src: m06
      - title: Вывод формулы p = nkT
        tex: 'pV = \frac{m}{\mu}N_A kT = NkT\;\Rightarrow\; p = \frac{N}{V}kT = nkT'
        sym: [p, V, N_mol, k_B, T_abs, n_conc]
        boxed: true
        src: m06
      - title: Молярный объём
        tex: 'V_m = 22{,}4\ \text{л/моль}'
        sym: [V_m]
        cond: нормальные условия
        src: m06
      - title: Уравнение Клапейрона
        tex: '\frac{pV}{T} = \nu R = \text{const},\qquad \frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}'
        sym: [p, V, T_abs, nu_mol, R_gas]
        cond: '\(\nu = \text{const}\) (закрытая система)'
        boxed: true
        src: m06
      - title: Плотность идеального газа
        tex: '\rho = \frac{\mu p}{RT}'
        sym: [rho, mu_mol, p, R_gas, T_abs]
        boxed: true
        src: m07
    examples:
      - title: Задача по графику p(V)
        given: 'Точки на графике: ① $(V = 1;\ p = 1)$, ② $(4;\ 4)$, ③ $(6;\ 2)$ в клетках; $T_1 = 100$ К'
        steps: ['Значения p и V ставим по координатам', '$\frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}$ ⇒ $T_2 = 100\cdot4\cdot4 = 1600$ К', '$\frac{p_1V_1}{T_1} = \frac{p_3V_3}{T_3}$ ⇒ $T_3 = 1200$ К']
        src: m07
    questions:
      - type: numeric
        cat: problem
        q: 2 моль газа при температуре 250 К занимают объём 0,0831 м³. Найдите давление ($R = 8{,}31$).
        num: { value: 50000, unit: 'Па', check: '2*8.31*250/0.0831' }
        hint: '$pV = \nu RT$.'
        explain: Уравнение Менделеева–Клапейрона.
        f: [1]
        sol: { given: ['ν = 2 моль', 'T = 250 К', 'V = 0,0831 м³'], find: 'p', formula: 'p = \frac{\nu RT}{V}', calc: 'p = \frac{2\cdot8{,}31\cdot250}{0{,}0831} = 5\cdot10^4', answer: '5·10⁴ Па' }
        src: m06
      - type: numeric
        cat: problem
        q: Какой объём при нормальных условиях занимают 3 моль газа? Ответ в литрах.
        num: { value: 67.2, unit: 'л', check: '3*22.4' }
        hint: 1 моль любого газа при н. у. занимает 22,4 л.
        explain: '$V = \nu V_m$.'
        f: [3]
        sol: { calc: 'V = 3\cdot22{,}4 = 67{,}2', answer: '67,2 л' }
        src: m06
      - type: numeric
        cat: problem
        q: 'Газ занимал 2 л при 10⁵ Па и 300 К. Его нагрели до 450 К, давление стало 2·10⁵ Па. Найдите новый объём в литрах.'
        num: { value: 1.5, unit: 'л', check: '1e5*2*450/(300*2e5)' }
        hint: Количество газа не меняется — используйте уравнение Клапейрона.
        explain: '$V_2 = \frac{p_1V_1T_2}{T_1p_2}$.'
        f: [4]
        sol: { given: ['p₁ = 10⁵ Па, V₁ = 2 л, T₁ = 300 К', 'p₂ = 2·10⁵ Па, T₂ = 450 К'], find: 'V₂', formula: '\frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}', calc: 'V_2 = \frac{10^5\cdot2\cdot450}{300\cdot2\cdot10^5} = 1{,}5', answer: '1,5 л' }
        src: m06
      - type: numeric
        cat: problem
        q: 'На графике p(V) газ переходит из точки ① (V = 1, p = 1 клетка) в точку ② (V = 4, p = 4 клетки). В точке ① температура 100 К. Найдите температуру в точке ②.'
        num: { value: 1600, unit: 'К', check: '100*4*4/(1*1)' }
        hint: Значения p и V ставим по координатам в уравнение Клапейрона.
        explain: Задача со стр. m07 конспекта.
        f: [4]
        sol: { formula: '\frac{p_1V_1}{T_1} = \frac{p_2V_2}{T_2}', calc: 'T_2 = 100\cdot\frac{4\cdot4}{1\cdot1} = 1600', answer: '1600 К' }
        src: m07
      - type: numeric
        cat: problem
        q: Найдите плотность кислорода ($\mu = 32\cdot10^{-3}$ кг/моль) при давлении $10^5$ Па и температуре 300 К.
        num: { value: 1.284, unit: 'кг/м³', check: '32e-3*1e5/(8.31*300)' }
        hint: В конспекте выведена формула плотности идеального газа.
        explain: '$\rho = \frac{\mu p}{RT}$.'
        f: [5]
        sol: { given: ['μ = 32·10⁻³ кг/моль', 'p = 10⁵ Па', 'T = 300 К'], find: 'ρ', formula: '\rho = \frac{\mu p}{RT}', calc: '\rho = \frac{32\cdot10^{-3}\cdot10^5}{8{,}31\cdot300} \approx 1{,}28', answer: '≈ 1,28 кг/м³' }
        src: m07
      - type: single
        cat: theory
        q: Как ещё называют уравнение Менделеева–Клапейрона?
        opts: ['Уравнение состояния идеального газа', 'Основное уравнение МКТ', 'Уравнение Бойля–Мариотта', 'Первый закон термодинамики']
        ans: a
        hint: Фраза записана сразу под формулой в рамке.
        explain: Уравнение Менделеева–Клапейрона также называется уравнением состояния идеального газа.
        src: m06

# ───────────────────────────────────────────────────────────────
  - id: mol-isotherm
    title: Изопроцессы. Изотермический процесс
    pages: [m07, m08]
    theory:
      - kind: text
        title: Изопроцессы
        body: 'Изопроцессы получают из уравнения Менделеева–Клапейрона при $\nu = \text{const}$ (закрытая система): $\frac{pV}{T} = \nu R = \text{const}$. Если ещё одна величина постоянна, связь остаётся между двумя другими.'
        src: m07
      - kind: text
        title: Изотермический процесс
        fig: isotherm
        body: 'При $T = \text{const}$: если объём увеличивается, давление уменьшается (V↑ — p↓); если объём уменьшается, давление растёт (V↓ — p↑). График $p(V)$ — гипербола (как $y = \frac kx$), называется изотермой.'
        src: m07
      - kind: rule
        title: Сравнение изотерм
        body: 'Чем изотерма (точка на диаграмме p–V) дальше от начала координат, тем больше температура: $T_3 > T_2 > T_1$. На графиках $p(T)$ и $V(T)$ изотермы — вертикальные прямые, на $T(p)$ и $T(V)$ — горизонтальные.'
        src: m08
    formulas:
      - title: Закон Бойля–Мариотта
        tex: 'pV = \text{const},\qquad p_1V_1 = p_2V_2'
        sym: [p, V]
        cond: '\(T = \text{const}\), \(\nu = \text{const}\)'
        boxed: true
        src: m07
      - title: Изотерма
        tex: 'p(V) = \frac{\text{const}}{V},\qquad V(p) = \frac{\text{const}}{p}'
        sym: [p, V]
        src: [m07, m08]
      - title: Изменение давления и объёма
        tex: 'p_1V_1 = (p_1 - \Delta p)(V_1 + \Delta V),\qquad p_1V_1 = (p_1 + \Delta p)(V_1 - \Delta V)'
        sym: [p, V]
        cond: расширение / сжатие при T = const
        src: m07
    questions:
      - type: numeric
        cat: problem
        q: 'Газ при давлении 10⁵ Па занимал 6 л. Его изотермически сжали до 2 л. Найдите новое давление.'
        num: { value: 300000, unit: 'Па', check: '1e5*6/2' }
        hint: При T = const произведение pV не меняется.
        explain: Закон Бойля–Мариотта.
        f: [1]
        sol: { given: ['p₁ = 10⁵ Па', 'V₁ = 6 л', 'V₂ = 2 л'], find: 'p₂', formula: 'p_1V_1 = p_2V_2', calc: 'p_2 = \frac{10^5\cdot6}{2} = 3\cdot10^5', answer: '3·10⁵ Па' }
        src: m07
      - type: numeric
        cat: problem
        q: 'При изотермическом расширении объём газа увеличился на 2 л, а давление уменьшилось со 100 кПа до 80 кПа. Найдите начальный объём в литрах.'
        num: { value: 8, unit: 'л', check: '80*2/(100-80)' }
        hint: '$p_1V_1 = (p_1 - \Delta p)(V_1 + \Delta V)$ — подставьте числа и решите уравнение относительно $V_1$.'
        explain: '$100V_1 = 80(V_1 + 2)$ ⇒ $20V_1 = 160$.'
        f: [3]
        sol: { given: ['p₁ = 100 кПа', 'p₂ = 80 кПа', 'ΔV = 2 л'], find: 'V₁', formula: 'p_1V_1 = (p_1-\Delta p)(V_1+\Delta V)', calc: '100V_1 = 80(V_1+2) \Rightarrow V_1 = 8', answer: '8 л' }
        src: m07
      - type: single
        cat: theory
        q: Как называется закон, описывающий изотермический процесс?
        opts: ['Закон Бойля–Мариотта', 'Закон Гей-Люссака', 'Закон Шарля', 'Закон Паскаля']
        ans: a
        hint: Подчёркнутые фамилии стоят рядом с формулой $pV = \text{const}$.
        explain: '$pV = \text{const}$ при $T = \text{const}$ — уравнение Бойля–Мариотта.'
        f: [1]
        src: m07
      - type: single
        cat: theory
        q: Как выглядит график изотермического процесса в координатах p–V?
        opts: ['Гипербола', 'Прямая через начало координат', 'Горизонтальная прямая', 'Парабола']
        ans: a
        hint: '$p = \frac{\text{const}}{V}$ похоже на $y = \frac kx$.'
        explain: Изотерма в координатах p–V — гипербола.
        f: [2]
        src: m07
      - type: single
        cat: theory
        q: На диаграмме p–V построены три изотермы. У какой из них температура наибольшая?
        opts: ['У самой дальней от начала координат', 'У самой близкой к началу координат', 'У всех одинаковая', 'Определить нельзя']
        ans: a
        hint: Чем больше произведение pV, тем больше T.
        explain: 'В конспекте: чем точка дальше от центра, тем больше там температура; $T_3 > T_2 > T_1$.'
        src: m08

# ───────────────────────────────────────────────────────────────
  - id: mol-isobar
    title: Изобарный процесс
    pages: [m09]
    theory:
      - kind: text
        title: Изобарный процесс
        fig: isobar
        body: 'При $p = \text{const}$ объём прямо пропорционален температуре: $V(T) = T\cdot\text{const}$ (как $y = kx$). График $V(T)$ — прямая через начало координат, называется изобарой.'
        src: m09
      - kind: rule
        title: Сравнение изобар
        body: 'На графике $V(T)$ чем точка дальше от оси V (ближе к оси T), тем больше давление: $p_3 > p_2 > p_1$. На графиках $p(T)$, $p(V)$ изобары — горизонтальные прямые, на $T(p)$, $V(p)$ — вертикальные.'
        src: m09
    formulas:
      - title: Закон Гей-Люссака
        tex: '\frac{V}{T} = \text{const},\qquad \frac{V_1}{T_1} = \frac{V_2}{T_2} = \frac{\Delta V}{\Delta T}'
        sym: [V, T_abs]
        cond: '\(p = \text{const}\), \(\nu = \text{const}\)'
        boxed: true
        src: m09
      - title: Изобара
        tex: 'V(T) = T\cdot\text{const}'
        sym: [V, T_abs]
        src: m09
      - title: Тождество изобарного процесса
        tex: 'p\Delta V = \nu R\Delta T'
        sym: [p, V, nu_mol, R_gas, T_abs]
        boxed: true
        src: m09
    questions:
      - type: numeric
        cat: problem
        q: Газ занимал 3 л при 300 К. Его изобарно нагрели до 400 К. Найдите новый объём в литрах.
        num: { value: 4, unit: 'л', check: '3*400/300' }
        hint: При p = const отношение V/T постоянно.
        explain: Закон Гей-Люссака.
        f: [1]
        sol: { given: ['V₁ = 3 л', 'T₁ = 300 К', 'T₂ = 400 К'], find: 'V₂', formula: '\frac{V_1}{T_1} = \frac{V_2}{T_2}', calc: 'V_2 = \frac{3\cdot400}{300} = 4', answer: '4 л' }
        src: m09
      - type: numeric
        cat: problem
        q: 2 моль газа изобарно нагрели на 50 К при давлении $10^5$ Па. На сколько литров увеличился объём?
        num: { value: 8.31, unit: 'л', check: '2*8.31*50/1e5*1000' }
        hint: Используйте тождество изобарного процесса и переведите м³ в литры.
        explain: '$\Delta V = \frac{\nu R\Delta T}{p}$.'
        f: [3]
        sol: { given: ['ν = 2 моль', 'ΔT = 50 К', 'p = 10⁵ Па'], find: 'ΔV', formula: 'p\Delta V = \nu R\Delta T', calc: '\Delta V = \frac{2\cdot8{,}31\cdot50}{10^5} = 8{,}31\cdot10^{-3}\ \text{м}^3', answer: '8,31 л' }
        src: m09
      - type: single
        cat: theory
        q: Чьим именем назван закон изобарного процесса?
        opts: ['Гей-Люссака', 'Бойля–Мариотта', 'Шарля', 'Клапейрона']
        ans: a
        hint: Подчёркнутая фамилия рядом с формулой $\frac VT = \text{const}$.
        explain: '$\frac VT = \text{const}$ — уравнение Гей-Люссака.'
        f: [1]
        src: m09
      - type: single
        cat: theory
        q: На графике V(T) построены изобары с разным наклоном. У какой давление больше?
        opts: ['У той, что ближе к оси T (наклон меньше)', 'У той, что ближе к оси V (наклон больше)', 'У всех одинаковое', 'Наклон не связан с давлением']
        ans: a
        hint: 'Из $V = \frac{\nu R}{p}T$: больше давление — меньше наклон.'
        explain: 'В конспекте: чем точка дальше от оси V, тем больше там давление; $p_3 > p_2 > p_1$.'
        src: m09
      - type: matching
        cat: theory
        q: Сопоставьте изопроцесс и закон.
        pairs:
          - ['Изотермический (T = const)', 'Закон Бойля–Мариотта']
          - ['Изобарный (p = const)', 'Закон Гей-Люссака']
          - ['Изохорный (V = const)', 'Закон Шарля']
        hint: Изохорный процесс — следующая тема, стр. m10.
        explain: 'Стр. m07, m09, m10 конспекта.'
        src: [m07, m09, m10]

