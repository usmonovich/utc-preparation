# ───────────────────────────────────────────────────────────────
  - id: fl-archimedes
    title: Закон Архимеда. Вес тела в жидкости
    pages: [p22L, p22R, p23L]
    theory:
      - kind: law
        title: Закон Архимеда
        body: 'Любое тело, погружённое в жидкость или газ, вытесняет из сосуда жидкость или газ объёмом, равным объёму погружённой **части** тела. Пример: у тела объёмом 10 л погружено 2 л — вытекает 2 л жидкости.'
        src: p22L
      - kind: definition
        title: Сила Архимеда
        body: Выталкивающая сила, действующая со стороны жидкости или газа на погружённое тело, называется силой Архимеда. Обозначение «в.ж» — вытесненная жидкость (газ).
        src: p22R
      - kind: text
        title: Вес тела в жидкости
        fig: archimedes
        body: '$P_0$ — вес тела в воздухе (вакууме); $P\prime$ — вес тела в жидкости. Если тело висит на нити в жидкости — $T = P\prime$; если лежит на дне — $N = P\prime$.'
        src: [p22R, p23L]
    formulas:
      - title: Объём вытесненной жидкости
        tex: "V_т' = V_{в.ж}"
        sym: [V_sub, V_disp]
        boxed: true
        src: p22L
      - title: Сила Архимеда
        tex: "F_A = \\rho_ж g V_т'"
        sym: [F_A, rho_l, g, V_sub]
        boxed: true
        src: p22R
      - title: Вес вытесненной жидкости равен силе Архимеда
        tex: "P_{в.ж} = m_{в.ж}g = \\rho_ж V_{в.ж} g = \\rho_ж V_т' g = F_A"
        sym: [F_A, rho_l, V_disp, V_sub, g]
        boxed: true
        src: p22R
      - title: Вес тела в воздухе
        tex: 'P_0 = mg'
        sym: [P0, m, g]
        boxed: true
        src: p22R
      - title: Вес тела в жидкости
        tex: "P' = mg - F_A = mg\\left(1 - \\frac{\\rho_ж}{\\rho_т}\\right) = V_т g(\\rho_т - \\rho_ж)"
        sym: [P_l, m, g, F_A, rho_l, rho_b, V_b]
        cond: тело полностью погружено
        boxed: true
        src: p22R
    questions:
      - type: numeric
        cat: problem
        q: Тело объёмом 0,002 м³ полностью погружено в воду ($\rho = 1000$ кг/м³, $g = 10$ м/с²). Найдите силу Архимеда.
        num: { value: 20, unit: 'Н', check: '1000*10*0.002' }
        hint: Тело погружено полностью, значит $V_т\prime = V_т$.
        explain: '$F_A = \rho_ж g V_т\prime$.'
        f: [2]
        sol: { given: ['V = 0,002 м³', 'ρж = 1000 кг/м³'], find: 'FA', formula: "F_A = \\rho_ж g V_т'", calc: 'F_A = 1000\cdot10\cdot0{,}002 = 20', answer: '20 Н' }
        src: p22R
      - type: numeric
        cat: problem
        q: Алюминиевое тело массой 2,7 кг ($\rho_т = 2700$ кг/м³) полностью погружено в воду. Найдите вес тела в воде ($g = 10$ м/с²).
        num: { value: 17, unit: 'Н', check: '2.7*10*(1-1000/2700)' }
        hint: '$P\prime = mg\left(1 - \frac{\rho_ж}{\rho_т}\right)$.'
        explain: 'Сила Архимеда: $F_A = 10$ Н, вес в воздухе 27 Н.'
        f: [5]
        sol: { given: ['m = 2,7 кг', 'ρт = 2700 кг/м³', 'ρж = 1000 кг/м³'], find: "P'", formula: "P' = mg\\left(1-\\frac{\\rho_ж}{\\rho_т}\\right)", calc: "P' = 27\\cdot\\left(1 - \\frac{1000}{2700}\\right) = 27 - 10 = 17", answer: '17 Н' }
        src: p22R
      - type: single
        cat: theory
        q: Чему равен вес вытесненной телом жидкости?
        opts: ['Силе Архимеда', 'Весу тела в воздухе', 'Весу тела в жидкости', 'Нулю']
        ans: a
        hint: Посмотрите на формулу в рамке на стр. 22R.
        explain: '$P_{в.ж} = F_A$.'
        f: [3]
        src: p22R
      - type: numeric
        cat: theory
        q: Тело объёмом 10 л погружено в жидкость так, что под поверхностью находятся 2 л. Сколько литров жидкости оно вытеснило?
        num: { value: 2, unit: 'л', check: '2' }
        hint: Закон Архимеда говорит об объёме погружённой **части** тела.
        explain: '$V_т\prime = V_{в.ж}$ — пример со стр. 22L.'
        f: [1]
        src: p22L
      - type: text
        cat: theory
        q: Сформулируйте закон Архимеда (как в конспекте).
        ref: Любое тело, погружённое в жидкость или газ, вытесняет из сосуда жидкость или газ объёмом, равным объёму погружённой части тела.
        criteria: ['Жидкость или газ', 'Объём вытесненной жидкости равен объёму погружённой части тела']
        hint: Начинается со слов «Любое тело, погружённое…»
        explain: Закон Архимеда со стр. 22L; сила Архимеда $F_A = \rho_ж g V_т\prime$.
        src: p22L

# ───────────────────────────────────────────────────────────────
  - id: fl-floating
    title: Плавание тел. Подъёмная сила. Воздушный шар
    pages: [p23L, p23R, p24L, p24R, p25L]
    theory:
      - kind: rule
        title: Вывод I — утопление
        body: Когда плотность тела больше, чем плотность жидкости, то данное тело в этой жидкости утонет и будет лежать на дне сосуда. При этом из сосуда вытесняется жидкость, равная объёму тела.
        src: p24L
      - kind: rule
        title: Вывод II — плавание
        fig: floating
        body: Когда плотность тела меньше, чем плотность жидкости, то данное тело в этой жидкости всплывает и будет свободно плавать на поверхности жидкости. При этом определённая часть тела будет в жидкости, а остальная часть — на поверхности. В этом случае из сосуда вытесняется жидкость, равная массе тела.
        src: p24L
      - kind: note
        title: Замечания к страницам 23L–23R
        body: 'Соотношение $k = \frac{\rho_т}{\rho_ж}$ относится к телу, свободно плавающему на поверхности (E11). В конспекте записано «$k \sim \rho_т,\ \rho_ж$» (E12).'
        src: [p23L, p23R]
        errata: [E11, E12]
      - kind: text
        title: Воздушный шар
        body: 'Воздушный шар поднимает **воздух**, а не газ: $\rho_{воздух} > \rho_{газ}$. $\rho_{воздух} = 1{,}29$ кг/м³.'
        src: p25L
    formulas:
      - title: Утопление
        tex: 'ma = F_{рез} = mg - F_A,\qquad a = g\left(1 - \frac{\rho_ж}{\rho_т}\right)'
        sym: [m, a, F_res, g, F_A, rho_l, rho_b]
        cond: '\(\rho_т > \rho_ж\); a — ускорение погружения'
        boxed: true
        src: p23L
      - title: Погружённая часть тела
        tex: "\\frac{V_т'}{V_т} = \\frac{\\rho_т}{\\rho_ж},\\qquad k = \\frac{\\rho_т}{\\rho_ж},\\qquad k = \\frac{V_т'}{V_т}"
        sym: [V_sub, V_b, rho_b, rho_l, k_sub]
        boxed: true
        src: p23L
        errata: [E11]
      - title: Всплытие
        tex: 'ma = F_A - mg,\qquad a = g\left(\frac{\rho_ж}{\rho_т} - 1\right)'
        sym: [m, a, F_A, g, rho_l, rho_b]
        cond: '\(\rho_т < \rho_ж\)'
        boxed: true
        src: p23R
      - title: Тело свободно плавает
        tex: 'mg = F_A = P_{в.ж},\qquad m_т = m_{в.ж}'
        sym: [m, g, F_A]
        boxed: true
        src: p23R
      - title: Подъёмная сила
        tex: 'F_{под} = F_A - mg = (\rho_ж - \rho_т)V_т g = mg\left(\frac{\rho_ж}{\rho_т} - 1\right)'
        sym: [F_lift, F_A, m, g, rho_l, rho_b, V_b]
        boxed: true
        src: p24R
      - title: Максимальная масса груза
        tex: 'm_{max} = (\rho_ж - \rho_т)V_т = \rho_ж V_т - m = m\left(\frac{\rho_ж}{\rho_т} - 1\right)'
        sym: [m_max, rho_l, rho_b, V_b, m]
        src: p24R
      - title: Подъёмная сила корабля
        tex: 'F_{под} = \rho_ж g V - mg'
        sym: [F_lift, rho_l, g, V, m]
        cond: V — объём корабля ниже ватерлинии
        boxed: true
        src: p24R
      - title: Подъёмная сила воздушного шара
        tex: 'F_{под} = (\rho_{воздух} - \rho_{газ})\cdot g V_{шар} - m_{шар} g'
        sym: [F_lift, g, V, m]
        boxed: true
        src: p25L
    examples:
      - title: Тело 2 кг объёмом 1 л в воде и в ртути
        given: '$m = 2$ кг, $V = 1$ л'
        steps: ['$\rho = \frac{m}{V} = \frac{2}{10^{-3}} = 2000$ кг/м³', 'Вода ($\rho = 1000$): $\rho_т > \rho_ж$ — тело на дне, $V_{в.ж} = V_т = 1$ л', 'Ртуть ($\rho = 13\,600$): $\rho_т < \rho_ж$ — тело плавает, $m_{в.ж} = m_т = 2$ кг']
        src: p24L
    questions:
      - type: numeric
        cat: problem
        q: Тело плотностью 800 кг/м³ свободно плавает в воде. Какая часть его объёма погружена? Ответ в процентах.
        num: { value: 80, unit: '%', check: '800/1000*100' }
        hint: '$k = \frac{\rho_т}{\rho_ж}$ (для свободно плавающего тела).'
        explain: Погружённая часть равна отношению плотностей.
        f: [2]
        sol: { given: ['ρт = 800 кг/м³', 'ρж = 1000 кг/м³'], find: 'k', formula: 'k = \frac{\rho_т}{\rho_ж}', calc: 'k = 0{,}8 = 80\%', answer: '80 %' }
        src: p23L
      - type: numeric
        cat: problem
        q: Тело плотностью 2000 кг/м³ отпустили в воде. С каким ускорением оно начнёт тонуть (без учёта сопротивления, $g = 10$ м/с²)?
        num: { value: 5, unit: 'м/с²', check: '10*(1-1000/2000)' }
        hint: '$\rho_т > \rho_ж$ — тело тонет; формула ускорения погружения в рамке на стр. 23L.'
        explain: '$a = g\left(1 - \frac{\rho_ж}{\rho_т}\right)$.'
        f: [1]
        sol: { given: ['ρт = 2000 кг/м³', 'ρж = 1000 кг/м³'], find: 'a', formula: 'a = g\left(1-\frac{\rho_ж}{\rho_т}\right)', calc: 'a = 10\cdot0{,}5 = 5', answer: '5 м/с²' }
        src: p23L
      - type: numeric
        cat: problem
        q: Тело плотностью 500 кг/м³ удерживали под водой и отпустили. С каким ускорением оно начнёт всплывать ($g = 10$ м/с²)?
        num: { value: 10, unit: 'м/с²', check: '10*(1000/500-1)' }
        hint: '$\rho_т < \rho_ж$ — всплытие.'
        explain: '$a = g\left(\frac{\rho_ж}{\rho_т} - 1\right)$.'
        f: [3]
        sol: { given: ['ρт = 500 кг/м³'], find: 'a', formula: 'a = g\left(\frac{\rho_ж}{\rho_т}-1\right)', calc: 'a = 10\cdot(2-1) = 10', answer: '10 м/с²' }
        src: p23R
      - type: numeric
        cat: problem
        q: Плот объёмом 0,5 м³ сделан из дерева плотностью 600 кг/м³. Какую максимальную массу груза он может удержать на воде?
        num: { value: 200, unit: 'кг', check: '(1000-600)*0.5' }
        hint: '$m_{max} = (\rho_ж - \rho_т)V_т$.'
        explain: Максимальная масса груза для плавающего тела.
        f: [6]
        sol: { given: ['V = 0,5 м³', 'ρт = 600 кг/м³'], find: 'm_max', formula: 'm_{max} = (\rho_ж-\rho_т)V_т', calc: 'm_{max} = 400\cdot0{,}5 = 200', answer: '200 кг' }
        src: p24R
      - type: numeric
        cat: problem
        q: Воздушный шар объёмом 100 м³ заполнен газом плотностью 0,18 кг/м³; масса оболочки 20 кг. Найдите подъёмную силу ($\rho_{воздух} = 1{,}29$ кг/м³, $g = 10$ м/с²).
        num: { value: 910, unit: 'Н', check: '(1.29-0.18)*10*100-20*10' }
        hint: Формула подъёмной силы шара в рамке на стр. 25L.
        explain: '$F_{под} = (\rho_{возд} - \rho_{газ})gV - m_{шар}g$.'
        f: [8]
        sol: { given: ['V = 100 м³', 'ρгаз = 0,18 кг/м³', 'm = 20 кг'], find: 'Fпод', formula: 'F_{под} = (\rho_{воздух}-\rho_{газ})gV - m_{шар}g', calc: 'F_{под} = 1{,}11\cdot10\cdot100 - 200 = 910', answer: '910 Н' }
        src: p25L
      - type: single
        cat: theory
        q: Тело плотностью меньше плотности жидкости свободно плавает. Какое количество жидкости оно вытесняет?
        opts: ['Равное массе тела', 'Равное объёму тела', 'Равное половине объёма тела', 'Не вытесняет']
        ans: a
        hint: Сравните выводы I и II на стр. 24L.
        explain: 'Вывод II: при плавании вытесняется жидкость, равная **массе** тела ($m_т = m_{в.ж}$); при утоплении — равная **объёму** тела.'
        f: [4]
        src: p24L
      - type: single
        cat: theory
        q: Тело массой 2 кг и объёмом 1 л опустили в ртуть ($\rho = 13\,600$ кг/м³). Что произойдёт?
        opts: ['Тело будет плавать, вытеснив 2 кг ртути', 'Тело утонет, вытеснив 1 л ртути', 'Тело утонет, вытеснив 2 кг ртути', 'Тело будет плавать, вытеснив 1 л ртути']
        ans: a
        hint: Плотность тела 2000 кг/м³. Сравните с плотностью ртути.
        explain: '$\rho_т < \rho_ж$ — тело плавает, $m_{в.ж} = m_т = 2$ кг (пример со стр. 24L).'
        src: p24L

# ───────────────────────────────────────────────────────────────
  - id: fl-flow
    title: Движение жидкости в трубах. Уравнение непрерывности. Закон Бернулли
    pages: [p40L, p40R]
    theory:
      - kind: text
        title: Уравнение непрерывности
        fig: continuity
        body: 'В горизонтальной трубе с участками сечений $S_1 > S_2 > S_3$ объём жидкости, проходящий за единицу времени, постоянен: $\frac{V}{t} = \text{const}$, поэтому $S\upsilon = \text{const}$ и $\upsilon_1 < \upsilon_2 < \upsilon_3$. Давление по манометрическим трубкам: $p_1 > p_2 > p_3$.'
        src: p40R
      - kind: law
        title: Закон Бернулли
        body: 'Полное давление постоянно: $p_{полное} = \text{const}$. В конспекте: $\rho g h + \frac{\rho\upsilon^2}{2} = \text{const}$, где $\rho g h$ — гидростатическое давление (высота столба в манометрической трубке), $\frac{\rho\upsilon^2}{2}$ — гидродинамическое давление.'
        src: p40R
    formulas:
      - title: Гидродинамическое давление
        tex: 'p = \frac{\rho\upsilon^2}{2}'
        sym: [p_dyn, rho, v]
        boxed: true
        src: p40L
      - title: Масса жидкости, прошедшей через сечение
        tex: 'V = S\upsilon t,\qquad m = \rho S\upsilon t'
        sym: [V, S_area, v, t, m, rho]
        boxed: true
        src: p40L
      - title: Мощность потока
        tex: 'N = \frac{m\upsilon^2/2}{t} = \frac{\rho S\upsilon^3}{2}'
        sym: [N_pow, rho, S_area, v]
        cond: '\(N \sim \upsilon^3\)'
        boxed: true
        src: p40R
      - title: Уравнение непрерывности
        tex: 'S\upsilon = \text{const}'
        sym: [S_area, v]
        src: p40R
      - title: Закон Бернулли (как в конспекте)
        tex: '\rho g h + \frac{\rho\upsilon^2}{2} = \text{const}'
        sym: [rho, g, h, v]
        src: p40R
    questions:
      - type: numeric
        cat: problem
        q: Сечение трубы уменьшилось в 3 раза. Во сколько раз увеличилась скорость жидкости?
        num: { value: 3, unit: 'раз', check: '3' }
        hint: '$S\upsilon = \text{const}$.'
        explain: Скорость обратно пропорциональна площади сечения.
        f: [4]
        sol: { calc: 'S_1\upsilon_1 = S_2\upsilon_2;\ S_2 = \frac{S_1}{3} \Rightarrow \upsilon_2 = 3\upsilon_1', answer: 'в 3 раза' }
        src: p40R
      - type: numeric
        cat: problem
        q: Вода ($\rho = 1000$ кг/м³) течёт по трубе со скоростью 4 м/с. Найдите гидродинамическое давление.
        num: { value: 8000, unit: 'Па', check: '1000*16/2' }
        hint: '$p = \frac{\rho\upsilon^2}{2}$.'
        explain: Гидродинамическое давление.
        f: [1]
        sol: { given: ['ρ = 1000 кг/м³', 'υ = 4 м/с'], find: 'p', formula: 'p = \frac{\rho\upsilon^2}{2}', calc: 'p = \frac{1000\cdot16}{2} = 8000', answer: '8000 Па' }
        src: p40L
      - type: numeric
        cat: problem
        q: Скорость потока увеличили в 2 раза при том же сечении. Во сколько раз выросла мощность потока?
        num: { value: 8, unit: 'раз', check: '2**3' }
        hint: '$N \sim \upsilon^3$.'
        explain: '$2^3 = 8$.'
        f: [3]
        sol: { given: ['υ₂ = 2υ₁', 'S = const'], find: 'N₂/N₁', formula: 'N = \frac{\rho S\upsilon^3}{2}', calc: '\frac{N_2}{N_1} = \left(\frac{\upsilon_2}{\upsilon_1}\right)^3 = 2^3 = 8', answer: 'в 8 раз' }
        src: p40R
      - type: numeric
        cat: problem
        q: Какая масса воды проходит за 10 с через сечение 0,01 м² при скорости 2 м/с ($\rho = 1000$ кг/м³)?
        num: { value: 200, unit: 'кг', check: '1000*0.01*2*10' }
        hint: '$m = \rho S\upsilon t$.'
        explain: Масса жидкости, прошедшей через сечение.
        f: [2]
        sol: { given: ['S = 0,01 м²', 'υ = 2 м/с', 't = 10 с'], find: 'm', formula: 'm = \rho S\upsilon t', calc: 'm = 1000\cdot0{,}01\cdot2\cdot10 = 200', answer: '200 кг' }
        src: p40L
      - type: single
        cat: theory
        q: В какой части горизонтальной трубы (широкой или узкой) давление по манометрической трубке больше?
        opts: ['В широкой', 'В узкой', 'Одинаково', 'Зависит от плотности жидкости']
        ans: a
        hint: 'В конспекте: $S_1 > S_2 > S_3$ и $p_1 > p_2 > p_3$.'
        explain: В узкой части скорость больше, гидродинамическое давление больше, а давление по манометру меньше (закон Бернулли).
        f: [4, 5]
        src: p40R
      - type: sequence
        cat: theory
        q: Расположите участки трубы ($S_1 > S_2 > S_3$) по возрастанию скорости жидкости.
