subsection: fluids
topics:

# ───────────────────────────────────────────────────────────────
  - id: fl-pressure
    title: Давление твёрдых тел
    pages: [p19R]
    theory:
      - kind: definition
        title: Давление
        body: Сила, действующая на единицу площади нормальным образом, называется давлением. Давление — это скалярная величина. Давление для твёрдых тел можно характеризовать как распределение силы по поверхности.
        src: p19R
      - kind: text
        title: Пример с бруском
        fig: pressure-brick
        body: 'Один и тот же брусок ① стоит на узкой грани, ② лежит на широкой: $F_1 = F_2 = mg$, но $p_1 > p_2$, так как $p \sim \frac{1}{S}$.'
        src: p19R
    formulas:
      - title: Давление
        tex: 'p = \frac{F}{S}'
        sym: [p, F, S_area]
        cond: сила направлена перпендикулярно поверхности; единицы Па = Н/м²
        boxed: true
        src: p19R
    questions:
      - type: numeric
        cat: problem
        q: Сила 600 Н действует перпендикулярно на площадь 0,03 м². Найдите давление.
        num: { value: 20000, unit: 'Па', check: '600/0.03' }
        hint: '$p = F/S$.'
        explain: Давление — сила на единицу площади.
        f: [1]
        sol: { given: ['F = 600 Н', 'S = 0,03 м²'], find: 'p', formula: 'p = \frac{F}{S}', calc: 'p = \frac{600}{0{,}03} = 20\,000', answer: '20 000 Па' }
        src: p19R
      - type: single
        cat: theory
        q: Один и тот же брусок сначала поставили на узкую грань, затем положили на широкую. Когда давление на опору больше?
        opts: ['Когда брусок стоит на узкой грани', 'Когда лежит на широкой грани', 'Одинаково', 'Зависит от материала опоры']
        ans: a
        hint: Сила (вес) одинакова, меняется площадь. $p \sim \frac{1}{S}$.
        explain: '$F_1 = F_2 = mg$; меньшая площадь — большее давление: $p_1 > p_2$.'
        f: [1]
        src: p19R
      - type: single
        cat: theory
        q: Давление — векторная или скалярная величина?
        opts: ['Скалярная', 'Векторная', 'Зависит от направления силы', 'Ни то ни другое']
        ans: a
        hint: Ответ прямо записан в определении на стр. 19R.
        explain: «Давление — это скалярная величина».
        src: p19R

# ───────────────────────────────────────────────────────────────
  - id: fl-hydrostatic
    title: Закон Паскаля. Гидростатическое давление
    pages: [p19R, p20L, p20R]
    theory:
      - kind: law
        title: Закон Паскаля
        fig: pascal
        body: Внешнее воздействие, переданное жидкости или газу, передаётся во всех направлениях на все точки одинаковым образом.
        src: p19R
      - kind: text
        title: Вывод формулы гидростатического давления
        body: 'Для сосуда с жидкостью высотой $h$ и площадью дна $S$: $p = \frac{F}{S}$, $F = mg = \rho Vg$, $V = S\cdot h$ ⇒ $p = \frac{\rho S h g}{S} = \rho g h$.'
        src: p19R
      - kind: rule
        title: Свойства гидростатического давления
        fig: hydrostatic
        body: |
          $p \sim \rho$, $p \sim g$, $p \sim h$; $h$ — глубина.
          Давление не зависит от формы сосуда: в узкой трубке, расширяющемся сосуде и изогнутой трубке при одинаковой высоте $p_1 = p_2 = p_3 = \rho g h$.
          Точки на одной глубине в маленьком и большом сосудах: $p_A = p_B$.
          Несмешивающиеся жидкости располагаются слоями: внизу более плотная ($\rho_1 > \rho_2$).
        src: p20L
    formulas:
      - title: Гидростатическое давление
        tex: 'p = \rho g h'
        sym: [p, rho, g, h]
        boxed: true
        src: [p19R, p20L]
      - title: Сила давления
        tex: 'F = p\cdot S'
        sym: [F, p, S_area]
        src: p20L
      - title: Сила давления на дно сосуда
        tex: 'F_{дно} = p_{дно}\cdot S_{дно};\qquad \text{цилиндр: } F_{дно} = \rho g h\cdot\pi R^2'
        sym: [F, p, S_area, rho, g, h, R]
        boxed: true
        src: p20L
      - title: Сила давления на боковую поверхность
        tex: 'F_{бок} = p_{бок}\cdot S_{бок};\qquad \text{цилиндр: } p_{бок} = \frac{\rho g h + 0}{2} = \frac{\rho g h}{2},\quad F_{бок} = \frac{\rho g h}{2}\cdot2\pi R\cdot h'
        sym: [F, p, S_area, rho, g, h, R]
        boxed: true
        src: p20R
    questions:
      - type: numeric
        cat: problem
        q: Найдите гидростатическое давление воды на глубине 5 м ($\rho = 1000$ кг/м³, $g = 10$ м/с²).
        num: { value: 50000, unit: 'Па', check: '1000*10*5' }
        hint: '$p = \rho g h$.'
        explain: Атмосферное давление здесь не учитывается — спрашивается только гидростатическое.
        f: [1]
        sol: { given: ['h = 5 м', 'ρ = 1000 кг/м³'], find: 'p', formula: 'p = \rho g h', calc: 'p = 1000\cdot10\cdot5 = 50\,000', answer: '50 000 Па' }
        src: p20L
      - type: single
        cat: theory
        q: Три сосуда разной формы (узкая трубка, расширяющийся сосуд, изогнутая трубка) заполнены водой до одинаковой высоты. Где давление на дно больше?
        opts: ['Везде одинаково', 'В расширяющемся сосуде', 'В узкой трубке', 'В изогнутой трубке']
        ans: a
        hint: От каких величин зависит $\rho g h$?
        explain: '$p_1 = p_2 = p_3 = \rho g h$ — форма сосуда не важна.'
        f: [1]
        src: p20L
      - type: numeric
        cat: problem
        q: Цилиндрический сосуд радиусом 0,1 м заполнен водой до высоты 0,5 м. Найдите силу давления на дно (π = 3,14, $g = 10$ м/с²).
        num: { value: 157, unit: 'Н', check: '1000*10*0.5*3.14*0.01' }
        hint: Сила давления = давление × площадь дна $\pi R^2$.
        explain: '$F_{дно} = \rho g h\cdot\pi R^2$.'
        f: [3]
        sol: { given: ['R = 0,1 м', 'h = 0,5 м', 'ρ = 1000 кг/м³'], find: 'Fдно', formula: 'F_{дно} = \rho g h\cdot\pi R^2', calc: 'F_{дно} = 5000\cdot3{,}14\cdot0{,}01 = 157', answer: '157 Н' }
        src: p20L
      - type: numeric
        cat: problem
        q: Для того же сосуда (R = 0,1 м, h = 0,5 м, вода) найдите силу давления на боковую поверхность (π = 3,14).
        num: { value: 785, unit: 'Н', check: '1000*10*0.5/2*2*3.14*0.1*0.5' }
        hint: Среднее давление на стенку — половина давления у дна; площадь стенки $2\pi R h$.
        explain: '$F_{бок} = \frac{\rho g h}{2}\cdot2\pi R h$.'
        f: [4]
        sol: { given: ['R = 0,1 м', 'h = 0,5 м'], find: 'Fбок', formula: 'F_{бок} = \frac{\rho g h}{2}\cdot2\pi R h', calc: 'F_{бок} = 2500\cdot2\cdot3{,}14\cdot0{,}1\cdot0{,}5 = 785', answer: '785 Н' }
        src: p20R
      - type: text
        cat: theory
        q: Сформулируйте закон Паскаля.
        ref: Внешнее воздействие, переданное жидкости или газу, передаётся во всех направлениях на все точки одинаковым образом.
        criteria: ['Речь о жидкости или газе', 'Передаётся во всех направлениях', 'Одинаково во все точки']
        hint: Ключевые слова — «во всех направлениях» и «одинаковым образом».
        explain: Закон Паскаля со стр. 19R.
        src: p19R

# ───────────────────────────────────────────────────────────────
  - id: fl-communicating
    title: Сообщающиеся сосуды
    pages: [p20R]
    theory:
      - kind: text
        title: Сообщающиеся сосуды
        fig: communicating
        body: 'В сосудах разной формы, соединённых снизу, однородная жидкость устанавливается на одном уровне. В U-образной трубке с двумя несмешивающимися жидкостями ($\rho_1 > \rho_2$) давления столбов на уровне границы равны — в конспекте подписано «по первому закону Ньютона».'
        src: p20R
    formulas:
      - title: Равновесие жидкостей в U-трубке
        tex: '\rho_1 g h_1 = \rho_2 g h_2,\qquad \rho_1 h_1 = \rho_2 h_2'
        sym: [rho, g, h]
        cond: '\(h \sim \frac{1}{\rho}\)'
        boxed: true
        src: p20R
    questions:
      - type: numeric
        cat: problem
        q: В U-образной трубке столб воды высотой 8 см уравновешивает столб масла высотой 10 см. Найдите плотность масла ($\rho_{воды} = 1000$ кг/м³).
        num: { value: 800, unit: 'кг/м³', check: '1000*8/10' }
        hint: '$\rho_1 h_1 = \rho_2 h_2$ — единицы высоты можно не переводить, они сокращаются.'
        explain: Равновесие жидкостей в сообщающихся сосудах.
        f: [1]
        sol: { given: ['h₁ = 8 см (вода)', 'h₂ = 10 см (масло)'], find: 'ρ₂', formula: '\rho_1 h_1 = \rho_2 h_2', calc: '\rho_2 = \frac{1000\cdot8}{10} = 800', answer: '800 кг/м³' }
        src: p20R
      - type: numeric
        cat: problem
        q: Столб воды какой высоты уравновесит в U-трубке столб ртути высотой 1 см? ($\rho_{ртути} = 13\,600$, $\rho_{воды} = 1000$ кг/м³.) Ответ в см.
        num: { value: 13.6, unit: 'см', check: '13600*1/1000' }
        hint: Высоты обратно пропорциональны плотностям.
        explain: '$h_{воды} = \frac{\rho_{рт} h_{рт}}{\rho_{воды}}$.'
        f: [1]
        sol: { given: ['h_рт = 1 см'], find: 'h_воды', formula: '\rho_1 h_1 = \rho_2 h_2', calc: 'h = \frac{13\,600\cdot1}{1000} = 13{,}6', answer: '13,6 см' }
        src: p20R
      - type: single
        cat: theory
        q: Как высота столба жидкости в сообщающихся сосудах зависит от её плотности?
        opts: ['Обратно пропорционально', 'Прямо пропорционально', 'Не зависит', 'Пропорционально квадрату плотности']
        ans: a
        hint: Посмотрите на соотношение под рамкой на стр. 20R.
        explain: '$h \sim \frac{1}{\rho}$.'
        f: [1]
        src: p20R

# ───────────────────────────────────────────────────────────────
  - id: fl-atmospheric
    title: Атмосферное давление
    pages: [p21L, p21R]
    theory:
      - kind: definition
        title: Атмосферное давление
        body: Воздушный слой Земли создаёт давление, это давление называется атмосферным.
        src: p21L
      - kind: text
        title: Опыт Торричелли
        fig: torricelli
        body: 'Значение атмосферного давления первым измерил итальянский учёный Торричелли с помощью опыта. В своём опыте Торричелли, наполнив трубку, которая закрыта с одного конца, опустил её открытым концом в сосуд, который был наполнен той же жидкостью. Для ртути высота столба — 760 мм; в конспекте также вычислены высоты столбов воды (10,3 м) и керосина (12,8 м — см. замечание E09).'
        src: p21L
        errata: [E09]
      - kind: rule
        title: Давление и высота
        body: 'Значение 760 мм рт. ст. — значение для уровня моря. На каждые 12 метров высоты или глубины значение атмосферного давления меняется на 1 мм рт. ст. Знак «+» — вниз (шахты, пещеры, каньоны), «−» — вверх (горы).'
        src: p21R
      - kind: text
        title: Давление в водоёмах
        body: 'Для рек, озёр, морей, океанов на глубине $h$: гидростатическое давление $p = \rho g h$; полное давление $p = \rho g h + p_{атм}$.'
        src: p21R
      - kind: text
        title: Единицы
        body: '1 атм $= 10^5$ Па $= 100$ кПа (округлённо, см. E10); 1 мм рт. ст. $= 133{,}3$ Па; 1 атм $= 760$ мм рт. ст.'
        src: p21R
        errata: [E10]
      - kind: note
        title: Плотность керосина (дополнено)
        body: 'В конспекте плотность керосина не записана (замечание E09). Справочное значение — 780–850 кг/м³ при 20 °C. С $\rho \approx 800$ кг/м³ высота столба $h = \frac{p_{атм}}{\rho g} = \frac{101\,396}{800\cdot9{,}81} \approx 12{,}9$ м — это согласуется с ответом конспекта 12,8 м.'
        src: p21L
        errata: [E09]
        web:
          - { title: 'Википедия: Керосин', url: 'https://ru.wikipedia.org/wiki/Керосин' }
    formulas:
      - title: Атмосферное давление (опыт Торричелли)
        tex: 'p_{ат} = \rho g h = 13\,600\cdot9{,}81\cdot0{,}76 = 101\,396{,}16\ \text{Па}'
        sym: [p_atm, rho, g, h]
        src: p21L
      - title: Высота столба жидкости в опыте Торричелли
        tex: 'h = \frac{p_{атм}}{\rho g};\qquad h_{вод} = 10{,}3\ \text{м},\quad h_{кер} = 12{,}8\ \text{м}'
        sym: [h, p_atm, rho, g]
        src: p21L
      - title: Давление на высоте или глубине h
        tex: 'p_h = \left(760 \pm \frac{h}{12}\right)\ \text{мм рт. ст.}'
        sym: [p_h, h]
        cond: '«+» — вниз (шахты, пещеры), «−» — вверх (горы); h в метрах'
        src: p21R
      - title: Полное давление в водоёме
        tex: 'p = \rho g h + p_{атм}'
        sym: [p, rho, g, h, p_atm]
        src: p21R
    questions:
      - type: numeric
        cat: problem
        q: Какое атмосферное давление (в мм рт. ст.) в шахте глубиной 240 м, если на поверхности 760 мм рт. ст.?
        num: { value: 780, unit: 'мм рт. ст.', check: '760+240/12' }
        hint: На каждые 12 м давление меняется на 1 мм рт. ст.; в шахте оно растёт.
        explain: '$p_h = 760 + \frac{h}{12}$.'
        f: [3]
        sol: { given: ['h = 240 м (вниз)'], find: 'p_h', formula: 'p_h = 760 + \frac{h}{12}', calc: 'p_h = 760 + 20 = 780', answer: '780 мм рт. ст.' }
        src: p21R
      - type: numeric
        cat: problem
        q: Какое атмосферное давление (в мм рт. ст.) на горе высотой 1200 м?
        num: { value: 660, unit: 'мм рт. ст.', check: '760-1200/12' }
        hint: При подъёме давление уменьшается.
        explain: '$p_h = 760 - \frac{h}{12}$.'
        f: [3]
        sol: { given: ['h = 1200 м (вверх)'], find: 'p_h', formula: 'p_h = 760 - \frac{h}{12}', calc: 'p_h = 760 - 100 = 660', answer: '660 мм рт. ст.' }
        src: p21R
      - type: numeric
        cat: problem
        q: Найдите полное давление на глубине 10 м в озере ($p_{атм} = 10^5$ Па, $\rho = 1000$ кг/м³, $g = 10$ м/с²).
        num: { value: 200000, unit: 'Па', check: '1000*10*10+1e5' }
        hint: «Полное давление» = гидростатическое + атмосферное.
        explain: '$p = \rho g h + p_{атм}$.'
        f: [4]
        sol: { given: ['h = 10 м', 'p_атм = 10⁵ Па'], find: 'p', formula: 'p = \rho g h + p_{атм}', calc: 'p = 100\,000 + 100\,000 = 200\,000', answer: '2·10⁵ Па' }
        src: p21R
      - type: numeric
        cat: problem
        q: Выразите давление 750 мм рт. ст. в паскалях.
        num: { value: 99975, unit: 'Па', check: '750*133.3' }
        hint: 1 мм рт. ст. = 133,3 Па.
        explain: Перевод единиц давления.
        sol: { calc: '750\cdot133{,}3 = 99\,975', answer: '99 975 Па' }
        src: p21R
      - type: single
        cat: theory
        q: Кто первым измерил значение атмосферного давления (по конспекту)?
        opts: ['Торричелли', 'Паскаль', 'Архимед', 'Ньютон']
        ans: a
        hint: Итальянский учёный, опыт с трубкой и ртутью.
        explain: Значение атмосферного давления первым измерил итальянский учёный Торричелли с помощью опыта.
        src: p21L
      - type: numeric
        cat: theory
        q: Какой высоты столб **воды** получился бы в опыте Торричелли (по конспекту)? Ответ в метрах.
        num: { value: 10.3, unit: 'м', check: '101396.16/(1000*9.81)' }
        hint: '$h = \frac{p_{атм}}{\rho g}$ при $p_{атм} \approx 101\,396$ Па.'
        explain: 'В конспекте: $h_{вод} = \frac{p_{атм}}{\rho_{вод} g} = 10{,}3$ м.'
        f: [2]
        sol: { calc: 'h = \frac{101\,396}{1000\cdot9{,}81} \approx 10{,}3', answer: '10,3 м' }
        src: p21L
      - type: numeric
        cat: problem
        q: 'Какой была бы высота столба керосина в опыте Торричелли при $\rho = 800$ кг/м³ ($p_{атм} = 101\,396$ Па, $g = 9{,}81$ м/с²)?'
        num: { value: 12.92, unit: 'м', check: '101396/(800*9.81)' }
        hint: '$h = \frac{p_{атм}}{\rho g}$.'
        explain: '$h = \frac{101\,396}{800\cdot9{,}81} \approx 12{,}9$ м — близко к 12,8 м в конспекте.'
        sol: { given: ['ρ = 800 кг/м³', 'p = 101 396 Па', 'g = 9,81 м/с²'], find: 'h', formula: 'h = \frac{p_{атм}}{\rho g}', calc: 'h = \frac{101\,396}{800\cdot9{,}81} \approx 12{,}9', answer: '≈ 12,9 м' }
        src: p21L
        web:
          - { title: 'Википедия: Керосин', url: 'https://ru.wikipedia.org/wiki/Керосин' }

# ───────────────────────────────────────────────────────────────
  - id: fl-press
    title: Гидравлический пресс
    pages: [p22L]
    theory:
      - kind: text
        title: Гидравлический пресс
        fig: hydraulic-press
        body: 'С помощью гидравлического пресса можно получить выигрыш в силе. Малый поршень площадью $S_1$ под действием силы $F_1$ опускается на $h_1$ со скоростью $\upsilon_1$; большой поршень площадью $S_2$ поднимается на $h_2$ со скоростью $\upsilon_2$, развивая силу $F_2$.'
        src: p22L
    formulas:
      - title: Условие равновесия пресса
        tex: 'p = \frac{F_1}{S_1} = \frac{F_2}{S_2}'
        sym: [p, F, S_area]
        boxed: true
        src: p22L
      - title: Перемещения и скорости поршней
        tex: 'F_1 h_1 = F_2 h_2,\qquad S_1\upsilon_1 = S_2\upsilon_2'
        sym: [F, h, S_area, v]
        boxed: true
        src: p22L
    questions:
      - type: numeric
        cat: problem
        q: Площадь малого поршня 10 см², большого — 500 см². На малый поршень действует сила 200 Н. Какую силу развивает большой поршень?
        num: { value: 10000, unit: 'Н', check: '200*500/10' }
        hint: '$\frac{F_1}{S_1} = \frac{F_2}{S_2}$ — площади можно не переводить в м², их отношение не изменится.'
        explain: Выигрыш в силе равен отношению площадей (50 раз).
        f: [1]
        sol: { given: ['S₁ = 10 см²', 'S₂ = 500 см²', 'F₁ = 200 Н'], find: 'F₂', formula: 'F_2 = F_1\frac{S_2}{S_1}', calc: 'F_2 = 200\cdot50 = 10\,000', answer: '10 000 Н' }
        src: p22L
      - type: numeric
        cat: problem
        q: В том же прессе (F₁ = 200 Н, F₂ = 10 000 Н) малый поршень опустился на 25 см. На сколько сантиметров поднялся большой?
        num: { value: 0.5, unit: 'см', check: '200*25/10000' }
        hint: '$F_1 h_1 = F_2 h_2$.'
        explain: Выигрыш в силе сопровождается проигрышем в расстоянии.
        f: [2]
        sol: { given: ['F₁ = 200 Н', 'F₂ = 10 000 Н', 'h₁ = 25 см'], find: 'h₂', formula: 'F_1h_1 = F_2h_2', calc: 'h_2 = \frac{200\cdot25}{10\,000} = 0{,}5', answer: '0,5 см' }
        src: p22L
      - type: single
        cat: theory
        q: Что даёт гидравлический пресс (по конспекту)?
        opts: ['Выигрыш в силе', 'Выигрыш в работе', 'Выигрыш в скорости большого поршня', 'Уменьшение давления в жидкости']
        ans: a
        hint: Первое предложение темы на стр. 22L.
        explain: С помощью гидравлического пресса можно получить выигрыш в силе.
