  d_c: { tex: 'd_c', meaning: 'плечо силы тяжести рычага — расстояние от оси до его центра масс', unit: 'м', src: p01, web: true }
  xy_c: { tex: 'x_c,\ y_c', meaning: 'координаты центра масс', unit: 'м', src: p01, web: true }
  mx_i: { tex: 'm_i,\ x_i,\ y_i', meaning: 'массы тел системы и координаты их центров', unit: 'кг, м', src: p01, web: true }
