topics:
  - id: st-moment
    title: Момент силы. Условия равновесия
    pages: [p01]
    web: &wstat
      - { title: 'Открытая физика: Условия равновесия тел', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph14/theory.html' }
    theory:
      - kind: note
        title: Почему подраздел дополнен
        body: 'В плане курса на стр. p01 сказано: «равновесие движения → Статика», но сама статика в конспекте не записана. По вашей просьбе подраздел составлен по материалам из интернета; источник — ниже каждой записи.'
        src: p01
      - kind: definition
        title: Статика
        body: 'Статика — раздел механики, изучающий условия равновесия тел.'
        src: p01
      - kind: definition
        title: Момент силы
        body: 'Момент силы M — произведение модуля силы F на её плечо d: $M = F\cdot d$. Плечо — длина перпендикуляра, проведённого от оси вращения до линии действия силы. Момент считают положительным, если сила стремится повернуть тело против часовой стрелки. Единица — Н·м.'
        src: p01
      - kind: law
        title: Условия равновесия твёрдого тела
        body: |
          - **Первое условие:** векторная сумма всех сил, приложенных к телу, равна нулю: $\vec F_1 + \vec F_2 + \dots = 0$. Тогда тело покоится или движется равномерно и прямолинейно.
          - **Второе условие (правило моментов):** если тело может вращаться вокруг оси, алгебраическая сумма моментов всех сил относительно этой оси равна нулю: $M_1 + M_2 + \dots = 0$.
          - В общем случае нужны оба условия. Их выполнение ещё не значит покой: катящееся колесо тоже находится в равновесии.
        src: p01
    formulas:
      - title: Момент силы
        tex: 'M = F\cdot d'
        sym: [M_mom, F_mom, d_arm]
        src: p01
      - title: Первое условие равновесия
        tex: '\vec F_1 + \vec F_2 + \dots + \vec F_n = 0'
        sym: [F_mom]
        src: p01
      - title: Второе условие равновесия (правило моментов)
        tex: 'M_1 + M_2 + \dots + M_n = 0'
        sym: [M_mom]
        src: p01
    questions:
      - type: single
        cat: theory
        q: Что изучает статика?
        opts: ['Условия равновесия тел', 'Причины движения тел', 'Виды движения тел', 'Колебания тел']
        ans: a
        hint: В плане курса на стр. p01 — «равновесие движения → Статика».
        explain: Статика — раздел механики, изучающий условия равновесия тел.
        src: p01
      - type: single
        cat: theory
        q: Что такое плечо силы?
        opts: ['Длина перпендикуляра от оси вращения до линии действия силы', 'Расстояние от оси до конца тела', 'Длина вектора силы', 'Расстояние, на которое переместилось тело']
        ans: a
        hint: Плечо измеряют по перпендикуляру.
        explain: Плечо d — длина перпендикуляра, проведённого от оси вращения до линии действия силы.
        f: [1]
        src: p01
      - type: numeric
        cat: problem
        q: 'Сила 20 Н действует на гаечный ключ с плечом 0,25 м. Найдите момент силы.'
        num: { value: 5, unit: 'Н·м', check: '20*0.25' }
        hint: '$M = F\cdot d$.'
        explain: '$M = 20\cdot0{,}25 = 5$ Н·м.'
        f: [1]
        sol: { given: ['F = 20 Н', 'd = 0,25 м'], find: 'M', formula: 'M = F\cdot d', calc: 'M = 20\cdot0{,}25 = 5', answer: '5 Н·м' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Чтобы создать момент 12 Н·м рукой с плечом 0,4 м, какую силу нужно приложить?'
        num: { value: 30, unit: 'Н', check: '12/0.4' }
        hint: '$F = \frac{M}{d}$.'
        explain: '$F = \frac{12}{0{,}4} = 30$ Н.'
        f: [1]
        sol: { given: ['M = 12 Н·м', 'd = 0,4 м'], find: 'F', formula: 'F = \frac{M}{d}', calc: 'F = \frac{12}{0{,}4} = 30', answer: '30 Н' }
        src: p01
      - type: single
        cat: theory
        q: Какой момент силы считают положительным?
        opts: ['Если сила стремится повернуть тело против часовой стрелки', 'Если сила направлена вверх', 'Если плечо больше 1 м', 'Если сила стремится повернуть тело по часовой стрелке']
        ans: a
        hint: Так принято в «Открытой физике».
        explain: Момент считается положительным, если сила стремится повернуть тело против часовой стрелки.
        src: p01
      - type: multiple
        cat: theory
        q: Какие условия нужны для равновесия тела, которое может вращаться вокруг оси? Выберите все.
        opts: ['Сумма всех сил равна нулю', 'Сумма моментов сил относительно оси равна нулю', 'Все силы равны по модулю', 'Плечи всех сил одинаковы']
        ans: [a, b]
        hint: Первое и второе условия равновесия.
        explain: 'В общем случае нужны оба условия: $\Sigma\vec F = 0$ и $\Sigma M = 0$.'
        f: [2, 3]
        src: p01
      - type: single
        cat: theory
        q: Почему выполнение условий равновесия ещё не означает, что тело покоится?
        opts: ['Тело может равномерно двигаться или вращаться — например, катящееся колесо', 'Потому что силы всегда немного не равны', 'Потому что моменты всегда положительны', 'Потому что тело всегда ускоряется']
        ans: a
        hint: Сумма сил ноль — и при равномерном прямолинейном движении.
        explain: 'Условия равновесия не являются достаточными для покоя: катящееся колесо находится в равновесии, но катится.'
        src: p01

  - id: st-lever
    title: Рычаг. Правило моментов
    pages: [p01]
    web: *wstat
    theory:
      - kind: rule
        title: Равновесие рычага
        body: 'Рычаг — твёрдое тело, которое может вращаться вокруг неподвижной оси (опоры). Рычаг находится в равновесии, если выполняется правило моментов: $M_1 + M_2 = 0$, то есть по модулю $F_1d_1 = F_2d_2$. Отсюда $\frac{F_1}{F_2} = \frac{d_2}{d_1}$: во сколько раз плечо больше, во столько раз сила меньше.'
        src: p01
        fig: lever
    formulas:
      - title: Условие равновесия рычага
        tex: 'F_1d_1 = F_2d_2'
        sym: [F12_lev, d12_lev]
        src: p01
      - title: Отношение сил на рычаге
        tex: '\frac{F_1}{F_2} = \frac{d_2}{d_1}'
        sym: [F12_lev, d12_lev]
        src: p01
    questions:
      - type: numeric
        cat: problem
        q: 'На рычаг действуют силы: 30 Н на плече 0,2 м и неизвестная сила на плече 0,6 м. При какой силе рычаг в равновесии?'
        num: { value: 10, unit: 'Н', check: '30*0.2/0.6' }
        hint: '$F_1d_1 = F_2d_2$.'
        explain: '$F_2 = \frac{30\cdot0{,}2}{0{,}6} = 10$ Н.'
        f: [1]
        sol: { given: ['F₁ = 30 Н', 'd₁ = 0,2 м', 'd₂ = 0,6 м'], find: 'F₂', formula: 'F_1d_1 = F_2d_2', calc: 'F_2 = \frac{30\cdot0{,}2}{0{,}6} = 10', answer: '10 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Груз 600 Н поднимают рычагом. Плечо груза 0,3 м, плечо руки 1,5 м. Какую силу нужно приложить?'
        num: { value: 120, unit: 'Н', check: '600*0.3/1.5' }
        hint: '$F_{руки} = \frac{F_{груза}d_{груза}}{d_{руки}}$.'
        explain: '$F = \frac{600\cdot0{,}3}{1{,}5} = 120$ Н — выигрыш в силе в 5 раз.'
        f: [1]
        sol: { given: ['F₁ = 600 Н', 'd₁ = 0,3 м', 'd₂ = 1,5 м'], find: 'F₂', formula: 'F_1d_1 = F_2d_2', calc: 'F_2 = \frac{600\cdot0{,}3}{1{,}5} = 120', answer: '120 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Чтобы уравновесить силу 50 Н на плече 0,4 м силой 20 Н, каким должно быть её плечо?'
        num: { value: 1, unit: 'м', check: '50*0.4/20' }
        hint: '$d_2 = \frac{F_1d_1}{F_2}$.'
        explain: '$d_2 = \frac{50\cdot0{,}4}{20} = 1$ м.'
        f: [1]
        sol: { given: ['F₁ = 50 Н', 'd₁ = 0,4 м', 'F₂ = 20 Н'], find: 'd₂', formula: 'd_2 = \frac{F_1d_1}{F_2}', calc: 'd_2 = \frac{50\cdot0{,}4}{20} = 1', answer: '1 м' }
        src: p01
      - type: single
        cat: formula
        q: Как связаны силы и плечи у рычага в равновесии?
        opts: ['$\frac{F_1}{F_2} = \frac{d_2}{d_1}$', '$\frac{F_1}{F_2} = \frac{d_1}{d_2}$', '$F_1 + F_2 = d_1 + d_2$', '$F_1d_2 = F_2d_1$']
        ans: a
        hint: Силы обратно пропорциональны плечам.
        explain: 'Из $F_1d_1 = F_2d_2$ следует $\frac{F_1}{F_2} = \frac{d_2}{d_1}$.'
        f: [2]
        src: p01
      - type: single
        cat: theory
        q: Что такое рычаг?
        opts: ['Твёрдое тело, которое может вращаться вокруг неподвижной оси', 'Любая наклонная плоскость', 'Блок с верёвкой', 'Пружина, сжатая силой']
        ans: a
        hint: У рычага есть опора — ось вращения.
        explain: Рычаг — твёрдое тело, способное вращаться вокруг неподвижной оси (опоры).
        src: p01

  - id: st-kinds
    title: Рода рычагов. Рычаг с собственным весом. Системы рычагов
    pages: [p01]
    web:
      - { title: 'Skysmart: Условия равновесия рычага', url: 'https://skysmart.ru/articles/physics/usloviya-ravnovesiya-rychaga' }
      - { title: 'ЕГЭ-Study: Простые механизмы. Рычаг. Наклонная плоскость. Блоки', url: 'https://ege-study.ru/ru/ege/materialy/fizika/prostye-mexanizmy/' }
      - { title: 'Открытая физика: Условия равновесия тел', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph14/theory.html' }
    theory:
      - kind: definition
        title: Рычаги первого и второго рода
        body: |
          - **Рычаг первого рода** — точки приложения сил лежат по разные стороны от точки опоры: лом, ножницы, пила, плоскогубцы, детские качели.
          - **Рычаг второго рода** — обе точки приложения сил лежат по одну сторону от опоры, и у одной силы плечо меньше: садовая тачка, щипцы для орехов, ключ для открывания бутылок.
        fig: lever-kinds
        src: p01
      - kind: rule
        title: Выигрыш в силе и в расстоянии
        body: 'Выигрыш в силе равен отношению плеч: во сколько раз длинное плечо больше короткого, во столько раз меньше нужна сила (груз — на коротком плече). Пример: груз 700 Н можно поднять усилием 100 Н, если плечи относятся как 7 : 1 — но и путь руки будет в 7 раз больше. Лопата, ножницы, плоскогубцы дают выигрыш в силе; весло — выигрыш в расстоянии; равноплечие весы — ни того, ни другого.'
        src: p01
      - kind: text
        title: Рычаг с собственным весом
        body: 'Если рычаг нельзя считать лёгким, в правило моментов добавляют момент его силы тяжести. Сила тяжести приложена к центру масс рычага — у однородного стержня это середина. Её плечо $d_c$ — расстояние от оси до середины стержня, момент — $mgd_c$.'
        src: p01
      - kind: text
        title: Система рычагов
        body: 'В системе (многоуровневом рычаге) конец одного рычага давит на другой. Для каждого рычага пишут своё правило моментов; сила, которую первый рычаг передаёт второму, у второго становится нагрузкой. Если каждый рычаг даёт выигрыш в силе $k_1$, $k_2$, …, общий выигрыш равен их произведению $k = k_1k_2\dots$ — это прямо следует из правила моментов для каждого рычага.'
        src: p01
    formulas:
      - title: Выигрыш в силе у рычага
        tex: 'k = \frac{P}{F} = \frac{d}{d_{гр}}'
        sym: [k_gain, P, F, d12_lev]
        cond: 'd — плечо прикладываемой силы, d_гр — плечо груза; трение не учитывается'
        src: p01
      - title: Рычаг с собственным весом
        tex: 'F_1d_1 = F_2d_2 + mg\,d_c'
        sym: [F12_lev, d12_lev, m, g, d_c]
        cond: 'сила тяжести рычага стремится повернуть его в ту же сторону, что и F₂'
        src: p01
      - title: Выигрыш системы рычагов
        tex: 'k = k_1\cdot k_2\cdot\dots'
        sym: [k_gain]
        src: p01
    examples:
      - title: Однородный стержень на опоре
        given: 'Стержень длиной 1 м и массой 2 кг опирается на точку в 0,3 м от левого конца. Какой груз подвесить к левому концу, чтобы стержень был в равновесии? ($g = 10$ м/с²)'
        steps: ['Центр масс стержня — посередине, в 0,5 м от левого конца, то есть в $0{,}5 - 0{,}3 = 0{,}2$ м справа от опоры.', 'Момент силы тяжести стержня: $mgd_c = 2\cdot10\cdot0{,}2 = 4$ Н·м (поворачивает по часовой стрелке).', 'Груз на левом конце, его плечо 0,3 м: $m_1g\cdot0{,}3 = 4$.', '$m_1 = \frac{4}{10\cdot0{,}3} \approx 1{,}33$ кг.']
        answer: '$m_1 \approx 1{,}33$ кг'
        src: p01
      - title: Система из двух рычагов
        given: 'У первого рычага плечи 0,1 м и 0,5 м, у второго — 0,2 м и 0,6 м; груз 900 Н висит на коротком плече второго рычага. Какую силу нужно приложить к длинному плечу первого?'
        steps: ['Выигрыш второго рычага: $k_2 = \frac{0{,}6}{0{,}2} = 3$; первого: $k_1 = \frac{0{,}5}{0{,}1} = 5$.', 'Общий выигрыш: $k = k_1k_2 = 15$.', '$F = \frac{900}{15} = 60$ Н.']
        answer: '$F = 60$ Н'
        src: p01
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте инструмент и род рычага.
        pairs:
          - ['Ножницы', 'первого рода']
          - ['Садовая тачка', 'второго рода']
          - ['Детские качели', 'первого рода (опора посередине)']
          - ['Щипцы для орехов', 'второго рода (силы по одну сторону)']
        hint: Где находится опора — между силами или с краю?
        explain: 'Ножницы и качели — опора между силами (первый род); тачка и щипцы для орехов — обе силы по одну сторону от опоры (второй род).'
        src: p01
      - type: numeric
        cat: problem
        q: 'Меньшее плечо рычага 0,05 м, большее 0,8 м. На меньшее плечо действует сила 16 Н. Какую силу нужно приложить к большему плечу?'
        num: { value: 1, unit: 'Н', check: '16*0.05/0.8' }
        hint: '$F_2 = \frac{F_1d_1}{d_2}$.'
        explain: '$F_2 = \frac{16\cdot0{,}05}{0{,}8} = 1$ Н.'
        sol: { given: ['d₁ = 0,05 м', 'd₂ = 0,8 м', 'F₁ = 16 Н'], find: 'F₂', formula: 'F_1d_1 = F_2d_2', calc: 'F_2 = \frac{16\cdot0{,}05}{0{,}8} = 1', answer: '1 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'На концах невесомого рычага действуют силы 50 Н и 250 Н. Плечо меньшей силы 0,06 м. Найдите плечо большей силы (в см).'
        num: { value: 1.2, unit: 'см', check: '50*0.06/250*100' }
        hint: 'Большая сила — на меньшем плече: $d_2 = \frac{F_1d_1}{F_2}$.'
        explain: '$d_2 = \frac{50\cdot0{,}06}{250} = 0{,}012$ м = 1,2 см.'
        sol: { given: ['F₁ = 50 Н', 'd₁ = 0,06 м', 'F₂ = 250 Н'], find: 'd₂', formula: 'd_2 = \frac{F_1d_1}{F_2}', calc: 'd_2 = \frac{50\cdot0{,}06}{250} = 0{,}012', answer: '1,2 см' }
        src: p01
      - type: numeric
