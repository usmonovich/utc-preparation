        hint: 'Центр масс доски — в 2 м от левого конца, то есть в 1 м справа от опоры.'
        explain: '$F\cdot1 = mg\cdot1$, $F = 100$ Н.'
        f: [st-kinds-f2]
        sol: { given: ['m = 10 кг', 'L = 4 м', 'опора в 1 м от края'], find: 'F', formula: 'F d = mg\,d_c', calc: 'F\cdot1 = 100\cdot(2 - 1)\ \Rightarrow\ F = 100', answer: '100 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Система из трёх рычагов, каждый даёт выигрыш в силе в 2 раза. Какую силу нужно приложить, чтобы удержать груз 800 Н?'
        num: { value: 100, unit: 'Н', check: '800/(2*2*2)' }
        hint: 'Общий выигрыш — произведение: $k = 2\cdot2\cdot2$.'
        explain: '$k = 8$, $F = \frac{800}{8} = 100$ Н.'
        f: [st-kinds-f3]
        sol: { given: ['k₁ = k₂ = k₃ = 2', 'P = 800 Н'], find: 'F', formula: 'k = k_1k_2k_3,\ \ F = \frac{P}{k}', calc: 'k = 8;\quad F = \frac{800}{8} = 100', answer: '100 Н' }
        src: p01
