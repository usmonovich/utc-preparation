  - id: st-blocks
    title: Блоки. Системы блоков (полиспаст)
    pages: [p01]
    web:
      - { title: 'ЕГЭ-Study: Простые механизмы. Рычаг. Наклонная плоскость. Блоки', url: 'https://ege-study.ru/ru/ege/materialy/fizika/prostye-mexanizmy/' }
      - { title: 'БРЭ: Полиспаст', url: 'https://bigenc.ru/c/polispast-a79e03' }
    theory:
      - kind: definition
        title: Блок
        body: 'Блок — колесо с жёлобом, закреплённое в обойме; по жёлобу пропускают верёвку, трос или цепь. Блок — разновидность рычага.'
        src: p01
      - kind: rule
        title: Неподвижный блок
        body: 'Ось неподвижного блока закреплена. Плечи обеих сил равны радиусу блока, поэтому $F = P$: выигрыша в силе нет, перемещения конца верёвки и груза одинаковы. Зато неподвижный блок меняет направление силы — например, позволяет поднимать груз, потягивая верёвку вниз.'
        src: p01
        fig: pulleys
      - kind: rule
        title: Подвижный блок
        body: 'Ось подвижного блока поднимается вместе с грузом. Блок поворачивается вокруг точки, где его касается неподвижная ветвь верёвки: плечо силы равно диаметру $2r$, плечо веса — радиусу $r$. Поэтому $F = \frac{P}{2}$ — выигрыш в силе в 2 раза. Но чтобы поднять груз на высоту h, конец верёвки нужно вытянуть на $2h$ — проигрыш в пути тоже в 2 раза.'
        src: p01
      - kind: text
        title: Подвижный блок вместе с неподвижным
        body: 'Если верёвку от подвижного блока перекинуть через неподвижный, тянуть можно вниз, а выигрыш в силе остаётся двукратным: $F = \frac{P}{2}$.'
        src: p01
      - kind: text
        title: Полиспаст
        body: 'Полиспаст — грузоподъёмный механизм из нескольких подвижных и неподвижных блоков, огибаемых канатом, тросом или цепью. Вес груза распределяется на ветви каната, держащие подвижные блоки: чем больше блоков, тем больше ветвей и тем меньше нужное усилие. Натяжение каната во всех ветвях одинаково, поэтому, если подвижную часть держат n ветвей (без трения и веса блоков), $F = \frac{P}{n}$, а конец каната приходится вытянуть на $nh$. Полиспасты работают в кранах, лебёдках, талях.'
        src: p01
      - kind: note
        title: Вес подвижного блока
        body: 'Если подвижный блок тяжёлый, он поднимается вместе с грузом, и его вес тоже распределяется на ветви: для одного подвижного блока $F = \frac{P + P_0}{2}$, где $P_0$ — вес блока. Это следует из того же равенства сил, что и $F = \frac P2$.'
        src: p01
    formulas:
      - title: Неподвижный блок
        tex: 'F = P,\qquad s = h'
        sym: [F, P, s_rope, h]
        src: p01
      - title: Подвижный блок
        tex: 'F = \frac{P}{2},\qquad s = 2h'
        sym: [F, P, s_rope, h]
        boxed: true
        src: p01
      - title: Полиспаст (n ветвей держат груз)
        tex: 'F = \frac{P}{n},\qquad s = n\,h'
        sym: [F, P, n_br, s_rope, h]
        cond: 'без трения и веса блоков'
        src: p01
      - title: Подвижный блок с учётом его веса
        tex: 'F = \frac{P + P_0}{2}'
        sym: [F, P, P0_bl]
        src: p01
    examples:
      - title: Полиспаст на четырёх ветвях
        given: 'Груз весом 600 Н поднимают полиспастом, подвижную часть держат 4 ветви каната. Какую силу прикладывают и сколько каната выбирают, чтобы поднять груз на 1,5 м?'
        steps: ['$F = \frac{P}{n} = \frac{600}{4} = 150$ Н.', '$s = nh = 4\cdot1{,}5 = 6$ м.', 'Проверка золотым правилом: $Fs = 150\cdot6 = 900$ Дж и $Ph = 600\cdot1{,}5 = 900$ Дж — выигрыша в работе нет.']
        answer: '$F = 150$ Н, $s = 6$ м'
        src: p01
      - title: Тяжёлый подвижный блок
        given: 'Груз массой 40 кг поднимают подвижным блоком массой 2 кг. Какую силу прикладывают к верёвке? ($g = 10$ м/с²)'
        steps: ['Вес груза $P = 400$ Н, вес блока $P_0 = 20$ Н.', '$F = \frac{P + P_0}{2} = \frac{420}{2} = 210$ Н.']
        answer: '$F = 210$ Н'
        src: p01
    questions:
      - type: single
        cat: theory
        q: Что даёт неподвижный блок?
        opts: ['Меняет направление силы, выигрыша в силе нет', 'Выигрыш в силе в 2 раза', 'Выигрыш в работе', 'Выигрыш и в силе, и в расстоянии']
        ans: a
        hint: Плечи обеих сил равны радиусу блока.
        explain: 'У неподвижного блока $F = P$; он только меняет направление силы.'
        f: [st-blocks-f1]
        src: p01
      - type: numeric
        cat: problem
        q: 'Груз весом 500 Н поднимают подвижным блоком. Какую силу прикладывают к верёвке (без трения и веса блока)?'
        num: { value: 250, unit: 'Н', check: '500/2' }
        hint: 'Подвижный блок даёт выигрыш в силе в 2 раза.'
        explain: '$F = \frac{500}{2} = 250$ Н.'
        f: [st-blocks-f2]
        sol: { given: ['P = 500 Н'], find: 'F', formula: 'F = \frac{P}{2}', calc: 'F = \frac{500}{2} = 250', answer: '250 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Подвижным блоком груз подняли на 3 м. Сколько метров верёвки пришлось вытянуть?'
        num: { value: 6, unit: 'м', check: '2*3' }
        hint: 'Выигрыш в силе в 2 раза — проигрыш в пути в 2 раза.'
        explain: '$s = 2h = 6$ м.'
        f: [st-blocks-f2]
        sol: { given: ['h = 3 м'], find: 's', formula: 's = 2h', calc: 's = 2\cdot3 = 6', answer: '6 м' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Полиспаст: подвижную часть держат 6 ветвей каната, груз 1,2 кН. Какую силу нужно приложить (без трения)?'
        num: { value: 200, unit: 'Н', check: '1200/6' }
        hint: '$F = \frac{P}{n}$.'
        explain: '$F = \frac{1200}{6} = 200$ Н.'
        f: [st-blocks-f3]
        sol: { given: ['P = 1200 Н', 'n = 6'], find: 'F', formula: 'F = \frac{P}{n}', calc: 'F = \frac{1200}{6} = 200', answer: '200 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Подвижный блок весом 30 Н, груз 270 Н. Какую силу нужно приложить к верёвке?'
        num: { value: 150, unit: 'Н', check: '(270+30)/2' }
        hint: 'Блок поднимается вместе с грузом: $F = \frac{P + P_0}{2}$.'
        explain: '$F = \frac{270 + 30}{2} = 150$ Н.'
        f: [st-blocks-f4]
        sol: { given: ['P = 270 Н', 'P₀ = 30 Н'], find: 'F', formula: 'F = \frac{P + P_0}{2}', calc: 'F = \frac{300}{2} = 150', answer: '150 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Рабочий тянет конец каната полиспаста с силой 125 Н и выбирает 8 м каната, а груз поднимается на 2 м. Каков вес груза (без трения)?'
        num: { value: 500, unit: 'Н', check: '125*8/2' }
        hint: 'Золотое правило: $Fs = Ph$.'
        explain: '$P = \frac{Fs}{h} = \frac{125\cdot8}{2} = 500$ Н (канат держит груз на $n = \frac sh = 4$ ветвях).'
        f: [st-blocks-f3]
        sol: { given: ['F = 125 Н', 's = 8 м', 'h = 2 м'], find: 'P', formula: 'Fs = Ph', calc: 'P = \frac{125\cdot8}{2} = 500', answer: '500 Н' }
        src: p01
      - type: single
        cat: theory
        q: Почему подвижный блок даёт выигрыш в силе в 2 раза?
        opts: ['Плечо силы равно диаметру блока, а плечо веса — радиусу', 'Верёвка становится вдвое короче', 'Блок вдвое легче груза', 'Сила трения помогает поднимать груз']
        ans: a
        hint: Блок поворачивается вокруг точки касания неподвижной ветви.
        explain: 'Плечи $2r$ и $r$: по правилу моментов $F\cdot2r = P\cdot r$, $F = \frac P2$.'
        f: [st-blocks-f2]
        src: p01

  - id: st-incline
    title: Наклонная плоскость и ворот. Золотое правило механики. КПД
    pages: [p01]
    web:
      - { title: 'ЕГЭ-Study: Простые механизмы. Рычаг. Наклонная плоскость. Блоки', url: 'https://ege-study.ru/ru/ege/materialy/fizika/prostye-mexanizmy/' }
      - { title: 'Фоксфорд: Простые механизмы', url: 'https://externat.foxford.ru/polezno-znat/wiki-fizika-prostye-mekhanizmy' }
    theory:
      - kind: rule
        title: Наклонная плоскость
        body: 'Наклонная плоскость — ровная поверхность под углом α к горизонту. Чтобы равномерно втащить груз по гладкой плоскости, нужна сила $F = mg\sin\alpha = mg\frac{h}{l}$, где h — высота, l — длина плоскости. Так как $\sin\alpha < 1$, сила меньше веса; чем меньше угол, тем больше выигрыш в силе. Клин и винт — разновидности наклонной плоскости.'
        src: p01
        fig: incline-golden
      - kind: text
        title: Ворот
        body: 'Ворот — разновидность рычага: рукоятка служит плечом силы, радиус барабана (вала) — плечом груза. Выигрыш в силе равен отношению длины рукоятки R к радиусу барабана r: $F = P\frac{r}{R}$. Если рукоятка в 3 раза длиннее радиуса барабана, сила нужна примерно в 3 раза меньше.'
        src: p01
      - kind: law
        title: Золотое правило механики
        body: 'Ни один простой механизм не даёт выигрыша в работе. Во сколько раз выигрываем в силе, во столько же раз проигрываем в расстоянии: $F\cdot s = P\cdot h$. Это частный случай закона сохранения энергии. Например, на наклонной плоскости $A = mg\sin\alpha\cdot\frac{h}{\sin\alpha} = mgh$.'
        src: p01
      - kind: definition
        title: КПД механизма
        body: 'В реальном механизме часть работы уходит на трение и на перемещение его частей, поэтому полная работа больше полезной. КПД $\eta = \frac{A_{пол}}{A_{полн}}\cdot100\%$, у реальных механизмов он меньше 100 %. Для наклонной плоскости с трением (коэффициент μ): $F = mg(\sin\alpha + \mu\cos\alpha)$ и $\eta = \frac{1}{1 + \mu\,\text{ctg}\,\alpha}$.'
        src: p01
      - kind: note
        title: Замечание об источнике
        body: 'На странице-источнике (ЕГЭ-Study) последняя формула напечатана как $\frac{1}{\mu\,\text{ctg}\,\alpha}$; из выкладок на той же странице ($A_{пол} = mgh$, $A_{полн} = mgh(1 + \mu\,\text{ctg}\,\alpha)$) следует $\eta = \frac{1}{1 + \mu\,\text{ctg}\,\alpha}$ — в приложении записан исправленный вариант.'
        src: p01
    formulas:
      - title: Сила на гладкой наклонной плоскости
        tex: 'F = mg\sin\alpha = mg\frac{h}{l}'
        sym: [F, m, g, alpha, h, l_inc]
        boxed: true
        src: p01
      - title: Ворот
        tex: 'F = P\,\frac{r}{R}'
        sym: [F, P, r_drum, R_hand]
        src: p01
      - title: Золотое правило механики
        tex: 'F\,s = P\,h'
        sym: [F, s_rope, P, h]
        cond: 'для идеального механизма — без трения'
        boxed: true
        src: p01
      - title: КПД механизма
        tex: '\eta = \frac{A_{пол}}{A_{полн}}\cdot100\%'
        sym: [eta, A_pol, A_poln]
        boxed: true
        src: p01
      - title: Наклонная плоскость с трением
        tex: 'F = mg(\sin\alpha + \mu\cos\alpha),\qquad \eta = \frac{1}{1 + \mu\,\text{ctg}\,\alpha}'
        sym: [F, m, g, alpha, mu, eta]
        src: p01
    examples:
      - title: КПД наклонной плоскости
        given: 'Ящик массой 50 кг равномерно втаскивают по наклонной плоскости длиной 5 м на высоту 1 м, прикладывая силу 125 Н вдоль плоскости. Найдите КПД. ($g = 10$ м/с²)'
        steps: ['Полезная работа: $A_{пол} = mgh = 50\cdot10\cdot1 = 500$ Дж.', 'Полная работа: $A_{полн} = Fl = 125\cdot5 = 625$ Дж.', '$\eta = \frac{500}{625}\cdot100\% = 80\%$.', 'Без трения хватило бы силы $F = mg\frac hl = 100$ Н.']
        answer: '$\eta = 80\%$'
        src: p01
      - title: КПД через коэффициент трения
        given: 'Наклонная плоскость под углом 30°, коэффициент трения 0,2. Найдите КПД при равномерном подъёме.'
        steps: ['$\text{ctg}\,30^\circ = \sqrt3 \approx 1{,}732$.', '$\eta = \frac{1}{1 + 0{,}2\cdot1{,}732} = \frac{1}{1{,}346} \approx 0{,}743$.']
        answer: '$\eta \approx 74\%$'
        src: p01
    questions:
      - type: numeric
        cat: problem
        q: 'Груз массой 80 кг втаскивают по гладкой наклонной плоскости длиной 4 м на высоту 1 м. Какая сила нужна? ($g = 10$ м/с²)'
        num: { value: 200, unit: 'Н', check: '80*10*1/4' }
        hint: '$F = mg\frac hl$.'
        explain: '$F = 800\cdot\frac{1}{4} = 200$ Н — в 4 раза меньше веса.'
        f: [st-incline-f1]
        sol: { given: ['m = 80 кг', 'l = 4 м', 'h = 1 м'], find: 'F', formula: 'F = mg\frac{h}{l}', calc: 'F = 800\cdot\frac14 = 200', answer: '200 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Ворот: рукоятка 0,6 м, радиус барабана 0,1 м. Какую силу нужно приложить к рукоятке, чтобы поднимать ведро весом 120 Н?'
        num: { value: 20, unit: 'Н', check: '120*0.1/0.6' }
        hint: '$F = P\frac rR$.'
        explain: '$F = 120\cdot\frac{0{,}1}{0{,}6} = 20$ Н.'
        f: [st-incline-f2]
        sol: { given: ['R = 0,6 м', 'r = 0,1 м', 'P = 120 Н'], find: 'F', formula: 'F = P\frac{r}{R}', calc: 'F = 120\cdot\frac{0{,}1}{0{,}6} = 20', answer: '20 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Рычагом подняли груз 600 Н на 0,2 м, при этом конец рычага опустился на 1,2 м. Какую силу прикладывали (без трения)?'
        num: { value: 100, unit: 'Н', check: '600*0.2/1.2' }
        hint: 'Золотое правило: $Fs = Ph$.'
        explain: '$F = \frac{600\cdot0{,}2}{1{,}2} = 100$ Н.'
        f: [st-incline-f3]
        sol: { given: ['P = 600 Н', 'h = 0,2 м', 's = 1,2 м'], find: 'F', formula: 'Fs = Ph', calc: 'F = \frac{600\cdot0{,}2}{1{,}2} = 100', answer: '100 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Подвижным блоком подняли груз 400 Н на 2 м, прикладывая к верёвке силу 250 Н. Найдите КПД (в %).'
        num: { value: 80, unit: '%', check: '400*2/(250*4)*100' }
        hint: 'У подвижного блока $s = 2h$; $\eta = \frac{Ph}{Fs}$.'
        explain: '$A_{пол} = 400\cdot2 = 800$ Дж, $A_{полн} = 250\cdot4 = 1000$ Дж, $\eta = 80\%$.'
        f: [st-incline-f4]
        sol: { given: ['P = 400 Н', 'h = 2 м', 'F = 250 Н', 's = 2h = 4 м'], find: 'η', formula: '\eta = \frac{A_{пол}}{A_{полн}}\cdot100\%', calc: '\eta = \frac{800}{1000}\cdot100\% = 80\%', answer: '80 %' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Наклонная плоскость под углом 45°, коэффициент трения 0,25. Найдите КПД при равномерном подъёме (в %).'
        num: { value: 80, unit: '%', check: '100/(1+0.25*1)' }
        hint: '$\eta = \frac{1}{1 + \mu\,\text{ctg}\,\alpha}$, $\text{ctg}\,45^\circ = 1$.'
        explain: '$\eta = \frac{1}{1 + 0{,}25} = 0{,}8$ = 80 %.'
        f: [st-incline-f5]
        sol: { given: ['α = 45°', 'μ = 0,25'], find: 'η', formula: '\eta = \frac{1}{1 + \mu\,\text{ctg}\,\alpha}', calc: '\eta = \frac{1}{1{,}25} = 0{,}8', answer: '80 %' }
        src: p01
      - type: single
        cat: theory
        q: Что утверждает золотое правило механики?
        opts: ['Выигрыша в работе нет: выигрыш в силе оплачивается проигрышем в расстоянии', 'Простые механизмы удваивают работу', 'Выигрыш в силе всегда равен двум', 'КПД механизма всегда 100 %']
        ans: a
        hint: Это частный случай закона сохранения энергии.
        explain: 'Ни один простой механизм не даёт выигрыша в работе: $Fs = Ph$.'
        f: [st-incline-f3]
        src: p01

  - id: st-center
    title: Центр тяжести (центр масс)
    pages: [p01]
    web:
      - { title: 'Физика, 9 класс (eior.by): Центр тяжести', url: 'https://eior.by/upload/books/9-klass/fizika/fizika_9class_31.pdf' }
      - { title: 'Википедия: Центр масс', url: 'https://ru.wikipedia.org/wiki/Центр_масс' }
      - { title: 'Открытая физика: Условия равновесия тел', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph14/theory.html' }
    theory:
      - kind: definition
        title: Центр тяжести и центр масс
        body: 'Центр тяжести тела — точка приложения действующей на него силы тяжести. Центр масс — точка, которая характеризует движение тела или системы тел как целого. В однородном поле тяжести (у поверхности Земли) центр тяжести и центр масс совпадают.'
        src: p01
      - kind: rule
        title: Где центр тяжести у однородных тел
        body: 'У однородных тел правильной формы центр тяжести находится в геометрическом центре тела. Он может оказаться и в точке, которая самому телу не принадлежит — например, в центре кольца.'
        src: p01
      - kind: law
        title: Координаты центра масс
        body: |
          Для системы тел с массами $m_1, m_2, \dots$ и координатами центров $x_1, x_2, \dots$:
          $x_c = \frac{m_1x_1 + m_2x_2 + \dots}{m_1 + m_2 + \dots}$, так же $y_c = \frac{m_1y_1 + m_2y_2 + \dots}{m_1 + m_2 + \dots}$.
          Для двух грузов на лёгком стержне по правилу моментов $\frac{l_1}{l_2} = \frac{m_2}{m_1}$: центр тяжести ближе к более массивному грузу.
        src: p01
        fig: center-mass
      - kind: rule
        title: Как найти центр тяжести пластины
        body: 'Подвесьте пластину на нити в точке A₁ и отметьте вертикаль A₁B₁ (по нити). Затем подвесьте её в другой точке A₂ и отметьте вертикаль A₂B₂. Точка пересечения вертикалей — центр тяжести пластины.'
        src: p01
      - kind: rule
        title: Устойчивость тела на опоре
        body: 'Тело опрокидывается, когда линия действия силы тяжести (вертикаль через центр тяжести) выходит за пределы площади опоры. Чем ниже центр тяжести и больше площадь опоры, тем устойчивее тело; неправильная загрузка, поднимающая центр тяжести, опасна для судов и машин. Например, брусок шириной a с центром тяжести на высоте $h_c$, стоящий на наклоняемой доске (без проскальзывания), опрокидывается, когда $\text{tg}\,\alpha > \frac{a}{2h_c}$ — в этот момент вертикаль через центр тяжести проходит через край основания.'
        src: p01
    formulas:
      - title: Координаты центра масс
        tex: 'x_c = \frac{m_1x_1 + m_2x_2 + \dots + m_nx_n}{m_1 + m_2 + \dots + m_n},\qquad y_c = \frac{m_1y_1 + \dots + m_ny_n}{m_1 + \dots + m_n}'
        sym: [xy_c, mx_i]
        boxed: true
        src: p01
      - title: Два груза на лёгком стержне
        tex: '\frac{l_1}{l_2} = \frac{m_2}{m_1}'
        sym: [l12_c, m12_c]
        src: p01
      - title: Условие опрокидывания на наклонной опоре
        tex: '\text{tg}\,\alpha > \frac{a}{2h_c}'
        sym: [alpha, a_base, h_c]
        cond: 'прямоугольный брусок, без проскальзывания; выводится из того, что вертикаль через центр тяжести выходит за край основания'
        src: p01
    examples:
      - title: Два груза на стержне
        given: 'Грузы 2 кг и 6 кг закреплены на концах лёгкого стержня длиной 80 см. Где находится центр масс?'
        steps: ['Ось x — вдоль стержня, начало — у груза 2 кг: $x_1 = 0$, $x_2 = 0{,}8$ м.', '$x_c = \frac{2\cdot0 + 6\cdot0{,}8}{2 + 6} = 0{,}6$ м.', 'Проверка: $\frac{l_1}{l_2} = \frac{0{,}6}{0{,}2} = 3 = \frac{m_2}{m_1}$.']
        answer: 'В 60 см от груза 2 кг (в 20 см от груза 6 кг)'
        src: p01
      - title: Центр масс трёх тел на плоскости
        given: 'Тела 1 кг в точке (0; 0), 2 кг в точке (4; 0) и 1 кг в точке (0; 4) (координаты в метрах). Найдите координаты центра масс.'
        steps: ['$M = 1 + 2 + 1 = 4$ кг.', '$x_c = \frac{1\cdot0 + 2\cdot4 + 1\cdot0}{4} = 2$ м.', '$y_c = \frac{1\cdot0 + 2\cdot0 + 1\cdot4}{4} = 1$ м.']
        answer: 'Центр масс в точке (2; 1) м'
        src: p01
      - title: Когда брусок опрокинется
        given: 'Брусок с квадратным основанием 20 × 20 см и высотой 60 см (центр тяжести на высоте 30 см) стоит на доске; доску медленно наклоняют, брусок не скользит. При каком угле он опрокинется?'
        steps: ['Опрокидывание начинается, когда вертикаль через центр тяжести проходит через нижний край основания.', '$\text{tg}\,\alpha = \frac{a}{2h_c} = \frac{0{,}2}{2\cdot0{,}3} = \frac13$.', '$\alpha = \text{arctg}\,\frac13 \approx 18{,}4^\circ$.']
        answer: 'При угле больше ≈ 18,4°'
        src: p01
    questions:
      - type: single
        cat: theory
        q: Что такое центр тяжести тела?
        opts: ['Точка приложения силы тяжести, действующей на тело', 'Самая тяжёлая часть тела', 'Точка опоры тела', 'Середина самой длинной стороны тела']
        ans: a
        hint: Определение из учебника 9 класса (eior.by).
        explain: Центр тяжести — точка приложения силы тяжести, действующей на тело.
        src: p01
      - type: numeric
        cat: problem
        q: 'Грузы 3 кг и 1 кг на концах лёгкого стержня длиной 1 м. На каком расстоянии от груза 3 кг находится центр масс (в см)?'
        num: { value: 25, unit: 'см', check: '(1*1)/(3+1)*100' }
        hint: 'Начало координат — у груза 3 кг: $x_c = \frac{3\cdot0 + 1\cdot1}{4}$.'
        explain: '$x_c = \frac{1}{4} = 0{,}25$ м = 25 см — ближе к тяжёлому грузу.'
        f: [st-center-f1]
        sol: { given: ['m₁ = 3 кг, x₁ = 0', 'm₂ = 1 кг, x₂ = 1 м'], find: 'x_c', formula: 'x_c = \frac{m_1x_1 + m_2x_2}{m_1 + m_2}', calc: 'x_c = \frac{0 + 1}{4} = 0{,}25', answer: '25 см' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Три груза по 2 кг лежат на прямой в точках x = 0, 1 м и 5 м. Найдите координату центра масс.'
        num: { value: 2, unit: 'м', check: '(2*0+2*1+2*5)/6' }
        hint: 'Массы одинаковые — центр масс в среднем арифметическом координат.'
        explain: '$x_c = \frac{0 + 1 + 5}{3} = 2$ м.'
        f: [st-center-f1]
        sol: { given: ['m = 2 кг', 'x = 0; 1; 5 м'], find: 'x_c', formula: 'x_c = \frac{\sum m_ix_i}{\sum m_i}', calc: 'x_c = \frac{2\cdot(0 + 1 + 5)}{6} = 2', answer: '2 м' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Однородный стержень массой 4 кг и длиной 2 м; на его правом конце закреплён груз 1 кг. На каком расстоянии от левого конца находится центр масс системы?'
        num: { value: 1.2, unit: 'м', check: '(4*1+1*2)/5' }
        hint: 'Стержень заменяем его массой в середине (x = 1 м).'
        explain: '$x_c = \frac{4\cdot1 + 1\cdot2}{5} = 1{,}2$ м.'
        f: [st-center-f1]
        sol: { given: ['m_ст = 4 кг, x = 1 м', 'm_гр = 1 кг, x = 2 м'], find: 'x_c', formula: 'x_c = \frac{m_1x_1 + m_2x_2}{m_1 + m_2}', calc: 'x_c = \frac{4 + 2}{5} = 1{,}2', answer: '1,2 м' }
        src: p01
      - type: numeric
        cat: problem
        q: 'Брусок с основанием шириной 30 см и центром тяжести на высоте 45 см стоит на доске, которую медленно наклоняют (брусок не скользит). При каком угле он опрокинется (в градусах)?'
        num: { value: 18.43, unit: '°', check: 'Math.atan(0.3/(2*0.45))*180/Math.PI' }
        hint: '$\text{tg}\,\alpha = \frac{a}{2h_c}$.'
        explain: '$\text{tg}\,\alpha = \frac{0{,}3}{0{,}9} = \frac13$, $\alpha \approx 18{,}4°$.'
        f: [st-center-f3]
        sol: { given: ['a = 0,3 м', 'h_c = 0,45 м'], find: 'α', formula: '\text{tg}\,\alpha = \frac{a}{2h_c}', calc: '\text{tg}\,\alpha = \frac13;\quad \alpha \approx 18{,}4^\circ', answer: '≈ 18,4°' }
        src: p01
      - type: single
        cat: theory
        q: Как найти центр тяжести плоской пластины неправильной формы?
        opts: ['Подвесить её поочерёдно в двух точках и найти пересечение вертикалей', 'Измерить самую длинную сторону и взять её середину', 'Взвесить пластину на весах', 'Положить её на воду']
        ans: a
        hint: Нить отвеса всегда проходит через центр тяжести.
        explain: Вертикали, проведённые через две точки подвеса, пересекаются в центре тяжести пластины.
        src: p01
      - type: multiple
        cat: theory
        q: Что делает тело на опоре устойчивее? Выберите все.
        opts: ['Более низкий центр тяжести', 'Большая площадь опоры', 'Более высокий центр тяжести', 'Меньшая площадь опоры']
        ans: [a, b]
        hint: Вертикаль через центр тяжести должна оставаться внутри площади опоры.
        explain: Чем ниже центр тяжести и больше площадь опоры, тем устойчивее тело.
        src: p01
      - type: single
        cat: theory
        q: Где находится центр тяжести однородного кольца?
        opts: ['В центре кольца — вне самого тела', 'На самом кольце в любой точке', 'В самой нижней точке кольца', 'У кольца нет центра тяжести']
        ans: a
        hint: У однородного тела правильной формы — в геометрическом центре.
        explain: Центр тяжести может лежать вне тела; у кольца — в его центре.
        src: p01

  - id: st-equilibrium
    title: Виды равновесия. Центр масс
    pages: [p01]
    web: *wstat
    theory:
      - kind: list
        title: Виды равновесия
        body: |
          - **Устойчивое** — при малом отклонении возникают силы или моменты, которые возвращают тело в положение равновесия (шар на дне ямки; у тела на оси центр масс ниже оси).
          - **Неустойчивое** — при малом отклонении тело уходит ещё дальше от положения равновесия (шар на вершине горки; центр масс выше оси).
          - **Безразличное** — тело остаётся в равновесии в любом положении (шар на горизонтальной плоскости; ось проходит через центр масс).
        src: p01
        fig: equilibrium-types
      - kind: rule
        title: Центр масс и равновесие на опоре
        body: 'Сила тяжести приложена к центру масс тела. Тело, стоящее на опоре, находится в равновесии, если вертикаль, проведённая через центр масс, проходит через площадь опоры.'
        src: p01
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте пример и вид равновесия.
        pairs:
          - ['Шар на дне ямки', 'устойчивое']
          - ['Шар на вершине горки', 'неустойчивое']
          - ['Шар на горизонтальном столе', 'безразличное']
        hint: Вернётся ли шар сам после небольшого толчка?
        explain: 'В ямке шар возвращается — устойчивое; с вершины скатывается — неустойчивое; на столе остаётся где угодно — безразличное.'
        src: p01
      - type: single
        cat: theory
        q: Когда тело, закреплённое на оси, находится в устойчивом равновесии?
        opts: ['Когда центр масс ниже оси', 'Когда центр масс выше оси', 'Когда ось проходит через центр масс', 'Всегда']
        ans: a
        hint: Подумайте о маятнике.
        explain: Устойчивое равновесие — центр масс ниже оси; выше — неустойчивое; на оси — безразличное.
        src: p01
      - type: single
        cat: theory
        q: При каком условии тело на опоре не опрокидывается?
        opts: ['Вертикаль через центр масс проходит через площадь опоры', 'Центр масс находится выше опоры', 'Площадь опоры больше 1 м²', 'Масса тела мала']
        ans: a
        hint: Пизанская башня стоит, пока вертикаль из её центра масс попадает в основание.
        explain: Тело на опоре в равновесии, если вертикаль, проведённая через центр масс, проходит через площадь опоры.
        src: p01
      - type: single
        cat: theory
        q: К какой точке приложена сила тяжести тела?
        opts: ['К центру масс', 'К точке опоры', 'К самой верхней точке тела', 'К самой тяжёлой части тела']
        ans: a
        hint: Эту точку также называют центром тяжести.
        explain: Сила тяжести приложена к центру масс (центру тяжести) тела.
        src: p01

  - id: st-problems
    title: Сложные задачи на равновесие
    pages: [p01]
    web:
      - { title: 'Открытая физика: Условия равновесия тел', url: 'https://physics.ru/courses/op25part1/content/chapter1/section/paragraph14/theory.html' }
    theory:
      - kind: rule
        title: Как решать задачи на равновесие
        body: |
          Задачи решаются двумя условиями равновесия:
          - нарисуйте все силы: тяжести (в центре масс), реакции опор, натяжения, трения;
          - запишите сумму сил по осям: $\sum F_x = 0$, $\sum F_y = 0$;
          - выберите ось вращения там, где приложена неизвестная сила, — её момент тогда равен нулю, и уравнение моментов становится проще;
          - решите систему уравнений.
        src: p01
    formulas:
      - title: Балка на двух опорах
        tex: 'N_A + N_B = mg + P,\qquad N_B\,L = mg\frac{L}{2} + P\,x'
        sym: [N_AB, m, g, P, L_rod]
        cond: 'однородная балка длиной L на опорах A и B по концам; груз P на расстоянии x от опоры A; моменты — относительно A'
        src: p01
      - title: Лестница у гладкой стены
        tex: '\mu \ge \frac{1}{2\,\text{tg}\,\alpha}'
        sym: [mu, alpha]
        cond: 'однородная лестница, стена гладкая, α — угол между лестницей и полом; трение только о пол'
        src: p01
    examples:
      - title: Балка на двух опорах
        given: 'Однородная балка длиной 4 м и массой 100 кг лежит концами на опорах A и B. На балке в 1 м от опоры A стоит груз массой 200 кг. Найдите силы реакции опор. ($g = 10$ м/с²)'
        steps: ['Силы: $mg = 1000$ Н в середине (2 м от A), $P = 2000$ Н в 1 м от A, реакции $N_A$ и $N_B$ вверх.', 'Моменты относительно A (момент $N_A$ равен нулю): $N_B\cdot4 = 1000\cdot2 + 2000\cdot1$, $N_B = 1000$ Н.', 'Сумма сил: $N_A + N_B = 3000$ Н, $N_A = 2000$ Н.']
        answer: '$N_A = 2000$ Н, $N_B = 1000$ Н'
        src: p01
      - title: Стержень на шарнире и трос
        given: 'Однородный горизонтальный стержень массой 10 кг одним концом закреплён шарниром у стены, другой конец держит трос, идущий к стене под углом 30° к стержню. Найдите натяжение троса. ($g = 10$ м/с²)'
        steps: ['Ось — в шарнире: неизвестная сила шарнира даёт нулевой момент.', 'Плечо силы тяжести $\frac L2$, плечо натяжения $L\sin30^\circ$.', '$T\cdot L\sin30^\circ = mg\frac L2$, $T = \frac{mg}{2\sin30^\circ} = \frac{100}{2\cdot0{,}5} = 100$ Н.']
        answer: '$T = 100$ Н'
        src: p01
      - title: Лестница у гладкой стены
        given: 'Однородная лестница массой m прислонена к гладкой стене под углом α = 60° к полу. При каком наименьшем коэффициенте трения о пол она не соскользнёт?'
        steps: ['Силы: тяжести mg в середине, реакция пола N вверх, трение о пол $F_{тр}$ к стене, реакция гладкой стены $N_{ст}$ горизонтально (трения о стену нет).', 'Суммы сил: $N = mg$, $F_{тр} = N_{ст}$.', 'Моменты относительно нижнего конца: $N_{ст}L\sin\alpha = mg\frac L2\cos\alpha$, $N_{ст} = \frac{mg}{2\,\text{tg}\,\alpha}$.', 'Лестница стоит, если $F_{тр} \le \mu N$: $\mu \ge \frac{1}{2\,\text{tg}\,\alpha} = \frac{1}{2\sqrt3} \approx 0{,}29$.']
        answer: '$\mu \ge 0{,}29$'
        src: p01
    questions:
      - type: numeric
        cat: problem
        q: 'Однородная балка длиной 6 м и массой 60 кг лежит концами на двух опорах. В 2 м от левой опоры стоит груз 90 кг. Найдите силу реакции правой опоры. ($g = 10$ м/с²)'
        num: { value: 600, unit: 'Н', check: '(600*3+900*2)/6' }
        hint: 'Моменты относительно левой опоры: $N_B\cdot6 = 600\cdot3 + 900\cdot2$.'
        explain: '$N_B = \frac{1800 + 1800}{6} = 600$ Н; левая опора — $1500 - 600 = 900$ Н.'
        f: [st-problems-f1]
        sol: { given: ['L = 6 м', 'm = 60 кг', 'груз 900 Н в 2 м от A'], find: 'N_B', formula: 'N_BL = mg\frac{L}{2} + Px', calc: 'N_B = \frac{600\cdot3 + 900\cdot2}{6} = 600', answer: '600 Н' }
        src: p01
      - type: numeric
        cat: problem
        q: 'В той же задаче (балка 6 м, 60 кг; груз 90 кг в 2 м от левой опоры) найдите силу реакции левой опоры.'
        num: { value: 900, unit: 'Н', check: '600+900-(600*3+900*2)/6' }
        hint: 'Сумма сил: $N_A + N_B = mg + P$.'
        explain: '$N_A = 600 + 900 - 600 = 900$ Н.'
        f: [st-problems-f1]
        sol: { given: ['mg = 600 Н', 'P = 900 Н', 'N_B = 600 Н'], find: 'N_A', formula: 'N_A + N_B = mg + P', calc: 'N_A = 1500 - 600 = 900', answer: '900 Н' }
        src: p01
      - type: numeric
        cat: problem
