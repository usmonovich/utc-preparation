  n_br: { tex: 'n', meaning: 'число ветвей каната, на которых висит подвижная часть полиспаста', unit: '—', src: p01, web: true }
  P0_bl: { tex: 'P_0', meaning: 'вес подвижного блока', unit: 'Н', src: p01, web: true }
  l_inc: { tex: 'l', meaning: 'длина наклонной плоскости', unit: 'м', src: p01, web: true }
  R_hand: { tex: 'R', meaning: 'длина рукоятки ворота', unit: 'м', src: p01, web: true }
