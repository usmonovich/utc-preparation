  A_pol: { tex: 'A_{пол}', meaning: 'полезная работа (подъём груза)', unit: 'Дж', src: p01, web: true }
  A_poln: { tex: 'A_{полн}', meaning: 'полная (затраченная) работа', unit: 'Дж', src: p01, web: true }
