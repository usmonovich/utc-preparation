# ───────────────────────────────────────────────────────────────
  - id: dc-connect
    title: Последовательное и параллельное соединение проводников
    pages: [c27]
    web:
      - { title: 'Открытая физика: Последовательное и параллельное соединение проводников', url: 'https://physics.ru/courses/op25part2/content/chapter1/section/paragraph9/theory.html' }
    theory:
      - kind: note
        title: Почему тема дополнена
        body: 'На стр. c27 («Распределение напряжения») записано только последовательное соединение резисторов, формулы общего сопротивления в конспекте нет. По вашей просьбе тема дополнена из интернета.'
        src: c27
      - kind: law
        title: Последовательное соединение
        body: 'Ток во всех проводниках одинаков: $I = I_1 = I_2$. Общее напряжение равно сумме напряжений: $U = U_1 + U_2$. Общее сопротивление $R = R_1 + R_2 + \dots$ Напряжения делятся пропорционально сопротивлениям: $\frac{U_1}{U_2} = \frac{R_1}{R_2}$.'
        src: c27
        fig: resistors-connect
      - kind: law
        title: Параллельное соединение
        body: 'Напряжение на всех проводниках одинаково: $U = U_1 = U_2$. Общий ток равен сумме токов: $I = I_1 + I_2$. Общее сопротивление: $\frac1R = \frac{1}{R_1} + \frac{1}{R_2} + \dots$ Токи обратно пропорциональны сопротивлениям: $\frac{I_1}{I_2} = \frac{R_2}{R_1}$.'
        src: c27
      - kind: rule
        title: n одинаковых проводников
        body: 'Последовательно: $R = nR_0$. Параллельно: $R = \frac{R_0}{n}$.'
        src: c27
    formulas:
      - title: Последовательное соединение
        tex: 'R_{об} = R_1 + R_2 + \dots + R_n'
        sym: [R_tot, R1n]
        src: c27
      - title: Параллельное соединение
        tex: '\frac{1}{R_{об}} = \frac{1}{R_1} + \frac{1}{R_2} + \dots + \frac{1}{R_n}'
        sym: [R_tot, R1n]
        src: c27
      - title: Два проводника параллельно
        tex: 'R_{об} = \frac{R_1R_2}{R_1 + R_2}'
        sym: [R_tot, R1n]
        src: c27
      - title: Распределение токов при параллельном соединении
        tex: '\frac{I_1}{I_2} = \frac{R_2}{R_1}'
        sym: [I1n, R1n]
        src: c27
      - title: n одинаковых проводников
        tex: 'R_{пос} = nR_0,\qquad R_{пар} = \frac{R_0}{n}'
        sym: [R0_same, n_wires]
        src: c27
    questions:
      - type: numeric
        cat: problem
        q: 'Резисторы 4 Ом и 6 Ом соединены последовательно. Найдите общее сопротивление.'
        num: { value: 10, unit: 'Ом', check: '4+6' }
        hint: 'При последовательном соединении сопротивления складываются.'
        explain: '$R = 4 + 6 = 10$ Ом.'
        f: [1]
        sol: { given: ['R₁ = 4 Ом', 'R₂ = 6 Ом'], find: 'R_об', formula: 'R_{об} = R_1 + R_2', calc: 'R_{об} = 4 + 6 = 10', answer: '10 Ом' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Резисторы 4 Ом и 6 Ом соединены параллельно. Найдите общее сопротивление.'
        num: { value: 2.4, unit: 'Ом', check: '4*6/(4+6)' }
        hint: '$R = \frac{R_1R_2}{R_1 + R_2}$.'
        explain: '$R = \frac{24}{10} = 2{,}4$ Ом — меньше меньшего из сопротивлений.'
        f: [3]
        sol: { given: ['R₁ = 4 Ом', 'R₂ = 6 Ом'], find: 'R_об', formula: 'R_{об} = \frac{R_1R_2}{R_1 + R_2}', calc: 'R_{об} = \frac{4\cdot6}{4 + 6} = 2{,}4', answer: '2,4 Ом' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Пять одинаковых ламп по 100 Ом соединены параллельно. Найдите общее сопротивление.'
        num: { value: 20, unit: 'Ом', check: '100/5' }
        hint: '$R = \frac{R_0}{n}$.'
        explain: '$R = \frac{100}{5} = 20$ Ом.'
        f: [5]
        sol: { given: ['R₀ = 100 Ом', 'n = 5'], find: 'R_об', formula: 'R_{пар} = \frac{R_0}{n}', calc: 'R = \frac{100}{5} = 20', answer: '20 Ом' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Резисторы 2 Ом и 8 Ом соединены параллельно, общий ток 5 А. Найдите ток через резистор 2 Ом.'
        num: { value: 4, unit: 'А', check: '5*8/(2+8)' }
        hint: 'Токи обратно пропорциональны сопротивлениям: $\frac{I_1}{I_2} = \frac{R_2}{R_1}$, $I_1 + I_2 = 5$ А.'
        explain: '$I_1 = 5\cdot\frac{8}{2 + 8} = 4$ А, через 8 Ом — 1 А.'
        f: [4]
        sol: { given: ['R₁ = 2 Ом', 'R₂ = 8 Ом', 'I = 5 А'], find: 'I₁', formula: '\frac{I_1}{I_2} = \frac{R_2}{R_1},\ I_1 + I_2 = I', calc: 'I_1 = I\frac{R_2}{R_1 + R_2} = 5\cdot\frac{8}{10} = 4', answer: '4 А' }
        src: c27
      - type: single
        cat: theory
        q: Что одинаково у проводников, соединённых параллельно?
        opts: ['Напряжение', 'Сила тока', 'Сопротивление', 'Мощность']
        ans: a
        hint: Их концы присоединены к одним и тем же точкам.
        explain: 'При параллельном соединении $U = U_1 = U_2$, а токи складываются.'
        src: c27
      - type: single
        cat: theory
        q: Что одинаково у проводников, соединённых последовательно?
        opts: ['Сила тока', 'Напряжение', 'Сопротивление', 'Мощность']
        ans: a
        hint: Заряд проходит через проводники «по очереди».
        explain: 'При последовательном соединении $I = I_1 = I_2$, а напряжения складываются.'
        src: c27
  - id: dc-bridge
    title: Мост Уитстона
    pages: [c26]
    theory:
      - kind: text
        title: Мост Уитстона
        body: 'Сверху резисторы $R_1$ и $R_2$, снизу $R_3$ и $R_4$, между средними точками — $R_5$. В такой схеме нет ни параллельного, ни последовательного соединения. (В тетради — «мост Уинстона», см. EL07.)'
        src: c26
        errata: [EL07]
      - kind: rule
        title: Условие баланса
        body: 'Если $R_1R_4 = R_2R_3$, мост уравновешен: потенциалы средних точек равны, 5-й резистор не работает (его можно убрать). Так же в диагонали: конденсатор не заряжается (q = 0), лампочка не горит, амперметр показывает $I_0 = 0$, вольтметр — V = 0.'
        src: c26
        fig: wheatstone
    formulas:
      - title: Условие баланса моста
        tex: 'R_1\cdot R_4 = R_2\cdot R_3'
        sym: [R1to5]
        boxed: true
        src: c26
    questions:
      - type: numeric
        cat: problem
        q: 'В мосте $R_1 = 2$ Ом, $R_2 = 4$ Ом, $R_3 = 3$ Ом. Каким должно быть $R_4$, чтобы мост был уравновешен?'
        num: { value: 6, unit: 'Ом', check: '4*3/2' }
        hint: '$R_1R_4 = R_2R_3$.'
        explain: '$R_4 = \frac{R_2R_3}{R_1} = \frac{4\cdot3}{2} = 6$ Ом.'
        f: [1]
        sol: { given: ['R₁ = 2 Ом', 'R₂ = 4 Ом', 'R₃ = 3 Ом'], find: 'R₄', formula: 'R_4 = \frac{R_2R_3}{R_1}', calc: 'R_4 = \frac{12}{2} = 6', answer: '6 Ом' }
        src: c26
      - type: numeric
        cat: problem
        q: 'В мосте все четыре плеча по 10 Ом, в диагонали $R_5 = 5$ Ом. Найдите общее сопротивление моста.'
        num: { value: 10, unit: 'Ом', check: '(10+10)*(10+10)/((10+10)+(10+10))' }
        hint: Мост уравновешен — $R_5$ можно убрать.
        explain: 'Остаются две ветви по 20 Ом параллельно: $R_{об} = 10$ Ом.'
        f: [1]
        sol: { given: ['R₁ = R₂ = R₃ = R₄ = 10 Ом', 'R₅ = 5 Ом'], find: 'R_об', formula: 'R_1R_4 = R_2R_3 \Rightarrow R_5\ \text{не работает}', calc: 'R_{об} = \frac{20\cdot20}{20 + 20} = 10', answer: '10 Ом' }
        src: c26
      - type: numeric
        cat: problem
        q: 'Мост: $R_1 = 1$ Ом, $R_2 = 2$ Ом, $R_3 = 2$ Ом, $R_4 = 4$ Ом, в диагонали — лампочка. Найдите общее сопротивление.'
        num: { value: 2, unit: 'Ом', check: '(1+2)*(2+4)/((1+2)+(2+4))' }
        hint: 'Проверьте баланс: $1\cdot4 = 2\cdot2$.'
        explain: 'Мост уравновешен, лампочка не горит. Ветви $R_1 + R_2 = 3$ Ом и $R_3 + R_4 = 6$ Ом параллельно: $\frac{3\cdot6}{9} = 2$ Ом.'
        f: [1]
        sol: { given: ['R₁ = 1', 'R₂ = 2', 'R₃ = 2', 'R₄ = 4 Ом'], find: 'R_об', formula: 'R_{об} = \frac{(R_1 + R_2)(R_3 + R_4)}{R_1 + R_2 + R_3 + R_4}', calc: 'R_{об} = \frac{3\cdot6}{9} = 2', answer: '2 Ом' }
        src: c26
      - type: numeric
        cat: problem
        q: 'В уравновешенном мосте $R_1 = 6$ Ом, $R_2 = 3$ Ом, $R_4 = 4$ Ом. Найдите $R_3$.'
        num: { value: 8, unit: 'Ом', check: '6*4/3' }
        hint: '$R_3 = \frac{R_1R_4}{R_2}$.'
        explain: '$R_3 = \frac{6\cdot4}{3} = 8$ Ом.'
        f: [1]
        sol: { given: ['R₁ = 6 Ом', 'R₂ = 3 Ом', 'R₄ = 4 Ом'], find: 'R₃', formula: 'R_3 = \frac{R_1R_4}{R_2}', calc: 'R_3 = \frac{24}{3} = 8', answer: '8 Ом' }
        src: c26
      - type: single
        cat: theory
        q: Что показывает амперметр в диагонали уравновешенного моста?
        opts: ['Ноль', 'Ток источника', 'Половину тока источника', 'Максимальный ток']
        ans: a
        hint: 'На стр. c26 под схемой с амперметром: $I_0 = 0$.'
        explain: При балансе потенциалы концов диагонали равны — ток через неё не идёт.
        f: [1]
        src: c26
      - type: single
        cat: theory
        q: Почему мост Уитстона нельзя сразу свести к последовательному или параллельному соединению?
        opts: ['Резистор в диагонали связывает обе ветви', 'В нём нет источника', 'Все резисторы одинаковые', 'Он содержит конденсатор']
        ans: a
        hint: Первая фраза темы.
        explain: В этой системе нет ни параллельного, ни последовательного соединения — мешает $R_5$.
        src: c26
      - type: single
        cat: theory
        q: В диагональ уравновешенного моста включили лампочку. Что с ней?
        opts: ['Не горит', 'Горит ярче всего', 'Перегорает', 'Мигает']
        ans: a
        hint: Рисунок с лампочкой на стр. c26.
        explain: При выполнении условия баланса ток через диагональ равен нулю — «лампочка не горит».
        src: c26

# ───────────────────────────────────────────────────────────────
  - id: dc-meters
    title: Распределение напряжения. Амперметр и вольтметр
    pages: [c27, c28]
    theory:
      - kind: rule
        title: Последовательное соединение резисторов
        body: 'При последовательном соединении $I = I_1 = I_2 = \dots = I_n$ и $U = U_1 + U_2 + \dots + U_n$. Так как ток общий, $\frac{U}{R_{об}} = \frac{U_i}{R_i}$, откуда $U_i = U\frac{R_i}{R_{об}}$.'
        src: c27
      - kind: definition
        title: Амперметр
        body: 'Амперметр — прибор для измерения силы тока в цепи или на участке цепи. Амперметр всегда подключается последовательно с выбранным элементом; амперметр рядом с источником показывает силу тока в источнике.'
        src: [c27, c28]
        fig: meters
      - kind: text
        title: Шкала амперметра
        body: 'На рисунке шкала от 0 до 4 А: цена деления $\Delta I = 0{,}2$ А, измерительный предел I = 0 ÷ 4 А.'
        src: c27
      - kind: definition
        title: Вольтметр
        body: Вольтметр — прибор, который измеряет напряжение. Вольтметр подключается параллельно. Так как у вольтметра очень большое внутреннее сопротивление, его можно подключать прямо к источнику.
        src: c28
      - kind: note
        title: Шунтирующее соединение
        body: Тема «Шунтирующее соединение» в тетради озаглавлена, но не расписана; фраза об амперметре осталась незаконченной.
        src: c28
      - kind: rule
        title: Шунт и добавочное сопротивление
        body: |
          В конспекте тема «Шунтирующее соединение» озаглавлена, но не расписана. По учебным материалам:
          - **Шунт** — резистор с малым сопротивлением, который подключают **параллельно** амперметру. Большая часть тока идёт через шунт, через прибор — только известная малая доля. Чтобы увеличить предел измерения в n раз, нужен шунт $R_ш = \frac{R_A}{n - 1}$.
          - **Добавочное сопротивление** подключают **последовательно** с вольтметром. Чтобы увеличить предел измерения напряжения в n раз, нужно $R_д = R_V(n - 1)$.
        src: c28
        web:
          - { title: 'Википедия: Шунт', url: 'https://ru.wikipedia.org/wiki/Шунт' }
          - { title: 'С. Степанов. Расчёт измерительных приборов (PDF, elec.ru)', url: 'https://www.elec.ru/files/2020/02/28/_Stepanov_S.__Raschet_izmeritelnueh_priborov.PDF' }
    formulas:
      - title: Последовательное соединение
        tex: 'I = I_1 = I_2 = \dots = I_n,\qquad U = U_1 + U_2 + \dots + U_n'
        sym: [I_cur, I1n, U_volt, U1n]
        src: c27
      - title: Напряжение на i-м резисторе
        tex: 'U_i = U\frac{R_i}{R_{об}}'
        sym: [U1n, U_volt, R1n, R_tot]
        boxed: true
        src: c27
      - id: dc-meters-fsh
        title: Сопротивление шунта
        tex: 'R_{ш} = \frac{R_A}{n - 1}'
        sym: [R_sh, R_amm, n_lim]
        src: c28
        web:
          - { title: 'Википедия: Шунт', url: 'https://ru.wikipedia.org/wiki/Шунт' }
          - { title: 'С. Степанов. Расчёт измерительных приборов (PDF, elec.ru)', url: 'https://www.elec.ru/files/2020/02/28/_Stepanov_S.__Raschet_izmeritelnueh_priborov.PDF' }
      - id: dc-meters-fadd
        title: Добавочное сопротивление вольтметра
        tex: 'R_{д} = R_V\,(n - 1)'
        sym: [R_add, R_vm, n_lim]
        src: c28
        web:
          - { title: 'С. Степанов. Расчёт измерительных приборов (PDF, elec.ru)', url: 'https://www.elec.ru/files/2020/02/28/_Stepanov_S.__Raschet_izmeritelnueh_priborov.PDF' }
    questions:
      - type: numeric
        cat: problem
        q: 'Резисторы 2, 3 и 5 Ом соединены последовательно и подключены к 20 В. Найдите напряжение на резисторе 3 Ом.'
        num: { value: 6, unit: 'В', check: '20*3/(2+3+5)' }
        hint: '$U_i = U\frac{R_i}{R_{об}}$.'
        explain: '$R_{об} = 10$ Ом, $U_2 = 20\cdot\frac{3}{10} = 6$ В.'
        f: [2]
        sol: { given: ['R = 2, 3, 5 Ом', 'U = 20 В'], find: 'U₂', formula: 'U_2 = U\frac{R_2}{R_{об}}', calc: 'U_2 = 20\cdot\frac{3}{10} = 6', answer: '6 В' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Найдите силу тока в той же цепи (2, 3 и 5 Ом последовательно, 20 В).'
        num: { value: 2, unit: 'А', check: '20/(2+3+5)' }
        hint: Ток одинаков во всех резисторах.
        explain: '$I = \frac{20}{10} = 2$ А.'
        f: [1]
        sol: { given: ['R_об = 10 Ом', 'U = 20 В'], find: 'I', formula: 'I = \frac{U}{R_{об}}', calc: 'I = \frac{20}{10} = 2', answer: '2 А' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Стрелка амперметра из конспекта (0–4 А, цена деления 0,2 А) отклонилась на 13 делений. Какую силу тока он показывает?'
        num: { value: 2.6, unit: 'А', check: '13*0.2' }
        hint: Умножьте число делений на цену деления.
        explain: '$I = 13\cdot0{,}2 = 2{,}6$ А.'
        sol: { given: ['ΔI = 0,2 А', '13 делений'], find: 'I', formula: 'I = n\cdot\Delta I', calc: 'I = 13\cdot0{,}2 = 2{,}6', answer: '2,6 А' }
        src: c27
      - type: numeric
        cat: problem
        q: 'Сколько делений на шкале амперметра с пределом 4 А и ценой деления 0,2 А?'
        num: { value: 20, unit: '', check: '4/0.2' }
        hint: Разделите предел на цену деления.
        explain: '$\frac{4}{0{,}2} = 20$ делений.'
        sol: { given: ['предел 4 А', 'ΔI = 0,2 А'], find: 'число делений', formula: 'n = \frac{I_{max}}{\Delta I}', calc: 'n = \frac{4}{0{,}2} = 20', answer: '20' }
        src: c27
      - type: single
        cat: theory
        q: Как подключают амперметр?
        opts: ['Последовательно с элементом', 'Параллельно элементу', 'Только к источнику', 'Как угодно']
        ans: a
        hint: Определение на стр. c27.
        explain: Амперметр всегда подключается последовательно к выбранному элементу.
        src: c27
      - type: single
        cat: theory
