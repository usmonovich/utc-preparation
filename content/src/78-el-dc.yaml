        f: [3]
        sol: { given: ['P₀₁ = 100 Вт', 'P₀₂ = 25 Вт'], find: 'P₂', formula: 'P_2 = P_{02}\left(\frac{P_{01}}{P_{01} + P_{02}}\right)^2', calc: 'P_2 = 25\cdot0{,}64 = 16', answer: '16 Вт' }
        src: c31
      - type: numeric
        cat: problem
        q: 'Найдите общую мощность ламп 100 Вт и 25 Вт, включённых последовательно в сеть 220 В.'
        num: { value: 20, unit: 'Вт', check: '1/(1/100+1/25)' }
        hint: '$P_{об} = \left(\frac1{P_{01}} + \frac1{P_{02}}\right)^{-1}$.'
        explain: '$P_{об} = \frac{100\cdot25}{125} = 20$ Вт; проверка: $4 + 16 = 20$.'
        f: [4]
        sol: { given: ['P₀₁ = 100 Вт', 'P₀₂ = 25 Вт'], find: 'P_об', formula: 'P_{об} = \left(\frac{1}{P_{01}} + \frac{1}{P_{02}}\right)^{-1}', calc: 'P_{об} = \frac{2500}{125} = 20', answer: '20 Вт' }
        src: c31
      - type: numeric
        cat: problem
        q: 'Те же лампы (100 Вт и 25 Вт) включили параллельно в сеть 220 В. Найдите общую мощность.'
