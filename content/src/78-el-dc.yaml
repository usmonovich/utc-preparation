# ───────────────────────────────────────────────────────────────
  - id: dc-capres
    title: Конденсатор в цепи постоянного тока. Зарядка и разрядка источника
    pages: [c35]
    theory:
      - kind: rule
        title: Конденсатор и постоянный ток
        body: 'Конденсатор, подключённый к источнику постоянного напряжения, за очень короткое время заряжается и после этого не пропускает ток: его сопротивление постоянному току можно считать бесконечно большим. Конденсатор прямо на источнике: $U_c = \varepsilon$, $I = 0$, $q = C\varepsilon$; с амперметром — $I_A = 0$; с лампочкой — лампочка не горит.'
        src: c35
        fig: cap-dc
      - kind: text
        title: Конденсатор параллельно резистору
        body: 'Ток идёт через резистор, конденсатор заряжается до напряжения резистора: $U_c = U_R$, $I = \frac{\varepsilon}{R + r}$, $U_c = \frac{\varepsilon R}{R + r}$, $q = \frac{C\varepsilon R}{R + r}$.'
        src: c35
      - kind: text
        title: Конденсатор с резистором в одной ветви
        body: 'Если конденсатор стоит последовательно с резистором $R_2$, ток через эту ветвь не идёт — $R_2$ «не работает». Ток течёт через $R_1$ и $R_3$: $I = \frac{\varepsilon}{R_1 + R_3 + r}$, а конденсатор заряжается до напряжения на $R_3$.'
        src: c35
      - kind: rule
        title: Зарядка и разрядка источника
        body: 'Источник отдаёт ток (разрядка, ток выходит из «+»): $U_{раз} = \varepsilon - I_{раз}r$. Источник заряжают (ток входит в «+»): $U_{зар} = \varepsilon + I_{зар}r$.'
        src: c35
    formulas:
      - title: Конденсатор прямо на источнике
        tex: 'U_c = \varepsilon,\qquad I = 0,\qquad q = C\varepsilon'
        sym: [U_c, emf, I_cur, q_el, C_el]
        src: c35
      - title: Конденсатор параллельно резистору
        tex: 'U_c = \frac{\varepsilon R}{R + r},\qquad q = \frac{C\varepsilon R}{R + r}'
        sym: [U_c, q_el, C_el, emf, R_ext, r_int]
        src: c35
      - title: Ток при ветви с конденсатором
        tex: 'I = \frac{\varepsilon}{R_1 + R_3 + r}'
        sym: [I_cur, emf, R1to5, r_int]
        src: c35
      - title: Разрядка и зарядка источника
        tex: 'U_{раз} = \varepsilon - I_{раз}\cdot r,\qquad U_{зар} = \varepsilon + I_{зар}\cdot r'
        sym: [U_ch, emf, r_int]
        boxed: true
        src: c35
