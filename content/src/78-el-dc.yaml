      - title: Внешнее и внутреннее напряжение
        tex: 'U_{внеш} = \frac{\varepsilon R}{R + r},\qquad U_{внутр} = \frac{\varepsilon r}{R + r}'
        sym: [U_ext, U_inr, emf, R_ext, r_int]
        boxed: true
        src: c32
      - title: КПД источника
        tex: '\eta = \frac{U_{внеш}}{\varepsilon}\cdot100\% = \frac{R}{R + r}\cdot100\%'
        sym: [eta, U_ext, emf, R_ext, r_int]
        boxed: true
        src: c32
    questions:
