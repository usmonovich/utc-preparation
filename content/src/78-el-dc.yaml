errata:
  - id: EL07
    page: c26
    severity: typo
    original: '«Мост Уинстона»'
    issue: Схема названа по фамилии Чарльза Уитстона (Wheatstone).
    target: 'Название схемы с четырьмя резисторами'
    suggestion: '«Мост Уитстона».'
  - id: EL08
    page: c31
    severity: note
    original: '«Электродвижущая сила — это работа сторонних сил по перемещению пробного заряда во всей замкнутой цепи», \(\varepsilon = \frac Aq\)'
    issue: 'По формуле ЭДС — не сама работа, а работа, делённая на заряд (работа сторонних сил на единицу заряда), поэтому единица — вольт [Дж/Кл], а не джоуль.'
    target: 'Определение ЭДС'
    suggestion: '«ЭДС — работа сторонних сил по перемещению единичного положительного заряда по всей замкнутой цепи: \(\varepsilon = \frac Aq\)».'
  - id: EL09
    page: c34
    severity: typo
    original: '\(r_{об} = \frac1{r_1} + \frac1{r_2} + \frac1{r_3} + \dots + \frac1{r_n}\) (в рамке, неправильное параллельное соединение)'
    issue: 'Пропущена степень −1, которая есть в той же формуле для правильного соединения строкой выше. Без неё получается величина в См (обратных омах), а не сопротивление.'
    target: 'Внутреннее сопротивление при неправильном параллельном соединении источников (в рамке)'
    suggestion: '\(r_{об} = \left(\frac1{r_1} + \frac1{r_2} + \dots + \frac1{r_n}\right)^{-1}\) — как при правильном соединении.'

topics:
  - id: dc-current
    title: Электрический ток. Сила и плотность тока
    pages: [c19, c23, c24, c25]
    theory:
      - kind: definition
        title: Электрический ток
        body: Электрический ток — это упорядоченное (одностороннее) движение заряженных частиц.
        src: [c19, c23]
      - kind: definition
        title: Сила тока
        body: 'Сила тока — это заряд, проходящий через площадь поперечного сечения проводника за единицу времени: $I = \frac qt$ [А] (ампер) = [Кл/с]. Сила тока — скалярная величина, но у тока всегда есть условное направление.'
        src: [c19, c23, c24]
      - kind: rule
        title: Направление тока
        body: 'Направление тока совпадает с направлением движения положительных частиц, то есть направлено против движения отрицательных частиц (электронов). Постоянный ток не зависит от времени.'
        src: c24
        fig: current-drift
      - kind: text
        title: Сила тока через движение электронов
        body: '$I = \frac{Ne}{t} = \frac{NeV}{Vt} = \frac{NeSl}{Vt} = ne\upsilon S$, где $V = Sl$, $\upsilon = \frac lt$ — скорость поступательного движения электронов, $n = \frac NV$ — концентрация свободных электронов, S — площадь поперечного сечения, l — длина проводника, $e = 1{,}6\cdot10^{-19}$ Кл.'
        src: [c19, c24]
      - kind: definition
        title: Плотность тока
        body: 'Плотность тока — это ток, проходящий через единицу площади проводника. Плотность тока — векторная величина: $\vec j = \frac IS = ne\vec\upsilon$ [А/м²].'
        src: [c19, c24]
      - kind: text
        title: Заряд при меняющейся силе тока
        body: '$q = It$ — только когда I = const. В общем случае $q = \int_{t_1}^{t_2} I(t)\,dt$ — площадь под графиком I(t). Если сила тока меняется линейно, $I(t) = kt + b$, то $q = \bar I\cdot\Delta t$, где $\bar I = \frac{I_1 + I_2}{2}$ — средняя сила тока.'
        src: c25
        fig: charge-area
    formulas:
      - title: Сила тока
        tex: 'I = \frac{q}{t} = \frac{Ne}{t}'
        sym: [I_cur, q_el, t, N_e, e_el]
        boxed: true
        src: [c19, c24]
      - title: Сила тока через концентрацию электронов
        tex: 'I = ne\upsilon S,\qquad n = \frac{N}{V}'
        sym: [I_cur, n_e, e_el, v_drift, S_cond, N_e, V_cond]
        boxed: true
        src: [c19, c24]
      - title: Плотность тока
        tex: '\vec j = \frac{I}{S} = ne\vec\upsilon'
        sym: [j_cur, I_cur, S_cond, n_e, e_el, v_drift]
        boxed: true
        src: [c19, c24]
      - title: Заряд при постоянном токе
        tex: 'q = It'
        sym: [q_el, I_cur, t]
        cond: '\(I = \text{const}\)'
        src: c25
      - title: Заряд при меняющемся токе
        tex: 'q = \int_{t_1}^{t_2} I(t)\,dt'
        sym: [q_el, I_cur, dt_int]
        src: c25
      - title: Линейно меняющийся ток
        tex: 'q = \bar I\cdot\Delta t,\qquad \bar I = \frac{I_1 + I_2}{2}'
        sym: [q_el, I_avg, dt_int, I12_lin]
        cond: '\(I(t) = kt + b\)'
        src: c25
    questions:
      - type: numeric
        cat: problem
        q: 'Через сечение проводника за 1 минуту прошёл заряд 30 Кл. Найдите силу тока.'
        num: { value: 0.5, unit: 'А', check: '30/60' }
        hint: '$I = \frac qt$, t = 60 с.'
        explain: '$I = \frac{30}{60} = 0{,}5$ А.'
        f: [1]
        sol: { given: ['q = 30 Кл', 't = 60 с'], find: 'I', formula: 'I = \frac{q}{t}', calc: 'I = \frac{30}{60} = 0{,}5', answer: '0,5 А' }
        src: c19
      - type: numeric
        cat: problem
        q: 'Сила тока 2 А. Сколько электронов проходит через сечение проводника за 1 с?'
        num: { value: 1.25e19, unit: '', check: '2*1/1.6e-19' }
        hint: '$I = \frac{Ne}{t}$, отсюда $N = \frac{It}{e}$.'
        explain: '$N = \frac{2\cdot1}{1{,}6\cdot10^{-19}} = 1{,}25\cdot10^{19}$.'
        f: [1]
        sol: { given: ['I = 2 А', 't = 1 с', 'e = 1,6·10⁻¹⁹ Кл'], find: 'N', formula: 'N = \frac{It}{e}', calc: 'N = \frac{2}{1{,}6\cdot10^{-19}} = 1{,}25\cdot10^{19}', answer: '1,25·10¹⁹' }
        src: c19
      - type: numeric
        cat: problem
        q: 'По проводу сечением 1 мм² течёт ток 1,7 А; концентрация свободных электронов $8{,}5\cdot10^{28}$ м⁻³. Найдите скорость упорядоченного движения электронов.'
        num: { value: 1.25e-4, unit: 'м/с', check: '1.7/(8.5e28*1.6e-19*1e-6)' }
        hint: '$\upsilon = \frac{I}{neS}$, 1 мм² = $10^{-6}$ м².'
        explain: '$\upsilon = \frac{1{,}7}{8{,}5\cdot10^{28}\cdot1{,}6\cdot10^{-19}\cdot10^{-6}} = 1{,}25\cdot10^{-4}$ м/с — меньше миллиметра в секунду.'
        f: [2]
        sol: { given: ['I = 1,7 А', 'S = 10⁻⁶ м²', 'n = 8,5·10²⁸ м⁻³'], find: 'υ', formula: '\upsilon = \frac{I}{neS}', calc: '\upsilon = \frac{1{,}7}{8{,}5\cdot10^{28}\cdot1{,}6\cdot10^{-19}\cdot10^{-6}} = 1{,}25\cdot10^{-4}', answer: '1,25·10⁻⁴ м/с' }
        src: [c19, c24]
      - type: numeric
        cat: problem
        q: 'Ток 5 А течёт по проводу сечением 2,5 мм². Найдите плотность тока.'
        num: { value: 2e6, unit: 'А/м²', check: '5/2.5e-6' }
        hint: '$j = \frac IS$.'
        explain: '$j = \frac{5}{2{,}5\cdot10^{-6}} = 2\cdot10^6$ А/м².'
        f: [3]
        sol: { given: ['I = 5 А', 'S = 2,5·10⁻⁶ м²'], find: 'j', formula: 'j = \frac{I}{S}', calc: 'j = \frac{5}{2{,}5\cdot10^{-6}} = 2\cdot10^6', answer: '2·10⁶ А/м²' }
        src: [c19, c24]
      - type: numeric
        cat: problem
        q: 'Сила тока за 10 с равномерно выросла от 2 А до 6 А. Какой заряд прошёл через проводник?'
        num: { value: 40, unit: 'Кл', check: '(2+6)/2*10' }
        hint: '$q = \bar I\Delta t$, $\bar I = \frac{I_1 + I_2}{2}$.'
        explain: '$\bar I = 4$ А, $q = 4\cdot10 = 40$ Кл — площадь трапеции под графиком.'
        f: [6]
        sol: { given: ['I₁ = 2 А', 'I₂ = 6 А', 'Δt = 10 с'], find: 'q', formula: 'q = \frac{I_1 + I_2}{2}\Delta t', calc: 'q = 4\cdot10 = 40', answer: '40 Кл' }
        src: c25
      - type: single
        cat: theory
        q: Как направлен ток относительно движения электронов?
        opts: ['Против движения электронов', 'По движению электронов', 'Перпендикулярно', 'Ток не имеет направления']
        ans: a
        hint: Ток направлен по движению положительных частиц.
        explain: Направление тока совпадает с движением положительных частиц, то есть противоположно движению электронов.
        src: c24
      - type: single
        cat: theory
        q: Какая из величин — векторная?
        opts: ['Плотность тока $\vec j$', 'Сила тока $I$', 'Заряд $q$', 'Сопротивление $R$']
        ans: a
        hint: 'Сила тока — скаляр «с условным направлением».'
        explain: 'Плотность тока — векторная величина: $\vec j = ne\vec\upsilon$.'
        f: [3]
        src: [c23, c24]
      - type: single
        cat: theory
        q: Что равно заряду на графике силы тока I(t)?
        opts: ['Площадь под графиком', 'Наклон графика', 'Наибольшее значение тока', 'Длина графика']
        ans: a
        hint: 'На рисунке стр. c25 подписано «S = q».'
        explain: '$q = \int I(t)\,dt$ — площадь под графиком I(t).'
        f: [5]
        src: c25
      - type: single
        cat: theory
        q: Какой ток называют постоянным?
        opts: ['Ток, не зависящий от времени', 'Ток в одном проводнике', 'Ток при постоянном сопротивлении', 'Ток только в металлах']
        ans: a
        hint: Надпись в рамке на стр. c24.
        explain: Постоянный ток не зависит от времени.
        src: c24

# ───────────────────────────────────────────────────────────────
  - id: dc-resist
    title: Сопротивление. Закон Ома для участка цепи
    pages: [c19, c20, c25]
    theory:
      - kind: definition
        title: Сопротивление
        body: Все факторы, мешающие прохождению тока через проводник, объединяются под одним названием — сопротивление. Сопротивление проводника зависит от материала проводника и от его геометрических размеров.
        src: c25
      - kind: text
        title: Сопротивление проводника
        body: '$R = \rho\frac lS$ [Ом], где l — длина проводника, S — площадь сечения, ρ — удельное сопротивление [Ом·м]: $\rho = \frac{RS}{l}$.'
        src: c19
        fig: wire-resistance
      - kind: law
        title: Закон Ома для участка цепи
        body: 'Ток, проходящий через участок цепи, прямо пропорционален приложенному напряжению и обратно пропорционален сопротивлению проводника: $I = \frac UR$.'
        src: [c19, c20]
    formulas:
      - title: Сопротивление проводника
        tex: 'R = \rho\frac{l}{S}'
        sym: [R_res, rho_r, l_cond, S_cond]
        boxed: true
        src: c19
      - title: Удельное сопротивление
        tex: '\rho = \frac{RS}{l}'
        sym: [rho_r, R_res, S_cond, l_cond]
        boxed: true
        src: c19
      - title: Закон Ома для участка цепи
        tex: 'I = \frac{U}{R}'
        sym: [I_cur, U_volt, R_res]
        boxed: true
        src: c20
    questions:
      - type: numeric
        cat: problem
        q: 'Провод длиной 100 м и сечением 1 мм² сделан из материала с удельным сопротивлением $1{,}7\cdot10^{-8}$ Ом·м. Найдите его сопротивление.'
        num: { value: 1.7, unit: 'Ом', check: '1.7e-8*100/1e-6' }
        hint: '$R = \rho\frac lS$.'
        explain: '$R = 1{,}7\cdot10^{-8}\cdot\frac{100}{10^{-6}} = 1{,}7$ Ом.'
        f: [1]
        sol: { given: ['ρ = 1,7·10⁻⁸ Ом·м', 'l = 100 м', 'S = 10⁻⁶ м²'], find: 'R', formula: 'R = \rho\frac{l}{S}', calc: 'R = 1{,}7\cdot10^{-8}\cdot10^{8} = 1{,}7', answer: '1,7 Ом' }
        src: c19
      - type: numeric
        cat: problem
        q: Длину провода увеличили вдвое, а площадь сечения уменьшили вдвое. Во сколько раз изменилось сопротивление?
        num: { value: 4, unit: '', check: '2/(1/2)' }
        hint: '$R \sim l$, $R \sim \frac1S$.'
        explain: 'Сопротивление выросло в $2\cdot2 = 4$ раза.'
        f: [1]
        sol: { given: ["l' = 2l", "S' = S/2"], find: "R'/R", formula: 'R = \rho\frac{l}{S}', calc: "\\frac{R'}{R} = \\frac{2}{1/2} = 4", answer: 'в 4 раза больше' }
        src: c19
      - type: numeric
        cat: problem
        q: 'На резисторе сопротивлением 4 Ом напряжение 12 В. Найдите силу тока.'
        num: { value: 3, unit: 'А', check: '12/4' }
        hint: '$I = \frac UR$.'
        explain: '$I = \frac{12}{4} = 3$ А.'
        f: [3]
        sol: { given: ['U = 12 В', 'R = 4 Ом'], find: 'I', formula: 'I = \frac{U}{R}', calc: 'I = \frac{12}{4} = 3', answer: '3 А' }
        src: c20
      - type: numeric
        cat: problem
        q: 'Через прибор сопротивлением 440 Ом идёт ток 0,5 А. Найдите напряжение на нём.'
        num: { value: 220, unit: 'В', check: '0.5*440' }
        hint: '$U = IR$.'
        explain: '$U = 0{,}5\cdot440 = 220$ В.'
        f: [3]
        sol: { given: ['I = 0,5 А', 'R = 440 Ом'], find: 'U', formula: 'U = IR', calc: 'U = 0{,}5\cdot440 = 220', answer: '220 В' }
        src: c20
      - type: numeric
        cat: problem
