        src: c31
      - type: numeric
        cat: problem
        q: 'В той же цепи (100 Вт и 25 Вт последовательно, 220 В) найдите мощность лампы 25 Вт.'
        num: { value: 16, unit: 'Вт', check: '25*(100/(100+25))**2' }
