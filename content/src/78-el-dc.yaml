        hint: Параллельно мощности не меняются.
        explain: '$P_{об} = 100 + 25 = 125$ Вт.'
        f: [2]
        sol: { given: ['P₀₁ = 100 Вт', 'P₀₂ = 25 Вт', 'параллельно'], find: 'P_об', formula: 'P_{об} = P_{01} + P_{02}', calc: 'P_{об} = 125', answer: '125 Вт' }
        src: c31
      - type: single
        cat: theory
        q: Две лампы разной номинальной мощности включены последовательно. Какая горит ярче?
        opts: ['С меньшей номинальной мощностью', 'С большей номинальной мощностью', 'Обе одинаково', 'Ни одна не горит']
        ans: a
        hint: 'У неё больше сопротивление, а ток общий.'
        explain: 'Пример: 100 Вт и 25 Вт дают 4 Вт и 16 Вт — ярче лампа 25 Вт.'
        f: [3]
        src: c31
      - type: single
        cat: theory
        q: У какой лампы сопротивление больше — у лампы 100 Вт или 25 Вт (обе на 220 В)?
        opts: ['У лампы 25 Вт', 'У лампы 100 Вт', 'Одинаковое', 'Нельзя определить']
        ans: a
        hint: '$R \sim \frac{1}{P_0}$.'
        explain: '$R = \frac{U_0^2}{P_0}$: 25 Вт — 1936 Ом, 100 Вт — 484 Ом.'
        f: [1]
        src: c30

# ───────────────────────────────────────────────────────────────
  - id: dc-emf
    title: ЭДС. Закон Ома для полной цепи
    pages: [c31, c32]
    theory:
      - kind: definition
        title: Электродвижущая сила
        body: 'ЭДС в конспекте — работа сторонних сил по перемещению пробного заряда во всей замкнутой цепи: $\varepsilon = \frac Aq$ [В] = [Дж/Кл] (по формуле — работа на единицу заряда, см. EL08).'
        src: c31
        errata: [EL08]
      - kind: law
        title: Закон Ома для полной цепи
        body: 'Если учесть внутреннее сопротивление источника, то вместо $I = \frac{U}{R_1 + R_2}$ получаем $I = \frac{\varepsilon}{R + r}$, где R — внешнее сопротивление, r — внутреннее сопротивление.'
        src: [c31, c32]
        fig: full-circuit
      - kind: definition
        title: Ток короткого замыкания
        body: 'Максимальная сила тока получается при R → 0: $I_{max} = I_{к.з.} = \frac\varepsilon r$ — ток короткого замыкания (R стремится к нулю, и в формуле его можно отбросить).'
        src: c32
      - kind: text
        title: Внешнее и внутреннее напряжение
        body: '$\varepsilon = IR + Ir = U_{внеш} + U_{внутр}$, где $U_{внеш} = IR = \frac{\varepsilon R}{R + r}$, $U_{внутр} = Ir = \frac{\varepsilon r}{R + r}$. Вольтметр, подключённый к клеммам источника, показывает $U_{внеш}$ — внешнее напряжение (напряжение на клеммах, на зажимах, полезное напряжение).'
        src: c32
      - kind: rule
        title: КПД источника
        body: '$\eta = \frac{U_{внеш}}{\varepsilon}\cdot100\% = \frac{R}{R + r}\cdot100\%$.'
        src: c32
    formulas:
      - title: ЭДС
        tex: '\varepsilon = \frac{A}{q}'
        sym: [emf, A_ext_f, q_el]
        boxed: true
        src: c31
        errata: [EL08]
      - title: Закон Ома для полной цепи
        tex: 'I = \frac{\varepsilon}{R + r}'
        sym: [I_cur, emf, R_ext, r_int]
        src: [c31, c32]
      - title: Ток короткого замыкания
        tex: 'I_{max} = I_{к.з.} = \frac{\varepsilon}{r}'
        sym: [I_sc, emf, r_int]
        boxed: true
