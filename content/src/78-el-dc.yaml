        src: c30
      - type: numeric
        cat: problem
        q: 'Лампы 100 Вт и 25 Вт (обе на 220 В) включили последовательно в сеть 220 В. Какую мощность потребляет лампа 100 Вт?'
        num: { value: 4, unit: 'Вт', check: '100*(25/(100+25))**2' }
        hint: '$P_1 = P_{01}\left(\frac{P_{02}}{P_{01} + P_{02}}\right)^2$.'
