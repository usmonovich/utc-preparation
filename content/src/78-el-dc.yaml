        src: c34
      - type: numeric
        cat: problem
        q: 'Параллельно соединены источники: $\varepsilon_1 = 6$ В, $r_1 = 1$ Ом и $\varepsilon_2 = 3$ В, $r_2 = 2$ Ом. Найдите ЭДС батареи.'
