        explain: '$r_{об} = \frac23$ Ом, $\varepsilon_{об} = (6 + 1{,}5)\cdot\frac23 = 5$ В.'
        f: [4]
        sol: { given: ['ε₁ = 6 В, r₁ = 1 Ом', 'ε₂ = 3 В, r₂ = 2 Ом'], find: 'ε_об', formula: '\varepsilon_{об} = \left(\frac{\varepsilon_1}{r_1} + \frac{\varepsilon_2}{r_2}\right)r_{об}', calc: 'r_{об} = \frac{2}{3};\ \varepsilon_{об} = 7{,}5\cdot\frac{2}{3} = 5', answer: '5 В' }
        src: c34
      - type: numeric
        cat: problem
        q: 'Для той же пары источников (6 В, 1 Ом и 3 В, 2 Ом параллельно) найдите ток короткого замыкания батареи.'
