        explain: 'С ростом R дробь $\frac{R}{R + r}$ растёт — внешнее напряжение приближается к ε.'
        f: [5]
        src: c32

# ───────────────────────────────────────────────────────────────
  - id: dc-power
    title: Распределение энергии в цепи
    pages: [c33]
    theory:
      - kind: text
        title: Полная, внешняя и внутренняя мощность
        body: '$P_{полн} = P_{внеш} + P_{внутр}$: $P_{полн} = I^2(R + r) = \frac{\varepsilon^2}{R + r}$, $P_{внеш} = I^2R = \frac{\varepsilon^2}{(R + r)^2}\cdot R$, $P_{внутр} = I^2r = \frac{\varepsilon^2}{(R + r)^2}\cdot r$. Полезная мощность — мощность во внешней цепи: $P_{полез} = P_{внеш}$.'
        src: c33
      - kind: rule
        title: Максимальная полезная мощность
        body: 'Полезная мощность $P_{полез}(R) = \frac{\varepsilon^2R}{(R + r)^2}$ максимальна при $R = r$: $P_{полез}(\max) = \frac{\varepsilon^2}{4r}$.'
        src: c33
        fig: max-power
    formulas:
      - title: Баланс мощностей
        tex: 'P_{полн} = P_{внеш} + P_{внутр}'
        sym: [P_parts]
        src: c33
      - title: Мощности через ток
        tex: 'P_{полн} = I^2(R + r),\quad P_{внеш} = I^2R,\quad P_{внутр} = I^2r'
        sym: [P_parts, I_cur, R_ext, r_int]
        boxed: true
        src: c33
      - title: Мощности через ЭДС
        tex: 'P_{полн} = \frac{\varepsilon^2}{R + r},\quad P_{внеш} = \frac{\varepsilon^2}{(R + r)^2}\cdot R,\quad P_{внутр} = \frac{\varepsilon^2}{(R + r)^2}\cdot r'
        sym: [P_parts, emf, R_ext, r_int]
        boxed: true
        src: c33
      - title: Максимальная полезная мощность
        tex: 'R = r:\qquad P_{полез}(\max) = \frac{\varepsilon^2}{4r}'
        sym: [P_parts, emf, r_int, R_ext]
        boxed: true
        src: c33
    questions:
      - type: numeric
        cat: problem
        q: 'Источник ε = 12 В, r = 2 Ом замкнут на резистор 4 Ом. Найдите полезную мощность.'
        num: { value: 16, unit: 'Вт', check: '12**2*4/(4+2)**2' }
        hint: '$P_{полез} = \frac{\varepsilon^2R}{(R + r)^2}$.'
        explain: '$P = \frac{144\cdot4}{36} = 16$ Вт.'
        f: [3]
        sol: { given: ['ε = 12 В', 'r = 2 Ом', 'R = 4 Ом'], find: 'P_полез', formula: 'P_{полез} = \frac{\varepsilon^2R}{(R + r)^2}', calc: 'P = \frac{144\cdot4}{36} = 16', answer: '16 Вт' }
        src: c33
      - type: numeric
        cat: problem
        q: 'В той же цепи (ε = 12 В, r = 2 Ом, R = 4 Ом) найдите полную мощность источника.'
        num: { value: 24, unit: 'Вт', check: '12**2/(4+2)' }
        hint: '$P_{полн} = \frac{\varepsilon^2}{R + r}$.'
        explain: '$P_{полн} = \frac{144}{6} = 24$ Вт.'
        f: [3]
        sol: { given: ['ε = 12 В', 'r = 2 Ом', 'R = 4 Ом'], find: 'P_полн', formula: 'P_{полн} = \frac{\varepsilon^2}{R + r}', calc: 'P_{полн} = \frac{144}{6} = 24', answer: '24 Вт' }
        src: c33
      - type: numeric
        cat: problem
        q: 'Сколько мощности теряется внутри того же источника (ε = 12 В, r = 2 Ом, R = 4 Ом)?'
        num: { value: 8, unit: 'Вт', check: '(12/(4+2))**2*2' }
        hint: '$P_{внутр} = I^2r$.'
        explain: '$I = 2$ А, $P_{внутр} = 4\cdot2 = 8$ Вт; $16 + 8 = 24$ Вт.'
        f: [2]
        sol: { given: ['I = 2 А', 'r = 2 Ом'], find: 'P_внутр', formula: 'P_{внутр} = I^2r', calc: 'P_{внутр} = 4\cdot2 = 8', answer: '8 Вт' }
        src: c33
      - type: numeric
        cat: problem
        q: 'Какую наибольшую полезную мощность может отдать источник с ε = 12 В и r = 2 Ом?'
        num: { value: 18, unit: 'Вт', check: '12**2/(4*2)' }
        hint: 'Максимум при R = r: $\frac{\varepsilon^2}{4r}$.'
        explain: '$P_{max} = \frac{144}{8} = 18$ Вт.'
        f: [4]
        sol: { given: ['ε = 12 В', 'r = 2 Ом'], find: 'P_max', formula: 'P_{полез}(\max) = \frac{\varepsilon^2}{4r}', calc: 'P_{max} = \frac{144}{8} = 18', answer: '18 Вт' }
        src: c33
      - type: numeric
        cat: problem
        q: 'Каким должно быть внешнее сопротивление для источника с r = 2 Ом, чтобы полезная мощность была наибольшей?'
        num: { value: 2, unit: 'Ом', check: '2' }
        hint: Условие в рамке на стр. c33.
        explain: 'Полезная мощность максимальна при R = r = 2 Ом.'
        f: [4]
        sol: { given: ['r = 2 Ом'], find: 'R', formula: 'R = r', calc: 'R = 2', answer: '2 Ом' }
        src: c33
      - type: numeric
        cat: problem
        q: 'Каков КПД источника в режиме наибольшей полезной мощности (R = r)?'
        num: { value: 50, unit: '%', check: '1/(1+1)*100' }
        hint: '$\eta = \frac{R}{R + r}\cdot100\%$ при R = r.'
        explain: '$\eta = \frac{r}{2r}\cdot100\% = 50\%$ — половина мощности теряется внутри.'
        f: [4]
        sol: { given: ['R = r'], find: 'η', formula: '\eta = \frac{R}{R + r}\cdot100\%', calc: '\eta = \frac{1}{2}\cdot100\% = 50\%', answer: '50 %' }
        src: [c32, c33]
      - type: single
        cat: theory
        q: При каком внешнем сопротивлении полезная мощность максимальна?
        opts: ['R = r', 'R → 0', 'R → ∞', 'R = 2r']
        ans: a
        hint: Обведено в рамку на стр. c33.
        explain: '$P_{полез} \to \max$ при $R = r$.'
        f: [4]
        src: c33

# ───────────────────────────────────────────────────────────────
  - id: dc-sources
    title: Соединение источников ЭДС
    pages: [c33, c34]
    theory:
      - kind: text
        title: Последовательное соединение источников
        body: 'а) Правильное (одной полярностью): $\varepsilon_{об} = \varepsilon_1 + \varepsilon_2 + \dots + \varepsilon_n$, $r_{об} = r_1 + r_2 + \dots + r_n$. б) Неправильное (один источник наоборот): его ЭДС вычитается — $\varepsilon_{об} = \varepsilon_1 + \varepsilon_2 - \varepsilon_3 + \dots + \varepsilon_n$, а у внутреннего сопротивления знак не меняется. N одинаковых источников: $\varepsilon_{об} = N\varepsilon$, $r_{об} = Nr$.'
        src: c33
        fig: sources-connect
      - kind: text
        title: Параллельное соединение источников
        body: 'а) Правильное: $r_{об} = \left(\frac1{r_1} + \frac1{r_2} + \dots + \frac1{r_n}\right)^{-1}$, $\varepsilon_{об} = \left(\frac{\varepsilon_1}{r_1} + \frac{\varepsilon_2}{r_2} + \dots + \frac{\varepsilon_n}{r_n}\right)r_{об}$, токи короткого замыкания складываются: $I_{max\,об} = I_{max1} + \dots + I_{max\,n}$. N одинаковых: $r_{об} = \frac rN$, $\varepsilon_{об} = \varepsilon$. б) Неправильное: слагаемое $\frac{\varepsilon_i}{r_i}$ перевёрнутого источника берётся с минусом (в формуле $r_{об}$ для этого случая в тетради пропущена степень −1, см. EL09).'
        src: c34
        errata: [EL09]
    formulas:
      - title: Последовательно, правильно
        tex: '\varepsilon_{об} = \varepsilon_1 + \varepsilon_2 + \dots + \varepsilon_n,\qquad r_{об} = r_1 + r_2 + \dots + r_n'
        sym: [emf_ob, emf1n]
        boxed: true
        src: c33
      - title: Последовательно, один источник наоборот
        tex: '\varepsilon_{об} = \varepsilon_1 + \varepsilon_2 - \varepsilon_3 + \dots + \varepsilon_n,\qquad r_{об} = r_1 + r_2 + r_3 + \dots + r_n'
        sym: [emf_ob, emf1n]
        boxed: true
        src: c33
      - title: N одинаковых последовательно
        tex: '\varepsilon_{об} = N\varepsilon,\qquad r_{об} = Nr'
        sym: [emf_ob, N_src, emf, r_int]
        boxed: true
        src: c33
      - title: Параллельно, правильно
        tex: 'r_{об} = \left(\frac{1}{r_1} + \dots + \frac{1}{r_n}\right)^{-1},\qquad \varepsilon_{об} = \left(\frac{\varepsilon_1}{r_1} + \dots + \frac{\varepsilon_n}{r_n}\right)\cdot r_{об}'
        sym: [emf_ob, emf1n]
        boxed: true
        src: c34
      - title: Токи короткого замыкания при параллельном соединении
        tex: 'I_{max\,об} = I_{max1} + I_{max2} + \dots + I_{max\,n}'
        sym: [I_max_i, I_sc]
        src: c34
      - title: N одинаковых параллельно
        tex: 'r_{об} = \frac{r}{N},\qquad \varepsilon_{об} = \varepsilon'
        sym: [emf_ob, N_src, emf, r_int]
        boxed: true
        src: c34
      - title: Параллельно, один источник наоборот (как в конспекте)
        tex: 'r_{об} = \frac{1}{r_1} + \frac{1}{r_2} + \dots + \frac{1}{r_n},\qquad \varepsilon_{об} = \left(\frac{\varepsilon_1}{r_1} - \frac{\varepsilon_2}{r_2} + \dots + \frac{\varepsilon_n}{r_n}\right)\cdot r_{об}'
        sym: [emf_ob, emf1n]
        boxed: true
        src: c34
        errata: [EL09]
    questions:
      - type: numeric
        cat: problem
        q: 'Три батарейки по 1,5 В с внутренним сопротивлением 0,5 Ом соединены последовательно. Найдите ЭДС батареи.'
        num: { value: 4.5, unit: 'В', check: '3*1.5' }
        hint: '$\varepsilon_{об} = N\varepsilon$.'
        explain: '$\varepsilon_{об} = 3\cdot1{,}5 = 4{,}5$ В.'
        f: [3]
        sol: { given: ['N = 3', 'ε = 1,5 В'], find: 'ε_об', formula: '\varepsilon_{об} = N\varepsilon', calc: '\varepsilon_{об} = 4{,}5', answer: '4,5 В' }
        src: c33
      - type: numeric
        cat: problem
        q: 'Найдите внутреннее сопротивление той же батареи (три по 0,5 Ом последовательно).'
        num: { value: 1.5, unit: 'Ом', check: '3*0.5' }
        hint: '$r_{об} = Nr$.'
        explain: '$r_{об} = 3\cdot0{,}5 = 1{,}5$ Ом.'
        f: [3]
        sol: { given: ['N = 3', 'r = 0,5 Ом'], find: 'r_об', formula: 'r_{об} = Nr', calc: 'r_{об} = 1{,}5', answer: '1,5 Ом' }
