# ───────────────────────────────────────────────────────────────
  - id: dc-joule
    title: Закон Джоуля–Ленца. Мощность тока
    pages: [c29, c30]
    theory:
      - kind: law
        title: Закон Джоуля–Ленца
        body: 'При прохождении тока через проводник в проводнике выделяется теплота, за счёт которой он нагревается. Работа тока $A = Uq = UIt = I^2Rt = \frac{U^2}{R}t$ целиком переходит в теплоту: $Q = UIt = I^2Rt = \frac{U^2}{R}t$.'
        src: c29
      - kind: definition
        title: Электрическая мощность
        body: 'P — электрическая мощность [Вт]: $P = \frac At = UI = I^2R = \frac{U^2}{R}$. 1 кВт·ч = $3{,}6\cdot10^6$ Дж.'
        src: c29
      - kind: rule
        title: Лампочки, соединённые последовательно
        body: 'Мощность цепи при U = const: $P = \frac{U^2}{R_{об}}$. Восемь одинаковых лампочек последовательно — $P = \frac{U^2}{8R}$, пять — $P = \frac{U^2}{5R}$. В последовательном соединении чем больше лампочек, тем меньше освещённость.'
        src: c29
        fig: lamps-series
      - kind: rule
        title: Теплота при последовательном и параллельном соединении
        body: 'Последовательно (ток общий): P, Q ~ R, $\frac{P_1}{P_2} = \frac{Q_1}{Q_2} = \frac{R_1}{R_2}$. Параллельно (напряжение общее): P, Q ~ $\frac1R$, $\frac{P_1}{P_2} = \frac{Q_1}{Q_2} = \frac{R_2}{R_1}$.'
        src: c30
      - kind: rule
        title: Электрочайник с двумя спиралями
        body: 't — время кипения. Спирали параллельно: $t_{пар} = \left(\frac1{t_1} + \frac1{t_2} + \dots + \frac1{t_n}\right)^{-1}$; последовательно: $t_{пос} = t_1 + t_2 + \dots + t_n$.'
        src: c30
    formulas:
      - title: Работа тока
        tex: 'A = UIt = I^2Rt = \frac{U^2}{R}t'
        sym: [A_el, U_volt, I_cur, t, R_res]
        boxed: true
        src: c29
      - title: Закон Джоуля–Ленца
        tex: 'Q = UIt = I^2Rt = \frac{U^2}{R}t'
        sym: [Q, U_volt, I_cur, t, R_res]
        boxed: true
        src: c29
      - title: Электрическая мощность
        tex: 'P = \frac{A}{t} = UI = I^2R = \frac{U^2}{R}'
        sym: [P_pow, A_el, t, U_volt, I_cur, R_res]
        boxed: true
        src: c29
      - title: Киловатт-час
        tex: '1\ \text{кВт}\cdot\text{ч} = 3{,}6\cdot10^6\ \text{Дж}'
        sym: []
        src: c29
      - title: Мощность цепи
        tex: 'P = \frac{U^2}{R_{об}}'
        sym: [P_pow, U_volt, R_tot]
        boxed: true
        cond: '\(U = \text{const}\)'
        src: c29
      - title: Последовательное соединение — мощность и теплота
        tex: '\frac{P_1}{P_2} = \frac{Q_1}{Q_2} = \frac{R_1}{R_2}'
        sym: [PQ12, R1n]
        boxed: true
        src: c30
      - title: Параллельное соединение — мощность и теплота
        tex: '\frac{P_1}{P_2} = \frac{Q_1}{Q_2} = \frac{R_2}{R_1}'
        sym: [PQ12, R1n]
        boxed: true
        src: c30
      - title: Время кипения с несколькими спиралями
        tex: 't_{пар} = \left(\frac{1}{t_1} + \frac{1}{t_2} + \dots + \frac{1}{t_n}\right)^{-1},\qquad t_{пос} = t_1 + t_2 + \dots + t_n'
        sym: [t_boil]
        src: c30
    questions:
      - type: numeric
        cat: problem
        q: 'Через резистор 10 Ом течёт ток 2 А. Сколько теплоты выделится за 1 минуту?'
        num: { value: 2400, unit: 'Дж', check: '2**2*10*60' }
        hint: '$Q = I^2Rt$.'
        explain: '$Q = 4\cdot10\cdot60 = 2400$ Дж.'
        f: [2]
        sol: { given: ['I = 2 А', 'R = 10 Ом', 't = 60 с'], find: 'Q', formula: 'Q = I^2Rt', calc: 'Q = 4\cdot10\cdot60 = 2400', answer: '2400 Дж' }
        src: c29
      - type: numeric
        cat: problem
        q: 'Прибор сопротивлением 44 Ом включён в сеть 220 В. Найдите его мощность.'
        num: { value: 1100, unit: 'Вт', check: '220**2/44' }
        hint: '$P = \frac{U^2}{R}$.'
        explain: '$P = \frac{48400}{44} = 1100$ Вт.'
        f: [3]
        sol: { given: ['U = 220 В', 'R = 44 Ом'], find: 'P', formula: 'P = \frac{U^2}{R}', calc: 'P = \frac{220^2}{44} = 1100', answer: '1100 Вт' }
        src: c29
      - type: numeric
        cat: problem
        q: 'Переведите 2 кВт·ч в джоули.'
        num: { value: 7.2e6, unit: 'Дж', check: '2*3.6e6' }
        hint: '1 кВт·ч = $3{,}6\cdot10^6$ Дж.'
        explain: '$2\cdot3{,}6\cdot10^6 = 7{,}2\cdot10^6$ Дж.'
        f: [4]
        sol: { given: ['W = 2 кВт·ч'], find: 'W в Дж', formula: '1\ \text{кВт}\cdot\text{ч} = 3{,}6\cdot10^6\ \text{Дж}', calc: 'W = 2\cdot3{,}6\cdot10^6 = 7{,}2\cdot10^6', answer: '7,2·10⁶ Дж' }
        src: c29
      - type: numeric
        cat: problem
        q: 'Гирлянду из 8 одинаковых последовательных лампочек укоротили до 5 лампочек (напряжение то же). Во сколько раз выросла мощность гирлянды?'
        num: { value: 1.6, unit: '', check: '(1/5)/(1/8)' }
        hint: '$P = \frac{U^2}{R_{об}}$, $R_{об} = nR$.'
        explain: '$\frac{U^2/5R}{U^2/8R} = \frac85 = 1{,}6$.'
        f: [5]
        sol: { given: ['n₁ = 8', 'n₂ = 5', 'U = const'], find: 'P₂/P₁', formula: 'P = \frac{U^2}{nR}', calc: '\frac{P_2}{P_1} = \frac{8}{5} = 1{,}6', answer: 'в 1,6 раза' }
        src: c29
      - type: numeric
        cat: problem
        q: 'Резисторы 2 Ом и 6 Ом соединены последовательно. Во сколько раз больше теплоты выделяется на резисторе 6 Ом?'
        num: { value: 3, unit: '', check: '6/2' }
        hint: 'Последовательно: $\frac{Q_1}{Q_2} = \frac{R_1}{R_2}$.'
        explain: '$\frac{Q_2}{Q_1} = \frac62 = 3$.'
        f: [6]
        sol: { given: ['R₁ = 2 Ом', 'R₂ = 6 Ом', 'последовательно'], find: 'Q₂/Q₁', formula: '\frac{Q_1}{Q_2} = \frac{R_1}{R_2}', calc: '\frac{Q_2}{Q_1} = \frac{6}{2} = 3', answer: 'в 3 раза' }
        src: c30
      - type: numeric
        cat: problem
        q: 'Те же резисторы (2 Ом и 6 Ом) соединены параллельно. Во сколько раз мощность на резисторе 2 Ом больше, чем на 6 Ом?'
        num: { value: 3, unit: '', check: '6/2' }
        hint: 'Параллельно: $\frac{P_1}{P_2} = \frac{R_2}{R_1}$.'
        explain: '$\frac{P_1}{P_2} = \frac62 = 3$ — теперь сильнее греется меньший резистор.'
        f: [7]
        sol: { given: ['R₁ = 2 Ом', 'R₂ = 6 Ом', 'параллельно'], find: 'P₁/P₂', formula: '\frac{P_1}{P_2} = \frac{R_2}{R_1}', calc: '\frac{P_1}{P_2} = \frac{6}{2} = 3', answer: 'в 3 раза' }
        src: c30
      - type: numeric
        cat: problem
        q: 'С одной спиралью вода в чайнике закипает за 10 мин, с другой — за 15 мин. За сколько минут закипит вода, если спирали включить параллельно?'
        num: { value: 6, unit: 'мин', check: '1/(1/10+1/15)' }
        hint: '$t_{пар} = \left(\frac1{t_1} + \frac1{t_2}\right)^{-1}$.'
        explain: '$t_{пар} = \frac{10\cdot15}{25} = 6$ мин.'
        f: [8]
        sol: { given: ['t₁ = 10 мин', 't₂ = 15 мин'], find: 't_пар', formula: 't_{пар} = \left(\frac{1}{t_1} + \frac{1}{t_2}\right)^{-1}', calc: 't_{пар} = \frac{150}{25} = 6', answer: '6 мин' }
        src: c30
      - type: numeric
        cat: problem
        q: 'Те же спирали (10 мин и 15 мин) включили последовательно. За сколько минут закипит вода?'
        num: { value: 25, unit: 'мин', check: '10+15' }
        hint: '$t_{пос} = t_1 + t_2$.'
        explain: '$t_{пос} = 10 + 15 = 25$ мин.'
        f: [8]
        sol: { given: ['t₁ = 10 мин', 't₂ = 15 мин'], find: 't_пос', formula: 't_{пос} = t_1 + t_2', calc: 't_{пос} = 25', answer: '25 мин' }
        src: c30
      - type: single
        cat: theory
        q: Какой из последовательно соединённых резисторов нагревается сильнее?
        opts: ['С большим сопротивлением', 'С меньшим сопротивлением', 'Одинаково', 'Тот, что ближе к источнику']
        ans: a
        hint: 'При общем токе Q ~ R.'
        explain: 'Последовательно $Q = I^2Rt$ — больше теплоты на большем сопротивлении.'
        f: [6]
        src: c30
      - type: single
        cat: theory
        q: Что происходит с освещённостью гирлянды из последовательных лампочек, если лампочек становится больше?
        opts: ['Уменьшается', 'Увеличивается', 'Не меняется', 'Лампочки перегорают']
        ans: a
        hint: 'P = $\frac{U^2}{nR}$.'
        explain: В последовательном соединении чем больше лампочек, тем меньше освещённость.
        f: [5]
        src: c29

# ───────────────────────────────────────────────────────────────
  - id: dc-nominal
    title: Номинальная мощность. Лампочки в цепи
    pages: [c30, c31]
    theory:
      - kind: definition
        title: Номинальная мощность и напряжение
        body: 'Номинальная мощность — мощность прибора при номинальном напряжении: $P_0 = \frac{U_0^2}{R}$, $U_0 = 220$ В. $P_0 \sim \frac1R$, $R \sim \frac1{P_0}$: у более мощной лампочки сопротивление меньше.'
        src: c30
      - kind: rule
        title: Лампочки параллельно
        body: 'При параллельном соединении каждая лампочка работает на своём номинальном напряжении: мощности не меняются, $P_1 = P_{01}$, $P_2 = P_{02}$, $P_{об} = P_{01} + P_{02} + \dots$'
        src: c31
      - kind: rule
        title: Лампочки последовательно
        body: '$P_1 = P_{01}\left(\frac{P_{02}}{P_{01} + P_{02}}\right)^2$, $P_2 = P_{02}\left(\frac{P_{01}}{P_{01} + P_{02}}\right)^2$, $P_{об} = \left(\frac1{P_{01}} + \frac1{P_{02}} + \dots\right)^{-1}$; $P_1 < P_{01}$, $P_2 < P_{02}$. Ярче горит лампочка с меньшей номинальной мощностью (у неё больше сопротивление).'
        src: c31
        fig: lamps-nominal
    formulas:
      - title: Номинальная мощность
        tex: 'P_0 = \frac{U_0^2}{R}'
        sym: [P0_nom, U0_nom, R_res]
        src: c30
      - title: Лампочки параллельно
        tex: 'P_1 = P_{01},\quad P_2 = P_{02},\quad P_{об} = P_{01} + P_{02} + \dots'
        sym: [P12_lamp, P0_12]
        src: c31
      - title: Лампочки последовательно
        tex: 'P_1 = P_{01}\left(\frac{P_{02}}{P_{01} + P_{02}}\right)^2,\qquad P_2 = P_{02}\left(\frac{P_{01}}{P_{01} + P_{02}}\right)^2'
        sym: [P12_lamp, P0_12]
        src: c31
      - title: Общая мощность последовательных лампочек
        tex: 'P_{об} = \left(\frac{1}{P_{01}} + \frac{1}{P_{02}} + \dots\right)^{-1}'
        sym: [P12_lamp, P0_12]
        src: c31
    questions:
      - type: numeric
        cat: problem
        q: 'Лампа рассчитана на 220 В и 100 Вт. Найдите сопротивление её нити.'
        num: { value: 484, unit: 'Ом', check: '220**2/100' }
