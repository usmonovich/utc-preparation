subsection: dyn
topics:

# ───────────────────────────────────────────────────────────────
  - id: dyn-basics
    title: Основные понятия динамики. Масса, объём, плотность, сила
    pages: [p12L, p12R]
    theory:
      - kind: definition
        title: Динамика
        body: Динамика — это раздел механики, где изучаются основные причины движения.
        src: p12L
      - kind: definition
        title: Масса
        body: 'Масса — это характеристика инертности тела. $m$ — масса; $M$ — употребляется с космическими объектами. Единицы: кг, г, мг, т.'
        src: p12L
      - kind: definition
        title: Объём
        body: 'Объём — это область, занимаемая телом в пространстве. $V$ — объём: м³, дм³ = л, см³, мм³.'
        src: p12L
      - kind: text
        title: Перевод единиц объёма
        body: |
          $1\ м^3 = 10^3$ л; $1\ м^3 = 10^6\ см^3$; $1\ м^3 = 10^9\ мм^3$.
          $1$ л $= 10^{-3}\ м^3$; $1\ см^3 = 10^{-6}\ м^3$; $1\ мм^3 = 10^{-9}\ м^3$; $1\ см^3 = 10^{-3}$ л; $1\ мм^3 = 10^{-6}$ л.
        src: [p12L, p12R]
      - kind: definition
        title: Плотность
        body: 'Плотность — это масса тела в единице объёма. Для твёрдых тел и жидкостей плотность является табличным параметром. $\rho$ — плотность [кг/м³] [г/см³]. Плотность не зависит от массы и объёма тела: $\rho \not\sim m, V$.'
        src: p12R
      - kind: text
        title: Табличные значения и перевод
        body: |
          $\rho_{вода} = 1000$ кг/м³; $\rho_{ртуть} = 13\,600$ кг/м³.
          $x\ \frac{кг}{м^3}\cdot10^{-3} = y\ \frac{г}{см^3}$; $y\ \frac{г}{см^3}\cdot10^{3} = x\ \frac{кг}{м^3}$.
        src: p12R
      - kind: definition
        title: Сила
        body: 'Сила — это характеристика всех посредственных и непосредственных взаимодействий тел. $\vec F$ — сила [Н] = [кг·м/с²].'
        src: p12R
    formulas:
      - title: Плотность
        tex: '\rho = \frac{m}{V}'
        sym: [rho, m, V]
        boxed: true
        src: p12R
      - title: Масса через плотность
        tex: 'm = \rho V'
        sym: [m, rho, V]
        boxed: true
        src: p12R
      - title: Масса тел простой формы
        tex: 'm_{шар} = \rho\cdot\frac{4}{3}\pi R^3,\qquad m_{куб} = \rho a^3,\qquad m_{цил} = \rho\pi R^2 h'
        sym: [m, rho, R, a_side, h]
        src: p12R
    questions:
      - type: numeric
        cat: problem
        q: Сколько литров в 1 м³?
        num: { value: 1000, unit: 'л', check: '1000' }
        hint: 1 л = 1 дм³.
        explain: '$1\ м^3 = 10^3$ л.'
        sol: { calc: '1\ м^3 = 10^3\ л = 1000\ л', answer: '1000 л' }
        src: p12L
      - type: numeric
        cat: problem
        q: Плотность ртути 13 600 кг/м³. Выразите её в г/см³.
        num: { value: 13.6, unit: 'г/см³', check: '13600*1e-3' }
        hint: Чтобы перевести кг/м³ в г/см³, умножьте на $10^{-3}$.
        explain: '$x\ \frac{кг}{м^3}\cdot10^{-3} = y\ \frac{г}{см^3}$.'
        sol: { calc: '13\,600\cdot10^{-3} = 13{,}6', answer: '13,6 г/см³' }
        src: p12R
      - type: numeric
        cat: problem
        q: Масса тела 2 кг, объём 1 л. Найдите плотность в кг/м³.
        num: { value: 2000, unit: 'кг/м³', check: '2/1e-3' }
        hint: Сначала переведите литры в м³.
        explain: Пример из конспекта (стр. 24L).
        f: [1]
        sol: { given: ['m = 2 кг', 'V = 1 л'], si: ['V = 10⁻³ м³'], find: 'ρ', formula: '\rho = \frac{m}{V}', calc: '\rho = \frac{2}{10^{-3}} = 2000', answer: '2000 кг/м³' }
        src: p24L
      - type: numeric
        cat: problem
        q: Куб со стороной 0,1 м сделан из вещества плотностью 2700 кг/м³. Найдите его массу.
        num: { value: 2.7, unit: 'кг', check: '2700*0.1**3' }
        hint: Для куба $m = \rho a^3$.
        explain: Масса куба через плотность и длину ребра.
        f: [3]
        sol: { given: ['a = 0,1 м', 'ρ = 2700 кг/м³'], find: 'm', formula: 'm = \rho a^3', calc: 'm = 2700\cdot0{,}001 = 2{,}7', answer: '2,7 кг' }
        src: p12R
      - type: single
        cat: theory
        q: Масса — это характеристика ...
        opts: ['инертности тела', 'объёма тела', 'взаимодействия тел', 'плотности вещества']
        ans: a
        hint: Определение массы — первое основное понятие динамики в конспекте.
        explain: Масса — это характеристика инертности тела.
        src: p12L
      - type: single
        cat: theory
        q: Как плотность вещества зависит от массы и объёма тела?
        opts: ['Не зависит — это табличный параметр', 'Прямо пропорциональна массе', 'Обратно пропорциональна массе', 'Прямо пропорциональна объёму']
        ans: a
        hint: В конспекте рядом с формулой $m = \rho V$ записано особое обозначение «не пропорционально».
        explain: '$\rho \not\sim m, V$ — для твёрдых тел и жидкостей плотность является табличным параметром.'
        src: p12R
      - type: sequence
        cat: theory
        q: Расположите единицы объёма от наименьшей к наибольшей.
        seq: ['мм³', 'см³', 'л (дм³)', 'м³']
        hint: 1 м³ = 10³ л = 10⁶ см³ = 10⁹ мм³.
        explain: '$1\ мм^3 < 1\ см^3 < 1$ л $< 1\ м^3$.'
        src: [p12L, p12R]

# ───────────────────────────────────────────────────────────────
  - id: dyn-resultant
    title: Равнодействующая сил
    pages: [p13L, p13R]
    theory:
      - kind: text
        title: Метод параллелограмма
        fig: parallelogram
        body: Силы складываются как векторы — методом параллелограмма; для трёх и более сил равнодействующую находят последовательно. Можно также сложить проекции сил на оси.
        src: [p13L, p13R]
    formulas:
      - title: Равнодействующая двух сил
        tex: 'F_{рез} = F_1 + F_2\ (\uparrow\uparrow);\quad F_{рез} = F_1 - F_2\ (\uparrow\downarrow);\quad F_{рез} = \sqrt{F_1^2 + F_2^2}\ (\perp)'
        sym: [F_res, F]
        src: p13L
      - title: Равнодействующая двух сил под углом
        tex: 'F_{рез} = \sqrt{F_1^2 + F_2^2 + 2F_1F_2\cos\alpha}'
        sym: [F_res, F, alpha_v]
        src: p13L
    examples:
      - title: Сложение 10 сил по проекциям (в клетках)
        given: '$F_1(-5;3)$, $F_2(6;1)$, $F_3(-4;-3)$, $F_4(4;-3)$, $F_5(0;3)$, $F_6(6;0)$, $F_7(3;2)$, $F_8(-1;-1)$, $F_9(3;-3)$, $F_{10}(-9;1)$'
        steps: ['$\Sigma x = -5+6-4+4+0+6+3-1+3-9 = 3$', '$\Sigma y = 3+1-3-3+3+0+2-1-3+1 = 0$']
        answer: '$F_{рез}(3;0)$'
        src: p13R
        errata: [E24]
    questions:
      - type: numeric
        cat: problem
        q: На тело действуют две перпендикулярные силы 6 Н и 8 Н. Найдите равнодействующую.
        num: { value: 10, unit: 'Н', check: 'Math.sqrt(36+64)' }
        hint: Перпендикулярные силы складываются по теореме Пифагора.
        explain: '$F_{рез} = \sqrt{F_1^2+F_2^2}$.'
        f: [1]
        sol: { given: ['F₁ = 6 Н', 'F₂ = 8 Н', '⊥'], find: 'Fрез', formula: 'F_{рез} = \sqrt{F_1^2+F_2^2}', calc: 'F_{рез} = \sqrt{36+64} = 10', answer: '10 Н' }
        src: p13L
      - type: numeric
        cat: problem
        q: На тело действуют противоположно направленные силы 10 Н и 4 Н. Найдите равнодействующую.
        num: { value: 6, unit: 'Н', check: '10-4' }
        hint: Для ↑↓ силы вычитаются.
        explain: '$F_{рез} = F_1 - F_2$.'
        f: [1]
        sol: { given: ['F₁ = 10 Н', 'F₂ = 4 Н', '↑↓'], find: 'Fрез', formula: 'F_{рез} = F_1 - F_2', calc: 'F_{рез} = 10 - 4 = 6', answer: '6 Н' }
        src: p13L
      - type: numeric
        cat: problem
        q: Две силы по 10 Н направлены под углом 60° друг к другу. Найдите равнодействующую.
        num: { value: 17.32, unit: 'Н', check: 'Math.sqrt(100+100+2*100*0.5)' }
        hint: '$\cos60° = 0{,}5$.'
        explain: Формула равнодействующей под углом.
        f: [2]
        sol: { given: ['F₁ = F₂ = 10 Н', 'α = 60°'], find: 'Fрез', formula: 'F_{рез} = \sqrt{F_1^2+F_2^2+2F_1F_2\cos\alpha}', calc: 'F_{рез} = \sqrt{100+100+100} = \sqrt{300} \approx 17{,}3', answer: '≈ 17,3 Н' }
        src: p13L
      - type: numeric
        cat: problem
        q: Силы заданы проекциями в клетках — (3; 1), (−1; 2), (2; −6). Найдите модуль равнодействующей (в клетках).
        num: { value: 5, unit: 'клеток', check: 'Math.hypot(3-1+2, 1+2-6)' }
        hint: Сложите отдельно все проекции на x и все проекции на y, как в примере на стр. 13R.
        explain: '$\Sigma x = 4$, $\Sigma y = -3$, модуль — по теореме Пифагора.'
        sol: { calc: '\Sigma x = 3-1+2 = 4;\ \Sigma y = 1+2-6 = -3;\ F = \sqrt{16+9} = 5', answer: '5 клеток' }
        src: p13R
      - type: single
        cat: theory
        q: Каким методом в конспекте складывают силы графически?
        opts: ['Методом параллелограмма', 'Методом рычага', 'Методом проекций на ось времени', 'Методом сообщающихся сосудов']
        ans: a
        hint: Название метода — по геометрической фигуре.
        explain: На стр. 13L силы складываются методом параллелограмма.
        src: p13L

# ───────────────────────────────────────────────────────────────
  - id: dyn-newton
    title: Законы Ньютона
    pages: [p14L, p14R]
    theory:
      - kind: law
        title: Первый закон Ньютона
        body: Если на любое тело не будет действовать сила или сумма всех сил, приложенных к телу, будет равняться нулю, то данное тело останется в покое или продолжит прямолинейное равномерное движение.
        src: p14L
      - kind: law
        title: Второй закон Ньютона
        fig: newton2
        body: Ускорение всегда возникает под воздействием силы. Ускорение прямо пропорционально силе и обратно пропорционально массе тела.
        src: p14L
      - kind: law
        title: Третий закон Ньютона (закон противодействия)
        fig: newton3
        body: Любое действие вызывает противодействие, при этом действие и его противодействие равны по значению, но противоположны по направлению.
        src: p14L
    formulas:
      - title: Первый закон
        tex: '\vec F = 0\ \text{или}\ \vec F_{рез} = 0 \;\Rightarrow\; \vec a = 0'
        sym: [F, F_res, a]
        cond: '\(\upsilon = 0\) — покой; \(\vec\upsilon = \text{const}\) — прямолинейно равномерное'
        boxed: true
        src: p14L
      - title: Второй закон
        tex: '\vec a = \frac{\vec F}{m},\qquad \vec F = m\vec a,\qquad m\vec a = \vec F_{рез}'
        sym: [a, F, m, F_res]
        cond: '\(\vec a \sim \vec F\), \(\vec a \sim \frac{1}{m}\)'
        boxed: true
        src: p14L
      - title: Третий закон
        tex: '\vec F_{1,2} = -\vec F_{2,1}'
        sym: [F]
        boxed: true
        src: p14R
    questions:
      - type: single
        cat: theory
        q: Что, согласно первому закону Ньютона, происходит с телом, если сумма всех сил, приложенных к нему, равна нулю?
        opts: ['Оно остаётся в покое или продолжает прямолинейное равномерное движение', 'Оно обязательно останавливается', 'Оно движется равноускоренно', 'Оно движется по окружности']
        ans: a
        hint: При $\vec F_{рез} = 0$ ускорение $\vec a = 0$. Какие два случая это допускает?
        explain: 'Первый закон: $\vec F_{рез} = 0 \Rightarrow \vec a = 0$: либо $\upsilon = 0$ (покой), либо $\vec\upsilon = \text{const}$.'
        f: [1]
        src: p14L
      - type: numeric
        cat: problem
        q: На тело массой 2 кг действует сила 10 Н. Найдите ускорение.
        num: { value: 5, unit: 'м/с²', check: '10/2' }
        hint: Второй закон Ньютона.
        explain: '$a = F/m$.'
        f: [2]
        sol: { given: ['m = 2 кг', 'F = 10 Н'], find: 'a', formula: 'a = \frac{F}{m}', calc: 'a = \frac{10}{2} = 5', answer: '5 м/с²' }
        src: p14L
      - type: numeric
        cat: problem
        q: Тело массой 4 кг движется с ускорением 2,5 м/с². Найдите равнодействующую сил.
        num: { value: 10, unit: 'Н', check: '4*2.5' }
        hint: '$m\vec a = \vec F_{рез}$.'
        explain: Второй закон Ньютона.
        f: [2]
        sol: { given: ['m = 4 кг', 'a = 2,5 м/с²'], find: 'Fрез', formula: 'F_{рез} = ma', calc: 'F_{рез} = 4\cdot2{,}5 = 10', answer: '10 Н' }
        src: p14L
      - type: single
        cat: theory
        q: Силу, действующую на тело, увеличили в 2 раза, масса не изменилась. Как изменится ускорение?
        opts: ['Увеличится в 2 раза', 'Уменьшится в 2 раза', 'Не изменится', 'Увеличится в 4 раза']
        ans: a
        hint: '$\vec a \sim \vec F$.'
        explain: Ускорение прямо пропорционально силе.
        f: [2]
        src: p14L
      - type: matching
        cat: formula
        q: Сопоставьте закон Ньютона и его запись.
        pairs:
          - ['Первый закон', '$\vec F_{рез} = 0 \Rightarrow \vec a = 0$']
          - ['Второй закон', '$m\vec a = \vec F_{рез}$']
          - ['Третий закон', '$\vec F_{1,2} = -\vec F_{2,1}$']
        hint: Третий закон говорит о силах **двух** взаимодействующих тел.
        explain: Записи законов со стр. 14L–14R.
        f: [1, 2, 3]
        src: [p14L, p14R]
      - type: text
        cat: theory
        q: Сформулируйте третий закон Ньютона.
        ref: Любое действие вызывает противодействие, при этом действие и его противодействие равны по значению, но противоположны по направлению.
        criteria: ['Сказано о действии и противодействии', 'Равны по значению (модулю)', 'Противоположны по направлению']
        hint: Его называют законом противодействия.
        explain: 'Запись: $\vec F_{1,2} = -\vec F_{2,1}$.'
        f: [3]
        src: [p14L, p14R]

# ───────────────────────────────────────────────────────────────
  - id: dyn-forces
    title: Виды сил
    pages: [p14R, p15L, p15R]
    theory:
      - kind: definition
        title: Сила тяжести
        body: Сила тяжести возникает из-за притяжения Земли и направлена вертикально вниз — для тела на опоре, под опорой и на наклонной плоскости.
        src: p14R
      - kind: definition
        title: Вес тела
        body: Сила, с которой тело действует на опору или подвес, называется весом тела. Сила тяжести и вес тела — разные понятия.
        src: p14R
      - kind: definition
        title: Сила реакции опоры
        body: Сила реакции опоры возникает как противодействие к весу; она перпендикулярна опоре (горизонтальной, наклонной, стене).
        src: p14R
      - kind: definition
        title: Центробежная сила
        body: Центробежная сила возникает в круговом движении и направлена от центра.
        src: p15L
      - kind: definition
        title: Сила инерции
        body: 'Сила инерции возникает за счёт способности инерции. Способность инерции — это способность тел, связанная с удерживанием состояния покоя или прямолинейно-равномерного движения. Пример: если тележка с человеком ускоряется вправо, сила инерции на человека направлена влево.'
        src: p15L
      - kind: text
        title: Сила натяжения нити
        body: 'Для груза, висящего на нити в покое: натяжение $T$ направлено вверх, сила тяжести $mg$ — вниз, $T = mg$.'
        src: p15R
    formulas:
      - title: Сила тяжести
        tex: 'F_т = mg'
        sym: [F_grav, m, g]
        boxed: true
        src: p14R
      - title: Вес тела
        tex: '\vec P = m\sqrt{g^2 + a^2 - 2ag\cos\varphi},\qquad \varphi = \angle(\vec a, \vec g)'
        sym: [P, m, g, a, phi_ag]
        boxed: true
        src: p14R
      - title: Сила реакции опоры
        tex: '\vec N = -\vec P'
        sym: [N, P]
        boxed: true
        src: p14R
      - title: Центробежная сила
        tex: 'F_{цб} = m a_ц,\quad a_ц = \frac{\upsilon^2}{R} = \omega^2 R,\quad F_{цб} = \frac{m\upsilon^2}{R} = m\omega^2 R'
        sym: [F_cf, m, a_c, v, R, omega]
        boxed: true
        src: p15L
      - title: Сила инерции
        tex: 'F_и = m\,a_{системы}'
        sym: [F_in, m, a_sys]
        boxed: true
        src: p15L
      - title: Натяжение нити (груз в покое)
        tex: 'T = mg'
        sym: [T_ten, m, g]
        src: p15R
    questions:
      - type: single
        cat: theory
        q: Чем вес тела отличается от силы тяжести (по конспекту)?
        opts: ['Это разные понятия: вес — сила, с которой тело действует на опору или подвес', 'Это одно и то же', 'Вес всегда больше силы тяжести', 'Вес действует на тело со стороны Земли']
        ans: a
        hint: К чему приложен вес тела?
        explain: Вес — сила, с которой тело действует на опору или подвес; сила тяжести возникает из-за притяжения Земли. В конспекте подчёркнуто, что это разные понятия.
        src: p14R
      - type: numeric
        cat: problem
        q: Найдите силу тяжести, действующую на тело массой 5 кг ($g = 10$ м/с²).
        num: { value: 50, unit: 'Н', check: '5*10' }
        hint: '$F_т = mg$.'
        explain: Формула силы тяжести.
        f: [1]
        sol: { given: ['m = 5 кг'], find: 'Fт', formula: 'F_т = mg', calc: 'F_т = 5\cdot10 = 50', answer: '50 Н' }
        src: p14R
      - type: numeric
        cat: problem
        q: Тело массой 2 кг движется по окружности радиусом 4 м со скоростью 6 м/с. Найдите центробежную силу.
        num: { value: 18, unit: 'Н', check: '2*36/4' }
        hint: '$F_{цб} = \frac{m\upsilon^2}{R}$.'
        explain: Центробежная сила через скорость и радиус.
        f: [4]
        sol: { given: ['m = 2 кг', 'R = 4 м', 'υ = 6 м/с'], find: 'Fцб', formula: 'F_{цб} = \frac{m\upsilon^2}{R}', calc: 'F_{цб} = \frac{2\cdot36}{4} = 18', answer: '18 Н' }
        src: p15L
      - type: numeric
        cat: problem
        q: Тележка с человеком массой 60 кг разгоняется с ускорением 3 м/с². Найдите силу инерции, действующую на человека.
        num: { value: 180, unit: 'Н', check: '60*3' }
        hint: '$F_и = m\,a_{системы}$.'
        explain: Сила инерции направлена против ускорения тележки.
        f: [5]
        sol: { given: ['m = 60 кг', 'a = 3 м/с²'], find: 'Fи', formula: 'F_и = m\,a_{системы}', calc: 'F_и = 60\cdot3 = 180', answer: '180 Н' }
        src: p15L
      - type: single
        cat: formula
        q: Как связаны сила реакции опоры и вес тела?
        opts: ['$\vec N = -\vec P$', '$\vec N = \vec P$', '$N = 2P$', '$N = P\cos\alpha$ всегда']
        ans: a
        hint: Сила реакции опоры — противодействие весу (третий закон Ньютона).
        explain: 'В рамке на стр. 14R: $\vec N = -\vec P$.'
        f: [3]
        src: p14R

# ───────────────────────────────────────────────────────────────
  - id: dyn-elastic
    title: Сила упругости. Соединение пружин
    pages: [p15R, p16L]
    theory:
      - kind: definition
        title: Деформация и сила упругости
        fig: hooke
        body: '**Деформация** — изменение формы и объёма тела под воздействием силы. Сила, которая пытается вернуть телу исходную форму и объём, называется **силой упругости**.'
        src: p15R
      - kind: rule
        title: Предлоги в условиях задач
        body: '«от» — начало; «на» — изменение; «до» — конец. Например, «растянули **на** 2 см» — это $\Delta l$.'
        src: p16L
      - kind: text
        title: График F(Δl)
        body: 'График зависимости силы от удлинения — прямая из начала координат: $\Delta l \sim F$.'
        src: p15R
    formulas:
      - title: Закон для силы упругости
        tex: '\vec F_{упр} = -\vec F,\qquad F_{упр} = -k\Delta l'
        sym: [F_el, F, k, dl]
        boxed: true
        src: p15R
      - title: Сила, растягивающая пружину
        tex: 'F = k\Delta l'
        sym: [F, k, dl]
        boxed: true
        src: p15R
      - title: Жёсткость через модуль Юнга
        tex: 'k = \frac{ES}{l_0}'
        sym: [k, E_y, S_cs, l0]
        cond: '\(k \sim \frac{1}{l_0}\)'
        boxed: true
        src: p16L
      - title: Последовательное соединение пружин
        tex: 'F = F_1 = F_2 = \dots = F_n,\quad \Delta l = \Delta l_1 + \dots + \Delta l_n,\quad \frac{1}{k_{об}} = \frac{1}{k_1} + \frac{1}{k_2} + \dots + \frac{1}{k_n}'
        sym: [F, dl, k_tot, k]
        src: p16L
      - title: Параллельное соединение пружин
        tex: '\Delta l = \Delta l_1 = \dots = \Delta l_n,\quad F = F_1 + \dots + F_n,\quad k_{об} = k_1 + k_2 + \dots + k_n'
        sym: [dl, F, k_tot, k]
        src: p16L
    questions:
      - type: numeric
        cat: problem
        q: Пружину жёсткостью 200 Н/м растянули на 5 см. Какая сила для этого нужна?
        num: { value: 10, unit: 'Н', check: '200*0.05' }
        hint: Переведите сантиметры в метры. «Растянули **на**» — это изменение длины.
        explain: '$F = k\Delta l$.'
        f: [2]
        sol: { given: ['k = 200 Н/м', 'Δl = 5 см'], si: ['Δl = 0,05 м'], find: 'F', formula: 'F = k\Delta l', calc: 'F = 200\cdot0{,}05 = 10', answer: '10 Н' }
        src: p15R
      - type: numeric
        cat: problem
        q: Две пружины жёсткостью 100 Н/м и 300 Н/м соединены последовательно. Найдите общую жёсткость.
        num: { value: 75, unit: 'Н/м', check: '1/(1/100+1/300)' }
        hint: При последовательном соединении складываются обратные величины жёсткостей.
        explain: '$\frac{1}{k_{об}} = \frac{1}{k_1} + \frac{1}{k_2}$.'
        f: [4]
        sol: { given: ['k₁ = 100 Н/м', 'k₂ = 300 Н/м'], find: 'kоб', formula: '\frac{1}{k_{об}} = \frac{1}{k_1}+\frac{1}{k_2}', calc: '\frac{1}{k_{об}} = \frac{3+1}{300} \Rightarrow k_{об} = 75', answer: '75 Н/м' }
        src: p16L
      - type: numeric
        cat: problem
        q: Те же пружины (100 Н/м и 300 Н/м) соединили параллельно. Найдите общую жёсткость.
        num: { value: 400, unit: 'Н/м', check: '100+300' }
        hint: При параллельном соединении жёсткости складываются.
        explain: '$k_{об} = k_1 + k_2$.'
        f: [5]
        sol: { given: ['k₁ = 100 Н/м', 'k₂ = 300 Н/м'], find: 'kоб', formula: 'k_{об} = k_1 + k_2', calc: 'k_{об} = 400', answer: '400 Н/м' }
        src: p16L
      - type: single
        cat: theory
        q: Что означает предлог «на» в условии «пружину растянули на 2 см»?
        opts: ['Изменение (Δl)', 'Начальную длину', 'Конечную длину', 'Жёсткость']
        ans: a
        hint: В конспекте для трёх предлогов — «от», «на», «до» — указаны три значения.
        explain: '«от» — начало, «на» — изменение, «до» — конец.'
        src: p16L
      - type: single
        cat: theory
        q: Как жёсткость пружины зависит от её начальной длины $l_0$?
        opts: ['Обратно пропорционально', 'Прямо пропорционально', 'Не зависит', 'Пропорционально квадрату']
        ans: a
        hint: Посмотрите, где стоит $l_0$ в формуле $k = \frac{ES}{l_0}$.
        explain: '$k \sim \frac{1}{l_0}$.'
        f: [3]
        src: p16L
      - type: single
        cat: theory
        q: Что одинаково у всех пружин при **последовательном** соединении?
        opts: ['Сила', 'Удлинение', 'Жёсткость', 'Начальная длина']
        ans: a
        hint: Одна и та же сила передаётся вдоль цепочки пружин.
        explain: 'Последовательно: $F = F_1 = F_2 = \dots$; параллельно одинаково удлинение.'
        f: [4, 5]
        src: p16L

# ───────────────────────────────────────────────────────────────
  - id: dyn-gravity
    title: Гравитационная сила. Ускорение свободного падения
    pages: [p16R, p17L]
    theory:
      - kind: law
        title: Закон всемирного тяготения
        fig: gravity
        body: Любые два тела, которые имеют массу, взаимно притягиваются. Эта сила притяжения называется гравитационной силой, и значение этой силы прямо пропорционально массе тел и обратно пропорционально квадрату расстояния между центрами масс тел.
        src: p16R
      - kind: text
        title: Данные о Земле
        body: '$R_З = 6400$ км $= 6{,}4\cdot10^6$ м; $M_З = 6\cdot10^{24}$ кг; $g_0 = 9{,}8$ м/с² ≈ 10 м/с².'
        src: p16R
      - kind: rule
        title: Зависимость g от высоты
        body: 'Если $h \ll R$: $g_h = g_0 = \text{const}$. Если $h \to R$: $g_h < g_0$.'
        src: p17L
    formulas:
      - title: Гравитационная сила
        tex: 'F = G\frac{m_1 m_2}{R^2}'
        sym: [F, G, m, R_dist]
        cond: '\(F \sim m_1 m_2\), \(F \sim \frac{1}{R^2}\)'
        boxed: true
        src: p16R
      - title: Гравитационная постоянная
        tex: 'G = 6{,}67\cdot10^{-11}\ \frac{Н\cdot м^2}{кг^2}'
        sym: [G]
        boxed: true
        src: p16R
      - title: Ускорение свободного падения у поверхности Земли
        tex: 'g_0 = G\frac{M_З}{R_З^2} = 9{,}8\ \text{м/с}^2 \approx 10\ \text{м/с}^2'
        sym: [g0, G, M_E, R_E]
        boxed: true
        src: p16R
      - title: g через плотность Земли
        tex: 'M_З = \rho_З\cdot\frac{4}{3}\pi R_З^3,\qquad g_0 = \frac{4}{3}\pi G R_З\rho_З'
        sym: [M_E, rho_E, R_E, g0, G]
        src: p16R
      - title: g на другой планете
        tex: 'g_{пл} = G\frac{M_{пл}}{R_{пл}^2},\qquad g_{пл} = \frac{4}{3}\pi G R_{пл}\rho_{пл}'
        sym: [pl, G]
        boxed: true
        src: p17L
      - title: g на высоте h
        tex: 'g_h = g_0\left(\frac{R_З}{R_З + h}\right)^2'
        sym: [g_h, g0, R_E, h]
        boxed: true
        src: p17L
    questions:
      - type: single
        cat: theory
        q: Расстояние между двумя телами увеличили в 2 раза. Как изменится сила их гравитационного притяжения?
        opts: ['Уменьшится в 4 раза', 'Уменьшится в 2 раза', 'Увеличится в 4 раза', 'Не изменится']
        ans: a
        hint: Сила обратно пропорциональна **квадрату** расстояния.
        explain: '$F \sim \frac{1}{R^2}$: при $R \to 2R$ сила уменьшается в $2^2 = 4$ раза.'
        f: [1]
        src: p16R
      - type: numeric
        cat: problem
        q: 'Вычислите $g_0$ по данным конспекта: $G = 6{,}67\cdot10^{-11}$, $M_З = 6\cdot10^{24}$ кг, $R_З = 6{,}4\cdot10^6$ м.'
        num: { value: 9.77, unit: 'м/с²', check: '6.67e-11*6e24/(6.4e6**2)' }
        hint: Подставьте данные в $g_0 = G\frac{M_З}{R_З^2}$ — не забудьте возвести радиус в квадрат.
        explain: 'Получается ≈ 9,77 м/с²; в конспекте записано 9,8 м/с² ≈ 10 м/с².'
        f: [3]
        sol: { given: ['G = 6,67·10⁻¹¹', 'M = 6·10²⁴ кг', 'R = 6,4·10⁶ м'], find: 'g₀', formula: 'g_0 = G\frac{M_З}{R_З^2}', calc: 'g_0 = \frac{6{,}67\cdot10^{-11}\cdot6\cdot10^{24}}{(6{,}4\cdot10^6)^2} = \frac{4{,}0\cdot10^{14}}{4{,}096\cdot10^{13}} \approx 9{,}77', answer: '≈ 9,8 м/с²' }
        src: p16R
      - type: numeric
        cat: problem
        q: Найдите ускорение свободного падения на высоте, равной радиусу Земли ($g_0 = 10$ м/с²).
        num: { value: 2.5, unit: 'м/с²', check: '10*(1/2)**2' }
        hint: При $h = R_З$ знаменатель $R_З + h = 2R_З$.
        explain: '$g_h = g_0\left(\frac{R_З}{R_З+h}\right)^2 = \frac{g_0}{4}$.'
        f: [6]
        sol: { given: ['h = R_З', 'g₀ = 10 м/с²'], find: 'g_h', formula: 'g_h = g_0\left(\frac{R_З}{R_З+h}\right)^2', calc: 'g_h = 10\cdot\left(\frac12\right)^2 = 2{,}5', answer: '2,5 м/с²' }
        src: p17L
      - type: numeric
        cat: problem
        q: На какой высоте над поверхностью Земли ускорение свободного падения в 4 раза меньше, чем у поверхности? Ответ в км ($R_З = 6400$ км).
        num: { value: 6400, unit: 'км', check: '6400*(Math.sqrt(4)-1)' }
        hint: '$\left(\frac{R_З}{R_З+h}\right)^2 = \frac14$ ⇒ $R_З + h = 2R_З$.'
        explain: Высота равна радиусу Земли.
        f: [6]
        sol: { given: ['g_h = g₀/4', 'R = 6400 км'], find: 'h', formula: 'g_h = g_0\left(\frac{R_З}{R_З+h}\right)^2', calc: '\frac{R_З}{R_З+h} = \frac12 \Rightarrow h = R_З = 6400', answer: '6400 км' }
        src: p17L
      - type: single
        cat: formula
        q: Чему равна гравитационная постоянная (по конспекту)?
        opts: ['$6{,}67\cdot10^{-11}\ \frac{Н\cdot м^2}{кг^2}$', '$9{,}8\ \frac{м}{с^2}$', '$6\cdot10^{24}$ кг', '$6{,}4\cdot10^{6}$ м']
        ans: a
        hint: Это очень маленькое число с единицами Н·м²/кг².
        explain: '$G = 6{,}67\cdot10^{-11}$ Н·м²/кг² — в рамке на стр. 16R.'
        f: [2]
        src: p16R

# ───────────────────────────────────────────────────────────────
  - id: dyn-satellites
    title: Спутники. Первая космическая скорость
    pages: [p17L, p17R]
    theory:
      - kind: text
        title: Спутник на круговой орбите
        fig: satellite
        body: 'В конспекте: «Когда тело движется по поверхности Земли с первой космической скоростью, то тело, преодолев притяжение Земли, становится невесомым» (см. замечание E05). Условие: сила притяжения равна центробежной, $F_з = F_{цб}$.'
        src: p17L
        errata: [E05]
      - kind: text
        title: Данные из конспекта
        body: '$\upsilon_I \approx 7{,}9$ км/с; период $T_I = 84$ мин; частота $\nu_I = 17$ об/сутки. На высоте $h$: $\upsilon_{Ih} < \upsilon_I = 7{,}9$ км/с, $T_{Ih} > T_I$.'
        src: [p17L, p17R]
      - kind: note
        title: Замечания к странице 17R
        body: 'В конспекте записано «$\nu_{Ih} > T_I$» (см. E07) и формула для планет без корня (см. E08).'
        src: p17R
        errata: [E07, E08]
      - kind: text
        title: Зависимости для спутников
        body: '① $\upsilon \sim \frac{1}{\sqrt R}$; ② $T \sim \sqrt{R^3}$, $\left(\frac{T_1}{T_2}\right)^2 = \left(\frac{R_1}{R_2}\right)^3$; ③ $\upsilon \sim \frac{1}{\sqrt[3]{T}}$. Множитель $\frac{4\pi^2}{GM}$ — постоянная величина.'
        src: p17R
    formulas:
      - title: Первая космическая скорость
        tex: 'G\frac{M_З m}{R_З^2} = \frac{m\upsilon^2}{R_З}\;\Rightarrow\;\upsilon_I = \sqrt{G\frac{M_З}{R_З}}'
        sym: [v_I, G, M_E, R_E, m]
        boxed: true
        src: p17L
      - title: Первая космическая через g и плотность
        tex: '\upsilon_I = \sqrt{g_0 R_З},\qquad \upsilon_I = 2R_З\sqrt{\frac{\pi}{3}G\rho_З}'
        sym: [v_I, g0, R_E, G, rho_E]
        boxed: true
        src: p17L
      - title: Скорость на высоте h
        tex: '\upsilon_{Ih} = \sqrt{G\frac{M}{R+h}},\qquad \upsilon_{Ih} = \upsilon_I\sqrt{\frac{R_З}{R_З + h}}'
        sym: [v_Ih, G, M, R, h, v_I, R_E]
        boxed: true
        src: p17R
      - title: Для любых планет (как записано)
        tex: '\upsilon_{Iпл} = G\frac{M_{пл}}{R_{пл}}'
        sym: [v_I, pl, G]
        boxed: true
        src: p17R
        errata: [E08]
      - title: Для любых планет
        tex: '\upsilon_{Iпл} = \sqrt{g_{пл}R_{пл}},\qquad \upsilon_{Iпл} = 2R_{пл}\sqrt{\frac{\pi}{3}G\rho_{пл}}'
        sym: [v_I, pl, G]
        boxed: true
        src: p17R
      - title: Скорость и период спутника на орбите радиуса R
        tex: '\upsilon = \sqrt{G\frac{M}{R}},\quad \upsilon = \frac{2\pi R}{T},\quad T^2 = \frac{4\pi^2}{GM}R^3'
        sym: [v, G, M, R_orb, T]
        src: p17R
      - title: Отношение периодов
        tex: '\left(\frac{T_1}{T_2}\right)^2 = \left(\frac{R_1}{R_2}\right)^3'
        sym: [T, R_orb]
        src: p17R
    examples:
      - title: Расчёт первой космической скорости
        steps: ['$\upsilon = 6{,}67\cdot10^{-11}\frac{6\cdot10^{24}}{6{,}4\cdot10^6} = 7905$ м/с $= 7{,}9$ км/с (как в конспекте; знак корня пропущен — см. E06)']
        src: p17L
        errata: [E06]
    questions:
      - type: numeric
        cat: problem
        q: 'Вычислите первую космическую скорость по формуле $\upsilon_I = \sqrt{g_0R_З}$ при $g_0 = 10$ м/с² и $R_З = 6{,}4\cdot10^6$ м. Ответ в км/с.'
        num: { value: 8, unit: 'км/с', check: 'Math.sqrt(10*6.4e6)/1000' }
        hint: 'Под корнем получится $6{,}4\cdot10^7$; не забудьте перевести м/с в км/с.'
        explain: 'При $g_0 = 9{,}8$ получается ≈ 7,9 км/с, как в конспекте.'
        f: [2]
        sol: { given: ['g₀ = 10 м/с²', 'R = 6,4·10⁶ м'], find: 'υI', formula: '\upsilon_I = \sqrt{g_0R_З}', calc: '\upsilon_I = \sqrt{6{,}4\cdot10^7} = 8000\ \text{м/с}', answer: '8 км/с' }
        src: p17L
      - type: numeric
        cat: problem
        q: Радиус орбиты спутника увеличили в 4 раза. Во сколько раз увеличится период обращения?
        num: { value: 8, unit: 'раз', check: 'Math.sqrt(4**3)' }
        hint: '$\left(\frac{T_1}{T_2}\right)^2 = \left(\frac{R_1}{R_2}\right)^3$.'
        explain: '$T \sim \sqrt{R^3}$: $\sqrt{4^3} = 8$.'
        f: [7]
        sol: { calc: '\frac{T_2}{T_1} = \sqrt{\left(\frac{R_2}{R_1}\right)^3} = \sqrt{64} = 8', answer: 'в 8 раз' }
        src: p17R
      - type: single
        cat: theory
        q: Радиус орбиты спутника увеличили в 4 раза. Как изменится его скорость?
        opts: ['Уменьшится в 2 раза', 'Увеличится в 2 раза', 'Уменьшится в 4 раза', 'Не изменится']
        ans: a
        hint: '$\upsilon \sim \frac{1}{\sqrt R}$.'
        explain: '$\upsilon = \sqrt{GM/R}$: при $R \to 4R$ скорость уменьшается в $\sqrt4 = 2$ раза.'
        f: [6]
        src: p17R
      - type: numeric
        cat: problem
        q: Найдите первую космическую скорость на высоте $h = 3R_З$, если у поверхности $\upsilon_I = 7{,}9$ км/с.
        num: { value: 3.95, unit: 'км/с', check: '7.9*Math.sqrt(1/4)' }
        hint: '$\upsilon_{Ih} = \upsilon_I\sqrt{\frac{R_З}{R_З+h}}$; при $h = 3R_З$ знаменатель $4R_З$.'
        explain: Скорость на высоте меньше, чем у поверхности.
        f: [3]
        sol: { given: ['υI = 7,9 км/с', 'h = 3R_З'], find: 'υIh', formula: '\upsilon_{Ih} = \upsilon_I\sqrt{\frac{R_З}{R_З+h}}', calc: '\upsilon_{Ih} = 7{,}9\cdot\sqrt{\frac14} = 3{,}95', answer: '3,95 км/с' }
        src: p17R
      - type: single
        cat: formula
        q: Какое условие записано в конспекте для движения тела с первой космической скоростью?
        opts: ['$F_з = F_{цб}$', '$F_з = 0$', '$F_{цб} = 0$', '$F_з = mg + F_{цб}$']
        ans: a
        hint: Сила притяжения Земли и центробежная сила ...
        explain: '$F_з = F_{цб}$: $G\frac{M_З m}{R_З^2} = \frac{m\upsilon^2}{R_З}$.'
        f: [1]
        src: p17L
      - type: numeric
        cat: theory
        q: Каков период обращения спутника с первой космической скоростью (по конспекту)? Ответ в минутах.
        num: { value: 84, unit: 'мин', check: '84' }
        hint: Значение записано в начале страницы 17R.
        explain: '$T_I = 84$ мин; $\nu_I = 17$ об/сутки.'
        src: p17R

# ───────────────────────────────────────────────────────────────
  - id: dyn-weight
    title: Вес тела. Перегрузка. Невесомость
    pages: [p18L, p18R, p19L]
    theory:
      - kind: text
        title: ① Перегрузка, P > mg
        fig: elevator
        body: 'Ускорение направлено вверх ($\vec a\uparrow\downarrow\vec g$, $\varphi = 180°$, $\cos180° = -1$). Лифт с ускорением вверх: движется вверх равноускоренно (когда только начал движение) или вниз равнозамедленно.'
        src: p18L
        errata: [E22]
      - kind: text
        title: ② Уменьшение веса, P < mg
        body: 'Ускорение направлено вниз ($\vec a\downarrow\downarrow\vec g$, $\varphi = 0°$, $\cos0° = 1$). Лифт с ускорением вниз: движется вверх равнозамедленно или вниз равноускоренно (когда только начал спускаться).'
        src: p18R
      - kind: definition
        title: Невесомость
        body: |
          Невесомость — это случай, когда тело теряет полностью свой вес, то есть $P = 0$. Невесомость возникает, когда на тело действует только одна сила, и эта сила — сила тяжести.
          Тело можно считать невесомым:
          - когда тело бросают вертикально вверх, вертикально вниз, в том числе при свободном падении;
          - при горизонтальном броске;
          - при броске под углом к горизонту;
          - когда тело вращается вокруг Земли по круговой орбите.
          Когда тело невесомо, все объекты, которые могут находиться внутри тела, тоже будут невесомыми.
        src: p19L
    formulas:
      - title: Вес при ускорении вверх
        tex: 'P = m(g + a)'
        sym: [P, m, g, a]
        cond: 'ускорение направлено вверх; из \(g^2 + a^2 + 2ag = (g+a)^2\)'
        boxed: true
        src: p18L
      - title: Перегрузка
        tex: 'n = \frac{P}{mg},\qquad n = \frac{g + a}{g} = 1 + \frac{a}{g},\qquad n = 1 + \frac{\upsilon^2}{gR}'
        sym: [n_over, P, m, g, a, v, R]
        boxed: true
        src: p18L
      - title: Натяжение нити при ускорении вверх
        tex: 'T = m(g + a)'
        sym: [T_ten, m, g, a]
        src: p18R
      - title: Вогнутый мост
        tex: 'P = m(g + a_н) = m\left(g + \frac{\upsilon^2}{R}\right)'
        sym: [P, m, g, a_n, v, R]
        cond: 'нижняя точка вогнутого моста; \(a_н\) направлено вверх'
        src: p18R
      - title: Вес при ускорении вниз
        tex: 'P = m(g - a)'
        sym: [P, m, g, a]
        cond: 'ускорение направлено вниз; из \(g^2 + a^2 - 2ag = (g-a)^2\)'
        boxed: true
        src: p18R
      - title: Выпуклый мост
        tex: 'P = m(g - a_н) = m\left(g - \frac{\upsilon^2}{R}\right)'
        sym: [P, m, g, a_n, v, R]
        cond: 'верхняя точка выпуклого моста; \(a_н\) направлено вниз'
        src: p19L
    questions:
      - type: numeric
        cat: problem
        q: Лифт начинает подниматься с ускорением 2 м/с². Найдите вес человека массой 60 кг ($g = 10$ м/с²).
        num: { value: 720, unit: 'Н', check: '60*(10+2)' }
        hint: Ускорение направлено вверх — это случай перегрузки.
        explain: '$P = m(g + a)$.'
        f: [1]
        sol: { given: ['m = 60 кг', 'a = 2 м/с² (вверх)'], find: 'P', formula: 'P = m(g+a)', calc: 'P = 60\cdot12 = 720', answer: '720 Н' }
        src: p18L
      - type: numeric
        cat: problem
        q: Лифт начинает спускаться с ускорением 2 м/с². Найдите вес человека массой 60 кг.
        num: { value: 480, unit: 'Н', check: '60*(10-2)' }
        hint: Ускорение направлено вниз — вес уменьшается.
        explain: '$P = m(g - a)$.'
        f: [5]
        sol: { given: ['m = 60 кг', 'a = 2 м/с² (вниз)'], find: 'P', formula: 'P = m(g-a)', calc: 'P = 60\cdot8 = 480', answer: '480 Н' }
        src: p18R
      - type: numeric
        cat: problem
        q: Автомобиль массой 1000 кг проезжает верхнюю точку выпуклого моста радиусом 40 м со скоростью 10 м/с. Найдите вес автомобиля.
        num: { value: 7500, unit: 'Н', check: '1000*(10-100/40)' }
        hint: На выпуклом мосту центростремительное ускорение направлено вниз.
        explain: '$P = m\left(g - \frac{\upsilon^2}{R}\right)$.'
        f: [6]
        sol: { given: ['m = 1000 кг', 'R = 40 м', 'υ = 10 м/с'], find: 'P', formula: 'P = m\left(g - \frac{\upsilon^2}{R}\right)', calc: 'P = 1000\cdot(10 - 2{,}5) = 7500', answer: '7500 Н' }
        src: p19L
      - type: numeric
        cat: problem
        q: Автомобиль массой 1000 кг проезжает нижнюю точку вогнутого моста радиусом 50 м со скоростью 10 м/с. Найдите вес автомобиля.
        num: { value: 12000, unit: 'Н', check: '1000*(10+100/50)' }
        hint: На вогнутом мосту центростремительное ускорение направлено вверх.
        explain: '$P = m\left(g + \frac{\upsilon^2}{R}\right)$.'
        f: [4]
        sol: { given: ['m = 1000 кг', 'R = 50 м', 'υ = 10 м/с'], find: 'P', formula: 'P = m\left(g + \frac{\upsilon^2}{R}\right)', calc: 'P = 1000\cdot(10 + 2) = 12\,000', answer: '12 000 Н' }
        src: p18R
      - type: numeric
        cat: problem
        q: Лифт движется с ускорением 5 м/с², направленным вверх. Найдите перегрузку ($g = 10$ м/с²).
        num: { value: 1.5, unit: '', check: '1+5/10' }
        hint: '$n = 1 + \frac{a}{g}$.'
        explain: Коэффициент перегрузки.
        f: [2]
        sol: { given: ['a = 5 м/с²'], find: 'n', formula: 'n = 1 + \frac{a}{g}', calc: 'n = 1 + 0{,}5 = 1{,}5', answer: '1,5' }
        src: p18L
      - type: multiple
        cat: theory
        q: В каких случаях тело можно считать невесомым (по конспекту)? Выберите все.
        opts: ['Свободное падение', 'Бросок под углом к горизонту', 'Движение по круговой орбите вокруг Земли', 'Горизонтальный бросок', 'Лифт поднимается равномерно', 'Тело лежит на столе']
        ans: [a, b, c, d]
        hint: Невесомость — когда на тело действует **только** сила тяжести.
        explain: 'В конспекте перечислены: броски вверх и вниз (в том числе свободное падение), горизонтальный бросок, бросок под углом и круговая орбита.'
        src: p19L
      - type: text
        cat: theory
        q: Что такое невесомость и когда она возникает?
        ref: Невесомость — это случай, когда тело полностью теряет свой вес, то есть P = 0. Она возникает, когда на тело действует только одна сила — сила тяжести.
        criteria: ['Указано, что вес равен нулю (P = 0)', 'Указано, что действует только сила тяжести']
        hint: Определение начинается со слов «Невесомость — это случай, когда тело…»
        explain: Определение со стр. 19L.
        src: p19L

# ───────────────────────────────────────────────────────────────
  - id: dyn-equation
    title: Динамическое уравнение движения. Связанные тела и блоки
    pages: [p25L, p25R, p26L, p26R]
    theory:
      - kind: text
        title: Динамическое уравнение
        body: 'Основное уравнение: $m\vec a = \vec F_{рез}$. Для каждого тела записывают проекции сил: по вертикали (через силу реакции опоры $N$) и вдоль ускорения.'
        src: p25L
      - kind: text
        title: Примеры из конспекта (брусок на горизонтальной поверхности)
        fig: block-forces
        body: |
          ① $F_1$ вправо, ускорение вправо: $N = mg$; $ma = F_1$.
          ② Дополнительно $F_2$ вниз и $F_4$ влево: $N = F_2 + mg$; $ma = F_1 - F_4$.
          ③ $F_3$ вверх, $F_2$ вниз, $F_4$ влево, $F_1$ и $F_5$ вправо, ускорение влево: $N + F_3 = mg + F_2$; $ma = F_4 - F_1 - F_5$.
        src: p25L
      - kind: note
        title: Замечание к странице 26L
        body: 'В последнем уравнении вертикальной цепочки из пяти тел записано $m_5 a = T_4 + m_4 g$ (см. E13).'
        src: p26L
        errata: [E13]
    formulas:
      - title: Динамическое уравнение
        tex: 'm\vec a = \vec F_{рез}'
        sym: [m, a, F_res]
        src: p25L
      - title: Два связанных бруска (F тянет первый)
        tex: '\begin{cases} m_1 a = F - T \\ m_2 a = T \end{cases},\qquad N_1 = m_1 g,\ N_2 = m_2 g'
        sym: [m, a, F, T_ten, N, g]
        src: p25R
      - title: Три связанных бруска
        tex: '\begin{cases} m_1 a = F - T_1 \\ m_2 a = T_1 - T_2 \\ m_3 a = T_2 \end{cases}'
        sym: [m, a, F, T_ten]
        src: p25R
      - title: Брусок на столе и висящий груз (через блок)
        tex: '\begin{cases} m_1 a = m_1 g - T \\ m_2 a = T \end{cases},\qquad N_2 = m_2 g'
        sym: [m, a, g, T_ten, N]
        cond: 'm₁ — висящий груз, m₂ — брусок на столе'
        src: p26R
      - title: Неподвижный блок с двумя грузами
        tex: 'F = 2T,\qquad \begin{cases} m_1 a = m_1 g - T \\ m_2 a = T - m_2 g \end{cases}'
        sym: [F, T_ten, m, a, g]
        cond: '\(m_1 > m_2\); F — сила на подвес блока'
        boxed: true
        src: p26R
      - title: Ускорение грузов на блоке
        tex: 'a = g\,\frac{m_1 - m_2}{m_1 + m_2}'
        sym: [a, g, m]
        cond: '\(m_1 > m_2\)'
        boxed: true
        src: p26R
      - title: Натяжение нити и сила на подвес
        tex: 'T = \frac{2m_1m_2}{m_1 + m_2}\,g,\qquad F = \frac{4m_1m_2}{m_1 + m_2}\,g'
        sym: [T_ten, F, m, g]
        boxed: true
        src: p26R
    questions:
      - type: numeric
        cat: problem
        q: Через неподвижный блок перекинута нить с грузами 3 кг и 1 кг. Найдите ускорение грузов ($g = 10$ м/с²).
        num: { value: 5, unit: 'м/с²', check: '10*(3-1)/(3+1)' }
        hint: В рамке на стр. 26R есть готовая формула ускорения.
        explain: '$a = g\frac{m_1-m_2}{m_1+m_2}$.'
        f: [6]
        sol: { given: ['m₁ = 3 кг', 'm₂ = 1 кг'], find: 'a', formula: 'a = g\frac{m_1-m_2}{m_1+m_2}', calc: 'a = 10\cdot\frac{2}{4} = 5', answer: '5 м/с²' }
        src: p26R
      - type: numeric
        cat: problem
        q: В той же системе (3 кг и 1 кг на блоке) найдите силу натяжения нити.
        num: { value: 15, unit: 'Н', check: '2*3*1*10/(3+1)' }
        hint: '$T = \frac{2m_1m_2}{m_1+m_2}g$.'
        explain: 'Проверка: $m_2a = T - m_2g$ ⇒ $T = 1\cdot(5+10) = 15$ Н.'
        f: [7]
        sol: { given: ['m₁ = 3 кг', 'm₂ = 1 кг'], find: 'T', formula: 'T = \frac{2m_1m_2}{m_1+m_2}g', calc: 'T = \frac{2\cdot3\cdot1}{4}\cdot10 = 15', answer: '15 Н' }
        src: p26R
      - type: numeric
        cat: problem
        q: В той же системе (3 кг и 1 кг на блоке) найдите силу, действующую на подвес блока.
        num: { value: 30, unit: 'Н', check: '4*3*1*10/(3+1)' }
        hint: Подвес держит две ветви нити.
        explain: '$F = 2T = \frac{4m_1m_2}{m_1+m_2}g$.'
        f: [5, 7]
        sol: { given: ['T = 15 Н'], find: 'F', formula: 'F = 2T', calc: 'F = 2\cdot15 = 30', answer: '30 Н' }
        src: p26R
      - type: numeric
        cat: problem
        q: За брусок массой 2 кг тянут горизонтальной силой 10 Н; к нему нитью привязан брусок массой 3 кг. Трения нет. Найдите силу натяжения нити.
        num: { value: 6, unit: 'Н', check: '3*10/(2+3)' }
        hint: Сложите уравнения системы, чтобы найти общее ускорение, затем используйте $m_2a = T$.
        explain: 'Из системы: $a = \frac{F}{m_1+m_2} = 2$ м/с², $T = m_2 a$.'
        f: [2]
        sol: { given: ['m₁ = 2 кг', 'm₂ = 3 кг', 'F = 10 Н'], find: 'T', formula: 'm_1a = F - T,\ m_2a = T', calc: 'a = \frac{10}{5} = 2;\ T = 3\cdot2 = 6', answer: '6 Н' }
        src: p25R
      - type: numeric
        cat: problem
        q: Брусок массой 4 кг лежит на гладком столе и связан нитью через блок с висящим грузом массой 1 кг. Найдите ускорение системы ($g = 10$ м/с²).
        num: { value: 2, unit: 'м/с²', check: '1*10/(1+4)' }
        hint: 'Сложите уравнения $m_1a = m_1g - T$ и $m_2a = T$.'
        explain: '$a = \frac{m_1 g}{m_1+m_2}$, где $m_1$ — висящий груз.'
        f: [4]
        sol: { given: ['m₁ = 1 кг (висит)', 'm₂ = 4 кг (на столе)'], find: 'a', formula: '(m_1+m_2)a = m_1g', calc: 'a = \frac{10}{5} = 2', answer: '2 м/с²' }
        src: p26R
      - type: single
        cat: formula
        q: 'На брусок действуют: $F_1$ вправо, $F_2$ вертикально вниз, $F_4$ влево, сила тяжести и реакция опоры. Чему равна сила реакции опоры?'
        opts: ['$N = F_2 + mg$', '$N = mg$', '$N = mg - F_2$', '$N = F_1 - F_4$']
        ans: a
        hint: По вертикали тело не движется — сумма сил вверх равна сумме сил вниз.
        explain: 'Пример ② со стр. 25L: $N = F_2 + mg$; $ma = F_1 - F_4$.'
        src: p25L

# ───────────────────────────────────────────────────────────────
  - id: dyn-friction
    title: Сила трения
    pages: [p27L, p27R, p28L]
    theory:
      - kind: definition
        title: Сила трения
        body: 'Сила трения возникает между плоскостью и площадью тела, которой оно касается плоскости. Трение зависит от материала плоскости, от площади и от шероховатости (см. замечание E14). $\mu$ — коэффициент трения; при гладкой поверхности $\mu = 0$.'
        src: p27L
        errata: [E14]
      - kind: list
        title: Виды силы трения
        body: |
          I. Сила трения покоя.
          II. Сила трения скольжения.
          III. Сила трения качения.
        src: p27L
      - kind: definition
        title: Сила трения покоя
        body: Сила трения покоя может действовать на тела со стороны плоскости, на которой они расположены. Значение силы трения покоя зависит от значения силы, которая пытается сдвинуть тело из состояния покоя. Сила трения покоя — это противодействующая сила.
        src: p27L
      - kind: text
        title: Три случая (тело на горизонтальной поверхности, сила F)
        fig: friction
        body: |
          $A = \mu N$ — абсолютная величина (предел) силы трения.
          ① $F < A$: $F_т = F_{т.п} = F$; $a = 0$, $\upsilon = 0$ — покой (т.п — трение покоя).
          ② $F = A$: $F_т = F_{т.с} = A$; $a = 0$, $\upsilon = \text{const}$ — равномерное (т.с — трение скольжения).
          ③ $F > A$: $F_т = F_{т.с} = A$; $a \ne 0$.
          График $F_т(F)$: сначала прямая «трение покоя» ($F_т = F$), затем горизонталь «трение скольжения» ($F_т = A$).
        src: p27R
      - kind: text
        title: Груз в кузове ускоряющейся машины
        body: 'Груз удерживается силой трения покоя: $F_{т.п} = F_и$ (индекс правой части читается неуверенно — см. E20).'
        src: p28L
        errata: [E20]
    formulas:
      - title: Предел силы трения
        tex: 'A = \mu N'
        sym: [A_fr, mu, N]
        src: p27R
      - title: Сила трения скольжения
        tex: 'F_{т.с} = \mu N,\qquad F_т = \mu mg'
        sym: [F_fr, mu, N, m, g]
        cond: горизонтальная поверхность, N = mg
        src: [p27R, p28L]
      - title: Тормозное ускорение
        tex: 'a_т = \mu g'
        sym: [a_br, mu, g]
        cond: торможение только под действием трения скольжения
        boxed: true
        src: p28L
      - title: Тормозное время и путь
        tex: 't_т = \frac{\upsilon_0}{\mu g},\qquad S_т = \frac{\upsilon_0^2}{2\mu g}'
        sym: [t_br, S_br, v0, mu, g]
        boxed: true
        src: p28L
    examples:
      - title: Предел силы трения
        given: '$\mu = 0{,}3$; $m = 2$ кг; $g = 10$ м/с²'
        steps: ['$A = \mu mg = 0{,}3\cdot2\cdot10 = 6$ Н']
        src: p27R
    questions:
      - type: numeric
        cat: problem
        q: 'Брусок массой 2 кг лежит на столе ($\mu = 0{,}3$). Его тянут горизонтальной силой 4 Н. Чему равна сила трения?'
        num: { value: 4, unit: 'Н', check: 'Math.min(4, 0.3*2*10)' }
        hint: Сравните приложенную силу с пределом $A = \mu mg$.
        explain: '$A = 6$ Н, $F = 4$ Н < $A$ — тело покоится, трение покоя равно приложенной силе.'
        f: [1]
        sol: { given: ['m = 2 кг', 'μ = 0,3', 'F = 4 Н'], find: 'Fт', formula: 'A = \mu mg;\ F < A \Rightarrow F_т = F', calc: 'A = 6\ \text{Н} > 4\ \text{Н} \Rightarrow F_т = 4', answer: '4 Н' }
        src: p27R
      - type: numeric
        cat: problem
        q: 'Тот же брусок (2 кг, $\mu = 0{,}3$) тянут силой 10 Н. Чему равна сила трения?'
        num: { value: 6, unit: 'Н', check: 'Math.min(10, 0.3*2*10)' }
        hint: Если $F > A$, тело скользит.
        explain: При скольжении сила трения равна пределу $A = \mu mg$.
        f: [1, 2]
        sol: { given: ['m = 2 кг', 'μ = 0,3', 'F = 10 Н'], find: 'Fт', formula: 'F > A \Rightarrow F_т = A = \mu mg', calc: 'F_т = 0{,}3\cdot2\cdot10 = 6', answer: '6 Н' }
        src: p27R
      - type: numeric
        cat: problem
        q: Шайба скользит по льду с начальной скоростью 20 м/с, коэффициент трения 0,5. Найдите тормозной путь ($g = 10$ м/с²).
        num: { value: 40, unit: 'м', check: '400/(2*0.5*10)' }
        hint: Тормозное ускорение $a_т = \mu g$.
        explain: '$S_т = \frac{\upsilon_0^2}{2\mu g}$.'
        f: [4]
        sol: { given: ['υ₀ = 20 м/с', 'μ = 0,5'], find: 'Sт', formula: 'S_т = \frac{\upsilon_0^2}{2\mu g}', calc: 'S_т = \frac{400}{10} = 40', answer: '40 м' }
        src: p28L
      - type: numeric
        cat: problem
        q: 'В условиях предыдущей задачи ($\upsilon_0 = 20$ м/с, $\mu = 0{,}5$) найдите время торможения.'
        num: { value: 4, unit: 'с', check: '20/(0.5*10)' }
        hint: '$t_т = \frac{\upsilon_0}{\mu g}$.'
        explain: Тормозное время при трении скольжения.
        f: [4]
        sol: { given: ['υ₀ = 20 м/с', 'μ = 0,5'], find: 'tт', formula: 't_т = \frac{\upsilon_0}{\mu g}', calc: 't_т = \frac{20}{5} = 4', answer: '4 с' }
        src: p28L
      - type: multiple
        cat: theory
        q: Какие виды силы трения перечислены в конспекте? Выберите все.
        opts: ['Трение покоя', 'Трение скольжения', 'Трение качения', 'Трение упругости', 'Трение сопротивления']
        ans: [a, b, c]
        hint: В конспекте три вида.
        explain: 'Сила трения бывает трёх видов: покоя, скольжения, качения.'
        src: p27L
      - type: single
        cat: theory
        q: Брусок движется по столу равномерно под действием горизонтальной силы F. Чему равна сила трения?
        opts: ['Она равна F (трение скольжения, F = A)', 'Нулю', 'Больше F', 'Меньше F']
        ans: a
        hint: При равномерном движении $a = 0$.
        explain: 'Случай ②: $F = A$, $F_т = F_{т.с} = A$, $\upsilon = \text{const}$.'
        f: [1]
        src: p27R

# ───────────────────────────────────────────────────────────────
  - id: dyn-incline
    title: Наклонная плоскость
    pages: [p28R, p29L, p29R, p30L]
    theory:
      - kind: text
        title: Обозначения
        body: '$h$ — высота; $L$ — длина; $l$ — длина основания; $\alpha$ — угол наклона; $\sin\alpha$ — «наклонность». Силу тяжести раскладывают на **силу скольжения** $F_с$ (вдоль плоскости) и **давящую силу** $F_д$ (перпендикулярно плоскости).'
        src: p28R
      - kind: text
        title: Будет ли тело скользить
        fig: incline
        body: |
          Сравнивают $mg\sin\alpha$ и $\mu mg\cos\alpha$, то есть $\operatorname{tg}\alpha$ и $\mu$:
          ① $\operatorname{tg}\alpha < \mu$: $a = 0$, $\upsilon = 0$ — покой; $F_т = F_{т.п} = mg\sin\alpha$.
          ② $\operatorname{tg}\alpha = \mu$: $a = 0$, $\upsilon = \text{const}$ — равномерное движение вниз; $F_т = F_{т.с} = mg\sin\alpha$.
          ③ $\operatorname{tg}\alpha > \mu$: $a \ne 0$ — равноускоренно вниз; $F_т = F_{т.с} = \mu mg\cos\alpha$.
        src: p29L
    formulas:
      - title: Геометрия наклонной плоскости
        tex: 'L^2 = h^2 + l^2,\quad \sin\alpha = \frac{h}{L},\quad \cos\alpha = \frac{l}{L},\quad \operatorname{tg}\alpha = \frac{h}{l},\quad \sin^2\alpha + \cos^2\alpha = 1'
        sym: [L_inc, h_inc, l_base, alpha]
        src: p28R
      - title: Сила скольжения и давящая сила
        tex: 'F_с = mg\sin\alpha,\qquad F_д = mg\cos\alpha'
        sym: [F_slide, F_press, m, g, alpha]
        boxed: true
        src: p28R
      - title: Реакция опоры и предел трения на плоскости
        tex: 'N = mg\cos\alpha,\qquad A = \mu mg\cos\alpha'
        sym: [N, A_fr, mu, m, g, alpha]
        src: p29L
      - title: Сила трения на плоскости
        tex: 'F_т = mg\sin\alpha\ (\operatorname{tg}\alpha \le \mu);\qquad F_т = \mu mg\cos\alpha\ (\operatorname{tg}\alpha > \mu)'
        sym: [F_fr, m, g, alpha, mu]
        boxed: true
        src: p29L
      - title: Ускорение при соскальзывании
        tex: 'ma = mg\sin\alpha - \mu mg\cos\alpha,\qquad a = g(\sin\alpha - \mu\cos\alpha)'
        sym: [m, a, g, alpha, mu]
        cond: '\(\operatorname{tg}\alpha > \mu\)'
        boxed: true
        src: p29R
      - title: Ускорение на гладкой плоскости
        tex: 'a = g\sin\alpha'
        sym: [a, g, alpha]
        cond: '\(\mu = 0\)'
        src: p29R
      - title: Тело тянут вверх по плоскости
        tex: 'ma = F - mg\sin\alpha - \mu mg\cos\alpha'
        sym: [m, a, F, g, alpha, mu]
        boxed: true
        src: p29R
      - title: Равномерный подъём
        tex: 'F = mg\sin\alpha + \mu mg\cos\alpha'
        sym: [F, m, g, alpha, mu]
        cond: равномерное движение вверх
        boxed: true
        src: p29R
      - title: Тело прижимают к плоскости перпендикулярной силой
        tex: 'F = \frac{mg\sin\alpha}{\mu} - mg\cos\alpha'
        sym: [F, m, g, alpha, mu]
        cond: 'тело удерживается; из \(mg\sin\alpha = \mu(mg\cos\alpha + F)\)'
        boxed: true
        src: p29R
      - title: Удерживающая сила вдоль плоскости
        tex: 'F = mg\sin\alpha - \mu mg\cos\alpha'
        sym: [F, m, g, alpha, mu]
        cond: 'F и трение направлены вверх по плоскости; из \(\mu mg\cos\alpha + F = mg\sin\alpha\)'
        boxed: true
        src: p30L
    questions:
      - type: single
        cat: theory
        q: 'Тело лежит на наклонной плоскости, $\operatorname{tg}\alpha < \mu$. Что с ним происходит?'
        opts: ['Покоится', 'Скользит равномерно вниз', 'Скользит равноускоренно вниз', 'Движется вверх']
        ans: a
        hint: Сравните «силу скольжения» $mg\sin\alpha$ с пределом трения $\mu mg\cos\alpha$.
        explain: 'Случай ①: $\operatorname{tg}\alpha < \mu$ — покой, $F_т = F_{т.п} = mg\sin\alpha$.'
        f: [4]
        src: p29L
      - type: numeric
        cat: problem
        q: Тело соскальзывает с гладкой наклонной плоскости с углом 30°. Найдите ускорение ($g = 10$ м/с²).
        num: { value: 5, unit: 'м/с²', check: '10*0.5' }
        hint: 'На гладкой поверхности $\mu = 0$.'
        explain: '$a = g\sin\alpha$.'
        f: [6]
        sol: { given: ['α = 30°', 'μ = 0'], find: 'a', formula: 'a = g\sin\alpha', calc: 'a = 10\cdot0{,}5 = 5', answer: '5 м/с²' }
        src: p29R
      - type: numeric
        cat: problem
        q: 'Тело соскальзывает с наклонной плоскости с углом 30°, $\mu = 0{,}2$. Найдите ускорение ($g = 10$ м/с²).'
        num: { value: 3.27, unit: 'м/с²', check: '10*(0.5-0.2*Math.cos(Math.PI/6))' }
        hint: '$\operatorname{tg}30° \approx 0{,}577 > 0{,}2$ — тело скользит. $\cos30° \approx 0{,}866$.'
        explain: '$a = g(\sin\alpha - \mu\cos\alpha)$.'
        f: [5]
        sol: { given: ['α = 30°', 'μ = 0,2'], find: 'a', formula: 'a = g(\sin\alpha - \mu\cos\alpha)', calc: 'a = 10\cdot(0{,}5 - 0{,}2\cdot0{,}866) \approx 3{,}27', answer: '≈ 3,27 м/с²' }
        src: p29R
      - type: numeric
        cat: problem
        q: 'Какую силу вдоль плоскости нужно приложить, чтобы равномерно поднимать тело массой 2 кг по наклонной плоскости с углом 30°, $\mu = 0{,}2$?'
        num: { value: 13.46, unit: 'Н', check: '2*10*0.5+0.2*2*10*Math.cos(Math.PI/6)' }
        hint: При движении вверх и сила скольжения, и трение направлены вниз по плоскости.
        explain: '$F = mg\sin\alpha + \mu mg\cos\alpha$.'
        f: [8]
        sol: { given: ['m = 2 кг', 'α = 30°', 'μ = 0,2'], find: 'F', formula: 'F = mg\sin\alpha + \mu mg\cos\alpha', calc: 'F = 20\cdot0{,}5 + 0{,}2\cdot20\cdot0{,}866 \approx 10 + 3{,}46 = 13{,}46', answer: '≈ 13,5 Н' }
        src: p29R
      - type: numeric
        cat: problem
        q: 'Тело массой 2 кг лежит на наклонной плоскости с углом 30°, $\mu = 0{,}8$. Найдите силу трения.'
        num: { value: 10, unit: 'Н', check: '2*10*0.5' }
        hint: 'Сначала сравните $\operatorname{tg}30° \approx 0{,}577$ и $\mu = 0{,}8$.'
        explain: '$\operatorname{tg}\alpha < \mu$ — тело покоится, трение покоя равно $mg\sin\alpha$, а не $\mu mg\cos\alpha$.'
        f: [4]
        sol: { given: ['m = 2 кг', 'α = 30°', 'μ = 0,8'], find: 'Fт', formula: '\operatorname{tg}\alpha < \mu \Rightarrow F_т = mg\sin\alpha', calc: 'F_т = 2\cdot10\cdot0{,}5 = 10', answer: '10 Н' }
        src: p29L
      - type: numeric
        cat: problem
        q: Высота наклонной плоскости 3 м, длина основания 4 м. Найдите $\sin\alpha$.
        num: { value: 0.6, unit: '', check: '3/Math.sqrt(9+16)' }
        hint: Сначала найдите длину плоскости $L$ по теореме Пифагора.
        explain: '$L = \sqrt{h^2+l^2} = 5$ м; $\sin\alpha = h/L$.'
        f: [1]
        sol: { given: ['h = 3 м', 'l = 4 м'], find: 'sin α', formula: 'L^2 = h^2+l^2;\ \sin\alpha = \frac{h}{L}', calc: 'L = 5;\ \sin\alpha = \frac35 = 0{,}6', answer: '0,6' }
        src: p28R

# ───────────────────────────────────────────────────────────────
  - id: dyn-drag
    title: Сила сопротивления
    pages: [p30L, p30R]
    theory:
      - kind: definition
        title: Сила сопротивления
        body: Сила сопротивления действует со стороны среды, когда тело будет двигаться по этой среде.
        src: p30L
      - kind: list
        title: Виды зависимости силы сопротивления
        body: |
          ① $F_с = \text{const}$.
          ② $F_с \sim \upsilon$: $F_с = -k\upsilon$.
          ③ $F_с \sim \upsilon^2$: $F_с = -k\upsilon^2$.
          ④ $F_с \sim \upsilon^3$ и $F_с \sim S$: $F_с = -kS\upsilon^3$.
          Коэффициент $k$ в конспекте не расшифрован.
        src: [p30L, p30R]
    formulas:
      - title: Движение вверх с постоянным сопротивлением
        tex: 'ma = mg + F_с,\qquad F_с = m(a - g),\qquad a > g'
        sym: [m, a, g, F_drag]
        cond: тело движется вверх (сопротивление и тяжесть направлены вниз)
        src: p30L
      - title: Движение вниз с постоянным сопротивлением
        tex: 'ma = mg - F_с,\qquad F_с = m(g - a),\qquad g > a'
        sym: [m, a, g, F_drag]
        cond: тело движется вниз
        src: p30L
      - title: Сопротивление, зависящее от скорости
        tex: 'ma = -k\upsilon,\qquad ma = -k\upsilon^2,\qquad ma = -kS\upsilon^3'
        sym: [m, a, k_drag, v, S_area]
        src: [p30L, p30R]
    questions:
      - type: numeric
        cat: problem
        q: Тело массой 2 кг падает с ускорением 8 м/с². Найдите силу сопротивления воздуха ($g = 10$ м/с²).
        num: { value: 4, unit: 'Н', check: '2*(10-8)' }
        hint: При движении вниз сопротивление направлено вверх, против тяжести.
        explain: '$F_с = m(g - a)$.'
        f: [2]
        sol: { given: ['m = 2 кг', 'a = 8 м/с²'], find: 'Fс', formula: 'F_с = m(g-a)', calc: 'F_с = 2\cdot(10-8) = 4', answer: '4 Н' }
        src: p30L
      - type: numeric
        cat: problem
        q: Тело массой 1 кг брошено вверх; при подъёме его ускорение по модулю 12 м/с². Найдите силу сопротивления.
        num: { value: 2, unit: 'Н', check: '1*(12-10)' }
        hint: При подъёме сопротивление и сила тяжести направлены в одну сторону — вниз.
        explain: '$F_с = m(a - g)$.'
        f: [1]
        sol: { given: ['m = 1 кг', 'a = 12 м/с²'], find: 'Fс', formula: 'F_с = m(a-g)', calc: 'F_с = 1\cdot(12-10) = 2', answer: '2 Н' }
        src: p30L
      - type: single
        cat: theory
        q: Тело движется вверх, на него действует постоянная сила сопротивления. Как модуль ускорения соотносится с $g$?
        opts: ['$a > g$', '$a < g$', '$a = g$', '$a = 0$']
        ans: a
        hint: Сопротивление «помогает» силе тяжести тормозить тело.
        explain: '$ma = mg + F_с$ ⇒ $a > g$.'
        f: [1]
        src: p30L
      - type: single
        cat: theory
        q: Сила сопротивления пропорциональна квадрату скорости. Скорость увеличили в 3 раза. Как изменилась сила сопротивления?
        opts: ['Увеличилась в 9 раз', 'Увеличилась в 3 раза', 'Увеличилась в 27 раз', 'Не изменилась']
        ans: a
        hint: '$F_с \sim \upsilon^2$.'
        explain: '$3^2 = 9$.'
        f: [3]
        src: p30L

# ───────────────────────────────────────────────────────────────
  - id: dyn-systems
    title: Трение в системах тел. Сила под углом к горизонту
    pages: [p30R, p31L]
    theory:
      - kind: text
        title: Два бруска с трением
        body: 'Два бруска связаны нитью, сила $F$ тянет правый; на каждый действует сила трения $F_т$. Если $F > F_т$, но $F < F_т + F_т$: натяжение $T$ равно разности $F$ и $F_т$ ($T = F - F_т$), но система **не сдвинется**, т.к. действующая сила меньше общей силы трения.'
        src: p30R
      - kind: text
        title: Стопка из пяти одинаковых тел
        body: 'Сила трения между телами (сверху вниз): $\mu mg$, $\mu 2mg$, $\mu 3mg$, $\mu 4mg$, $\mu 5mg$. Сила, которая понадобится для вытаскивания тела (сверху вниз): $F \ge \mu mg$; $F \ge 3\mu mg$; $F \ge 5\mu mg$; $F \ge 7\mu mg$; $F \ge 9\mu mg$.'
        src: p30R
    formulas:
      - title: Натяжение нити при неподвижной системе
        tex: 'T = F - F_т'
        sym: [T_ten, F, F_fr]
        cond: '\(F > F_т\), но \(F < 2F_т\)'
        src: p30R
      - title: Сила под углом вверх к горизонту
        tex: 'N = mg - F\sin\alpha,\qquad ma = F\cos\alpha - \mu(mg - F\sin\alpha)'
        sym: [N, m, g, F, alpha_F, a, mu]
        boxed: true
        src: p31L
      - title: Сила под углом вниз к горизонту
        tex: 'N = mg + F\sin\alpha,\qquad ma = F\cos\alpha - \mu(mg + F\sin\alpha)'
        sym: [N, m, g, F, alpha_F, a, mu]
        boxed: true
        src: p31L
    questions:
      - type: numeric
        cat: problem
        q: 'Брусок массой 5 кг тянут силой 20 Н, направленной под углом 30° вверх к горизонту; $\mu = 0{,}2$. Найдите ускорение ($g = 10$ м/с²).'
        num: { value: 1.86, unit: 'м/с²', check: '(20*Math.cos(Math.PI/6)-0.2*(50-20*0.5))/5' }
        hint: Вертикальная составляющая силы уменьшает силу реакции опоры, а значит и трение.
        explain: '$ma = F\cos\alpha - \mu(mg - F\sin\alpha)$.'
        f: [2]
        sol: { given: ['m = 5 кг', 'F = 20 Н', 'α = 30°', 'μ = 0,2'], find: 'a', formula: 'ma = F\cos\alpha - \mu(mg - F\sin\alpha)', calc: '5a = 17{,}32 - 0{,}2\cdot(50-10) = 9{,}32;\ a \approx 1{,}86', answer: '≈ 1,86 м/с²' }
        src: p31L
      - type: numeric
        cat: problem
        q: 'Тот же брусок (5 кг, $\mu = 0{,}2$) толкают силой 20 Н под углом 30° **вниз** к горизонту. Найдите ускорение.'
        num: { value: 1.06, unit: 'м/с²', check: '(20*Math.cos(Math.PI/6)-0.2*(50+20*0.5))/5' }
        hint: Теперь вертикальная составляющая прижимает брусок к опоре.
        explain: '$ma = F\cos\alpha - \mu(mg + F\sin\alpha)$.'
        f: [3]
        sol: { given: ['m = 5 кг', 'F = 20 Н', 'α = 30°', 'μ = 0,2'], find: 'a', formula: 'ma = F\cos\alpha - \mu(mg + F\sin\alpha)', calc: '5a = 17{,}32 - 0{,}2\cdot60 = 5{,}32;\ a \approx 1{,}06', answer: '≈ 1,06 м/с²' }
        src: p31L
      - type: numeric
        cat: problem
        q: Пять одинаковых брусков массой m лежат стопкой (как на рисунке в конспекте, стр. 30R). Какую минимальную горизонтальную силу нужно приложить, чтобы вытащить **третий сверху** брусок? Ответ — в единицах $\mu mg$.
        num: { value: 5, unit: '·μmg', check: '1*2+3' }
        hint: На третий брусок действуют трение сверху (от двух верхних брусков) и снизу (от трёх брусков над нижней поверхностью).
        explain: 'По схеме конспекта: $F \ge 5\mu mg$ ($2\mu mg$ сверху + $3\mu mg$ снизу).'
        sol: { calc: 'F \ge \mu\cdot2mg + \mu\cdot3mg = 5\mu mg', answer: '5 μmg' }
        src: p30R
      - type: single
        cat: theory
        q: 'Два одинаковых бруска связаны нитью; на каждый действует сила трения $F_т$. Брусок тянут силой $F$, причём $F_т < F < 2F_т$. Что произойдёт?'
        opts: ['Система не сдвинется', 'Система будет двигаться равномерно', 'Сдвинется только передний брусок', 'Нить порвётся']
        ans: a
        hint: Сравните действующую силу с **общей** силой трения.
        explain: Система не сдвинется, т.к. действующая сила меньше общей силы трения; при этом $T = F - F_т$.
        f: [1]
        src: p30R
