# Замечания к источнику. Оригинал в учебной базе сохранён; исправление — только по решению владельца.
errata:
  - id: E01
    page: p04R
    severity: error
    original: '«вектор \(\vec c\) направлен в сторону вычитаемого»'
    issue: На рисунке \(\vec c = \vec a - \vec b\) направлен от конца \(\vec b\) к концу \(\vec a\), то есть к уменьшаемому.
    target: 'Правило: куда направлен вектор разности \(\vec c = \vec a - \vec b\)'
    suggestion: «вектор \(\vec c\) направлен в сторону уменьшаемого».
  - id: E02
    page: p04R
    severity: unclear
    original: 'индексы \(\upsilon_л,\ \upsilon_т,\ \upsilon_р\)'
    issue: 'В конспекте индексы л, т, р не расшифрованы — студенту непонятно, какая скорость какая.'
    target: 'Буквенные индексы скоростей в задаче о лодке и течении'
    suggestion: 'Расшифровать индексы: л — лодка (скорость лодки относительно воды), т — течение, р — результирующая скорость лодки относительно берега.'
    todo: 'Сверьте с рисунком на фото страницы. Если расшифровка верна — «Принять исправление».'
  - id: E03
    page: p08L
    severity: note
    original: '\(g = 9{,}78 \div 9{,}84\) (на экваторе … на полюсах)'
    issue: 'Для полюсов в справочниках обычно указывают ≈ 9,83 м/с², а не 9,84.'
    target: 'Диапазон значений g «на экваторе … на полюсах»'
    suggestion: 'Записать \(g = 9{,}78 \div 9{,}83\) м/с².'
    todo: 'Значение 9,83 — из справочных данных, а не из конспекта. Если на лекции говорили 9,84 — «Оставить как в конспекте». В задачах приложения всё равно используется g = 10 м/с², как в конспекте.'
  - id: E04
    page: p11L
    severity: unclear
    original: '\(\upsilon = \frac{2\pi R}{T}\cos\alpha\) (в рамке)'
    issue: 'Не написано, к какой ситуации относится формула и что означает угол α. Все соседние формулы — для обычного движения по окружности, и там множителя cos α нет: \(\upsilon = \frac{2\pi R}{T}\).'
