# Исходная классификация из ТЗ. Создаются только разделы с материалами;
# остальные хранятся как план (status: planned) и не показываются студенту.
sections:
  - id: mech
    title: Механика
    status: active
  - id: thermo
    title: Молекулярная физика и термодинамика
    status: active
  - id: electro
    title: Электродинамика и электромагнетизм
    status: active
  - id: optics
    title: Оптика
    status: active
  - id: quantum
    title: Квантовая и ядерная физика
    status: active

subsections:
  - id: kin
    sectionId: mech
    title: Кинематика
  - id: dyn
    sectionId: mech
    title: Динамика
  - id: stat
    sectionId: mech
    title: Статика
    note: 'В конспекте статика только названа в плане курса (стр. p01: «равновесие движения → Статика»). Подраздел составлен по вашей просьбе (20.10 и 22.10.2026) по материалам из интернета: момент силы и рычаг, рода и системы рычагов, блоки и полиспаст, наклонная плоскость и КПД, центр тяжести, виды равновесия, сложные задачи — всё помечено «из интернета» и ждёт проверки.'
  - id: fluids
    sectionId: mech
    title: Механика жидкостей и газов
    note: Давление, гидро- и аэростатика, движение жидкости в трубах. (В исходной классификации на этом месте стояла «Статика»; статика твёрдых тел теперь — отдельный подраздел, дополненный из интернета.)
  - id: cons
    sectionId: mech
    title: Законы сохранения
    note: Импульс, работа, энергия, мощность.
  - id: osc
    sectionId: mech
    title: Механические колебания и волны
    note: 'Из конспекта по магнетизму (стр. e09–e15). В исходной классификации ТЗ механические колебания входят в «Механику».'
  - id: mkt
    sectionId: thermo
    title: МКТ и идеальный газ
  - id: td
    sectionId: thermo
    title: Термодинамика
    note: Включает теплообмен и агрегатные состояния — в конспекте они идут после второго закона термодинамики.
  - id: sl
    sectionId: thermo
    title: Свойства твёрдых тел и жидкостей
  - id: estat
    sectionId: electro
    title: Электростатика
    note: Заряд, закон Кулона, поле и потенциал, работа поля, контакт заряженных тел (стр. c01–c13).
  - id: capac
    sectionId: electro
    title: Электроёмкость. Конденсаторы
    note: В конспекте входит в электростатику (стр. c13–c23); вынесено в отдельный подраздел, чтобы темы были короче.
  - id: dc
    sectionId: electro
    title: Постоянный электрический ток
    note: В конспекте — часть «Электродинамика» (стр. c19, c23–c35).
  - id: ecur
    sectionId: electro
    title: Электрический ток в различных средах
    note: Диэлектрики, металлы, электролиты, полупроводники (стр. c36–c40) и диод в цепи (стр. c40, e01).
  - id: mag
    sectionId: electro
    title: Магнитное поле
  - id: induct
    sectionId: electro
    title: Электромагнитная индукция
  - id: emw
    sectionId: electro
    title: Электромагнитные колебания и волны
    note: Колебательный контур, переменный ток, трансформатор, электромагнитные волны (стр. e20–e28) и радиоволны (стр. o01).
  - id: geo
    sectionId: optics
    title: Геометрическая оптика
    note: Прямолинейное распространение света, отражение, преломление, полное внутреннее отражение, плоское зеркало.
  - id: lens
    sectionId: optics
    title: Линзы и оптические системы
  - id: wave
    sectionId: optics
    title: Волновая оптика
    note: Интерференция, дифракция (тема записана на отдельных листах d01–d02, в тетради на стр. o07 только заголовок) и дисперсия.
  - id: rel
    sectionId: optics
    title: Элементы теории относительности
    note: В исходной классификации ТЗ места нет; в конспекте идёт сразу после дисперсии (20.03.25). Временно в разделе «Оптика» — можно перенести в «Структуре».
  - id: qphot
    sectionId: quantum
    title: Фотон и фотоэффект
  - id: atom
    sectionId: quantum
    title: Строение атома
    note: Модель Резерфорда и постулаты Бора (стр. a01–a02); второй постулат и уровни энергии водорода дописаны из интернета.
  - id: nucl
    sectionId: quantum
    title: Атомное ядро
    note: Нуклоны, массовое и зарядовое числа, изотопы, изобары, изотоны, энергия связи (стр. a03–a05).
  - id: radio
    sectionId: quantum
    title: Ядерные реакции и радиоактивность
    note: Частицы, ядерные реакции, виды распада, закон радиоактивного распада (стр. a06–a08); тема «Радиация» — из интернета.

