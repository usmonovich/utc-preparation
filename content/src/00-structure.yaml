  - id: konspekt-elec-2025
    title: Конспект по электричеству (тетрадь, 19.12.2024 – 11.02.2025)
    fileName: Электр.pdf
    kind: pdf-photo
    pdfPages: 41
    sha256: 17c272d171c2c90f3f5062ecb0151f13cf4284b451e52f61ab523c70eb91c1bd
    note: Фотографии рукописной тетради (Microsoft Lens), одна страница на лист (c01–c40; лист 41 — дубль стр. e01).
    pagePrefix: c
    notes:
      - Файл — 41 фотография страниц рукописной тетради, по одной странице на лист.
      - Текстового слоя нет; распознавание выполнено вручную по изображениям, формулы переписаны в LaTeX.
      - 'Лист 41 — та же фотография (совпадает пиксель в пиксель), что стр. e01 конспекта «Магнетизм» (окончание темы о диоде): она уже импортирована, повторно не добавлялась (защита от дублей). Начало темы о диоде — стр. c40.'
      - 'Конспект открывается планом курса электромагнетизма из пяти частей (стр. c01): электростатика, электродинамика, ток в различных средах, магнетизм, переменный ток. Первые три части — этот файл; подразделы «Электростатика», «Электроёмкость. Конденсаторы», «Постоянный электрический ток» и «Электрический ток в различных средах» стоят перед «Магнитным полем».'
      - 'Даты в тетради идут не строго по порядку: стр. c19 (11.01.25, начало темы о токе) стоит между конденсаторами (9.01.25) и методом потенциалов (14.01.25). Темы собраны по смыслу, у каждой записи сохранена ссылка на страницу.'
      - 'Готовых тестовых заданий в источнике нет; есть разобранные примеры (заряды шариков после соприкосновения, R = 9·10⁹ м для шара ёмкостью 1 Ф, смешанные соединения конденсаторов, ключ в схеме, лампочки в цепи). Все вопросы сгенерированы по конспекту и ждут проверки.'
      - 'Нечитаемых страниц нет. Стр. c25, c28 и c29 заполнены частично; на c28 фраза об амперметре не закончена, шунтирующее соединение не расписано.'
      - 'По вашей просьбе от 20.10.2026 пробелы заполнены из интернета: шунт и добавочное сопротивление (c28), формулы последовательного и параллельного соединения проводников (c27). Записи помечены «из интернета», все на проверке.'
  - id: konspekt-el-2025
