    pagePrefix: e
    notes:
      - Файл — 29 фотографий страниц рукописной тетради, по одной странице на лист.
      - 'Имя файла пришло в искажённом виде («_________.pdf», 9 символов); в базе оно записано как «Магнетизм.pdf» — так вы назвали файл в сообщении.'
      - Текстового слоя нет; распознавание выполнено вручную по изображениям, формулы переписаны в LaTeX.
      - 'Лист 29 — та же фотография (совпадает пиксель в пиксель), что стр. o01 конспекта «Оптика»: она уже импортирована, повторно не добавлялась (защита от дублей).'
      - 'Страница e01 начинается с окончания темы о диоде в цепи; начало темы нашлось на стр. c40 конспекта «Электричество» — тема объединена (стр. c40, e01).'
      - 'Механические колебания, волны и звук (стр. e09–e15) по исходной классификации ТЗ отнесены к разделу «Механика»; магнетизм, индукция, колебательный контур, переменный ток, трансформатор и электромагнитные волны — к «Электродинамике».'
      - 'Готовых тестовых заданий в источнике нет; несколько разобранных мини-примеров (диод, чтение уравнений колебаний, длина волны, скорость при фазе π/3). Все вопросы сгенерированы по конспекту и ждут проверки.'
      - 'К теории добавлены анимированные иллюстрации по рисункам конспекта (по вашей просьбе от 17.10.2026). Они не из конспекта, а поясняют его рисунки, и проверяются вместе с блоком теории.'
      - Нечитаемых страниц нет. Стр. e19 заполнена только сверху; на e24 два графика (C и L) не нарисованы; последняя фраза на e28 не закончена.
      - 'По вашей просьбе от 20.10.2026 пробелы заполнены из интернета: условие резонанса напряжений в цепи RLC (e26) и шкала электромагнитных волн (e28). Записи помечены «из интернета», все на проверке.'
