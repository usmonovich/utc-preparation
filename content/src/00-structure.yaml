      - 'По вашей просьбе от 20.10.2026 пробелы заполнены материалом из интернета: условие интерференционного минимума (o05); тема «Дифракция» сначала тоже была дополнена из интернета, а 22.10.2026 перестроена по присланным листам d01–d02. Такие записи помечены «из интернета», у каждой — ссылки на источники; все они на проверке.'
