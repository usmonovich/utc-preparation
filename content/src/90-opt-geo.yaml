subsection: geo

symbols:
  n_ref: { tex: 'n', meaning: 'показатель преломления среды', unit: '', src: o02 }
  n12: { tex: 'n_1,\ n_2', meaning: 'показатели преломления первой и второй среды', unit: '', src: o02 }
  n34: { tex: 'n_3,\ n_4', meaning: 'показатели преломления третьего и четвёртого слоёв', unit: '', src: o03 }
  alpha_inc: { tex: '\alpha', meaning: 'угол падения (от перпендикуляра к границе)', unit: '°', src: o02 }
  alpha_refl: { tex: '\alpha''', meaning: 'угол отражения', unit: '°', src: o02 }
  beta_refr: { tex: '\beta', meaning: 'угол преломления', unit: '°', src: o02 }
  gphi_layers: { tex: '\gamma,\ \varphi', meaning: 'углы луча в третьем и четвёртом слоях', unit: '°', src: o03 }
  v12_o: { tex: '\upsilon_1,\ \upsilon_2', meaning: 'скорости света в первой и второй среде', unit: 'м/с', src: o02 }
  lam12: { tex: '\lambda_1,\ \lambda_2', meaning: 'длины волн света в первой и второй среде', unit: 'м', src: o02 }
  nu12: { tex: '\nu_1,\ \nu_2', meaning: 'частоты света в первой и второй среде', unit: 'Гц', src: o02 }
  alpha0_tir: { tex: '\alpha_0', meaning: 'угол полного внутреннего отражения', unit: '°', src: o06 }
  a_mirror: { tex: 'a', meaning: 'расстояние от предмета (и от изображения) до зеркала', unit: 'м', src: o14 }

errata:
  - id: O03
    page: o03
    severity: note
    original: '\(\alpha \sim \frac1n\)'
    issue: 'Из \(\sin\alpha\cdot n = \text{const}\) следует \(\sin\alpha \sim \frac1n\). Сам угол убывает с ростом n, но не обратно пропорционально.'
    target: 'Связь угла и показателя преломления'
    suggestion: '\(\sin\alpha \sim \frac1n\): чем больше показатель преломления слоя, тем меньше угол луча в нём.'
  - id: O08
    page: o06
    severity: note
    original: '«Процесс полного внутреннего отражения происходит в случае, когда луч света переходит из среды с большим показателем в среду с меньшим»'
    issue: 'Условие неполное: при переходе в среду с меньшим показателем луч полностью отражается, только если угол падения не меньше \(\alpha_0\); при меньших углах луч преломляется.'
    target: 'Условие полного внутреннего отражения'
    suggestion: 'Дописать: «…и угол падения не меньше угла полного внутреннего отражения \(\alpha_0\), \(\sin\alpha_0 = \frac{n_2}{n_1}\)».'

topics:
  - id: opt-intro
    title: Оптика. Прямолинейное распространение света
    pages: [o01, o02]
    theory:
      - kind: definition
        title: Оптика
        body: Оптика — это раздел физики, который изучает физические процессы, связанные с распространением света.
        src: o01
      - kind: list
        title: Части оптики
        body: 'Оптика делится на три части: ① геометрическая оптика; ② волновая оптика; ③ физическая оптика.'
        src: o01
      - kind: rule
        title: Прямолинейное распространение света
        fig: shadow
        body: Луч света распространяется по прямой. За счёт этого возникает тень.
        src: o02
    questions:
      - type: single
        cat: theory
        q: Что изучает оптика?
        opts: ['Физические процессы, связанные с распространением света', 'Движение тел под действием сил', 'Тепловое движение молекул', 'Свойства электрических зарядов']
        ans: a
        hint: Определение — в конце стр. o01.
        explain: Оптика — это раздел физики, который изучает физические процессы, связанные с распространением света.
        src: o01
      - type: multiple
        cat: theory
        q: На какие части делится оптика по конспекту? Выберите все.
        opts: ['Геометрическая оптика', 'Волновая оптика', 'Физическая оптика', 'Молекулярная оптика', 'Механическая оптика']
        ans: [a, b, c]
        hint: В конспекте три пункта.
        explain: '① геометрическая, ② волновая, ③ физическая оптика.'
        src: o01
      - type: single
        cat: theory
        q: Почему за предметом возникает тень?
        opts: ['Луч света распространяется по прямой', 'Свет отражается от предмета под тем же углом', 'Свет преломляется на границе сред', 'У света есть волновые свойства']
        ans: a
        hint: Это первая фраза темы «Геометрическая оптика».
        explain: Луч света распространяется по прямой; за счёт этого возникает тень.
        src: o02
      - type: text
        cat: theory
        q: Дайте определение оптики.
        ref: Оптика — это раздел физики, который изучает физические процессы, связанные с распространением света.
        criteria: ['Сказано, что это раздел физики', 'Упомянуто распространение света']
        hint: '«Оптика — это раздел физики, который изучает…»'
        explain: Определение со стр. o01.
        src: o01

# ───────────────────────────────────────────────────────────────
  - id: opt-reflection
    title: Закон отражения
    pages: [o02]
    theory:
      - kind: law
        title: Закон отражения
        fig: reflection
        body: Когда луч света падает на плоскую поверхность, то отражается от неё, при этом угол падения равен углу отражения.
        src: o02
      - kind: text
        title: Рисунок к закону
        body: 'На рисунке углы падения $\alpha$ и отражения $\alpha''$ отсчитываются от перпендикуляра (пунктир) к поверхности; падающий и отражённый лучи лежат по разные стороны от него.'
        src: o02
    formulas:
      - title: Закон отражения
        tex: '\alpha'' = \alpha'
        sym: [alpha_refl, alpha_inc]
        boxed: true
        src: o02
    questions:
      - type: numeric
        cat: problem
        q: Угол между падающим и отражённым лучами равен 80°. Найдите угол падения.
        num: { value: 40, unit: '°', check: '80/2' }
        hint: Угол между лучами складывается из угла падения и угла отражения, а они равны.
        explain: '$\alpha + \alpha'' = 80°$ и $\alpha'' = \alpha$, поэтому $\alpha = 40°$.'
        f: [1]
        sol: { given: ['α + α′ = 80°'], find: 'α', formula: '\alpha'' = \alpha', calc: '2\alpha = 80° \Rightarrow \alpha = 40°', answer: '40°' }
        src: o02
      - type: numeric
        cat: problem
        q: Луч падает на плоское зеркало под углом 30° к поверхности зеркала. Найдите угол отражения.
        num: { value: 60, unit: '°', check: '90-30' }
        hint: Углы в законе отражения отсчитывают от перпендикуляра к поверхности, а не от самой поверхности.
        explain: 'Угол падения $\alpha = 90° - 30° = 60°$, угол отражения равен ему.'
        f: [1]
        sol: { given: ['угол с поверхностью 30°'], find: 'α′', formula: '\alpha'' = \alpha', calc: '\alpha = 90° - 30° = 60° \Rightarrow \alpha'' = 60°', answer: '60°' }
        src: o02
      - type: numeric
        cat: problem
        q: Угол падения увеличили с 20° до 35°. На сколько градусов увеличился угол между падающим и отражённым лучами?
        num: { value: 30, unit: '°', check: '2*(35-20)' }
        hint: Угол между лучами равен $2\alpha$.
        explain: 'Было $2\cdot20° = 40°$, стало $2\cdot35° = 70°$; разница 30°.'
        f: [1]
        sol: { given: ['α₁ = 20°', 'α₂ = 35°'], find: 'Δ(α + α′)', formula: '\alpha'' = \alpha', calc: '2\cdot35° - 2\cdot20° = 30°', answer: '30°' }
        src: o02
      - type: text
        cat: theory
        q: Сформулируйте закон отражения света.
        ref: Когда луч света падает на плоскую поверхность, то отражается от неё, при этом угол падения равен углу отражения.
        criteria: ['Упомянуто падение луча на поверхность и отражение', 'Сказано, что угол падения равен углу отражения']
        hint: Главное в законе — равенство двух углов.
        explain: 'Запись: $\alpha'' = \alpha$.'
        f: [1]
        src: o02

# ───────────────────────────────────────────────────────────────
  - id: opt-refraction
    title: Закон преломления
    pages: [o02, o03]
    theory:
      - kind: definition
        title: Преломление света
        body: Преломление света происходит, когда луч света переходит из одной среды в другую, то есть пересекает границу раздела двух сред.
        src: o02
      - kind: law
        title: Закон Снеллиуса
        fig: refraction
        body: 'Отношение синуса угла падения к синусу угла преломления равно отношению показателей преломления второй и первой среды: $\frac{\sin\alpha}{\sin\beta} = \frac{n_2}{n_1}$.'
        src: o02
      - kind: rule
        title: Что меняется при переходе в другую среду
        body: 'Скорость света в среде $\upsilon = \frac cn$. При переходе в другую среду меняются скорость и длина волны: $\frac{\upsilon_1}{\upsilon_2} = \frac{\lambda_1}{\lambda_2} = \frac{n_2}{n_1}$, а частота остаётся постоянной: $\nu_1 = \nu_2 = \text{const}$.'
        src: o02
      - kind: rule
        title: Луч проходит несколько слоёв
        body: 'Закон преломления записывается для каждой границы, и произведения складываются в цепочку: $\sin\alpha\cdot n_1 = \sin\beta\cdot n_2 = \dots = \sin\varphi\cdot n_4$, то есть $\sin\alpha\cdot n = \text{const}$. Чем больше показатель преломления слоя, тем меньше угол луча в нём. На рисунке $\varphi > \gamma > \alpha > \beta$, поэтому $n_4 < n_3 < n_1 < n_2$.'
        src: o03
        errata: [O03]
    formulas:
      - title: Закон Снеллиуса
        tex: '\frac{\sin\alpha}{\sin\beta} = \frac{n_2}{n_1}'
        sym: [alpha_inc, beta_refr, n12]
        boxed: true
        src: o02
      - title: Скорость света в среде
        tex: '\upsilon_1 = \frac{c}{n_1},\qquad \upsilon_2 = \frac{c}{n_2}'
        sym: [v12_o, c_light, n12]
        src: o02
      - title: Отношение скоростей
        tex: '\frac{\upsilon_1}{\upsilon_2} = \frac{n_2}{n_1}'
        sym: [v12_o, n12]
        boxed: true
        src: o02
      - title: Отношение длин волн
        tex: '\frac{\lambda_1}{\lambda_2} = \frac{n_2}{n_1}'
        sym: [lam12, n12]
        boxed: true
        src: o02
      - title: Частота не меняется
        tex: '\nu_1 = \nu_2 = \text{const}'
        sym: [nu12]
        src: o02
      - title: Скорости через углы
        tex: '\frac{\upsilon_1}{\upsilon_2} = \frac{\sin\alpha}{\sin\beta}'
        sym: [v12_o, alpha_inc, beta_refr]
        src: o02
      - title: Длины волн через углы
        tex: '\frac{\lambda_1}{\lambda_2} = \frac{\sin\alpha}{\sin\beta}'
        sym: [lam12, alpha_inc, beta_refr]
        src: o02
      - title: Преломление в нескольких слоях
        tex: '\sin\alpha\cdot n_1 = \sin\beta\cdot n_2 = \dots = \sin\varphi\cdot n_4'
        sym: [alpha_inc, beta_refr, gphi_layers, n12, n34]
        boxed: true
        src: o03
      - title: Инвариант преломления
        tex: '\sin\alpha\cdot n = \text{const}'
        sym: [alpha_inc, n_ref]
        boxed: true
        src: o03
    questions:
      - type: numeric
        cat: problem
        q: 'Луч переходит из воздуха ($n_1 = 1$) в стекло ($n_2 = 1{,}5$), синус угла падения 0,6. Найдите синус угла преломления.'
        num: { value: 0.4, unit: '', check: '0.6*1/1.5' }
        hint: '$\frac{\sin\alpha}{\sin\beta} = \frac{n_2}{n_1}$ ⇒ $\sin\beta = \frac{n_1\sin\alpha}{n_2}$.'
        explain: '$\sin\beta = \frac{1\cdot0{,}6}{1{,}5} = 0{,}4$.'
        f: [1]
        sol: { given: ['n₁ = 1', 'n₂ = 1,5', 'sin α = 0,6'], find: 'sin β', formula: '\sin\beta = \frac{n_1\sin\alpha}{n_2}', calc: '\sin\beta = \frac{1\cdot0{,}6}{1{,}5} = 0{,}4', answer: '0,4' }
        src: o02
      - type: numeric
        cat: problem
        q: 'Найдите скорость света в среде с показателем преломления $n = 1{,}5$ ($c = 3\cdot10^8$ м/с).'
        num: { value: 2.0e8, unit: 'м/с', check: '3e8/1.5' }
        hint: '$\upsilon = \frac cn$.'
        explain: 'Скорость света в среде в $n$ раз меньше, чем в вакууме.'
        f: [2]
        sol: { given: ['n = 1,5', 'c = 3·10⁸ м/с'], find: 'υ', formula: '\upsilon = \frac{c}{n}', calc: '\upsilon = \frac{3\cdot10^8}{1{,}5} = 2\cdot10^8', answer: '2·10⁸ м/с' }
        src: o02
      - type: numeric
        cat: problem
        q: 'Свет с длиной волны 600 нм переходит из воздуха ($n_1 = 1$) в стекло ($n_2 = 1{,}5$). Найдите длину волны в стекле (в нм).'
        num: { value: 400, unit: 'нм', check: '600*1/1.5' }
        hint: '$\frac{\lambda_1}{\lambda_2} = \frac{n_2}{n_1}$.'
        explain: '$\lambda_2 = \lambda_1\frac{n_1}{n_2} = 600\cdot\frac{1}{1{,}5} = 400$ нм; частота при этом не меняется.'
        f: [4]
        sol: { given: ['λ₁ = 600 нм', 'n₁ = 1', 'n₂ = 1,5'], find: 'λ₂', formula: '\lambda_2 = \lambda_1\frac{n_1}{n_2}', calc: '\lambda_2 = 600\cdot\frac{1}{1{,}5} = 400', answer: '400 нм' }
        src: o02
      - type: numeric
        cat: problem
        q: 'Свет переходит из среды с $n_1 = 1{,}2$ в среду с $n_2 = 1{,}8$. Во сколько раз скорость света в первой среде больше, чем во второй?'
        num: { value: 1.5, unit: '', check: '1.8/1.2' }
        hint: '$\frac{\upsilon_1}{\upsilon_2} = \frac{n_2}{n_1}$.'
        explain: '$\frac{\upsilon_1}{\upsilon_2} = \frac{1{,}8}{1{,}2} = 1{,}5$.'
        f: [3]
        sol: { given: ['n₁ = 1,2', 'n₂ = 1,8'], find: 'υ₁/υ₂', formula: '\frac{\upsilon_1}{\upsilon_2} = \frac{n_2}{n_1}', calc: '\frac{1{,}8}{1{,}2} = 1{,}5', answer: 'в 1,5 раза' }
        src: o02
      - type: numeric
        cat: problem
        q: 'Луч проходит несколько слоёв. В первом слое ($n_1 = 1{,}5$) синус угла равен 0,4. Найдите синус угла в последнем слое с $n_4 = 1{,}2$.'
        num: { value: 0.5, unit: '', check: '0.4*1.5/1.2' }
        hint: '$\sin\alpha\cdot n_1 = \sin\varphi\cdot n_4$ — промежуточные слои не нужны.'
        explain: '$\sin\varphi = \frac{\sin\alpha\cdot n_1}{n_4} = \frac{0{,}4\cdot1{,}5}{1{,}2} = 0{,}5$.'
        f: [8]
        sol: { given: ['n₁ = 1,5', 'sin α = 0,4', 'n₄ = 1,2'], find: 'sin φ', formula: '\sin\alpha\cdot n_1 = \sin\varphi\cdot n_4', calc: '\sin\varphi = \frac{0{,}4\cdot1{,}5}{1{,}2} = 0{,}5', answer: '0,5' }
        src: o03
      - type: single
        cat: theory
        q: Какая характеристика света не меняется при переходе из одной среды в другую?
        opts: ['Частота', 'Скорость', 'Длина волны', 'Направление луча']
        ans: a
        hint: 'В конспекте: $\nu_1 = \nu_2 = \text{const}$.'
        explain: 'Скорость и длина волны меняются ($\frac{\upsilon_1}{\upsilon_2} = \frac{\lambda_1}{\lambda_2} = \frac{n_2}{n_1}$), а частота остаётся постоянной.'
        f: [5]
        src: o02
      - type: single
        cat: formula
        q: Луч переходит в среду с большим показателем преломления. Каким будет угол преломления?
        opts: ['Меньше угла падения', 'Больше угла падения', 'Равен углу падения', 'Всегда 90°']
        ans: a
        hint: '$\sin\alpha\cdot n = \text{const}$: где n больше, там синус угла меньше.'
        explain: 'Из $\sin\alpha\cdot n_1 = \sin\beta\cdot n_2$ при $n_2 > n_1$ получаем $\sin\beta < \sin\alpha$, то есть $\beta < \alpha$.'
        f: [9]
        src: o03
      - type: single
        cat: theory
        q: 'На рисунке конспекта углы в четырёх слоях: $\varphi > \gamma > \alpha > \beta$. Какое соотношение показателей преломления?'
        opts: ['$n_4 < n_3 < n_1 < n_2$', '$n_1 < n_2 < n_3 < n_4$', '$n_2 < n_1 < n_3 < n_4$', '$n_4 > n_3 > n_1 > n_2$']
        ans: a
        hint: Чем больше угол луча в слое, тем меньше показатель преломления этого слоя.
        explain: 'Порядок показателей обратный порядку углов: $n_4 < n_3 < n_1 < n_2$.'
        f: [9]
        src: o03
      - type: text
        cat: theory
        q: Когда происходит преломление света?
        ref: Преломление света происходит, когда луч света переходит из одной среды в другую, то есть пересекает границу раздела двух сред.
        criteria: ['Сказано о переходе из одной среды в другую', 'Упомянута граница раздела двух сред']
        hint: Подумайте о границе двух сред.
        explain: Определение со стр. o02.
        src: o02

# ───────────────────────────────────────────────────────────────
  - id: opt-tir
    title: Полное внутреннее отражение
    pages: [o06]
    theory:
      - kind: definition
        title: Полное внутреннее отражение
        body: Процесс полного внутреннего отражения происходит в случае, когда луч света переходит из среды с бо́льшим показателем преломления в среду с меньшим.
        src: o06
        errata: [O08]
      - kind: text
        title: Угол полного внутреннего отражения
        fig: tir
        body: 'На рисунке луч падает под углом $\alpha_0$, а преломлённый луч идёт вдоль границы сред. Из закона преломления $\frac{\sin\alpha_0}{\sin\beta} = \frac{n_2}{n_1}$ в конспекте получено $\sin\alpha_0 = \frac{n_2}{n_1}$. $\alpha_0$ — угол полного внутреннего отражения.'
        src: o06
    formulas:
      - title: Закон преломления для угла α₀
        tex: '\frac{\sin\alpha_0}{\sin\beta} = \frac{n_2}{n_1}'
        sym: [alpha0_tir, beta_refr, n12]
        src: o06
      - title: Угол полного внутреннего отражения
        tex: '\sin\alpha_0 = \frac{n_2}{n_1}'
        sym: [alpha0_tir, n12]
        boxed: true
        src: o06
    questions:
      - type: numeric
        cat: problem
        q: 'Луч идёт из среды с $n_1 = 2$ в среду с $n_2 = 1$. Найдите угол полного внутреннего отражения (в градусах).'
        num: { value: 30, unit: '°', check: 'Math.asin(1/2)*180/Math.PI' }
        hint: '$\sin\alpha_0 = \frac{n_2}{n_1}$; вспомните, у какого угла синус равен 0,5.'
        explain: '$\sin\alpha_0 = \frac12$ ⇒ $\alpha_0 = 30°$.'
        f: [2]
        sol: { given: ['n₁ = 2', 'n₂ = 1'], find: 'α₀', formula: '\sin\alpha_0 = \frac{n_2}{n_1}', calc: '\sin\alpha_0 = \frac{1}{2} \Rightarrow \alpha_0 = 30°', answer: '30°' }
        src: o06
      - type: numeric
        cat: problem
        q: 'Найдите синус угла полного внутреннего отражения на границе стекло ($n_1 = 1{,}5$) — воздух ($n_2 = 1$).'
        num: { value: 0.667, unit: '', check: '1/1.5' }
        hint: '$\sin\alpha_0 = \frac{n_2}{n_1}$.'
        explain: '$\sin\alpha_0 = \frac{1}{1{,}5} \approx 0{,}67$.'
        f: [2]
        sol: { given: ['n₁ = 1,5', 'n₂ = 1'], find: 'sin α₀', formula: '\sin\alpha_0 = \frac{n_2}{n_1}', calc: '\sin\alpha_0 = \frac{1}{1{,}5} \approx 0{,}667', answer: '≈ 0,67' }
        src: o06
