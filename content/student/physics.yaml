# Вид для студентов: тексты записей без замечаний к конспекту.
#
# Исходные записи (как в конспекте, со ссылками на замечания) не меняются — они остаются в content/src/*.yaml
# и видны администратору в админ-панели вместе с карточками замечаний. Здесь — только то, что видит студент:
#   • замечание с решением «принять исправление» — сразу исправленный текст, без пометок;
#   • замечание с решением «оставить как в конспекте» — текст конспекта, без пометок;
#   • служебные заметки («Замечание к странице…», «Почему тема дополнена», «запись не закончена») — скрыты (hide: true).
# Изменённая запись снова попадает на проверку: текст для студентов входит в хеш содержимого.
#
# Поля: теория — title, body, hide; формулы — title, tex; примеры — title, given, steps, answer;
# вопросы — prompt, hints, explanation, reference. Обозначения (symbols) — meaning, tex.

records:
  # ───── Кинематика ─────
  kin-vectors-t3:
    body: 'Метод треугольника: $\vec c = \vec a - \vec b$. Вектор разности $\vec c$ направлен от конца $\vec b$ к концу $\vec a$ — в сторону уменьшаемого.'
  kin-vectors-t4:
    body: |-
      ① Скорость лодки $\upsilon_{\text{л}}$ направлена перпендикулярно берегу: лодку сносит течением на $l$.
      ② Переправа через минимальное расстояние: снос $l = 0$, возможна при $\upsilon_{\text{л}} > \upsilon_{\text{т}}$.
      Индексы: л — лодка (скорость лодки относительно воды), т — течение, р — результирующая скорость лодки относительно берега.
  kin-fall-down-t1:
    body: '$g$ — ускорение свободного падения. $g = 9{,}81$ м/с² — для Парижа; $g = 9{,}78 \div 9{,}83$ м/с² (на экваторе … на полюсах); в расчётах $g = 10$ м/с². Вектор $\vec g$ направлен вниз, к поверхности Земли.'
  kin-angle-t2:
    title: Ускорения и модуль скорости
    body: 'По горизонтали ускорения нет, по вертикали действует ускорение свободного падения: $a_x = 0$; $a_y = -g$ (ось y направлена вверх). Модуль скорости: $\upsilon = \sqrt{\upsilon_x^2 + \upsilon_y^2}$.'
  kin-path-accel-t2: { hide: true }
  kin-circle-f11:
    title: Формула из рамки конспекта
  kin-equation-accel-e2:
    answer: 'S = 24 м; S₃ = 5 м.'
  kin-equation-accel-q2:
    explanation: 'Пункт ⑤ примера со стр. 7L: $S = 10\cdot4 - \frac{2\cdot16}{2} = 24$ м.'

  # ───── Статика ─────
  st-moment-t1: { hide: true }
  st-incline-t5: { hide: true }

  # ───── Динамика ─────
  dyn-satellites-t1:
    body: 'Когда тело движется у поверхности Земли с первой космической скоростью, оно движется по круговой орбите и находится в невесомости. Условие: сила притяжения равна центробежной, $F_{\text{з}} = F_{{\text{цб}}}$.'
  dyn-satellites-t3:
    title: Частота обращения на высоте h
    body: 'Так как $T_{Ih} > T_I$ и $\nu = \frac1T$, то $\nu_{Ih} < \nu_I$: спутник на высоте h обращается реже. Для любой планеты $\upsilon_{I{\text{пл}}} = \sqrt{G\frac{M_{{\text{пл}}}}{R_{{\text{пл}}}}}$.'
  dyn-satellites-f4:
    title: Для любых планет
    tex: '\upsilon_{I{\text{пл}}} = \sqrt{G\frac{M_{{\text{пл}}}}{R_{{\text{пл}}}}}'
  dyn-satellites-e1:
    steps:
      - '$\upsilon = \sqrt{6{,}67\cdot10^{-11}\cdot\frac{6\cdot10^{24}}{6{,}4\cdot10^6}} \approx 7905$ м/с $= 7{,}9$ км/с'
  dyn-weight-t1:
    body: 'Ускорение направлено вверх ($\vec a\uparrow\downarrow\vec g$, $\varphi = 180°$, $\cos180° = -1$). Лифт с ускорением вверх: движется вверх равноускоренно (когда только начал движение) или вниз равнозамедленно (тормозит перед остановкой).'
  dyn-equation-t3:
    title: Вертикальная цепочка из пяти тел
    body: 'Для пятого (нижнего) тела: $m_5 a = T_4 + m_5 g$, то есть $m_5(a - g) = T_4$.'
  dyn-friction-t1:
    body: 'Сила трения возникает между плоскостью и площадью тела, которой оно касается плоскости. Трение зависит от материала плоскости, от площади и от шероховатости. $\mu$ — коэффициент трения; при гладкой поверхности $\mu = 0$.'
  dyn-friction-t5:
    body: 'Груз удерживается силой трения покоя: $F_{{\text{т.п}}} = F_{\text{и}}$.'
  dyn-drag-t2:
    body: |-
      ① $F_{\text{с}} = \text{const}$.
      ② $F_{\text{с}} \sim \upsilon$: $F_{\text{с}} = -k\upsilon$.
      ③ $F_{\text{с}} \sim \upsilon^2$: $F_{\text{с}} = -k\upsilon^2$.
      ④ $F_{\text{с}} \sim \upsilon^3$ и $F_{\text{с}} \sim S$: $F_{\text{с}} = -kS\upsilon^3$.

  # ───── Жидкости и газы ─────
  fl-atmospheric-t2:
    body: 'Значение атмосферного давления первым измерил итальянский учёный Торричелли с помощью опыта. В своём опыте Торричелли, наполнив трубку, которая закрыта с одного конца, опустил её открытым концом в сосуд, который был наполнен той же жидкостью. Для ртути высота столба — 760 мм; для воды — 10,3 м, для керосина — 12,8 м.'
  fl-atmospheric-t5:
    body: '1 атм $= 10^5$ Па $= 100$ кПа; 1 мм рт. ст. $= 133{,}3$ Па; 1 атм $= 760$ мм рт. ст.'
  fl-atmospheric-t6:
    title: Плотность керосина
    body: 'Плотность керосина — около 800 кг/м³ (780–850 кг/м³ при 20 °C). Тогда высота столба $h = \frac{p_{{\text{атм}}}}{\rho g} = \frac{101\,396}{800\cdot9{,}81} \approx 12{,}9$ м ≈ 12,8 м.'
  fl-floating-t3:
    title: Доля погружённого объёма
    body: 'Для тела, которое свободно плавает на поверхности ($\rho_{\text{т}} < \rho_{\text{ж}}$): $k = \frac{\rho_{\text{т}}}{\rho_{\text{ж}}}$. Значит, $k \sim \rho_{\text{т}}$ и $k \sim \frac{1}{\rho_{\text{ж}}}$.'
  fl-floating-f2:
    title: Погружённая часть свободно плавающего тела

  # ───── Законы сохранения ─────
  cons-work-t2:
    body: |-
      ① $0° \le \alpha < 90°$: $\cos\alpha > 0$, $A > 0$.
      ② $\alpha = 90°$: $\cos\alpha = 0$, $A = 0$ (примеры — $F_{{\text{цб}}}$ и сила реакции опоры N: обе перпендикулярны перемещению).
      ③ $90° < \alpha \le 180°$: $\cos\alpha < 0$, $A < 0$ (примеры — сила трения $F_{{\text{тр}}}$, сила сопротивления $F_{\text{с}}$).
  cons-potential-t4:
    title: Работа внешней силы и силы упругости
    body: '$A_{{\text{внеш}}} = \frac k2(\Delta l_2^2 - \Delta l_1^2)$ — работа внешней силы, растягивающей пружину; $A_{{\text{упр}}} = \frac k2(\Delta l_1^2 - \Delta l_2^2)$ — работа силы упругости. Они равны по модулю и противоположны по знаку.'
  cons-potential-f6:
    tex: 'A_{01} = W_{{\text{п}}1} - W_{{\text{п}}0} = \frac{k\Delta l_1^2}{2},\qquad A_{{\text{упр}}} = \frac{k}{2}\left(\Delta l_1^2 - \Delta l_2^2\right) = -A_{{\text{внеш}}}'
  cons-power-t3:
    body: 'Формула КПД электрочайника: $\eta = \frac{cm\Delta t}{I^2Rt}\cdot100\%$. Здесь $cm\Delta t$ — теплота, ушедшая на нагрев (c — удельная теплоёмкость, Δt — изменение температуры), $I^2Rt$ — теплота, выделенная током по закону Джоуля–Ленца (I — сила тока, R — сопротивление, t — время). КПД показывает, какая доля теплоты тока ушла на нагрев.'

  # ───── Колебания и волны ─────
  mosc-eq-f9:
    title: Ускорение через наибольшее ускорение
    tex: 'a(t) = -a_{max}\cos(\omega t)'
  mosc-eq-e1:
    given: 'Скорость меняется по закону $\upsilon = 4\cos\left(\frac{\pi}{5} + \frac{\pi}{8}t\right)$; найти υ при фазе $\frac\pi3$'
  waves-t2:
    body: 'Если направление распространения волны и плоскость колебания волны перпендикулярны, то эта волна называется поперечной. Электромагнитные волны — поперечные; волны на поверхности воды — особый случай: частицы воды движутся и вверх-вниз, и вперёд-назад. На рисунке конспекта волна идёт вправо: точки перед гребнем движутся вверх, за гребнем — вниз.'
  waves-t5:
    body: 'Внутри вещества механические поперечные волны распространяются только в твёрдых телах; волны на поверхности воды — особый случай. Механические продольные волны распространяются во всех средах.'
  waves-q8:
    explanation: 'Механические продольные волны распространяются во всех средах; поперечные внутри вещества — только в твёрдых телах.'
  sound-t3:
    body: 'Скорость распространения и длина волны звука зависят от среды, а частота не зависит. Чем плотнее среда, тем с большей скоростью распространяется звук. Например: воздух — 340 м/с, вода — около 1450–1500 м/с (зависит от температуры), металлы — 5000 м/с.'

  # ───── Молекулярная физика и термодинамика ─────
  mol-basics-f3:
    tex: 'N_A = 6{,}022\cdot10^{23}\ \text{моль}^{-1},\qquad N_A \approx 6\cdot10^{23}\ \text{моль}^{-1}'
  mol-mkt-t2:
    body: 'Броуновское движение — беспорядочное движение мелких частиц, взвешенных в жидкости или газе, под ударами молекул.'
  mol-eq-t3:
    body: '$\overline{\upsilon^2}$ — среднеквадратичная скорость — и $\bar\upsilon^2$ — квадрат средней скорости — разные величины: $\overline{\upsilon^2} \ne \bar\upsilon^2$.'
  mol-eq-f5:
    title: Квадрат средней скорости
    tex: '\bar\upsilon^2 = \left(\frac{\upsilon_1 + \upsilon_2 + \dots + \upsilon_N}{N}\right)^2'
  mol-eq-f9:
    title: Формула из рамки конспекта
  mol-mk-t3:
    body: '$\nu = \text{const}$ — закрытая система; тогда $\frac{pV}{T} = \nu R = \text{const}$. $\nu \ne \text{const}$ — открытый сосуд: газ может выходить или входить.'
  td-u-f2:
    title: Для одноатомного идеального газа
  td-u-t4:
    body: 'В открытом сосуде при p = const и V = const: при нагревании (T↑) газ выходит (ν↓), а $U = \text{const}$; при охлаждении (T↓) газ входит (ν↑), $U = \text{const}$.'
  td-second-q1:
    explanation: 'I — излучение, II — конвекция, III — теплообмен.'
  sl-elastic-t2:
    body: |-
      На графике $F(\Delta l)$:
      - 0–1 — закон Гука (прямая пропорциональность);
      - 1–2 — резкое понижение жёсткости;
      - 3 — предел прочности (наибольшее напряжение перед разрушением);
      - 4 — точка разрыва.
  sl-elastic-f3:
    title: Относительная деформация
    tex: '\varepsilon = \frac{\Delta l}{l_0}\cdot100\%'

  # ───── Электростатика и конденсаторы ─────
  es-coulomb-t2:
    body: '$k = 9\cdot10^9\ \frac{{\text{Н}}\cdot {\text{м}}^2}{{\text{Кл}}^2}$ — коэффициент пропорциональности, постоянная Кулона; $k = \frac{1}{4\pi\varepsilon_0}$, где $\varepsilon_0 = 8{,}85\cdot10^{-12}$ Ф/м — электрическая постоянная. ε — диэлектрическая проницаемость среды; для воздуха и вакуума $\varepsilon = 1$.'
  es-coulomb-q10:
    explanation: 'k — постоянная Кулона, $\varepsilon_0$ — электрическая постоянная, ε — диэлектрическая проницаемость среды, r — расстояние между зарядами (стр. c03 и c14).'
  es-field-f1:
    tex: 'E = k\frac{|q|}{R^2}'
  es-sphere-t2:
    body: 'Поверхностная плотность заряда — это заряд единицы площади тела: $\sigma = \frac qS$ [Кл/м²].'
  es-sphere-t4:
    body: 'В однородном поле напряжённость не зависит от расстояния — во всех точках она одинакова ($E_A = E_B = E_C = E_D$). Силовые линии однородного поля параллельны друг другу. Источник однородного поля — равномерно заряженная бесконечная плоскость: $E = \frac{\sigma}{2\varepsilon_0}$; между пластинами конденсатора $E = \frac{\sigma}{\varepsilon_0}$.'
  es-energy-t3:
    body: 'Для трёх зарядов в вершинах треугольника со сторонами a, b, c энергии всех пар складываются: $W_{{\text{общ}}} = W_{1-2} + W_{2-3} + W_{1-3} = k\frac{q_1q_2}{a} + k\frac{q_2q_3}{b} + k\frac{q_1q_3}{c}$. Число пар у n зарядов: $C_n^2 = \frac{n(n-1)}{2}$.'
  es-energy-f3:
    title: Число пар зарядов
    tex: 'C_n^2 = \frac{n(n-1)}{2}'
  es-energy-q4:
    prompt: 'Сколько пар взаимодействия у системы из 4 зарядов?'
    explanation: '$\frac{4\cdot3}{2} = 6$ пар.'
  es-potential-t3:
    body: 'Объединение точек с одинаковым значением потенциала называется эквипотенциальной поверхностью. У точечного заряда это концентрические сферы: на одной сфере $\varphi_A = \varphi_B = \varphi_C$, на другой $\varphi_D = \varphi_E = \varphi_F$; у однородного поля — параллельные плоскости.'
  es-potential-q8:
    explanation: 'У точечного заряда эквипотенциальные поверхности — концентрические сферы.'
  cap-connect-t1:
    body: 'Существует три вида соединения: последовательное, параллельное и смешанное. Два элемента соединены последовательно, если к «выходу» первого присоединён только «вход» другого: заряд без выбора проходит с первого на второй конденсатор. $U = U_1 + U_2 + \dots + U_n$, $q_{{\text{об}}} = q_1 = q_2 = \dots = q_n$, $C_{{\text{об}}} = \left(\frac1{C_1} + \dots + \frac1{C_n}\right)^{-1}$; для n одинаковых $C_{{\text{об}}} = \frac Cn$. Общая ёмкость меньше наименьшей из ёмкостей.'
  cap-connect-f3:
    title: Общая ёмкость последовательного соединения
    tex: 'C_{{\text{об}}} < \min(C_1,\ C_2,\ \dots,\ C_n)'
  cap-connect-q11:
    hints: ['Найдите общую ёмкость двух конденсаторов 2 мкФ и 3 мкФ.']
    explanation: 'Например, 2 мкФ и 3 мкФ дают 1,2 мкФ — меньше наименьшей из ёмкостей.'
  cap-potmethod-t1:
    body: 'Узлы схемы нумеруют: точки, соединённые проводом, получают одинаковый номер (одинаковый потенциал). Конденсаторы с одинаковыми номерами по бокам соединены параллельно. Конденсатор, у которого с обеих сторон один и тот же номер, не работает: потенциалы равны, U = 0, значит, заряд $q = CU = 0$ — конденсатор не заряжается, и его можно убрать из схемы.'
  cap-potmethod-q4:
    explanation: 'U = 0, значит $q = CU = 0$ — конденсатор не заряжается.'
  cap-potmethod-q6:
    explanation: 'U = 0, поэтому $q = CU = 0$. Ёмкость от напряжения не зависит.'

  # ───── Постоянный ток и ток в средах ─────
  dc-bridge-t1:
    body: 'Сверху резисторы $R_1$ и $R_2$, снизу $R_3$ и $R_4$, между средними точками — $R_5$. В такой схеме нет ни параллельного, ни последовательного соединения.'
  dc-emf-t1:
    body: 'ЭДС — работа сторонних сил по перемещению единичного положительного заряда по всей замкнутой цепи: $\varepsilon = \frac Aq$ [В] = [Дж/Кл].'
  dc-sources-t2:
    body: 'а) Правильное: $r_{{\text{об}}} = \left(\frac1{r_1} + \frac1{r_2} + \dots + \frac1{r_n}\right)^{-1}$, $\varepsilon_{{\text{об}}} = \left(\frac{\varepsilon_1}{r_1} + \frac{\varepsilon_2}{r_2} + \dots + \frac{\varepsilon_n}{r_n}\right)r_{{\text{об}}}$, токи короткого замыкания складываются: $I_{max\,{\text{об}}} = I_{max1} + \dots + I_{max\,n}$. N одинаковых: $r_{{\text{об}}} = \frac rN$, $\varepsilon_{{\text{об}}} = \varepsilon$. б) Неправильное: $r_{{\text{об}}}$ — по той же формуле, а слагаемое $\frac{\varepsilon_i}{r_i}$ перевёрнутого источника берётся с минусом.'
  dc-sources-f7:
    title: Параллельно, один источник наоборот
    tex: 'r_{{\text{об}}} = \left(\frac{1}{r_1} + \frac{1}{r_2} + \dots + \frac{1}{r_n}\right)^{-1},\qquad \varepsilon_{{\text{об}}} = \left(\frac{\varepsilon_1}{r_1} - \frac{\varepsilon_2}{r_2} + \dots + \frac{\varepsilon_n}{r_n}\right)\cdot r_{{\text{об}}}'
  dc-connect-t1: { hide: true }
  dc-meters-t5: { hide: true }
  dc-meters-t6:
    body: |-
      - **Шунт** — резистор с малым сопротивлением, который подключают **параллельно** амперметру. Большая часть тока идёт через шунт, через прибор — только известная малая доля. Чтобы увеличить предел измерения в n раз, нужен шунт $R_{\text{ш}} = \frac{R_A}{n - 1}$.
      - **Добавочное сопротивление** подключают **последовательно** с вольтметром. Чтобы увеличить предел измерения напряжения в n раз, нужно $R_{\text{д}} = R_V(n - 1)$.
  med-metals-t2:
    body: 'Из опытов Мандельштама и Папалекси, Толмена и Стюарта известно, что носителями электрического тока в металлах являются свободные электроны.'
  med-electrolyte-t1:
    body: 'Жидкость проводит ток, если это жидкий металл или электролит. Электролиты — это жидкости с ионными примесями. Ион — частица, которая потеряла своего противоположно заряженного напарника: в NaCl натрий отдаёт электрон хлору, получаются Na⁺ ($q = +e$) и Cl⁻ ($q = -e$). Ион с зарядом 3+ имеет заряд $+3e$: например, Ag⁺ — $q = +e$, Al³⁺ — $q = +3e$.'
  med-electrolyte-t4:
    body: 'Электрохимический эквивалент пропорционален химическому эквиваленту: $k = \frac1F\cdot\frac Az$, где $F = 96\,500$ Кл/моль — постоянная Фарадея, A — молярная масса в кг/моль (число из таблицы Менделеева, делённое на 1000), z — валентность.'
  el-diode-t1: { hide: true }

  # ───── Магнетизм, индукция, переменный ток ─────
  mag-basics-q4:
    explanation: 'Магнитное поле всегда замкнуто; одностороннего магнитного поля не существует.'
  mag-basics-q8:
    explanation: 'Запись со стр. e01.'
  mag-HB-t1:
    body: 'Направление и значение магнитного поля характеризуются напряжённостью магнитного поля $\vec H$ [А/м] и вектором магнитной индукции $\vec B$ [Тл] (тесла). Связь: $\vec B = \mu\mu_0\vec H$.'
  mag-HB-f1:
    tex: '\vec B = \mu\mu_0\vec H'
  mag-ampere-q9:
    explanation: 'Правило со стр. e05.'
  ind-self-t5:
    body: '$W = \frac{LI^2}{2}$, $W = \frac{\Phi I}{2}$, $W = \frac{\Phi^2}{2L}$. Работа $A = I(\Phi_2 - \Phi_1)$. Плотность энергии магнитного поля $w = \frac{\mu\mu_0}{2}H^2$.'
  ind-self-f8:
    title: Энергия через поток
    tex: 'W = \frac{\Phi^2}{2L}'
  ac-basics-q10:
    explanation: 'По графику R от частоты не зависит.'
  ac-rlc-t3:
    body: '$U_R = I_RR$, $U_C = I_CX_C$, $U_L = I_LX_L$, $U = IZ$, где $Z = \sqrt{(X_L - X_C)^2 + R^2}$ — полное сопротивление. $\operatorname{tg}\Delta\varphi = \frac{|X_L - X_C|}{R}$, $\cos\Delta\varphi = \frac RZ$ — коэффициент мощности.'
  ac-rlc-f5:
    title: Полное сопротивление
    tex: 'Z = \sqrt{(X_L - X_C)^2 + R^2}'
  ac-resonance-t2:
    body: 'Когда частота вынуждающей силы принимает близкое значение к собственной частоте системы, в системе возникает резонанс. В резонансе амплитуда колебаний резко возрастает.'
  ac-resonance-t3: { hide: true }
  ac-resonance-t4:
    body: |-
      - Резонанс наступает, когда индуктивное сопротивление равно ёмкостному: $X_L = X_C$, то есть $\omega_0L = \frac{1}{\omega_0C}$. Отсюда резонансная частота $\omega_0 = \frac{1}{\sqrt{LC}}$ — та же, что собственная частота контура (стр. e20).
      - Полное сопротивление при этом наименьшее и равно активному: $Z = R$, а сила тока наибольшая: $I = \frac UR$. Ток и напряжение совпадают по фазе.
      - Напряжения на катушке и конденсаторе равны между собой и при малом R могут во много раз превысить напряжение источника — поэтому этот резонанс называют резонансом напряжений.
  ac-resonance-q4:
    explanation: 'Определение со стр. e26.'
    reference: 'Когда частота вынуждающей силы принимает близкое значение к собственной частоте системы, в системе возникает резонанс; при этом амплитуда колебаний резко возрастает.'

  # ───── Электромагнитные волны ─────
  em-waves-t2:
    body: 'Не распространяет электромагнитную волну заряженная частица, которая покоится или движется прямолинейно и равномерно.'
  em-waves-t5:
    body: 'В зависимости от частоты электромагнитные волны можно разделить на несколько частей — так получается шкала электромагнитных волн.'
  em-waves-q5:
    explanation: 'За счёт изменения электрического поля возникает магнитное, за счёт магнитного — электрическое.'
  em-intensity-t3:
    body: 'Для ЭМВ: $I \sim \nu^4$, $I \sim A^2$, $I \sim \frac{1}{R^2}$, где R — расстояние от источника волны.'
  em-intensity-q5:
    hints: ['$I \sim \frac{1}{R^2}$, R — расстояние от источника.']

  # ───── Оптика ─────
  opt-refraction-t4:
    body: 'Закон преломления записывается для каждой границы, и произведения складываются в цепочку: $\sin\alpha\cdot n_1 = \sin\beta\cdot n_2 = \dots = \sin\varphi\cdot n_4$, то есть $\sin\alpha\cdot n = \text{const}$ и $\sin\alpha \sim \frac1n$: чем больше показатель преломления слоя, тем меньше угол луча в нём. На рисунке $\varphi > \gamma > \alpha > \beta$, поэтому $n_4 < n_3 < n_1 < n_2$.'
  opt-tir-t1:
    body: 'Процесс полного внутреннего отражения происходит в случае, когда луч света переходит из среды с бо́льшим показателем преломления в среду с меньшим и угол падения не меньше угла полного внутреннего отражения $\alpha_0$, $\sin\alpha_0 = \frac{n_2}{n_1}$.'
  opt-tir-q4:
    explanation: 'Полное внутреннее отражение происходит, когда луч переходит из среды с бо́льшим показателем в среду с меньшим (и угол падения не меньше $\alpha_0$).'
  lens-conv-t2:
    body: 'O — оптический центр; F — фокус; OF = F — фокусное расстояние; через фокусы проходят фокальные плоскости (пунктир); прямая через O и F — главная оптическая ось.'
  lens-div-t3:
    body: 'Для рассеивающей линзы $-\frac1F = \frac1d - \frac1f$; увеличение — та же формула $k = \frac Hh = \frac{|f|}{d}$. Здесь $F$ и $f$ подставляются как расстояния (положительные числа).'
  wave-nature-t1:
    body: 'Свет — это частица, которая распространяется волновым образом, и за счёт этого у света наблюдаются свойства волны.'
  wave-nature-t2:
    body: 'Корпускулярные (частичные) свойства света проявляются в эффектах: распространение света по прямой; возникновение геометрической тени; закон отражения света; закон преломления света; фотоэффект.'
  wave-nature-t4: { hide: true }
  wave-nature-q4:
    explanation: 'Фотоэффект — в списке корпускулярных (частичных) свойств света.'
  wave-interference-t4:
    body: 'Интенсивность пропорциональна квадрату амплитуды: $I \sim A^2$. Результирующая амплитуда $A_{{\text{рез}}}^2 = A_1^2 + A_2^2 + 2A_1A_2\cos\Delta\varphi$, результирующая интенсивность $I_{{\text{рез}}} = I_1 + I_2 + 2\sqrt{I_1I_2}\cos\Delta\varphi$.'
  wave-interference-f4:
    title: Результирующая амплитуда
    tex: 'A_{{\text{рез}}}^2 = A_1^2 + A_2^2 + 2A_1A_2\cos\Delta\varphi'
  wave-interference-t6: { hide: true }
  wave-interference-t8:
    title: Интерференционный минимум
  wave-diffraction-n1:
    body: 'Дифракция — способность света огибать препятствия: проходя через узкую щель или мимо препятствия, луч заходит в область геометрической тени.'
  wave-diffraction-n3:
    body: |-
      Дифракционная решётка — это пластина, где последовательно расположены препятствия и щели.
      - Период решётки: $d = a + b$, где a — ширина щели (прозрачной части), b — ширина препятствия (непрозрачной части).
      - Если на $l_0 = 1$ мм нанесено N штрихов, то $d = \frac{l_0}{N}$.
      - На рисунке подписано «λ → d»: длина волны λ должна быть сравнима с периодом решётки d.
  wave-diffraction-n4:
    title: Постоянная решётки
    body: 'Постоянная дифракционной решётки — это количество штрихов в каждом миллиметре.'
  wave-diffraction-n6:
    body: 'Так как $\frac{k\lambda}{d} = \sin\varphi \le 1$, наибольший номер максимума K — наибольшее целое число, меньшее $\frac d\lambda$; при нецелом $\frac d\lambda$ это $K = \left[\frac d\lambda\right]$ (целая часть числа). Всего на экране $N_{max} = 2\left[\frac d\lambda\right] + 1$ максимумов: по K с каждой стороны и центральный.'
  wave-diffraction-f8:
    tex: 'N_{max} = 2\left[\frac{d}{\lambda}\right] + 1'
  wave-dispersion-t6:
    body: 'Тонкая треугольная призма (с малым углом $\theta$ при вершине) отклоняет луч на угол $\delta = \theta(n - 1)$.'
  wave-dispersion-f2:
    title: Угол отклонения тонкой призмой

  # ───── Теория относительности, кванты ─────
  rel-effects-t1:
    body: 'Во всех формулах темы стоит множитель $\sqrt{1 - \frac{\upsilon^2}{c^2}}$. Его обозначают $\gamma$: $\gamma = \sqrt{1 - \frac{\upsilon^2}{c^2}}$; при $\upsilon \in [0; c)$ получается $\gamma \in (0; 1]$.'
  rel-effects-f2:
    title: Множитель γ
  rel-energy-t2:
    body: 'Формулы изменения энергии в разных процессах: $\Delta E = mgh$, $\Delta E = \frac{m\upsilon^2}{2}$, $\Delta E = cm\Delta t$, $\Delta E = \frac{k\Delta x^2}{2}$.'
  rel-energy-f6:
    title: Энергия пружины
    tex: '\Delta E = \frac{k\Delta x^2}{2}'
  q-photon-t2:
    body: '$E = h\nu$, где $\nu$ — частота, $h = 6{,}63\cdot10^{-34}$ Дж·с — постоянная Планка (в задачах — $6{,}62\cdot10^{-34}$). Так как $\nu = \frac c\lambda$, то $E = \frac{hc}{\lambda}$. Масса покоя фотона $m_0 = 0$, масса в движении $m = \frac{h\nu}{c^2} = \frac{h}{c\lambda}$. Импульс $p = \frac Ec = \frac{h\nu}{c} = \frac h\lambda$.'
  q-redline-t4:
    body: '$h\nu = h\nu_{\text{к}} + E_{\text{к}}$; через длины волн: $\frac{hc}{\lambda} = \frac{hc}{\lambda_{\text{к}}} + E_{\text{к}}$.'
  q-redline-f7:
    title: Уравнение через длины волн
    tex: '\frac{hc}{\lambda} = \frac{hc}{\lambda_{{\text{к}}}} + E_{{\text{к}}}'
  q-redline-t5:
    body: 'На рисунке фотоэлектрон вылетает и летит между пластинами «+» и «−». $h\nu = A + eU_{\text{т}}$, $\frac{m\upsilon^2}{2} = eU_{\text{т}}$; $U_{\text{т}}$ — тормозное (задерживающее) напряжение, e и m — заряд и масса электрона.'
  q-redline-f9:
    tex: '\frac{m\upsilon^2}{2} = eU_{{\text{т}}}'
  q-redline-q8:
    explanation: '$U_{\text{т}}$ — тормозное (задерживающее) напряжение.'

  # ───── Атом и ядро ─────
  at-rutherford-t1:
    body: 'Резерфорд предложил свою модель, опираясь на свой опыт. В своём опыте он направил пучок α-частиц на тонкую металлическую фольгу (золотую). Большинство частиц проходило почти без отклонения, и лишь очень немногие отклонялись на большие углы — под действием электрического поля маленького ядра.'
  at-rutherford-q5:
    hints: ['Вспомните блок «Что ещё показал опыт».']
  at-bohr-t2: { hide: true }
  nuc-composition-t2:
    body: |-
      - A — массовое число (количество нуклонов $N_p + N_n$); масса ядра приблизительно равна A а.е.м.
      - Z — количество зарядов; количество протонов; порядковый номер.
      - Число нейтронов: $N_n = A - Z$.
  nuc-isotopes-t1:
    body: |-
      - **Изотопы** — это ядра с одинаковым количеством протонов: $^1_1H$, $^2_1H$, $^3_1H$; $^{16}_8O$, $^{17}_8O$, $^{18}_8O$.
      - **Изобары** — это ядра с одинаковым количеством нуклонов: $^{59}_{27}Co$ и $^{59}_{28}Ni$.
      - **Изотоны** — это ядра с одинаковым количеством нейтронов: $^3_1H$ и $^4_2He$ (по 2 нейтрона).
  nuc-isotopes-t2:
    body: 'Заряд атома определяется разницей между числом протонов в ядре и числом электронов: $^{17}_8O$ с 8 электронами — $q = 0$; $^{12}_6C$ с 5 электронами — $q = +e$; $^{11}_5B$ с 7 электронами — $q = -2e$.'
  nuc-isotopes-q7:
    explanation: '$N_e = 5 + 2 = 7$.'
  nuc-binding-t3:
    body: 'Энергия связи — это энергия, необходимая для того, чтобы разделить ядро на отдельные нуклоны. Удельная энергия связи ε — энергия связи, приходящаяся в среднем на один нуклон: $\varepsilon = \frac{E_{{\text{связи}}}}{A}$ [эВ/нуклон].'
  rad-particles-t1:
    body: |-
      - $^1_1p$ — протон / $^1_1H$ — ядро водорода.
      - $^1_0n$ — нейтрон.
      - $^0_{-1}e^-$ — электрон / $^0_{-1}\beta^-$ — β⁻-частица.
      - $^0_{+1}e^+$ — позитрон / $^0_{+1}\beta^+$ — β⁺-частица.
      - $^4_2\alpha$ — α-частица / $^4_2He$ — ядро гелия.
      - $^0_0\gamma$ — γ-луч / электромагнитная волна.
      - $^2_1H$ — дейтрон / дейтерий.
      - $^3_1H$ — тритон / тритий.
  rad-reactions-t2:
    body: '$^{232}_{90}Th + ^1_0n \to ^{108}_{47}Ag + ^{73}_{32}Ge + ^1_1p + ^4_2\alpha + ^{47}_8X$ — учебное упражнение: неизвестное ядро найдено из законов сохранения: $232 + 1 = 108 + 73 + 1 + 4 + 47$ и $90 + 0 = 47 + 32 + 1 + 2 + 8$.'
  rad-decay-t1:
    body: 'Радиоактивность — это способность некоторых ядер к самопроизвольному распаду. Радиоактивное ядро распадается, выделяя частицы спонтанно, то есть без внешнего воздействия.'
  rad-decay-t2:
    body: |-
      - ① α-распад: $^A_ZX \to ^4_2\alpha + ^{A-4}_{Z-2}Y$ — элемент сдвигается в таблице Менделеева на 2 клетки к началу.
      - ② а) β⁻-распад: $^A_ZX \to ^0_{-1}e + ^A_{Z+1}Y + \tilde\nu$ ($\tilde\nu$ — антинейтрино) — сдвиг на 1 клетку к концу.
      - ② б) β⁺-распад: $^A_ZX \to ^0_{+1}e + ^A_{Z-1}Y + \nu$ (ν — нейтрино) — сдвиг на 1 клетку к началу.
      - ③ γ-распад: $^A_ZX^* \to ^A_ZX + ^0_0\gamma$ (звёздочка — возбуждённое ядро) — элемент остаётся на месте.
  rad-radiation-t1: { hide: true }

