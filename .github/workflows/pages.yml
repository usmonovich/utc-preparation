# Веб-версия приложения на GitHub Pages: https://usmonovich.github.io/utc-preparation/
# Собирается версия для студентов (npm run build:release): только утверждённые материалы, без админ-панели.
name: Сайт приложения (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Тесты
        run: npx tsx --test tests/unit/*.test.ts
      - name: Сборка версии для студентов
        run: npm run build:release
      - name: Без индексации Jekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
